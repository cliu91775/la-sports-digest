<style>
  :root{
    --bg:#0b0e14; --panel:rgba(255,255,255,.04); --panel2:rgba(255,255,255,.02);
    --line:rgba(255,255,255,.08); --fg:#edf2fa; --dim:#8a94a6;
    --radius:18px; --glow:0 0 0 1px rgba(255,255,255,.04), 0 24px 60px -30px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 500px at 20% -10%, rgba(42,111,216,.18), transparent 60%),
      radial-gradient(1000px 500px at 90% -10%, rgba(153,0,0,.14), transparent 60%),
      radial-gradient(900px 400px at 50% 110%, rgba(31,78,156,.16), transparent 60%),
      var(--bg);
    color:var(--fg); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
    padding:28px clamp(16px,4vw,64px) 64px;
  }
  header{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:26px}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{
    width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;
    background:linear-gradient(135deg,#2a6fd8,#991111);box-shadow:0 8px 30px -8px rgba(60,90,220,.6);
  }
  h1{font-size:clamp(22px,3vw,32px);font-weight:800;letter-spacing:-.02em}
  .sub{color:var(--dim);font-size:13px;margin-top:4px}
  .ticker{
    font-size:12px;color:var(--dim);padding:8px 14px;border-radius:99px;
    background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);
  }
  .ticker b{color:#7ce38b}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:20px}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;backdrop-filter:blur(14px);box-shadow:var(--glow);position:relative;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--team,#2a6fd8),transparent);
  }
  .top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .ico{
    width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;
    background:color-mix(in srgb,var(--team) 22%, transparent);
  }
  .name{font-size:18px;font-weight:800;letter-spacing:-.01em}
  .rec{font-size:11px;color:var(--team);font-weight:700;margin-top:2px}
  .hline{font-size:13px;line-height:1.5;color:var(--dim);padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);margin-bottom:16px}
  h3{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
  h3::after{content:"";flex:1;height:1px;background:var(--line)}
  .news{list-style:none}
  .news li{padding:10px 12px;border-radius:12px;margin-bottom:6px;background:var(--panel2);border:1px solid var(--line);transition:.2s}
  .news li:hover{border-color:color-mix(in srgb,var(--team) 50%, transparent);transform:translateX(3px)}
  .news a{color:var(--fg);text-decoration:none;font-weight:700;font-size:13px;display:block;margin-bottom:4px}
  .news a:hover{color:var(--team)}
  .news p{font-size:12px;color:var(--dim);line-height:1.5}
  .facts{list-style:none;display:grid;gap:6px}
  .facts li{position:relative;padding:2px 0 2px 18px;font-size:12.5px;color:var(--fg);line-height:1.55}
  .facts li::before{content:"⚡";position:absolute;left:0;top:2px;font-size:11px;filter:grayscale(.4)}
  .read{list-style:none;display:grid;gap:6px}
  .read a{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12.5px;color:var(--fg);text-decoration:none;padding:9px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
  .read a:hover{color:var(--team);border-color:color-mix(in srgb,var(--team) 50%, transparent)}
  .read .why{font-size:11px;color:var(--dim)}
  .oss{font-size:12.5px;line-height:1.6;color:var(--fg);background:linear-gradient(90deg,color-mix(in srgb,var(--team) 18%,transparent),transparent);border-left:3px solid var(--team);padding:10px 14px;border-radius:0 12px 12px 0;margin-top:16px}
  banner{display:block;text-align:center;color:var(--dim);font-size:13px;margin-top:22px}
  banner span{color:#7ce38b;animation:blink 1.5s infinite}
  @keyframes blink{50%{opacity:.3}}
  .spin{width:100%;height:100px;display:grid;place-items:center;color:var(--dim)}
  /* ---- digest ---- */
  .digest{
    background:linear-gradient(135deg,rgba(42,111,216,.12),rgba(153,0,0,.10),rgba(31,78,156,.12)),var(--panel);
    border:1px solid var(--line);border-radius:var(--radius);padding:26px;
    backdrop-filter:blur(14px);box-shadow:var(--glow);margin-bottom:22px;
  }
  .dhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;margin-bottom:14px}
  .dhead .t{display:flex;align-items:center;gap:12px}
  .mic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:linear-gradient(135deg,#2a6fd8,#991111)}
  .dhead h2{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .dhead .meta{color:var(--dim);font-size:12px;margin-top:3px}
  .langs{display:flex;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:4px}
  .langs button{border:0;background:transparent;color:var(--dim);font-size:12px;font-weight:700;padding:6px 16px;border-radius:99px;cursor:pointer;transition:.2s}
  .langs button.on{background:linear-gradient(135deg,#2a6fd8,#1f4e9c);color:#fff}
  .intro{font-size:14px;line-height:1.65;color:var(--fg);max-width:820px;margin-bottom:18px}
  .segs{display:grid;gap:12px}
  .seg{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--panel2)}
  .seg .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .seg .row .hn{font-weight:800;font-size:14.5px}
  .seg .badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--team,#2a6fd8) 20%,transparent);color:var(--team);white-space:nowrap}
  .seg p{font-size:12.5px;line-height:1.6;color:var(--dim);margin-top:6px}
  .seg p.cls{color:var(--fg)}
  .seg .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin-top:10px;font-weight:700}
  .closing{font-size:14px;line-height:1.6;border-top:1px dashed var(--line);margin-top:16px;padding-top:14px;color:var(--fg)}
</style>
</head>

const TEAMS_DATA = {"updated_at": "2026-08-28T03:07:16.373769+00:00", "teams": [{"name": "Dodgers", "sport": "MLB", "emoji": "Baseball", "accent": "#2A6FD8", "record": "80-53", "headline": "Glasnow returns sharp, but Dodgers stumble in Atlanta as Ohtani readies mound comeback", "latest_news": [{"title": "Chris Sale outduels Yoshinobu Yamamoto as Dodgers fall 1-0 in pitching classic", "summary": "The Dodgers were shut out 1-0 by the Braves in Atlanta on Wednesday night as Sale tossed a gem and continued to hoard a huge ERA lead in his NL Cy Young race. The loss was LA's second straight at Truist Park and shaved their lead for the first-round bye down to two games over the Braves.", "url": "https://dodgersbeat.com/"}, {"title": "Tyler Glasnow says his stuff is back after three months on IL", "summary": "Activated off the 60-day IL on Aug. 25, Glasnow made his return start in Atlanta, striking out seven over five innings before the bullpen gave the lead back. The righty, sidelined since early May with lower back spasms, said he feels healthy and is back to full velocity for the stretch run.", "url": "https://dodgersbeat.com/tyler-glasnow-healthy-dodgers-il-return/"}, {"title": "Shohei Ohtani could pitch for Dodgers next week after final live BP", "summary": "Ohtani threw 30 pitches in live batting practice on Aug. 22 and Roberts indicated another live BP likely follows, with a mound return before October expected. Ohtani last pitched July 3 and is 8-2 with a 1.79 ERA, but a knee injury has kept him as the everyday DH since.", "url": "https://www.mlbtraderumors.com/2026/08/dodgers-tyler-glasnow-to-return-on-tuesday.html"}, {"title": "Roki Sasaki placed on injured list after blister issue in Atlanta", "summary": "Sasaki exited early in Wednesday's loss when skin 'ripped off' his hand, prompting an IL move and raising questions about his late-season and postseason role. Roberts addressed possible roster moves amid the rotation reshuffle that also includes Glasnow's return  Rumors)", "why": "Details on Glasnow's rehab numbers, Ohtani's live BP progress, Díaz losing the closer job, and Wrobleski moving to a relief role.", "url": "https://www.mlbtraderumors.com/2026/08/dodgers-tyler-glasnow-to-return-on-tuesday.html"}, {"title": "Dodgers, Braves series could determine seeding in 2026 playoffs (MLB.com)", "why": "Preview of the two NL division leaders clashing with the first-round bye and top NL seed at stake.", "url": "https://www.mlb.com/dodgers/news/dodgers-braves-series-preview-august-2026"}, {"title": "2026 MLB Standings — NL West (MLB.com)", "why": "Current NL West standings confirming the Dodgers' 8.5-game lead over San Diego.", "url": "https://www.mlb.com/standings/2026"}, {"title": "Dodgers News Today & Latest Updates (DodgersBeat)", "why": "Credentialed beat coverage of the Roki Sasaki IL move, Chris Sale vs. Yamamoto, and Glasnow's return from Dodger Stadium.", "url": "https://dodgersbeat.com/dodgers-news-today/"}], "one_sentence": "The NL West-leading Dodgers (80-53) welcomed Tyler Glasnow back with a sharp five-inning start and await Shohei Ohtani's mound return, but a 1-0 loss to Chris Sale in Atlanta trimmed their first-round bye cushion to two games."}, {"name": "USC Trojans", "sport": "College Football", "emoji": "Football", "accent": "#9E1B32", "record": "0-0", "headline": "No. 14 USC opens 2026 campaign Saturday at the Coliseum vs. San José State on NBC", "latest_news": [{"title": "USC loses DL Jahkeem Stewart for at least season opener", "summary": "Freshman All-American Jahkeem Stewart went down with a foot injury in training camp. Coach Lincoln Riley confirmed Tuesday that the sophomore will miss the opener vs. San Jose State but could return as soon as Sept. 4 vs. Fresno State.", "url": "https://nypost.com/2026/08/26/sports/usc-loses-key-defensive-star-for-at-least-1-game-on-eve-of-opener/"}, {"title": "Lincoln Riley excited but not anxious for pivotal fifth season opener", "summary": "Riley enters his fifth year at the helm with high expectations, telling reporters he's eager to see the team compete together for the first time against an opponent. Running back King Miller expressed calm confidence heading into Saturday.", "url": "https://247sports.com/college/usc/article/lincoln-riley-usc-players-excited-season-opener-289199647/"}, {"title": "Tobias Raymond moves to center; Hayden Treter favored at guard", "summary": "With Kilian O'Connor lost for the season, Riley confirmed on Trojans Live that Raymond will start at center. Treter, a redshirt sophomore, is the frontrunner to fill the open guard spot.", "url": "https://trojanswire.usatoday.com/story/sports/college/trojans/football/2026/08/25/usc-football-depth-chart-tobias-raymond-start-center/91452504007/"}, {"title": "USC's freshman receivers ready for big roles", "summary": "Ethan 'Boobie' Feaster, Trent Mosley, Kayden Dixon-Wyatt, and Mark Bowman headline a loaded true freshman class that Lincoln Riley says will get 'plenty of run' in the opener. Feaster was a reclassified four-star out of DeSoto High.", "url": "https://trojanswire.usatoday.com/story/sports/college/trojans/football/2026/08/25/usc-football-offense-trust-young-players-2026/91282523007/"}, {"title": "Jayden Maiava named to Manning Award Watch List", "summary": "The redshirt senior quarterback, who led the nation with a 91.2 QBR and threw for 3,711 yards in 2025, enters his third year under Riley with 31 career starts and is a Heisman dark horse in 2026.", "url": "https://usctrojans.com/news/2026/8/25/usc-trojans-football-game-preview-notes-san-jose-state-spartans-nbc-sports-jayden-maiava-lincoln-riley"}, {"title": "Gary Patterson hired as defensive coordinator", "summary": "The College Football Hall of Famer and former TCU head coach was brought in to fix USC's defense. Analyst JD Pickell called the hire a 'massive game-changer' for Riley's CFP hopes in year five.", "url": "https://www.si.com/college/usc/football/usc-trojans-season-preview-national-analyst-jd-pickell"}], "fun_facts": ["Lincoln Riley is 9-0 in season openers as USC's head coach.", "USC was the only team in the country to return all five starting offensive linemen entering 2026 — until O'Connor's season-ending injury.", "Jayden Maiava has 31 career starts and holds the nation's highest QBR (91.2) among returning quarterbacks.", "USC signed the unanimous No. 1 recruiting class in the nation for 2026.", "USC's previous six meetings with San José State are all victories — the Spartans have never won at the Coliseum."], "further_reading": [{"title": "USC's 5 defensive playmakers who could fuel CFP run", "why": "Deep dive into the talent on a rebuilt defense under new DC Gary Patterson.", "url": "https://nypost.com/2026/08/26/sports/uscs-5-defensive-playmakers-who-could-fuel-cfp-run/"}, {"title": "Times of Troy: Best-case scenario includes fleet of star freshmen", "why": "LA Times' Ryan Kartje projects what a breakout season could look like if everything clicks for Riley's squad.", "url": "https://www.latimes.com/sports/usc/newsletter/2026-08-24/usc-football-freshmen"}, {"title": "2026 Game Day Enhancements at the Coliseum", "why": "New in-stadium host, pregame fireworks, drone shows, and overhauled fan experience for the 2026 home slate.", "url": "https://usctrojans.com/news/2026/8/26/2026-usc-football-game-day-enhancements"}, {"title": "Season Preview with National Analyst JD Pickell", "why": "On3 analyst predicts 10-2 for USC and breaks down the schedule's make-or-break road games at Penn State and Indiana.", "url": "https://www.si.com/college/usc/football/usc-trojans-season-preview-national-analyst-jd-pickell"}], "one_sentence": "No. 14 USC kicks off Lincoln Riley's pivotal fifth season Saturday at the Coliseum, featuring Heisman hopeful Jayden Maiava and the nation's top recruiting class — but must overcome early injuries on both sides of the ball."}, {"name": "Rams", "sport": "NFL", "emoji": "Helmet", "accent": "#003594", "record": "0-0 (preseason 2-0)", "headline": "Rams re-acquire WR Tutu Atwell, shipping RB Jarquez Hunter to Miami hours before close of preseason", "latest_news": [{"title": "Rams acquire Tutu Atwell in surprise trade with Dolphins", "summary": "The Rams traded running back Jarquez Hunter to Miami to bring back receiver Tutu Atwell, who left in free agency this offseason after signing a one-year, $1.4 million deal with the Dolphins in March. Atwell, LA's 2021 second-round pick and Super Bowl LVI champion, gives the Rams clarity at WR3 behind Puka Nacua and Davante Adams.", "url": "https://theramswire.usatoday.com/story/sports/nfl/rams/2026/08/27/rams-dolphins-tutu-atwell-jarquez-hunter-trade/91494612007/"}, {"title": "McVay: Rams will carry 3 QBs on initial 53-man roster", "summary": "Sean McVay confirmed the Rams will keep three quarterbacks (Matthew Stafford, Stetson Bennett IV, Ty Simpson) on the initial roster, but said the backup in Australia and rep allocation in Thursday's preseason finale against the Chargers remain undecided, with undrafted QB Matthew Caldwell also in the mix for snaps.", "url": "https://www.therams.com/news/head-coach-sean-mcvay-rams-3-qbs-initial-53-man-roster-2026-quarterbacks-matthew-stafford-stetson-bennett-ty-simpson-matthew-caldwell"}, {"title": "Rams confident in QBs Bennett, Simpson despite 'up-and-down days'", "summary": "Either Bennett or Simpson will back up MVP Matthew Stafford, and McVay says he feels 'really good' about both. Bennett answered with an 'incredible' fourth-down throw and two rushing touchdowns in the 34-0 preseason win over the Saints, while rookie first-rounder Simpson has shown smooth operation through progressions.", "url": "https://theramswire.usatoday.com/story/sports/nfl/rams/2026/08/26/rams-stetson-bennett-ty-simpson-backup-quarterback-sean-mcvay/91475749007/"}, {"title": "Rams' Sean McVay focused on getting Myles Garrett ready for Week 1", "summary": "Reigning NFL Defensive Player of the Year Myles Garrett has not practiced since training camp due to knee swelling, and McVay is vague on specifics, saying only the goal is to get him 'ready to roll for Australia.' With the opener in Australia fast approaching, the Rams are erring on the side of caution with their best defender.", "url": "https://theramswire.usatoday.com/story/sports/nfl/rams/2026/08/26/rams-myles-garrett-injury-update-sean-mcvay/91479161007/"}, {"title": "Why the Next Week Is Critical for Aaron Donald's Rams Return", "summary": "Donald, who has worked out at the team facility for two months, has yet to decide on a comeback as roster-cut day approaches. McVay confirmed the Rams have built 53-man rosters with and without him, while contract structure (roughly $30 million still owed) remains a complication with only ~$15 million in cap space.", "url": "https://www.si.com/nfl/rams/onsi/aaron-donald-potential-rams-return-timeline"}, {"title": "LA Rams Get Positive Puka Nacua Sign as Week 1 Nears", "summary": "All-Pro receiver Puka Nacua (psoas soreness, sidelined since an Aug. 11 joint practice with the Cowboys) returned to the field for side workouts with the training staff, a step forward after the absence stretched past initial expectations. The Rams remain cautious with Week 1 vs. the 49ers in view.", "url": "https://heavy.com/sports/nfl/los-angeles-rams/rams-puka-nacua-injury-update-side-work/"}], "fun_facts": ["Stetson Bennett ran for two touchdowns and led four scoring drives in the Rams' 34-0 preseason rout of the Saints, reinforcing his case to back up Matthew Stafford.", "Safety Alex Cook returned a red-zone interception 100 yards for a touchdown in that same Saints game, keying a shutout defense that also forced a Bailey forced-fumble recovery.", "The Rams rested virtually every key player for the entire preseason, continuing McVay's decade-long tradition of keeping starters fresh into the regular season.", "Tutu Atwell was drafted 57th overall by the Rams in 2021 and won Super Bowl LVI as a rookie before spending the summer with Miami and now returning to LA.", "The Rams open the 2026 regular season in Australia against the NFC West rival San Francisco 49ers."], "further_reading": [{"title": "Who will back up Matthew Stafford? Rams' QB2 race comes down to Chargers finale", "why": "Gary Klein of the LA Times lays out the closing stretch of the Bennett-Simpson backup competition heading into the preseason finale.", "url": "https://www.latimes.com/sports/rams/story/2026-08-26/rams-backup-quarterback-competition-concludes-thursday-vs-chargers"}, {"title": "Rams not looking to rush WR Puka Nacua, DE Myles Garrett back to practice", "why": "ESPN's Sarah Barshop on McVay's 'return to performance, not just return to play' approach with the Rams' two biggest stars.", "url": "https://www.espn.com/nfl/story/_/id/49641695/rams-not-looking-rush-wr-puka-nacua-de-myles-garrett-back-practice"}, {"title": "Stetson Bennett surges in Rams' 34-0 preseason win over Saints", "why": "AP News recap of Bennett's breakout night and the Rams' dominant defensive performance at SoFi Stadium.", "url": "https://apnews.com/article/rams-saints-score-3994874dd0474b72e27e504ba17f1e73"}, {"title": "First Look: Rams close out 2026 preseason against Chargers", "why": "The Rams' official site previews the QB usage storylines for Thursday night's SoFi Stadium preseason finale.", "url": "https://www.therams.com/news/first-look-rams-close-out-2026-preseason-against-chargers"}, {"title": "Sean McVay, Rams ready to go with or without Aaron Donald", "why": "Turf Show Times rounds up McVay's contingency planning and how the 53-man roster is built both ways.", "url": "https://www.turfshowtimes.com/los-angeles-rams-news/147052/rams-mcvay-donald-bennett-simpson-bailey"}], "one_sentence": "The Rams head into Thursday's preseason finale against the Chargers with QB depth set at three, a trade to reacquire Tutu Atwell, and cautious recovery plans for Myles Garrett and Puka Nacua before the season opener in Australia."}]};
const DIGEST_DATA = {"updated_at": "2026-08-27T20:04:43-07:00", "title": "LA Sports Daily Digest — 15-Minute Edition", "read_time": "~15 minutes", "intro": "Wednesday brought one of those days where every LA franchise had something urgent on its plate. The Dodgers got swept into a pitchers' duel in Atlanta and watched their bye cushion evaporate; USC is bracing for kickoff with a training-camp casualty list growing by the day; and the Rams are scrambling to get their stars healthy before a Week 1 flight to Australia. Let's get into it.", "intro_zh": "週三對所有 LA 球隊來說都是忙碌的一天。道奇在亞特蘭大遭遇投手大戰、首輪輪空優勢縮小；南加大在訓練營傷兵名單持續增長的情況下準備迎來開幕戰；公羊則在飛往澳洲的 Week 1 前緊急讓主力傷兵復出。以下為您整理今日重點。", "segments": [{"team": "Dodgers", "accent": "#2A6FD8", "headline": "Glasnow's Sharp Return Can't Offset 1-0 Shutout Loss in Atlanta; Ohtani Nears Mound Comeback", "headline_zh": "Glasnow 回歸投球犀利，道奇仍以 0-1 遭亞特蘭大完封；Ohtani 投手復出在即", "analysis": "Tyler Glasnow made his first start since May 6 on Wednesday night in Atlanta, and by most accounts it was a success. The right-hander struck out seven over five innings, sat 97-99 mph on the gun, and said afterward that his stuff is fully back after three months on the injured list dealing with lower back spasms. For a Dodgers rotation that has been patchwork for much of the season, Glasnow's return at full velocity is the single most important development of the final month.\n\nThe problem was that he ran into Chris Sale, who was even better. Sale tossed a gem to hand LA a 1-0 loss — their second straight at Truist Park — and padded his NL-best ERA to 2.20 in what is rapidly becoming a runaway Cy Young campaign. Yoshinobu Yamamoto took the hard-luck loss, but the bigger story is what the defeat means in the standings: the Dodgers' lead for the NL's first-round bye is now just two games over the Braves, who are surging with their own ace dealing.\n\nMeanwhile, Shohei Ohtani is on the verge of returning to the mound. He threw 30 pitches in live batting practice on Aug. 22, and Dave Roberts indicated another live session is likely before a game appearance before October. Ohtani's pitching line — 8-2, 1.79 ERA, 95 K in 85⅔ innings — is Cy Young caliber, and his reintegration would transform a rotation that has been operating without its best arm since early July.\n\nBut the news isn't all positive. Roki Sasaki was placed on the injured list after a blister issue forced him out of Wednesday's game early, with skin reportedly 'ripping off' his pitching hand. The young phenom's late-season and postseason role is now in question. On top of that, Edwin Díaz is losing the closer job as he works back from neck inflammation — Roberts said the plan is to rebuild the veteran's confidence in lower-leverage spots before reassessing.\n\nThe silver lining: Will Smith is closing in on a return. The All-Star catcher began a rehab assignment at Triple-A Oklahoma City this week after missing time since June 5 with an inflamed neck disc, and Roberts said he could be back during the first week of September. The Dodgers still lead the NL West by 8.5 games, but the margin for error in the race for the bye is tightening, and the pitching staff's shape heading into October is anything but settled.\n\nAll of this makes the remaining schedule critical. LA needs Glasnow to stay healthy, Ohtani to get back on the mound, and someone — whether it's Daniel Hudson, Alex Vesia, or someone else — to lock down the ninth inning. The talent is there. The margin for error is not.", "analysis_zh": "Tyler Glasnow 週三晚在亞特蘭大迎來自 5 月 6 日以來的首次先發，整體表現令人滿意。這位右投手在 5 局投球中飆出 7 次三振，球速回到 97-99 英里，賽後也表示在下背部痙攣缺陣三個月後，他的球質已完全恢復。對整季都在拼湊先發輪值的道奇而言，Glasnow 以全速狀態回歸是下半季最重要的發展。\n\n然而他碰上了表現更優的 Chris Sale。Sale 投出一場精彩完投，讓道奇以 0-1 遭完封——這也是他們在 Truist Park 的第二場連敗——Sale 的 ERA 進一步降至聯盟最低的 2.20，在今年國聯賽揚獎競爭中遙遙領先。Yamamoto 拿到一場硬運氣的敗投，但更大的問題在於這場失利對戰績的影響：道奇在國聯首輪輪空的領先優勢已縮小至僅兩場，勇士隊正氣勢如虹。\n\n同時，Shohei Ohtani 投手復出近在眼前。他在 8 月 22 日進行了 30 球的實戰投打練習，Dave Roberts 表示在十月前很可能再安排一次實戰 BP 後便會重返投手丘。Ohtani 本季投球成績亮眼——8 勝 2 敗、ERA 1.79、85⅔ 局送出 95 次三振——堪稱賽揚獎級別，若能順利回歸，將徹底改變這支自七月初就缺少王牌的輪值。\n\n但壞消息也不少。Roki Sasaki 因手部水泡問題被迫提前退場，隨後被放入傷兵名單。報導指出他的手部皮膚「撕裂」，這位年輕投手的下半季和季後賽角色都因此存疑。此外，Edwin Díaz 也將失去終結者位置，他正在從頸部發炎中復出，Roberts 表示計畫是先在較低壓力的場景中重建他的信心，再評估是否回到關門角色。\n\n好消息是 Will Smith 即將復出。這位全明星捕手本週在 3A 開始復健出賽，自 6 月 5 日因頸椎間盤發炎缺陣至今，Roberts 表示他可能在九月第一週回歸。道奇目前在國聯西區仍領先 8.5 場，但首輪輪空的容錯空間正在縮小，而投手陣容在十月前的最終樣貌仍是未知數。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Sale vs. Yamamoto: The Pitching Duel That Defined the NL Cy Young Race", "headline_zh": "Sale 對決 Yamamoto：定調國聯賽揚獎之戰的投手大戰", "analysis": "If you tuned into Wednesday's Dodgers-Braves game hoping for fireworks, you got something better: a masterclass in pitching. Chris Sale and Yoshinobu Yamamoto traded zeros for most of the night in a game that felt more like a postseason matchup than a late-August regular-season contest. Sale came out on top, but both arms showed why they belong in the Cy Young conversation.\n\nSale was surgical from the first pitch, attacking the zone with a devastating slider that had Dodgers hitters off-balance all night. He scattered four hits over seven shutout innings, striking out eight while walking just one. It was the kind of outing that reminded everyone why the Braves traded for him — and why, at 37 years old, he might be having the best season of a Hall-of-Fame-caliber career.\n\nYamamoto, for his part, was nearly as good. The Japanese right-hander allowed just one run on five hits over six innings, with the lone blemish coming on a sacrifice fly in the fourth. He struck out six and walked two, showing the kind of composure that has defined his first full MLB season. But in a game decided by a single run, 'nearly as good' isn't good enough.\n\nThe loss dropped the Dodgers to 80-53 and, more importantly, shaved their lead for the NL's first-round bye to just two games over the surging Braves. With Sale pitching like this and Atlanta's lineup getting healthier, the margin for error is razor-thin. The Dodgers need Yamamoto — and the rest of the rotation — to match Sale's level if they want to hold onto that bye.\n\nWhat makes this duel significant beyond the standings is what it tells us about October. If these two teams meet in the postseason, matchups like Wednesday's will define the series. The Dodgers have the deeper lineup and the better bullpen on paper, but Sale has shown he can shut down even the most potent offenses. It's a chess match that could go either way — and one that LA will want to prepare for aggressively over the final month.", "analysis_zh": "週三道奇對勇士的比賽或許沒有火力全開的打擊戰，但呈現了一場更精彩的東西：一場投手大師級別的較量。Chris Sale 與 Yoshinobu Yamamoto 整晚互飆零分，比賽氛圍更像季後賽而非八月下旬的例行賽。Sale 獲勝，但兩位投手都展現了賽揚獎等級的實力。\n\nSale 從第一球就展現统治力，他的滑球讓道奇打者整晚找不到節奏。他在 7 局投球中僅被敲出 4 支安打，送出 8 次三振、僅 1 次保送。這場先發讓人想起勇士隊為何交易他，以及為何這位 37 歲的老將可能正迎來名人堂等級職業生涯中最出色的一季。\n\nYamamoto 的表現同樣出色。這位日本右投在 6 局中僅被敲出 5 支安打失 1 分，唯一失分來自第四局的高飛犧牲打。他送出 6 次三振、2 次保送，展現了他在首個完整大聯盟賽季中一貫的沉著。但在一場僅差一分的比賽中，「幾乎一樣好」並不夠。\n\n這場敗仗讓道奇戰績來到 80 勝 53 敗，更重要的是，他們在國聯首輪輪空的領先優勢縮小至僅兩場，而勇士正氣勢高昂。在 Sale 如此投球、勇士打線日益健康的情況下，道奇的容錯空間已非常狹窄。如果想保住輪空資格，他們需要 Yamamoto 和其他先發投手都達到 Sale 的水準。\n\n這場投手對決的意義超越了戰績排名，更揭示了季後賽的走向。如果兩隊在季後賽相遇，類似週三這樣的對決將決定系列賽的走向。道奇在紙面上擁有更深的打線和更強的牛棚，但 Sale 已證明他能壓制最具攻擊力的打線。這場戰術博弈勝負難料，道奇必須在最後一個月做好充分準備。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Ohtani's Mound Return Is Coming — But How Do the Dodgers Manage the Reintegration?", "headline_zh": "Ohtani 投手復出在即——道奇如何管理他的整合？", "analysis": "Shohei Ohtani hasn't pitched in a game since July 3, when he was shut down due to a knee issue that has since limited him to designated hitter duties. But that's about to change. After throwing 30 pitches in live batting practice on Aug. 22, Dave Roberts confirmed that another live session is likely before Ohtani returns to the mound before October. The question isn't whether he'll pitch — it's how the Dodgers manage his reintroduction.\n\nOhtani's numbers when he was pitching were absurd: 8-2 with a 1.79 ERA and 95 strikeouts in 85⅔ innings. He was arguably the best pitcher in baseball, not just the best two-way player. But three months off the mound is a long time, and even with live BP sessions, there's a difference between pitching in a controlled environment and facing a big-league lineup with the game on the line.\n\nThe Dodgers will almost certainly ramp Ohtani up carefully. Expect a limited pitch count in his first start back — probably 60-70 pitches — with an emphasis on building arm strength rather than pitching deep into games. The goal isn't to win a Cy Young Award in September; it's to have Ohtani healthy and effective in October, when the games matter most.\n\nThere's also the question of how Ohtani's return affects the rest of the rotation. With Glasnow back, Yamamoto dealing, and the bullpen reshuffling with Díaz in a new role, Ohtani's reintegration adds another layer of complexity. Roberts will need to manage workloads carefully, particularly for a pitcher coming off a knee injury who is also serving as the everyday DH.\n\nThe bigger picture is that Ohtani's return to the mound could be the move that puts the Dodgers over the top. They have the talent to win the World Series with their current roster, but adding a healthy Ohtani to the rotation transforms them from a very good team into a potentially dominant one. The challenge is getting him there without any setbacks — and that's a balancing act that will define the next month of Dodgers baseball.", "analysis_zh": "Shohei Ohtani 自 7 月 3 日因膝傷被拉下投手丘後就未再登板，此后一直以指定打擊身份出賽。但這一切即將改變。他在 8 月 22 日進行了 30 球的實戰投打練習，Dave Roberts 確認很可能再安排一次實戰 BP，讓 Ohtani 在十月前重返投手丘。問題不在於他是否會投球，而在於道奇如何管理他的回歸整合。\n\nOhtani 在投球時的數據極為出色：8 勝 2 敗、ERA 1.79、85⅔ 局送出 95 次三振。他不只是最好的二刀流球員，更是全聯盟最好的投手之一。但離開投手丘三個月是很長的時間，即使有實戰 BP，在受控環境中投球和在大聯盟比賽壓力下對決打者仍有明顯差異。\n\n道奇幾乎肯定會謹慎地增加 Ohtani 的投球量。預計他的首次回歸先發的投球數會受到限制——大約 60-70 球——重點在於逐步建立手臂力量，而非投長局數。目標不是在九月贏得賽揚獎，而是讓 Ohtani 在十月關鍵時刻保持健康且有競爭力。\n\nOhtani 回歸投手丘對輪值其餘成員的影響也是一大課題。隨著 Glasnow 回歸、Yamamoto 穩定表現、以及 Díaz 轉換角色後牛棚正在重組，Ohtani 的整合又增加了一層複雜性。Roberts 需要精細管理投球量，特別是這位從膝傷復出同時還擔任每日 DH 的投手。\n\n更大的格局是，Ohtani 回到投手丘可能是讓道奇問鼎冠軍的關鍵一擊。他們目前的陣容已經有贏得世界大賽的實力，但加入健康的 Ohtani 到輪值中，將使他們從一支非常好的球隊轉變為一支可能具有統治力的球隊。挑戰在於如何避免任何反覆——而這個平衡將定義道奇接下來一個月的走向。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Bullpen in Flux: Díaz Loses Closer Job, Sasaki Hits IL, and the Search for a Ninth-Inning Answer Continues", "headline_zh": "牛棚動盪：Díaz 丟掉終結者、Sasaki 進傷兵名單，第九局答案仍在尋找中", "analysis": "If there's one area that could derail the Dodgers' October plans, it's the bullpen — and specifically, the ninth inning. Edwin Díaz, who was brought in to be the closer, is losing that role after blowing three of five save chances following his return from elbow surgery. Dave Roberts said the plan is to rebuild Díaz's confidence in lower-leverage situations before reassessing, but the reality is that LA doesn't currently have a proven, reliable closer.\n\nDíaz's struggles are understandable — he's still working his way back from a major elbow procedure — but the timing is terrible. The Dodgers are in a tight race for the NL's first-round bye, and they need someone to lock down wins in the late innings. The candidates include Alex Vesia, who has been excellent in a setup role, and Daniel Hudson, who has closing experience but has been inconsistent this season.\n\nThe situation got worse on Wednesday when Roki Sasaki was placed on the injured list after a blister issue forced him out of the game. The young phenom's hand reportedly had skin 'rip off,' which is a painful and potentially lingering issue for a pitcher who relies on grip and command. Roberts said he's evaluating roster moves to address the rotation and bullpen, but losing Sasaki — even temporarily — thins an already stretched staff.\n\nWhat makes this particularly concerning is the timing. The Dodgers are heading into the final month of the regular season with their postseason rotation taking shape, and they need every arm they can get. Glasnow's return helps, but the bullpen remains the biggest question mark on the roster. Roberts has spent the season mixing and matching, using a committee approach when needed, but that's not a sustainable strategy in October.\n\nThe good news is that the Dodgers have the talent to figure this out. They have arms in the minors who could step up, and the return of healthy players could reshape the bullpen hierarchy. But the clock is ticking, and the margin for error — already thin in the bye race — is getting thinner with every blown save and IL stint. This is the story to watch over the next four weeks.", "analysis_zh": "如果說有一個領域可能打亂道奇的十月計畫，那就是牛棚——特別是第九局。Edwin Díaz 本來被引進擔任終結者，但他在從手肘手術復出後，5 次救援機會中搞砸了 3 次，如今失去了這個角色。Dave Roberts 表示計畫是在較低壓力的場景中重建 Díaz 的信心，再重新評估，但現實是道奇目前沒有一位 proven、可靠的終結者。\n\nDíaz 的掙扎可以理解——他仍從重大手肘手術中恢復——但時間點非常糟糕。道奇正在爭奪國聯首輪輪空，他們需要有人在比賽後段鎖住勝利。候選人包括在 setup role 中表現優異的 Alex Vesia，以及擁有終結經驗但本季表現不穩定的 Daniel Hudson。\n\n週三的情況雪上加霜：Roki Sasaki 因水泡問題被迫退場後被放入傷兵名單。據報導他的手部皮膚「撕裂」，這對一位依賴握球和控球的投手來說是痛苦且可能影響深遠的問題。Roberts 表示正在評估 roster 動作來補強先發和牛棚，但失去 Sasaki——即使只是暫時——也讓已經捉襟見肘的投手陣容更加薄弱。\n\n最令人擔憂的是時間點。道奇正進入例行賽最後一個月，季後賽輪值正在成型，他們需要每一條手臂都能上場。Glasnow 的回歸有幫助，但牛棚仍然是 roster 上最大的問號。Roberts 整季都在採用委員會方式輪替，必要時混合使用不同的投手，但這種策略在季後賽中並不可持續。\n\n好消息是道奇有天賦來解決這個問題。小聯盟中有投手可以挺身而出，而傷兵的回歸也可能重塑牛棚的層級結構。但時鐘在滴答作響，在輪空之爭中已經很狹窄的容錯空間，隨著每一次救援失敗和傷兵名單異動而持續縮小。這是接下來四週最值得關注的戰線。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Will Smith's Rehab Assignment Signals a September Boost for the Dodgers' Lineup", "headline_zh": "Will Smith 開始復健出賽，道奇打線九月將獲增援", "analysis": "Lost in the pitching drama of the past week is a quietly significant development: Will Smith is closing in on a return. The All-Star catcher began a rehab assignment at Triple-A Oklahoma City this week after being sidelined since June 5 with an inflamed neck disc. Dave Roberts said Smith could return during the first week of September, which would be a massive boost for a Dodgers lineup that has been without its starting catcher for nearly three months.\n\nSmith's absence has been felt in more than just his bat. He's one of the best pitch-framers in baseball, and his ability to manage a pitching staff is invaluable — particularly with the rotation in flux. Austin Barnes and the catchers who filled in did admirable work, but none of them bring the complete package that Smith provides.\n\nThe timing of Smith's return is critical. The Dodgers are entering the final stretch of the regular season, with a tight race for the NL's first-round bye and the potential for a postseason matchup against the Braves. Having Smith back behind the plate — and in the middle of the lineup — could be the difference between a good team and a great one.\n\nThere's also the question of how Smith's return affects the roster construction. With the Dodgers likely to carry a expanded September roster, there's room for everyone, but the catching depth chart will tighten up. Smith is the starter, period, and his return will allow the Dodgers to use their other catchers in more strategic, matchup-based roles.\n\nAll told, Smith's rehab assignment is the kind of move that flies under the radar but could have enormous implications for October. The Dodgers have the talent to win it all, but they need their best players on the field. Smith's return — along with Glasnow's and eventually Ohtani's — could be the trifecta that puts LA over the top.", "analysis_zh": "在過去一週的投手戲劇性事件中，有一個意義重大的發展容易被忽視：Will Smith 即將復出。這位全明星捕手因頸椎間盤發炎自 6 月 5 日缺陣至今，本週在 3A 開始了復健出賽。Dave Roberts 表示 Smith 可能在九月第一週回歸，這將為缺少主力捕手近三個月的道奇打線帶來巨大的助力。\n\nSmith 缺陣的影響不僅體現在打擊上。他是全聯盟最好的本壘板 framing 捕手之一，而他管理投手群的能力更是無價——特別是在輪值正在重組的時期。Austin Barnes 和頂替的捕手們做出了值得肯定的表現，但沒有人能提供 Smith 的全面性。\n\nSmith 回歸的時間點至關重要。道奇正進入例行賽最後衝刺階段，國聯首輪輪空之爭激烈，季後賽也可能對決勇士。讓 Smith 回到本壘板後方——並回到打線中段——可能是一支好球隊和一支偉大球隊之間的差別。\n\n此外，Smith 的回歸對 roster 構建的影響也值得關注。道奇 likely 將攜帶擴充的九月 roster，有足夠空間容納所有人，但捕手 depth chart 將會收緊。Smith 是不動的先發捕手，他的回歸將允許道奇以更策略性、 matchups-based 的方式使用其他捕手。\n\n總結來說，Smith 的復健出賽是那種容易被忽視但對十月可能產生巨大影響的動作。道奇有天賦贏得一切，但他们需要最好的球員在場上。Smith 的回歸——加上 Glasnow 和最終 Ohtani 的回歸——可能是讓道奇問鼎冠軍的三重奏。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "No. 14 USC Opens Riley's Pivotal Year Five on Saturday; Maiava Leads Heisman Campaign", "headline_zh": "No. 14 南加大週六迎來 Riley 關鍵第五年開幕戰；Maiava 展開海斯曼之旅", "analysis": "The wait is over. No. 14 USC kicks off the 2026 season Saturday at the Coliseum against San José State on NBC, and the stakes couldn't be higher for head coach Lincoln Riley. This is year five — the year where the recruiting classes are fully his, the system is established, and the expectation is not just to compete for a Big Ten title but to make a serious College Football Playoff run. Anything less than a 10-win season will feel like a disappointment.\n\nLeading the charge is Jayden Maiava, the redshirt senior quarterback who has quietly become one of the most accomplished players in the country. Maiava led the nation with a 91.2 QBR in 2025, threw for 3,711 yards, and enters his third year under Riley with 31 career starts. He was named to the Manning Award Watch List this week, and while he's not the betting favorite for the Heisman, he's firmly in the dark-horse conversation.\n\nThe offensive line should be a strength, at least in theory. USC was the only team in the country returning all five starting offensive linemen entering 2026 — until Kilian O'Connor's season-ending injury forced a reshuffle. Tobias Raymond is moving to center, and Hayden Treter is the frontrunner at guard, but the loss of O'Connor is a significant blow to a unit that was supposed to be the backbone of the offense.\n\nThe receiving corps, meanwhile, is about to get a youth infusion. Lincoln Riley said the true freshman receivers — headlined by Ethan 'Boobie' Feaster, Trent Mosley, Kayden Dixon-Wyatt, and Mark Bowman — will get 'plenty of run' in the opener. USC signed the unanimous No. 1 recruiting class in the nation for 2026, and Saturday will be the first chance to see those freshmen in live action.\n\nDefensively, the big story is the addition of Gary Patterson as defensive coordinator. The College Football Hall of Famer and former TCU head coach was brought in to fix a unit that was a liability last season. Analyst JD Pickell called the hire a 'massive game-changer' for Riley's CFP hopes, and Patterson's track record of developing elite defenses makes him the ideal candidate to turn things around.\n\nThe bottom line: USC has the talent, the coaching, and the schedule to make a run. The question is whether everything comes together quickly enough. The Coliseum will be rocking Saturday, and for Riley, it's the start of a season that could define his legacy at USC.", "analysis_zh": "等待終於結束。No. 14 南加大將於週六在洛杉磯紀念體育場迎來 2026 賽季開幕戰，對手是聖荷西州立大學，比賽由 NBC 轉播。對主教練 Lincoln Riley 來說，這場比賽的意義再重大不過。這是他的第五年——招募班底完全是他的人、體系已經建立、期望不僅是爭奪 Big Ten 冠軍，更要嚴肅挑戰大學美式足球季後賽。任何低於 10 勝的戰績都會被視為失望。\n\n領銜出擊的是 Jayden Maiava，這位 redshirt 四年級四分衛已悄然成為全國最有成就的球員之一。Maiava 在 2025 年以 91.2 QBR 領先全國，傳出 3,711 碼，進入他在 Riley 門下的第三個赛季，擁有 31 場先發經驗。他本週入選 Manning Award 觀察名單，雖然不是海斯曼獎的熱門候選人，但穩居黑馬討論之中。\n\n進攻鋒線理論上應該是優勢。南加大是全國唯一在 2026 年 returning 全部五名先發進攻鋒線球員的球隊——直到 Kilian O'Connor 賽季报销打亂了部署。Tobias Raymond 轉任中鋒，Hayden Treter 是 guard 位置的領先人選，但失去 O'Connor 對這支本應成為進攻骨幹的單位來說是重大打擊。\n\n同時， wide receiver 陣容即將迎來新血注入。Lincoln Riley 表示， true freshman wide receiver——包括 Ethan 'Boobie' Feaster、Trent Mosley、Kayden Dixon-Wyatt 和 Mark Bowman——將在開幕戰中獲得「大量上場機會」。南加大簽下了 2026 年全國 consensus No. 1 招募班底，週六將是首次看到這些新鮮人在實戰中表現的機會。\n\n防守端最大的看點是聘请 Gary Patterson 擔任防守協調員。這位大學美式足球名人堂成員、前 TCU 主教練是被找來修復上賽季成為軟肋的防守組。分析師 JD Pickell 稱這項 hires 是 Riley CFP 之路上的「遊戲規則改變者」，而 Patterson 培養精英防守的 track record 使他成為扭轉局面的理想人選。\n\n總結：南加大有天賦、有教練、有賽程表來發動衝擊。問題是所有元素能否足夠快地整合到位。週六紀念體育場將沸騰，對 Riley 來說，這是一個可能定義他在南加大 legacy 的賽季的開始。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "Injury Bug Bites Early: Stewart Out for Opener, O'Connor Lost for Season", "headline_zh": "傷病來襲：Stewart 開幕戰缺陣、O'Connor 賽季報銷", "analysis": "USC's 2026 season hasn't even started yet, and the injury report is already a concern. Freshman All-American defensive lineman Jahkeem Stewart went down with a foot injury in training camp, and Lincoln Riley confirmed Tuesday that the sophomore will miss the opener against San José State. The hope is that Stewart can return as soon as Sept. 4 against Fresno State, but any time a key defender is sidelined, it raises questions about depth.\n\nThe bigger loss, however, is Kilian O'Connor. The starting offensive lineman is done for the season, which means USC — the only team in the country returning all five starting offensive linemen entering 2026 — now has to reshuffle its most experienced unit. Tobias Raymond is moving to center to fill the void, and redshirt sophomore Hayden Treter is the frontrunner to take the open guard spot.\n\nThe timing of O'Connor's injury is particularly unfortunate. USC was counting on its offensive line continuity to be a major advantage early in the season, especially with a young receiving corps and a new defensive coordinator still installing his system. Now, the offensive line — which was supposed to be a strength — becomes a question mark heading into the opener.\n\nRaymond's move to center is a stopgap, but it's not without risk. He's a talented player, but center is a position that demands communication, instinct, and chemistry with the quarterback. Building that chemistry with Maiava in just a few weeks of practice is a challenge, and how well Raymond handles the transition could determine how smoothly the offense operates in the early going.\n\nStill, there's reason for optimism. USC's offensive line depth is better than most programs', and the coaching staff has time to get the new configuration settled before the schedule gets tough. The bigger concern is whether the defense can hold up without Stewart, who was expected to be a disruptive force up front. Patterson's system is designed to create pressure, and without one of his best pass rushers, the learning curve just got steeper.", "analysis_zh": "南加大 2026 賽季尚未開始，傷病名單已經令人擔憂。大一全美最佳防守截鋒 Jahkeem Stewart 在訓練營中腳部受傷，Lincoln Riley 週二證實這位大二生將缺席對聖荷西州立大學的開幕戰。希望 Stewart 能在 9 月 4 日對弗雷斯諾州立時回歸，但任何關鍵防守球員缺陣都會引發深度疑慮。\n\n然而更大的損失是 Kilian O'Connor。這位先發進攻鋒線球員賽季報銷，這意味著南加大——2026 年全國唯一 returning 全部五名先發進攻鋒線球員的球隊——現在必須重組最具經驗的單位。Tobias Raymond 轉任中鋒填補空缺，redshirt 大二生 Hayden Treter 是接替空缺 guard 位置的領先人選。\n\nO'Connor 受傷的時間點特別不幸。南加大本來指望進攻鋒線的連續性成為賽季初期的主要優勢，特別是在 wide receiver 陣容年輕、新防守協調員仍在安裝系統的情況下。如今，這支本應是優勢的進攻鋒線，在開幕戰前反而成為問號。\n\nRaymond 轉任中鋒是權宜之計，但並非沒有風險。他是一名有天賦的球員，但中鋒是需要溝通、本能和與四分衛默契的位置。在短短幾週練習中與 Maiava 建立默契是一大挑戰，Raymond 轉型的順暢程度可能決定進攻在賽季初期的運作狀況。\n\n但仍有樂觀的理由。南加大的進攻鋒線 depth 比多數學校更好，教練組有時間在賽程變得艱難之前讓新配置磨合。更大的擔憂是防守能否在沒有 Stewart 的情況下撐住，他本被預期為前線的破壞力來源。Patterson 的系統旨在創造壓力，而失去了他最好的傳球推進者之一，學習曲線變得更加陡峭。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "Patterson's Defense Meets Riley's Offense: Can This Coaching Marriage Deliver a CFP Run?", "headline_zh": "Patterson 防守碰上 Riley 進攻：這對教練組合能否帶來 CFP 之路？", "analysis": "When Lincoln Riley hired Gary Patterson as his defensive coordinator, it was a signal that USC's approach to defense is about to change — fundamentally. Patterson, a College Football Hall of Famer who built TCU into a perennial contender, is the kind of hire that doesn't come along often. He brings a system, a pedigree, and a track record of producing elite defenses. The question is how quickly it all comes together.\n\nAnalyst JD Pickell called the Patterson hire a 'massive game-changer' for Riley's CFP hopes, and it's easy to see why. USC's defense was a liability last season, allowing too many big plays and failing to get off the field on third down. Patterson's scheme is built on discipline, assignment soundness, and generating pressure without blitzing — exactly what a team with USC's offensive firepower needs.\n\nThe early returns from training camp have been encouraging. Patterson has been working with a talented but young defensive roster, and the emphasis has been on simplifying the scheme so players can play fast. The USC defense has the athletes — particularly in the secondary and at linebacker — to execute Patterson's system, but the learning curve is real. Getting the call sheet right, building communication, and developing the kind of instinctive play that Patterson's defenses are known for takes time.\n\nThe matchup against San José State on Saturday will be the first test. The Spartans aren't a powerhouse, but they'll provide a baseline for how well the defense has absorbed Patterson's system. If USC can hold San José State under 14 points while generating consistent pressure, it will be a positive sign. If the defense struggles against a mid-major opponent, the concerns will only grow.\n\nWhat makes this partnership potentially special is the contrast between Riley's offensive mind and Patterson's defensive expertise. Riley is one of the best play-callers in college football, and Patterson is one of the best defensive strategists. If they can find the right rhythm — Riley scoring points and Patterson's defense holding the line — USC could be the team that no one wants to face in December and January. But that's a big 'if,' and Saturday will be the first data point.", "analysis_zh": "當 Lincoln Riley 聘請 Gary Patterson 擔任防守協調員時，這是一個訊號：南加大對防守的 approach 即將發生根本性的改變。Patterson 是大學美式足球名人堂成員，曾將 TCU 打造為 perennial contenders，是那種難得的 hires。他帶來了系統、血統和培養精英防守的 track record。問題是所有這些能多快整合到位。\n\n分析師 JD Pickell 稱 Patterson 的 hire 是 Riley CFP 之路上的「遊戲規則改變者」，原因很明顯。南加大上賽季的防守是軟肋，允許太多大plays、無法在 third down 讓對手退場。Patterson 的戰術建立在紀律、assignment soundness 和在不 blitz 的情況下製造壓力之上——這正是擁有南加大這樣進攻火力的球隊所需要的。\n\n訓練營的早期回報令人鼓舞。Patterson 一直在與一支有天賦但年輕的防守 roster 合作，重點放在簡化系統讓球員能快速打。南加大防守有運動員——特別在 secondary 和 linebacker——來執行 Patterson 的系統，但學習曲線是真實的。正確理解 call sheet、建立溝通、以及培養 Patterson 防守所 known 的本能性 play，都需要時間。\n\n週六對聖荷西州立大學的比賽將是第一次考驗。Spartans 不是 powerhouse，但他們將提供一個 baseline 來衡量防守吸收 Patterson 系統的程度。如果南加大能將聖荷西州立大學壓制在 14 分以下並持續製造壓力，將是正面訊號。如果防守在對手 mid-major 的比賽中掙扎，擔憂只會增加。\n\n這對組合 potentially 特別之處在於 Riley 進攻頭腦和 Patterson 防守專業的對比。Riley 是大學美式足球最好的 play-callers 之一，Patterson 是最好的防守戰略家之一。如果他們能找到對的節奏——Riley 得分、Patterson 防守住防線——南加大可能成為十二月和一月沒有人想面對的球隊。但這是一個很大的「如果」，而週六將是第一個數據點。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "Freshman Receivers to Get 'Plenty of Run' as USC's No. 1 Recruiting Class Makes Debut", "headline_zh": "新人 Wide Receivers 將獲大量上場時間，南加大 No. 1 招募班底迎來首秀", "analysis": "USC signed the unanimous No. 1 recruiting class in the nation for 2026, and on Saturday, those freshmen will get their first taste of college football. Lincoln Riley told reporters that the true freshman receivers — headlined by Ethan 'Boobie' Feaster, Trent Mosley, Kayden Dixon-Wytt, and Mark Bowman — will get 'plenty of run' in the opener against San José State. It's a bold move, but one that signals Riley's confidence in the talent he's recruited.\n\nFeaster is the headliner. A reclassified four-star out of DeSoto High in Texas, he was one of the most coveted receivers in the 2026 class before reclassifying to join the group a year early. His speed and route-running ability are already college-level, and Riley has been raving about his maturity and work ethic throughout training camp.\n\nMosley, Dixon-Wyatt, and Bowman bring different skill sets to the table, but they all share one thing: they were recruited specifically to fit Riley's offensive system. Riley's Air Raid offense relies on receivers who can create separation, make plays after the catch, and handle a high volume of targets. These freshmen were chosen because they fit that profile.\n\nThe challenge is that college football is a different beast than high school. The speed of the game, the complexity of defensive schemes, and the physicality of the trenches are all significantly higher. Even the most talented freshmen need time to adjust, and throwing them into the deep end in a season opener — even against a mid-major opponent — carries risk.\n\nBut Riley has never been afraid to play freshmen, and the results have generally been positive. At Oklahoma, he regularly played true freshmen in key roles, and many of them became stars. The same could happen at USC, where the combination of talent, scheme, and coaching creates an environment where young players can thrive. Saturday's opener will be the first chapter in what could be a remarkable freshman class story.", "analysis_zh": "南加大簽下了 2026 年全國 consensus No. 1 招募班底，而週六，那些新鮮人將首次體驗大學美式足球。Lincoln Riley 告訴記者， true freshman wide receiver——包括 Ethan 'Boobie' Feaster、Trent Mosley、Kayden Dixon-Wyatt 和 Mark Bowman——將在對聖荷西州立大學的開幕戰中獲得「大量上場機會」。這是一個大膽的舉動，但也顯示了 Riley 對他所招募天賦的信心。\n\nFeaster 是頭號新秀。他是從德州 DeSoto High 重新分類的 four-star 選手，在 2026 屆中重新分類提前加入之前，是該屆最受追捧的 wide receiver 之一。他的速度和 route-running 能力已經達到大學水平，Riley 在整個訓練營中對他的成熟度和工作態度讚不絕口。\n\nMosley、Dixon-Wyatt 和 Bowman 帶來不同的技能組合，但他們都有一個共同點：他們是為了 fit Riley 的進攻系統而被招募的。Riley 的 Air Raid offense 依賴 wide receivers 能夠創造 separation、在接球後製造 plays、並承受大量的 target。這些新鮮人被選中正是因為他們符合這個 profile。\n\n挑戰在於大學美式足球與高中是不同的世界。比賽速度、防守方案的複雜性和 trenches 的身體對抗都顯著更高。即使最有天賦的新鮮人也需要時間適應，在開幕戰中就將他們丟入深水區——即使是對 mid-major 對手——也存在風險。\n\n但 Riley 從不害怕讓 freshmens 上場，結果通常也是正面的。在 Oklahoma，他 regularly 讓 true freshmen 擔任關鍵角色，其中許多人成為了明星。南加大也可能發生同樣的情況，天賦、系統和 coaching 的結合創造了一個讓年輕球員能夠茁壯成長的環境。週六的開幕戰將是這個可能成為傳奇 fresh class 故事的第一章。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "Coliseum Upgrades and a Sellout Crowd: USC's Game-Day Experience Gets a 2026 Overhaul", "headline_zh": "紀念體育場升級與滿場觀眾：南加大 2026 賽季比賽日體驗全面翻新", "analysis": "Beyond the Xs and Os, USC has made significant investments in the game-day experience at the Coliseum for the 2026 season. The athletic department announced a series of enhancements, including a new in-stadium host, pregame fireworks, drone shows, and an overhauled fan experience designed to make Saturdays at the Coliseum feel like must-see events.\n\nThe Coliseum has always been one of the most iconic venues in college football, but it has also faced criticism in recent years for outdated amenities and a fan experience that didn't match the on-field product. The 2026 upgrades are a direct response to that feedback, with USC investing in technology, entertainment, and atmosphere to make the stadium feel modern and electric.\n\nThe pregame experience, in particular, is getting a major overhaul. The fireworks and drone shows are designed to build energy before kickoff, creating a sense of occasion that matches the stakes of a Big Ten season. For a program that's trying to reclaim its place among college football's elite, the game-day experience is an important part of the equation.\n\nThe sellout crowd for the opener is another positive sign. USC has struggled to consistently fill the Coliseum in recent years, but the combination of excitement about the 2026 recruiting class, the Patterson hire, and the Maiava Heisman campaign has generated significant buzz. A packed Coliseum on Saturday will be a statement — both to the team and to the rest of the country.\n\nAll of these elements — the upgrades, the atmosphere, the crowd — contribute to something that's hard to quantify but easy to feel: momentum. USC is building something special, and the Coliseum is becoming a place where opponents don't want to play. If the product on the field matches the energy in the stands, the Trojans could be in for a special season.", "analysis_zh": "除了戰術層面，南加大在 2026 賽季對紀念體育場的比賽日體驗也進行了大量投資。體育部門宣布了一系列升級措施，包括新的場內主持人、開場煙火、無人機表演，以及全面翻新的球迷體驗，旨在讓週六在紀念體育場的比賽成為不容錯過的盛事。\n\n紀念體育場一直是大學美式足球最具標誌性的場館之一，但近年來也因設施老舊和球迷體驗跟不上場上產品而受到批評。2026 年的升級是對這些回饋的直接回應，南加大在科技、娛樂和氛圍方面投資，讓球場感覺現代化且充滿電力。\n\n特別是開場體驗正在進行大翻新。煙火和無人機表演旨在在開球前建立能量，營造一種與 Big Ten 賽季 stakes 相匹配的場合感。對於一個試圖重返大學美式足球精英之列的項目來說，比賽日體驗是等式中重要的一部分。\n\n開幕戰的滿場觀眾是另一個正面訊號。南加大近年來在填滿紀念體育場方面一直掙扎，但 2026 招募班底的興奮感、Patterson 的 hire 和 Maiava 的海斯曼 campaign 產生了 significant buzz。週六爆滿的紀念體育場將是一個聲明——對球隊和全國都是如此。\n\n所有這些元素——升級、氛圍、觀眾——都在貢獻一種難以量化但容易感受到的東西：動量。南加大正在 building something special，紀念體育場正在成為對手不想去的地方。如果場上的 product 能與看台上的能量匹配，Trojans 可能迎來一個特別的賽季。"}, {"team": "Rams", "accent": "#003594", "headline": "Rams Re-Acquire Tutu Atwell in Trade with Dolphins; WR3 Spot Solidified", "headline_zh": "公羊透過交易從海豚手中迎回 Tutu Atwell；WR3 位置塵埃落定", "analysis": "In a move that caught most people off guard, the Los Angeles Rams traded running back Jarquez Hunter to the Miami Dolphins on Wednesday to reacquire receiver Tutu Atwell. Atwell, who was LA's 2021 second-round pick and a Super Bowl LVI champion as a rookie, left in free agency this offseason after signing a one-year, $1.4 million deal with the Dolphins. Now he's back, and the Rams' wide receiver room suddenly looks deeper and more dangerous.\n\nThe trade gives the Rams clarity at WR3 behind Puka Nacua and Davante Adams. Atwell's speed and familiarity with Sean McVay's system make him an ideal fit in the slot, where he can exploit mismatches and stretch the field. His return also gives the Rams insurance in case Nacua's psoas soreness lingers into the regular season.\n\nWhat makes the trade interesting is what the Rams gave up — or rather, what they didn't. Jarquez Hunter was a promising young running back, but the Rams' backfield is deep with Kyren Williams, Blake Corum, and others. Trading Hunter for a proven receiver who knows the system is the kind of move that speaks to the Rams' confidence in their running game and their urgency to win now.\n\nAtwell's return is also a homecoming of sorts. He was drafted by the Rams, won a Super Bowl with them, and knows the culture. The adjustment period should be minimal, which is important with the season opener in Australia just days away. McVay values continuity and trust, and Atwell brings both.\n\nThe bigger picture is that the Rams are making moves to win immediately. They have a roster built for a Super Bowl run, and the Atwell trade is the latest example of McVay and Les Snead aggressively adding pieces. With the opener against the 49ers in Sydney looming, every roster decision is being made with October and beyond in mind.", "analysis_zh": "洛杉磯公羊週三做出了一項令多數人意外的舉動：將 running back Jarquez Hunter 交易到邁阿密海豚，以迎回 wide receiver Tutu Atwell。Atwell 是公羊 2021 年的 second-round pick，也是 Super Bowl LVI 的冠軍成員（菜鳥年），今年夏天以一年 140 萬美元合約與海豚簽約後離開。如今他回来了，公羊的 wide receiver 陣容突然變得更深、更具威脅。\n\n這筆交易讓公羊在 Puka Nacua 和 Davante Adams 之後的 WR3 位置有了明確人選。Atwell 的速度和對 Sean McVay 系統的熟悉使他成為 slot 的理想人選，能夠利用 mismatch 並拉長球場。他的回歸也為 Nacua 的 psoas 酸痛如果延續到例行賽提供了保險。\n\n這筆交易有趣之處在於公羊付出的代價——或者更準確地說，他們沒有付出什麼。Jarquez Hunter 是一位有前途的年輕 running back，但公羊的 backfield 深度充足，有 Kyren Williams、Blake Corum 和其他人。用 Hunter 交易一位了解系統的 proven receiver，這類 move 體現了公羊對跑陣的信心和立即贏球的緊迫感。\n\nAtwell 的回歸也是一種 homecoming。他是被公羊選中的，與他們贏得 Super Bowl，了解文化。磨合期應該很短，這在距離澳洲開幕戰僅幾天之際非常重要。McVay 重視連續性和信任，而 Atwell 兩者兼具。\n\n更大的格局是公羊正在做出立即贏球的 moves。他們有一支為 Super Bowl 攻勢 build 的 roster，而 Atwell 的交易是 McVay 和 Les Snead 積極 add pieces 的最新範例。隨著對 49ers 在悉尼的開幕戰逼近，每一個 roster 決策都是以十月及之後為考量。"}, {"team": "Rams", "accent": "#003594", "headline": "Three QBs on the 53? McVay Says Yes — But the Backup Battle Goes Down to the Wire", "headline_zh": "53 人名單帶三名四分衛？McVay 說 yes——但 backup 之爭戰到最後一刻", "analysis": "Sean McVay dropped a mildly surprising bombshell on Wednesday: the Rams will carry three quarterbacks on their initial 53-man roster. That means Matthew Stafford, Stetson Bennett IV, and Ty Simpson will all make the team, with undrafted QB Matthew Caldwell also in the mix for preseason finale snaps against the Chargers on Thursday.\n\nThe decision to keep three QBs is somewhat unusual in today's NFL, where roster spots are at a premium. But McVay has his reasons. Bennett, the former Georgia national champion, has shown flashes of brilliance — including an 'incredible' fourth-down throw and two rushing touchdowns in the Rams' 34-0 preseason win over the Saints. Simpson, the rookie first-rounder, has demonstrated smooth operation through progressions. McVay said he feels 'really good' about both backups.\n\nThe preseason finale against the Chargers on Thursday will be the final audition for both Bennett and Simpson. McVay said the backup in Australia and rep allocation in the game remain undecided, which means Thursday night could determine who backs up Stafford when the Rams open the season against the 49ers in Sydney.\n\nWhat's interesting is how this roster decision reflects the Rams' broader approach to the 2026 season. They're not just building for Week 1; they're building for the long haul. Carrying three QBs gives them insurance against injury and allows them to develop Simpson, who has the physical tools to be a future starter but needs time to refine his game.\n\nThe Rams' quarterback room is in a good place. Stafford is the MVP-caliber starter, Bennett provides a high-floor backup who can win games if called upon, and Simpson is the high-ceiling developmental prospect. It's a room that balances immediate needs with future planning — exactly what a contending team should look like.", "analysis_zh": "Sean McVay 週三丟出了一個略顯意外的消息：公羊將在初始 53 人名單中攜帶三名四分衛。這意味著 Matthew Stafford、Stetson Bennett IV 和 Ty Simpson 都會留在隊中，而 undrafted 四分衛 Matthew Caldwell 也在週四對電光人的季前賽最終戰中爭取上場機會。\n\n在今天的 NFL 中攜帶三名四分衛 somewhat unusual，因為 roster spots 非常寶貴。但 McVay 有他的理由。Bennett，前喬治亞全國冠軍，已展現出 brilliance 的片段——包括在公羊 34-0 季前賽大勝聖徒的比賽中一次「不可思議」的 fourth-down throw 和兩次 rushing touchdowns。Simpson，rookie first-rounder，展現了 through progressions 的流暢操作。McVay 表示對兩位 backup 都感到「非常滿意」。\n\n週四對電光人的季前賽最終戰將是 Bennett 和 Simpson 的最後 audition。McVay 表示在澳洲的 backup 和比賽中的 rep allocation 仍未決定，這意味著週四晚上可能決定誰將在公羊於悉尼對 49ers 開幕時擔任 Stafford 的 backup。\n\n有趣的是這個 roster 決策如何反映了公羊對 2026 賽季的 broader approach。他們不只是在 build for Week 1；而是 build for the long haul。攜帶三名四分衛為他們提供了傷病保險，並允許他們 developing Simpson——這位擁有成為未來 starter 的 physical tools 但需要時間 refine his game 的球員。\n\n公羊的四分衛房間處於良好的狀態。Stafford 是 MVP 級的先發，Bennett 提供了一位 high-floor 的 backup——在被召喚時能贏得比賽，而 Simpson 是 high-ceiling 的 developmental prospect。這是一個平衡 immediate needs 與 future planning 的房間——正是一支 contenders 應有的樣貌。"}, {"team": "Rams", "accent": "#003594", "headline": "Myles Garrett and Puka Nacua: McVay's 'Return to Performance' Strategy With His Two Stars", "headline_zh": "Myles Garrett 和 Puka Nacua：McVay 對兩位球星的「回歸表現」策略", "analysis": "The Los Angeles Rams have two of the most talented players in the NFL — Myles Garrett, the reigning Defensive Player of the Year, and Puka Nacua, the All-Pro receiver — and neither has practiced since training camp. Garrett has been dealing with knee swelling, while Nacua has been sidelined with psoas soreness since an Aug. 11 joint practice with the Cowboys. Sean McVay is taking the long view with both, prioritizing their health for the season opener in Australia over getting them back on the field immediately.\n\nMcVay's approach is what he calls 'return to performance, not just return to play.' The distinction is important: he's not interested in getting Garrett and Nacua cleared to practice if they're not ready to perform at their full capability. With the opener against the 49ers in Sydney just over a week away, the Rams are erring on the side of caution with their two biggest stars.\n\nNacua took a step forward this week by returning to the field for side workouts with the training staff. It's a positive development, but the Rams remain cautious — the psoas is a tricky injury that can linger if not handled properly. The fact that Nacua is doing side work rather than full practice suggests the team is still in the 'ramp-up' phase.\n\nGarrett's situation is more concerning. Knee swelling in a player who relies on explosive first-step quickness is never ideal, and McVay has been vague on specifics about the injury. The goal, he said, is to get Garrett 'ready to roll for Australia,' but the timeline is uncertain. Losing Garrett for even one game would be a significant blow to a defense that is counting on his pass-rush dominance.\n\nThe broader strategy here is clear: McVay is protecting his stars for the games that matter. The preseason has been a chance to evaluate backups and bubble players, while the starters have been kept on ice. It's a strategy that has worked for the Rams before — McVay has a decade-long tradition of keeping starters fresh into the regular season — and there's every reason to believe it will work again. The key is having Garrett and Nacua at full strength when the games count.", "analysis_zh": "洛杉磯公羊擁有 NFL 中最有天賦的兩位球員—— reigning Defensive Player of the Year Myles Garrett 和 All-Pro wide receiver Puka Nacua——但兩人都未在訓練營後進行練習。Garrett 一直在處理膝蓋腫脹，而 Nacua 自 8 月 11 日與牛仔隊的聯合練習以來就因 psoas 酸痛缺陣。Sean McVay 正在對兩人採取長遠的 view，將他們在澳洲開幕戰的健康置於立即回到球場之上。\n\nMcVay 的 approach 是他所謂的「回歸表現，不只是回歸上場」。這個區別很重要：他對在沒有 full capability 的情況下讓 Garrett 和 Nacua cleared to practice 不感興趣。隨著對 49ers 在悉尼的開幕戰不到一週，公羊在兩位最大球星身上選擇了謹慎。\n\nNacua 本週回到球場與訓練 staff 進行 side workouts，這是一步 positive development。但公羊仍然 caution——psoas 是一種 tricky injury，如果處理不當會 lingering。Nacua 在做 side work 而非 full practice 這一事實表明球隊仍處於「 ramp-up」階段。\n\nGarrett 的情況更令人擔憂。對一位依賴 explosive first-step quickness 的球員來說，膝蓋腫脹從來不是理想情況，而 McVay 一直對傷勢細節含糊其辭。他表示目標是讓 Garrett「ready to roll for Australia」，但 timeline 不確定。即使失去 Garrett 一場比賽，對一支依賴他的 pass-rush dominance 的防守來說也是重大打擊。\n\n這裡的 broader strategy 很清楚：McVay 正在保護他的球星，為重要的比賽做準備。季前賽一直是評估 backups 和 bubble players 的機會，而先發們則被 kept on ice。這是公羊以前就有效的策略——McVay 有一個 decade-long tradition 保持 starters fresh 進入例行賽——有充分理由相信它會再次奏效。關鍵是讓 Garrett 和 Nacua 在比賽重要時達到 full strength。"}, {"team": "Rams", "accent": "#003594", "headline": "The Aaron Donald Question: Can the Rams' Greatest Player Come Back One More Time?", "headline_zh": "Aaron Donald 的問題：公羊史上最偉大的球員能否再回來一次？", "analysis": "Aaron Donald hasn't played a snap since retiring after the 2023 season, but the greatest defensive tackle of his generation has been working out at the Rams' facility for two months. The question that's been hanging over the franchise all summer is finally reaching a tipping point: will Donald come back?\n\nThe timeline is getting tight. Roster cut-down day is approaching, and McVay confirmed that the Rams have built 53-man rosters both with and without Donald. The contract structure is a complication — roughly $30 million is still owed, and the Rams have only about $15 million in cap space. But if Donald wants to play, there are ways to make it work.\n\nThe physical side of things seems to be going well. Donald has been working out at the facility, and there have been no reports of any physical setbacks. At 35, he's not the same player who won three Defensive Player of the Year awards, but even a diminished Donald would be a significant addition to a pass rush that already includes Myles Garrett.\n\nThe decision likely comes down to motivation. Does Donald still have the desire to endure a full NFL season — the practices, the film study, the physical toll? He retired because he felt he had accomplished everything there was to accomplish. Coming back would mean chasing something new: perhaps one more ring, perhaps the chance to play alongside Garrett, perhaps simply the love of the game.\n\nMcVay has handled the situation with his usual grace, neither pressuring Donald to commit nor ruling out the possibility. The Rams are ready to go with or without him, which is exactly the right posture. If Donald decides to come back, it would be one of the most remarkable stories of the NFL season. If he doesn't, the Rams are still a Super Bowl contender. Either way, the franchise is in good hands — and the next week will determine which version of the Rams takes the field in Australia.", "analysis_zh": "Aaron Donald 自 2023 賽季退休後就未再上場，但這位世代最佳防守截鋒一直在公羊的設施中訓練。整個夏天懸在球隊頭上的問題終於到了臨界點：Donald 會回來嗎？\n\n時間正在變得緊迫。roster cut-down 日 approaching，而 McVay 證實公羊已 build 了包含 Donald 和不包含 Donald 兩種版本的 53 人名單。合約結構是一個 complication——大約 3000 萬美元 still owed，而公羊只有大約 1500 萬美元的 cap space。但如果 Donald 想打球，有辦法做到。\n\n身體 side 的情況似乎進展良好。Donald 一直在設施中訓練，沒有任何身體 setback 的報告。在 35 歲時，他已不是那位贏得三次 Defensive Player of the Year 的球員，但即使是一位 diminished 的 Donald，也會是已經擁有 Myles Garrett 的 pass rush 的 significant addition。\n\n決定 likely 取決於 motivation。Donald 是否還有 desire 去承受一個完整的 NFL 賽季——練習、film study、身體代價？他退休是因為覺得已 accomplish 了一切。回來將意味著追求新的東西：也許再一枚戒指，也許有機會與 Garrett 同場較勁，也許 simply 是對比賽的熱愛。\n\nMcVay 以其一貫的 grace 處理了這個情況，既不 pressure Donald 做出承諾，也不排除可能性。公羊有他沒他都準備好了，這正是正確的 posture。如果 Donald 決定回來，將成為 NFL 賽季最 remarkable 的故事之一。如果不回來，公羊仍然是一支 Super Bowl contenders。無論如何，球隊都在 good hands——而接下來一週將 determining 哪個版本的公羊將在澳洲上場。"}, {"team": "Rams", "accent": "#003594", "headline": "Preseason Finale Tonight: Rams vs. Chargers — What to Watch in the Backup Battles", "headline_zh": "季前賽今晚收官：公羊對電光人——backup 之爭看點", "analysis": "The Rams close out their 2026 preseason tonight at SoFi Stadium against the Los Angeles Chargers in a game that, on paper, doesn't matter much — but in reality, will determine several key roster spots. With the regular season opener against the 49ers in Sydney just over a week away, this is the final audition for players fighting for their NFL lives.\n\nThe most prominent battle is at quarterback. McVay confirmed that either Stetson Bennett IV or Ty Simpson will back up Matthew Stafford in Australia, and Thursday night's usage will be telling. Both have shown flashes — Bennett with his incredible fourth-down throw and two rushing touchdowns against the Saints, Simpson with his smooth operation through progressions. But only one can be the primary backup, and this game could tip the scales.\n\nThe 34-0 preseason win over the Saints was a statement game for the Rams' depth. Safety Alex Cook returned a red-zone interception 100 yards for a touchdown, the defense forced turnovers, and the special teams unit looked sharp. But the Saints game was also against backups and fringe roster players; the Chargers will provide a stiffer test.\n\nMcVay has a decade-long tradition of keeping starters out of the preseason finale, and there's no reason to expect that to change tonight. The Rams' key players — Stafford, Nacua, Garrett, Adams, and others — will almost certainly sit, giving the backups and bubble players one last chance to make their case.\n\nFor the fans, this is a chance to see the next wave of Rams talent in action. For the players, it's a do-or-die night. The roster cut-down is coming, and every snap matters. It's not the most glamorous game of the year, but it might be the most important for half a dozen players fighting to keep their NFL dreams alive.", "analysis_zh": "公羊將於今晚在 SoFi Stadium 以 2026 季前賽收官戰對決洛杉磯電光人。這場比賽在紙面上似乎無關緊要——但實際上將決定 several key roster spots。隨著距離悉尼的 regular season opener 對 49ers 不到一週，這是爭取 NFL 生涯的球員們的最後 audition。\n\n最突出的 battle 在四分衛位置。McVay 證實 Stetson Bennett IV 或 Ty Simpson 其中一人將在悉尼擔任 Matthew Stafford 的 backup，而週四晚上的 usage 將會很有啟發性。兩人都展現了 flashes——Bennett 在對聖徒比賽中不可思議的 fourth-down throw 和兩次 rushing touchdowns，Simpson 在 through progressions 的 smooth operation。但只有一人能成為 primary backup，這場比賽可能改變天平。\n\n34-0 季前賽大勝聖徒是公羊深度的 statement game。safety Alex Cook 回陣了一次 red-zone interception 100 碼達陣，防守迫使 turnover，special teams unit 看起來 sharp。但聖徒比賽也是 against backups 和 fringe roster players；電光人將提供更嚴峻的考驗。\n\nMcVay 有一個 decade-long tradition 保持 starters out of 季前賽收官戰，沒有理由預期今晚會改變。公羊的關鍵球員——Stafford、Nacua、Garrett、Adams 和其他人——幾乎肯定會坐板凳，讓 backups 和 bubble players 有最後一次機會 make their case。\n\n對球迷來說，這是看到公羊下一波 talent 在行動中的機會。對球員來說，這是一個 do-or-die 的夜晚。roster cut-down 即將到來，每一次 snap 都很重要。這不是一年中最 glamorous 的比賽，但可能對 half a dozen 爭取保持 NFL 夢想 alive 的球員來說是最重要的。"}, {"team": "Rams", "accent": "#003594", "headline": "Australia Awaits: Rams' Week 1 Opener Against 49ers in Sydney Is a Logistical and Competitive Challenge", "headline_zh": "澳洲在等待：公羊在悉尼對 49ers 的 Week 1 開幕戰是後勤與競爭的雙重挑戰", "analysis": "The Los Angeles Rams will open their 2026 regular season not at SoFi Stadium, but in Sydney, Australia, against the San Francisco 49ers. It's the NFL's latest international game, and for the Rams, it presents both an extraordinary opportunity and a significant logistical challenge.\n\nOn the competitive side, the opener against the 49ers is a heavyweight matchup between two NFC West rivals. The 49ers are expected to be among the NFC's best, and opening against them — on a neutral field, no less — will be an immediate test of where the Rams stand. With questions surrounding the health of Garrett and Nacua, and the Aaron Donald situation unresolved, the Rams will need to be ready from the jump.\n\nThe logistical challenges are real, too. Traveling to Australia is a 15-plus-hour flight, and the time difference means adjusting to a completely different schedule. McVay has experience managing international trips — the Rams have played in London and Mexico City — but Australia is a different beast entirely. The team will need to arrive early, acclimate to the time zone, and find a way to replicate their preparation routine in an unfamiliar environment.\n\nFor the players, there's also the mental component. Opening the season in a foreign country, in front of a crowd that may not be fully familiar with NFL rules, creates a unique atmosphere. Some players will thrive in that environment; others may find it distracting. McVay's ability to keep the team focused and prepared will be tested.\n\nOn the plus side, the Australia game gives the Rams a chance to showcase their brand on a global stage. The NFL's international push has been a priority for years, and the Rams — with their star-studded roster and connection to the Los Angeles market — are ideal ambassadors. A strong performance in Sydney could build momentum that carries through the rest of the season.\n\nThe bottom line is that the Rams have a lot to prepare for in a short amount of time. The roster decisions, the health of their stars, and the international logistics all need to come together before Sept. 7. It's a tall order, but if any team can handle it, it's the Rams — a franchise that has shown time and again that it thrives under pressure.", "analysis_zh": "洛杉磯公羊將不在 SoFi Stadium，而是在澳洲悉尼迎來 2026 regular season 開幕戰，對手是舊金山 49ers。這是 NFL 最新的國際比賽，對公羊來說既是 extraordinary opportunity 也是 significant logistical challenge。\n\n在競爭層面，對 49ers 的開幕戰是兩支 NFC West rivals 之間的 heavyweights matchup。49ers 預計將是 NFC 最好的球隊之一，在 neutral field 上對決他們將是對公羊實力的 immediately test。在 Garrett 和 Nacua 健康狀況存疑、Aaron Donald situation 仍未解決的情況下，公羊需要從一開始就準備好。\n\n後勤挑戰也是真實的。前往澳洲是超過 15 小時的 flight，而 time difference 意味著要適應完全不同的 schedule。McVay 有管理 international trips 的經驗——公羊在倫敦和墨西哥城比賽過——但澳洲是 completely different beast。球隊需要 early arrival、適應時區，並在陌生環境中複製他們的 preparation routine。\n\n對球員來說，還有 mental component。在 foreign country 開幕、在可能不 fully familiar with NFL rules 的觀眾面前比賽，創造了 unique atmosphere。有些球員會在那個環境中 thrive；其他人可能 find it distracting。McVay 保持球隊專注和準備的能力將受到考驗。\n\n好消息是澳洲比賽給了公羊在全球舞台上展示品牌的機會。NFL 的 international push 多年來一直是 priority，而公羊——擁有 star-studded roster 和與洛杉磯市場的 connection——是理想的 ambassadors。在悉尼的 strong performance 可能 build momentum  carried through the rest of the season。\n\nBottom line 是公羊需要在短時間內 prepare for a lot。Roster decisions、球星的 health 和 international logistics 都需要在 9 月 7 日前 come together。這是一個 tall order，但如果有一支球隊能 handle it，那就是公羊——一支 time and again 顯示在壓力下 thrive 的 franchise。"}], "closing": "It's a week where every LA franchise faces a defining stretch. The Dodgers need their pitching to gel before October. USC needs its young talent to grow up fast. And the Rams need their stars healthy for a season opener half a world away. The next seven days will tell us a lot about where each of these teams is headed. Stay sharp, LA.", "closing_zh": "這是每支 LA 球隊都面對關鍵時刻的一週。道奇需要在十月前讓投手群整合完畢。南加大需要年輕 talent 快速成長。而公羊需要他們的球星在半個地球之外的開幕戰前恢復健康。接下來七天將告訴我們這些球隊各自走向何方。保持敏銳，LA。"};
let lang = "en";
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmtPT(iso){ return new Date(iso).toLocaleString("en-US",{timeZone:"America/Los_Angeles",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"})+" PT"; }

function renderDigest(d){
  const box = document.getElementById("digest");
  if(!d || !d.segments){
    box.innerHTML = '<div style="text-align:center;color:var(--dim);padding:40px">No digest yet</div>';
    return;
  }
  const segs = d.segments.map(s=>{
    const headline = lang==="en" ? s.headline : s.headline_zh;
    const analysis = lang==="en" ? s.analysis : s.analysis_zh;
    return '<div class="seg" style="--team:'+esc(s.accent)+'">' +
      '<div class="row"><span class="hn">'+esc(headline)+'</span><span class="badge">'+esc(s.team)+'</span></div>' +
      '<div class="lbl">'+(lang==="en"?"Analysis":"分析")+'</div><p>'+esc(analysis)+'</p>' +
      '</div>';
  }).join("");
  box.innerHTML =
    '<div class="dhead">' +
      '<div class="t"><div class="mic">🎙️</div><div><h2>'+esc(d.title)+'</h2><div class="meta">' +
        esc(d.read_time || "")+' · '+fmtPT(d.updated_at)+
        ' · 繁中/EN</div></div></div>' +
      '<div class="langs">'+
        '<button id="btnEn" class="on" onclick="setLang(\'en\')">EN</button>'+
        '<button id="btnZh" onclick="setLang(\'zh\')">繁體中文</button>'+
      '</div>' +
    '</div>' +
    '<div class="intro">'+esc(lang==="en"?d.intro:d.intro_zh)+'</div>' +
    '<div class="segs">'+segs+'</div>' +
    '<div class="closing">'+esc(lang==="en"?d.closing:d.closing_zh)+'</div>';
}
function setLang(v){ lang = v; document.getElementById("btnEn").classList.toggle("on", v==="en"); document.getElementById("btnZh").classList.toggle("on", v==="zh"); renderDigest(DIGEST_DATA); }

function renderNews(d){ const upd = document.getElementById("upd"); if(upd) upd.textContent = fmtPT(d.updated_at);
  const g = document.getElementById("grid"); g.innerHTML = "";
  for(const t of d.teams){
    const c = document.createElement("div"); c.className = "card"; c.style.setProperty("--team", t.accent);
    const emoji = t.emoji==="Baseball"?"⚾":t.emoji==="Football"?"🏈":"🏆";
    c.innerHTML =
      '<div class="top"><div class="ico">' + emoji + '</div>' +
      '<div><div class="name">' + esc(t.name) + '</div><div class="rec">' + t.sport + ' · ' + esc(t.record) + '</div></div></div>' +
      '<div class="hline">' + esc(t.headline) + '</div>' +
      '<h3>Latest News</h3><ul class="news">' + t.latest_news.map(n =>
        '<li><a target="_blank" rel="noopener" href="' + esc(n.url) + '">' + esc(n.title) + '</a><p>' + esc(n.summary) + '</p></li>'
      ).join("") + '</ul>' +
      '<h3>Fun Facts</h3><ul class="facts">' + t.fun_facts.map(f => '<li>'+esc(f)+'</li>').join("") + '</ul>' +
      '<h3>Further Reading</h3><ul class="read">' + t.further_reading.map(f =>
        '<li><a target="_blank" rel="noopener" href="' + esc(f.url) + '"><span>'+esc(f.title)+'</span><span class="why">'+esc(f.why)+'</span></a></li>'
      ).join("") + '</ul>' +
      '<div class="oss">' + esc(t.one_sentence) + '</div>';
    g.appendChild(c);
  }
}

renderDigest(DIGEST_DATA);
renderNews(TEAMS_DATA);
</script>
