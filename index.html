<style>
  :root{
    --bg:#0b0e14; --panel:rgba(255,255,255,.04); --panel2:rgba(255,255,255,.02);
    --line:rgba(255,255,255,.08); --fg:#edf2fa; --dim:#8a94a6;
    --radius:18px; --glow:0 0 0 1px rgba(255,255,255,.04), 0 24px 60px -30px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 500px at 20% -10%, rgba(42,111,216,.18), transparent 60%),
      radial-gradient(1000px 500px at 90% -10%, rgba(153,0,0,.14), transparent 60%),

      var(--bg);
    color:var(--fg); min-height:100vh;

  header{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:26px}

  h1{font-size:clamp(22px,3vw,32px);font-weight:800;letter-spacing:-.02em}
  .sub{color:var(--dim);font-size:13px;margin-top:4px}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:20px}

  .card::before{

  .top{display:flex;align-items:center;gap:12px;margin-bottom:14px}

  .rec{font-size:11px;color:var(--team);font-weight:700;margin-top:2px}

  h3::after{content:"";flex:1;height:1px;background:var(--line)}
  .news{list-style:none}
  .news li{padding:10px 12px;border-radius:12px;margin-bottom:6px;background:var(--panel2);border:1px solid var(--line);transition:.2s}
  .news li:hover{border-color:color-mix(in srgb,var(--team) 50%, transparent);transform:translateX(3px)}
  .news a{color:var(--fg);text-decoration:none;font-weight:700;font-size:13px;display:block;margin-bottom:4px}
  .news a:hover{color:var(--team)}
  .news p{font-size:12px;color:var(--dim);line-height:1.5}

  banner span{color:#7ce38b;animation:blink 1.5s infinite}
  @keyframes blink{50%{opacity:.3}}
  .spin{width:100%;height:100px;display:grid;place-items:center;color:var(--dim)}
  /* ---- digest ---- */
  .digest{

  .dhead .t{display:flex;align-items:center;gap:12px}

  .dhead h2{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .dhead .meta{color:var(--dim);font-size:12px;margin-top:3px}
  .langs{display:flex;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:4px}
  .langs button{border:0;background:transparent;color:var(--dim);font-size:12px;font-weight:700;padding:6px 16px;border-radius:99px;cursor:pointer;transition:.2s}
  .langs button.on{background:linear-gradient(135deg,#2a6fd8,#1f4e9c);color:#fff}
  .intro{font-size:14px;line-height:1.65;color:var(--fg);max-width:820px;margin-bottom:18px}
  .segs{display:grid;gap:12px}
  .seg{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--panel2)}
  .seg .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .seg .row .hn{font-weight:800;font-size:14.5px}
  .seg .badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--team,#2a6fd8) 20%,transparent);color:var(--team);white-space:nowrap}
  .seg p{font-size:12.5px;line-height:1.6;color:var(--dim);margin-top:6px}
  .seg p.cls{color:var(--fg)}
  .seg .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin-top:10px;font-weight:700}
  .closing{font-size:14px;line-height:1.6;border-top:1px dashed var(--line);margin-top:16px;padding-top:14px;color:var(--fg)}
</style>

const DIGEST_DATA = {"updated_at": "2026-08-18T16:00:00-07:00", "title": "LA Sports Daily Digest — 15-Minute Edition", "read_time": "~15 minutes", "intro": "Good evening, Los Angeles. Welcome to your 15-Minute Edition of the LA Sports Daily Digest for August 18, 2026. The Dodgers just torchered Colorado to open a Coors Field series and appear to be rounding into October form with a wave of injured arms returning to the mound. USC is ranked 14th in the preseason AP Poll and ramping up for a Week 0 opener, though a devastating center injury adds intrigue to an already compelling season arc. And the Rams? They opened their preseason with a statement win over the Chiefs, their rookie quarterback looked composed beyond his years, and the Aaron Donald comeback watch officially has a second data point. Three teams, three fascinating storylines, one packed digest. Let's get you caught up on everything happening across the LA sports landscape tonight.", "intro_zh": "晚安，洛杉磯。歡迎收看2026年8月18日的《洛杉磯體球每日摘要》十五分鐘版。道奇隊剛在庫爾斯球場系列賽首戰中大破科羅拉多，看起來正隨著一波傷癒投手的回歸而邁向十月準決賽的狀態。USC在 preseason AP Poll 排名第14，正為第0週開幕戰積極備戰，然而一起毀滅性的center傷病為本就引人入勝的賽季增添了更多懸念。而公羊隊呢？他們在季前賽首秀中以一場對酋長隊的制勝表現開局，他們的新秀四分衛展現出超越年齡的沉著，而Aaron Donald復出 watch 正式有了第二個數據點。三支球隊，三條引人入勝的故事線，一期內容豐富的摘要。現在就帶您掌握洛杉磯體育圈今晚的所有動態。", "segments": [{"team": "Dodgers", "accent": "#2A6FD8", "headline": "Bats Erupt at Coors, Pitching Staff Rallies Toward October", "headline_zh": "打線在庫爾斯球場爆發，投手陣容向十月季後賽集結", "analysis": "The Dodgers erupted for 11 runs to rout Colorado in the series opener at Coors Field, shaking off a miserable 1-3 homestand against Milwaukee where the offense was held to two runs or fewer in three of four games. At 75-51, Los Angeles holds an eight-game cushion atop the NL West — the largest division lead in the National League — and appears destined for yet another postseason berth. The offense needed that kind of outburst to restore confidence heading into the stretch run, and Coors Field, as always, provided the perfect stage for a lineup to find its rhythm.\n\nBut the real story is the arms race on the mound. Tyler Glasnow dominated his latest rehab outing on August 14, firing 3.2 hitless innings with eight strikeouts on just 67 pitches against live hitters. He has one final rehab assignment scheduled for August 19 and could rejoin the big-league rotation as early as the August 25 series at Atlanta. Glasnow's stuff looked electric — his fastball was sitting in the upper 90s and his slider was generating swings and misses at an elite rate. If he returns at full strength, the Dodgers' October rotation conversation becomes significantly more complicated, in the best possible way.\n\nBlake Snell, meanwhile, made his return from a three-month elbow injured-list stint on August 12 and promptly struck out 10 batters over six innings against the Brewers. It was a vintage Snell performance — a devastating mix of curveballs and changeups that had Milwaukee hitters guessing all night. His ability to slot into the rotation as a frontline arm gives Dave Roberts a luxury that few managers in baseball can match: four potential aces available for a short postseason series. Snell's return also takes pressure off the younger arms in the system, allowing them to settle into lower-leverage roles where their development can continue without the weight of October expectations.\n\nShohei Ohtani threw a full-mix bullpen session on August 14, his most significant step yet toward a September return to the mound. Ohtani hasn't pitched since July 3 due to left knee inflammation and right biceps discomfort, but the bullpen session — which featured his full arsenal of fastball, slider, splitter, and curveball — went well enough that the organization is now openly targeting a September activation. He remains available as designated hitter in the interim, and his bat continues to produce at an elite level, but getting his arm back for the final month of the regular season would be a game-changer for the Dodgers' October aspirations. A rotation featuring Ohtani, Glasnow, Snell, and Yoshinobu Yamamoto is the kind of staff that wins championships.\n\nNot everything is rosy in the bullpen, however. Edwin Díaz has now blown saves in three of his last four appearances as he continues to work his way back from elbow surgery. The closer's velocity is still below his pre-surgery peak, and his command has wavered at critical moments. The Dodgers are publicly sticking with him in the role, but there is growing internal concern about whether Díaz can be trusted in a high-leverage October situation. The backend of this bullpen — which also features Kirby Yates and a returning Brock Stewart — has the pieces to compensate, but a dominant closer changes the entire complexion of a postseason series. Díaz's ability to stabilize over the final six weeks of the regular season is arguably the most important variable facing this franchise right now.\n\nOn the position-player front, Dave Roberts sat Kyle Tucker on August 16 for a mental-reset day, with the outfielder mired in a brutal home-plate slump and hitting in the .200 range at Dodger Stadium. Roberts downplayed the move, calling it a day to recharge, and Tucker's track record suggests this is a short-lived concern at most. The Dodgers are also encouraged by Will Smith's progress — the catcher took on-field batting practice for the first time since his June 11 neck injury and is targeting a September return. Brock Stewart and Blake Treinen both threw simulated sessions this week, with minor-league rehab assignments imminent. The roster is getting healthy at exactly the right time, and that depth — both in the rotation and in the lineup — is what separates pretenders from contenders in October.\n\nWhat matters now: The Dodgers' path to October dominance runs directly through pitching depth. Glasnow, Snell, and a handful of key relievers on the verge of returning could give this rotation the firepower to match anyone in the National League. But the Díaz situation must be resolved before the postseason, because Los Angeles cannot afford a leaky closer in a best-of-five series. The offense will be fine — it always is — but this pitching staff's ability to stay healthy and perform under pressure will determine whether the Dodgers are celebrating in November or watching from home.", "analysis_zh": "道奇隊在庫爾斯球場系列賽首戰中炸裂11分大破科羅拉多，擺脫了對釀酒人1勝3敗的低迷主場系列賽——那段期間四場比賽中有三場得分不超過兩分。以75勝51敗的戰績，洛杉磯在國聯西區握有八個勝差的領先優勢——這是國聯最大的分區領先——看起來即將再度晉級季後賽。打線需要這樣的一場爆發來在最後衝刺階段重拾信心，而庫爾斯球場一如既往地為球隊找回節奏提供了完美舞台。\n\n然而，真正的故事在投手丘上的軍備競賽。Tyler Glasnow在8月14日的最新一場復健登板中展現壓制力，投出3.2局無安打、8次三振，僅用67球對決實戰打者。他還剩一次復健任務，預計8月19日進行，最快可在8月25日亞特蘭大系列賽重返大聯盟輪值。Glasnow的球威看起來十足犀利——速球維持在90英哩後段，滑球產生的揮空率達到頂尖水準。如果他以全力狀態回歸，道奇隊的十月輪值討論將變得更加複雜，而且是以最好的方式。\n\n與此同時，Blake Snell在8月12日從為期三個月的肘部傷病名單回歸，隨即在對釀酒人的比賽中投出6局10次三振的復出之作。這是一場經典的Snell演出——變速球和曲球的破壞力組合讓密爾瓦基打者整晚都在猜測。他能以frontline arm的身份切入輪值，賦予Dave Roberts一種很少有棒球總教練能匹配的奢侈：在短期季後賽中擁有四名潛在的王牌投手可用。Snell的回歸也減輕了系統中年輕投手的壓力，讓們能安頓在較低壓力的角色中，在沒有十月期望重擔的情況下持續發展。\n\nShohei Ohtani在8月14日進行了一次完整球種的牛棚練習，這是他朝九月重返投手丘邁出的最重要一步。Ohtani自7月3日以來就沒有投球，原因是左膝發炎和右二頭肌不適，但這次涵蓋速球、滑球、指叉球和曲球完整武器庫的牛棚練習進展順利，球團現在公開瞄准九月激活。在此期間他仍可擔任designated hitter，而他的球棒持續以頂尖水平產出，但在例行賽最後一個月讓他的手臂回來，將對道奇隊的十月目標產生質變。一個包含Ohtani、Glasnow、Snell和山本由伸的輪值，是那种能贏得總冠軍的投手群。\n\n然而，並非所有事情都一帆風順。Edwin Díaz在最近四次救援機會中搞砸了三次，他仍在努力從手術中恢復。這位closer的球速仍低於術前巅峰，關鍵時刻的控球也出現動搖。道奇隊公開表示讓他繼續擔任closer，但內部對於Díaz能否在十月高壓力情境中被信任的擔憂日益增長。這支牛棚的後段——包括Kirby Yates和即將回歸的Brock Stewart——有足夠的零件來補償，但一位統治級的closer會改變整個季後賽系列賽的面貌。Díaz在例行賽最後六週穩定表現的能力，可以說是這支球隊目前面臨的最重要變數。\n\n在野手方面，Dave Roberts在8月16日讓Kyle Tucker休息一天進行心理調整，這位外野手在道奇球場陷入嚴重低潮，打擊率僅在兩成左右。Roberts淡化了這個舉動，稱其為充電日，而Tucker的往績記錄顯示這頂多是短期擔憂。道奇隊也對Will Smith的復出進展感到振奮——這位捕手在6月11日頸部受傷後首次進行場內打擊練習，目標九月回歸。Brock Stewart和Blake Treinen本週都進行了模擬投球，小聯盟復健任務即將展開。球隊正在正確的時間點恢復健康，而這種深度——無論是在輪值還是打線中——正是季後賽中區分投機者和競爭者的關鍵。\n\n現在的關鍵：道奇隊通往十月統治之路直接取決於投手深度。Glasnow、Snell和幾位即將回歸的後援投手，能賦予這支輪值足以匹敵國聯任何對手的火力。但Díaz的問題必須在季後賽前解決，因為洛杉磯無法在五戰三勝的系列賽中承受一個不穩定的closer。打線不會有問題——它從來不會——但這支投手群在壓力下保持健康和表現的能力，將決定道奇隊是在十一月慶祝還是在家觀賽。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "Ranked 14th with a Heisman-Caliber QB, but O'Connor's Injury and a New Defense Define the Ceiling", "headline_zh": "排名第14、擁有海斯曼級四分衛，但O'Connor傷勢與新防守體系決定上限", "analysis": "USC checks in at No. 14 in the preseason AP Poll — tied with BYU at 839 points — and the Trojans are the only ranked team opening the 2026 season in Week 0, hosting San Jose State on August 29. For Lincoln Riley's program, the ranking represents a floor, not a ceiling: this is a roster built to compete for a Big Ten title and a College Football Playoff berth, and anything less than that would be considered a disappointment. The early-season schedule offers a manageable ramp before the gauntlet of conference play, and that Week 0 head start could prove valuable for a team still integrating new pieces on both sides of the ball.\n\nJayden Maiava, the redshirt senior quarterback who led the nation with a 91.2 QBR last season, has been named to the Walter Camp Player of the Year Award preseason watch list, adding to Maxwell Award and Wuerffel Trophy nominations that already adorned his résumé. Maiava threw for 3,711 yards and 24 touchdowns in 2025, finishing with the nation's top-ranked passing offense at 296.0 yards per game, and he returns with31 career starts under his belt — an experience level that few quarterbacks in college football can match. His rapport with Riley's system is well-established, and the expectation is that Maiava will take another leap in Year 2 as the unquestioned starter. Six USC quarterbacks have won the Walter Camp award, including O.J. Simpson, Marcus Allen, Matt Leinart, Reggie Bush, and Caleb Williams — Maiava has the talent to join that list.\n\nThe one significant blow is the loss of starting center Kilian O'Connor, a Rimington Trophy watch list selection, to a season-ending non-contact leg injury suffered during fall camp on August 6. Lincoln Riley called it a \"tough blow,\" and the offensive line must now reconfigure with transfer portal addition J'Ore Reed stepping in at center. Losing a Rimington-caliber center is never ideal, particularly for a team that wants to establish the running game to complement its aerial attack. SI broke down how USC plans to restructure its offensive line to mask the loss, and the early returns suggest the coaching staff believes the drop-off can be minimized through schematic adjustments. Still, offensive line chemistry takes time to build, and the first few games will reveal whether Reed can handle the demands of Big Ten defensive fronts.\n\nThe bigger narrative heading into the season is the new era on defense. Gary Patterson, the legendary former TCU head coach with a career record that includes a national championship game appearance, has taken over as defensive coordinator after D'Anton Lynn departed for Penn State. Patterson brought in Paul Gonzales as safeties coach, reuniting with a longtime TCU assistant who knows his system inside and out. USC's defense was a liability at times last season — vulnerable to explosive plays and inconsistent against the run — and Patterson's track record of building elite college defenses makes this the most intriguing subplot of fall camp. The question is how quickly Patterson can install his scheme and get the players to buy in, particularly with five-star defensive tackle Jahkeem Stewart and five-star offensive tackle Keenyi Pepe headlining a recruiting class ranked No. 1 nationally. That talent is real, but talent without scheme is just potential.\n\nLincoln Riley set the stakes at Big Ten Media Days, declaring that the \"championship window is open\" and that USC has the talent and infrastructure to compete for a national title. \"We came here to win championships. We certainly didn't come here for anything less,\" Riley said, framing Year 5 as the moment where the rebuild transitions to contention. The $200 million Bloom Football Performance Center, which opened for fall camp on July 30, is a physical manifestation of that ambition — Riley reportedly spent five consecutive days inside the facility without leaving. But ambition must be matched by execution, and the Trojans' ability to avoid the kind of inexplicable Big Ten losses that derailed their 2025 playoff hopes will determine whether Riley's championship declaration rings hollow or prophetic.\n\nWhat matters now: The combination of Maiava's elite production, Patterson's defensive pedigree, and a top-ranked recruiting class makes USC a legitimate Big Ten contender. But O'Connor's injury, the question of whether Patterson can quickly modernize the defense, and the program's history of close, inexplicable losses will determine whether the Trojans can survive a brutal schedule and break through to the College Football Playoff. This is a team with championship-level talent — the question is whether it has championship-level execution.", "analysis_zh": "USC在 preseason AP Poll 排名第14——與BYU並列839分——這也是2026年賽季唯一在第0週開幕的排名球隊，將於8月29日迎戰聖荷西州立大學。對Lincoln Riley的項目而言，這個排名代表的是下限而非上限：這是一支被打造來競爭Big Ten冠軍和College Football Playoff席位的陣容，任何低於這個標準的結果都將被視為失望。賽季初期的賽程在會議賽的考驗前提供了可控的爬坡期，而第0週的搶先開機，對一支仍在兩側整合新拼圖的球隊來說，可能被證明是寶貴的。\n\nJayden Maiava，這位去年以91.2 QBR領先全國的redshirt senior quarterback，入選了Walter Camp年度球員獎的preseason watch list，加上Maxwell Award和Wuerffel Trophy的提名，豐富了他的履歷。Maiava在2025年傳出3,711碼和24個達陣，以每場296.0碼的傳球進攻排名全國第一，並帶著31場職業生涯先發經驗回歸——這種經驗水準在大學橄欖球界少有四分衛能匹配。他與Riley體系的默契已牢固建立，預期Maiava將在第二年作為無可爭議的先發再上一層樓。六位USC四分衛贏得過Walter Camp獎項，包括O.J. Simpson、Marcus Allen、Matt Leinart、Reggie Bush和Caleb Williams——Maiava有實力加入這個行列。\n\n然而，一個重大打擊是先發center Kilian O'Connor因非接觸性腿部傷害賽季報銷，這位Rimington Trophy watch list球員在8月6日的秋季訓練營中受傷。Lincoln Riley稱之為「艱難的打擊」，進攻線現在必須重新配置，由轉學portal addition J'Ore Reed接替center位置。失去一名Rimington等級的center從來不是理想情況，特別是對一支想要建立跑陣來 complement 傳球進攻的球隊而言。SI分析了USC計劃如何重組進攻線以掩蓋損失，早期回報顯示教練團隊相信透過戰術調整可以將落差最小化。但進攻線的化學反應需要時間培養，前幾場比賽將揭示Reed能否應對Big Ten防守前線的要求。\n\n進入賽季的更大故事線是防守新紀元。Gary Patterson，這位傳奇的前TCU head coach，執教生涯包括全國冠軍賽的出場紀錄，在D'Anton Lynn轉往Penn State後接任defensive coordinator。Patterson帶來了Paul Gonzales擔任safeties coach，與這位了解他體系的長期TCU助手重聚。USC的防守在上季有時成為軟肋——容易被大 plays 攻破且對跑陣防禦不穩定——而Patterson打造頂級大學防守的往績，使他成為秋季訓練營最引人入勝的副線。問題在於Patterson能多快安裝他的戰術並讓球員買單，特別是當五星defensive tackle Jahkeem Stewart和五星offensive tackle Keenyi Pepe領銜一個排名全國第一的招募班級時。天賦是真實的，但沒有戰術的天賦只是潛力。\n\nLincoln Riley在Big Ten Media Days上設定 stakes，宣稱「冠軍窗口已經打開」，USC有天賦和基礎設施競爭全國冠軍。「我們來這裡是為了贏得冠軍。我們當然不是為了任何低於此的目標而來，」Riley說，將第五年定位為重建轉向爭冠的時刻。價值2億美元的Bloom Football Performance Center在7月30日開放秋季訓練營使用，是那個雄心壯志的實體體現——Riley據報在設施內連續待了五天沒有離開。但雄心必須與執行力相匹配，而Trojans能否避免那種令人費解的Big Ten失利——正是這種失利在2025年破壞了他們的季後賽希望——將決定Riley的冠軍宣言是空洞還是預言。\n\n現在的關鍵：Maiava的頂級表現、Patterson的防守血統和頂級招募班級的結合，使USC成為Big Ten的正統競爭者。但O'Connor的傷病、Patterson能否快速改造防守的問題，以及該項目在接近且令人費解的失利歷史，將決定Trojans能否在艱難的賽程中生存並突破進入College Football Playoff。這是一支擁有冠軍級天賦的球隊——問題在於它是否具備冠軍級的執行力。"}, {"team": "Rams", "accent": "#003594", "headline": "Simpson Shines in Preseason Rout of Chiefs; Aaron Donald's Return Looms Over Everything", "headline_zh": "Simpson在季前賽大勝酋長隊中脫穎而出；Aaron Donald的回歸陰影籠罩一切", "analysis": "The Rams opened their preseason with a convincing 20-12 victory over the Kansas City Chiefs, and the headline performance belonged to rookie quarterback Ty Simpson. The No. 13 overall pick commanded the offense with poise and precision, connecting with tight end Max Klare for his first professional touchdown pass and earning praise from Sean McVay for his comfort and pocket presence under the bright lights of a preseason showcase. Matthew Stafford, fresh off an NFL MVP campaign in which he threw for 4,707 yards and 46 touchdowns, reportedly told Simpson before kickoff: \"Just go let it rip.\" Simpson listened. His ability to process reads quickly, move within the pocket, and deliver accurate passes under pressure suggests the Rams may have found their quarterback of the future — or at the very least, a backup they can trust implicitly if Stafford misses time.\n\nTheAaron Donald situation continues to simmer, and it may be the single most important subplot in the entire NFL heading into September. The retired defensive tackle completed his second official workout with the Rams on Sunday, and McVay reiterated that there is \"no invisible deadline\" — the decision will be entirely on Donald's timeline. McVay has been careful not to apply public pressure, but the subtext is unmistakable: the Rams believe Donald can still play at an elite level, and they are leaving the door wide open for him to return. If Donald does come back, a pairing with Myles Garrett — who returned to practice on Day 9 of training camp after dealing with lower-half soreness that McVay characterized as purely precautionary — would give Los Angeles arguably the most fearsome pass-rushing duo in the NFL. Garrett's return was smooth, and he is expected to be fully ready for the Week 1 opener in Melbourne, Australia, against the 49ers on September 10.\n\nHealth concerns across the roster are manageable but worth monitoring. Wide receiver Puka Nacua left joint practice with the Cowboys early with psoas soreness, but McVay expects him back next week and emphasized that the injury is not structural. Nacua's availability is critical to the Rams' offensive identity — his ability to win contested catches and create yards after the catch is a cornerstone of what makes this passing game function at a high level. On the other side of the ball, Garrett's brief absence was a reminder that the Rams' defensive ceiling is directly tied to his health. A fully operational Myles Garrett changes blocking schemes, demands double teams, and opens up lanes for everyone else on the defensive front. The Rams can survive a game or two without him in September; they cannot survive a playoff run without him in January.\n\nSpecial teams provided one of the more compelling storylines of the preseason opener. Return specialist Xavier Smith delivered a 40-yard punt return in the fourth quarter that set up a touchdown, effectively shutting down any roster-bubble drama surrounding his spot on the t let lang = "en";
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmtPT(iso){ return new Date(iso).toLocaleString("en-US",{timeZone:"America/Los_Angeles",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"})+" PT"; }

function renderDigest(d){
  const box = document.getElementById("digest");
  if(!d || !d.segments){
    box.innerHTML = '<div style="text-align:center;color:var(--dim);padding:40px">No digest yet</div>';
    return;
  }
  const segs = d.segments.map(s=>{
    const headline = lang==="en" ? s.headline : s.headline_zh;
    const analysis = lang==="en" ? s.analysis : s.analysis_zh;
    return '<div class="seg" style="--team:'+esc(s.accent)+'">' +
      '<div class="row"><span class="hn">'+esc(headline)+'</span><span class="badge">'+esc(s.team)+'</span></div>' +
      '<div class="lbl">'+(lang==="en"?"Analysis":"分析")+'</div><p>'+esc(analysis)+'</p>' +
      '</div>';
  }).join("");
  box.innerHTML =
    '<div class="dhead">' +
      '<div class="t"><div class="mic">🎙️</div><div><h2>'+esc(d.title)+'</h2><div class="meta">' +
        esc(d.read_time || "")+' · '+fmtPT(d.updated_at)+
        ' · 繁中/EN</div></div></div>' +
      '<div class="langs">'+
        '<button id="btnEn" class="on" onclick="setLang(\'en\')">EN</button>'+
        '<button id="btnZh" onclick="setLang(\'zh\')">繁體中文</button>'+
      '</div>' +
    '</div>' +
    '<div class="intro">'+esc(lang==="en"?d.intro:d.intro_zh)+'</div>' +
    '<div class="segs">'+segs+'</div>' +
    '<div class="closing">'+esc(lang==="en"?d.closing:d.closing_zh)+'</div>';
}
function setLang(v){ lang = v; document.getElementById("btnEn").classList.toggle("on", v==="en"); document.getElementById("btnZh").classList.toggle("on", v==="zh"); renderDigest(DIGEST_DATA); }

function renderNews(d){ const upd = document.getElementById("upd"); if(upd) upd.textContent = fmtPT(d.updated_at);
  const g = document.getElementById("grid"); g.innerHTML = "";
  for(const t of d.teams){
    const c = document.createElement("div"); c.className = "card"; c.style.setProperty("--team", t.accent);
    const emoji = t.emoji==="Baseball"?"⚾":t.emoji==="Football"?"🏈":"🏆";
    c.innerHTML =
      '<div class="top"><div class="ico">' + emoji + '</div>' +
      '<div><div class="name">' + esc(t.name) + '</div><div class="rec">' + t.sport + ' · ' + esc(t.record) + '</div></div></div>' +
      '<div class="hline">' + esc(t.headline) + '</div>' +
      '<h3>Latest News</h3><ul class="news">' + t.latest_news.map(n =>
        '<li><a target="_blank" rel="noopener" href="' + esc(n.url) + '">' + esc(n.title) + '</a><p>' + esc(n.summary) + '</p></li>'
      ).join("") + '</ul>' +
      '<h3>Fun Facts</h3><ul class="facts">' + t.fun_facts.map(f => '<li>'+esc(f)+'</li>').join("") + '</ul>' +
      '<h3>Further Reading</h3><ul class="read">' + t.further_reading.map(f =>
        '<li><a target="_blank" rel="noopener" href="' + esc(f.url) + '"><span>'+esc(f.title)+'</span><span class="why">'+esc(f.why)+'</span></a></li>'
      ).join("") + '</ul>' +
      '<div class="oss">' + esc(t.one_sentence) + '</div>';
    g.appendChild(c);
  }
}

renderDigest(DIGEST_DATA);
renderNews(TEAMS_DATA);
</script>
