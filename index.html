<title>LA Sports Fan</title>
<style>
  :root{
    --bg:#0b0e14; --panel:rgba(255,255,255,.04); --panel2:rgba(255,255,255,.02);
    --line:rgba(255,255,255,.08); --fg:#edf2fa; --dim:#8a94a6;
    --radius:18px; --glow:0 0 0 1px rgba(255,255,255,.04), 0 24px 60px -30px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 500px at 20% -10%, rgba(42,111,216,.18), transparent 60%),
      radial-gradient(1000px 500px at 90% -10%, rgba(153,0,0,.14), transparent 60%),
      radial-gradient(900px 400px at 50% 110%, rgba(31,78,156,.16), transparent 60%),
      var(--bg);
    color:var(--fg); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
    padding:28px clamp(16px,4vw,64px) 64px;
  }
  header{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:26px}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{
    width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;
    background:linear-gradient(135deg,#2a6fd8,#991111);box-shadow:0 8px 30px -8px rgba(60,90,220,.6);
  }
  h1{font-size:clamp(22px,3vw,32px);font-weight:800;letter-spacing:-.02em}
  .sub{color:var(--dim);font-size:13px;margin-top:4px}
  .ticker{
    font-size:12px;color:var(--dim);padding:8px 14px;border-radius:99px;
    background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);
  }
  .ticker b{color:#7ce38b}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:20px}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;backdrop-filter:blur(14px);box-shadow:var(--glow);position:relative;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--team,#2a6fd8),transparent);
  }
  .top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .ico{
    width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;
    background:color-mix(in srgb,var(--team) 22%, transparent);
  }
  .name{font-size:18px;font-weight:800;letter-spacing:-.01em}
  .rec{font-size:11px;color:var(--team);font-weight:700;margin-top:2px}
  .hline{font-size:13px;line-height:1.5;color:var(--dim);padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);margin-bottom:16px}
  h3{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
  h3::after{content:"";flex:1;height:1px;background:var(--line)}
  .news{list-style:none}
  .news li{padding:10px 12px;border-radius:12px;margin-bottom:6px;background:var(--panel2);border:1px solid var(--line);transition:.2s}
  .news li:hover{border-color:color-mix(in srgb,var(--team) 50%, transparent);transform:translateX(3px)}
  .news a{color:var(--fg);text-decoration:none;font-weight:700;font-size:13px;display:block;margin-bottom:4px}
  .news a:hover{color:var(--team)}
  .news p{font-size:12px;color:var(--dim);line-height:1.5}
  .facts{list-style:none;display:grid;gap:6px}
  .facts li{position:relative;padding:2px 0 2px 18px;font-size:12.5px;color:var(--fg);line-height:1.55}
  .facts li::before{content:"⚡";position:absolute;left:0;top:2px;font-size:11px;filter:grayscale(.4)}
  .read{list-style:none;display:grid;gap:6px}
  .read a{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12.5px;color:var(--fg);text-decoration:none;padding:9px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
  .read a:hover{color:var(--team);border-color:color-mix(in srgb,var(--team) 50%, transparent)}
  .read .why{font-size:11px;color:var(--dim)}
  .oss{font-size:12.5px;line-height:1.6;color:var(--fg);background:linear-gradient(90deg,color-mix(in srgb,var(--team) 18%,transparent),transparent);border-left:3px solid var(--team);padding:10px 14px;border-radius:0 12px 12px 0;margin-top:16px}
  banner{display:block;text-align:center;color:var(--dim);font-size:13px;margin-top:22px}
  banner span{color:#7ce38b;animation:blink 1.5s infinite}
  @keyframes blink{50%{opacity:.3}}
  .spin{width:100%;height:100px;display:grid;place-items:center;color:var(--dim)}
  /* ---- digest ---- */
  .digest{
    background:linear-gradient(135deg,rgba(42,111,216,.12),rgba(153,0,0,.10),rgba(31,78,156,.12)),var(--panel);
    border:1px solid var(--line);border-radius:var(--radius);padding:26px;
    backdrop-filter:blur(14px);box-shadow:var(--glow);margin-bottom:22px;
  }
  .dhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;margin-bottom:14px}
  .dhead .t{display:flex;align-items:center;gap:12px}
  .mic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:linear-gradient(135deg,#2a6fd8,#991111)}
  .dhead h2{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .dhead .meta{color:var(--dim);font-size:12px;margin-top:3px}
  .langs{display:flex;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:4px}
  .langs button{border:0;background:transparent;color:var(--dim);font-size:12px;font-weight:700;padding:6px 16px;border-radius:99px;cursor:pointer;transition:.2s}
  .langs button.on{background:linear-gradient(135deg,#2a6fd8,#1f4e9c);color:#fff}
  .intro{font-size:14px;line-height:1.65;color:var(--fg);max-width:820px;margin-bottom:18px}
  .segs{display:grid;gap:12px}
  .seg{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--panel2)}
  .seg .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .seg .row .hn{font-weight:800;font-size:14.5px}
  .seg .badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--team,#2a6fd8) 20%,transparent);color:var(--team);white-space:nowrap}
  .seg p{font-size:12.5px;line-height:1.6;color:var(--dim);margin-top:6px}
  .seg p.cls{color:var(--fg)}
  .seg .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin-top:10px;font-weight:700}
  .closing{font-size:14px;line-height:1.6;border-top:1px dashed var(--line);margin-top:16px;padding-top:14px;color:var(--fg)}
</style>
</head>

 was placed on IR, ending his 2026 season before it started. McVay said he was 'gutted' for the veteran defender.", "url": "https://theramswire.usatoday.com/story/sports/nfl/rams/2026/08/25/rams-injuries-sean-mcvay-keir-thomas-practice/91453760007/"}, {"title": "Rams go all-in: Myles Garrett trade pairs reigning MVP Stafford with reigning DPOY", "summary": "The blockbuster June trade sent Jared Verse and three draft picks to Cleveland for Garrett, who broke the NFL single-season sack record with 23 in 2025. The Rams are the first team in NFL history to pair the reigning MVP and Defensive Player of the Year on the same roster.", "url": "https://www.espn.com/nfl/story/_/id/48939456/sources-browns-rams-finalizing-myles-garrett-blockbuster-trade"}, {"title": "Sean McVay managing Matthew Stafford workload; extension signed at $55M", "summary": "McVay is taking a conservative approach with the 38-year-old Stafford, who won MVP in 2025 after leading the NFL in touchdowns. Stafford signed a $55 million extension and is following a strict offseason regimen designed to keep him healthy through the regular season.", "url": "https://heavy.com/sports/nfl/los-angeles-rams/rams-sean-mcvay-matthew-stafford-approach/"}], "fun_facts": ["The Rams are the first team in NFL history to pair the reigning MVP (Stafford) and reigning Defensive Player of the Year (Garrett) on the same roster.", "Myles Garrett broke the NFL single-season sack record with 23 sacks in 2025, surpassing the mark held by Michael Strahan and T.J. Watt.", "Rams coach Sean McVay is 18-9 SU and 20-7 ATS (74%) in divisional road games during his tenure — the best mark among active coaches.", "The Rams' Week 1 game against the 49ers will be played in Melbourne, Australia — the first NFL regular-season game ever held in the Southern Hemisphere.", "Puka Nacua led the NFL with 129 receptions and 1,715 receiving yards in 2025, while Davante Adams led the league in receiving touchdowns."], "further_reading": [{"title": "Final Rams 53-man roster projection", "why": "Comprehensive look at who makes the team after the Atwell trade and preseason finale", "url": "https://theramswire.usatoday.com/story/sports/nfl/rams/2026/08/28/rams-53-man-roster-projection-tutu-atwell-trade-preseason/91487974007/"}, {"title": "NFC West predictions and odds for 2026", "why": "Deep dive into how the Rams, Seahawks, 49ers, and Cardinals stack up heading into the season", "url": "https://www.covers.com/nfl/nfc-west-predictions-odds-best-picks-2026"}, {"title": "Is this Sean McVay's best Rams roster yet?", "why": "Ranking every team in the McVay era to contextualize how loaded the 2026 squad is", "url": "https://www.si.com/nfl/rams/onsi/rams-sean-mcvay-best-teams-ranked-2026-roster"}, {"title": "Aaron Donald comeback speculation continues", "why": "The Garrett trade reignited talk of Donald un-retiring to join forces with the new defensive line", "url": "https://www.dailynews.com/2026/07/23/7-rams-training-camp-questions-will-aaron-donald-un-retire/"}, {"title": "Rams 2026 schedule: Game-by-game predictions", "why": "Full breakdown of the season slate including the Australia opener and critical NFC West matchups", "url": "https://www.dailynews.com/2026/05/15/los-angeles-rams-2026-schedule-game-by-game-breakdown-and-predictions/"}], "one_sentence": "The Rams are all-in for 2026 after pairing MVP Matthew Stafford with DPOY Myles Garrett, but the looming Puka Nacua suspension and Sunday's roster cuts will shape whether this Super Bowl-favorite roster can deliver on its massive potential."}]};
const DIGEST_DATA = {"updated_at": "2026-08-28T06:00:04-07:00", "title": "LA Sports Daily Digest — 15-Minute Edition", "read_time": "~15 minutes", "intro": "It's Friday in Los Angeles and the sports calendar is stacked to the rafters. The Dodgers limp out of Atlanta after a sweep at the hands of Chris Sale and the Braves — yet they head to Detroit quietly optimistic, with Shohei Ohtani on the verge of his first start since July and Tyler Glasnow already back in a rotation finally approaching full strength. USC opens its season Saturday at the Coliseum with Jayden Maiava chasing Heisman buzz and Lincoln Riley chasing the program's first College Football Playoff berth, while the Rams close a perfect preseason and stare down Sunday's 53-man cutdown with a Puka Nacua suspension still hanging overhead. Everything that matters, in 15 minutes.", "intro_zh": "洛杉磯的週五，體育賽程滿檔。道奇在亞特蘭大遭 Chris Sale 與勇士橫掃後黯然離場——但他們帶著低調的樂觀前往底特律，Shohei Ohtani 距離 7 月以來首度先發出賽僅一步之遙，Tyler Glasnow 也已歸隊，先發輪值終於接近完全體。USC 週六在紀念體育館開季，Jayden Maiava 力拼海斯曼獎呼聲，Lincoln Riley 則追求校史首度闖進大學美足季後賽；公羊則以季前賽全勝收官，在週日 53 人名單截止日前，頭上還懸著 Puka Nacua 可能禁賽的變數。十五分鐘，帶你看懂所有重點。", "segments": [{"team": "Dodgers", "accent": "#2A6FD8", "headline": "Chris Sale's Vintage Masterpiece Leaves the Dodgers Swept, Shut Out and Staring at a Shrinking Margin", "headline_zh": "Chris Sale 生涯級完封讓道奇遭橫掃又遭完封，季後賽容錯空間急速縮小", "analysis": "Chris Sale was untouchable in the series finale, striking out 11 with zero walks over nine shutout innings while limiting the Dodgers to five hits in the 1-0 loss that completed a three-game sweep at Truist Park. It was his first complete game in more than seven years and the 17th of his career, and the 100.1 mph fastball he fired to Shohei Ohtani in the third inning was his first triple-digit pitch since July 2018 in Boston.\n\nThe lone run came on Drake Baldwin's leadoff home run off Yoshinobu Yamamoto — a reminder of how thin these margins are. The Dodgers went 0-for-3 with runners in scoring position and stranded seven runners. On most nights that's a winnable game; against Sale at that level it becomes a 1-0 loss.\n\nThe bigger concern is the trend, not the single game. Since July 31 the Dodgers are 2-13 against teams currently holding a playoff spot. That isn't the kind of slump against inferior clubs you shrug off; it's a small-sample red flag against exactly the class of opponent October will present. The Athletic's piece on LA's shrinking margin for error said it plainly: this schedule does not get easier.\n\nThere's a standings cost, too. At 80-54, the Dodgers sit three games behind the Brewers for the best record in baseball and hold just a one-game lead over the Braves for the NL's No. 2 seed — a seed that carries home-field implications through the Division Series.\n\nAnalyst take: This is where we find out what the Dodgers are truly made of. The rotation reinforcements are arriving, but October baseball is decided by depth, late-inning execution and the bat in the middle of the order. If Kyle Tucker's benching Thursday was the wake-up call this lineup needed, fine; if not, a superstar-laden offense that goes quiet against elite pitching is a genuine problem — not a narrative.", "analysis_zh": "Chris Sale 在系列賽最終戰完全壓制道奇打線，九局送出 11 次三振、零保送，只被敲出五支安打，幫助勇士以 1:0 完封道奇並在三連戰完成橫掃。這是 Sale 相隔七年多來首度投出完封勝，也是生涯第 17 場；第三局面對 Shohei Ohtani 所投出的 100.1 英哩速球，更是他自 2018 年 7 月效力紅襪以來首度飆破三位數。\n\n全場唯一失分來自 Drake Baldwin 棒打 Yoshinobu Yamamoto 的首局首打席全壘打，足見勝負只在毫釐之間。道奇得點圈打擊三支零、留下七個殘壘，碰上今晚狀態的 Sale，這就成了一場 1:0 的敗仗。\n\n更值得注意的是長期趨勢，而不只是單場失利。自 7 月 31 日以來，道奇對上目前穩居季後賽席次的球隊戰績僅 2 勝 13 敗。這不是可以一笑置之的對弱隊低潮，而是在面對十月對手等級時出現的警訊。The Athletic 分析道奇容錯空間縮小的文章講得很直接：接下來的賽程不會變輕鬆。\n\n排名也有代價。道奇目前 80 勝 54 敗，落後釀酒人三場勝差，爭奪全大聯盟最佳戰績；對勇士僅握有一場勝差優勢，爭國聯第二種子——這個席次將牽動分區系列賽的主場優勢。\n\n分析師觀點：這是檢驗道奇真材實料的時候。先發輪值援軍陸續到位，但十月勝負往往取決於深度、比賽後段的執行力，以及打線中段那根大棒。如果 Kyle Tucker 週四被冰是這條打線需要的當頭棒喝，那再好不過；若不是，這支星光熠熠、卻在面對頂級投手時屢屢熄火的打線，就會成為真正的隱憂，而不是單純的故事話題。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "LA's Bats Have Gone Quiet Exactly When the Schedule Turns: 2-13 vs Playoff Teams, Tucker Benched", "headline_zh": "道奇打線在賽程最硬時刻熄火：對季後賽球隊 2 勝 13 敗，Tucker 遭冰凍", "analysis": "The sweep felt almost inevitable precisely because of how the bats have performed since the deadline additions arrived. Since July 31, Los Angeles is 2-13 against clubs sitting in playoff position, and the timing could not be worse: the remaining schedule is littered with division rivals and contenders who will test precisely this weakness.\n\nThe poster child for the slide is Kyle Tucker, acquired in the winter's marquee trade to anchor the middle of the order. Over his last 15 games he's hit a stunning .113/.190/.132, a line that led to his benching Thursday against Sale. When your biggest bat of the winter is a non-factor, the entire lineup's math changes.\n\nIt's not just Tucker. The club stranded seven runners and went 0-for-3 with runners in scoring position in the 1-0 loss, continuing a pattern of leaving offense on the bases against elite pitching. Rallies stall, the top of the order gets pitched around, and suddenly a lineup built to score in bunches looks mortal.\n\nContext matters: this is the same core that can explode for 10 runs on any given night, and the pending returns of health — Glasnow already back, Ohtani potentially on the mound — keep the talent floor high. The concern is sequencing, strikeout-heavy stretches against spin, and the cumulative mental toll of losing low-scoring games in a row.\n\nAnalyst take: Benching Tucker is a manager sending a message to a hitter who sees the same film we do. Teams that thrive in October have a No. 3 hitter who can beat you single-handedly; right now the Dodgers don't have that version of Tucker. The Detroit series, in a friendly park and against a familiar face in Tarik Skubal, is a chance to rediscover the swing before the schedule turns truly brutal.", "analysis_zh": "橫掃幾乎是意料之中，因為大限交易援軍到位之後，打線的表現正是如此。自 7 月 31 日以來，道奇對上目前位居季後賽席次的球隊僅有 2 勝 13 敗，而且時間點再糟糕不過：接下來的賽程充斥著分區對手與爭冠勁旅，恰好會反覆考驗這個弱點。\n\n這波下滑的代表人物正是 Kyle Tucker——冬季最大交易案中為道奇扛起打線中段的大棒。他在近 15 場比賽中繳出驚人的 .113/.190/.132，這份成績單直接導致他週四對 Sale 時被冰在板凳。當冬天最重要的打者毫無貢獻，整條打線的運算邏輯都會改變。\n\n問題不只 Tucker。球隊在 1:0 的敗仗中留下七個殘壘、得點圈三支零，延續了面對頂級投手時把攻勢留在壘上的老毛病。攻勢卡住、中心打線被閃躲，一支理應大量得分的打線，忽然看起來平凡無奇。\n\n但背景值得注意：同樣的核心有本事在任一夜狂灌十分，而傷兵的陸續回歸——Glasnow 已復出，Ohtani 也可能登板——把天賦下限墊得很高。真正的隱憂在於攻勢串聯、面對變化球時的三振連連，以及連敗低比分比賽累積的心理疲勞。\n\n分析師觀點：冰 Tucker 是總教練在向一位看著同樣比賽錄影的打者傳遞訊息。十月能成功的球隊，第三棒必須有單手擊倒對手的本事；現在的 Tucker 不是這個版本。底特律系列賽在對打者友善的球場進行，還要面對熟悉的對手 Tarik Skubal，是賽程徹底轉硬前找回揮棒節奏的最佳機會。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Roki Sasaki Hits the IL With a Blister Just as the Dodgers' Rotation Finally Gets Whole", "headline_zh": "Roki Sasaki 因水泡進傷兵名單，道奇先發輪值恰恰在此刻接近完全體", "analysis": "The Dodgers placed Roki Sasaki on the 15-day injured list with a right middle finger blister, the injury tearing open in the fourth inning of Wednesday's loss — and the timing is a frustration, because it comes in the same week the rotation finally started looking whole. Since the All-Star break Sasaki had arguably been the team's most reliable starter, posting a 3.05 ERA.\n\nEric Lauer rejoins the rotation in Sasaki's spot, and Seth Halvorsen was recalled as the corresponding roster move. Lauer is a depth arm the Dodgers have patchworked all season; the fact that he's now the No. 5 option says more about the strength of the unit when at full capacity than about Sasaki's role.\n\nThis is largely a management problem, not a structural one. The 24-year-old has been handled carefully all season, and for a pitcher whose arsenal depends on grip and command, a blister requires patience. The Dodgers' track record with pitcher health — Glasnow's careful ramp, Snell's post-surgery build-up — argues they'll let the finger rest the full 15 days and not rush.\n\nThe broader context is the logjam ahead. With Tyler Glasnow back from the 60-day IL and Shohei Ohtani trending toward his first start since July 3, the Dodgers suddenly have more rotation answers and harder choices than at any point this summer. Blake Snell has strung together three strong starts since returning from arthroscopic elbow surgery.\n\nAnalyst take: The irony of this losing week is that the pitching is trending up while the hitting has gone flat. If Ohtani and Glasnow deliver quality innings in September, the front office's entire calculus shifts, and the postseason rotation suddenly has two legitimate Game 1-caliber arms beyond Snell. Sasaki's absence is annoying, not alarming — assuming the roster holds up long enough for everyone to meet back in October.", "analysis_zh": "道奇將 Roki Sasaki 放入 15 日傷兵名單，原因是右手中指的水泡——傷勢在週三敗仗的第四局撕裂開來——而這個時間點格外令人沮喪，因為同一週輪值才終於開始成形。明星賽後 Sasaki 可說是隊上最穩定的先發投手，ERA 僅 3.05。\n\nEric Lauer 將接替 Sasaki 重返先發輪值，Seth Halvorsen 則作為對應的球員異動被召回。Lauer 是道奇整季用來填補缺口的功能性深度投手；他現在只是第五號先發這件事，與其說反映 Sasaki 的地位，不如說說明了輪值滿編時有多強。\n\n這基本上是個管理問題，而非結構性問題。這位 24 歲投手整季都被小心呵護，而對一名球路高度依賴握球與控球的投手來說，水泡需要的是耐心。道奇在投手健康管理上的紀錄——Glasnow 的循序漸進、Snell 手術後的逐步加量——表明球團會讓手指完整休滿 15 天，絕不倉促復出。\n\n更大的背景是眼前的先發人才塞車。隨著 Tyler Glasnow 從 60 日傷兵名單回歸、Shohei Ohtani 距離 7 月 3 日以來首度先發僅一步之遙，道奇忽然比今年夏天任何時刻都擁有更多的先發選擇與更艱難的取捨。Blake Snell 也自手肘關節鏡手術復出後連續三場好投。\n\n分析師觀點：這個輸球週的諷刺之處在於，投手戰力正往上升，打線卻急轉直下。如果 Ohtani 與 Glasnow 在九月交出優質局數，管理層的整個算盤都要重打，季後賽輪值將在 Snell 之外多出兩位正牌的開局先發級手臂。Sasaki 缺陣令人煩惱，卻並不令人警覺——前提是陣容能撐到大家在十月重新會合。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Ohtani Trending Toward Sunday Return in Detroit — the Postseason Rotation Puzzle Is Officially Live", "headline_zh": "Ohtani 有望週日在底特律復出登板——季後賽先發調度謎題正式浮上檯面", "analysis": "Shohei Ohtani will throw a bullpen session Friday in Detroit, and if it goes well he'll make his first pitching start since July 3 on Sunday against the Tigers — likely capped at one inning before a piggyback arm takes over. His season line in 14 starts is 9-5 with a 1.79 ERA, numbers that barely belong in the same sentence as the word \"rusty.\"\n\nThe ramp-up is deliberate, and it is aimed squarely at October. A one-inning start this weekend, a carefully escalated workload through September, and then the real question: does Ohtani headline the postseason rotation or slot behind a healthy Blake Snell or Tyler Glasnow? The New York Post has already framed it as the defining roster question of the month.\n\nThe puzzle's other piece is Glasnow, who was activated off the 60-day IL and made his season debut Tuesday with five innings against Atlanta. Nearly four months removed from a back injury, he's lined up to start or piggyback alongside Ohtani on Sunday. A healthy Glasnow was the front office's best-case scenario all summer, and here he is.\n\nPair the two with Snell, who has pitched well since June's elbow surgery, and Tarik Skubal — the deadline's signature acquisition — and the Dodgers can roll out a rotation no NL opponent wants any part of. The \"who starts Game 1\" debate is a luxury problem, but it's also the clearest sign yet of a team reaching full strength at exactly the right time.\n\nAnalyst take: Ohtani's 1.79 ERA in 14 starts spoils the narrative that he's a batting prodigy moonlighting as a pitcher. The one-inning plan on Sunday is about October, not Detroit — every leash-stretched pitch now is a pitch saved for when it matters. If both Ohtani and Glasnow deliver, the Dodgers' greatest weakness of this losing week quietly becomes their greatest edge in a month.", "analysis_zh": "Shohei Ohtani 將於週五在底特律進行牛棚練投，若一切順利，他會在週日對老虎的比賽中迎來 7 月 3 日以來首度投球先發——很可能是只投一局，再由接力投手接手。他本季 14 場先發的成績是 9 勝 5 敗、ERA 1.79，這分數據幾乎不該與「生鏽」二字出現在同一句話裡。\n\n這次加量是刻意為之，目標直指十月。本週末一局先發、九月循序漸進地拉高工作量，然後真正的問題浮現：Ohtani 該在季後賽輪值中掛頭牌，還是排在健康的 Blake Snell 或 Tyler Glasnow 之後？紐約郵報已把這題定調為這個月最重要的陣容課題。\n\n這個謎題的另一塊拼圖是 Glasnow，他從 60 日傷兵名單歸隊後，週二對勇士以五局完成本季初登板。闊別近四個月（背傷）之後，他在週日預定與 Ohtani 搭配先發或接力。健康的 Glasnow 是管理層整個夏天最理想的劇本，而他已經在這裡。\n\n把兩人與 6 月手肘手術後表現出色的 Snell、以及大限最大交易案的主角 Tarik Skubal 放在一起，道奇就能排出任何國聯對手都不想面對的先發輪值。「誰投第一場」的爭論是奢侈的煩惱，但也是球隊在最關鍵時刻達到完全戰力的最明確訊號。\n\n分析師觀點：Ohtani 14 場先發 1.79 的 ERA，粉碎了「他只是兼任投球的打擊奇才」的敘事。週日的一局限定計畫著眼於十月，而不是底特律——現在每一球勒緊的局數，都是為關鍵時刻省下的一球。如果 Ohtani 與 Glasnow 都能交出好表現，道奇這個輸球週最大的弱點，會在一個月後悄悄變成他們最大的優勢。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Tarik Skubal Returns to Detroit: the Deadline's Biggest Prize Meets the Team He Left", "headline_zh": "Tarik Skubal 重返底特律：大限最大交易案主角對決舊東家", "analysis": "The most compelling subplot of the weekend belongs to the visiting dugout. Tarik Skubal (8-7, 2.91 ERA) starts Friday at Comerica Park against the Tigers — the franchise that developed him and the team he departed in July's blockbuster deadline deal that landed him in Los Angeles.\n\nThe reunion has the kind of drama money can't buy: a two-time Cy Young winner returning to the park where he became one, across from a Tigers club that is still young and building around its own talent. Skubal's sharp numbers since the trade are precisely the reason the Dodgers sent a king's ransom to get him.\n\nContext on the series: Skubal gets the ball Friday, Blake Snell goes Saturday, and Sunday features Ohtani or Glasnow depending on how Friday's bullpen and the recovery go. It's the closest thing to a full-strength rotation preview the Dodgers can get in August — and a flagship showcase for the trade that defined their deadline.\n\nThe standings make every game count. At 80-54, the Dodgers are three games behind the Brewers for the best record in baseball and just one game up on the Braves for the NL's No. 2 seed. A bounce-back weekend in Detroit would go a long way toward erasing the sting of Atlanta.\n\nAnalyst take: Watch Skubal's first innings for the emotions, then watch the Dodgers offense — the real story of this week. Emptying the tank comes cheap at a ballpark he knows like the back of his glove hand. If the bats wake up here in front of a national showcase, the sweep in Atlanta becomes a footnote rather than a theme.", "analysis_zh": "週末最扣人心弦的支線劇情屬於客隊休息區。Tarik Skubal（8 勝 7 敗、ERA 2.91）週五將在 Comerica Park 對上老虎——這支培養他成名的球隊，也是他在 7 月重量級截止日交易中離開、轉戰洛杉磯的舊東家。\n\n這場重逢充滿了金錢買不到的戲劇性：兩屆賽揚獎得主回到他成為賽揚獎的地方，對面是一支仍然年輕、正圍繞自身天賦重建的老虎。Skubal 交易後的出色數據，正是道奇願意付出天文代價換他的原因。\n\n關於這個系列賽的背景：Skubal 週五先發、Blake Snell 週六登板、週日則視週五牛棚練投與恢復狀況由 Ohtani 或 Glasnow 主投。這是道奇在八月最接近完全體輪值的一次預演，也是那筆定義大限的交易的旗艦展示。\n\n戰績排名讓每一場都至關重要。道奇目前 80 勝 54 敗，落後釀酒人三場勝差爭全聯盟最佳戰績，僅領先勇士一場勝差爭國聯第二種子。在底特律打出一波強勢反彈，將大大沖淡亞特蘭大的挫敗感。\n\n分析師觀點：前半段先觀察 Skubal 的情緒，然後觀察道奇打線——那才是本週真正的故事主軸。在一個他閉著眼都知道怎麼投的球場，全力以赴的成本很低。如果打線能在這場全國轉播的焦點戰役中醒來，亞特蘭大的橫掃就會從主題變成註腳。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "No. 14 USC Opens 2026 on Saturday: Riley's Fifth Year, a No. 1 Class and a Playoff-or-Bust Mandate", "headline_zh": "第 14 名 USC 週六開季：Riley 執教第五年、頂級新秀班底、志在首闖季後賽", "analysis": "It all begins Saturday at 12:00 p.m. PT at the Coliseum, where No. 14 USC hosts San Jose State on NBC to open the 2026 season. The stakes could not be stated more plainly: fifth-year coach Lincoln Riley is chasing the program's first-ever College Football Playoff berth, and the roster he has assembled finally looks built to deliver it.\n\nKickoff against San Jose State is about execution more than talent — a Big Ten contender shouldn't need drama against a Mountain West opponent — but openers are where upsets and slow-start narratives are born. Every USC fan remembers how quickly a season can feel like it's off the rails.\n\nThe matchup is, on paper, a mismatch. USC's No. 1-ranked recruiting class and returning Big Ten passing leader under center dwarf the Spartans' ceiling. The real value in this game is granular: how do the four true freshmen starters handle the Coliseum lights, how fast does Gary Patterson's new defense communicate, and does the run game take enough pressure off Jayden Maiava.\n\nThe bigger picture: the Trojans get a gentle runway before a murderous Big Ten slate that includes home dates versus Oregon and Ohio State and a season finale at UCLA. Saturday is a dress rehearsal for a schedule that turns serious very quickly.\n\nAnalyst take: Expect a comfortable win, but grade the Trojans on style points and health. Riley's fifth year is defined by one number — 12, as in the size of the playoff field — and every rep against San Jose State is a building block toward a November that will decide his legacy in LA. A crisp, clean opener signals this team is serious.", "analysis_zh": "一切將於週六太平洋時間中午在紀念體育館展開，第 14 名的 USC 將在 NBC 轉播下對上聖荷西州立大學，為 2026 賽季揭開序幕。開季的意義再直白不過：執教第五年的 Lincoln Riley 正追求校史首度闖進大學美足季後賽（College Football Playoff），而他組建的陣容終於看起來有能力辦到。\n\n對聖荷西州立大學的開幕戰重點在執行力，而不是天賦——一支 Big Ten 爭冠勁旅不該對上 Mountain West 對手還要靠戲劇性取勝——但開幕戰正是爆冷與慢熱敘事的溫床。每個 USC 球迷都記得一個賽季可以多快就感覺脫軌。\n\n從紙面上看，這是一場不對等的比賽。USC 排名第一的招募班底、加上回歸的 Big Ten 傳球王四分衛，都遠超過 Spartans 的上限。真正的看點在細節：四名大一先發新秀如何應付紀念體育館的聚光燈、Gary Patterson 的新防守如何快速溝通，以及地面攻勢能否替 Jayden Maiava 分擔足夠的壓力。\n\n更大的圖景是：在進入殘酷的 Big Ten 賽程——包括主場迎戰俄勒岡與俄亥俄州大、例行賽收官作客 UCLA——之前，Trojans 拿到了一條與實力不匹配的緩衝賽程。週六是一場針對即將迅速轉硬的賽程的預演。\n\n分析師觀點：預期會是一場輕鬆的勝利，但要用比賽內容與健康度來評分。Riley 的第五年被一個數字定義——12，也就是季後賽參賽名額——對聖荷西州立的每一次攻防，都是朝向他 LA 生涯定論的 11 月累積的磚塊。乾淨俐落的開幕戰，代表這支球隊是認真的。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "Jayden Maiava Is Chasing More Than the Big Ten Passing Title — He's Knocking on the Heisman's Door", "headline_zh": "Jayden Maiava 不只放眼大十聯盟傳球王，更叩響海斯曼獎大門", "analysis": "The engine of USC's championship hopes is Jayden Maiava, who returns for his third full season under Riley after leading the Big Ten with 3,711 passing yards in 2025 — his first year as USC's full-time starter. That production already earned him a spot on the Manning Award watch list, and this week's USA Today feature put it bluntly: Hollywood's spotlight finds you, and Maiava is ready for it.\n\nThe leap-year case practically writes itself. One more season in Riley's offense, a No. 1 recruiting class of weapons around him, and a track record that says he gets better every offseason — Maiava has the profile of the quarterback who owns the Heisman conversation by November.\n\nWhat separates his path from standard stat inflation is efficiency and control. He threw for 3,711 yards while learning on the job; the expectation now is fewer mistakes, quicker decisions and a USC offense that scores at will. The backup question behind him (Sam Huard or freshman Jonas Williams) matters, but only if the starter ever misses time.\n\nThe Heisman conversation in LA is two-track: Maiava's individual brilliance and the team's playoff berth are now explicitly linked in the public imagination. Winners win — a top-tier finish in the Big Ten plus gaudy numbers equals automatic inclusion in that race.\n\nAnalyst take: The big-armed native of Hawaii has both the narrative — the crown jewel of Riley's transfer haul, the guy who made USC's offense watchable again — and the stage. If USC beats the schedule's elite, Maiava becomes the West Coast anchor of the Heisman vote. Saturday is the first box to check.", "analysis_zh": "USC 爭冠希望的核心是 Jayden Maiava，他在 2025 年——也就是他擔任 USC 全職先發的第一年——以 3,711 碼傳球領先全 Big Ten，如今回歸效力 Riley 麾下第三個完整賽季。這份產量已讓他進入 Manning Award 觀察名單，而本週 USA Today 的專訪也說得很直白：好萊塢的聚光燈會自己找上門，而 Maiava 已經準備好了。\n\n「大躍進」的論述幾乎自己會成形。在 Riley 進攻體系多打一年、身邊圍繞著最高排名招募班底的武器、再加上「每年休賽季都會進步」的紀錄——Maiava 完全具備到 11 月主導海斯曼獎話題的四分衛典型。\n\n讓他的道路與一般灌水數據不同之處，在於效率與控制力。他在邊做邊學的狀態下打出 3,711 碼；如今的期望是失誤更少、決策更快、USC 進攻隨心所欲得分。他身後的四分衛接班問題（Sam Huard 或大一新生 Jonas Williams）很重要，但前提是先發受傷才有意義。\n\n洛杉磯的海斯曼話題有兩條線：Maiava 的個人光芒與球隊的季後賽資格，如今在公眾想像中已被明確綁在一起。贏家會贏——在 Big Ten 拿到頂尖名次，加上誇張的數據，就等於自動進入候選名單。\n\n分析師觀點：這位來自夏威夷、手臂強壯的四分衛，集齊了所有敘事要素——Riley 轉會補強成果中的皇冠明珠、讓 USC 進攻再度精彩的關鍵人物——以及舞台。只要 USC 能擊敗賽程中的強隊，Maiava 就會成為海斯曼投票中西岸的定錨者。週六是第一個要打勾的格子。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "USC's First Depth Chart Is a Youth-Movement Manifesto: Four True Freshmen Start Immediately", "headline_zh": "USC 首份深度表宣示青春風暴：四名大一新生立刻先發", "analysis": "USC released its first depth chart of the season, and the theme is unmistakable: the No. 1 recruiting class in the country is not being eased in, it's being thrown in. Four members of the top-ranked 2026 class draw immediate starts, including freshman receivers Trent Mosley and Kayden Dixon-Wyatt and tight end Mark Bowman.\n\nThat's a statement of both belief and necessity. Riley's roster-building accelerated through the portal and the high-school ranks, and the result is a team young enough to win for years while still counting on teenagers to contribute from the very first whistle of the opener.\n\nThe most surprising item on the card had nothing to do with youth — it was the kicking battle. Caden Chittenden unseated Ryon Sayeri, the owner of USC's single-season field goal record from 2025, for the starting placekicker job. Special teams are where seasons quietly die; this is a bold call with real variance.\n\nDepth-chart quibbles aside, the composition reveals the identity: speed at receiver, athleticism at tight end, and a defense stocked by transfers alongside the freshmen. Gary Patterson's personnel is more versatile than the unit that labored a year ago.\n\nAnalyst take: Freshmen starters in Week 1 are a risk-reward gamble Riley clearly believes coaching solves. Mosley and Dixon-Wyatt are big-play threats who should take the top off San Jose State's defense on Saturday. The real test comes in October, when the Coliseum crowd, the schedule and Big Ten physicality all arrive at once — and these same freshmen are no longer rookies, they're role players.", "analysis_zh": "USC 公布了賽季首份深度表，主題不言而喻：全國排名第一的招募班底不是被慢慢養成，而是直接被丟上場。2026 屆頂級班底中有四人立刻獲得先發，包括大一接球員 Trent Mosley、Kayden Dixon-Wyatt 與邊鋒 Mark Bowman。\n\n這既是信心的宣示，也是必要的選擇。Riley 透過轉會市場與高中端加速建軍，結果就是一支既年輕到足以稱霸多年、又必須從開幕戰第一聲哨響就仰賴十幾歲新人的球隊。\n\n名單上最令人意外的項目與年輕無關，而是踢球手之爭。Caden Chittenden 擠下了 2025 年寫下校史單季射門得分紀錄的 Ryon Sayeri，拿下先發射門員位置。特勤組是賽季悄悄翻車的所在，這是個大膽且變數不小的決定。\n\n撇開深度表的細節不談，陣容組成透露了球隊定位：接球員位置的快腿、邊鋒位置的運動能力，以及由轉會球員與新人混合補強的防守。Gary Patterson 的人手比一年前那支苦苦掙扎的防守更有彈性。\n\n分析師觀點：第一週就讓大一新生先發，是一場 Riley 顯然相信靠執教就能化解的高風險高報酬賭注。Mosley 與 Dixon-Wyatt 是大碼數威脅，應該能在週六撕開聖荷西州立的後場防線。真正的考驗在十月，屆時紀念體育館的觀眾、賽程與 Big Ten 的肢體強度一併到來——而這群大一新生已不再是菜鳥，而是要肩負一定角色的球員。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "Gary Patterson Is USC's New Sheriff — the Hall of Famer With a Mandate to Fix the Defense", "headline_zh": "Gary Patterson 成為 USC 新任總管——肩負改造防守使命的名人堂教頭", "analysis": "The biggest single-season change in Los Angeles this fall isn't a roster move — it's the arrival of Gary Patterson as USC's new defensive coordinator. The College Football Hall of Famer and TCU's all-time winningest coach takes over a unit that has been the Trojans' Achilles' heel throughout Riley's tenure.\n\nPatterson's credentials are unimpeachable: for two decades at TCU he built defensive fronts that harassed Big 12 offenses, and his blitz-disguising packages and assignment discipline became the standard for mid-major-turned-powerhouse programs. USC's beat reporters have noted an immediate bump in intensity and detail at practice.\n\nThe hire signals that USC intends to play complementary football rather than try to out-score everyone. Alongside Riley's patient offensive identity, it suggests a tactical maturity the program hasn't had — no more weekly shootouts; instead, create pressure, force turnovers, shorten games.\n\nThe personnel matches the philosophy. The defense is stocked with the transfer additions the staff brought in alongside the freshmen, and Patterson inherits more raw talent than he had in Fort Worth for most of his career. His job is scheme, discipline and adaptation to Big Ten physicality.\n\nAnalyst take: If Patterson's defense is merely \"average,\" USC wins ten-plus games because the offense is that explosive. If it's \"good,\" watch out — the Trojans become genuinely dangerous against Oregon, Ohio State and the playoff field. Against San Jose State on Saturday, look for the telltale Patterson signature: early pressure, disguised pressure and defenders who know exactly where they're supposed to be.", "analysis_zh": "本屆洛杉磯最重大的單一賽季變動不是球員異動，而是 Gary Patterson 以新防守協調員身分入主 USC。這位大學美足名人堂成員、TCU 隊史最多勝教頭，接手的正是 Riley 任內始終是 Trojans 阿基里斯腱的那個防守組。\n\nPatterson 的資歷無可挑剔：他在 TCU 掌兵二十年，打造的防守鋒線屢屢壓制 Big 12 進攻，他的偽裝突襲套組與站位紀律，成為「小校翻身強權」的典範。USC 隨隊記者已注意到練習中強度與細節立刻提升。\n\n這項人事任命釋放的訊號是：USC 打算打互補型美足，而不是想靠得分壓過所有人。結合 Riley 耐心的攻勢哲學，這代表球隊出現了過去多年不曾有過的戰術成熟度——不再每週上演飆分大戰，取而代之的是製造壓力、逼出失誤、縮短比賽。\n\n人手配置也配合哲學。那批伴隨大一新生一起引進的轉會球員，讓防守端人才濟濟，Patterson 手中能用的天賦比他在福和市（Fort Worth）執教生涯多數時期都多。他的任務就是戰術、紀律，以及適應 Big Ten 的肢體強度。\n\n分析師觀點：如果 Patterson 的防守只是「普通」，USC 也能贏十場以上，因為進攻就是那麼炸。如果防守達到「良好」，那就要小心了——Trojans 將成為俄勒岡、俄亥俄州大與季後賽戰局中真正的威脅。週六對聖荷西州立，請留意 Patterson 招牌特徵：提早施壓、虛晃突襲，以及每個防守者都精準就位。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "Lincoln Riley's Fifth Year Is Playoff-or-Bust: Everything Is Finally in Place, Which Is the Pressure", "headline_zh": "Riley 執教第五年已無退路：一切就位，正因如此壓力才最大", "analysis": "Lincoln Riley got what he wanted this winter — the No. 1 recruiting class, a returning All-Big Ten quarterback, a brand-name defensive coordinator — and with that wish comes the burden. In five years at USC he has not reached the College Football Playoff, and the program hasn't been there since the format debuted in 2014.\n\nThe pressure analysis writes itself: Riley built his legend winning Big 12 trophies with loaded offenses; in LA, the standard is a national title. The \"he can't win the big one at USC\" talking point grows louder every offseason, and 2026 is the season he chose to answer it.\n\nThe roster is there. Maiava is the league's returning passing leader, the recruiting class is the best in the country, and Patterson's arrival signals a rebuild that has moved past collecting skill and into winning on the margins. The schedule gives a real runway to build a CFP rsum before November's gauntlet.\n\nBut expectations cut both ways. With an 8.5-win total in the betting market and short Big Ten title odds, the Trojans are being priced as a playoff team by models and bettors alike. Anything short of a selection-committee-worthy finish will be met with a chorus of \"same old USC.\"\n\nAnalyst take: Riley has never coached a team with this much assembled talent and this much pressure in the same year. That tests his maturation as much as his X's and O's. If the Trojans are truly elite, Saturday's opener is barely a speed bump on a 12-game road to the 12-team bracket — but every stop must be hit clean. October is when we'll know if this is Riley's crowning season or his biggest miss.", "analysis_zh": "Lincoln Riley 今年冬天得到了他想要的一切——排名第一的招募班底、回歸的全 Big Ten 四分衛、一位名氣響亮的防守協調員——而這份願望同時也帶來了包袱。在 USC 執教五年，他從未闖進大學美足季後賽，而這所學校自 2014 年季後賽制度創立以來也從未打進過。\n\n壓力分析本身就會自我書寫：Riley 靠著滿載火力打造的進攻體系在 Big Ten 捧起獎盃而建立起傳奇；但在洛杉磯，標準是全國冠軍。「他在 USC 贏不了大場面」的話題每年休賽季都越來越響，而 2026 就是他挑選來回應的賽季。\n\n陣容已經就位。Maiava 是聯盟回歸的傳球王、招募班底全國最佳、Patterson 的到來則象徵重建已從收集天賦進入到贏在細節的階段。賽程也提供了在 11 月爐渣賽程來臨前，逐步累積季後賽履歷的緩衝跑道。\n\n但期望是一把雙面刃。賭盤開出 8.5 勝的勝場總數、Big Ten 奪冠賠率壓低，意味著模型與賭客都把 Trojans 定價成一支季後賽球隊。任何達不到選拔委員會評選門檻的成績，都會被「還是老樣子 USC」的聲浪淹沒。\n\n分析師觀點：Riley 從未在同一支球隊身上同時集結過這麼多的天賦與壓力。這考驗的不只是他的戰術，更是他的成熟度。如果 Trojans 真的具備頂級實力，週六的開幕戰不過是通往 12 隊季後賽名單那條 12 場征途上的小減速丘——但每一站都必須乾淨俐落地通過。十月我們才會知道，這究竟是 Riley 生涯的加冕之作，還是他最大的失手。"}, {"team": "Rams", "accent": "#003594", "headline": "The NFL Is Reviewing Puka Nacua's Offseason — and the Rams' Super Bowl Math Just Got a Variable", "headline_zh": "NFL 正審查 Puka Nacua 場外風波，公羊超級盃算式瞬間多出變數", "analysis": "Just as the Rams look like the NFL's most loaded roster, a complication has arrived: ESPN's Adam Schefter reported the NFL is reviewing Puka Nacua's offseason legal issues — including a civil lawsuit alleging assault and antisemitic remarks — which could result in a suspension. His Week 1 status for the opener against the 49ers in Melbourne, Australia is now uncertain.\n\nThe timeline matters enormously. The league's review process is opaque, and the opener is roughly two weeks away. Nacua led the NFL with 129 receptions and 1,715 receiving yards in 2025; subtracting him from the Australia trip changes every layer of the game plan.\n\nMcVay has publicly voiced support for the receiver — a coach who prides himself on culture showing a different side of loyalty — but the front office has also invested heavily in insurance. The re-acquisition of Tutu Atwell below reads as a hedge against the worst-case timeline.\n\nContext: NFL suspensions for conduct-related matters typically range from one to six games depending on the finding. Even a one- or two-game ban changes September's math: Davante Adams becomes the No. 1 target, Atwell steps into a bigger role, and the Rams' vaunted three-receiver sets lose their biggest volume piece.\n\nAnalyst take: The Rams built the 2026 Super Bowl machine around Stafford, Garrett and a full complement of weapons. If Nacua misses early time, it's a speed bump — this roster absorbs it. But the civil-legal cloud hanging over the situation is precisely the kind of drama that can derail a contender's focus. Watch how McVay holds the room together; that's the real test of September.", "analysis_zh": "就在公羊看起來像是 NFL 戰力最滿的球隊之際，一個變數出現了：據 ESPN 的 Adam Schefter 報導，NFL 正在審查 Puka Nacua 的場外法律問題——包括一宗指控攻擊與反猶太言論的民事訴訟——這可能導致他被禁賽。他在澳洲墨爾本對 49ers 開幕戰的出賽狀態如今懸而未決。\n\n時間點至關重要。聯盟的審查程序不透明，而開幕戰距今只有大約兩週。Nacua 在 2025 年以 129 次接球、1,715 碼領先全 NFL；如果澳洲之行少了這位主力，比賽計畫的每個環節都會被改寫。\n\nMcVay 已公開表達對這位接球員的支持——一位以文化為傲的教練展露了忠誠的另一面——但管理層也砸重金買了保險。下方提到的迎回 Tutu Atwell，讀起來就是針對最壞時間軸的避險操作。\n\n背景脈絡：NFL 對行為類事件的禁賽，依情節輕重通常在 1 到 6 場之間。即使只是一到兩場，也會改變九月的算盤：Davante Adams 將成為頭號目標、Atwell 角色變重、而公羊引以為傲的三接球員陣容將失去最大產量的拼圖。\n\n分析師觀點：公羊圍繞 Stafford、Garrett 與完整武器庫打造了 2026 的超級盃機器。如果 Nacua 開季缺陣，那只是個減速丘——這套陣容扛得住。但籠罩在頭上的民事法律陰影，正是那種會打亂爭冠球隊專注力的戲碼。重點是觀察 McVay 如何穩住休息室，那才是九月的真正考驗。"}, {"team": "Rams", "accent": "#003594", "headline": "Rams Reacquire Tutu Atwell — a Speedster Reunion That Doubles as Insurance for Nacua", "headline_zh": "公羊迎回 Tutu Atwell——速度型猛將回歸，同時是 Nacua 的保險", "analysis": "Hours before the preseason finale, the Rams pulled off a reunion: they traded running back Jarquez Hunter to the Miami Dolphins for wide receiver Tutu Atwell — the speedy 2021 second-round pick who spent his first five NFL seasons in LA. It's a classic buy-low, know-the-guy move at a position of genuine need.\n\nAtwell's value proposition has always been pure speed and the vertical threat that stretches seams, making everything underneath easier. With Davante Adams and Puka Nacua as the top two, adding Atwell gives Sean McVay a proven deep-ball weapon who knows the system cold.\n\nThe cost is telling. Hunter had fallen behind Kyren Williams and Blake Corum in the backfield pecking order, so the Rams surrendered a surplus asset for a positional need. That's the roster management of a contender that knows exactly who it is.\n\nThe subtext is the Nacua situation. If the NFL suspends him, Atwell becomes the emergency starter who already has chemistry with Stafford — five seasons together, including the Super Bowl-era runs. If Nacua plays, Atwell is a luxury depth piece who can also return kicks.\n\nAnalyst take: This trade tells you the Rams are managing downside even while betting everything on upside. They traded depth they didn't need for speed they knew would work. It's the kind of quiet move that shows up loud in September. Watch Atwell in Week 1 regardless of Nacua's status — McVay loves a homecoming story and a new wrinkle.", "analysis_zh": "在季前賽最後一戰開打前數小時，公羊完成了一場重逢：他們把跑衛 Jarquez Hunter 交易到邁阿密海豚，換回外接手 Tutu Atwell——這位以速度著稱的 2021 年第二輪選秀，曾在洛杉磯度過生涯前五個 NFL 賽季。這是一筆典型的逢低買進、知根知底，針對真正位置需求的操作。\n\nAtwell 的價值主張始終是純粹的速度與縱深威脅：他把防守陣型拉開，讓地面上的所有布局都變得更輕鬆。在 Davante Adams 與 Puka Nacua 佔據前兩號的情況下，加入 Atwell 讓 Sean McVay 多了一把熟門熟路的深遠傳球武器。\n\n付出的代價很有說明性。Hunter 在後場順位上已落後 Kyren Williams 與 Blake Corum，因此公羊是用多餘資產換取位置缺口。這就是一支清楚自己是誰的爭冠球隊該有的名單管理。\n\n隱含的劇情正是 Nacua 的處境。如果 NFL 處以禁賽，Atwell 就成為早有默契的緊急先發——兩人一起合作五個賽季，包括超級盃時代的征戰。如果 Nacua 正常出賽，Atwell 就是同時可以回攻踢球的豪華替補。\n\n分析師觀點：這筆交易告訴你，公羊在一面押注上限的同時，也在管理下限。他們用不需要的深度，換來了確定能用的速度。這是那種九月就會大聲浮上檯面的安靜操作。無論 Nacua 狀態如何，第一週都要盯緊 Atwell——McVay 最愛這種歸鄉故事加上新招數的組合。"}, {"team": "Rams", "accent": "#003594", "headline": "Rams Finish 3-0 in Preseason — Now the Hard Part: Sunday's 53-Man Cutdown Exacts a Price", "headline_zh": "公羊季前賽 3 勝 0 敗收官，真正的考驗才開始：週日 53 人名單大裁員", "analysis": "The Rams closed their preseason slate with a 20-18 win over the Chargers at SoFi Stadium on Thursday night, finishing camp undefeated at 3-0. The starters rested, as they should have, which turned the finale into a last audition for fringe roster players with the 53-man cutdown deadline arriving Sunday.\n\nThose final auditions carry a price. Keir Thomas — a veteran edge defender who thrived on special teams — is already lost for 2026 after a groin injury sent him to season-ending IR. Preseason games giveth and taketh away, and contention is a cold calculus.\n\nThe roster that emerges Sunday will be the truest statement of intent. With Stafford, Garrett, Adams and Nacua all in place, the Rams don't carry projects in the 47-to-53 spots; they carry role specialists who win on special teams and depth who could be called upon in a week.\n\nThe interesting decisions: how many receivers to keep after the Atwell pickup, what the backfield rotation looks like behind Kyren Williams, and how the young cornerback room shakes out. The Rams' cutdown-week philosophy is a good tell — they keep differential athletes and cut interchangeable parts.\n\nAnalyst take: Preseason records almost never predict the regular season, but 3-0 with a healthy core and no structural offensive injuries is genuinely good camp. Sunday's cutdown is where championships are quietly assembled — and the next big-name veteran released elsewhere could become LA's next signing within hours.", "analysis_zh": "公羊以 20 比 18 在 SoFi 體育館擊敗電光人，為季前賽畫下句點，以 3 勝 0 敗全勝之姿收操。先發主力如預期輪休，讓最終戰變成邊緣名單球員的最後試鏡，而 53 人名單裁員截止日將在週日到來。\n\n這些最後試鏡是有代價的。資深邊緣防守者 Keir Thomas 因鼠蹊部傷勢被放入賽季報銷的傷兵名單，2026 賽季已經結束。季前賽給你什麼，也會拿走什麼，而爭冠是一場冷酷的算計。\n\n週日出爐的名單將是最真實的企圖聲明。在 Stafford、Garrett、Adams 與 Nacua 俱在的情況下，公羊不會在第 47 到 53 個位置養計畫型球員；他們要的是能在特勤組取勝的專職角色球員，以及一週後就可能得上場的替補深度。\n\n有趣的決策點：迎回 Atwell 後接球員要留幾個、Kyren Williams 之後的後場輪值怎麼排、年輕角衛室誰去誰留。公羊在裁員週的哲學很有指標性——留下有差異化運動能力的，裁掉可替換的通用零件。\n\n分析師觀點：季前賽戰績幾乎從不預言例行賽，但 3 勝 0 敗、核心球員健康、進攻端沒有結構性傷病，確實是一堂紮實的訓練營。週日的裁員正是在安靜中組裝冠軍的地方——而別隊在新賽季前釋出的下一位名將，可能在幾個小時內就成為公羊的新簽約。"}, {"team": "Rams", "accent": "#003594", "headline": "Keir Thomas Is Done for 2026: a Veteran's Season Ends Before It Starts and McVay Is 'Gutted'", "headline_zh": "Keir Thomas 賽季報銷：老將球季還沒開始就結束，McVay 痛心不已", "analysis": "The Rams placed backup outside linebacker Keir Thomas on injured reserve with a groin injury sustained in the preseason win over the Saints, ending his 2026 season before it began. The injury happened during the very audition he was winning.\n\nThomas was a special-teams ace and a rotational edge defender whom McVay had been penciling into meaningful snaps. Sean McVay said he was \"gutted\" for the veteran defender — the kind of blunt, human reaction that shows how much the coach values the locker room as much as the depth chart.\n\nThe competitive impact is modest in name and real at the margins: the Rams lose a ready-made special-teams presence and a depth body on passing downs. NFL roster arithmetic replaces him with a rookie or a street free agent, which is fine in September and painful by December.\n\nContext for the edge room: Myles Garrett is the superstar and Byron Young broke out in 2025, but behind them the depth suddenly tests thinner. Thomas's absence raises the urgency of the cutdown-week market — a veteran edge with special-teams value is exactly the name that should get a call from the Rams before the weekend ends.\n\nAnalyst take: Camp injuries are the league's great arithmetic — every contender has a Thomas, a quiet loss nobody headlines and that playoff teams feel in Week 15. The Rams won't sweat this strategically if the replacement is disciplined; the watch item is how quickly they pounce on the waiver wire to stop the bleed.", "analysis_zh": "公羊將替補外線衛 Keir Thomas 放入傷兵名單（injured reserve），原因是他在季前賽大勝聖徒一役中鼠蹊部受傷，2026 賽季在開始前就宣告結束。傷勢恰恰發生在他即將贏下名額的那場試鏡中。\n\nThomas 是特勤組王牌，也是 McVay 原本已規劃要給予實質上場時間的輪替邊緣防守者。Sean McVay 坦言自己為這位老將防守者感到「心痛」（gutted）——這種直白而人性的反應，說明了這位教練對休息室的重視程度不亞於深度表。\n\n競爭層面的影響名義上有限，但在邊際上實實在在：公羊失去了一位現成的特勤組即戰力，以及傳球檔次上的深度人選。NFL 的名單算術會用一位新秀或自由市場老將補上，九月沒問題，十二月就會覺得痛。\n\n邊緣防守組的背景：Myles Garrett 是超級巨星、Byron Young 在 2025 年破繭而出，但他們身後的深度瞬間變薄。Thomas 的缺席提高了裁員週市場的急迫性——一位兼具特勤價值的資深邊緣防守者，正是週末前該接到公羊電話的那種名字。\n\n分析師觀點：訓練營傷病是這個聯盟最冷酷的算術——每支爭冠隊伍都有一個 Thomas，一個沒人上頭條、卻讓季後賽球隊在第 15 週才感受到痛的小損失。只要替代者紀律良好，公羊不會在戰術層面傷透腦筋；真正的觀察重點，是他們多快出手搶下讓渡名單上的戰力來止血。"}, {"team": "Rams", "accent": "#003594", "headline": "'All-In' Has a Name: Stafford + Garrett Makes the Rams the First MVP/DPOY Pairing in NFL History", "headline_zh": "「梭哈」有了名字：Stafford 結合 Garrett，公羊成 NFL 史上首支 MVP 搭 DPOY 組合", "analysis": "It's worth restating because it's genuinely historic: the Rams are the first team in NFL history to pair the reigning NFL MVP and the reigning Defensive Player of the Year on the same roster. Matthew Stafford — the 2025 MVP who led the league in touchdowns — and Myles Garrett — the record 23-sack season that broke the single-season mark shared by Strahan and Watt — are teammates in Los Angeles.\n\nThe June blockbuster that brought Garrett cost real equity: Jared Verse and three draft picks went to Cleveland. But it also changed the franchise's ceiling. No roster in football is more loaded at the two most influential positions — quarterback and pass rusher — than the Rams.\n\nThe supporting cast is why the front office felt it could spend that way. Davante Adams led the league in receiving touchdowns last year, Nacua led in catches, and the tight ends and offensive line are playoff-grade. The money went to stars, and stars absorb it.\n\nHow Stafford is managed reveals the all-in timeline. The 38-year-old signed a $55 million extension, and McVay is running a strict offseason regimen to keep him fresh. They're not playing for now alone — they're protecting a shot at now and next.\n\nAnalyst take: \"All-in\" usually means mortgaging the future. The Rams mortgaged some of their defense (Verse) but kept the core timeline aligned to win immediately. If the Nacua situation resolves favorably and Garrett stays healthy down the stretch, this is the most dangerous team in the NFC West — and maybe the entire NFC.", "analysis_zh": "值得重複強調，因為這確實是歷史性的：公羊是 NFL 史上第一支同時擁有例行賽 MVP 與最佳防守球員（DPOY）的球隊。2025 年例行賽 MVP、並以達陣數領先全聯盟的 Matthew Stafford，與單季 23 次擒殺、打破 Strahan 與 Watt 共同保持的單季紀錄的 Myles Garrett，如今在洛杉磯成為隊友。\n\n六月那筆換來 Garrett 的重量級交易付出了實打實的資產：Jared Verse 加上三個選秀籤去了克里夫蘭。但它也改變了這支球隊的天花板。全 NFL 沒有任何陣容，在四分衛與擒殺手這兩個最具影響力的位置上，比公羊更兵強馬壯。\n\n正是因為有這批配角，管理層才敢這樣花錢。Davante Adams 去年以接球達陣數領先聯盟，Nacua 是接球次數第一，邊鋒與進攻鋒線都是季後賽等級。錢花在球星身上，而球星撐得住。\n\n如何管理 Stafford 揭示了這波梭哈的時間軸。這位 38 歲老將簽下 5,500 萬美元延長合約，McVay 也以嚴格的休賽季課表維持他的狀態。他們不只是為現在而戰，更是在保護「現在與明年」都要贏的機會。\n\n分析師觀點：「梭哈」通常意味著抵押未來。公羊抵押了一部分防守（Verse），卻讓核心時間軸保持一致地瞄準立即奪冠。如果 Nacua 事件圓滿落幕、Garrett 在季末保持健康，這將是國聯西區最危險的球隊——甚至可能是整個國聯。"}], "closing": "From the Dodgers' suddenly quiet bats and a rotation quietly getting whole, to Maiava's Heisman chase and a USC team built to finally break through, to a Rams franchise that has paired an MVP with a record-setting sack artist and declared 2026 its moment — Los Angeles is carrying three genuine title storylines into September. The next 24 hours decide rosters, the next week decides October rotations, and the next two months decide whether this becomes the year all three LA teams arrive at once. Enjoy every minute of it.", "closing_zh": "從道奇突然熄火的打線與悄悄恢復完整的輪值，到 Maiava 的海斯曼獎追夢，與一支終於具備突破條件的光明 USC，再到把例行賽 MVP 與歷史級擒殺機器湊在一隊、宣告 2026 屬於自己的公羊——洛杉磯正帶著三條貨真價實的爭冠故事線邁入九月。未來二十四小時決定名單，未來一週決定十月的輪值，未來兩個月則將決定這是否會成為三支 LA 球隊同時登頂的一年。每一分鐘，都值得好好享受。"};
let lang = "en";
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmtPT(iso){ return new Date(iso).toLocaleString("en-US",{timeZone:"America/Los_Angeles",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"})+" PT"; }

function renderDigest(d){
  const box = document.getElementById("digest");
  if(!d || !d.segments){
    box.innerHTML = '<div style="text-align:center;color:var(--dim);padding:40px">No digest yet</div>';
    return;
  }
  const segs = d.segments.map(s=>{
    const headline = lang==="en" ? s.headline : s.headline_zh;
    const analysis = lang==="en" ? s.analysis : s.analysis_zh;
    return '<div class="seg" style="--team:'+esc(s.accent)+'">' +
      '<div class="row"><span class="hn">'+esc(headline)+'</span><span class="badge">'+esc(s.team)+'</span></div>' +
      '<div class="lbl">'+(lang==="en"?"Analysis":"分析")+'</div><p>'+esc(analysis)+'</p>' +
      '</div>';
  }).join("");
  box.innerHTML =
    '<div class="dhead">' +
      '<div class="t"><div class="mic">🎙️</div><div><h2>'+esc(d.title)+'</h2><div class="meta">' +
        esc(d.read_time || "")+' · '+fmtPT(d.updated_at)+
        ' · 繁中/EN</div></div></div>' +
      '<div class="langs">'+
        '<button id="btnEn" class="on" onclick="setLang(\'en\')">EN</button>'+
        '<button id="btnZh" onclick="setLang(\'zh\')">繁體中文</button>'+
      '</div>' +
    '</div>' +
    '<div class="intro">'+esc(lang==="en"?d.intro:d.intro_zh)+'</div>' +
    '<div class="segs">'+segs+'</div>' +
    '<div class="closing">'+esc(lang==="en"?d.closing:d.closing_zh)+'</div>';
}
function setLang(v){ lang = v; document.getElementById("btnEn").classList.toggle("on", v==="en"); document.getElementById("btnZh").classList.toggle("on", v==="zh"); renderDigest(DIGEST_DATA); }

function renderNews(d){ const upd = document.getElementById("upd"); if(upd) upd.textContent = fmtPT(d.updated_at);
  const g = document.getElementById("grid"); g.innerHTML = "";
  for(const t of d.teams){
    const c = document.createElement("div"); c.className = "card"; c.style.setProperty("--team", t.accent);
    const emoji = t.emoji==="Baseball"?"⚾":t.emoji==="Football"?"🏈":"🏆";
    c.innerHTML =
      '<div class="top"><div class="ico">' + emoji + '</div>' +
      '<div><div class="name">' + esc(t.name) + '</div><div class="rec">' + t.sport + ' · ' + esc(t.record) + '</div></div></div>' +
      '<div class="hline">' + esc(t.headline) + '</div>' +
      '<h3>Latest News</h3><ul class="news">' + t.latest_news.map(n =>
        '<li><a target="_blank" rel="noopener" href="' + esc(n.url) + '">' + esc(n.title) + '</a><p>' + esc(n.summary) + '</p></li>'
      ).join("") + '</ul>' +
      '<h3>Fun Facts</h3><ul class="facts">' + t.fun_facts.map(f => '<li>'+esc(f)+'</li>').join("") + '</ul>' +
      '<h3>Further Reading</h3><ul class="read">' + t.further_reading.map(f =>
        '<li><a target="_blank" rel="noopener" href="' + esc(f.url) + '"><span>'+esc(f.title)+'</span><span class="why">'+esc(f.why)+'</span></a></li>'
      ).join("") + '</ul>' +
      '<div class="oss">' + esc(t.one_sentence) + '</div>';
    g.appendChild(c);
  }
}

renderDigest(DIGEST_DATA);
renderNews(TEAMS_DATA);
</script>
