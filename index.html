<style>
  :root{
    --bg:#0b0e14; --panel:rgba(255,255,255,.04); --panel2:rgba(255,255,255,.02);
    --line:rgba(255,255,255,.08); --fg:#edf2fa; --dim:#8a94a6;
    --radius:18px; --glow:0 0 0 1px rgba(255,255,255,.04), 0 24px 60px -30px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 500px at 20% -10%, rgba(42,111,216,.18), transparent 60%),
      radial-gradient(1000px 500px at 90% -10%, rgba(153,0,0,.14), transparent 60%),
      radial-gradient(900px 400px at 50% 110%, rgba(31,78,156,.16), transparent 60%),
      var(--bg);
    color:var(--fg); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
    padding:28px clamp(16px,4vw,64px) 64px;
  }
  header{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:26px}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{
    width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;
    background:linear-gradient(135deg,#2a6fd8,#991111);box-shadow:0 8px 30px -8px rgba(60,90,220,.6);
  }
  h1{font-size:clamp(22px,3vw,32px);font-weight:800;letter-spacing:-.02em}
  .sub{color:var(--dim);font-size:13px;margin-top:4px}
  .ticker{
    font-size:12px;color:var(--dim);padding:8px 14px;border-radius:99px;
    background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);
  }
  .ticker b{color:#7ce38b}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:20px}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;backdrop-filter:blur(14px);box-shadow:var(--glow);position:relative;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--team,#2a6fd8),transparent);
  }
  .top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .ico{
    width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;
    background:color-mix(in srgb,var(--team) 22%, transparent);
  }
  .name{font-size:18px;font-weight:800;letter-spacing:-.01em}
  .rec{font-size:11px;color:var(--team);font-weight:700;margin-top:2px}
  .hline{font-size:13px;line-height:1.5;color:var(--dim);padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);margin-bottom:16px}

  h3::after{content:"";flex:1;height:1px;background:var(--line)}
  .news{list-style:none}
  .news li{padding:10px 12px;border-radius:12px;margin-bottom:6px;background:var(--panel2);border:1px solid var(--line);transition:.2s}
  .news li:hover{border-color:color-mix(in srgb,var(--team) 50%, transparent);transform:translateX(3px)}
  .news a{color:var(--fg);text-decoration:none;font-weight:700;font-size:13px;display:block;margin-bottom:4px}
  .news a:hover{color:var(--team)}
  .news p{font-size:12px;color:var(--dim);line-height:1.5}
  .facts{list-style:none;display:grid;gap:6px}
  .facts li{position:relative;padding:2px 0 2px 18px;font-size:12.5px;color:var(--fg);line-height:1.55}
  .facts li::before{content:"⚡";position:absolute;left:0;top:2px;font-size:11px;filter:grayscale(.4)}
  .read{list-style:none;display:grid;gap:6px}
  .read a{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12.5px;color:var(--fg);text-decoration:none;padding:9px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
  .read a:hover{color:var(--team);border-color:color-mix(in srgb,var(--team) 50%, transparent)}
  .read .why{font-size:11px;color:var(--dim)}
  .oss{font-size:12.5px;line-height:1.6;color:var(--fg);background:linear-gradient(90deg,color-mix(in srgb,var(--team) 18%,transparent),transparent);border-left:3px solid var(--team);padding:10px 14px;border-radius:0 12px 12px 0;margin-top:16px}
  banner{display:block;text-align:center;color:var(--dim);font-size:13px;margin-top:22px}
  banner span{color:#7ce38b;animation:blink 1.5s infinite}
  @keyframes blink{50%{opacity:.3}}
  .spin{width:100%;height:100px;display:grid;place-items:center;color:var(--dim)}
  /* ---- digest ---- */
  .digest{
    background:linear-gradient(135deg,rgba(42,111,216,.12),rgba(153,0,0,.10),rgba(31,78,156,.12)),var(--panel);
    border:1px solid var(--line);border-radius:var(--radius);padding:26px;
    backdrop-filter:blur(14px);box-shadow:var(--glow);margin-bottom:22px;
  }
  .dhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;margin-bottom:14px}
  .dhead .t{display:flex;align-items:center;gap:12px}
  .mic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:linear-gradient(135deg,#2a6fd8,#991111)}
  .dhead h2{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .dhead .meta{color:var(--dim);font-size:12px;margin-top:3px}
  .langs{display:flex;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:4px}
  .langs button{border:0;background:transparent;color:var(--dim);font-size:12px;font-weight:700;padding:6px 16px;border-radius:99px;cursor:pointer;transition:.2s}
  .langs button.on{background:linear-gradient(135deg,#2a6fd8,#1f4e9c);color:#fff}
  .intro{font-size:14px;line-height:1.65;color:var(--fg);max-width:820px;margin-bottom:18px}
  .segs{display:grid;gap:12px}
  .seg{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--panel2)}
  .seg .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .seg .row .hn{font-weight:800;font-size:14.5px}
  .seg .badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--team,#2a6fd8) 20%,transparent);color:var(--team);white-space:nowrap}
  .seg p{font-size:12.5px;line-height:1.6;color:var(--dim);margin-top:6px}
  .seg p.cls{color:var(--fg)}
  .seg .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin-top:10px;font-weight:700}
  .closing{font-size:14px;line-height:1.6;border-top:1px dashed var(--line);margin-top:16px;padding-top:14px;color:var(--fg)}
</style>

1163490007/"}, {"title": "McVay discusses Stafford and Davante Adams contracts", "why": "Context on the Rams' financial commitments to their star offensive players heading into the 2026 season.", "url": "https://www.nfl.com/videos/rams-hc-sean-mcvay-discusses-matthew-stafford-and-davante-adams-contracts-in-2026-the-insiders"}], "one_sentence": "The Rams are easing All-Pros Nacua and Garrett through minor injuries, rookie OL Trost is hurt, Harrison Mevis is locked in, and Aaron Donald has now worked out twice as his comeback decision looms over everything heading into Week 2 preseason vs. the Saints."}]};
const DIGEST_DATA = {"updated_at": "2026-08-17T07:30:00Z", "title": "LA Sports Daily Digest — 15-Minute Edition", "read_time": "~15 minutes", "intro": "Good morning, Los Angeles. It's Sunday, August 17, 2026, and the dog days of summer are delivering across the board. Shohei Ohtani took a meaningful step back toward the mound, USC's preseason hype machine is revving at full throttle, and Aaron Donald keeps showing up at the Rams' facility like a ghost who won't haunt. Let's get into it.", "intro_zh": "早安，洛杉磯。今天是2026年8月17日，星期日，盛夏時節三大球隊各有重磅動態。Shohei Ohtani 朝復出投手 mound 迈出了關鍵一步，USC 的季前聲勢持續升溫，而 Aaron Donald 則持續現身 Rams 訓練基地，復出傳聞甚囂塵上。讓我們逐一深入。", "segments": [{"team": "Dodgers", "accent": "#2A6FD8", "headline": "Ohtani Mound Return Accelerates, Glasnow Shoves in Rehab as Dodgers Stumble Against Milwaukee", "headline_zh": "Ohtani 復出投球進展加速，Glasnow 在復健賽中大殺四方，道奇卻在系列賽中不敵釀酒人", "analysis": "Shohei Ohtani threw his first bullpen session in over three weeks, a significant milestone in his recovery from a knee injury that has limited him to designated hitter duties since mid-July. He's still hitting .298 in August, so the bat remains elite — but the Dodgers need his arm back for the postseason push. The fact that he's progressing on schedule and not experiencing setbacks is exactly what the franchise needs to hear with October approaching. Tyler Glasnow, meanwhile, looked like an ace in waiting during his Triple-A rehab outing, punching out eight batters in 2.2 innings while averaging 95.9 mph on his fastball and topping out at 97.7. The velo is right where it was before the injury, and he plans one more minor-league start before rejoining the rotation. If Glasnow and Ohtani both return at full strength, the Dodgers' October rotation could be the deepest in baseball. The bad news? The Brewers took two of three at Dodger Stadium, clinching a potential playoff tie-breaker and dropping LA to 5-5 over their last 10 games. Kyle Tucker's home/road split is becoming a real problem — the outfielder is hitting just .192 at Dodger Stadium versus .275 on the road and went 0-for-16 over his last five games before being held out of Saturday's lineup. For a team that acquired Tucker to be a postseason difference-maker, that inconsistency at home is a legitimate concern heading into September. On the brighter side, Yoshinobu Yamamoto delivered six strong innings in Friday's 3-1 win, continuing his emergence as a reliable frontline starter, and Edwin Díaz bounced back with a save after a rough stretch — exactly the kind of resilience you need from your closer in August. Max Muncy also etched his name into the record books, passing Eric Karros for the most home runs hit at Dodger Stadium with a clutch three-run shot on August 14, a reminder that the veteran still has plenty of pop when it matters. The Dodgers also mourned the passing of Tommy John, the legendary pitcher whose name is synonymous with the most famous arm surgery in sports history; he died on August 16 at age 83. Losing the Brewers series stings, especially with Milwaukee now holding the tie-breaker edge, but the bigger picture is that the cavalry is coming: Ohtani's arm is progressing, Glasnow is on the doorstep, and Tarik Skubal — acquired in the deadline's biggest deal — awaits in October. The Dodgers also maintained one of baseball's best farm systems despite surrendering top prospects in the Skubal trade, which speaks to the depth of their player development pipeline. The question is whether this uneven regular-season stretch costs them home-field advantage when it matters most — and whether a team that's been coasting in the NL West can flip the switch when October baseball arrives.", "analysis_zh": "Shohei Ohtani 三週多來首次進行 bullpen session，這是他在膝傷恢復過程中的重要里程碑——自七月中旬以來他只能擔任 designated hitter。他在八月仍維持 .298 的打擊率，證明球棒沒有問題，但道奇在季後賽衝刺階段迫切需要他的投球能力。事實上他按照計畫進展且未出現反覆，對這支球隊來說正是最需要聽到的消息。Tyler Glasnow 在 Triple-A 復健賽中展現王牌級表現，2.2 局狂飆 8 次三振，fastball 均速 95.9 mph、最高 97.7 mph，球速與受傷前完全一致，預計再投一場 minor-league 就會回歸輪值。如果 Glasnow 和 Ohtani 都能健康回歸，道奇的十月輪值可能是全聯盟最深厚的。壞消息是釀酒人在 Dodger Stadium 拿下三場系列戰中的兩場，鎖定了潛在的季後賽 tie-breaker 優勢，道奇近十場戰績滑落到 5-5。Kyle Tucker 的主場/客場落差越來越令人擔憂——在 Dodger Stadium 只有 .192 的打擊率，與客場 .275 形成強烈對比，最近五場更是 0-for-16。對於一支交易來 Tucker 做為季後賽關鍵人物的球隊來說，主場的不穩定是進入九月時真正的隱憂。好消息方面，Yoshinobu Yamamoto 在週五的 3-1 勝利中投滿六局表現穩健，持續展現作為可靠 front-line starter 的成長軌跡；Edwin Díaz 也從低潮中振作拿下救援成功——正是你在八月需要從 closer 身上看到的韌性。Max Muncy 在 8 月 14 日擊出三分全壘打，超越 Eric Karros 成為在 Dodger Stadium 出最多全壘打的球員，提醒人們這位老將在關鍵時刻仍有十足長打火力。道奇同時悼念了 Tommy John 的辭世，這位傳奇投手於 8 月 16 日以 83 歲高齡離世，他因以他命名的 Tommy John surgery 而名留青史。輸掉釀酒人系列賽令人沮喪，但更大的願景是援軍即將到來：Ohtani 的投球正在恢復、Glasnow 已觸手可及、交易大限的最大收穫 Tarik Skubal 正在十月等候。道奇在 Skubal 交易中送出了頂級新秀卻仍維持全聯盟數一數二的 farm system 深度，這體現了他們球員養成體系的厚度。關鍵問題在於這段不穩的例行賽表現是否會讓他們在關鍵時刻失去主場優勢——以及這支在 NL West 一直游刃有餘的球隊能否在十月棒球到來時切換模式。", "stories": [{"title": "Ohtani Throws First Bullpen in Three Weeks", "text": "Ohtani took the mound for a bullpen session — his first in over three weeks — as he continues progressing through a knee injury that has sidelined him from pitching duties. Catchers Will Smith and Dalton Rushing also took batting practice on the field, signaling a healthy clubhouse."}, {"title": "Glasnow Dominates in Triple-A Rehab Start", "text": "Tyler Glasnow struck out eight batters in 2.2 innings for Oklahoma City, averaging 95.9 mph on his fastball and topping out at 97.7. He expects to make one more rehab start before returning to the Dodgers' rotation."}, {"title": "Brewers Clinch Tie-Breaker Over Dodgers", "text": "Milwaukee took two of three at Dodger Stadium, securing a potential playoff tie-breaker. The series loss dropped the Dodgers to 5-5 in their last 10 games and raised questions about Kyle Tucker's persistent struggles at home (.192 batting average at Dodger Stadium vs. .275 on the road)."}, {"title": "Yamamoto Shines, Díaz Redeems Himself in Friday Win", "text": "Yoshinobu Yamamoto delivered six strong innings in a 3-1 victory, and closer Edwin Díaz bounced back to earn a save after a rough stretch. Max Muncy also hit his record-breaking home run earlier in the week, passing Eric Karros for the most homers at Dodger Stadium."}, {"title": "Dodgers Mourn Tommy John", "text": "Tommy John, the legendary pitcher after whom the most famous elbow surgery in sports is named, passed away on August 16 at age 83. The Dodgers released a statement from team president Stan Kasten honoring the one-time All-Star who pitched for LA during his storied career."}]}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "Ranked No. 14, Loaded With Talent, Facing the Gauntlet — USC's Playoff-or-Bust Season Starts Now", "headline_zh": "USC 排名第14、人才濟濟卻面臨嚴峻賽程——這場「非進季後賽不可」的賽季正式揭幕", "analysis": "USC landed at No. 14 in the AP preseason poll, a reasonable landing spot for a team that went 9-4 last year and returns one of the nation's most dynamic quarterbacks in Jayden Maiava. The senior signal-caller threw for 3,711 yards and 24 TDs in 2025 and has earned Big Ten Preseason Honors, a Maxwell Award watch list nod, and a Wuerffel Trophy watch list spot heading into his final season. Lincoln Riley has called him the engine of everything USC wants to do offensively, and with his combination of arm talent and mobility, there's legitimate belief that 2026 could be a breakout year for his NFL draft stock. But the schedule is absolutely brutal: five ranked opponents in the AP Top 18 — No. 1 Ohio State, No. 2 Oregon, No. 6 Indiana, No. 17 Washington, and No. 18 Penn State. That's the most daunting slate in the Big Ten, and USC hasn't played at Indiana since 1981; they travel to Bloomington on November 14 to face the defending national champions. The offensive line took a significant hit when projected starting center Kilian O'Connor suffered a season-ending injury in practice, forcing Tobias Raymond to shift over. The loss of a team leader in the middle of the line can't be understated — O'Connor was the communication hub, and whoever replaces him needs to handle pass protection calls against some of the best defensive fronts in college football. The new $225 million Bloom Football Performance Center — a 163,000-square-foot facility featuring Nike Strength custom weight racks and AI-powered recovery tech — opened August 5 and is already a recruiting weapon. It was built in just 636 days and is the first college facility with Nike Strength's custom tracking technology for bar speed and power output. Halfway through fall camp, Riley said depth chart battles are intensifying at wide receiver and defensive line, with rookie WR 'Boobie' Feaster turning heads. The secondary remains the biggest unknown, which is problematic when you're facing quarterbacks like Ohio State's and Oregon's in the first month. USC's No. 1 overall recruiting class, headlined by 5-star OT Keenyi Pepe, 5-star EDGE Luke Wafle, and 5-star CB Elbert 'Rock' Hill, gives this roster a ceiling that most Big Ten programs can only dream of. Freshman kicker Ryon Sayeri, who set USC's single-season FG record as a redshirt freshman, is also on the Lou Groza Award watch list. The question isn't talent — it's whether a revamped offensive line and an unproven secondary can survive a murderer's row of a schedule. This is Lincoln Riley's make-or-break year, and the Trojans' first College Football Playoff berth under his watch could hinge on a November trip to Bloomington.", "analysis_zh": "USC 在 AP 季前排名中位列第14，對於一支去年打出 9-4 戰績且 returning 有全國最具爆发力 quarterback 之一 Jayden Maiava 的球隊來說是合理的定位。這位 senior 在 2025 年投出 3,711 碼和 24 次 TD，季前獲得 Big Ten 預選榮譽、Maxwell Award 和 Wuerffel Trophy 的 watch list 入選。Lincoln Riley 稱他是 USC 整個進攻體系的引擎，憑藉他的手臂天賦和機動力，人們真心相信 2026 可能是他的 NFL draft stock 爆發年。但賽程堪稱地獄級：五支 AP Top 18 排名對手——第1名 Ohio State、第2名 Oregon、第6名 Indiana、第17名 Washington 和第18名 Penn State。這是 Big Ten 中最嚴峻的賽程，USC 上次客場對 Indiana 要追溯到 1981 年；11 月 14 日他們將前往 Bloomington 挑戰衛冕 national champions。進攻線遭到重大打擊——預估先發 center Kilian O'Connor 在訓練中遭受赛季报销傷勢，迫使 Tobias Raymond 轉移位置填補空缺。失去這位球隊領袖對進攻線的影響不可小覷——O'Connor 是通訊核心，接替者必須在面對大學足球最佳 defensive fronts 時處理 pass protection calls。全新的 2.25 億美元 Bloom Football Performance Center 於 8 月 5 日啟用，佔地 163,000 平方英尺，配備 Nike Strength 客製化重量架和 AI 驅動的恢復科技，已成為招募利器。這座設施僅用 636 天建造完成，是全美首個配備 Nike Strength 客製化 bar speed 和 power output 追蹤技術的大學設施。Fall camp 過半，Riley 表示 wide receiver 和 defensive line 的 depth chart 競爭正趨白熱化，新秀 WR 'Boobie' Feaster 表現亮眼。secondary 仍是最大問號，而這在第一個月就要面對 Ohio State 和 Oregon 的 quarterback 時格外令人擔憂。USC 的全美排名第一招募班底，以 5 星 OT Keenyi Pepe、5 星 EDGE Luke Wafle 和 5 星 CB Elbert 'Rock' Hill 為首，賦予這份名單多數 Big Ten 學校望塵莫及的天賦天花板。新秀 kicker Ryon Sayeri 在 redshirt freshman 年創下 USC 單季 FG 紀錄（21 球），也在 Lou Groza Award watch list 上。問題不在 talent——而在於重新調整的進攻線和未經考驗的 secondary 能否撐過這條殺手級賽程。這是 Lincoln Riley 的成敗之年，而 Trojan 們在他執教期間的首場 College Football Playoff 可能就取決於十一月的 Bloomington 之行。", "stories": [{"title": "No. 14 in the AP Preseason Poll", "text": "USC opens the 2026 season ranked No. 14 in the AP Top 25, tied with BYU. The Trojans face five ranked teams this season: No. 1 Ohio State, No. 2 Oregon, No. 6 Indiana, No. 17 Washington, and No. 18 Penn State."}, {"title": "Jayden Maiava Earns Preseason Honors", "text": "Senior QB Jayden Maiava — who threw for 3,711 yards and 24 TDs in 2025 — earned Big Ten Preseason Honors, a Maxwell Award Watch List spot, and Wuerffel Trophy Watch List recognition. Lincoln Riley has called him the engine of USC's offense."}, {"title": "Center Kilian O'Connor Out for Season", "text": "Projected starting center and team leader Kilian O'Connor suffered a season-ending injury in practice. Tobias Raymond is expected to shift to center to fill the void, creating a significant question mark on the offensive line."}, {"title": "$225M Bloom Football Performance Center Opens", "text": "USC's state-of-the-art 163,000-square-foot football facility opened August 5, featuring Nike Strength custom weight racks, AI-powered recovery tech, and views of the Hollywood sign. It's a centerpiece of the Trojans' recruiting pitch."}, {"title": "Depth Chart Battles Intensify at Fall Camp", "text": "Halfway through fall camp, Riley said position clarity is emerging at wide receiver and defensive line, with rookie WR 'Boobie' Feaster turning heads. The secondary remains the biggest unknown heading into the season."}]}, {"team": "Rams", "accent": "#003594", "headline": "Donald's Comeback Looms Over Everything as Rams Navigate Minor Injuries and Rookie Setbacks", "headline_zh": "Donald 復出懸而未決陰影籠罩全隊，Rams 在小傷與新秀挫折中艱難前行", "analysis": "Aaron Donald has now completed two official workouts at the Rams' training facility, and every time the three-time Defensive Player of the Year shows up, the NFL holds its breath. He's 35, has been retired for two seasons, and worked out alongside current defensive linemen Braden Fiske and Desjuan Johnson — a visual that suggests he's seriously considering a return. Sean McVay says the team won't rush the decision but hopes it comes 'sooner than later.' If Donald comes back, it changes the entire calculus for a Rams defense that already added Myles Garrett via trade this offseason. The cap implications alone would be significant, but the Rams have structured their roster with enough flexibility to absorb a Donald return. Having Donald, Garrett, and the rest of this defensive line together would give LA arguably the most fearsome pass rush in football. Speaking of Garrett, the NFL sacks leader is dealing with intermittent knee swelling in his first year with the Rams and will miss a week of practice — not ideal, but the kind of load management that makes sense for a 30-year-old edge rusher with a long track record. Puka Nacua, the league's receptions leader, has psoas soreness from the Cowboys joint practice and is also sidelined, though both All-Pros are expected to return next week. McVay stressed they're prioritizing 'return to performance, not just a return to play,' a refreshing approach in a league that often pushes injured players back too soon. The bigger concern is third-round rookie tackle Keagen Trost, who suffered a multiweek hamstring injury on the Rams' first field-goal protection snap in their 20-12 preseason win over the Chiefs. Trost, the No. 93 pick out of Missouri, was the top backup at right tackle and had a 91.7 run-blocking grade at Missouri last year — the best among 632 qualified offensive tackles per PFF. Losing him for potentially the rest of the preseason is a real blow to offensive line depth, especially with Stafford needing time in the pocket to connect with Nacua and Davante Adams. On a lighter note, McVay doubled down on his belief that Matthew Stafford 'has more good football left' than people think, pointing to the quarterback's back-free training camp and a newfound 'stillness' in his approach after winning MVP last season. Stafford's $55 million extension through 2027 looks like a bargain if he maintains this level. Harrison Mevis, the 'Thiccer Kicker' who missed just one kick all last year (48/48 on PATs, 18/19 on field goals), looks locked in again — a far cry from the Joshua Karty era that was marred by special teams disasters. The Rams also signed Australian punter Jack Bouwmeester using the international player exemption, adding competition at the position without counting against the 90-man roster. The Rams open the 2026 regular season in Melbourne, Australia, against the 49ers on September 10 at the Melbourne Cricket Ground — one of the most unique Week 1 games in NFL history. LA is coming off a 12-5 season and an NFC Championship Game appearance where they fell to the eventual Super Bowl champion Seahawks 31-27. With Donald's decision hanging over everything, this team's ceiling might be the highest in the NFC — and their floor is still a playoff team.", "analysis_zh": "Aaron Donald 已在 Rams 訓練基地完成兩次正式 workout，每次這位三度 Defensive Player of the Year 出現，整個 NFL 都屏息以待。他已經 35 歲，退休兩個賽季，卻與現任 defensive linemen Braden Fiske 和 Desjuan Johnson 一同訓練——這個畫面暗示他是認真考慮復出。Sean McVay 表示球隊不會催促決定，但希望「越快越好」。如果 Donald 回歸，將徹底改變一支已經透過交易獲得 Myles Garrett 的 Rams 防守的全部算盤。光是薪資空間的影響就相當顯著，但 Rams 已將名單結構化到足夠靈活以吸收 Donald 的回歸。擁有 Donald、Garrett 和其餘 defensive line 在一起，將賦予洛杉磯 arguably 全聯盟最恐怖的 pass rush。說到 Garrett，這位 NFL sacks leader 在加盟 Rams 的第一年就遭遇間歇性膝蓋腫脹，將缺席一週訓練——對一位 30 歲且有漫長出賽紀錄的 edge rusher 來說，這種 load management 並不理想但合情合理。Puka Nacua，全聯盟 receptions leader，在與 Cowboys 的聯合訓練後出現 psoas 酸痛，同樣掛起免戰牌——但兩位 All-Pros 預計下週回歸。McVay 強調他們優先考量的是「return to performance, not just a return to play」，這在往往過早讓傷兵回歸的聯盟中是令人耳目一新的態度。更大的擔憂是第三輪 rookie tackle Keagen Trost，在 Rams 20-12 擊敗 Chiefs 的季前賽第一個 field-goal protection snap 中遭受 multiweek hamstring 傷勢。Trost 是從 Missouri 選入的第 93 順位新秀，原本是 right tackle 位置的最佳替補，在 PFF 評分中擁有 91.7 的 run-blocking grade——在 632 位合格 offensive tackle 中排名第一。失去他 potentially 整個季前賽對 offensive line depth 是真正的打擊，尤其當你需要 Stafford 有充足的 pocket 時間來連結 Nacua 和 Davante Adams 時。輕鬆一點的消息是 McVay 再次力挺 Matthew Stafford「比人們想像的還有更多好 football 可以打」，指出 quarterback 在贏得 MVP 後的 training camp 完全沒有 back issues，且比賽心態進入了一種「平靜與享受」的新境界。Stafford 通過 2027 年的 5500 萬美元延期合約如果他維持這個水準來看堪稱划算。Harrison Mevis，綽號「Thiccer Kicker」，去年全年只 miss 一球（48/48 PATs、18/19 FGs），看起來又進入了穩定狀態——與 Joshua Karty 時代的 special teams 災難形成強烈對比。Rams 還使用國際球員名額簽下了澳洲 punter Jack Bouwmeester，為該位置增添競爭而不佔 90 人名單名額。Rams 將於 9 月 10 日在澳洲墨爾本板球場（Melbourne Cricket Ground）對戰 49ers，拉開 2026 賽季序幕——這是 NFL 歷史上最獨特的 Week 1 比賽之一。洛杉磯去年打出 12-5 戰績並打入 NFC Championship Game，以 31-27 敗給最終的 Super Bowl champion Seahawks。在 Donald 的決定懸而未決的情況下，這支球隊的天花板可能是全 NFC 最高的——而他們的底線仍然是季後賽球隊。", "stories": [{"title": "Aaron Donald Completes Second Workout", "text": "The three-time DPOY has now worked out twice at the Rams' facility as he contemplates ending his two-season retirement at age 35. McVay says the team won't rush the decision but hopes it comes 'sooner than later.' Donald worked out alongside current DL Braden Fiske and Desjuan Johnson."}, {"title": "Nacua and Garrett Miss Practice With Minor Injuries", "text": "NFL receptions leader Puka Nacua has psoas soreness from the Cowboys joint practice, while sacks leader Myles Garrett is dealing with intermittent knee swelling. Both All-Pros are expected to return next week, with McVay stressing a 'return to performance' approach."}, {"title": "Rookie Tackle Keagen Trost Suffers Multiweek Hamstring Injury", "text": "Third-round pick Keagen Trost, the top backup at right tackle who posted a nation-leading 91.7 run-blocking grade at Missouri last year, suffered a multiweek hamstring injury on the Rams' first field-goal protection snap in their preseason win over the Chiefs."}, {"title": "McVay: Stafford Has More Left Than People Think", "text": "Entering Year 18 after winning MVP, Matthew Stafford showed up sharp to training camp with no back issues. McVay pushed back on decline narratives, saying Stafford has found 'a stillness, a peace and enjoyment' and could play well beyond his $55M extension through 2027."}, {"title": "Mevis Locked In, Rams Add Punter Competition", "text": "Harrison Mevis missed just one kick all last season (48/48 PATs, 18/19 FGs) and looks steady again heading into 2026. The Rams also signed Australian punter Jack Bouwmeester using the international player exemption, adding competition at punter."}, {"title": "Rams Open Season in Melbourne on September 10", "text": "The Rams will face the 49ers at the Melbourne Cricket Ground on September 10, making it one of the most unique Week 1 games in NFL history. LA is coming off a 12-5 season and an NFC Championship Game appearance."}]}], "closing": "That's your Sunday morning digest. The Dodgers need their pitching reinforcements back yesterday, USC is staring down a schedule that could make or break Lincoln Riley's tenure, and the Rams might just get the most dominant defender in NFL history back on their roster. It's a good time to be an LA sports fan — stay hydrated, stay loud, and we'll see you tomorrow.", "closing_zh": "以上就是你的週日早間體育摘要。道奇需要他們的投球援軍「昨天就回來」，USC 正面臨可能決定 Lincoln Riley 命運的魔鬼賽程，而 Rams 有可能迎回 NFL 歷史上最統治級的防守球員。現在是做洛杉矶球迷的好時刻——保持水分、保持吶喊，明天見。"};
let lang = "en";
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function renderDigest(d){
  const box = document.getElementById("digest");
  if(!d || !d.segments){
    box.innerHTML = '<div style="text-align:center;color:var(--dim);padding:40px">No digest yet</div>';
    return;
  }
  const segs = d.segments.map(s=>{
    const headline = lang==="en" ? s.headline : s.headline_zh;
    const analysis = lang==="en" ? s.analysis : s.analysis_zh;
    return '<div class="seg" style="--team:'+esc(s.accent)+'">' +
      '<div class="row"><span class="hn">'+esc(headline)+'</span><span class="badge">'+esc(s.team)+'</span></div>' +
      '<div class="lbl">'+(lang==="en"?"Analysis":"分析")+'</div><p>'+esc(analysis)+'</p>' +
      '</div>';
  }).join("");
  box.innerHTML =
    '<div class="dhead">' +
      '<div class="t"><div class="mic">🎙️</div><div><h2>'+esc(d.title)+'</h2><div class="meta">' +
        esc(d.read_time || "")+' · '+new Date(d.updated_at).toLocaleString()+
        ' · 繁中/EN</div></div></div>' +
      '<div class="langs">'+
        '<button id="btnEn" class="on" onclick="setLang(\'en\')">EN</button>'+
        '<button id="btnZh" onclick="setLang(\'zh\')">繁體中文</button>'+
      '</div>' +
    '</div>' +
    '<div class="intro">'+esc(lang==="en"?d.intro:d.intro_zh)+'</div>' +
    '<div class="segs">'+segs+'</div>' +
    '<div class="closing">'+esc(lang==="en"?d.closing:d.closing_zh)+'</div>';
}
function setLang(v){ lang = v; document.getElementById("btnEn").classList.toggle("on", v==="en"); document.getElementById("btnZh").classList.toggle("on", v==="zh"); renderDigest(DIGEST_DATA); }

function renderNews(d){ document.getElementById("upd").textContent = new Date(d.updated_at).toLocaleString();
  const g = document.getElementById("grid"); g.innerHTML = "";
  for(const t of d.teams){
    const c = document.createElement("div"); c.className = "card"; c.style.setProperty("--team", t.accent);
    const emoji = t.emoji==="Baseball"?"⚾":t.emoji==="Football"?"🏈":"🏆";
    c.innerHTML =
      '<div class="top"><div class="ico">' + emoji + '</div>' +
      '<div><div class="name">' + esc(t.name) + '</div><div class="rec">' + t.sport + ' · ' + esc(t.record) + '</div></div></div>' +
      '<div class="hline">' + esc(t.headline) + '</div>' +
      '<h3>Latest News</h3><ul class="news">' + t.latest_news.map(n =>
        '<li><a target="_blank" rel="noopener" href="' + esc(n.url) + '">' + esc(n.title) + '</a><p>' + esc(n.summary) + '</p></li>'
      ).join("") + '</ul>' +
      '<h3>Fun Facts</h3><ul class="facts">' + t.fun_facts.map(f => '<li>'+esc(f)+'</li>').join("") + '</ul>' +
      '<h3>Further Reading</h3><ul class="read">' + t.further_reading.map(f =>
        '<li><a target="_blank" rel="noopener" href="' + esc(f.url) + '"><span>'+esc(f.title)+'</span><span class="why">'+esc(f.why)+'</span></a></li>'
      ).join("") + '</ul>' +
      '<div class="oss">' + esc(t.one_sentence) + '</div>';
    g.appendChild(c);
  }
}

renderDigest(DIGEST_DATA);
renderNews(TEAMS_DATA);
</script>
</body>
</html>
