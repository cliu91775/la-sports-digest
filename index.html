<style>
  :root{
    --bg:#0b0e14; --panel:rgba(255,255,255,.04); --panel2:rgba(255,255,255,.02);
    --line:rgba(255,255,255,.08); --fg:#edf2fa; --dim:#8a94a6;
    --radius:18px; --glow:0 0 0 1px rgba(255,255,255,.04), 0 24px 60px -30px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 500px at 20% -10%, rgba(42,111,216,.18), transparent 60%),
      radial-gradient(1000px 500px at 90% -10%, rgba(153,0,0,.14), transparent 60%),
      radial-gradient(900px 400px at 50% 110%, rgba(31,78,156,.16), transparent 60%),
      var(--bg);
    color:var(--fg); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
    padding:28px clamp(16px,4vw,64px) 64px;
  }
  header{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:26px}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{
    width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;
    background:linear-gradient(135deg,#2a6fd8,#991111);box-shadow:0 8px 30px -8px rgba(60,90,220,.6);
  }
  h1{font-size:clamp(22px,3vw,32px);font-weight:800;letter-spacing:-.02em}
  .sub{color:var(--dim);font-size:13px;margin-top:4px}
  .ticker{
    font-size:12px;color:var(--dim);padding:8px 14px;border-radius:99px;
    background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);
  }
  .ticker b{color:#7ce38b}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:20px}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;backdrop-filter:blur(14px);box-shadow:var(--glow);position:relative;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--team,#2a6fd8),transparent);
  }
  .top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .ico{
    width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;
    background:color-mix(in srgb,var(--team) 22%, transparent);
  }
  .name{font-size:18px;font-weight:800;letter-spacing:-.01em}
  .rec{font-size:11px;color:var(--team);font-weight:700;margin-top:2px}
  .hline{font-size:13px;line-height:1.5;color:var(--dim);padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);margin-bottom:16px}

  h3::after{content:"";flex:1;height:1px;background:var(--line)}
  .news{list-style:none}
  .news li{padding:10px 12px;border-radius:12px;margin-bottom:6px;background:var(--panel2);border:1px solid var(--line);transition:.2s}
  .news li:hover{border-color:color-mix(in srgb,var(--team) 50%, transparent);transform:translateX(3px)}
  .news a{color:var(--fg);text-decoration:none;font-weight:700;font-size:13px;display:block;margin-bottom:4px}
  .news a:hover{color:var(--team)}
  .news p{font-size:12px;color:var(--dim);line-height:1.5}
  .facts{list-style:none;display:grid;gap:6px}
  .facts li{position:relative;padding:2px 0 2px 18px;font-size:12.5px;color:var(--fg);line-height:1.55}
  .facts li::before{content:"⚡";position:absolute;left:0;top:2px;font-size:11px;filter:grayscale(.4)}
  .read{list-style:none;display:grid;gap:6px}
  .read a{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12.5px;color:var(--fg);text-decoration:none;padding:9px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
  .read a:hover{color:var(--team);border-color:color-mix(in srgb,var(--team) 50%, transparent)}
  .read .why{font-size:11px;color:var(--dim)}
  .oss{font-size:12.5px;line-height:1.6;color:var(--fg);background:linear-gradient(90deg,color-mix(in srgb,var(--team) 18%,transparent),transparent);border-left:3px solid var(--team);padding:10px 14px;border-radius:0 12px 12px 0;margin-top:16px}
  banner{display:block;text-align:center;color:var(--dim);font-size:13px;margin-top:22px}
  banner span{color:#7ce38b;animation:blink 1.5s infinite}
  @keyframes blink{50%{opacity:.3}}
  .spin{width:100%;height:100px;display:grid;place-items:center;color:var(--dim)}
  /* ---- digest ---- */
  .digest{
    background:linear-gradient(135deg,rgba(42,111,216,.12),rgba(153,0,0,.10),rgba(31,78,156,.12)),var(--panel);
    border:1px solid var(--line);border-radius:var(--radius);padding:26px;
    backdrop-filter:blur(14px);box-shadow:var(--glow);margin-bottom:22px;
  }

  .dhead .t{display:flex;align-items:center;gap:12px}
  .mic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:linear-gradient(135deg,#2a6fd8,#991111)}
  .dhead h2{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .dhead .meta{color:var(--dim);font-size:12px;margin-top:3px}
  .langs{display:flex;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:4px}
  .langs button{border:0;background:transparent;color:var(--dim);font-size:12px;font-weight:700;padding:6px 16px;border-radius:99px;cursor:pointer;transition:.2s}
  .langs button.on{background:linear-gradient(135deg,#2a6fd8,#1f4e9c);color:#fff}
  .intro{font-size:14px;line-height:1.65;color:var(--fg);max-width:820px;margin-bottom:18px}
  .segs{display:grid;gap:12px}
  .seg{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--panel2)}
  .seg .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .seg .row .hn{font-weight:800;font-size:14.5px}
  .seg .badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--team,#2a6fd8) 20%,transparent);color:var(--team);white-space:nowrap}
  .seg p{font-size:12.5px;line-height:1.6;color:var(--dim);margin-top:6px}
  .seg p.cls{color:var(--fg)}
  .seg .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin-top:10px;font-weight:700}
  .closing{font-size:14px;line-height:1.6;border-top:1px dashed var(--line);margin-top:16px;padding-top:14px;color:var(--fg)}
</style>

as) and Garrett (knee) still non-participants entering final week of preseason", "summary": "Puka Nacua has not practiced since Aug. 11 due to a lingering psoas issue, and Myles Garrett remains sidelined with knee swelling. Both are being managed carefully ahead of the Sept. 10 opener vs. the 49ers in Melbourne.", "url": "https://www.therams.com/news/"}, {"title": "QB2 battle still raging between Ty Simpson and Stetson Bennett", "summary": "With Jimmy Garoppolo gone, Sean McVay still hasn't named a backup to Matthew Stafford. Simpson (13th overall pick) got his shot vs. the Chiefs; Bennett went 19-of-31 for 181 yards with two rushing TDs vs. the Saints. Both will play in Thursday's preseason finale vs. the Chargers.", "url": "https://clutchpoints.com/nfl/los-angeles-rams/rams-news-los-angeles-qb2-battle-still-raging-between-ty-simpson-stetson-bennett"}, {"title": "Rams sign Steven Gilmore (brother of Stephon) and Devean Deal; place Thomas & McPhearson on IR", "summary": "Keir Thomas II (groin) and Zech McPhearson were placed on injured reserve, ending their 2026 seasons. CB Steven Gilmore, brother of former DPOY Stephon Gilmore, and OLB Devean Deal were signed as camp bodies. LB Daniel Rickert waived with injury designation.", "url": "https://www.si.com/nfl/rams/onsi/rams-roster-moves-devean-deal-steven-gilmore"}, {"title": "Canadian pass rusher Wesley Bailey earns rave reviews from McVay", "summary": "UDFA Wesley Bailey racked up 5 tackles, a sack, a forced fumble, and 10 total pressures in the 34-0 win over the Saints. McVay said: 'You felt his presence all day.' Bailey could push for a roster spot with Keir Thomas now on IR.", "url": "https://3downnation.com/2026/08/23/you-felt-his-presence-all-day-canadian-pass-rusher-wesley-bailey-earns-rave-reviews-from-sean-mcvay-after-l-a-rams-preseason-victory/"}, {"title": "Alex Cook's 100-yard pick-six a dream come true in 34-0 Saints rout", "summary": "Safety Alex Cook, signed July 27, intercepted Spencer Rattler and returned it 100 yards for a TD. The journeyman, who also had a pick-six and scoop-and-score in the UFL, is making a strong case for a roster spot in a crowded secondary.", "url": "https://heavy.com/sports/nfl/los-angeles-rams/rams-alex-cook-100-yard-pick-six-saints/"}, {"title": "OL Justin Dedich returns to practice after hand injury", "summary": "Backup guard Justin Dedich was activated off the non-football injury list and practiced Monday for the first time since a July 4th hand injury. McVay called him 'an important part of our operation.' Dedich has played 29 games with 9 starts over two seasons.", "url": "https://www.yourvalley.net/stories/rams-backup-ol-justin-dedich-practices-for-first-time-after-hand-injury,714495"}], "fun_facts": ["Matthew Stafford won his first NFL MVP award after leading the league with 4,707 passing yards and 46 TDs in 2025.", "The Rams drafted QB Ty Simpson 13th overall — Stafford's apparent heir — the same offseason Stafford won MVP and signed an extension.", "Rams' 2026 regular-season opener vs. the 49ers on Sept. 10 will be played at the MCG in Melbourne, Australia — the first NFL game down under.", "Puka Nacua never considered a contract holdout despite entering the final year of his 4-year, $4M rookie deal as a former 5th-round pick.", "Wesley Bailey was the 4th-ranked prospect in the 2026 CFL Draft but chose the NFL; the Edmonton Elks own his CFL rights."], "further_reading": [{"title": "McVay gutted for Rams' recently injured players: 'It sucks'", "why": "McVay's emotional reaction to three players going down before the season even starts, including the second straight year Keir Thomas has landed on IR before cuts.", "url": "https://theramswire.usatoday.com/story/sports/nfl/rams/2026/08/25/rams-injuries-sean-mcvay-keir-thomas-practice/91453760007/"}, {"title": "5 Takeaways from Rams' 34-0 preseason Week 2 win over Saints", "why": "Comprehensive breakdown of QB usage, Wesley Bailey's emergence, and the secondary's dominant performance.", "url": "https://www.therams.com/news/"}, {"title": "Puka Nacua never considered a contract holdout", "why": "Nacua's candid discussion about his off-field situation, contract negotiations, and commitment to the team entering the final year of his rookie deal.", "url": "https://infonews.ca/news/7790872/wr-puka-nacua-never-considered-a-contract-holdout-while-he-rebuilds-his-reputation-with-the-rams/"}, {"title": "Rams Audio: Garrett, Nacua & coordinators on training camp", "why": "Key audio from Myles Garrett, Puka Nacua, and coaches discussing camp, a potential Aaron Donald return, and building team chemistry.", "url": "https://www.therams.com/audio/rams-audio-myles-garrett-puka-nacua-rams-coordinators-training-camp-press-conference-building-team-chemistry"}], "one_sentence": "The Rams are 2-0 in preseason after obliterating the Saints 34-0, but eyes are on the Nacua/Garrett injuries and the Simpson/Bennett QB2 battle heading into Thursday's finale vs. the Chargers."}]};
const DIGEST_DATA = {"updated_at": "2026-08-25T08:39:48-07:00", "title": "LA Sports Daily Digest — 15-Minute Edition", "read_time": "~15 minutes", "intro": "It's a momentous Monday in Los Angeles sports. The Dodgers are loading up their rotation for October with Glasnow returning and Ohtani's pitching comeback on the horizon, USC is days away from kicking off a make-or-break season, and the Rams are trimming their roster with the Melbourne opener just weeks away. Let's get into it.", "intro_zh": "洛杉磯體壇迎來一個重要的週一。道奇隊正為十月季後賽加強投手陣容，Glasnow即將回歸，Ohtani投球復出在望；南加大USC即將展開關鍵一季；Rams則在裁員潮中備戰墨爾本開幕戰。以下為您帶來今日完整報導。", "segments": [{"team": "Dodgers", "accent": "#2A6FD8", "headline": "Ohtani's Pitching Return Imminent — One More Session Away from the Mound", "headline_zh": "Ohtani投球復出在望——再一場實戰後即可重返投手丘", "analysis": "Shohei Ohtani threw a 30-pitch live batting practice session on August 22 and looked every bit the ace the Dodgers signed. Reports indicate his fastball velocity was up, his splitter was diving, and his command was sharp. After one more session during the Atlanta series, Ohtani could be back on the mound for the first time since July 3.\n\nThe context here is enormous. Ohtani's pitching absence left a gaping hole in the Dodgers' rotation for nearly two months, and the team managed to go 29-15 without him on the mound. But the real story isn't about surviving — it's about what happens when he returns. A rotation that already features Tarik Skubal, Yoshinobu Yamamoto, Tyler Glasnow, and Blake Snell now adds a generational two-way talent.\n\nManager Dave Roberts has said the buildup will be more aggressive than last year's. That's a significant departure from the cautious approach the team took in 2025, and it signals that the Dodgers believe Ohtani's arm is fully healed from the UCL surgery that cost him his entire 2024 pitching season. With a 9-game NL West cushion, the Dodgers have the luxury of being strategic rather than desperate.\n\nFrom an analyst's perspective, this is the most dangerous version of the Dodgers we've seen. The question isn't whether they'll make the playoffs — they could clinch the division by mid-September. The question is whether October rotation depth of this magnitude has ever existed in modern baseball. Ohtani's return transforms this from a very good team into a historically formidable one.\n\nThe wildcard is workload management. How do you fit six legitimate aces into a five-man rotation? Piggyback starts, strategic rest, and an expanded postseason roster all factor in. But having too many elite arms has never been a problem a team actually wanted to have. The Dodgers are about to find out.", "analysis_zh": "Shohei Ohtani在8月22日進行了一場30球的實戰打擊練習，表現完全展現了道奇隊當初簽下他的王牌水準。報導指出他的速球球速提升，指叉球下墜幅度出色，控球也相當精準。在亞特蘭大系列賽中再進行一場實戰練習後，Ohtani將自7月3日以來首次重返投手丘。\n\n這背後的意義極為重大。Ohtani的缺陣讓道奇隊在近兩個月內的先發輪值出現巨大缺口，而球隊在沒有他投球的情況下仍繳出29勝15負的成績。但真正的關鍵並非撐過這段期間，而是他回歸後的影響力。一個已經擁有Tarik Skubal、Yoshinobu Yamamoto、Tyler Glasnow和Blake Snell的輪值，再加上一位世代級的雙刀流球星，其深度可謂前所未見。\n\n總教練Dave Roberts表示，這次的復出進程將比去年更加積極。這與2025年球隊採取的謹慎策略有顯著不同，也表明道奇隊相信Ohtani的手臂已從2024年整季缺席的UCL手術中完全康復。在國聯西區領先9場的優勢下，道奇隊有餘裕進行策略性安排而非被迫應戰。\n\n從分析角度來看，這是我們見過最危險版本的道奇隊。問題不在於他們能否打進季後賽——他們可能在九月中旬就提前封王。問題在於，這種級別的十月投手陣容深度在現代棒球史上是否曾經存在過。Ohtani的回歸將這支球隊從一支頂尖強隊提升為具有歷史意義的豪強。\n\n最大的變數在於投球量管理。如何將六位頂級王牌塞進五人先發輪值？Piggyback投法、策略性輪休和擴大季後賽名單都是可行方案。但投手人才過剩從來不是球隊真正想解決的問題。道奇隊即將驗證這一切。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Glasnow Activated Tuesday — 111-Day Absence Ends in Atlanta", "headline_zh": "Glasnow週二歸隊——111天傷缺後將在亞特蘭大復出", "analysis": "Tyler Glasnow will be activated off the 60-day injured list on Tuesday to start against the Braves, ending a 111-day absence caused by lower back spasms. He hasn't pitched for the Dodgers since May 6, but his final rehab outing was dominant — 9 strikeouts in 5⅓ innings for Triple-A Oklahoma City.\n\nGlasnow's return gives the Dodgers another frontline arm just as Ohtani prepares to rejoin the rotation. When healthy, Glasnow is one of the most unhittable pitchers in baseball — a 6-foot-8 right-hander with a fastball that touches 100 mph and a devastating curveball. The problem has always been health. He missed significant time in 2024 and now again in 2025.\n\nThe timing is critical. The Dodgers' schedule intensifies in September with matchups against the Padres, Diamondbacks, and a potential October preview against the Phillies. Having Glasnow for the stretch run could be the difference between coasting into October and building the kind of postseason momentum that translates into championships.\n\nWhat makes this particularly interesting is the depth it creates. With Glasnow, Ohtani, Skubal, Yamamoto, and Snell, the Dodgers arguably have five legitimate aces. That's not hyperbole — each of those pitchers would be the ace on most MLB teams. The challenge for Dave Roberts will be managing egos and workloads, but that's the kind of problem every manager in baseball wishes they had.\n\nFrom a strategic standpoint, Glasnow's return also gives the Dodgers flexibility in the trade deadline's aftermath. They didn't need to overpay for pitching at the deadline because they knew help was coming. Now that help has arrived, and the Dodgers are positioned to have the deepest rotation in baseball heading into October.", "analysis_zh": "Tyler Glasnow將在週二被從60天傷兵名單激活，對陣勇士隊先發登板，結束長達111天的下背痙攣傷缺。他自5月6日起就未為道奇隊出賽，但最後一次復健賽表現驚人——在3A奧克拉荷馬城投出5⅓局9次三振的主宰級表現。\n\nGlasnow的回歸讓道奇隊在Ohtani準備重返輪值的同時，又增添了一位王牌級投手。健康狀態下的Glasnow是全聯盟最難對付的投手之一——身高6呎8吋的右投手，速球可達100英里，搭配一顆極具破壞力的曲球。問題始終在於健康。他在2024年就有過長時間缺陣，2025年再次遭遇相同困境。\n\n時機至關重要。道奇隊九月的賽程將更加嚴峻，包括對教士、響尾蛇的系列賽，以及可能作為十月對決預演的費城人系列戰。在季末衝刺階段擁有Glasnow，可能是平淡進入季後賽與建立具轉化為總冠軍的季後賽動能之間的關鍵差異。\n\n特別有趣的是Glasnow歸隊所創造的輪值深度。擁有Glasnow、Ohtani、Skubal、Yamamoto和Snell，道奇隊可以說擁有五位真正的王牌投手。這並非誇大其詞——這五位投手中的任何一位在大多數MLB球隊都是當家王牌。Dave Roberts面臨的挑戰將是管理投手的出場順序和投球量，但這是全聯盟所有總教練都夢寐以求的問題。\n\n從策略角度來看，Glasnow的回歸也讓道奇隊在交易截止日後擁有更多靈活性。他們在交易截止日無需為投手過度付出代價，因為他們知道援軍即將到來。如今援軍已至，道奇隊正處於以全聯盟最深厚輪值陣容進入十月的最佳位置。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Pages Suffers Fractured Hand — Dodgers Call Up Alek Thomas", "headline_zh": "Pages手部骨折——道奇隊緊急拉上Alek Thomas", "analysis": "All-Star center fielder Andy Pages was struck on the left hand by a pitch on August 21, and X-rays revealed a fracture that required surgery. The Dodgers expect him to miss at least until late September — potentially the entire remainder of the regular season. In a corresponding move, former Diamondbacks outfielder Alek Thomas was called up.\n\nThis is the one significant blow to what has otherwise been a dream season for the Dodgers. Pages has been one of the best center fielders in the National League, combining Gold Glove-caliber defense with a potent bat in the middle of the lineup. His absence forces the Dodgers to get creative with their outfield alignment during a crucial stretch of the season.\n\nAlek Thomas is a reasonable stopgap. The 24-year-old left-handed hitter showed flashes of brilliance in Arizona, particularly against right-handed pitching. But he's not Pages, and the Dodgers know it. The question is whether Thomas can hold down center field adequately enough to prevent the lineup from losing its rhythm.\n\nThe timing couldn't be worse in one sense — the Dodgers are 80-51 and running away with the NL West, so they can afford to be cautious. But in another sense, the timing is fine because Pages should be healthy for the postseason. The Dodgers' depth means they can absorb this loss during the regular season without derailing their October plans.\n\nFrom a broader perspective, this injury underscores the Dodgers' remarkable roster construction. They have the depth to lose an All-Star center fielder and still feel comfortable about their chances. Most teams would be in crisis mode. The Dodgers simply plug in the next man and keep rolling. That's the mark of a well-constructed roster.", "analysis_zh": "全明星中外野手Andy Pages在8月21日被投球擊中左手，X光檢查顯示骨折並需要手術。道奇隊預計他至少要到九月底才能歸隊——可能缺席整個例行賽尾聲。作為對應調度，前響尾蛇外野手Alek Thomas被拉上大聯盟。\n\n這是道奇隊本季夢幻賽季中唯一的重大打擊。Pages一直是國家聯盟頂尖的中外野手之一，兼具金手套等級的守備和中心打線的強大火力。他的缺陣迫使道奇隊在外野配置上必須做出調整，而這正是球季關鍵的衝刺階段。\n\nAlek Thomas是合理的過渡方案。這位24歲的左打者在亞利桑那展現過亮眼表現，特別是對右投手時。但他不是Pages，道奇隊也心知肚明。關鍵在於Thomas能否在中外野位置上提供足夠的防守穩定性，讓打線不會失去節奏。\n\n從某個角度來看，時機再糟糕不過——道奇隊80勝51負正遙遙領先國聯西區，有足夠的本錢從容應對。但從另一個角度來看，時機其實恰當，因為Pages應能在季後賽時完全康復。道奇隊的陣容深度讓他們在例行賽期間能夠承受這種損失而不影響十月計畫。\n\n從更宏觀的視角來看，這次受傷突顯了道奇隊卓越的球員建構能力。他們損失了一位全明星中外野手，仍能對自己的前景感到安心。大多數球隊會陷入危機模式，而道奇隊只是換上下一個人繼續前進。這就是一支優秀球隊的標誌。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Dodgers Sweep Pirates, Match Season-High 6-Game Win Streak", "headline_zh": "道奇隊橫掃海盜——追平本季最長6連勝", "analysis": "The Dodgers completed a three-game sweep of the Pirates behind strong outings from Blake Snell and Tarik Skubal, the latter striking out 11 batters. Tommy Edman delivered a walk-off hit to seal the final game, pushing the Dodgers' record to 80-51 and extending their NL West lead to 9 games over the Padres.\n\nThis sweep is significant not for the opponent — the Pirates are one of the worst teams in baseball — but for the manner in which the Dodgers won. Snell and Skubal were dominant, the bullpen was airtight, and the offense produced timely hits. That's the formula for October success, and the Dodgers are executing it in late August.\n\nThe 9-game NL West lead is the largest in the National League, and it effectively means the Dodgers can clinch the division by mid-September. That gives them the luxury of resting key players down the stretch and lining up their rotation perfectly for the postseason. It's a position every team covets and very few achieve.\n\nSkubal's 11-strikeout performance is particularly noteworthy. The Dodgers acquired him at the trade deadline, and he's been everything they hoped for and more. A rotation that already had Yamamoto and Snell now has Skubal dealing at an elite level, and when you add the impending returns of Glasnow and Ohtani, the Dodgers are assembling what could be the most talented postseason rotation in recent memory.\n\nWhat makes this win streak even more impressive is the context. The Dodgers are doing this without Andy Pages, without Will Smith, and without Ohtani pitching. They're winning with a diminished roster, which speaks to the depth and talent of this team. When they get everyone back for October, the rest of the National League should be very concerned.", "analysis_zh": "道奇隊在Blake Snell和Tarik Skubal的強勢先發帶領下完成對海盜的三連勝橫掃，後者更是飆出11次三振。Tommy Edman在最後一戰敲出再見安打，將道奇隊戰績推進至80勝51負，國聯西區領先教士擴大至9場。\n\n這次橫掃的意義不在對手——海盜是全聯盟最差的球隊之一——而在於道奇隊的贏球方式。Snell和Skubal主宰全場，牛棚滴水不漏，打線在關鍵時刻適時貢獻。這就是十月成功的方程式，而道奇隊在八月下旬就已完美執行。\n\n9場的國聯西區領先優勢是全聯盟最大，這 effectively 意味著道奇隊可在九月中旬提前封王。這讓他們在季末衝刺階段擁有輪休關鍵球員和完美安排季後賽輪值的奢侈。這是每支球隊都渴望卻很少能達到的境界。\n\nSkubal的11次三振表現尤其值得關注。道奇隊在交易截止日得到他，而他表現得比預期還要出色。一個已經擁有Yamamoto和Snell的輪值如今又增添了Skubal的頂級表現，再加上即將歸隊的Glasnow和Ohtani，道奇隊正在組建可能是近年來最具天賦的季後賽投手陣容。\n\n讓這次連勝更加令人印象深刻的是其背景。道奇隊是在沒有Andy Pages、沒有Will Smith、沒有Ohtani投球的情況下做到的。他們以削弱的陣容贏球，這體現了這支球隊的深度和天賦。當他們在十月迎回所有主力時，整個國家聯盟都應該高度警惕。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Will Smith Takes Live BP — Catcher Nearing September Return", "headline_zh": "Will Smith進行實戰打擊練習——捕手九月回歸在望", "analysis": "Three-time All-Star catcher Will Smith took live batting practice for the first time since going on the injured list with neck inflammation. The Dodgers expect him to return in early September, giving them a significant upgrade behind the plate and in the middle of the lineup.\n\nSmith's absence has been felt more than the Dodgers would care to admit. He's one of the best hitting catchers in baseball, a switch-hitter with power from both sides and excellent pitch-framing skills. His replacement has been adequate but not spectacular, and the drop-off has been noticeable in both the lineup and behind the plate.\n\nThe timing of his return is ideal. Early September means Smith should be fully integrated into the lineup before the postseason begins. He'll have three weeks to get his timing back, build rapport with the pitching staff, and shake off any rust from the layoff. That's a reasonable timeline for a player of his caliber.\n\nFrom a lineup construction standpoint, Smith's return gives the Dodgers another switch-hitter in the middle of the order. Combined with the returns of Pages (potentially) and the addition of Ohtani's bat in the lineup on non-pitching days, the Dodgers' offense could be at full strength for the first time all season during the most important stretch.\n\nThe Dodgers' ability to weather these injuries without losing ground in the standings is a testament to their organizational depth. They've had to navigate absences from Ohtani, Glasnow, Smith, and Pages at various points this season, and they've gone 80-51. That's not luck — that's a well-built team that can sustain losses and still perform at an elite level.", "analysis_zh": "三屆全明星捕手Will Smith自因頸部發炎進傷兵名單以來，首次進行實戰打擊練習。道奇隊預計他將在九月初歸隊，在本壘板後方和中心打線提供顯著升級。\n\nSmith缺陣的影響比道奇隊願意承認的更大。他是全聯盟頂尖的打擊型捕手之一，左右開弓且兩側都有長打能力，同時具備優異的本壘板後擋球技巧。他的替補表現尚可但不夠出色，無論在打線還是守備端，水平差距都很明顯。\n\n回歸的時機恰到好處。九月初歸隊意味著Smith應能在季後賽開始前完全融入打線。他將有三週時間找回擊球節奏、與投手群建立默契，並消除長期缺席的生疏感。對他這個級別的球員來說，這是合理的時間表。\n\n從打線建構的角度來看，Smith的回歸讓道奇隊在中心打線增添了一名左右開弓的打者。結合Pages（可能）的回歸和Ohtani在非投球日的打擊貢獻，道奇隊的攻擊火力有望在赛季最重要階段首次達到完全體。\n\n道奇隊在缺陣危機中仍能在戰績上保持領先，這證明了他們的組織深度。本季他們經歷了Ohtani、Glasnow、Smith和Pages的輪流缺陣，卻仍繳出80勝51負的成績。這不是運氣——這是一支建構完善、能承受損失卻仍保持頂級表現的球隊。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Ownership Drama: Team President Reaffirms 'Dodgers Are Not Being Sold'", "headline_zh": "股權風波：球團總裁重申「道奇隊不出售」", "analysis": "Amid questions about controlling owner Mark Walter and federal investigations surrounding his company TWG Global, team president Stan Kasten held a press conference to reassure fans that the Dodgers are not being sold. However, an LA Times report suggests the situation could still impact the franchise in meaningful ways.\n\nThis is the kind of story that makes fans uneasy even when the reassurances sound convincing. Walter has been the controlling owner since 2012, and during that time the Dodgers have become one of baseball's most successful and valuable franchises. Any threat to that stability — real or perceived — sends ripples through the fanbase.\n\nThe federal investigations surrounding TWG Global are serious business. While Kasten was emphatic about the team not being for sale, the mere existence of these investigations raises questions about Walter's ability to continue leading the franchise. History tells us that ownership uncertainty can distract from on-field performance, even for the best-run organizations.\n\nFrom an analyst's perspective, the timing is unfortunate. The Dodgers are in the middle of what could be a historic season, and the last thing they need is a distraction from the field. But this is Los Angeles — big-market teams deal with these kinds of stories regularly, and the Dodgers have shown an ability to compartmentalize and perform despite off-field noise.\n\nThe real concern isn't a sale itself — if the Dodgers were sold, they'd likely fetch a record-breaking price and attract ownership groups with deep pockets. The concern is the process: how long would it take, how disruptive would it be, and would it affect the team's willingness to spend on player payroll? Those are questions that don't have answers yet, and that uncertainty is what makes this story worth watching.\n\nFor now, the Dodgers are playing at an elite level, and that's what matters most. But this is a story that won't go away until the investigations conclude, and it's one that every Dodgers fan should have on their radar.", "analysis_zh": "在球團老闆Mark Walter及其公司TWG Global面臨聯邦調查之際，球團總裁Stan Kasten召開記者會向球迷保證道奇隊不會被出售。然而，《洛杉磯時報》的報導暗示此事件仍可能以實質方式影響球隊。\n\n這類新聞即使在保證聽起來令人信服時，仍會讓球迷感到不安。Walter自2012年起擔任控股老闆，在此期間道奇隊已成為全聯盟最成功、最有價值的球隊之一。任何對這種穩定性的威脅——無論真實或感知——都會在球迷群中引起波瀾。\n\nTWG Global面臨的聯邦調查是嚴肅的議題。雖然Kasten強調球隊不出售，但這些調查的存在本身就引發了關於Walter繼續領導球隊能力的質疑。歷史告訴我們，所有權的不確定性即使對管理最完善的組織也可能影響場上表現。\n\n從分析角度看，時機令人遺憾。道奇隊正處於可能創造歷史的赛季中，他們最不需要的就是場外的干擾。但這裡是洛杉磯——大市場球隊定期面對這類新聞，而道奇隊已展現出在場外噪音中保持專注並持續表現的能力。\n\n真正的擔憂不在於出售本身——如果道奇隊被出售，很可能創下破紀錄的交易價格並吸引財力雄厚的所有權團體。擔憂在於過程：需要多長時間、會造成多大干擾、是否會影響球隊在球員薪資上的投入意願？這些問題目前都沒有答案，正是這種不確定性讓這個故事值得持續關注。\n\n目前，道奇隊正以頂級水平比賽，這才是最重要的。但這是一個在調查結案前不會消失的話題，每位道奇隊球迷都應該將其放在雷達上。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "Preseason No. 14 — It's CFP or Bust for Lincoln Riley's Deepest Roster Yet", "headline_zh": "季前賽第14名——Lincoln Riley最深厚陣容面臨CFP-or-bust關鍵賽季", "analysis": "USC enters the 2026 season tied for No. 14 in the AP Poll, facing a schedule that includes six preseason ranked opponents. Lincoln Riley has called this the deepest roster he's had in Los Angeles, and the pressure to deliver a College Football Playoff appearance has never been higher.\n\nThe numbers support Riley's claim. USC returns seven offensive linemen with career starts, a dynamic backfield duo in Waymond Jordan and King Miller, and a receiving corps led by Tanook Hines and NC State transfer Terrell Anderson. Quarterback Jayden Maiava is back for his redshirt senior year after throwing for 3,700+ yards in 2025, and he's the undisputed leader of this team.\n\nBut the schedule is brutal. USC opens Week 0 on August 29 against San Jose State — one of the first games in the entire college football season — and then faces No. 2 Oregon, No. 6 Indiana, No. 17 Washington, and a road trip to No. 18 Penn State. That's four games against top-20 teams, plus additional challenges from Big Ten opponents. There is no margin for error.\n\nKirk Herbstreit has named Maiava one of college football's most underrated quarterbacks, and he's right. Maiava chose to return for his redshirt senior year instead of entering the NFL Draft, making 2026 a defining season for both him and Riley. If USC can navigate this schedule and reach the CFP, it validates Riley's entire project in Los Angeles. If they fall short again, the criticism will be deafening.\n\nThe preseason ranking is a starting point, not a destination. USC has the talent to compete with anyone in the country, but talent alone doesn't win championships. Execution, health, and a bit of luck will determine whether this is the year the Trojans finally break through. With Week 0 just four days away, the countdown is on.", "analysis_zh": "USC以並列第14名進入2026賽季季前AP排名，面對包含六支季前排名球隊的賽程。Lincoln Riley稱這是他在洛杉磯執教以來最深厚的陣容，而打入大學美式足球季後賽（CFP）的壓力從未如此之高。\n\n數據支持Riley的說法。USC回歸了七位擁有生涯先發經驗的進攻鋒線球員、跑衛Waymond Jordan和King Miller的動態搭配，以及以Tanook Hines和北卡州立轉學生Terrell Anderson為首的接球群。四分衛Jayden Maiava在2025年投出3,700+碼後回歸紅衫senior年，他是這支球隊毫無疑問的領袖。\n\n但賽程極為艱難。USC在8月29日的Week 0對陣聖荷西州立——這是全賽季最早進行的比賽之一——隨後將面對第2名奧勒岡、第6名印第安納、第17名華盛頓，以及客場挑戰第18名賓州州立。這是四場對陣前20強的比賽，加上Big Ten其他對手的挑戰。沒有犯錯空間。\n\nKirk Herbstreit將Maiava列為大學美式足球最被低估的四分衛之一，他說得對。Maiava選擇回歸紅衫senior年而非投入NFL選秀，使2026成為他和Riley的定義賽季。如果USC能通過這份賽程並打入CFP，將驗證Riley在洛杉磯整個項目的價值。如果再次未能達標，批評聲浪將會震耳欲聾。\n\n季前排名是起點而非終點。USC有實力與全國任何球隊競爭，但天賦 alone 不能贏得冠軍。執行力、健康和一點運氣將決定這是否是Trojans finally breakthrough的一年。距離Week 0僅剩四天，倒數已經開始。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "Herbstreit Flags Maiava as Most Underrated QB in College Football", "headline_zh": "Herbstreit點名Maiava為大學足球最被低估的四分衛", "analysis": "ESPN analyst Kirk Herbstreit has made it his mission to ensure Jayden Maiava doesn't go unnoticed heading into the 2026 season. The USC redshirt senior threw for 3,700+ yards in 2025 and is the undisputed offensive leader of a team ranked No. 14 in the preseason.\n\nHerbstreit's endorsement carries weight because he doesn't hand out praise lightly. When he identifies a player as underrated, it signals to the broader college football audience that this is someone worth watching. For Maiava, who has operated somewhat in the shadow of flashier quarterbacks like Shedeur Sanders and Carson Beck, this is a chance to establish himself as one of the elite signal-callers in the sport.\n\nThe case for Maiava is compelling. He chose to return to USC instead of entering the NFL Draft, a decision that speaks to his confidence in what this team can accomplish. In Lincoln Riley's system — the same system that produced Baker Mayfield, Kyler Murray, and Caleb Williams — Maiava has the tools and the supporting cast to put up monster numbers.\n\nWhat makes Maiava particularly dangerous is his combination of arm talent and decision-making. He doesn't force throws into tight windows, he manages the game effectively, and he has the mobility to extend plays when the pocket breaks down. In a Big Ten conference that features several elite defenses, those traits will be essential.\n\nThe underrated label could actually work in USC's favor. Teams that are overlooked tend to play with a chip on their shoulder, and Maiava seems like the kind of competitor who thrives on being doubted. If he can elevate his game to match Herbstreit's praise, USC's ceiling in 2026 is higher than most people realize.", "analysis_zh": "ESPN分析師Kirk Herbstreit致力於確保Jayden Maiava在2026賽季前不會被忽視。這位USC紅衫senior在2025年投出3,700+碼，是這支季前排名第14的球隊毫無疑問的進攻領袖。\n\nHerbstreit的背書具有份量，因為他不會輕易給予讚美。當他將一名球員列為被低估時，這向大學足球廣大觀眾發出了一個信號：這是一位值得關注的球員。對Maiava而言，他一直 somewhat 在 Shedeur Sanders 和 Carson Beck 等更具話題性的四分衛陰影下運作，這是確立自己作為頂級控球者的機會。\n\n支持Maiava的理由很有說服力。他選擇回歸USC而非投入NFL選秀，這個決定反映了他對這支球隊成就的信心。在Lincoln Riley的體系中——這個體系曾培養出Baker Mayfield、Kyler Murray和Caleb Williams——Maiava擁有打出怪物級數據的工具和支援陣容。\n\n特別危險的是Maiava的臂力天賦和決策能力的結合。他不會勉強將球投入狹小窗口，有效管理比賽，且擁有在口袋崩潰時延伸plays的機動性。在擁有多支頂級防守球隊的Big Ten聯盟中，這些特質將至關重要。\n\n被低估的標籤實際上可能對USC有利。被忽視的球隊往往帶著額外的動力比賽，而Maiava似乎是那種在被質疑時表現更好的競爭者。如果他能將比賽水平提升至符合Herbstreit的讚美，USC在2026年的天花板比大多數人認知的還要高。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "O'Connor's Season-Ending Broken Leg Reshuffles the Offensive Line", "headline_zh": "O'Connor賽季報銷的腿部骨折重塑進攻鋒線配置", "analysis": "Starting center and team captain Kilian O'Connor suffered a severe broken leg during pre-camp workouts, ending his 2026 season before it began. Tobias Raymond will shift full-time to center, and the offensive line must be reshuffled to compensate for the loss of its leader.\n\nThis is a significant blow to USC's offensive line, which was expected to be one of the team's strengths. O'Connor was the anchor — the player who made all the line calls, managed protections, and provided the kind of veteran leadership that offensive lines require to function at a high level. Losing him for the season is the kind of injury that can derail an entire offense.\n\nTobias Raymond has the talent to handle the center position, but he was being groomed as a tackle. Moving him to center changes the dynamic of the entire line, and there will be a learning curve. The good news is that USC returns seven offensive linemen with career starts, so the depth is there. The question is whether the new configuration can gel quickly enough to handle the gauntlet of a Big Ten schedule.\n\nThe timing is particularly cruel. O'Connor's injury came during pre-camp workouts, meaning the coaching staff has had time to adjust, but it also means they're installing a new line configuration with limited practice time before the season opener. Every rep matters, and USC can't afford to waste any.\n\nFrom a broader perspective, this injury tests USC's depth and coaching staff's ability to adapt. Riley has faced adversity before, and the Trojans have the talent to overcome this loss. But it's the kind of setback that separates good teams from great ones. If USC can maintain offensive line performance despite losing their captain, it will say a lot about the program's development under Riley.", "analysis_zh": "先發中鋒兼隊長Kilian O'Connor在營前訓練中遭遇嚴重腿部骨折，2026賽季尚未開始便宣告結束。Tobias Raymond將全職轉任中鋒，進攻鋒線必須重新調整以彌補隊長的缺陣。\n\n這是對USC進攻鋒線的重大打擊，而該線原本被預期為球隊的優勢之一。O'Connor是整條線的支柱——負責所有線路通報、管理保護方案，並提供進攻鋒線高水準運作所需的那種老將領導力。賽季報銷是可能拖垮整個進攻組的那種傷病。\n\nTobias Raymond有實力勝任中鋒位置，但他原本被培養為截鋒。將他移至中鋒改變了整條線的動態，且會有一段學習曲線。好消息是USC回歸了七位擁有生涯先發經驗的進攻鋒線球員，深度是足夠的。問題在於新的配置能否在Big Ten賽程的考驗前快速磨合。\n\n時機尤其殘酷。O'Connor的傷病發生在營前訓練期間，這意味著教練組有時間調整，但也表示他們在有限的練習時間內安裝新的鋒線配置。每一次訓練都至關重要，USC浪費不起任何一次。\n\n從更宏觀的角度來看，這次受傷考驗了USC的深度和教練組的適應能力。Riley以前經歷過逆境，Trojans有 talent 克服這次損失。但這是區分好球隊和偉大球隊的那種挫折。如果USC能在失去隊長的情況下維持進攻鋒線的表現，這將充分說明Riley執教下這個program的發展成果。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "Tanook Hines' Breakout Opens Door for Freshmen to Contribute", "headline_zh": "Tanook Hines的爆發為新鮮人打開貢獻大門", "analysis": "Sophomore wide receiver Tanook Hines burst onto the scene with 561 yards as a freshman, and his emergence has created opportunities for younger players to see the field in 2026. He forms a dynamic duo with NC State transfer Terrell Anderson, replacing the departed Ja'Kobi Lane.\n\nHines' freshman campaign was a revelation. He wasn't supposed to be a primary target, but injuries and circumstance thrust him into a prominent role, and he delivered. His ability to create separation, make contested catches, and gain yards after the catch showed a maturity beyond his years. Now, as a sophomore, he's expected to be one of the focal points of USC's passing attack.\n\nThe addition of Terrell Anderson from NC State provides a proven commodity on the other side of the formation. Anderson was one of the most productive receivers in the ACC, and his route-running ability complements Hines' explosive playmaking. Together, they give Maiava two legitimate threats on the outside, which should open up the running game and create mismatches against Big Ten defenses.\n\nWhat makes this receiving corps particularly interesting is the depth behind Hines and Anderson. Hines' emergence has demonstrated that USC's younger players are ready to contribute, and that depth could be critical over the course of a grueling 12-game regular season. Injuries are inevitable, and having capable backups who can step in without a significant drop-off is essential.\n\nFrom a recruiting standpoint, Hines' success tells a story to future USC receivers. You can come to Los Angeles and play early. That's a powerful recruiting tool, especially in the transfer portal era when players have options. Riley has built something special at USC, and players like Hines are the proof of concept that will help him continue to attract top talent.", "analysis_zh": "大二外接手Tanook Hines以大一新生身分繳出561碼的爆發性表現，他的崛起為年輕球員在2026賽季创造了上場機會。他與NC州立轉學生Terrell Anderson組成動態雙人組，填補已離隊的Ja'Kobi Lane留下的空缺。\n\nHines的大一賽季令人驚艷。他原本不被預期成為主要目標，但傷病和環境變化將他推上重要角色，而他交出了優異成績。他創造空檔、完成對抗性接球和接球後獲得碼數的能力展現了超越年齡的成熟。如今作為大二生，他被預期為USC傳球攻擊的焦點之一。\n\n從NC州立加盟的Terrell Anderson在陣型另一側提供了經過驗證的實力。Anderson是ACC最具產出的外接手之一，他的路徑跑動能力與Hines的爆發性打法形成互補。兩人組合讓Maiava擁有兩位真正的外側威脅，這應能為跑動遊戲創造空間並在Big Ten防守中製造錯位。\n\n讓這個接球群特別有趣的是Hines和Anderson身後的深度。Hines的崛起證明了USC的年輕球員已準備好貢獻，而這種深度在12場艱難的例行賽中至關重要。傷病不可避免，擁有能在不顯著降低水平的情況下遞補的稱職替補至關重要。\n\n從招募角度看，Hines的成功向未來的USC外接手訴說了一個故事。你可以來到洛杉磯並 early playing time。這是一個強大的招募工具，特別是在轉學portal時代，球員有更多選擇。Riley在USC建立了特別的東西，而像Hines這樣的球員就是幫助他持續吸引頂尖 talent 的概念驗證。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "USC Resumes Notre Dame Rivalry in 2030 on Its Own Terms", "headline_zh": "USC在2030年以自身條件重啟與Notre Dame的宿敵對決", "analysis": "After years of power plays and negotiations, USC has secured favorable terms to reignite the historic rivalry with Notre Dame starting in 2030. This is a significant development for one of college football's most storied rivalries, which had been in jeopardy due to scheduling disputes.\n\nThe USC-Notre Dame rivalry is one of the most iconic in all of sports, dating back to 1926. For decades, it was an annual fixture that defined both programs. The fact that it was allowed to lapse was a failure of college football's leadership, and its resumption is a win for the sport's traditions.\n\nUSC's ability to negotiate favorable terms speaks to the program's leverage in the modern college football landscape. With the Big Ten's expanded footprint and USC's national brand, the Trojans had the power to dictate terms rather than accept whatever Notre Dame proposed. That's a significant shift from just a few years ago.\n\nThe rivalry's return also has implications for recruiting. Both USC and Notre Dame recruit nationally, and the annual matchup provides a platform for both programs to showcase themselves on the biggest stage. Having that game back on the schedule gives both schools a marquee non-conference opponent that enhances their playoff résumés.\n\nFrom a fan perspective, this is purely good news. The USC-Notre Dame game is one of those rare matchups that transcends conference affiliation and captures the attention of the entire college football world. Its return in 2030 can't come soon enough, and the fact that USC negotiated from a position of strength makes it even sweeter.", "analysis_zh": "經過多年的角力與談判，USC已取得有利條件，將自2030年起重啟與Notre Dame的歷史性宿敵對決。這是大學美式足球最具傳奇色彩的對決之一的重要發展，此前因賽程安排爭議而面臨終結危機。\n\nUSC與Notre Dame的宿敵對決是全體育界最具標誌性的對決之一，可追溯至1926年。數十年來，它是定義兩支program的年度賽事。讓它中斷是大學足球領導層的失敗，而它的重啟是對這項運動傳統的勝利。\n\nUSC談判取得有利條件的能力反映了這個program在現代大學足球格局中的話語權。憑藉Big Ten擴大的版圖和USC的全國品牌，Trojans有能力主導條款而非接受Notre Dame的提議。這與僅僅幾年前相比是一個重大轉變。\n\n宿敵對決的重啟對招募也有影響。USC和Notre Dame都在全國範圍內招募球員，這場年度對決為兩支program提供了在最大舞台上展示自己的平台。將這場比賽重新排入賽程，為兩所學校增添了一個能增強季後賽履歷的招牌非聯盟對手。\n\n從球迷角度來看，這純粹是好消息。USC與Notre Dame的對決是那種罕見的、超越聯盟所屬、能吸引全大學足球界關注的對決。2020年的回歸令人期待，而USC從強勢 position 談判成功更讓這一切更加美好。"}, {"team": "Rams", "accent": "#003594", "headline": "Rams Crush Saints 34-0 — Nacua & Garrett Still Sidelined as Roster Cuts Loom", "headline_zh": "Rams以34比0血洗聖徒——Nacua與Garrett仍缺陣，裁員潮逼近", "analysis": "The Rams obliterated the Saints 34-0 in their second preseason game, but the real story is the health of their star players. Puka Nacua hasn't practiced since August 11 due to a lingering psoas issue, and Myles Garrett remains sidelined with knee swelling. Both are being managed carefully ahead of the September 10 opener against the 49ers in Melbourne.\n\nThe 34-0 shutout was impressive on paper, but preseason results are largely meaningless. What matters is the individual performances of players fighting for roster spots. Safety Alex Cook returned an interception 100 yards for a touchdown, and Canadian pass rusher Wesley Bailey was dominant off the edge. Those are the kind of plays that make roster decisions difficult for Sean McVay.\n\nThe Nacua and Garrett situations are more concerning than the team is letting on. Nacua hasn't practiced in two weeks, and the psoas is an injury that can linger if not properly managed. Garrett's knee swelling is even more worrisome — he's the most important defensive player on the roster, and the Rams need him at full strength for the Melbourne opener.\n\nThe timing is tricky. The Rams have one more preseason game Thursday against the Chargers, followed by roster cuts to 53. They need to make decisions about their final roster while managing the health of their two most important players. It's a delicate balance, and one wrong move could have consequences that extend into the regular season.\n\nFrom a broader perspective, the Rams' preseason dominance is encouraging. They've outscored opponents 57-7 through two games, and the depth of their roster is evident. The question isn't whether they're good enough to compete — they're coming off an NFC Championship appearance — but whether they can stay healthy enough to fulfill their championship potential.", "analysis_zh": "Rams在第二場季前賽中以34比0血洗聖徒，但真正的焦點在於球星的健康狀況。Puka Nacua因持續的腰大肌問題自8月11日以來未參加練習，Myles Garrett則因膝蓋腫脹持續缺陣。兩人都在9月10日墨爾本對49人的開幕戰前接受謹慎管理。\n\n34比0的零封在紙面上令人印象深刻，但季前賽結果 largely 沒有意義。重要的是爭取名單位置的球員的個人表現。安全衛Alex Cook回傳100碼抄截達陣，加拿大pass rusher Wesley Bailey在邊線展現主宰力。這些都是讓Sean McVay做出名單決定變困難的plays。\n\nNacua和Garrett的情況比球隊公開承認的更令人擔憂。Nacua已兩週未參加練習，而腰大肌是如果不妥善管理可能持續困擾的傷病。Garrett的膝蓋腫脹更令人擔憂——他是名單上最重要的防守球員，Rams需要他在墨爾本開幕戰中以100%狀態出場。\n\n時機很棘手。Rams週四還有對充電器的最後一場季前賽，隨後是裁員至53人。他們需要在管理兩位最重要球員健康狀況的同時做出最終名單決定。這是微妙的平衡，一步走錯可能影響延伸至例行賽。\n\n從更宏觀的角度來看，Rams季前賽的統治力令人振奮。兩場比賽共淨勝對手57-7，球隊的深度顯而易見。問題不在於他們是否有競爭力——他們剛打完NFC冠軍賽——而在於他們能否保持足夠健康以實現冠軍潛力。"}, {"team": "Rams", "accent": "#003594", "headline": "QB2 Battle Rages: Simpson vs. Bennett for the Backup Job", "headline_zh": "二號四分衛爭奪戰：Simpson對決Bennett", "analysis": "With Jimmy Garoppolo gone, Sean McVay still hasn't named a backup to Matthew Stafford. Ty Simpson, the 13th overall pick, got his shot against the Chiefs, while Stetson Bennett went 19-of-31 for 181 yards with two rushing touchdowns against the Saints. Both will play in Thursday's preseason finale against the Chargers.\n\nThis is one of the most fascinating roster battles in the NFL. Simpson was drafted to be Stafford's eventual successor — a young, athletic quarterback with upside. Bennett, meanwhile, is a proven winner who led Georgia to back-to-back national championships. Both have legitimate cases for the QB2 job.\n\nSimpson's case rests on his potential. He was the 13th overall pick for a reason — he has the arm talent, mobility, and football IQ to develop into a quality starter. The Rams invested significant draft capital in him, and giving him the backup role is a way to accelerate his development while keeping him ready if Stafford gets hurt.\n\nBennett's case rests on his readiness. He's older, more experienced, and has shown an ability to manage games effectively. His 19-of-31 performance against the Saints was efficient and mistake-free, exactly what you want from a backup quarterback. If Stafford goes down, Bennett gives the Rams the best chance to win immediately.\n\nThe decision will likely come down to McVay's philosophy: does he want to develop his future (Simpson) or protect his present (Bennett)? There's no wrong answer, but the choice will tell us a lot about how the Rams view their championship window. With Stafford coming off an MVP season, the window is clearly now — which might give Bennett the edge.", "analysis_zh": "在Jimmy Garoppolo離隊後，Sean McVay仍未指定Matthew Stafford的替補。第13順位被選中的Ty Simpson在對 Chiefs 時獲得機會，而Stetson Bennett則在對聖徒時以19次傳球成功31次、181碼和兩次衝球達陣的表現回應。兩人將在週四對充電器的季前賽決戰中上場。\n\n這是全聯盟最引人注目的名單爭奪戰之一。Simpson被選中是要成為Stafford的接班人——一位年輕、運動能力強且有上限的四分衛。Bennett則是帶領喬治亞大學連續贏得全國冠軍的 proven winner。兩人都有合理理由爭取二號四分衛的位置。\n\nSimpson的理由建立在他的潛力上。他是第13順位被選中有其原因——他擁有臂力天賦、機動性和足球智商，有發展成為優質先發的潛力。Rams在他身上投入了大量選秀資本，給他替補角色是加速他發展的方式，同時在Stafford受傷時讓他準備好。\n\nBennett的理由建立在他的就緒度上。他更年長、更有經驗，並展現了有效管理比賽的能力。他對聖徒19-of-31的表現高效且無失誤，這正是你從替補四分衛那裡想要的。如果Stafford倒下，Bennett能給Rams立即贏球的最佳機會。\n\n決定 likely 歸結於McVay的哲學：他是要培養未來（Simpson）還是保護現在（Bennett）？沒有錯誤答案，但選擇會告訴我們很多關於Rams如何看待他們的冠軍窗口。在Stafford剛贏得MVP獎項後，窗口 clearly 現在——這可能給Bennett優勢。"}, {"team": "Rams", "accent": "#003594", "headline": "Wesley Bailey's Breakout Game Earns McVay's Rave Reviews", "headline_zh": "Wesley Bailey的爆發性比賽贏得McVay高度讚賞", "analysis": "Canadian pass rusher Wesley Bailey put up 5 tackles, a sack, a forced fumble, and 10 total pressures in the Rams' 34-0 win over the Saints. Sean McVay said: 'You felt his presence all day.' With Keir Thomas now on IR, Bailey could push for a roster spot.\n\nBailey's performance was the kind of breakout game that changes a player's trajectory. He was signed as an undrafted free agent, and most people expected him to be a camp body — someone who fills a roster spot during the preseason and gets cut before the season starts. Instead, he's forcing the Rams to take a hard look at their pass rush depth.\n\nThe numbers are staggering. Ten total pressures in a preseason game is elite production, regardless of the level of competition. Bailey showed a first-step quickness that's rare for a player his size, and his ability to convert speed to power was evident on multiple snaps. He's not just winning with athleticism — he's showing refined pass-rush technique.\n\nMcVay's praise is significant because he doesn't hand out compliments to fringe roster players lightly. When the head coach singles out a player for his performance, it means that player has done something that caught the coaching staff's attention. Bailey did more than catch their attention — he demanded it.\n\nThe Rams' pass rush depth has been a concern all preseason. With Keir Thomas going on IR for the second straight year, the edge rusher position is thinner than the Rams would like. Bailey's emergence provides an unexpected solution to a problem that seemed intractable just a week ago.\n\nFrom a roster construction standpoint, Bailey's case is compelling. He's young, he's cheap, and he's showing the kind of production that's hard to find in late August. The Rams would be foolish to let him go, and I'd expect him to make the 53-man roster. Sometimes the best roster moves are the ones you don't see coming.", "analysis_zh": "加拿大pass rusher Wesley Bailey在Rams以34比0戰勝聖徒的比賽中繳出5次擒抱、1次擒殺、1次製造掉球和10次總壓迫。Sean McVay表示：「你整場比賽都能感受到他的存在。」在Keir Thomas進傷兵名單後，Bailey可能爭取到名單位置。\n\nBailey的表現是那種改變球員軌跡的爆發性比賽。他是以落選自由球員身分簽下的，大多數人預期他只是營隊填充——在季前賽填補名單位置、在賽季開始前被裁的那種球員。相反，他迫使Rams認真审视他們的pass rush深度。\n\n數據令人震驚。季前賽中10次總壓迫是頂級產出，無論對手水平如何。Bailey展現了他體型少見的起步速度，而他將速度轉化為力量的能力在多次snap中顯而易見。他不只是靠運動能力獲勝——他展現了精進的pass rush技巧。\n\nMcVay的讚賞意義重大，因為他不會輕易對邊緣名單球員給予讚美。當主教練特別點名一名球員的表現時，意味著該球員做了讓教練組注意到的事情。Bailey不只是引起他們的注意——他 demanding 了它。\n\nRams的pass rush深度一直是整個季前賽的擔憂。隨著Keir Thomas連續第二年進傷兵名單，邊鋒位置比Rams希望的更 thin。Bailey的崛起為看似無解的問題提供了意外的解決方案。\n\n從名單建構角度來看，Bailey的理由很有說服力。他年輕、便宜，並展現了八月底難以找到的產出。Rams放走他將是愚蠢的，我預期他會進入53人名單。有時候最好的名單操作是你意想不到的。"}, {"team": "Rams", "accent": "#003594", "headline": "Alex Cook's 100-Yard Pick-Six a Dream Come True", "headline_zh": "Alex Cook的100碼抄截回攻達陣——夢想成真", "analysis": "Safety Alex Cook, signed just a month ago on July 27, intercepted Spencer Rattler and returned it 100 yards for a touchdown in the Rams' 34-0 demolition of the Saints. The journeyman defensive back, who also had a pick-six and a scoop-and-score in the UFL, is making a strong case for a roster spot in a crowded secondary.\n\nCook's story is the quintessential NFL journeyman tale. He's bounced around practice squads and alternative leagues, waiting for an opportunity to prove himself on the biggest stage. The UFL gave him a platform, and now the Rams are giving him a chance. He's making the most of it.\n\nThe 100-yard interception return was a thing of beauty. Cook read Rattler's eyes, jumped the route, and had nothing but green grass ahead of him. It's the kind of play that makes highlight reels and catches the attention of coaches who are on the fence about a player's roster status.\n\nWhat makes Cook's case particularly interesting is the context. The Rams' secondary is crowded with talent, and there are only so many spots available. But Cook has shown something that the other contenders haven't: the ability to make game-changing plays. In a league where turnovers are king, a player who can create them is worth his weight in gold.\n\nFrom a roster perspective, Cook is competing with several other players for the final one or two spots in the secondary. His preseason performance has been excellent, and the pick-six against the Saints was the exclamation point on a strong camp. The Rams would be wise to keep him, even if it means making a difficult cut elsewhere.", "analysis_zh": "僅在一個月前的7月27日才被簽下的安全衛Alex Cook在Rams以34比0大勝聖徒的比賽中抄截Spencer Rattler並回攻100碼達陣。這位歷經波折的防守後衛此前在UFL也曾完成抄截回攻達陣和掉球回攻達陣，正在擁擠的防守後衛群中為名單位置提出強而有力的訴求。\n\nCook的故事是典型的NFL journeyman傳奇。他在練習名單和替代聯盟中輾轉，等待在最大舞台上證明自己的機會。UFL給了他一個平台，如今Rams給了他機會。他正在把握住。\n\n100碼的抄截回攻是一場美麗的演出。Cook讀取了Rattler的視線，判斷路線並跳前，前方只剩綠草地。這是那種會出現在highlight reel並引起教練對球員名單地位猶豫不決時注意的plays。\n\n讓Cook的理由特別有趣的是其背景。Rams的防守後衛群 talent 擁擠，名額有限。但Cook展現了其他競爭者所沒有的能力：製造改變比賽走向的plays。在一個 turnovers 至關重要的聯盟中，能製造turnovers的球員價值連城。\n\n從名單角度來看，Cook正與其他數名球員競爭防守後衛群最後一兩個位置。他的季前賽表現出色，對聖徒的抄截回攻達陣是強勢營隊的完美句點。Rams明智的做法是留下他，即使這意味著在其他位置做出困難的裁員。"}, {"team": "Rams", "accent": "#003594", "headline": "Roster Moves: Gilmore Signed, Thomas & McPhearson Placed on IR", "headline_zh": "名單異動：簽下Gilmore，Thomas與McPhearson進傷兵名單", "analysis": "The Rams signed cornerback Steven Gilmore, brother of former Defensive Player of the Year Stephon Gilmore, and outside linebacker Devean Deal. In corresponding moves, Keir Thomas II (groin) and Zech McPhearson were placed on injured reserve, ending their 2026 seasons. Linebacker Daniel Rickert was waived with an injury designation.\n\nKeir Thomas going on IR for the second straight year is a frustrating development for a player who has shown flashes of pass-rush ability. A groin injury has robbed him of another season, and it's fair to wonder whether he'll ever be able to stay healthy enough to fulfill his potential. The Rams invested a draft pick in him, and so far, the return has been minimal.\n\nThe signing of Steven Gilmore is an intriguing depth move. He's not his brother — few players are — but he has NFL experience and the bloodline suggests he has the tools to compete. The Rams are thin at cornerback, and adding a player with Gilmore's pedigree is a low-risk, moderate-reward move.\n\nDevean Deal is another camp body who could surprise. The outside linebacker position is one of the Rams' deepest, but injuries have thinned the ranks. Deal has the athleticism to compete, and if he can flash in the preseason finale, he might earn a practice squad spot.\n\nThese roster moves are the invisible machinations that build championship teams. The stars get the headlines, but it's the depth players — the ones who fill in when starters get hurt — who often determine whether a season is successful or not. The Rams are clearly taking this seriously, cycling through players to find the right combinations for their 53-man roster.", "analysis_zh": "Rams簽下了角衛Steven Gilmore——前年度最佳防守球員Stepon Gilmore的弟弟——以及邊鋒outside linebacker Devean Deal。作為對應調度，Keir Thomas II（腹股溝）和Zech McPhearson被放入傷兵名單，結束了他們的2026賽季。線衛Daniel Rickert因傷病被釋出。\n\nKeir Thomas連續第二年進傷兵名單對這位曾展現pass rush天賦的球員來說令人沮喪。腹股溝傷病讓他再次缺席一季，有理由怀疑他是否能保持足夠健康來實現潛力。Rams在他身上投入了選秀權，但目前回報 minimal。\n\n簽下Steven Gilmore是一個有趣的深度補強。他不是他哥哥——很少有球員是——但他有NFL經驗，且血統暗示他有競爭的工具。Rams在角衛位置 depth 薄弱，增加一位有Gilmore血統的球員是低風險、中等回報的舉動。\n\nDevean Deal是另一個可能帶來驚喜的營隊填充球員。邊鋒位置是Rams最深的位置之一，但傷病已削弱了深度。Deal有運動能力競爭，如果他能在季前賽決戰中閃光，可能獲得練習名單位置。\n\n這些名單操作是 build championship teams 的 invisible machinations。球星獲得頭條，但正是深度球員——在先發受傷時遞補的那些人—— often 決定了赛季是成功還是失敗。Rams顯然認真對待這件事，不斷更換球員以找到53人名單的正確組合。"}, {"team": "Rams", "accent": "#003594", "headline": "Justin Dedich Returns to Practice — OL Depth Boosted", "headline_zh": "Justin Dedich恢復練習——進攻鋒線深度獲得提升", "analysis": "Backup guard Justin Dedich was activated off the non-football injury list and practiced Monday for the first time since a July 4th hand injury. Sean McVay called him 'an important part of our operation.' Dedich has played 29 games with 9 starts over two seasons with the Rams.\n\nDedich's return is significant for a Rams team that has been hit hard by injuries along the offensive line. The interior of the line has been a concern all preseason, and having a versatile backup who can play both guard and center is invaluable. Dedich's 29 games of experience give him a level of comfort in the system that most backups don't have.\n\nThe July 4th hand injury was a setback that came at a bad time. Dedich was competing for a roster spot, and missing training camp meant he fell behind in the competition. Now that he's back, he has one week to make his case before roster cuts. It's a compressed timeline, but Dedich has the experience to make it work.\n\nFrom a depth chart perspective, Dedich's return gives the Rams insurance at multiple positions along the offensive line. In a league where injuries are inevitable, having a player who can fill in at multiple spots is a luxury. McVay values that versatility, and it's one of the reasons Dedich has stuck around for two seasons.\n\nThe Rams' offensive line has been a strength in recent years, but the preseason has exposed some depth concerns. Dedich's return helps mitigate those concerns, and if he can stay healthy, he'll be an important piece of the puzzle as the Rams navigate the rigors of a 17-game regular season.", "analysis_zh": "替補內鋒Justin Dedich被從非足球傷病名單激活，週一自7月4日手傷以來首次恢復練習。Sean McVay稱他是「我們運作的重要一環」。Dedich在Rams兩個赛季中已出場29場、先發9場。\n\nDedich的回歸對一支沿進攻鋒線遭受嚴重傷病打擊的Rams球隊意義重大。鋒線內部一直是整個季前賽的擔憂，擁有一名能打both guard和center的多功能替補極為寶貴。Dedich 29場比賽的經驗給了他在體系中的舒適感，這是大多數替補所沒有的。\n\n7月4日的手傷是一個來得不是時候的挫折。Dedich當時正在爭取名單位置，缺席訓練意味著他在競爭中落後。如今他回來了，只有一週時間在裁員前證明自己。這是壓縮的時間表，但Dedich有經驗做到。\n\n從深度表的角度來看，Dedich的回歸給Rams在進攻鋒線多個位置上提供了保險。在傷病不可避免的聯盟中，擁有一名能在多個位置遞補的球員是一種奢侈。McVay重視這種多功能性，這是Dedich能留下兩個赛季的原因之一。\n\nRams的進攻鋒線近年來一直是優勢，但季前賽暴露了一些深度擔憂。Dedich的回歸有助於緩解這些擔憂，如果他能保持健康，他將是Rams應對17場例行賽嚴峻考驗的重要拼圖。"}], "closing": "It's an exciting time to be an LA sports fan. The Dodgers are assembling a historically loaded rotation for October, USC is days away from a make-or-break season, and the Rams are fine-tuning their roster for an unprecedented opener in Melbourne. The next few weeks will shape the narratives for all three teams heading into the most important stretch of their respective seasons. Stay tuned.", "closing_zh": "身為洛杉磯球迷，這是一個令人興奮的時刻。道奇隊正在為十月組建歷史級的投手陣容，USC即將迎來關鍵賽季的開幕，Rams正在為墨爾本的史無前例開幕戰微調名單。接下來幾週將決定三支球隊在各自赛季最重要階段的發展方向。敬請持續關注。"};
let lang = "en";
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmtPT(iso){ return new Date(iso).toLocaleString("en-US",{timeZone:"America/Los_Angeles",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"})+" PT"; }

function renderDigest(d){
  const box = document.getElementById("digest");
  if(!d || !d.segments){
    box.innerHTML = '<div style="text-align:center;color:var(--dim);padding:40px">No digest yet</div>';
    return;
  }
  const segs = d.segments.map(s=>{
    const headline = lang==="en" ? s.headline : s.headline_zh;
    const analysis = lang==="en" ? s.analysis : s.analysis_zh;
    return '<div class="seg" style="--team:'+esc(s.accent)+'">' +
      '<div class="row"><span class="hn">'+esc(headline)+'</span><span class="badge">'+esc(s.team)+'</span></div>' +
      '<div class="lbl">'+(lang==="en"?"Analysis":"分析")+'</div><p>'+esc(analysis)+'</p>' +
      '</div>';
  }).join("");
  box.innerHTML =
    '<div class="dhead">' +
      '<div class="t"><div class="mic">🎙️</div><div><h2>'+esc(d.title)+'</h2><div class="meta">' +
        esc(d.read_time || "")+' · '+fmtPT(d.updated_at)+
        ' · 繁中/EN</div></div></div>' +
      '<div class="langs">'+
        '<button id="btnEn" class="on" onclick="setLang(\'en\')">EN</button>'+
        '<button id="btnZh" onclick="setLang(\'zh\')">繁體中文</button>'+
      '</div>' +
    '</div>' +
    '<div class="intro">'+esc(lang==="en"?d.intro:d.intro_zh)+'</div>' +
    '<div class="segs">'+segs+'</div>' +
    '<div class="closing">'+esc(lang==="en"?d.closing:d.closing_zh)+'</div>';
}
function setLang(v){ lang = v; document.getElementById("btnEn").classList.toggle("on", v==="en"); document.getElementById("btnZh").classList.toggle("on", v==="zh"); renderDigest(DIGEST_DATA); }

function renderNews(d){ const upd = document.getElementById("upd"); if(upd) upd.textContent = fmtPT(d.updated_at);
  const g = document.getElementById("grid"); g.innerHTML = "";
  for(const t of d.teams){
    const c = document.createElement("div"); c.className = "card"; c.style.setProperty("--team", t.accent);
    const emoji = t.emoji==="Baseball"?"⚾":t.emoji==="Football"?"🏈":"🏆";
    c.innerHTML =
      '<div class="top"><div class="ico">' + emoji + '</div>' +
      '<div><div class="name">' + esc(t.name) + '</div><div class="rec">' + t.sport + ' · ' + esc(t.record) + '</div></div></div>' +
      '<div class="hline">' + esc(t.headline) + '</div>' +
      '<h3>Latest News</h3><ul class="news">' + t.latest_news.map(n =>
        '<li><a target="_blank" rel="noopener" href="' + esc(n.url) + '">' + esc(n.title) + '</a><p>' + esc(n.summary) + '</p></li>'
      ).join("") + '</ul>' +
      '<h3>Fun Facts</h3><ul class="facts">' + t.fun_facts.map(f => '<li>'+esc(f)+'</li>').join("") + '</ul>' +
      '<h3>Further Reading</h3><ul class="read">' + t.further_reading.map(f =>
        '<li><a target="_blank" rel="noopener" href="' + esc(f.url) + '"><span>'+esc(f.title)+'</span><span class="why">'+esc(f.why)+'</span></a></li>'
      ).join("") + '</ul>' +
      '<div class="oss">' + esc(t.one_sentence) + '</div>';
    g.appendChild(c);
  }
}

renderDigest(DIGEST_DATA);
renderNews(TEAMS_DATA);
</script>
