<style>
  :root{
    --bg:#0b0e14; --panel:rgba(255,255,255,.04); --panel2:rgba(255,255,255,.02);
    --line:rgba(255,255,255,.08); --fg:#edf2fa; --dim:#8a94a6;
    --radius:18px; --glow:0 0 0 1px rgba(255,255,255,.04), 0 24px 60px -30px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 500px at 20% -10%, rgba(42,111,216,.18), transparent 60%),
      radial-gradient(1000px 500px at 90% -10%, rgba(153,0,0,.14), transparent 60%),
      radial-gradient(900px 400px at 50% 110%, rgba(31,78,156,.16), transparent 60%),
      var(--bg);
    color:var(--fg); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
    padding:28px clamp(16px,4vw,64px) 64px;
  }
  header{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:26px}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{
    width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;
    background:linear-gradient(135deg,#2a6fd8,#991111);box-shadow:0 8px 30px -8px rgba(60,90,220,.6);
  }
  h1{font-size:clamp(22px,3vw,32px);font-weight:800;letter-spacing:-.02em}
  .sub{color:var(--dim);font-size:13px;margin-top:4px}
  .ticker{
    font-size:12px;color:var(--dim);padding:8px 14px;border-radius:99px;
    background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);
  }
  .ticker b{color:#7ce38b}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:20px}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;backdrop-filter:blur(14px);box-shadow:var(--glow);position:relative;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--team,#2a6fd8),transparent);
  }
  .top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .ico{
    width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;
    background:color-mix(in srgb,var(--team) 22%, transparent);
  }
  .name{font-size:18px;font-weight:800;letter-spacing:-.01em}
  .rec{font-size:11px;color:var(--team);font-weight:700;margin-top:2px}
  .hline{font-size:13px;line-height:1.5;color:var(--dim);padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);margin-bottom:16px}
  h3{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
  h3::after{content:"";flex:1;height:1px;background:var(--line)}
  .news{list-style:none}
  .news li{padding:10px 12px;border-radius:12px;margin-bottom:6px;background:var(--panel2);border:1px solid var(--line);transition:.2s}
  .news li:hover{border-color:color-mix(in srgb,var(--team) 50%, transparent);transform:translateX(3px)}
  .news a{color:var(--fg);text-decoration:none;font-weight:700;font-size:13px;display:block;margin-bottom:4px}
  .news a:hover{color:var(--team)}
  .news p{font-size:12px;color:var(--dim);line-height:1.5}
  .facts{list-style:none;display:grid;gap:6px}
  .facts li{position:relative;padding:2px 0 2px 18px;font-size:12.5px;color:var(--fg);line-height:1.55}
  .facts li::before{content:"⚡";position:absolute;left:0;top:2px;font-size:11px;filter:grayscale(.4)}
  .read{list-style:none;display:grid;gap:6px}
  .read a{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12.5px;color:var(--fg);text-decoration:none;padding:9px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
  .read a:hover{color:var(--team);border-color:color-mix(in srgb,var(--team) 50%, transparent)}
  .read .why{font-size:11px;color:var(--dim)}
  .oss{font-size:12.5px;line-height:1.6;color:var(--fg);background:linear-gradient(90deg,color-mix(in srgb,var(--team) 18%,transparent),transparent);border-left:3px solid var(--team);padding:10px 14px;border-radius:0 12px 12px 0;margin-top:16px}
  banner{display:block;text-align:center;color:var(--dim);font-size:13px;margin-top:22px}
  banner span{color:#7ce38b;animation:blink 1.5s infinite}
  @keyframes blink{50%{opacity:.3}}
  .spin{width:100%;height:100px;display:grid;place-items:center;color:var(--dim)}
  /* ---- digest ---- */
  .digest{
    background:linear-gradient(135deg,rgba(42,111,216,.12),rgba(153,0,0,.10),rgba(31,78,156,.12)),var(--panel);
    border:1px solid var(--line);border-radius:var(--radius);padding:26px;
    backdrop-filter:blur(14px);box-shadow:var(--glow);margin-bottom:22px;
  }
  .dhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;margin-bottom:14px}
  .dhead .t{display:flex;align-items:center;gap:12px}
  .mic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:linear-gradient(135deg,#2a6fd8,#991111)}
  .dhead h2{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .dhead .meta{color:var(--dim);font-size:12px;margin-top:3px}
  .langs{display:flex;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:4px}
  .langs button{border:0;background:transparent;color:var(--dim);font-size:12px;font-weight:700;padding:6px 16px;border-radius:99px;cursor:pointer;transition:.2s}
  .langs button.on{background:linear-gradient(135deg,#2a6fd8,#1f4e9c);color:#fff}
  .intro{font-size:14px;line-height:1.65;color:var(--fg);max-width:820px;margin-bottom:18px}
  .segs{display:grid;gap:12px}
  .seg{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--panel2)}
  .seg .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .seg .row .hn{font-weight:800;font-size:14.5px}
  .seg .badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--team,#2a6fd8) 20%,transparent);color:var(--team);white-space:nowrap}
  .seg p{font-size:12.5px;line-height:1.6;color:var(--dim);margin-top:6px}
  .seg p.cls{color:var(--fg)}
  .seg .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin-top:10px;font-weight:700}
  .closing{font-size:14px;line-height:1.6;border-top:1px dashed var(--line);margin-top:16px;padding-top:14px;color:var(--fg)}
</style>
</head>

<script>
const TEAMS_DATA = {"updated_at": "2026-09-18T13:05:00.502444+00:00", "teams": [{"name": "Dodgers", "sport": "MLB", "emoji": "Baseball", "accent": "#2A6FD8", "record": "93-60", "headline": "Dodgers clinch 5th straight NL West title as Kyle Tucker's four-hit day powers 8-2 win over Reds", "latest_news": [{"title": "Dodgers clinch 5th straight NL West title, 13th in 14 years", "summary": "Behind Kyle Tucker's four hits — falling a triple short of the cycle with three RBIs — the Dodgers rolled past Cincinnati 8-2 on Thursday to lock up another NL West crown. Los Angeles (93-60), which had secured a wild-card spot on Monday, owns a 9 1/2-game lead over San Diego and now chases Milwaukee for the top NL seed and the NL's lone first-round bye.", "url": "https://www.newsday.com/sports/baseball/dodgers-reds-score-a88939"}, {"title": "Kyle Tucker stays red hot with four-hit clincher against the Reds", "summary": "Tucker hammered a two-run home run (No. 16 of the season) off Brady Singer in the first inning — a 99.9 mph, 401-foot blast to right-center — then added a single and two doubles. The $240 million outfielder, who has battled a career-worst season, has found his bat at the exact right time as October approaches.", "url": "https://www.mlb.com/dodgers/video/kyle-tucker-s-four-hit-day-against-the-reds"}, {"title": "Shohei Ohtani placed on 15-day IL; shut down from pitching for 2026", "summary": "Still bothered by lingering left knee and right biceps issues, Ohtani hit the injured list on Sept. 11 and is not traveling with the team. He'll be shut down from swinging for a few days before ramping back up, with an eligible return around Sept. 23. To cover his absence, the Dodgers called up MLB Pipeline's No. 6 prospect Josue De Paula, who made his big-league debut as DH in Miami.", "url": "https://www.mlb.com/dodgers/news/shohei-ohtani-out-of-lineup-again-vs-reds"}, {"title": "Giants come to Dodger Stadium to open the final home stretch Friday", "summary": "Fresh off clinching the division, L.A. opens a three-game set against San Francisco on Friday night at Dodger Stadium before the Padres visit Sept. 22 for Kershaw World Championship Ring Night. With Ohtani shelved, the Dodgers will lean on a rotation of Snell, Yamamoto, Skubal, Glasnow and Sasaki into the postseason.", "url": "https://www.truebluela.com/los-angeles-dodgers-schedule/124488/giants-september-18"}, {"title": "Tyler Glasnow back, Dodgers rotation near full strength", "summary": "Glasnow returned from the 60-day IL in late August after missing nearly four months with lower back spasms, joining Yamamoto, Skubal, Snell and Sasaki. With a month to shake off rust, the Dodgers' Big Four are all healthy heading into October — the rotation depth that makes them World Series favorites.", "url": "https://www.mlb.com/news/tyler-glasnow-return-dodgers-rotation"}, {"title": "September roster influx: Miller activated, Thomas DFA'd, Smith/Rushing/Freeland/Wrobleski back", "summary": "The Dodgers have been churning the 28-man roster since Sept. 1: Bobby Miller was activated from the IL (with Alek Thomas designated for assignment), Blake Treinen returned from the 60-day IL, and Will Smith, Dalton Rushing, Justin Wrobleski and Alex Freeland were all added with rosters expanding.", "url": "https://www.mlb.com/dodgers/news/topic/dodgers-press-releases"}], "fun_facts": ["The NL West crown is L.A.'s fifth straight and 13th in the past 14 seasons — and it was the fourth-earliest division clinch in franchise history, trailing only 2019, 2022 and 2023.", "With the postseason berth assured, the Dodgers reach their 14th consecutive playoff appearance, tying the Atlanta run of 1991-2005 for the longest in MLB history.", "Kyle Tucker fell just a triple short of the cycle in the clincher; his first-inning two-run homer was his 16th of the season.", "Shohei Ohtani finished the year with a .902 OPS and 30 homers as a hitter while posting a 1.79 ERA over 14 pitching starts — but hasn't pitched since July 3 and won't in 2026.", "Justin Wrobleski and Blake Treinen combined to retire the Reds' first 11 batters in the division-clinching win, with Wrobleski perfect through three innings."], "further_reading": [{"title": "Here's what the MLB playoff picture looks like entering September", "why": "Shows where the Dodgers stand with a 10.5-game NL West lead and their chase for the No. 2 seed — and a first-round bye — behind Milwaukee.", "url": "https://www.mlb.com/news/mlb-playoff-picture-and-bracket-2026"}, {"title": "'Right thing to do.' Dodgers put Shohei Ohtani on injured list after rout of Reds", "why": "LA Times reporting on the decision to shelve Ohtani and the context around his biceps and knee issues and shut-down pitching timeline.", "url": "https://www.latimes.com/sports/dodgers/story/2026-09-09/dodgers-injury-woes-grow-shohei-ohtani-freddie-freeman-game-recap"}, {"title": "Kyle Tucker finds one swing in midst of disastrous first season with Dodgers", "why": "The Athletic's deep dive on Tucker's exit-velocity issues, bat-path fixes and whether his late surge can carry into the postseason.", "url": "https://www.nytimes.com/athletic/7567264/2026/09/05/kyle-tucker-dodgers-home-run-nationals"}, {"title": "Dodgers injuries and roster moves tracker", "why": "The running MLB.com tracker on Ohtani, Glasnow, Snell, Sasaki and every transaction as the Dodgers line up their October roster.", "url": "https://www.mlb.com/news/dodgers-injuries-and-roster-moves.html"}, {"title": "2026 NL West standings", "why": "Updated division standings showing the Dodgers' magic number and the gap back through San Diego, Arizona, San Francisco and Colorado.", "url": "https://www.mlb.com/standings/nl-west"}], "one_sentence": "Division champs again: Kyle Tucker's four-hit, three-RBI night powered an 8-2 win over the Reds that clinched the Dodgers' fifth straight NL West crown, while Shohei Ohtani's biceps and knee issues keep him shelved until late September."}, {"name": "USC Trojans", "sport": "College Football", "emoji": "Football", "accent": "#9E1B32", "record": "3-0 (0-0 Big Ten) — No. 12 AP", "headline": "No. 12 USC Opens Big Ten Play at Rutgers Saturday — Without Star Freshman Trent Mosley (Knee)", "latest_news": [{"title": "USC Freshman WR Trent Mosley Out for Big Ten Opener at Rutgers With Injury", "summary": "Riley ruled Mosley (knee) out for Saturday's trip to Piscataway, calling his return timeline \"inconclusive.\" The breakout freshman leads USC with 13 catches, 255 yards and 4 TDs, and scored on an 86-yard punt return vs. Louisiana. Per CBS Sports' Matt Zenitz, he's expected to miss multiple games.", "url": "https://www.foxsports.com/articles/cfb/usc-freshman-wr-trent-mosley-out-for-big-ten-opener-at-rutgers-with-injury"}, {"title": "USC Trojans Receive Trent Mosley Injury Update As Rutgers Game Looms", "summary": "The expected multi-game absence hits a murky stretch of USC's schedule: No. 21 Oregon at home (Sept. 26), Washington (Oct. 3) and No. 14 Penn State (Oct. 10). Freshmen Kayden Dixon-Wyatt and Mark Bowman — two TDs apiece — are the prime candidates to absorb the target share.", "url": "https://www.si.com/college/usc/football/usc-trojans-trent-mosley-injury-update-rutgers-game-looms"}, {"title": "No. 12 USC Visits Rutgers in Big Ten Opener, First Road Test", "summary": "USC leaves Thursday instead of Friday to blunt the cross-country trip against winless Rutgers (0-2). Maiava leads the FBS with 896 passing yards and 10 TDs at an 80.7% completion rate; the secondary draws a tough matchup in Rutgers WR KJ Duff, second nationally with 333 receiving yards and 5 TD grabs.", "url": "https://www.cbssports.com/college-football/news/no-12-usc-visits-rutgers-in-big-ten-opener-first-road-test/"}, {"title": "Three Bold Predictions for USC Trojans Big Ten Opener vs. Rutgers", "summary": "USC is a 24-point road favorite per DraftKings, but Riley stressed \"raising the floor\" after the defense surrendered 358 yards to Louisiana. Rutgers also ranks last in FBS with a -5 turnover margin, while USC is No. 5 nationally in time of possession (36:27).", "url": "https://www.si.com/college/usc/football/three-bold-predictions-usc-trojans-big-ten-opener-rutgers"}, {"title": "USC Moves Up to No. 12 in AP Poll Following Louisiana Win", "summary": "The 49-30 win and upsets of Oregon and Oklahoma boosted the Trojans two spots to No. 12 — with Texas taking over No. 1. USC routed San Jose State 42-26, shut out Fresno State 39-0, and blew out Louisiana 49-30 on Maiava's five-touchdown night to close a perfect nonconference slate.", "url": "https://www.si.com/college/usc/football/usc-trojans-projected-ap-top-25-poll-chaotic-weekend"}, {"title": "Jayden Maiava Earns Big Ten Offensive Player of the Week", "summary": "After a 23-of-25, 349-yard, 3-TD day in the 39-0 shutout of Fresno State, Maiava took his second career Big Ten weekly honor. His 92.0% completion rate was the highest single-game mark by a USC quarterback since at least 1995 (25+ attempts).", "url": "https://usctrojans.com/news/2026/9/7/football-usc-quarterback-jayden-maiava-earns-big-ten-offensive-player-of-the-week-honors"}], "fun_facts": ["Jayden Maiava leads the FBS in both passing yards (896) and touchdown passes (10), completing 80.7% of his throws through three games.", "USC outscored its first two opponents 58-0 in the first half combined — including a 44-0 second-quarter edge — while outgaining teams 1,057-452.", "USC's 2026 recruiting class finished No. 1 in the 247Sports Composite, becoming the first program to break the SEC's multi-year grip on top recruiting classes.", "Freshman TE Mark Bowman won Big Ten Freshman of the Week after catching 6 balls for 83 yards and two TDs — all in the first half — against Louisiana.", "King Miller seized the RB1 role against Louisiana, rumbling for 128 yards and a score on 18 carries, with five runs of 10+ yards."], "further_reading": [{"title": "USC at Rutgers Pregame — ESPN", "why": "Numbers-driven preview: USC converts 69.4% of third downs (3rd nationally) while Rutgers is 132nd in red-zone offense and 94th in time of possession.", "url": "https://www.espn.com/college-football/preview/_/gameId/401858457"}, {"title": "USC Trojans 2026 Schedule & Results — ESPN", "why": "Full schedule showing the gauntlet ahead of Rutgers: No. 21 Oregon (9/26), Washington (10/3), No. 14 Penn State (10/10), No. 6 Ohio State (10/31) and No. 4 Indiana (11/14).", "url": "https://www.espn.com/college-football/team/schedule/_/id/30/usc-trojans"}, {"title": "USC Clinches No. 1 Recruiting Class of 2026 — 247Sports", "why": "Recap of the historic national signing day haul led by five-stars including TE Mark Bowman and CB Elbert Hill.", "url": "https://247sports.com/college/usc/article/usc-clinches-no-1-recruiting-class-of-2026-264609187"}, {"title": "AP Top 25 Poll: Texas Is New No. 1 — AP News", "why": "Week 2 poll context: USC checks in at No. 12 after Texas knocked off Ohio State and Oregon tumbled 15 spots.", "url": "https://apnews.com/live/top-25-college-football-poll-9-13-2026"}, {"title": "USC at Rutgers — Stats & Lineups — Sports-Reference", "why": "Game-by-game box scores and matchup history as USC plays its first road game, and first Big Ten game outside California, of 2026.", "url": "https://www.sports-reference.com/cfb/boxscores/2026-09-19-rutgers.html"}], "one_sentence": "No. 12 USC (3-0) takes the FBS's most prolific passing offense to Piscataway for its Big Ten opener at winless Rutgers on Saturday without injured freshman star Trent Mosley — with No. 21 Oregon, Washington and No. 14 Penn State waiting right behind."}, {"name": "Rams", "sport": "NFL", "emoji": "🏈", "accent": "#003594", "record": "0-1", "headline": "Donald 'hopeful' for long-awaited MNF debut at SoFi as Rams seek rebound vs. Giants", "latest_news": [{"title": "McVay: Rams 'hopeful' Aaron Donald will play against Giants on MNF", "summary": "Donald will practice in full Thursday and the team is 'hopeful' he suits up Monday night against the Giants -- the 35-year-old's first game since un-retiring on Aug. 30 after two years away. McVay said it's a feel-based decision: 'How does he feel?' Donald did not travel for the Week 1 loss in Melbourne.", "url": "https://www.espn.com/nfl/story/_/id/49968127/mcvay-rams-hopeful-donald-play-giants-mnf"}, {"title": "McVay: Myles Garrett (knee) 'feeling good' post-surgery, but Rams 'not going to rush him back' from IR", "summary": "The Rams officially placed the reigning Defensive Player of the Year on IR on Thursday, ruling him out at least four games (Giants, at Broncos, at Eagles, Bills). McVay called Garrett's recovery 'Wolverine-like -- crutches yesterday, walking without crutches today' -- but refused to set a return timeline.", "url": "https://www.therams.com/news/mcvay-myles-garrett-knee-feeling-good-post-surgery-but-rams-not-going-to-rush-him-back-from-injured-reserve"}, {"title": "Rams look to rebound against surging Giants on Monday night", "summary": "After a 27-7 flop vs. the 49ers in Melbourne, an 0-1 Rams team opens at SoFi Stadium against 1-0 New York, which rode rookie QB Jaxson Dart's three touchdowns past Dallas. Stafford looked nothing like his MVP self last week (15/25, 155 yards, INT). Rams are 7-point favorites; kickoff 8:15 p.m. ET on ESPN/ABC.", "url": "https://www.cbssports.com/nfl/news/rams-look-to-rebound-against-surging-giants-on-monday-night/"}, {"title": "Rams injury report: Kam Kinchens, Davante Adams among defenders/playmakers to watch", "summary": "Kam Kinchens (hamstring) missed Thursday's practice after injuring it vs. the 49ers, while Kam Curl (ankle), Omar Speights (hip) and Nate Landman (shoulder) were limited. Adams took a veteran rest day. On the plus side, McVay said Speights is 'feeling better than we anticipated.'", "url": "https://www.si.com/nfl/rams/onsi/rams-week-2-injury-report-kam-kinchens-nate-landman"}, {"title": "Sean McVay hopes Rams 'never' play in Australia again after Melbourne loss", "summary": "McVay praised the MCG 'great atmosphere' but wants Australia off the schedule: 'We're not playing in Australia ever again, I hope.' The only complication: Australia is part of the Rams' international marketing territory, so his vote may not carry the room.", "url": "https://nypost.com/2026/09/18/sports/rams-sean-mcvay-wants-no-part-of-playing-in-australia-ever-again/"}, {"title": "49ers trounce Rams 27-7 Down Under in NFL's first Australia game", "summary": "Brock Purdy threw three TDs in front of 100,021 fans at the MCG -- the seventh-largest regular-season crowd in NFL history -- as the 49ers held reigning MVP Stafford to 155 yards. Kyren Williams scored the NFL's first Australian TD, but LA hadn't lost by more than seven points since Nov. 2024.", "url": "https://www.espn.com/nfl/story/_/id/49892445/2026-nfl-week-1-los-angeles-rams-san-francisco-49ers-matthew-stafford-brock-purdy-melbourne"}], "fun_facts": ["The Sept. 10 opener at the Melbourne Cricket Ground drew 100,021 fans -- the largest crowd ever for an NFL game outside North America and the seventh-biggest regular-season attendance in NFL history.", "Kyren Williams' 5-yard touchdown run to open the second quarter in Melbourne was the first touchdown in NFL history scored in Australia.", "Aaron Donald, who turns 35 and un-retired Aug. 30 after two seasons away, is working toward his first NFL game since January 2023 -- a potential SoFi Stadium comeback nearly 3.5 years in the making.", "McVay described Myles Garrett's post-surgery recovery as 'like Wolverine, healing fast,' after the reigning DPOY went from crutches to walking unaided in a single day.", "Stafford's interception against the 49ers was his first in a divisional game since 2023 -- he threw eight TDs and zero picks across four games vs. the Niners in 2024-25."], "further_reading": [{"title": "49ers rout Rams 27-7 as NFL draws 100,000 to Melbourne", "why": "Game story on how Purdy's three TDs and a stymied Stafford exposed the Rams' new-look defense in the NFL's first-ever regular-season game in Australia.", "url": "https://www.theguardian.com/sport/2026/sep/10/49ers-rams-nfl-australia-melbourne-result-brock-purdy"}, {"title": "Game Recap: Rams fall to 49ers 27-7 in Week 1 in Australia", "why": "The team's own recap of the opener, including Kyren Williams' historic TD, Quentin Lake's INT, and the fourth-down Stafford sneak stuffed at the 1-yard line.", "url": "https://www.therams.com/news/game-recap-rams-fall-to-49ers-27-7-in-week-1-in-australia"}, {"title": "Rams release official 2026 schedule", "why": "Full 2026 slate, including the MNF tilt vs. the Giants at SoFi, the Melbourne trip, and the NFC West gauntlet that follows.", "url": "https://www.therams.com/news/rams-release-official-2026-schedule"}, {"title": "Aaron Donald unretires, will play for Rams in 2026", "why": "The complete story of Donald's Aug. 30 comeback and his one-year, $20 million deal (up to $30M with playoff incentives) that sets up a potential Monday return.", "url": "https://www.therams.com/news/aaron-donald-unretires-will-play-for-rams-in-2026"}, {"title": "Puka Nacua Week 2 Outlook: Giants at Rams", "why": "How Nacua -- who saved his fantasy day with a 41-yard grab against the Niners -- projects against a Giants defense that just limited Dak Prescott to 175 yards.", "url": "https://www.fantasypros.com/nfl/notes/439512/puka-nacua-2026-week-2-outlook.php"}], "one_sentence": "Reeling from a 27-7 Australia debacle and the loss of DPOY Myles Garrett to IR, the 0-1 Rams host the Giants on Monday Night Football with Aaron Donald's long-awaited return to SoFi Stadium 'hopeful' to rescue a defense built to win Super Bowl LXI."}]};
const DIGEST_DATA = {"updated_at": "2026-09-18T06:00:22-07:00", "title": "LA Sports Daily Digest — 15-Minute Edition", "read_time": "~15 minutes", "intro": "Friday in Los Angeles is all about the countdown to the weekend, and no city has more riding on it. The Dodgers are division champions for the fifth straight year and open a final home stand against San Francisco Friday night, USC takes the FBS's most explosive passing offense to Piscataway for its Big Ten opener Saturday, and the Rams — 0-1 and banged up after a brutal trip to Australia — host the Giants under the lights at SoFi on Monday with Aaron Donald on the verge of a comeback nearly three years in the making.", "intro_zh": "週五的洛杉磯聚焦倒數計時，迎接週末到來，而沒有哪座城市背負更重的期待。道奇隊連續第五年拿下分區冠軍，週五晚間於主場展開對舊金山巨人隊的最終主場系列戰；南加大帶著全美最炸裂的傳球攻勢，於週六赴皮斯卡塔韋展開大十聯盟開幕戰；而公羊隊在澳洲苦吞敗仗、傷兵滿營之後，將於週一晚上在SoFi球場迎戰巨人隊，Aaron Donald睽違近三年有望回歸陣容。", "segments": [{"team": "Dodgers", "accent": "#2A6FD8", "headline": "Dodgers clinch 5th straight NL West title with 8-2 win over Reds, chase top seed", "headline_zh": "道奇八比二擊退紅人，連續第五年奪下國聯西區冠軍，角逐最佳種子", "analysis": "The champagne popped Thursday at Dodger Stadium for the fifth consecutive September, as Kyle Tucker's four-hit night powered an 8-2 win over Cincinnati and delivered the NL West crown. Los Angeles (93-60) had already secured a wild-card spot on Monday, so Thursday was about closing it out in style with an eye on a much bigger prize. The division title is the club's 13th in the past 14 seasons — one of the most absurd runs of sustained dominance baseball has ever seen — and the fourth-earliest clinch in franchise history behind only 2019, 2022 and 2023.\n\nThe clinch also locks in a 14th consecutive playoff appearance, tying Atlanta's 1991-2005 run for the longest stretch in MLB history. That kind of consistency has become routine in Chavez Ravine, which is precisely why nobody in the clubhouse is treating a division banner as a finish line. San Diego trails by 9 1/2 games and was never a threat down the stretch; the real race now is with Milwaukee for the NL's top seed and the lone first-round bye.\n\nThe stakes of that bye are enormous. A top seed means a bye through the wild-card round, a fully rested rotation, and home field through the League Championship Series. With Ohtani shelved and the pitching staff managing workloads, every extra day of rest carries real value. First pitch Friday against the Giants officially opens the final stretch, and the Dodgers control their seeding destiny the rest of the way.", "analysis_zh": "週四道奇球場連續第五年在九月份噴灑勝利香檳。靠著Kyle Tucker的四安打之夜，道奇以八比二擊退辛辛那提紅人，順利拿下國聯西區王座。道奇隊（九十三勝六十敗）週一早已鎖定外卡席次，週四之戰的意義在於風光收尾，同時放眼更大的目標。這座分區冠軍是球隊近十四季中第十三次問鼎——棒球史上最令人難以置信的長期宰制表現之一——同時也是隊史第四快的封王紀錄，僅次於2019、2022與2023年。\n\n這次封王也確保道奇連續第十四年挺進季後賽，追平亞特蘭大勇士1991至2005年的史上最長紀錄。這種穩定性在查維茲谷已成為日常，而這正是休息室裡沒有人把分區錦旗當成終點線的原因。教士隊落後9.5場勝差，早已對道奇構不成威脅；現在真正的競爭是和釀酒人爭奪國聯最佳種子，以及那唯一一張季後賽首輪輪空門票。\n\n那張輪空門票的價值難以估量。最佳種子代表跳過外卡系列戰、輪值得以完全休養生息，並在聯盟冠軍賽前享有主場優勢。在Ohtani缺陣、投手群必須管理用球量的此時，多一天休息就多一分價值。週五晚間對巨人隊的比賽正式開啟最終賽程，道奇隊接下來將完全掌握自己的種子位階。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Kyle Tucker's four-hit clincher shows the bat October needs", "headline_zh": "Kyle Tucker封王戰四安打，證明十月所需的火力已就位", "analysis": "Tucker was the engine of Thursday's clincher, drilling a two-run homer off Brady Singer in the first inning — a 99.9 mph, 401-foot blast to right-center — then adding a single and two doubles for a four-hit night that also produced three RBIs. He fell just a triple short of the cycle. The night moved him to 16 home runs on the season, unremarkable by his All-Star standards but enormous for where the Dodgers stand right now.\n\nContext matters: Tucker has battled a career-worst season since arriving via last winter's blockbuster with the Cubs. The exit velocities dipped, the bat path flattened, and for long stretches the $240 million man looked like a fraction of the MVP-caliber hitter who terrorized the American League in Houston. But September has been a different story — he's found his timing at the exact moment the Dodgers need a second heartbeat in the lineup behind who remains of their lineup.\n\nThat timing is everything. With Ohtani shelved and the division already in hand, the Dodgers' October ceiling depends less on their rotation than on whether Tucker's bat can travel. The Athletic's deep dive earlier this month flagged his exit-velocity issues and the mechanical tweaks he's made to fix them. Thursday's 99.9 mph homer and two doubles suggest those fixes are taking. If this version of Tucker shows up in the playoffs, the Dodgers become markedly harder to beat.", "analysis_zh": "Tucker是週四封王之戰的引擎。他在第一局就砲打Brady Singer，砍出一發右中外野、飛行距離401呎、出棒初速99.9英里的大號兩分全壘打，接著再補上兩支二壘安打與一支一壘安打，四安打、三分打點，距離完全打擊只差一支三壘安打。他賽季全壘打數來到16轟，以他全明星級的身手而言不算起眼，但對此刻的道奇隊意義重大。\n\n背景值得深究：Tucker在去年冬天與小熊隊的重量級交易後加盟，整個賽季卻陷入生涯最糟狀態。擊球初速下滑、揮棒軌跡走平，長達數週，這位兩億四千萬美元的男人看起來只是過去那位在休士頓肆虐美聯的MVP級打者的一個殘影。但九月的故事截然不同——他在道奇最需要陣容第二號火力的時刻，找回了揮棒時機。\n\n時機就是一切。在Ohtani缺陣、分區已落入袋中的此刻，道奇隊十月的天花板，與其說取決於輪值，不如說取決於Tucker的球棒能否隨隊遠行。The Athletic本月初的深度報導點出他的擊球初速問題，以及他為修正所做的揮棒調整。週四那發99.9英里的全壘打與兩支長打，顯示這些調整正在生效。如果季後賽登場的是這個版本的Tucker，道奇隊將更難被擊敗。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Ohtani on 15-day IL, shut down from pitching for 2026", "headline_zh": "Ohtani列入十五日傷兵名單，2026年賽季不再登板投球", "analysis": "The biggest shadow over the Dodgers' October is Shohei Ohtani — and where he'll be when the games truly begin. Still bothered by lingering left knee and right biceps issues, Ohtani was placed on the 15-day injured list Sept. 11 and did not travel with the team. He'll be shut down from swinging for a few days before ramping back up, with an eligible return around Sept. 23. The organization framed the move as protecting him for the month that actually matters.\n\nThe full-year picture is remarkable even by his absurd standards: a .902 OPS, 30 homers and a 1.79 ERA over 14 pitching starts — none of them since July 3. The Dodgers have essentially been planning for an October without Ohtani on the mound for months, and Thursday's official shutdown of his 2026 pitching season merely confirmed what everyone already knew. The question that remains is how much of his bat returns by the Division Series.\n\nAs an analyst, I'd argue the Dodgers made the only rational call. A hobbled Ohtani swinging at 80 percent still upgrades a lineup, but his value is now purely as a DH with a healed knee and fresh biceps. Rushing him back for meaningless September games would gamble the entire postseason on a few extra beats in a race already won. The front office said it was the \"right thing to do,\" and for once the cliché is accurate — protecting Ohtani is protecting the title defense. To cover his absence, the club called up MLB Pipeline's No. 6 overall prospect Josue De Paula, who made his big-league debut as the DH in Miami.", "analysis_zh": "籠罩道奇隊十月最大的陰影是Shohei Ohtani——以及當真正的戰鬥開始時，他人在何處。Ohtani承受著左膝與右二頭肌的纏綿傷勢，於9月11日被放入十五日傷兵名單，且未隨隊遠征。他將暫停揮棒數日，再逐步恢復，預計9月23日左右具備歸隊資格。球團將此舉定調為：為真正重要的月份保護他。\n\n縱觀整個賽季，即使以他荒謬的標準衡量，依然是驚人的成就：OPS高達.902、30轟，以及在14場投球先發中繳出的1.79防禦率——但這14場全部在7月3日之前完成。道奇隊數月來實際上早已為「十月沒有Ohtani投球」做準備，週四將他2026年賽季投球正式關閉，不過是確認了眾所周知的事實。真正的問題在於，當分區系列賽開打時，他的打擊能恢復多少。\n\n以分析師的眼光，我認為道奇隊做出了唯一理性的決定。一位受傷的Ohtani即使以八成功力揮棒，仍能升級任何打線，但他現在的價值純粹在於擔任指定打擊、以健康的膝蓋與充盈的二頭肌上場。為了一場已經贏得的競爭而在無意義的九月賽事中催他上陣，等於拿整個季後賽去賭。球團稱此舉是「正確的事」，而這次老生常談其實千真萬確——保護Ohtani，就是保護連霸的衛冕之路。為了填補他的空缺，道奇升上了MLB Pipeline全聯盟第六號新秀Josue De Paula，後者在邁阿密完成了大聯盟初登場，擔任指定打擊。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Glasnow back, rotation near full strength for October push", "headline_zh": "Glasnow傷癒歸隊，輪值接近陣容完整備戰十月", "analysis": "The quietest and possibly most important injury news of the week is that Tyler Glasnow is back — activated from the 60-day injured list in late August after missing nearly four months with lower back spasms. He joins a rotation headlined by Yamamoto, Skubal, Snell and Sasaki, giving the Dodgers five front-line arms at a time when every contender is counting broken parts. With a full month to shake off rust before October, Glasnow rounds out what is arguably the deepest postseason rotation in the sport.\n\nConsider how different this looks from a year ago. The Big Four — Glasnow, Yamamoto, Snell and Skubal — are all healthy simultaneously, with Sasaki providing a wild-card of punch-you-out dominance. Rosters expanding in September have only deepened the bench behind them: Bobby Miller was activated from the IL (with Alek Thomas designated for assignment), Blake Treinen returned from the 60-day IL, and Will Smith, Dalton Rushing, Justin Wrobleski and Alex Freeland joined on the expanded 28-man roster.\n\nThis is the identity the Dodgers built for — a rotation with no easy outs in a five-game series. Division and wild-card opponents have to navigate Glasnow's heat, Yamamoto's splitter, Skubal's relentlessness, Snell's November history, and Roki Sasaki's stuff, possibly all in the same week. If the bats stall against elite October arms, the pitching can keep the Dodgers in every single game. That depth is the single biggest reason the oddsmakers still call this team the World Series favorite.", "analysis_zh": "本週最安靜、卻可能是最重要的傷兵消息，是Tyler Glasnow的回歸——他在因下背痙攣缺陣近四個月後，於八月下旬從六十日傷兵名單解除。他加入以Yamamoto、Skubal、Snell與Sasaki領銜的輪值，讓道奇同時擁有五位前段先發投手，而此時各支勁旅都在數著殘缺的零件。十月來臨前有整整一個月可以甩掉鏽感，Glasnow補齊了這套可說是全聯盟最深的季後賽輪值。\n\n想想這跟一年前有多麼不同。四巨頭——Glasnow、Yamamoto、Snell與Skubal——如今同時健康，Sasaki則提供一張三振爆炸力的外卡牌。九月的名單擴編也讓牛棚與後援更加深厚：Bobby Miller從傷兵名單歸隊（Alek Thomas被指定讓渡）、Blake Treinen自六十日名單回歸，Will Smith、Dalton Rushing、Justin Wrobleski與Alex Freeland則在名單擴編時加入。\n\n這正是道奇隊建軍的藍圖——一套在五戰三勝系列中沒有軟手的輪值。分區對手與外卡勁敵必須在同一週內依序面對Glasnow的火球、Yamamoto的指叉球、Skubal的壓迫感、Snell的十一月血統，以及Roki Sasaki的stuff。如果打線在十月強投面前熄火，投手群仍足以讓道奇每一戰保有競爭力。這種深度，正是盤口仍把道奇列為世界大賽奪冠最大熱門的頭號理由。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Final home stand opens Friday vs. Giants; Kershaw's Ring Night looms Sept. 22", "headline_zh": "最終主場系列戰週五迎戰巨人；Kershaw冠軍戒之夜九月廿二日登場", "analysis": "Division secured, the Dodgers open a three-game set against the San Francisco Giants at Dodger Stadium on Friday night — the start of the final home stand of the regular season. It's a chance to tune the machine: line up the rotation, get Ohtani reps if healthy, and keep the pedal down for the No. 1 seed. From here the schedule is a closing argument, not a gauntlet; the Padres arrive Sept. 22 for Kershaw World Championship Ring Night, an emotional capstone for a franchise already thinking about October.\n\nThe Giants series matters for one blunt reason: seeding. Milwaukee sits atop the NL standings, and every win between now and the close of the season tightens the race for the lone bye. The Dodgers have built a sterling 93-60 record with a run differential that reflects a complete team, but the standings say the bye is not yet banked. Stacking wins this weekend — against a Giants club playing out the string — is exactly the kind of small edge October is decided by.\n\nThe September roster has also been churning by design. Miller back, Treinen back, Wrobleski and Freeland added — depth auditions that give Andrew Friedman and Dave Roberts real evidence for the final 26-man cutdown. Ring Night against San Diego on Sept. 22 will carry genuine emotion — Kershaw, a franchise icon, celebrated in front of the home crowd he defined — but the Dodgers' front office is treating these final nine games as live-fire preparation for the postseason roster. Expect rest for key arms, auditions for the edges of the roster, and a quiet eye on that Milwaukee scoreboard.", "analysis_zh": "分區已確定到手，道奇隊週五晚間在道奇球場展開對舊金山巨人隊的三連戰——例行賽最終主場系列戰的開端。這是調整機器的良機：排定輪值順序、在健康前提下讓Ohtani上場找感覺，並為最佳種子繼續催油門。從現在開始的賽程是結案陳詞，而非磨難之路；教士隊將於9月22日造訪，出席Kershaw世界大賽冠軍戒之夜，替一支已放眼十月的球隊寫下情感滿溢的註腳。\n\n巨人系列戰之所以重要，有一個直白的理由：種子序。釀酒人盤踞國聯龍頭，而每拿下一場勝利，都在縮小與那張唯一輪空門票的差距。道奇以93勝60敗的亮麗戰績與反映完整戰力的得失分差豎立起強隊形象，但帳面數據說明輪空尚未到手。本週末對戰已無欲無求的巨人隊累積勝場，正是十月勝負所繫的那種微小優勢。\n\n九月的名單也按計畫不斷變動。Miller回歸、Treinen回歸、Wrobleski與Freeland加入——這些深度試鏡，為Andrew Friedman與Dave Roberts提供最終二十六人名單的實戰證據。9月22日對教士的冠軍戒之夜必然真情流露——Kershaw，這位他為之定義主場氛圍的傳奇人物，在家鄉球迷面前受頌——但道奇高層正把這最後九戰視為季後賽名單的實彈演練。可以預期主力手臂獲得休養、名單邊緣位置進行試煉，以及一雙悄悄盯著密爾瓦基記分板的眼睛。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "No. 12 USC opens Big Ten play at Rutgers without star freshman Trent Mosley", "headline_zh": "第十二名南加大赴羅格斯大學展開大十聯盟首戰，主力新生Trent Mosley缺陣", "analysis": "Saturday's Big Ten opener at Rutgers brings USC's first road game of the season, and it arrives with a notable subtraction: freshman receiver Trent Mosley is out with a knee injury, ruled out by Riley with what the coach called an \"inconclusive\" return timeline. Mosley was a breakout star of the nonconference slate — a team-leading 13 catches, 255 yards and four touchdowns, plus an 86-yard punt return score against Louisiana. Per CBS Sports' Matt Zenitz, the expectation is a multi-game absence.\n\nUSC (3-0) travels to winless Rutgers (0-2) as a heavy road favorite — 24 points per DraftKings — but the injury re-frames the game entirely. Without Mosley, USC loses its downfield weapon and most dynamic punt returner, and Riley must answer how the offense replaces a target share that shaped the first three games. Freshmen Kayden Dixon-Wyatt and Mark Bowman — two touchdowns apiece this season — are the leading candidates to absorb the load.\n\nThe scheduling irony is biting. USC leaves Thursday instead of Friday to blunt the cross-country trip, but the gauntlet immediately behind Rutgers is exactly where Mosley would have mattered most: No. 21 Oregon at home Sept. 26, Washington Oct. 3, and No. 14 Penn State Oct. 10. If the injury stretches into that stretch — and the reporting suggests it could — USC will have to prove it can win its hardest games with a shortened playbook. That's a heavy lift for a first road game, even against an 0-2 opponent.", "analysis_zh": "週六在羅格斯大學的大十聯盟開幕戰，是南加大本季第一場客場比賽，而它伴隨一項重大減員而來：大一外接手Trent Mosley因膝傷缺陣，Riley以「尚無定論」形容他的回歸時間表。Mosley是非聯盟賽程中的大爆發新星——隊上最多的13次接球、255碼與四次達陣，外加對路易斯安那大學的那記86碼棄踢回攻達陣。據CBS Sports的Matt Zenitz報導，預期他將缺陣數場。\n\n南加大（三勝○敗）以巨幅客場讓分挑戰一勝難求的羅格斯大學（○勝二敗）——DraftKings開出24分讓分——但這項傷情徹底改寫了比賽面貌。少了Mosley，南加大失去了縱深武器與最具爆發力的棄踢回攻手，而Riley必須回答：該如何填補這筆塑造前三個球權的接球份額。本季各進帳兩次達陣的大一新生Kayden Dixon-Wyatt與Mark Bowman，是最有資格的接棒人選。\n\n賽程的諷刺令人刺痛。南加大提前在週四而非週五出發，以緩解跨岸遠征的疲勞，但緊跟在羅格斯後的考驗，恰恰是Mosley最該存在的時刻：9月26日主場對第二十一名奧勒岡、10月3日出戰華盛頓、10月10日對第十四名賓州州大。如果傷勢拖進這段賽程——種種報導暗示確有此可能——南加大就必須證明，自己在武器書縮水時依然能贏下最艱難的比賽。對一場客場處女秀而言，即便是面對一支○勝二敗的對手，這都是沉重的負擔。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "Maiava's FBS-leading arm carries USC to perfect nonconference slate, No. 12 AP ranking", "headline_zh": "Maiava以全美第一的傳球火力率南加大橫掃非聯盟賽程，登上第十二名", "analysis": "At the center of everything for USC is Jayden Maiava, who leads the FBS in both passing yards (896) and touchdown passes (10) while completing 80.7 percent of his throws through three games. His season has been a case study in efficiency and aggression: 23-of-25 for 349 yards and three touchdowns in the 39-0 shutout of Fresno State, a 92.0 percent completion rate that was the highest single-game mark by a USC quarterback since at least 1995 on 25-plus attempts. That performance earned him his second career Big Ten Offensive Player of the Week award.\n\nThe wins have come in every flavor. San Jose State fell 42-26 in a shootout, Fresno State was blanked 39-0, and Louisiana went down 49-30 on Maiava's five-touchdown night — a perfect nonconference clean sweep that landed USC two spots higher at No. 12 in the AP poll after a chaotic top-of-the-table weekend that vaulted Texas to No. 1. The Trojans have outscored their first two opponents 58-0 combined in the first half, outgaining teams 1,057-452 in total yardage.\n\nNumbers like that invite a caveat, and the caveat is real: the competition gets steeper immediately. Maiava's completion percentage will regress against Big Ten secondaries that don't play 40 yards of cushion and safeties who actually challenge crossing routes. But the underlying skill — decision-making under structure, an arm that can push the ball downfield, and the calm to play on schedule — is the kind of quarterbacking that transfers. The Trojans' No. 12 ranking reflects what he's already done; the Big Ten schedule will reveal what he actually is.", "analysis_zh": "南加大一切環繞的核心是Jayden Maiava。他在前三戰以80.7%的傳球成功率，領先全美FBS的傳球碼數（896碼）與傳球達陣數（10次）。他的球季堪稱效率與侵略性的研究範例：對佛雷斯諾州大的39比0完封之戰中，他繳出23傳25中、349碼、三達陣的成績，92.0%的完成率是至少自1995年以來南加大四分衛在25次以上出手中的單場新高。那次表現為他拿下生涯第二座大十聯盟進攻組單週最佳球員獎。\n\n勝利的樣貌各種各樣。聖荷西州大在對攻中以42比26落敗，佛雷斯諾州大吞下39比0完封，路易斯安那大學在Maiava的五達陣之夜以49比30遭擊潰——非聯盟賽程完美橫掃，讓南加大在德州登上第一名的混亂級週末過後，於美聯社TOP 25榜單上升兩名至第十二。特洛伊人在前兩戰的上半場合計以58比0碾壓對手，總碼數以1057對452輾壓群雄。\n\n這樣的數據必然引來提醒，而且提醒千真萬確：競爭難度立刻升級。面對不擺40碼後退防守、安全衛會真正上前挑戰橫向路徑的大十聯盟二線，Maiava的完成率必然下修。但他底層的能力——在結構中快速決策、能把球塞往縱深的手臂、以及照節奏打球的冷靜——正是可以轉移的優質四分衛特質。南加大第十二名的排名，反映的是他已經完成的事；大十聯盟的賽程，才會揭曉他真正的成色。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "First road test: cross-country trip, KJ Duff matchup and the 24-point spread", "headline_zh": "首次客場考驗：跨岸遠征、KJ Duff對位與二十四分讓分", "analysis": "Every clue says this should be a formality — and every veteran of college football games on the road knows that's precisely when the sport bites. USC leaves Thursday, a day early, to mitigate the cross-continental trip to Piscataway. Rutgers is 0-2, ranks last in FBS with a -5 turnover margin, sits 132nd in red-zone offense and 94th in time of possession. The Trojans are 24-point road favorites and No. 5 nationally in time of possession at 36:27. On paper this is a mismatch in every phase.\n\nBut the tape tells a subtler story. USC's defense surrendered 358 yards to Louisiana, and Riley spent the week preaching \"raising the floor\" — a coach's admission that the margin for sloppiness is about to shrink. Rutgers, winless or not, employs a genuine passing weapon in receiver KJ Duff, whose 333 receiving yards rank second nationally and who has five touchdown catches to his name. USC's secondary, still a work in progress, is about to be tested by a contested-catch specialist who can beat man coverage downfield.\n\nThe analysts' read here is straightforward: the spread is about process, not just talent. USC has been elite on early downs, converts 69.4 percent of third downs (third nationally), and plays with the kind of lead-safety that makes comebacks improbable. But if USC lets Rutgers hang around into the second half — if the offense stalls once without Mosley, or the defense gives up explosive plays — a road upset becomes alive in a way a 24-point spread cannot capture. This game is jiu-jitsu for what comes next.", "analysis_zh": "每一項線索都說這該是一場例行公事——而每一位征戰客場的老手都知道，大學橄欖球正是在這種時刻咬人。南加大提前於週四、而非週五出發，以緩解飛往皮斯卡塔韋的跨洲旅程。羅格斯大學戰績○勝二敗，以負五的失誤差排名全FBS墊底，紅區進攻排第一百三十二名、持球時間第九十四名。特洛伊人是24分的客場讓分方，持球時間以36分27秒排名全美第五。紙面上，這是每個環節都懸殊的對戰。\n\n但比賽錄影帶訴說更細膩的故事。南加大的防守對路易斯安那大學失了358碼，Riley整週都在宣揚「拉高下限」——這是主教練承認，接下來容許散漫的空間即將縮小。羅格斯大學縱然一勝難求，卻擁有一位貨真價實的接球武器：外接手KJ Duff，他的333接球碼排名全美第二，並已有五次接球達陣。南加大仍在磨合的二線，即將接受一位能在縱深對位單挑人盯人、擅長對抗接球的高手的考驗。\n\n分析師的解讀很直接：這個讓分反映的是流程，而不只是天賦。南加大在早檔攻勢上表現頂級，三檔轉換率69.4%高居全美第三，並以領先者特有的安全打法讓逆轉難以成真。但如果南加大讓羅格斯大學撐進下半場——如果進攻因少了Mosley而卡關一次，或防守放出爆炸性長傳——那麼一場客場爆冷，就會以24分讓分捕捉不到的方式突然活過來。這一戰，正是為後續賽程所做的柔術預演。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "The gauntlet behind Rutgers: Oregon, Penn State loom without Mosley", "headline_zh": "羅格斯之後的考驗：少了Mosley，奧勒岡與賓州州大虎視眈眈", "analysis": "Win or lose Saturday, the Rutgers trip matters because of what comes next — and the next month of USC's schedule is a minefield. Home games against No. 21 Oregon (Sept. 26) and Washington (Oct. 3) are followed by No. 14 Penn State (Oct. 10), then No. 6 Ohio State (Oct. 31) and No. 4 Indiana (Nov. 14). Five of the next eight games are against teams ranked in or near the national top 15. This is how Big Ten membership metes out its punishment.\n\nTrent Mosley's designation as expected to miss multiple games lands exactly in that window. Oregon, Washington and Penn State are precisely the opponents where a vertical threat like Mosley is worth his weight — the kind of receiver who turns a contested look into a catch and a punt into six points. The defensive game plans those teams run are built to stop scheme and force one-on-one plays; USC loses its most reliable answer to that challenge for precisely the stretch that defines its season.\n\nThere's an unglamorous counterargument, and it matters: this is also why depth was the identity USC's No. 1-ranked recruiting class promised. Dixon-Wyatt and Bowman lead the freshman wave, with King Miller anchoring the run game after rumbling for 128 yards and a score on 18 carries against Louisiana. If the reserves absorb the target share without the drop-off, this stretch becomes the story of a program arriving early. If they don't, the College Football Playoff math gets brutal fast — because the schedule offers no mercy.", "analysis_zh": "無論週六勝負如何，羅格斯之戰之所以重要，是因為接下來的路程——而南加大未來一個月的賽程是一整片雷區。9月26日主場對第二十一名奧勒岡、10月3日出戰華盛頓之後，緊接10月10日對第十四名賓州州大，然後是10月31日對第六名俄亥俄州大、11月14日對第四名印第安納。未來八戰中有五場是對上躋身或接近全美前十五名的球隊。這就是加入大十聯盟所必須承受的懲罰。\n\nTrent Mosley被預期缺陣數場的診斷，恰巧落在這段窗口。奧勒岡、華盛頓與賓州州大，正是Mosley這種縱深威脅價值連城的對手——那種能把五五波變成接球、把棄踢變成六分的接球員。那些球隊的防守戰術向來設計來封鎖體系、逼迫一對一單打；南加大卻偏偏在最定義球季的這段賽程中，失去面對此類挑戰最可靠的答案。\n\n這裡有個不華麗、卻很重要的反方論點：這也正是全美第一招生班級所承諾的陣容深度。Dixon-Wyatt與Bowman領銜新生浪潮，King Miller以對路易斯安那18次持球、128碼、一達陣的表現穩固跑陣攻勢。如果替補群能不降級地承接接球份額，這段賽程將成為一檔王朝提前誕生的故事；如果做不到，大學美足季後賽的數學很快就會變得殘酷——因為賽程表上找不到任何憐憫。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "Defense still a question: Riley stresses 'raising the floor' before Big Ten play", "headline_zh": "防守仍是問號：Riley在聯盟賽開打前強調「拉高下限」", "analysis": "USC's biggest internal debate this week is not about Jayden Maiava's arm — it's about the defense underneath it. Riley spent his public comments dwelling on the 358 yards surrendered to Louisiana and the repeated refrain of \"raising the floor,\" a phrase heavy with meaning from a coach whose teams have lived and died by shootouts. The nonconference season exposed two truths: the offense is championship-grade, and the defense is not yet playing like one.\n\nThe tape backs him up. The second half against Louisiana tightened control, but the early leak of yardage — particularly in the middle of the field and on check-downs — is exactly the kind of disease that spreads against Oregon's twitchy playmakers. USC's first-half dominance has masked defensive lapses because the games were over by halftime. In Big Ten play, leads become smaller and quarterbacks better; a defense that needs a fifty-point cushion is a defense that falls apart in a 24-17 game.\n\nHere's the encouraging read: the unit has improved steadily across three games, both young and deep, and the schedule's best offenses (Oregon, Ohio State, Indiana) come later, giving it time to find an identity. The Rutgers game is a genuine opportunity — the Scarlet Knights' offense ranks 132nd in the red zone — to build the confidence and technique USC will need in the month that follows. Whether USC is a title contender or a good team with a great quarterback may well be answered not by Maiava, but by how quickly this defense raises its own floor.", "analysis_zh": "南加大本週最大的內部辯論，不是關於Jayden Maiava的手臂——而是他身後的防守。Riley在公開談話中反覆強調對路易斯安那大學被失358碼這回事，以及那句重複的「拉高下限」——這句話出自一位麾下球隊向來與對攻戰共存亡的教練之口，份量格外沉重。非聯盟賽程曝露了兩個真相：進攻是冠軍等級的，而防守還不配被稱作冠軍等級。\n\n比賽錄影帶為他背書。對路易斯安那的下半場收緊了控制權，但早期失碼——尤其是中路的短傳與check-down——正是那種會在面對奧勒岡的靈動球員時蔓延開來的病灶。南加大上半場的宰制掩蓋了防守漏洞，因為比賽在半場就已結束。到了大十聯盟戰場，領先會縮小、四分衛會更強；一支需要五十分安全墊的防守，就是在24比17的比分下崩盤的防守。\n\n樂觀面在此：這支年輕而深厚的防守在過去三戰持續進步，賽程中最強的進攻群（奧勒岡、俄亥俄州大、印第安納）都在後頭，給了它時間找到自我。羅格斯之戰是貨真價實的機會——紅衣騎士的進攻在紅區排名第一百三十二——足以建立南加大往後一個月所需的信心與技術。南加大究竟是爭冠勁旅，還是「有明星四分衛的好球隊」，答案或許不取決於Maiava，而是取決於這道防守多快把自己的下限拉高。"}, {"team": "Rams", "accent": "#003594", "headline": "Donald 'hopeful' for long-awaited MNF debut at SoFi — nearly three years since last NFL game", "headline_zh": "Donald「樂觀看待」週一之夜於SoFi回歸——距離上次出賽近三年", "analysis": "Aaron Donald — 35 years old, un-retired on Aug. 30 after two seasons away, and one of the top-two defensive players of his generation — will practice in full Thursday, with coach Sean McVay saying the Rams are \"hopeful\" he suits up Monday night against the Giants at SoFi Stadium. It would be Donald's first NFL game since January 2023, a comeback nearly three and a half years in the making. McVay framed it as a feel-based decision: \"How does he feel?\"\n\nDonald did not travel for the Week 1 loss in Melbourne, so this week's ramp-up was always the first real test of whether a 35-year-old interior presence can still summon the warp-speed first step that made him a perennial Defensive Player of the Year. The full-practice Thursday milestone is significant — it suggests the ankle he tweaked in camp and the physical shock of an NFL week of contact are behind him. The Rams hedged publicly, but a full practice four days before a home Monday night game is usually the tell.\n\nThe football logic is obvious: the Rams' defense allowed 27 to Brock Purdy and never once made him uncomfortable. Donald reunites with the front that made him historic, and even a not-quite-peak Donald collapses pockets, eats double-teams and makes the blockers around him better. He signed a one-year, $20 million deal with up to $30 million in playoff incentives — a contract that says the Rams built this season around one thing. A Monday-night homecoming against a 1-0 Giants team that just rode a rookie to three touchdowns is the stage he left — and the stage they want him back on.", "analysis_zh": "Aaron Donald——現年35歲、於8月30日卸下兩年退休身分復出、是他這個世代最頂尖的防守球員之一——將於週四全程參與練球，總教練Sean McVay表示，公羊隊「樂觀看待」他週一晚上在SoFi球場對陣巨人隊時登場。這將是Donald自2023年1月以來的首場NFL比賽，一場醞釀近三年半的回歸。McVay把它定調為感覺型決定：「他的感覺如何？」\n\nDonald並未隨隊出征墨爾本那場首週敗仗，因此本週的漸進加碼，一直是檢驗一位35歲的內線防守者是否還保有那一步讓他在防守組獎項中連年稱霸的變態初速。週四全程練球這個里程碑意義重大——暗示訓練營裡扭傷的腳踝、以及一整週NFL等級對抗對身體的衝擊都已拋諸腦後。公羊隊檯面上語帶保留，但在週一主場夜賽前四天全程練球，通常就是答案。\n\n美式橄欖球的邏輯很清楚：公羊隊的防守讓Brock Purdy丟了27分，卻始終沒讓他感到不適。Donald與那套成就他傳奇的鋒線重逢，即使不是百分百的Donald，也足以崩解口袋、吞食包夾、並讓身旁的阻擋者愈顯鋒利。他的合約是一年二千萬美元、含最多三千萬美元季後賽獎金——合約的語言說得很明白：公羊隊的這個賽季，就是為了這一件事而打造。週一之夜主場迎戰一支剛靠菜鳥四分衛拿下三記達陣的勁旅，正是他離開的那個舞台——而這也正是他們想迎他回歸的舞台。"}, {"team": "Rams", "accent": "#003594", "headline": "Myles Garrett to IR: 'Wolverine-like' recovery but no return timeline", "headline_zh": "Myles Garrett進入傷兵名單：「金鋼狼式」恢復但未訂歸期", "analysis": "The other half of the Rams' two-headed pass-rush monster is gone for at least a month. The club officially placed reigning Defensive Player of the Year Myles Garrett on injured reserve Thursday, ruling him out a minimum of four games — the Giants, the Broncos in Denver, the Eagles in Philadelphia, and the Bills. McVay called Garrett's recovery \"Wolverine-like — crutches yesterday, walking without crutches today\" — but refused to commit to a timeline beyond what IR demands.\n\nThe juxtaposition is brutal and almost cinematic. Garrett lands on IR the same day Donald approaches full practice, trading one dominant pass-rusher for another in the span of a news cycle. For a team that invested so much to pair the two, the first month of the season will now judge whether the Donald-adjacent rotation — Kobie Turner, Bobby Brown, the depth around them — can hold up as edge pressure turns into interior chaos.\n\nAnalytically, the conservative call is correct. Garrett's knee surgery already cost him opening week; rushing him back for a winnable division-adjacent stretch would jeopardize the very games in November and December — Seattle twice, Arizona twice, the season's NFC West meat — where the Rams' fortunes are decided. The four-game minimum is a floor, not a ceiling. If the \"Wolverine\" recovery is real, the second half of the schedule gets a fully recharged DPOY while Aaron Donald's return stabilizes the front today. The Rams are buying time now to cash it later.", "analysis_zh": "公羊隊雙頭衝傳怪物的另一半，至少將缺陣一個月。球團週四正式將衛冕年度最佳防守球員Myles Garrett放入傷兵名單，裁定他至少缺陣四場——巨人、丹佛客場對野馬、費城客場對老鷹，以及對水牛城比爾。McVay形容Garrett的恢復「金鋼狼式——昨天還拄著拐杖，今天就丟掉拐杖走路」——但他拒絕承諾傷兵名單規定期限之外的時程。\n\n這種並置殘酷得近乎戲劇化。Garrett登上傷兵名單的同一天，Donald逼近全程練球，一個新聞循環之內，失去一位宰制級衝傳手、迎回另一位。對一支投入如此多資源讓兩人合體卻換來一內一外的陣營而言，球季第一個月考驗的，將是Donald周邊的輪替——Kobie Turner、Bobby Brown與他們身旁的深度——能否在壓力從外緣轉向內線爆炸的過程中撐住戰線。\n\n以分析眼光看，保守的決策是正確的。Garrett的膝蓋手術已經讓他錯過開季首週；為了一場可勝的聯賽前段賽事急著催他回歸，反而會危及真正決定公羊隊命運的十一月與十二月——對西雅圖兩戰、對亞利桑那兩戰、那些國聯西區的肉搏戰。四場是最低標，不是天花板。如果「金鋼狼」式的恢復屬實，下半季賽程將迎回一位電力滿格的DPOY，而今天Aaron Donald的回歸已先行穩住鋒線。公羊隊此刻正在囤積時間，為日後兌現。"}, {"team": "Rams", "accent": "#003594", "headline": "Rams seek rebound vs. surging Giants after 27-7 Australia flop", "headline_zh": "澳洲二十七比七慘敗之後，公羊力圖迎戰勁敵巨人隊翻身", "analysis": "The Rams' 2026 season opened with the franchise's most public failure in years: a 27-7 dismantling by the 49ers in front of 100,021 fans at the Melbourne Cricket Ground — the largest crowd ever for an NFL game outside North America. Brock Purdy threw three touchdowns, Matthew Stafford looked nothing like his MVP self at 15-of-25 for 155 yards and an interception, and Los Angeles suffered its largest defeat since November 2024. Kyren Williams scored the NFL's first-ever touchdown in Australia, a footnote on an otherwise forgettable flight home.\n\nMonday night at SoFi is an immediate, high-stakes corrective. Waiting is a 1-0 Giants team galvanized by rookie quarterback Jaxson Dart, who threw three touchdowns past Dallas in his debut. The Rams are installed as 7-point favorites, which the market is reading correctly — New York is still a rebuilding outfit — but the arrow of momentum points the wrong way for a club trying to remember who it is. Stafford, Puka Nacua and an offensive line that got pushed around in Melbourne must answer the simplest question in sports: are you who you thought you were?\n\nThere is a deeper structural concern here worth flagging. Stafford's four-game divisional run against the 49ers (eight touchdowns, zero picks) was the stat that defined 2024-25 — and it was shattered in Week 1. The MVP, now a year older, struggled with his internal clock against a front that never blitzed. If that version of Stafford reappears opposite a Giants defense that just limited Dak Prescott to 175 yards, Donald's return will be a sideshow to an 0-2 spiral. The Rams' season does not end Monday; it does, however, get defined by it.", "analysis_zh": "公羊隊的2026年球季，以這支球團多年來最公開的挫敗開場：在墨爾本板球場十萬零二十一名球迷面前(北美以外NFL史上最大觀眾人數)，以27比7遭四九人拆解。Brock Purdy投出三記達陣，Matthew Stafford完全不像那個MVP——25傳15中、155碼、一次被抄截——洛杉磯吞下2024年11月以來最慘烈的一敗。Kyren Williams在NFL史上第一記於澳洲完成的達陣，成了這趟毫無亮點返程航班上唯一的註腳。\n\n週一晚上在SoFi，是立即且高風險的矯正。等待在前的是靠菜鳥四分衛Jaxson Dart振奮軍心的勁旅巨人隊，Dart在生涯初登場中對牛仔投出三記達陣。公羊隊被開出7分讓分，市場的判讀是正確的——紐約仍是支重整中的隊伍——但動能之箭正指向錯誤的方向，而這是一支試圖想起自己是誰的球隊。Stafford、Puka Nacua，以及一套在墨爾本被推來撞去的進攻鋒線，必須回答運動世界最簡單的問題：你們，還是你們以為的那支球隊嗎？\n\n這裡有一個值得指出的深層結構隱憂。Stafford對四九人的跨季四戰數據（八達陣、零失誤）是定義2024─25的數字——而它在第一週就被粉碎。年紀又長一歲的MVP，面對一支始終不突襲的鋒線時，內在節奏與出手時機犯了難。如果那個版本的Stafford對上剛把Dak Prescott壓制到175碼的巨人防守再次現身，Donald的回歸，將淪為一場0勝二負螺旋的場邊花絮。公羊隊的球季不會在週一結束；但它，確實會由週一一戰定義。"}, {"team": "Rams", "accent": "#003594", "headline": "Injury watch: Kinchens, secondary thin as Giants bring a healthy passing attack", "headline_zh": "傷兵觀察：Kinchens與後場深度告急，巨人隊挾完整傳球攻勢來襲", "analysis": "The Rams' defensive backfield entered Monday night undermanned before the first pitch of preparation week. Kam Kinchens missed Thursday's practice with the hamstring he injured against the 49ers, while Kam Curl (ankle), Omar Speights (hip) and Nate Landman (shoulder) were all limited. The lone bright spot from McVay: Speights is \"feeling better than we anticipated.\" Davante Adams took a veteran rest day but is expected to be fine for kickoff.\n\nThe timing could not be worse. The Giants' passing game is not the Cowboy-slaying mirage it might seem — Jaxson Dart's debut produced three touchdowns and the sort of easy-window throws that a tattered secondary hands out for free. Match that against a Rams secondary that was already carved up for 358 yards in Melbourne (pun intended) and you have the exact recipe for a long Monday night: a rookie quarterback imaging himself into an MVP race because receivers keep running open.\n\nThere's a discipline element underneath the injuries. What melted down in Melbourne wasn't just personnel — it was communication, spacing and eyes in the wrong places. Kinchens' absence would thin a safety room already adjusting to life without rotation; if Speights' hip loosens and Landman's shoulder holds, the second level buys the backend extra time. Donald's interior gravity also changes the calculus for Dart's decision-making. The secondary's job Monday is not to be All-Pro; it's to be sound. Against a rookie, sound is usually enough.", "analysis_zh": "公羊隊的防守後衛群，在備戰週第一聲哨響之前就已兵力不足地迎接週一之夜。Kam Kinchens因對四九人傷及的腿後肌缺席週四練球，Kam Curl（腳踝）、Omar Speights（臀部）與Nate Landman（肩膀）則都只能限縮參與。McVay口中唯一的亮點：Speights「比我們預期的更舒服」。Davante Adams進行了老將休整日，預期開球時無礙。\n\n時機糟得不能再糟。巨人隊的傳球攻勢，並非它表面上看來那支「屠牛」幻象——Jaxson Dart的初登場三達陣、加上那種殘破後場免費贈送的空檔投擲，成就了它。再對照一套已在墨爾本失掉358碼的公羊後場，你就得到了週一夜漫長比賽的完美配方：一位菜鳥四分衛，因為接球員不斷跑出空檔，而開始想像自己在競逐MVP。\n\n傷病之下還有一層紀律因素。墨爾本的崩盤不只是人手問題——而是溝通、站位與眼神全放錯了地方。Kinchens若缺陣，將使一個正在適應沒有輪替的老將安全衛房更見單薄；如果Speights的臀部用得開、Landman的肩膀撐得住，第二層防線就能替後場爭取時間。Donald的內線引力，也將改變Dart決策時的算計。週一後場的工作不是要當全明星；而是要穩。面對菜鳥，穩，通常就夠了。"}, {"team": "Rams", "accent": "#003594", "headline": "McVay on Melbourne: 'We're not playing in Australia ever again, I hope'", "headline_zh": "McVay談墨爾本之旅：「希望再也不去澳洲比賽」", "analysis": "If there was any lingering question about how Sean McVay felt about the Melbourne experiment, he answered it this week with characteristic candor: \"We're not playing in Australia ever again, I hope.\" He praised the MCG's \"great atmosphere\" — and the 100,021 fans made it a spectacle — but the verdict on the football side of the globe's longest road trip was unambiguous. The trip cost the Rams a week of preparation rhythm, travel that taxes legs, and a home-field environment entirely stripped of momentum.\n\nThe tension, as always with the NFL, is money and market. Australia sits inside the Rams' international marketing territory, which means McVay's vote may not carry the room no matter how forcefully it's delivered. The league's overseas expansion has no brakes; the Rams were the body chosen to test the furthest frontier the NFL has ever played. The head coach wants nothing to do with round two; the league office's spreadsheet has already moved on to where round three happens.\n\nFor the fans, the calculus is simpler. McVay framing a 100,000-person epicenter of football passion as an experience he hopes never to repeat says everything about how the Rams experienced it — as a competitive disadvantage disguised as a vacation. The honest reading is that McVay is not protesting the idea of international football; he's protesting the cost borne by his players in a sport where recovery days are the whole war. Tuesday's practice will tell you if that objection translates into performance. Australia may be gone, but its jet lag is coming to SoFi on Monday night.", "analysis_zh": "如果世人對Sean McVay如何看待墨爾本實驗還有任何疑問，他本週用自己的招牌坦率回答了：「希望我們再也不去澳洲比賽。」他稱讚了MCG「偉大的氛圍」——十萬零二十一名球迷讓它堪稱奇觀——但對這趟地球上最長客場之旅的橄欖球面評價，卻毫不含糊。這趟旅程耗損了公羊隊一週的備戰節奏、榨乾了雙腿的旅程疲勞，以及一座完全被掏走動能的主場環境。\n\n一如NFL的常態，張力來自金錢與市場。澳洲位於公羊隊的國際行銷區域之內，這意味著無論McVay的發言多麼有力，他的那一票未必能左右會議。聯盟的海外擴張沒有煞車；公羊隊成了被選中去測試NFL史上最遠邊疆的白老鼠。總教練對第二回合敬謝不敏；聯盟辦公室的試算表，卻已經開始盤算第三回合的地點。\n\n對球迷而言，算盤更簡單。McVay把十萬人的橄欖球熱情震央形容為他此生不願重演的經驗，這本身就說明了一切——公羊隊把它體驗為一場偽裝成渡假的行動劣勢。誠實的解讀是：McVay抗議的不是國際橄欖球的理念，而是他的球員在一項「恢復日即是整場戰爭」的運動中所承擔的代價。週二的練球會告訴你，這份反對能否轉化為場上表現。澳洲也許已經遠去，但它的時差，週一晚上會在SoFi降肉。"}], "closing": "All three LA teams are staring down defining weekends. The Dodgers can rest inside a division they've owned for half a decade, but the real season — built on a healthy rotation and a revived Kyle Tucker — starts in October. USC's first road game and first Big Ten test arrives at the worst possible moment for a depleted receiving corps. And the Rams, humbled on the biggest regular-season stage in league history, get a redemption shot at home with one of the greatest defensive players ever poised to walk onto the SoFi turf. Enjoy the weekend; LA always does.", "closing_zh": "洛杉磯三支球隊正面對定義本季的關鍵週末。道奇隊在半個世代一手掌握的分區內可以安穩度日，但真正的賽季——那建立在健康輪值與重生的Kyle Tucker之上——十月才正式開始。南加大迎來首次客場、也是首次大十聯盟試煉，時機卻正好碰上射手群傷兵告急。而公羊隊在史上最盛大的例行賽舞台上受挫之後，回到主場尋求救贖，史上最偉大的防守球員之一正準備踏上SoFi的草皮。好好享受週末吧；洛杉磯，從來不甘寂寞。"};
let lang = "en";
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmtPT(iso){ return new Date(iso).toLocaleString("en-US",{timeZone:"America/Los_Angeles",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"})+" PT"; }

function renderDigest(d){
  const box = document.getElementById("digest");
  if(!d || !d.segments){
    box.innerHTML = '<div style="text-align:center;color:var(--dim);padding:40px">No digest yet</div>';
    return;
  }
  const segs = d.segments.map(s=>{
    const headline = lang==="en" ? s.headline : s.headline_zh;
    const analysis = lang==="en" ? s.analysis : s.analysis_zh;
    return '<div class="seg" style="--team:'+esc(s.accent)+'">' +
      '<div class="row"><span class="hn">'+esc(headline)+'</span><span class="badge">'+esc(s.team)+'</span></div>' +
      '<div class="lbl">'+(lang==="en"?"Analysis":"分析")+'</div><p>'+esc(analysis)+'</p>' +
      '</div>';
  }).join("");
  box.innerHTML =
    '<div class="dhead">' +
      '<div class="t"><div class="mic">🎙️</div><div><h2>'+esc(d.title)+'</h2><div class="meta">' +
        esc(d.read_time || "")+' · '+fmtPT(d.updated_at)+
        ' · 繁中/EN</div></div></div>' +
      '<div class="langs">'+
        '<button id="btnEn" class="on" onclick="setLang(\'en\')">EN</button>'+
        '<button id="btnZh" onclick="setLang(\'zh\')">繁體中文</button>'+
      '</div>' +
    '</div>' +
    '<div class="intro">'+esc(lang==="en"?d.intro:d.intro_zh)+'</div>' +
    '<div class="segs">'+segs+'</div>' +
    '<div class="closing">'+esc(lang==="en"?d.closing:d.closing_zh)+'</div>';
}
function setLang(v){ lang = v; document.getElementById("btnEn").classList.toggle("on", v==="en"); document.getElementById("btnZh").classList.toggle("on", v==="zh"); renderDigest(DIGEST_DATA); }

function renderNews(d){ const upd = document.getElementById("upd"); if(upd) upd.textContent = fmtPT(d.updated_at);
  const g = document.getElementById("grid"); g.innerHTML = "";
  for(const t of d.teams){
    const c = document.createElement("div"); c.className = "card"; c.style.setProperty("--team", t.accent);
    const emoji = t.emoji==="Baseball"?"⚾":t.emoji==="Football"?"🏈":"🏆";
    c.innerHTML =
      '<div class="top"><div class="ico">' + emoji + '</div>' +
      '<div><div class="name">' + esc(t.name) + '</div><div class="rec">' + t.sport + ' · ' + esc(t.record) + '</div></div></div>' +
      '<div class="hline">' + esc(t.headline) + '</div>' +
      '<h3>Latest News</h3><ul class="news">' + t.latest_news.map(n =>
        '<li><a target="_blank" rel="noopener" href="' + esc(n.url) + '">' + esc(n.title) + '</a><p>' + esc(n.summary) + '</p></li>'
      ).join("") + '</ul>' +
      '<h3>Fun Facts</h3><ul class="facts">' + t.fun_facts.map(f => '<li>'+esc(f)+'</li>').join("") + '</ul>' +
      '<h3>Further Reading</h3><ul class="read">' + t.further_reading.map(f =>
        '<li><a target="_blank" rel="noopener" href="' + esc(f.url) + '"><span>'+esc(f.title)+'</span><span class="why">'+esc(f.why)+'</span></a></li>'
      ).join("") + '</ul>' +
      '<div class="oss">' + esc(t.one_sentence) + '</div>';
    g.appendChild(c);
  }
}

renderDigest(DIGEST_DATA);
renderNews(TEAMS_DATA);
</script>
