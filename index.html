<style>
  :root{
    --bg:#0b0e14; --panel:rgba(255,255,255,.04); --panel2:rgba(255,255,255,.02);
    --line:rgba(255,255,255,.08); --fg:#edf2fa; --dim:#8a94a6;
    --radius:18px; --glow:0 0 0 1px rgba(255,255,255,.04), 0 24px 60px -30px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 500px at 20% -10%, rgba(42,111,216,.18), transparent 60%),
      radial-gradient(1000px 500px at 90% -10%, rgba(153,0,0,.14), transparent 60%),
      radial-gradient(900px 400px at 50% 110%, rgba(31,78,156,.16), transparent 60%),
      var(--bg);
    color:var(--fg); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
    padding:28px clamp(16px,4vw,64px) 64px;
  }
  header{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:26px}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{
    width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;
    background:linear-gradient(135deg,#2a6fd8,#991111);box-shadow:0 8px 30px -8px rgba(60,90,220,.6);
  }
  h1{font-size:clamp(22px,3vw,32px);font-weight:800;letter-spacing:-.02em}
  .sub{color:var(--dim);font-size:13px;margin-top:4px}
  .ticker{
    font-size:12px;color:var(--dim);padding:8px 14px;border-radius:99px;
    background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);
  }
  .ticker b{color:#7ce38b}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:20px}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;backdrop-filter:blur(14px);box-shadow:var(--glow);position:relative;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--team,#2a6fd8),transparent);
  }
  .top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .ico{
    width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;
    background:color-mix(in srgb,var(--team) 22%, transparent);
  }
  .name{font-size:18px;font-weight:800;letter-spacing:-.01em}
  .rec{font-size:11px;color:var(--team);font-weight:700;margin-top:2px}
  .hline{font-size:13px;line-height:1.5;color:var(--dim);padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);margin-bottom:16px}
  h3{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
  h3::after{content:"";flex:1;height:1px;background:var(--line)}
  .news{list-style:none}
  .news li{padding:10px 12px;border-radius:12px;margin-bottom:6px;background:var(--panel2);border:1px solid var(--line);transition:.2s}
  .news li:hover{border-color:color-mix(in srgb,var(--team) 50%, transparent);transform:translateX(3px)}
  .news a{color:var(--fg);text-decoration:none;font-weight:700;font-size:13px;display:block;margin-bottom:4px}
  .news a:hover{color:var(--team)}
  .news p{font-size:12px;color:var(--dim);line-height:1.5}
  .facts{list-style:none;display:grid;gap:6px}
  .facts li{position:relative;padding:2px 0 2px 18px;font-size:12.5px;color:var(--fg);line-height:1.55}
  .facts li::before{content:"⚡";position:absolute;left:0;top:2px;font-size:11px;filter:grayscale(.4)}
  .read{list-style:none;display:grid;gap:6px}
  .read a{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12.5px;color:var(--fg);text-decoration:none;padding:9px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
  .read a:hover{color:var(--team);border-color:color-mix(in srgb,var(--team) 50%, transparent)}
  .read .why{font-size:11px;color:var(--dim)}
  .oss{font-size:12.5px;line-height:1.6;color:var(--fg);background:linear-gradient(90deg,color-mix(in srgb,var(--team) 18%,transparent),transparent);border-left:3px solid var(--team);padding:10px 14px;border-radius:0 12px 12px 0;margin-top:16px}
  banner{display:block;text-align:center;color:var(--dim);font-size:13px;margin-top:22px}
  banner span{color:#7ce38b;animation:blink 1.5s infinite}
  @keyframes blink{50%{opacity:.3}}
  .spin{width:100%;height:100px;display:grid;place-items:center;color:var(--dim)}
  /* ---- digest ---- */
  .digest{
    background:linear-gradient(135deg,rgba(42,111,216,.12),rgba(153,0,0,.10),rgba(31,78,156,.12)),var(--panel);
    border:1px solid var(--line);border-radius:var(--radius);padding:26px;
    backdrop-filter:blur(14px);box-shadow:var(--glow);margin-bottom:22px;
  }
  .dhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;margin-bottom:14px}
  .dhead .t{display:flex;align-items:center;gap:12px}
  .mic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:linear-gradient(135deg,#2a6fd8,#991111)}
  .dhead h2{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .dhead .meta{color:var(--dim);font-size:12px;margin-top:3px}
  .langs{display:flex;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:4px}
  .langs button{border:0;background:transparent;color:var(--dim);font-size:12px;font-weight:700;padding:6px 16px;border-radius:99px;cursor:pointer;transition:.2s}
  .langs button.on{background:linear-gradient(135deg,#2a6fd8,#1f4e9c);color:#fff}
  .intro{font-size:14px;line-height:1.65;color:var(--fg);max-width:820px;margin-bottom:18px}
  .segs{display:grid;gap:12px}
  .seg{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--panel2)}
  .seg .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .seg .row .hn{font-weight:800;font-size:14.5px}
  .seg .badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--team,#2a6fd8) 20%,transparent);color:var(--team);white-space:nowrap}
  .seg p{font-size:12.5px;line-height:1.6;color:var(--dim);margin-top:6px}
  .seg p.cls{color:var(--fg)}
  .seg .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin-top:10px;font-weight:700}
  .closing{font-size:14px;line-height:1.6;border-top:1px dashed var(--line);margin-top:16px;padding-top:14px;color:var(--fg)}
</style>
</head>

<script>
const TEAMS_DATA = {"updated_at": "2026-09-13T13:06:25.412875+00:00", "teams": [{"name": "Dodgers", "sport": "MLB", "emoji": "Baseball", "accent": "#2A6FD8", "record": "90-58", "headline": "Ohtani goes on IL, No. 6 prospect Josue De Paula debuts in Miami", "latest_news": [{"title": "Dodgers place Shohei Ohtani on IL with biceps/knee issues; Josue De Paula debuts", "summary": "Ohtani (right biceps inflammation, lingering left knee soreness) was placed on the 15-day IL, backdated to Sept. 8, and won't pitch again in 2026. The Dodgers selected the contract of MLB Pipeline's No. 6 overall prospect Josue De Paula, 21, who jumped from Double-A Tulsa — the first Dodger position player called up directly from Double-A since 2014. De Paula can return as a hitter no earlier than Sept. 23.", "url": "https://www.mlb.com/press-release/dodgers-select-josue-de-paula"}, {"title": "Tucker's grand slam sparks 8th straight win, then streak snapped in Miami", "summary": "Kyle Tucker went 3-for-3 with five RBI, including his sixth career grand slam, in a 6-2 win Friday that extended the Dodgers' season-best streak to eight. But Saturday, Tyler Glasnow allowed four runs in 4+ innings in his worst start of the season and the club fell 4-3, postponing postseason clinching scenarios.", "url": "https://www.thesportingtribune.com/2026/09/12/glasnow-struggles-as-dodgers-fall-to-marlins"}, {"title": "Dodgers' September reinforcements: Smith, Rushing, Wrobleski, Treinen all activated", "summary": "With rosters expanding to 28, the Dodgers activated catchers Will Smith (neck) and Dalton Rushing (elbow), lefty Justin Wrobleski and — a day later — reliever Blake Treinen off the 60-day IL. Alex Freeland was recalled, Alek Thomas was optioned, and catcher Ben Rortvedt was designated for assignment.", "url": "https://www.mlb.com/press-release/dodgers-add-will-smith-dalton-rushing-alex-freeland-and-justin-wrobleski"}, {"title": "Storylines ahead of October: Ohtani's rehab, De Paula's role, Freeman's knee", "summary": "De Paula is expected to get the lion's share of DH at-bats while Ohtani is out, with some corner-outfield reps as the club weighs his postseason role. Freddie Freeman (right knee soreness) sat and went 3-for-22 in September, and the Dodgers considered extra rest to keep him fresh for the playoffs. He could return this weekend at Miami.", "url": "https://www.mlb.com/dodgers/news/dodgers-storylines-ahead-of-postseason-with-shohei-ohtani-josue-de-paula-freddie-freeman"}, {"title": "Roki Sasaki could be activated during Marlins series", "summary": "The Dodgers are weighing when to activate Roki Sasaki off the injured list, with Emmet Sheehan in line for bulk innings in Sunday's series finale at loanDepot Park. Justin Wrobleski was also a candidate as an opener, and lefty Eric Lauer was moved to the 60-day IL with elbow inflammation.", "url": "https://www.truebluela.com/los-angeles-dodgers-schedule/124132/sunday-september-13"}, {"title": "Tarik Skubal, deadline prize, anchors rotation around full-strength core", "summary": "Skubal (2.79 ERA with Detroit before the Aug. 3 trade) slots into a near-full-strength rotation with Yoshinobu Yamamoto, Tyler Glasnow, Blake Snell and Sasaki. A 14-1 rout of the Reds behind Yamamoto (10 K in 7 IP) and a three-game sweep pushed the Dodgers within reach of another division crown.", "url": "https://www.latimes.com/sports/dodgers/story/2026-08-03/dodgers-acquire-ben-rortvedt-mets-in-trade-deadline-deal"}], "fun_facts": ["Josue De Paula is the first Dodger position player to jump straight from Double-A to the Majors since Erisbel Arruebarrena in 2014 — he slashed .303/.401/.547 with 27 HR and 104 RBI in 124 games for Tulsa.", "The Dodgers are chasing a third straight World Series title (2024, 2025), having clinched 12 NL West crowns in the previous 13 seasons.", "Kyle Tucker's sixth career grand slam on Friday gave him five RBI in a game for the first time as a Dodger.", "Shohei Ohtani will not pitch again in 2026; hitting return is targeted for late September with the postseason opener on the horizon.", "Blake Treinen and Will Smith returning off the injured list give the scuffling bullpen and lineup two proven postseason staples back for the stretch run."], "further_reading": [{"title": "Dodgers calling up top prospect Josue De Paula with Ohtani out", "why": "Full background on MLB's No. 6 overall prospect, his Double-A numbers and how Roberts plans to deploy him at DH.", "url": "https://www.mlb.com/news/josue-de-paula-top-prospect-called-up-dodgers"}, {"title": "Latest Dodgers injuries & transactions tracker", "why": "The official, continuously updated log of every Dodgers injury status and roster move through the season's final weeks.", "url": "https://www.mlb.com/news/dodgers-injuries-and-roster-moves"}, {"title": "Kyle Tucker hits grand slam, Dodgers nearing postseason berth", "why": "How an unlocked swing has Tucker turning around a rough first season in L.A. with the playoffs approaching.", "url": "https://www.mlb.com/dodgers/news/kyle-tucker-hits-grand-slam-dodgers-nearing-postseason-berth-clinch"}, {"title": "Glasnow struggles as Dodgers fall to Marlins", "why": "Recap and context on Glasnow's two rough September starts and what it means for a rotation that had looked full-strength.", "url": "https://www.thesportingtribune.com/2026/09/12/glasnow-struggles-as-dodgers-fall-to-marlins"}, {"title": "Dodgers' trade deadline: Skubal, Rortvedt, Feduccia, Bubic", "why": "How the club built its October roster at the deadline, headlined by two-time Cy Young winner Tarik Skubal.", "url": "https://www.latimes.com/sports/dodgers/story/2026-08-03/dodgers-acquire-ben-rortvedt-mets-in-trade-deadline-deal"}], "one_sentence": "The Dodgers enter the season's final weeks at 90-58 and first in the NL West, but they'll lean on prospect Josue De Paula and a reaggregated rotation while Shohei Ohtani rehabs for October."}, {"name": "USC Trojans", "sport": "College Football", "emoji": "Football", "accent": "#9E1B32", "record": "3-0, 0-0 Big Ten (No. 14)", "headline": "Jayden Maiava throws 5 TDs as No. 14 USC rolls past Louisiana 49-30 to finish nonconference play 3-0", "latest_news": [{"title": "Jayden Maiava Throws 5 TD Passes, No. 14 USC Football Beats Louisiana 49-30", "summary": "Maiava tossed a career-high five touchdown passes, two to freshman tight end Mark Bowman, and Trent Mosley added a TD catch plus an 86-yard punt return score as the Trojans went 3-0 on the season.", "url": "https://usctrojans.com/news/2026/9/12/usc-trojans-football-game-recap-associated-press-ap-louisiana-ragin-cajuns-mark-bowman-jayden-maiava-trent-mosley"}, {"title": "No. 14 USC football defeats Louisiana 49-30 in late-night matchup", "summary": "Dynamic freshmen accounted for five of USC's seven touchdowns, with Bowman, Mosley and Kayden Dixon-Wyatt all scoring before the Trojans opened up a 19-point win. USC opens Big Ten play at Rutgers on Sept. 19.", "url": "https://dailytrojan.com/2026/09/13/no-14-usc-football-defeats-louisiana-49-30-in-late-night-matchup/"}, {"title": "USC football's true freshman receivers already coming of age", "summary": "True freshmen Mark Bowman, Trent Mosley, Kayden Dixon-Wyatt and Tron Baker started from Game 1 and have infused a veteran offense. Mosley is the first USC freshman with back-to-back 100-yard receiving games since Drake London in 2019.", "url": "https://nypost.com/2026/09/09/sports/usc-freshman-receivers-showing-theyre-worthy-of-all-the-hype/"}, {"title": "No. 14 USC dominates Fresno State with efficient offense, ruthless defense in shutout", "summary": "USC pitched its first shutout since 2024 with a 39-0 win over Fresno State, sparked by Gary Patterson's aggressive defense and two safeties. Maiava went 23-of-25 for 349 yards and 3 TDs.", "url": "https://www.latimes.com/sports/usc/story/2026-09-04/usc-football-dominates-shutout-victory-fresno-state"}, {"title": "Lincoln Riley Delivers Injury Updates for USC Stars Jahkeem Stewart, Terrell Anderson", "summary": "Riley said defensive tackle Jahkeem Stewart (foot), tight end Tucker Ashcraft and safety Marquis Gallegos were trending toward playing, with transfer receiver Terrell Anderson nearing his USC debut.", "url": "https://www.si.com/college/usc/football/lincoln-riley-delivers-injury-updates-usc-trojans-jahkeem-stewart-terrell-anderson"}, {"title": "No. 14 USC Football Wraps Up Nonconference Play With Inaugural Matchup Versus Louisiana", "summary": "USC entered the Louisiana game outscoring opponents 58-0 in the first half and averaging 528.5 yards per game behind Maiava's 88.9% completion rate before charging into Big Ten play.", "url": "https://usctrojans.com/news/2026/9/7/usc-trojans-football-game-preview-notes-louisiana-ragin-cajuns-lincoln-riley-jayden-maiava-trent-mosley-big-ten-network"}], "fun_facts": ["USC signed the No. 1-rated 2026 recruiting class in the country via 247Sports, with 29 commits including 22 blue-chip prospects.", "Maiava's 92% completion rate (23-of-25) against Fresno State was the highest single-game mark by a USC quarterback with 25+ attempts since at least 1995.", "The 39-0 win over Fresno State was USC's first shutout since 2024 and the second under Lincoln Riley, with two safeties in the game.", "Through the Louisiana win Maiava threw a career-high five touchdown passes, two of them to freshman tight end Mark Bowman.", "Trent Mosley became the first USC freshman with 100-plus receiving yards in back-to-back games since Drake London in 2019."], "further_reading": [{"title": "ESPN evaluates USC's recruiting and transfer portal classes", "why": "Breakdown of how the No. 1 high school class plus portal additions like Jontez Williams, Terrell Anderson and Alex VanSumeren reshape the roster.", "url": "https://trojanswire.usatoday.com/story/sports/college/trojans/football/2026/03/10/espn-evaluates-usc-football-recruiting-transfer-portal-classes/89062802007/"}, {"title": "2026 USC Football Schedule", "why": "USC opens Big Ten play at Rutgers on Sept. 19 before hosting No. 6 Oregon on Sept. 26 and No. 1 Ohio State on Oct. 31.", "url": "https://usctrojans.com/sports/football/schedule/2026"}, {"title": "USC Trojans vs. Louisiana Ragin' Cajuns Final Preview, Prediction", "why": "Game preview noting Maiava's Heisman-type start, Mosley's emergence and the marquee matchups that will decide USC's CFP destiny.", "url": "https://www.si.com/college/usc/football/usc-trojans-louisiana-ragin-cajuns-final-preview-prediction"}, {"title": "2026 USC Trojans Football Transfer Portal Tracker", "why": "Track the full 2026 portal movement, including incoming Tucker Ashcraft, Zu'Bari Fisher and Alex VanSumeren and outgoing players.", "url": "https://cfbtrack.com/teams/30-usc/transfer-portal"}], "one_sentence": "Jayden Maiava tossed a career-high five touchdown passes and USC's freshman stars shined again as No. 14 USC finished nonconference play 3-0 with a 49-30 win over Louisiana."}, {"name": "Rams", "sport": "NFL", "emoji": "Helmet", "accent": "#003594", "record": "0-1", "headline": "After Melbourne meltdown, Rams get 10 days to reset before Giants MNF — with Aaron Donald eyeing his debut", "latest_news": [{"title": "Sean McVay calls Rams' 27-7 loss to 49ers a 'good humbling day'", "summary": "The Super Bowl favorites faceplanted in the NFL's first-ever Australia game, getting outplayed in every facet at the Melbourne Cricket Ground. 'They outplayed us in every facet. I didn't do nearly a good enough job,' McVay said. 'I always look inside-out. This is a good humbling day.' San Francisco scored on five of nine possessions; the Rams took a 7-3 lead early in the second quarter and never scored again.", "url": "https://www.nfl.com/news/sean-mcvay-calls-loss-to-49ers-a-good-humbling-day"}, {"title": "Myles Garrett acknowledges knee injury is significant after 0-tackle Rams debut", "summary": "The reigning AP Defensive Player of the Year managed five QB pressures but zero tackles, sacks or QB hits in Week 1. After the 15-hour flight home to L.A., Garrett finally admitted his knee isn't right: 'This was the worst version of myself that I've put out there, and I've got to be better.' It was only the fourth time in 135 career games he finished without a tackle.", "url": "https://www.wsls.com/sports/2026/09/11/myles-garrett-acknowledges-knee-injury-is-significant-after-0-tackle-debut-in-rams-australia-loss/"}, {"title": "Puka Nacua opens up about struggles with alcohol in pre-game Netflix interview", "summary": "In a pre-taped interview with Elle Duncan aired before the Melbourne opener, the All-Pro receiver said alcohol 'was definitely a thing for me' during a turbulent stretch tied to his rise to stardom and the birth of his son. 'I'm looking forward most to becoming a person that I think my son will be proud of,' Nacua said. 'These are the darkest times that I've had in my life.'", "url": "https://www.nbclosangeles.com/news/sports/nfl/rams-puka-nacua-alcohol-struggles-interview/3940648/"}, {"title": "Sean McVay settles on Stetson Bennett IV and Ty Simpson as 'the two A, two B' QB2-QB3 combo", "summary": "Ahead of the season, McVay framed the backup battle behind Matthew Stafford as a co-mandate: Bennett IV (QB2) and first-round pick Ty Simpson (QB3) are 'the two A, two B' — a developmental approach that keeps Stafford's 2027 successor-in-waiting learning while Bennett provides NFL-ready depth behind the reigning MVP.", "url": "https://www.therams.com/news"}, {"title": "Get what Aaron Donald is thinking? He was ruled out of Week 1 and won't travel to Australia", "summary": "McVay kept the eight-time All-Pro home as he ramps up after 2 1/2 years of retirement, saying 'he'll be ready to go sooner rather than later.' The three-time DPOY signed a one-year, up-to-$30M deal Aug. 30, and Week 2 against the Giants at SoFi is the target for a debut alongside Myles Garrett.", "url": "https://www.nfl.com/news/rams-rule-out-aaron-donald-week-1-game-49ers-australia"}, {"title": "Richard Sherman: 'Kyle Shanahan has Sean McVay's number' after 49ers' Melbourne win", "summary": "Sherman said on his podcast he never picked the Rams in Melbourne despite nearly everyone crowning them: 'I told people, I don't have the Rams winning this game because Kyle Shanahan has Sean McVay's number.' Los Angeles' seven points were its fewest in any Stafford start, and the 20-point loss was its widest since 2024.", "url": "https://nypost.com/2026/09/11/sports/richard-sherman-on-49ers-defeating-rams-kyle-shanahan-has-sean-mcvays-number/"}], "fun_facts": ["Week 1 was the first NFL regular-season game ever played in Australia, staged before a crowd of 100,021 at the Melbourne Cricket Ground — the seventh-most attended regular-season game in league history.", "Myles Garrett's 0-tackle debut marked only the fourth such game in his 135-career-game run, and he said he 'wasn't the player that I wanted to be' on the knee he has nursed since training camp.", "The Rams built their 'superteam' with a June 1 blockbuster that sent Jared Verse plus 2027 first, 2028 second and 2029 third-round picks to Cleveland for the reigning DPOY — the third time a DPOY winner has been traded the year after the award.", "Stafford's seven points tied the fewest in his Rams tenure and marked only the second start under 10 points with the club; he finished 15-for-25 for 155 yards and an interception with a passer rating near a career low.", "The Rams' travel strategy — arriving in Melbourne roughly 28 hours before kickoff while the 49ers acclimated for a week — became a national talking point after the blowout, though McVay insisted, 'I don't believe that's why we didn't play well enough.'"], "further_reading": [{"title": "Rams leaning into villain role ahead of 2026 season: 'These other teams probably hate us'", "why": "NFL.com's profile of the most complete roster in the league — MVP Stafford, DPOY Garrett, Donald's return and a fully-stocked secondary — and why the rest of the NFL enjoys seeing them stumble.", "url": "https://www.nfl.com/news/rams-leaning-into-villain-role-2026-these-other-teams-probably-hate-us"}, {"title": "Sources: Matthew Stafford lands 1-year, $55M extension", "why": "The reigning MVP's new deal through 2027 (up to $60M with incentives) plus annual guarantee triggers, and why McVay made clear 'it is Matthew's football team' despite drafting Ty Simpson at No. 13.", "url": "https://www.espn.com/nfl/story/_/id/48839342/sources-matthew-stafford-rams-reach-1-year-55m-extension"}, {"title": "NFL Network: Aaron Donald unretiring to play for Rams on one-year deal", "why": "Full breakdown of the 35-year-old's one-year, $20M (up to $30M) comeback deal, his two workouts with the club, and the loaded front he joins alongside Garrett, Kobie Turner and Byron Young.", "url": "https://www.nfl.com/news/aaron-donald-unretires-rams-2026-season"}, {"title": "Browns trade Myles Garrett to Rams for Jared Verse, first-round pick in blockbuster deal", "why": "The anatomy of the biggest defensive trade in NFL history — how the Rams went all in and shipped three picks plus provider Verse to land the league's premier edge rusher.", "url": "https://www.nfl.com/news/nfl-network-browns-trading-myles-garrett-to-rams-jared-verse"}, {"title": "Rams release official 2026 schedule", "why": "The full slate: seven primetime games, four at home, starting with the Australia opener and the Week 2 home opener vs. the Giants on Monday Night Football at SoFi on Sept. 21.", "url": "https://www.therams.com/news/rams-release-official-2026-schedule"}], "one_sentence": "The star-studded Rams stumbled in the NFL's first Australia game, losing 27-7 to the 49ers — now they have 10 days, a home Monday-night date with the Giants, and a potentially debuting Aaron Donald to prove the superteam is real."}]};
const DIGEST_DATA = {"updated_at": "2026-09-13T06:00:21-07:00", "title": "LA Sports Daily Digest — 15-Minute Edition", "read_time": "~15 minutes", "intro": "Good morning, LA. The Dodgers own the best record in baseball but just lost their most irreplaceable player — and responded by fast-tracking their brightest prospect. USC's young receivers keep turning September into a coming-out party as Big Ten play looms. And the Rams are back from Melbourne with 10 days to answer the loudest question in the NFL: was the Super Bowl superteam a mirage, or just jet-lagged? Here's everything you need in 15 minutes.", "intro_zh": "早安，洛杉磯。道奇擁有全大聯盟最佳戰績，卻剛失去他們最無可取代的球員——而他們的反應是火速拉上自家最耀眼的新星。南加大的年輕接球員持續把九月變成嶄露頭角的盛宴，Big Ten 賽程即將登場。公羊隊則已從墨爾本返航，還有十天時間回答整個 NFL 最響亮的疑問：這支超級盃超級戰隊只是幻影，還是純粹時差所累？十五分鐘，帶你掌握一切。", "segments": [{"team": "Dodgers", "accent": "#2A6FD8", "headline": "Ohtani heads to the IL — and a 21-year-old prospect takes over the biggest DH at-bats in baseball", "headline_zh": "Ohtani 進入傷兵名單——一位 21 歲新秀接下棒壇最受矚目的 DH 打席", "analysis": "This was always going to be the defining trade-off of the Shohei Ohtani era in Los Angeles: a two-way superstar who pitches like an ace and hits like an MVP, but whose body has to survive both jobs. On Saturday the bill came due. The Dodgers placed Ohtani on the 15-day injured list with right biceps inflammation and lingering soreness in his left knee, backdated to Sept. 8. The team confirmed the most disappointing part directly: he will not pitch again in 2026.", "analysis_zh": "這一直是 Ohtani 效力洛杉磯以來最核心的取捨：一位既能像王牌投手一樣投球、又能像 MVP 一樣打擊的雙刀流巨星，但他的身體必須同時撐過兩個身分。週六，時間到了。道奇因右肱二頭肌發炎及左膝持續痠痛，將 Ohtani 放入十五日傷兵名單，追溯至九月八日。球團直接證實了最令人失望的部分：他不會再於 2026 年投球。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Tucker's grand slam ignites an 8-game streak — then Glasnow twists an ankle (figuratively) on the Marlins", "headline_zh": "Tucker 的滿貫砲點燃八連勝——Glasnow 卻在邁阿密踢到鐵板", "analysis": "Friday night at loanDepot Park looked like the party the Dodgers have been planning all summer. Kyle Tucker went 3-for-3 with five RBI — including his sixth career grand slam — in a 6-2 win that extended Los Angeles' season-best winning streak to eight games. Tucker became a Dodger at the 2024 trade deadline and the first season in L.A. was a struggle, so watching him unlock the swing that made him an MVP candidate in Houston has been the quiet relief story of September.", "analysis_zh": "週五晚間在 loanDepot Park，道奇看起來正在開一場整個夏天都在籌畫的派對。Kyle Tucker 繳出三支三、五分打點——包括生涯第六支滿貫砲——率隊六比二贏球，把洛杉磯本季最長的連勝推進到八場。Tucker 在 2024 交易截止日前加盟道奇，在 LA 的第一季始終打得掙扎，因此看到他解鎖當年讓他在休士頓成為 MVP 候選人的揮棒，是九月裡最低調舒暢的故事。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Smith, Rushing, Wrobleski and Treinen return as the 28-man roster takes shape", "headline_zh": "Smith、Rushing、Wrobleski、Treinen 歸隊，二十八人名單成形", "analysis": "September expansion is when contending teams stop auditioning and start loading. The Dodgers did exactly that this week, activating catcher Will Smith (neck) and Dahlton Rushing (elbow) while adding left-hander Justin Wrobleski and, a day later, bullpen linchpin Blake Treinen off the 60-day injured list. They recalled infielder Alex Freeland, optioned Alek Thomas and designated catcher Ben Rortvedt for assignment — a transaction pile that tells you two things: the 2026 catching tandem is Smith-and-Rushing, and this front office is done carrying passengers.", "analysis_zh": "九月的擴編名單，是競爭者停止練兵、開始補強陣容的關鍵時刻。道奇本週正是如此：啟動捕手 Will Smith（頸部）與 Dalton Rushing（手肘），並在六十日傷兵名單中迎回左投 Justin Wrobleski，以及一天後歸隊的牛棚定海神針 Blake Treinen。球團還拉上內野手 Alex Freeland、下放 Alek Thomas，並將捕手 Ben Rortvedt 指定讓渡——這些異動串在一起傳達兩件事：2026 年的捕手組合就是 Smith 加上 Rushing，而這支管理階層已經不打算再帶著多餘人等上路。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "October storylines: Ohtani's rehab, De Paula's role and Freeman's troublesome knee", "headline_zh": "十月前哨戰：Ohtani 的復健、De Paula 的角色、Freeman 麻煩的膝蓋", "analysis": "Strip away the roster churn and three names define the Dodgers' October. First, Ohtani: his hitting return is targeted for late September, and the official goal line is the postseason opener. De Paula, meanwhile, is expected to receive the lion's share of DH at-bats while Ohtani sits, plus some corner-outfield reps while the club weighs his postseason role — a big stage for a 21-year-old but also a no-pressure audition, since anything he gives them is found money.", "analysis_zh": "撇開輿論熱議的陣容流動，三個名字定義了道奇的十月。首先是 Ohtani：他的打擊復出目標定在九月底，官方終點線就是季後賽開打日。與此同時，De Paula 預計在 Ohtani 缺陣期間承接絕大多數 DH 打席，外加部分角落外野機會，而球團正在評估他的季後賽定位——對一個二十一歲的年輕人來說這是巨大的舞台，但也是一場沒有壓力的試鏡，因為他所給出的每一分都是額外紅利。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Skubal anchors a near-full-strength rotation, and Sasaki looms at the back of it", "headline_zh": "Skubal 坐鎮近乎完整的先發輪值，Sasaki 伺機在後", "analysis": "Before the letdown in Miami, the rotating narrative of the Dodgers' month was a rotation finally assembled the way Dave Roberts always envisioned: Yoshinobu Yamamoto, Tyler Glasnow, Blake Snell, Tarik Skubal — and Roki Sasaki once he returns. Skubal, the Aug. 3 deadline prize who posted a 2.79 ERA with Detroit before arriving, is the anchor now. He hasn't needed to pitch like a savior because the group around him is full-strength, a fact underscored by Yamamoto striking out 10 in seven innings of a 14-1 rout of the Reds.", "analysis_zh": "在邁阿密失利之前，道奇這個月的核心敘事，是一套終於如 Dave Roberts 所願般組裝完成的先發輪值：Yoshinobu Yamamoto、Tyler Glasnow、Blake Snell、Tarik Skubal——還有復出後的 Roki Sasaki。八月三日交易截止日的最大收穫 Skubal，到隊前在底特律繳出 2.79 防禦率，如今是這套輪值的定錨。他根本不必以救世主之姿投球，因為身旁的輪值已近乎完整；Yamamoto 在七局飆十次三振、助隊十四比一血洗紅人，正是最好的證明。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "Maiava throws 5 touchdowns as No. 14 USC closes nonconference play 3-0", "headline_zh": "Maiava 五記傳球達陣，第 14 名南加大以 3 勝 0 敗結束非賽程期", "analysis": "Jayden Maiava spent the first three weeks of the season looking less like a quarterback finding his footing and more like a quarterback delivering a Heisman-class audition. Saturday's 49-30 win over Louisiana was his loudest statement yet: a career-high five touchdown passes, two of them to freshman tight end Mark Bowman, while Trent Mosley added a scoring catch plus an 86-yard punt return touchdown. The box score reads like a highlight reel, and USC's true freshman class — dynamic, explosive, already central — supplied five of the team's seven touchdowns.", "analysis_zh": "Jayden Maiava 在球季前三個星期看起來不像是一位剛站穩腳跟的四分衛，反而更像一場海斯曼等級的試鏡。週六對上 Louisiana 的四十九比三十勝仗是他迄今最響亮的一步：生涯新高的五次傳球達陣，其中兩球給大一菜鳥近端鋒 Mark Bowman，而 Trent Mosley 也貢獻一次達陣接球外加一記八十六碼的開球回攻達陣。帳面數據宛如精華片段，而南加大這批大一新生——勁爆、犀利、已成為核心——包辦了全隊七次達陣中的五次。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "The true-freshman receivers are coming of age — and Mosley is making Drake London history", "headline_zh": "大一新秀接球員成熟蛻變——Mosley 正改寫 Drake London 的歷史", "analysis": "Conventional wisdom says true freshmen are a project, not a foundation. No one told USC's receiver room that. Mark Bowman, Trent Mosley, Kayden Dixon-Wyatt and Tron Baker have started from Game 1 and infused a veteran-heavy offense with a vertical spark it lacked a year ago. Mosley is the headliner: with back-to-back 100-yard receiving games, he became the first USC freshman to do that since Drake London in 2019 — and London's sophomore season was the one that turned him into a first-round pick.", "analysis_zh": "傳統智慧認為大一菜鳥是待雕琢的璞玉，而不是可以倚賴的基石。但沒人把這句話告訴南加大的接球員群。Mark Bowman、Trent Mosley、Kayden Dixon-Wyatt 與 Tron Baker 從第一場比賽就擔任先發，為這支以資深球員為主的進攻注入去年所欠缺的縱深火花。Mosley 是其中主角：連續兩場百碼接球，成為自 2019 年 Drake London 以來第一位做到此事的南加大新生——而 London 在二年級賽季就因此躍升為首輪選秀。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "The defense that went from quiet to ruthless: a shutout, two safeties and Gary Patterson's stamp", "headline_zh": "從沉默到殘暴的防守：一場完封、兩次 safety、Gary Patterson 的印記", "analysis": "While the offense garners the headlines, the most meaningful change at USC this month has been on the other side of the ball. The 39-0 shutout of Fresno State — the program's first since 2024 and just the second under Lincoln Riley — featured Gary Patterson's aggressive, pressure-heavy scheme and not one but two safeties. Through the Louisiana game, USC had outscored opponents 58-0 in the first half, a dominance that starts with a defense that plays downhill and ends possessions early.", "analysis_zh": "當外界焦點都放在進攻時，南加大這個月最有意義的變化在防守端。以三十九比零完封 Fresno State——這是自 2024 年以來隊史首次完封，也是 Lincoln Riley 時代的第二次——比賽中看得到 Gary Patterson 那套高侵略性、重施壓的體系，還有不止一次、而是兩次 safety。打到 Louisiana 之戰，南加大上半場合計以五十八比零壓倒對手，這種宰制力始於一套向前衝擊、早早結束攻防的防守。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "Riley's injury report is trending green, and Terrell Anderson is close to his long-awaited debut", "headline_zh": "Riley 的傷兵報告逐項轉佳，Terrell Anderson 距等待已久的首秀僅一步之遙", "analysis": "Roster timing is everything in college football, and Lincoln Riley signaled Saturday that USC is getting healthier at precisely the right moment. Defensive tackle Jahkeem Stewart (foot), tight end Tucker Ashcraft and safety Marquis Gallegos are trending toward playing, while transfer receiver Terrell Anderson — the LSU-to-USC portal prize who hasn't suited up all season — is nearing his debut. The additions arrive just as the schedule turns serious, which changes the equation for a team already rolling.", "analysis_zh": "在大學美式足球，陣容時機就是一切；Lincoln Riley 在週六釋出訊號：南加大正巧在最關鍵的時刻回補戰力。防守絆鋒 Jahkeem Stewart（腳傷）、近端鋒 Tucker Ashcraft 與安全衛 Marquis Gallegos 都朝出賽方向邁進，而整個球季尚未穿比賽服的轉學外接員 Terrell Anderson——LSU 轉入南加大的門戶之星——也接近首秀。補強恰好趕在賽程轉硬之前到位，這改變了一支本就氣勢正盛的球隊的戰力算式。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "3-0 and a Heisman-like start: the gauntlet of Rutgers, Oregon and Ohio State is next", "headline_zh": "三勝零敗與彷彿海斯曼的開季：Rutgers、Oregon、Ohio State 的考驗緊接而來", "analysis": "The nonconference bookends are closed, and the numbers behind USC's 3-0 start read like a stat sheet from a Madden simulation: the Trojans averaged 528.5 yards per game, Maiava completed 88.9% of his passes, and the freshmen scored at will. Context matters, though — the opener and the Louisiana win were against Group of Five competition, and the shutout came against a respectable but flawed Fresno State. The real season begins Sept. 19 at Rutgers, followed by a home date with No. 6 Oregon on Sept. 26 and No. 1 Ohio State on Oct. 31.", "analysis_zh": "非賽程期告一段落，南加大三勝零敗背後的數字讀起來像打電動一般的數據單：單場平均推進五百二十八點五碼、Maiava 傳球成功率八成八．九、新生群得分如探囊取物。但背景值得注意——開幕戰與 Louisiana 之戰對手是Group of Five 等級，完封則來自表現不錯但仍有瑕疵的 Fresno State。真正的球季將於九月十九日在 Rutgers 展開，九月二十六日主場迎戰第 6 名的 Oregon，十月三十一日對上第 1 名的 Ohio State。"}, {"team": "Rams", "accent": "#003594", "headline": "After the Melbourne meltdown, McVay's blunt truth: 'They outplayed us in every facet'", "headline_zh": "墨爾本崩盤之後，McVay 的直白告白：「他們每個環節都壓過我們」", "analysis": "The NFL's first-ever game in Australia was supposed to be a coronation. A crowd of 100,021 at the Melbourne Cricket Ground — the seventh-largest regular-season crowd in league history — instead watched the Rams get dismantled 27-7 by the 49ers. San Francisco scored on five of nine possessions; the Rams took a 7-3 lead in the second quarter and never scored again. Sean McVay, who prides himself on honesty over spin, delivered it unsolicited: 'I didn't do nearly a good enough job. This is a good humbling day.'", "analysis_zh": "NFL 首場在澳洲舉行的例行賽本該是一場加冕典禮。墨爾本板球場湧入十萬零二十一名觀眾——聯盟例行賽史上第七多的紀錄——卻眼睜睜看著公羊以二十七比七被 49ers 拆解。舊金山九次攻勢中得分五次；公羊第二節取得七比三領先後就此絕塵。一向以坦誠代替粉飾的 Sean McVay，不待發問就吐露真言：「我做得還不夠好。這是警醒我們的一天。」"}, {"team": "Rams", "accent": "#003594", "headline": "Myles Garrett finally says it out loud: his knee isn't right", "headline_zh": "Myles Garrett 終於說出口：他的膝蓋不對勁", "analysis": "The reigning AP Defensive Player of the Year was the headline reason the Rams traded for a roster built to win it all. In Week 1, he was a shadow. Garrett generated five quarterback pressures but finished with zero tackles, zero sacks and zero QB hits — only the fourth time in 135 career games he failed to record a tackle. After the 15-hour flight home, he stopped managing expectations and leveled with everyone: 'This was the worst version of myself that I've put out there, and I've got to be better.'", "analysis_zh": "現任美聯社年度最佳防守球員，正是公羊透過交易打造奪冠陣容的頭號理由。但在第一週，他只是個影子。Garrett 製造了五次對四分衛的施壓，卻以零擒抱、零擒殺、零四分衛撞擊收場——這是他一百三十五場職業生涯中，第四次整場沒有擒抱紀錄。歷經十五小時航程返抵洛杉磯後，他不再管理外界期待，而是對所有人坦承：「這是我拿出的最糟糕版本的自己，我必須更好。」"}, {"team": "Rams", "accent": "#003594", "headline": "Aaron Donald stayed home from Australia. The Giants' MNF stage is the prize", "headline_zh": "Aaron Donald 未隨隊赴澳。與巨人隊的 MNF 舞台才是目標", "analysis": "If there was one silver lining to pull from the wreckage of Week 1, it wasn't on the field — it was who wasn't on the plane. The Rams ruled the eight-time All-Pro Aaron Donald out of the Australia game and kept him home as he ramps up after 2 1/2 years of retirement. McVay insists 'he'll be ready to go sooner rather than later,' and the target is now clear: Week 2 against the Giants on Monday Night Football at SoFi Stadium on Sept. 21, where Donald would debut alongside Garrett on the sport's most anticipated defensive front.", "analysis_zh": "若要從第一週的頹勢中尋找一線生機，那不在球場上——而在誰沒搭上那班飛機。公羊將八屆明星級 Aaron Donald 排除在澳洲戰之外，讓他在復出兩年半退休生涯的調整期裡留在家中。McVay 堅稱「他會很快做好準備」，目標如今明確：九月二十一日在 SoFi 體育場的週一夜賽對上巨人隊——屆時 Donald 將與 Garrett 並肩，組成美式足球界最受期待的防守鋒線。"}, {"team": "Rams", "accent": "#003594", "headline": "Puka Nacua's most honest interview yet: 'These are the darkest times I've had in my life'", "headline_zh": "Puka Nacua 最坦誠的一次訪談：「這是我人生最黑暗的時期」", "analysis": "The Rams returned from Melbourne carrying a loss, but the most difficult moment of the trip belonged to their star receiver, and it had nothing to do with the scoreboard. In a pre-taped interview with Elle Duncan that aired before the opener, Puka Nacua opened up about struggling with alcohol during a turbulent stretch tied to his rise to stardom and the birth of his son. 'Alcohol was definitely a thing for me,' he said. 'I'm looking forward most to becoming a person that I think my son will be proud of.'", "analysis_zh": "公羊隊帶著一場敗仗回到洛杉磯，但此行最艱難的時刻屬於他們的明星接球員，而那與比數無關。在開賽前播出的、NBC 的 Elle Duncan 預錄訪談中，Puka Nacua 坦言他在爆紅與兒子出生交織的動盪期間，一度與酒精搏鬥。「酒精對我來說確實是一個問題，」他說。「我最期待的是，成為我兒子會引以為傲的那種人。」"}, {"team": "Rams", "accent": "#003594", "headline": "Richard Sherman says the obvious: 'Kyle Shanahan has Sean McVay's number'", "headline_zh": "Richard Sherman 說破一切：「Kyle Shanahan 摸透了 Sean McVay」", "analysis": "Every whisperer in football knew the Rams would be billed as the team to beat all summer, and Richard Sherman used the free content from Melbourne to remind everyone he never bought it. 'I told people I don't have the Rams winning this game because Kyle Shanahan has Sean McVay's number,' Sherman said, and the evidence backs him: the seven points were the fewest in Matthew Stafford's Rams tenure and the 20-point margin was Los Angeles' widest loss since 2024. For a club that embraced its villain role — with MVP Stafford, DPOY Garrett and Donald back in the fold — the rest of the league enjoyed watching them stumble.", "analysis_zh": "美式足球圈的每個人都知道，公羊整個夏天都會被捧為頭號勁旅；Richard Sherman 則利用墨爾本之戰的回響提醒大家，他從未買單。「我告訴大家我不看好公羊贏這場比賽，因為 Kyle Shanahan 摸透了 Sean McVay，」Sherman 如此表示，證據也站在他這邊：七分是 Matthew Stafford 效力公羊以來的最少得分，二十分的差距則是洛杉磯自 2024 年以來最慘烈的敗仗。對一支欣然擁抱反派角色——帶著 MVP Stafford、年度最佳防守球員 Garrett 還有復出的 Donald——的球隊而言，整個聯盟都享受看他們踉蹌跌倒。"}], "closing": "That's your 15-minute pass through LA sports: the Dodgers are first in the West but suddenly asking a 21-year-old to carry the DH spot; USC is 3-0 with freshmen rewriting the record book and a Big Ten murderer's row ahead; and the Rams have ten days before Aaron Donald's projection-busting return at SoFi to prove Melbourne was the exception, not the identity. Thanks for reading — see you tomorrow.", "closing_zh": "以上就是你十五分鐘的洛杉磯運動速覽：道奇西區第一，卻忽然要一名二十一歲年輕人在季後賽扛起 DH 重任；南加大三勝零敗、新秀改寫紀錄之際，Big Ten 的魔鬼賽程如臨大敵；公羊則有十天時間，在 Aaron Donald 回歸 SoFi 球場打破外界預期之前，證明墨爾本只是特例，而非本色。感謝閱讀，我們明天見。"};
let lang = "en";
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmtPT(iso){ return new Date(iso).toLocaleString("en-US",{timeZone:"America/Los_Angeles",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"})+" PT"; }

function renderDigest(d){
  const box = document.getElementById("digest");
  if(!d || !d.segments){
    box.innerHTML = '<div style="text-align:center;color:var(--dim);padding:40px">No digest yet</div>';
    return;
  }
  const segs = d.segments.map(s=>{
    const headline = lang==="en" ? s.headline : s.headline_zh;
    const analysis = lang==="en" ? s.analysis : s.analysis_zh;
    return '<div class="seg" style="--team:'+esc(s.accent)+'">' +
      '<div class="row"><span class="hn">'+esc(headline)+'</span><span class="badge">'+esc(s.team)+'</span></div>' +
      '<div class="lbl">'+(lang==="en"?"Analysis":"分析")+'</div><p>'+esc(analysis)+'</p>' +
      '</div>';
  }).join("");
  box.innerHTML =
    '<div class="dhead">' +
      '<div class="t"><div class="mic">🎙️</div><div><h2>'+esc(d.title)+'</h2><div class="meta">' +
        esc(d.read_time || "")+' · '+fmtPT(d.updated_at)+
        ' · 繁中/EN</div></div></div>' +
      '<div class="langs">'+
        '<button id="btnEn" class="on" onclick="setLang(\'en\')">EN</button>'+
        '<button id="btnZh" onclick="setLang(\'zh\')">繁體中文</button>'+
      '</div>' +
    '</div>' +
    '<div class="intro">'+esc(lang==="en"?d.intro:d.intro_zh)+'</div>' +
    '<div class="segs">'+segs+'</div>' +
    '<div class="closing">'+esc(lang==="en"?d.closing:d.closing_zh)+'</div>';
}
function setLang(v){ lang = v; document.getElementById("btnEn").classList.toggle("on", v==="en"); document.getElementById("btnZh").classList.toggle("on", v==="zh"); renderDigest(DIGEST_DATA); }

function renderNews(d){ const upd = document.getElementById("upd"); if(upd) upd.textContent = fmtPT(d.updated_at);
  const g = document.getElementById("grid"); g.innerHTML = "";
  for(const t of d.teams){
    const c = document.createElement("div"); c.className = "card"; c.style.setProperty("--team", t.accent);
    const emoji = t.emoji==="Baseball"?"⚾":t.emoji==="Football"?"🏈":"🏆";
    c.innerHTML =
      '<div class="top"><div class="ico">' + emoji + '</div>' +
      '<div><div class="name">' + esc(t.name) + '</div><div class="rec">' + t.sport + ' · ' + esc(t.record) + '</div></div></div>' +
      '<div class="hline">' + esc(t.headline) + '</div>' +
      '<h3>Latest News</h3><ul class="news">' + t.latest_news.map(n =>
        '<li><a target="_blank" rel="noopener" href="' + esc(n.url) + '">' + esc(n.title) + '</a><p>' + esc(n.summary) + '</p></li>'
      ).join("") + '</ul>' +
      '<h3>Fun Facts</h3><ul class="facts">' + t.fun_facts.map(f => '<li>'+esc(f)+'</li>').join("") + '</ul>' +
      '<h3>Further Reading</h3><ul class="read">' + t.further_reading.map(f =>
        '<li><a target="_blank" rel="noopener" href="' + esc(f.url) + '"><span>'+esc(f.title)+'</span><span class="why">'+esc(f.why)+'</span></a></li>'
      ).join("") + '</ul>' +
      '<div class="oss">' + esc(t.one_sentence) + '</div>';
    g.appendChild(c);
  }
}

renderDigest(DIGEST_DATA);
renderNews(TEAMS_DATA);
</script>
