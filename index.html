<title>LA Sports Fan</title>
<style>
  :root{
    --bg:#0b0e14; --panel:rgba(255,255,255,.04); --panel2:rgba(255,255,255,.02);
    --line:rgba(255,255,255,.08); --fg:#edf2fa; --dim:#8a94a6;
    --radius:18px; --glow:0 0 0 1px rgba(255,255,255,.04), 0 24px 60px -30px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 500px at 20% -10%, rgba(42,111,216,.18), transparent 60%),
      radial-gradient(1000px 500px at 90% -10%, rgba(153,0,0,.14), transparent 60%),
      radial-gradient(900px 400px at 50% 110%, rgba(31,78,156,.16), transparent 60%),
      var(--bg);
    color:var(--fg); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
    padding:28px clamp(16px,4vw,64px) 64px;
  }
  header{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:26px}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{
    width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;
    background:linear-gradient(135deg,#2a6fd8,#991111);box-shadow:0 8px 30px -8px rgba(60,90,220,.6);
  }
  h1{font-size:clamp(22px,3vw,32px);font-weight:800;letter-spacing:-.02em}
  .sub{color:var(--dim);font-size:13px;margin-top:4px}
  .ticker{
    font-size:12px;color:var(--dim);padding:8px 14px;border-radius:99px;
    background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);
  }
  .ticker b{color:#7ce38b}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:20px}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;backdrop-filter:blur(14px);box-shadow:var(--glow);position:relative;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--team,#2a6fd8),transparent);
  }
  .top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .ico{
    width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;
    background:color-mix(in srgb,var(--team) 22%, transparent);
  }
  .name{font-size:18px;font-weight:800;letter-spacing:-.01em}
  .rec{font-size:11px;color:var(--team);font-weight:700;margin-top:2px}
  .hline{font-size:13px;line-height:1.5;color:var(--dim);padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);margin-bottom:16px}
  h3{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
  h3::after{content:"";flex:1;height:1px;background:var(--line)}
  .news{list-style:none}
  .news li{padding:10px 12px;border-radius:12px;margin-bottom:6px;background:var(--panel2);border:1px solid var(--line);transition:.2s}
  .news li:hover{border-color:color-mix(in srgb,var(--team) 50%, transparent);transform:translateX(3px)}
  .news a{color:var(--fg);text-decoration:none;font-weight:700;font-size:13px;display:block;margin-bottom:4px}
  .news a:hover{color:var(--team)}
  .news p{font-size:12px;color:var(--dim);line-height:1.5}
  .facts{list-style:none;display:grid;gap:6px}
  .facts li{position:relative;padding:2px 0 2px 18px;font-size:12.5px;color:var(--fg);line-height:1.55}
  .facts li::before{content:"⚡";position:absolute;left:0;top:2px;font-size:11px;filter:grayscale(.4)}
  .read{list-style:none;display:grid;gap:6px}
  .read a{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12.5px;color:var(--fg);text-decoration:none;padding:9px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
  .read a:hover{color:var(--team);border-color:color-mix(in srgb,var(--team) 50%, transparent)}
  .read .why{font-size:11px;color:var(--dim)}
  .oss{font-size:12.5px;line-height:1.6;color:var(--fg);background:linear-gradient(90deg,color-mix(in srgb,var(--team) 18%,transparent),transparent);border-left:3px solid var(--team);padding:10px 14px;border-radius:0 12px 12px 0;margin-top:16px}
  banner{display:block;text-align:center;color:var(--dim);font-size:13px;margin-top:22px}
  banner span{color:#7ce38b;animation:blink 1.5s infinite}
  @keyframes blink{50%{opacity:.3}}
  .spin{width:100%;height:100px;display:grid;place-items:center;color:var(--dim)}
  /* ---- digest ---- */
  .digest{
    background:linear-gradient(135deg,rgba(42,111,216,.12),rgba(153,0,0,.10),rgba(31,78,156,.12)),var(--panel);
    border:1px solid var(--line);border-radius:var(--radius);padding:26px;
    backdrop-filter:blur(14px);box-shadow:var(--glow);margin-bottom:22px;
  }
  .dhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;margin-bottom:14px}
  .dhead .t{display:flex;align-items:center;gap:12px}
  .mic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:linear-gradient(135deg,#2a6fd8,#991111)}
  .dhead h2{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .dhead .meta{color:var(--dim);font-size:12px;margin-top:3px}
  .langs{display:flex;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:4px}
  .langs button{border:0;background:transparent;color:var(--dim);font-size:12px;font-weight:700;padding:6px 16px;border-radius:99px;cursor:pointer;transition:.2s}
  .langs button.on{background:linear-gradient(135deg,#2a6fd8,#1f4e9c);color:#fff}
  .intro{font-size:14px;line-height:1.65;color:var(--fg);max-width:820px;margin-bottom:18px}
  .segs{display:grid;gap:12px}
  .seg{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--panel2)}
  .seg .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .seg .row .hn{font-weight:800;font-size:14.5px}
  .seg .badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--team,#2a6fd8) 20%,transparent);color:var(--team);white-space:nowrap}
  .seg p{font-size:12.5px;line-height:1.6;color:var(--dim);margin-top:6px}
  .seg p.cls{color:var(--fg)}
  .seg .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin-top:10px;font-weight:700}
  .closing{font-size:14px;line-height:1.6;border-top:1px dashed var(--line);margin-top:16px;padding-top:14px;color:var(--fg)}
</style>
</head>

<script>
const TEAMS_DATA = {"updated_at": "2026-08-23T13:07:42.554767+00:00", "teams": [{"name": "Dodgers", "sport": "MLB", "emoji": "Baseball", "accent": "#2A6FD8", "record": "78-51, 1st NL West (9.0 GB lead over Padres)", "headline": "Skubal fans 11 for first win as a Dodger; Tucker's clutch single lifts LA to 4th straight", "latest_news": [{"title": "Tarik Skubal delivers ace performance for first win in Dodger blue", "summary": "The deadline pickup shook off a three-run first inning and retired 18 of his final 19 Pirates, striking out 11 over seven innings in Saturday's 4-3 rally. Kyle Tucker snapped an 0-for-26 home slump with the go-ahead two-run single in the fifth.", "url": "https://www.mlb.com/dodgers/news/tarik-skubal-11-strikeouts-seven-innings-dodgers-pirates"}, {"title": "Andy Pages fractures hand on hit-by-pitch, out at least 4 weeks", "summary": "The All-Star center fielder was placed on the 10-day IL Aug. 22 after X-rays revealed a fractured left hand from Friday's HBP; surgery is possible and his return targets late September, thinning an outfield already missing depth.", "url": "https://www.usatoday.com/story/sports/mlb/dodgers/2026/08/23/andy-pages-injury-dodgers-lineup/91429971007/"}, {"title": "Tyler Glasnow set to come off 60-day IL on Tuesday in Atlanta", "summary": "Glasnow, out since May 6 with lower back spasms, capped his rehab with nine K's over 5 1/3 innings at Triple-A Oklahoma City and gets no pitch limit vs. the Braves, completing a six-man rotation with Yamamoto, Skubal, Snell, Sasaki and Lauer.", "url": "https://www.mlb.com/news/tyler-glasnow-return-dodgers-rotation"}, {"title": "Ohtani throws 30 pitches in first live BP, nearing mound return", "summary": "Shohei Ohtani faced hitters Saturday, Aug. 22, for the first time since July; after one more live session he could pitch in games, building up inning by inning with an early-September target. His bat hasn't waited: two homers at Coors this week keep him hot on Pete Crow-Armstrong in the NL MVP race.", "url": "https://www.usatoday.com/story/sports/mlb/dodgers/2026/08/22/shohei-ohtani-pitching-return-latest-dodgers-injury-news/91427078007/"}, {"title": "Tommy Edman's 10th-inning walk-off beats Pirates 5-4", "summary": "One night after the bullpen let a lead slip, Edman lined a two-out walk-off single off Gregory Soto on Friday as LA opened the Pittsburgh series with its third straight win despite losing Pages mid-game.", "url": "https://www.espn.com/mlb/recap?gameId=401816624"}, {"title": "Will Smith takes live BP; September return plan taking shape", "summary": "The three-time All-Star catcher, on the IL since June 11 with neck inflammation, saw live pitching for the first time Friday and could begin a rehab assignment soon, with the Dodgers targeting a September activation.", "url": "https://dodgersbeat.com/will-smith-dodgers-rehab-plan-return-date/"}], "fun_facts": ["Skubal struck out the side in the sixth Saturday, reaching 100 mph — his second-hardest pitch of the season — en route to his first win since the Tigers traded him to LA.", "Ohtani crushed two homers in an 11-5 romp at Coors Field on Aug. 17, part of a three-game sweep in Denver that fueled the current four-game streak.", "Top prospect Josue De Paula (MLB Pipeline's No. 6 overall) hit his first career walk-off homer for Double-A Tulsa last week, then homered again — three in four games.", "The Dodgers lead baseball's deepest division by nine games over San Diego, with Arizona next at 10 back; the Giants (25.5) and Rockies (27.5) are all but buried.", "Closer duty belongs to Tanner Scott for now, with Edwin Díaz (neck inflammation) sidelined until at least early September after an MRI showed no structural damage."], "further_reading": [{"title": "Latest Dodgers injuries & transactions (MLB.com)", "why": "Continuously updated tracker covering Ohtani, Pages, Smith, Treinen, Rushing and every roster move.", "url": "https://www.mlb.com/news/dodgers-injuries-and-roster-moves"}, {"title": "AP: Skubal shines with 11 strikeouts as Dodgers rally past Pirates", "why": "The national take on the deadline deal paying off in late August.", "url": "https://apnews.com/article/pirates-dodgers-score-ba36625a94aec716cbc06fbab348d106"}, {"title": "Dodgers Outline Shohei Ohtani's Final Steps Before Pitching Return", "why": "Deep dive on the knee rehab timeline and how LA will build him up for October.", "url": "https://dodgersbeat.com/shohei-ohtani-final-steps-dodgers-pitching-return/"}, {"title": "MLB Trade Rumors: Glasnow to return Tuesday", "why": "Roster implications of activating Glasnow without a 40-man crunch.", "url": "https://www.mlbtraderumors.com/2026/08/dodgers-tyler-glasnow-to-return-on-tuesday.html"}, {"title": "FanGraphs RosterResource Dodgers Injury Report", "why": "Table view of every IL stint and expected return date as the rotation rounds into form.", "url": "https://www.fangraphs.com/roster-resource/injury-report/dodgers"}], "one_sentence": "Riding a four-game streak at 78-51 with a nine-game NL West cushion, the Dodgers got their deadline ace rolling (Skubal, 11 K's), welcome Glasnow back Tuesday in Atlanta, await Ohtani's mound return in September — and must cover for Andy Pages' broken hand down the stretch."}, {"name": "USC Trojans", "sport": "College Football", "emoji": "Football", "accent": "#9E1B32", "record": "0-0 (2025: 9-4, 7-2 Big Ten; final AP No. 20)", "headline": "Preseason No. 14 USC opens Year 5 of the Lincoln Riley era Aug. 29 vs San Jose State, with Golden Arm watch-list QB Jayden Maiava and Hall of Fame DC Gary Patterson carrying College Football Playoff-or-bust expectations", "latest_news": [{"title": "USC ranked No. 14 in preseason AP Top 25", "summary": "The Trojans check in at No. 14 in the AP Preseason Poll (tied with BYU at 839 points), matching their No. 14 spot in the US LBM Coaches Poll. They face five preseason top-25 teams, including home games against No. 1 Ohio State and No. 2 Oregon.", "url": "https://247sports.com/college/usc/article/usc-football-preseason-top-25-rankings-associated-press-poll-288996085/"}, {"title": "Gary Patterson's defensive makeover centers on 'more bodies to the ball'", "summary": "Fall camp's biggest theme has been fixing the tackling and big-play lapses that doomed USC against Notre Dame and Illinois last year. New coordinator Gary Patterson's scheme emphasizes layered coverage and pursuit, and Lincoln Riley says the defense has taken 'a big jump' from spring to camp.", "url": "https://247sports.com/college/usc/article/uscs-defensive-makeover-match-words-with-results-more-bodies-to-ball-289099052/"}, {"title": "Jayden Maiava named to Johnny Unitas Golden Arm Award watch list", "summary": "USC's redshirt senior quarterback added another preseason honor after leading the nation with a 91.2 QBR in 2025 (3,711 passing yards, 24 TDs). He's already on the Maxwell, Walter Camp and Wuerffel Trophy lists and earned Big Ten Preseason Honors recognition.", "url": "https://usctrojans.com/news/2026/8/20/football-usc-quarterback-jayden-maiava-named-to-johnny-unitas-golden-arm-award-watch-list"}, {"title": "Center Kilian O'Connor out for the season; offensive line reshuffles", "summary": "Lincoln Riley announced that projected starting center Kilian O'Connor suffered a practice injury and will miss all of 2026, forcing the line to adjust — possibly with Tobias Raymond sliding over from guard after working at center in spring ball.", "url": "https://sports.yahoo.com/articles/usc-offensive-line-must-adjust-222708229.html"}, {"title": "Tanook Hines returns to practice in encouraging injury update", "summary": "Sophomore receiver Tanook Hines, expected to step into the WR1 role left vacant by Makai Lemon and Ja'Kobi Lane, was back on the field this week after missing the spring and the start of fall camp following an offseason procedure.", "url": "https://www.si.com/college/usc/football/usc-trojans-receive-encouraging-fall-camp-injury-update"}, {"title": "2028 quarterback Trey Wright commits; Kyler Murray sends congrats video", "summary": "Three-star Frisco (Texas) Lone Star QB Trey Wright committed to Lincoln Riley over offers from Clemson, Michigan, Oregon and others, drawing a celebratory video from Cardinals star Kyler Murray touting Riley as a QB developer.", "url": "https://bleacherreport.com/articles/25472626-kyler-murray-sends-video-message-trey-wright-after-qb-commits-lincoln-riley-usc"}], "fun_facts": ["Lincoln Riley is 42-0 as a head coach when his team allows 20 points or fewer — the whole 2026 plan is built on finally getting stops.", "Jayden Maiava led the entire FBS with a 91.2 QBR in 2025 and ranks 13th on USC's career total offense list despite only two seasons as a Trojan.", "USC leads its all-time series with Week 0 opener opponent San Jose State 6-0, including a 56-28 win in their last Coliseum meeting in 2023.", "The new $225 million Bloom Football Performance Center was built in just 636 days and features sleep pods, AI-powered massage chairs and an in-house barber.", "USC's Nov. 14 game at defending national champion Indiana will be the program's first trip to Bloomington since 1981."], "further_reading": [{"title": "USC Trojans' schedule gauntlet exposed in preseason AP Top 25", "why": "Breaks down the brutal six-game stretch where USC faces five ranked teams, starting with No. 2 Oregon on Sept. 26.", "url": "https://www.si.com/college/usc/football/usc-trojans-schedule-gauntlet-exposed-preseason-ap-top-25-poll"}, {"title": "From napkin to reality: How USC's new football facility 'blew me out my socks'", "why": "Inside the $225 million Bloom Football Performance Center that Riley demanded and USC delivered before fall camp.", "url": "https://sports.yahoo.com/articles/napkin-reality-uscs-football-facility-124948327.html"}, {"title": "Can Gary Patterson finally fix the USC defense?", "why": "Deep dive on the Hall of Fame coordinator's return to play-calling after four years away and what his 4-2-5 means for the Trojans.", "url": "https://trojandailyblog.com/can-gary-patterson-finally-fix-the-usc-d/"}, {"title": "2026 USC Trojans football depth chart", "why": "Full projected two-deep, from Maiava and Waymond Jordan to the reshuffled offensive line and young secondary.", "url": "https://www.ourlads.com/ncaa-football-depth-charts/depth-chart/usc/92269"}, {"title": "Jayden Maiava reveals how he plans to take USC to another level", "why": "Maiava explains why he skipped the NFL Draft and how chemistry with a rebuilt receiver room fuels the playoff push.", "url": "https://www.newsweek.com/sports/ncaa/jayden-maiava-reveals-how-he-plans-to-take-usc-to-another-level-12300492"}], "one_sentence": "Fifth-year coach Lincoln Riley's highest-hyped USC team yet — preseason No. 14 behind national-QBR-leader Jayden Maiava, Hall of Fame DC Gary Patterson and a $225 million new facility — kicks off Aug. 29 against San Jose State before a playoff-or-bust Big Ten gauntlet featuring Ohio State, Oregon, Penn State and Indiana."}, {"name": "Rams", "sport": "NFL", "emoji": "Helmet", "accent": "#003594", "record": "2-0 (2026 preseason); 12-5 in 2025", "headline": "Rams throttle Saints 34-0 in preseason home opener as Alex Cook's 100-yard pick-six powers a defensive shutdown at SoFi Stadium", "latest_news": [{"title": "Defense dominates in 34-0 preseason shutout of Saints", "summary": "The Rams blanked New Orleans at SoFi Stadium behind safety Alex Cook's 100-yard pick-six, an Al'zillion 'AZ' Hamilton interception, Wesley Bailey's sack-plus-forced-fumble and two red-zone takeaways. QB Stetson Bennett IV added two rushing touchdowns while starter Matthew Stafford watched, per McVay's long-standing policy of resting veterans.", "url": "https://www.therams.com/news/head-coach-sean-mcvay-quarterback-stetson-bennett-iv-rams-saints-press-conference-preseason-week-two-2026"}, {"title": "Puka Nacua nursing psoas soreness, expected back soon - and now has an agent", "summary": "The All-Pro receiver sat out recent practices after leaving a joint practice with Dallas early, but McVay said Nacua is 'doing good' and expects him ready for Week 1. Nacua, entering the final year of his rookie deal after leading the NFL with 129 catches and 1,715 yards in 2025, hired WIN Sports Group to handle extension talks.", "url": "https://www.sportsnet.ca/nfl/article/rams-nacua-misses-practice-with-muscle-soreness-expected-to-return-next-week/"}, {"title": "Myles Garrett era begins in earnest after blockbuster trade", "summary": "Los Angeles acquired the two-time Defensive Player of the Year from Cleveland on June 1 for pass rusher Jared Verse plus first-, second- and third-round picks. Garrett has been managing minor knee soreness in camp but returned to practice quickly, and his bend-around-the-edge reps have been the talk of training camp.", "url": "https://www.nfl.com/news/myles-garrett-trade-winners-and-losers-rams-super-bowl-ready-what-can-jared-verse-do-with-browns"}, {"title": "Backup QB battle: Stetson Bennett IV vs. rookie first-rounder Ty Simpson", "summary": "With Stafford resting all preseason, Bennett and Alabama product Ty Simpson are dueling to be QB2. Simpson's strong debut in the 20-12 Week 1 win at Kansas City opened the competition, but Bennett answered with two rushing scores and a clutch fourth-down throw against the Saints.", "url": "https://bolavip.com/en/nfl/why-isnt-matthew-stafford-playing-today-for-rams-vs-saints-in-2026-nfl-preseason-week-2"}, {"title": "Injury front: rookie OT Keagen Trost (hamstring) out a few weeks", "summary": "Third-round pick Keagen Trost, who had emerged as the top backup right tackle, hurt his hamstring in the preseason opener. McVay is 'hopeful' he returns before Week 1, and tight end Davis Allen is expected back within the week.", "url": "https://heavy.com/sports/nfl/los-angeles-rams/rams-keagen-trost-hamstring-injury-update/"}, {"title": "Xavier Smith 'looked like a stud' in redemption bid", "summary": "A year after his muffed punts helped sink the Rams in the NFC Championship loss at Seattle, Smith caught all four targets and ripped a 40-yard punt return in the preseason opener, drawing glowing reviews from McVay as he fights for a special teams role.", "url": "https://theramswire.usatoday.com/story/sports/nfl/rams/2026/08/18/rams-xavier-smith-preseason-nfc-championship-mcvay/91347945007/"}], "fun_facts": ["The Garrett trade sent Jared Verse and three picks (2027 first, 2028 second, 2029 third) to Cleveland - and Garrett responded to the deal fresh off the single-season sack record in 2025.", "Week 1 isn't in Los Angeles - the Rams 'host' the 49ers at the Melbourne Cricket Ground on Sept. 10 (5:35 p.m. PT), the first-ever NFL regular season game in Australia.", "Stafford enters 2026 as the reigning MVP and first-team All-Pro after finishing his 17th season, while McVay still refuses to play any starters in preseason games.", "Kicker Harrison Mevis, the 'Thiccer Kicker,' missed just one kick (a 48-yarder) across the entire 2025 regular season and playoffs.", "A camp subplot: Aaron Donald's potential un-retirement keeps coming up, with McVay publicly praising the future Hall of Famer as the team awaits his decision."], "further_reading": [{"title": "2026 Los Angeles Rams training camp: Latest intel and updates (ESPN)", "why": "Sarah Barshop's running tracker covers everything from Garrett's soreness to new alternate uniforms and extension talks with Nacua's draft class.", "url": "https://www.espn.com/nfl/story/_/id/49434454/los-angeles-rams-training-camp-2026-intel-updates"}, {"title": "Browns trade Myles Garrett to Rams (The Athletic)", "why": "The definitive inside account of the blockbuster that swapped Jared Verse and three picks for the NFL's most disruptive defender.", "url": "https://www.nytimes.com/athletic/7318004/2026/06/01/myles-garrett-traded-browns-rams/"}, {"title": "Game Recap: Rams fall to Seahawks 31-27 in NFC Championship", "why": "The painful finale of a 12-5 season - essential context for why this roster went all-in on Garrett.", "url": "https://www.therams.com/news/game-recap-rams-fall-to-seahawks-31-27-in-nfc-championship"}, {"title": "NFL Melbourne Game: Rams vs. 49ers at the MCG", "why": "Everything you need to know about the historic Week 1 opener in Australia, including kickoff time and tickets.", "url": "https://www.nfl.com/international/games/melbourne/"}, {"title": "Rams training camp updates (Los Angeles Times)", "why": "Beat writer Gary Klein's rolling coverage of Stafford, Garrett, Nacua and the Donald question straight from Woodland Hills.", "url": "https://www.latimes.com/sports/rams/live/rams-training-camp-updates-stafford-garrett-nacua-donald"}], "one_sentence": "Fresh off a 34-0 preseason shutout of the Saints, the reloaded Rams - reigning MVP Matthew Stafford, All-Pro Puka Nacua, and newly acquired superstar Myles Garrett - are tuning up for a Week 1 trip to Melbourne to face the 49ers in the first NFL regular season game ever played in Australia."}]};

let lang = "en";
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmtPT(iso){ return new Date(iso).toLocaleString("en-US",{timeZone:"America/Los_Angeles",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"})+" PT"; }

function renderDigest(d){
  const box = document.getElementById("digest");
  if(!d || !d.segments){
    box.innerHTML = '<div style="text-align:center;color:var(--dim);padding:40px">No digest yet</div>';
    return;
  }
  const segs = d.segments.map(s=>{
    const headline = lang==="en" ? s.headline : s.headline_zh;
    const analysis = lang==="en" ? s.analysis : s.analysis_zh;
    return '<div class="seg" style="--team:'+esc(s.accent)+'">' +
      '<div class="row"><span class="hn">'+esc(headline)+'</span><span class="badge">'+esc(s.team)+'</span></div>' +
      '<div class="lbl">'+(lang==="en"?"Analysis":"分析")+'</div><p>'+esc(analysis)+'</p>' +
      '</div>';
  }).join("");
  box.innerHTML =
    '<div class="dhead">' +
      '<div class="t"><div class="mic">🎙️</div><div><h2>'+esc(d.title)+'</h2><div class="meta">' +
        esc(d.read_time || "")+' · '+fmtPT(d.updated_at)+
        ' · 繁中/EN</div></div></div>' +
      '<div class="langs">'+
        '<button id="btnEn" class="on" onclick="setLang(\'en\')">EN</button>'+
        '<button id="btnZh" onclick="setLang(\'zh\')">繁體中文</button>'+
      '</div>' +
    '</div>' +
    '<div class="intro">'+esc(lang==="en"?d.intro:d.intro_zh)+'</div>' +
    '<div class="segs">'+segs+'</div>' +
    '<div class="closing">'+esc(lang==="en"?d.closing:d.closing_zh)+'</div>';
}
function setLang(v){ lang = v; document.getElementById("btnEn").classList.toggle("on", v==="en"); document.getElementById("btnZh").classList.toggle("on", v==="zh"); renderDigest(DIGEST_DATA); }

function renderNews(d){ const upd = document.getElementById("upd"); if(upd) upd.textContent = fmtPT(d.updated_at);
  const g = document.getElementById("grid"); g.innerHTML = "";
  for(const t of d.teams){
    const c = document.createElement("div"); c.className = "card"; c.style.setProperty("--team", t.accent);
    const emoji = t.emoji==="Baseball"?"⚾":t.emoji==="Football"?"🏈":"🏆";
    c.innerHTML =
      '<div class="top"><div class="ico">' + emoji + '</div>' +
      '<div><div class="name">' + esc(t.name) + '</div><div class="rec">' + t.sport + ' · ' + esc(t.record) + '</div></div></div>' +
      '<div class="hline">' + esc(t.headline) + '</div>' +
      '<h3>Latest News</h3><ul class="news">' + t.latest_news.map(n =>
        '<li><a target="_blank" rel="noopener" href="' + esc(n.url) + '">' + esc(n.title) + '</a><p>' + esc(n.summary) + '</p></li>'
      ).join("") + '</ul>' +
      '<h3>Fun Facts</h3><ul class="facts">' + t.fun_facts.map(f => '<li>'+esc(f)+'</li>').join("") + '</ul>' +
      '<h3>Further Reading</h3><ul class="read">' + t.further_reading.map(f =>
        '<li><a target="_blank" rel="noopener" href="' + esc(f.url) + '"><span>'+esc(f.title)+'</span><span class="why">'+esc(f.why)+'</span></a></li>'
      ).join("") + '</ul>' +
      '<div class="oss">' + esc(t.one_sentence) + '</div>';
    g.appendChild(c);
  }
}
