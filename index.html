<style>
  :root{
    --bg:#0b0e14; --panel:rgba(255,255,255,.04); --panel2:rgba(255,255,255,.02);
    --line:rgba(255,255,255,.08); --fg:#edf2fa; --dim:#8a94a6;
    --radius:18px; --glow:0 0 0 1px rgba(255,255,255,.04), 0 24px 60px -30px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 500px at 20% -10%, rgba(42,111,216,.18), transparent 60%),
      radial-gradient(1000px 500px at 90% -10%, rgba(153,0,0,.14), transparent 60%),
      radial-gradient(900px 400px at 50% 110%, rgba(31,78,156,.16), transparent 60%),
      var(--bg);
    color:var(--fg); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
    padding:28px clamp(16px,4vw,64px) 64px;
  }
  header{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:26px}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{
    width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;
    background:linear-gradient(135deg,#2a6fd8,#991111);box-shadow:0 8px 30px -8px rgba(60,90,220,.6);
  }
  h1{font-size:clamp(22px,3vw,32px);font-weight:800;letter-spacing:-.02em}
  .sub{color:var(--dim);font-size:13px;margin-top:4px}
  .ticker{
    font-size:12px;color:var(--dim);padding:8px 14px;border-radius:99px;
    background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);
  }
  .ticker b{color:#7ce38b}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:20px}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;backdrop-filter:blur(14px);box-shadow:var(--glow);position:relative;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--team,#2a6fd8),transparent);
  }
  .top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .ico{
    width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;
    background:color-mix(in srgb,var(--team) 22%, transparent);
  }
  .name{font-size:18px;font-weight:800;letter-spacing:-.01em}
  .rec{font-size:11px;color:var(--team);font-weight:700;margin-top:2px}
  .hline{font-size:13px;line-height:1.5;color:var(--dim);padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);margin-bottom:16px}
  h3{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
  h3::after{content:"";flex:1;height:1px;background:var(--line)}
  .news{list-style:none}
  .news li{padding:10px 12px;border-radius:12px;margin-bottom:6px;background:var(--panel2);border:1px solid var(--line);transition:.2s}
  .news li:hover{border-color:color-mix(in srgb,var(--team) 50%, transparent);transform:translateX(3px)}
  .news a{color:var(--fg);text-decoration:none;font-weight:700;font-size:13px;display:block;margin-bottom:4px}
  .news a:hover{color:var(--team)}
  .news p{font-size:12px;color:var(--dim);line-height:1.5}
  .facts{list-style:none;display:grid;gap:6px}
  .facts li{position:relative;padding:2px 0 2px 18px;font-size:12.5px;color:var(--fg);line-height:1.55}
  .facts li::before{content:"⚡";position:absolute;left:0;top:2px;font-size:11px;filter:grayscale(.4)}
  .read{list-style:none;display:grid;gap:6px}
  .read a{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12.5px;color:var(--fg);text-decoration:none;padding:9px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
  .read a:hover{color:var(--team);border-color:color-mix(in srgb,var(--team) 50%, transparent)}
  .read .why{font-size:11px;color:var(--dim)}
  .oss{font-size:12.5px;line-height:1.6;color:var(--fg);background:linear-gradient(90deg,color-mix(in srgb,var(--team) 18%,transparent),transparent);border-left:3px solid var(--team);padding:10px 14px;border-radius:0 12px 12px 0;margin-top:16px}
  banner{display:block;text-align:center;color:var(--dim);font-size:13px;margin-top:22px}
  banner span{color:#7ce38b;animation:blink 1.5s infinite}
  @keyframes blink{50%{opacity:.3}}
  .spin{width:100%;height:100px;display:grid;place-items:center;color:var(--dim)}
  /* ---- digest ---- */
  .digest{
    background:linear-gradient(135deg,rgba(42,111,216,.12),rgba(153,0,0,.10),rgba(31,78,156,.12)),var(--panel);
    border:1px solid var(--line);border-radius:var(--radius);padding:26px;
    backdrop-filter:blur(14px);box-shadow:var(--glow);margin-bottom:22px;
  }
  .dhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;margin-bottom:14px}
  .dhead .t{display:flex;align-items:center;gap:12px}
  .mic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:linear-gradient(135deg,#2a6fd8,#991111)}
  .dhead h2{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .dhead .meta{color:var(--dim);font-size:12px;margin-top:3px}
  .langs{display:flex;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:4px}
  .langs button{border:0;background:transparent;color:var(--dim);font-size:12px;font-weight:700;padding:6px 16px;border-radius:99px;cursor:pointer;transition:.2s}
  .langs button.on{background:linear-gradient(135deg,#2a6fd8,#1f4e9c);color:#fff}
  .intro{font-size:14px;line-height:1.65;color:var(--fg);max-width:820px;margin-bottom:18px}
  .segs{display:grid;gap:12px}
  .seg{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--panel2)}
  .seg .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .seg .row .hn{font-weight:800;font-size:14.5px}
  .seg .badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--team,#2a6fd8) 20%,transparent);color:var(--team);white-space:nowrap}
  .seg p{font-size:12.5px;line-height:1.6;color:var(--dim);margin-top:6px}
  .seg p.cls{color:var(--fg)}
  .seg .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin-top:10px;font-weight:700}
  .closing{font-size:14px;line-height:1.6;border-top:1px dashed var(--line);margin-top:16px;padding-top:14px;color:var(--fg)}
</style>

ime MVP who hasn't pitched since July 3 and won't take the mound again this season."], "further_reading": [{"title": "Dodgers have playoff problems — but also the remedy to overcome them", "why": "Analysis of L.A.'s postseason readiness despite injuries, and why their rotation depth still makes them the favorites.", "url": "https://nypost.com/2026/09/16/sports/dodgers-playoff-problems-remedy-overcome-them/"}, {"title": "Blake Snell's injury-riddled Dodgers tenure", "why": "Deep dive into Snell's injury history since signing his $182M deal — shoulder, elbow, and now groin.", "url": "https://www.si.com/mlb/dodgers/onsi/blake-snell-reveals-injury-update-major-scare-dodgers"}, {"title": "MLB standings and playoff picture through Sept. 16", "why": "Full updated standings showing the Dodgers' magic number and wild-card race across both leagues.", "url": "https://sports.yahoo.com/articles/mlb-standings-2026-updated-playoff-133827776.html"}, {"title": "Tyler Glasnow's return to the Dodgers", "why": "Background on Glasnow's Aug. 25 activation after missing nearly four months with back spasms.", "url": "https://www.mlb.com/news/tyler-glasnow-return-dodgers-rotation"}], "one_sentence": "The Dodgers' NL West party is on hold after a 6-2 loss to Cincinnati, and a Blake Snell groin scare now looms over an October rotation already navigating injuries to Ohtani, Freeman, and Sasaki."}, {"name": "USC Trojans", "sport": "College Football", "emoji": "Football", "accent": "#9E1B32", "record": "3-0 (0-0 Big Ten) — No. 14 AP / No. 14 Coaches", "headline": "Maiava Throws Career-High 5 TDs as No. 14 USC Blasts Louisiana 49-30, Moves to 3-0", "latest_news": [{"title": "Jayden Maiava Throws 5 TD Passes, No. 14 USC Beats Louisiana 49-30", "summary": "Maiava went 19-of-29 for 261 yards with a career-high 5 touchdowns as USC improved to 3-0. Freshman TE Mark Bowman caught two TDs and hurdled two defenders on a 35-yard grab-and-run, while Trent Mosley also found the end zone.", "url": "https://usctrojans.com/news/2026/9/12/usc-trojans-football-game-recap-associated-press-ap-louisiana-ragin-cajuns-mark-bowman-jayden-maiava-trent-mosley"}, {"title": "USC Opens Big Ten Play at Rutgers This Saturday", "summary": "The No. 14 Trojans (3-0) travel to Piscataway, N.J. to face the Scarlet Knights (0-2) in their Big Ten conference opener on Saturday at 3:30 p.m. ET.", "url": "https://www.cbssports.com/college-football/teams/USC/usc-trojans/"}, {"title": "Freshman TE Mark Bowman Named Big Ten Freshman of the Week", "summary": "Bowman, a five-star recruit from Mater Dei, made his first two career trips to the end zone with 6 catches for 83 yards — all in the first half — earning conference weekly honors.", "url": "https://usctrojans.com/sports/football/roster/coaches/jared-blank/136"}, {"title": "Jayden Maiava Named to Jason Witten Collegiate Man of the Year Watch List", "summary": "The Trojans quarterback, who threw for 3,711 yards and led the FBS in total quarterback rating last season, has been recognized on the prestigious leadership award watch list.", "url": "https://usctrojans.com/news/2026/9/12/usc-trojans-football-game-recap-associated-press-ap-louisiana-ragin-cajuns-mark-bowman-jayden-maiava-trent-mosley"}, {"title": "Bloom Football Performance Center Officially Opens", "summary": "USC unveiled its $200M+ state-of-the-art 160,000 sq. ft. facility on Aug. 5, featuring two full-length football fields, a three-story building, and showcases of the program's 11 national championships and NCAA-record 8 Heisman Trophies.", "url": "https://usctrojans.com/news/2026/8/6/usc-trojans-football-bloom-performance-center-grand-opening-headquarters"}, {"title": "Patterson's Defense Drawing Praise Early in 2026", "summary": "New defensive coordinator Gary Patterson — a College Football Hall of Famer — has elevated USC's defense, which ranks 11th nationally in total defense (155.5 pass yds/game allowed) through three games. Safety Kennedy Urlacher is emerging as a playmaker.", "url": "https://www.si.com/college/usc/transfer-portal"}], "fun_facts": ["USC's 2026 recruiting class is ranked No. 1 nationally, with 35 signees — 20 from California — the most in-state haul under Lincoln Riley.", "Freshman TE Mark Bowman (Mater Dei) hurdled TWO defenders simultaneously on a 35-yard catch-and-run against Louisiana.", "The Bloom Football Performance Center, funded by a $50M gift from the Bloom Family, is the first facility to house the full history of USC's 11 national championships and 8 Heisman Trophies under one roof.", "Twin brothers RB King Miller and OL Kaylon Miller both started in the Louisiana game.", "USC has the No. 1 SRS and No. 2 SOS in all of college football through Week 2, according to Sports-Reference."], "further_reading": [{"title": "USC Trojans 2026 Season Preview — Daily Trojan", "why": "Deep dive into the roster changes, Gary Patterson's new defense, and the brutal Big Ten schedule ahead.", "url": "https://dailytrojan.com/2026/08/19/football-gears-up-for-2026-with-same-goals/"}, {"title": "USC's Bloom Football Performance Center Grand Opening", "why": "Details on the $200M facility that signals USC's commitment to competing at the highest level.", "url": "https://usctrojans.com/news/2026/8/6/usc-trojans-football-bloom-performance-center-grand-opening-headquarters"}, {"title": "No. 14 USC Defeats Louisiana — Postgame Notes & Quotes", "why": "Full statistical breakdown and coach/player quotes from the Louisiana game, including Maiava's 5-TD performance.", "url": "https://usctrojans.com/news/2026/9/13/usc-trojans-football-postgame-notes-quotes-louisiana-ragin-cajuns-lincoln-riley-jayden-maiava-luke-wafle"}, {"title": "2026 USC Trojans Schedule & Results — Sports-Reference", "why": "Complete game-by-game schedule with rankings, results, and upcoming matchups including Oregon, Ohio State, and Indiana.", "url": "https://www.sports-reference.com/cfb/schools/southern-california/2026-schedule.html"}, {"title": "USC Local Recruiting Making a Long-Term Impact — SI", "why": "How the No. 1 recruiting class is creating a ripple effect for future cycles, with 20 California signees.", "url": "https://www.si.com/college/usc/football/usc-trojans-local-recruiting-making-long-term-impact-lincoln-riley-chad-bowden"}], "one_sentence": "No. 14 USC (3-0) rides Jayden Maiava's 5-TD masterclass and a surging defense under Gary Patterson into Big Ten play at Rutgers on Saturday, with a murderer's row of Oregon, Ohio State, and Indiana looming in October and November."}, {"name": "Rams", "sport": "NFL", "emoji": "🏈", "accent": "#003594", "record": "0-1", "headline": "Myles Garrett set for knee surgery, lands on IR; Aaron Donald eyes MNF debut vs. Giants", "latest_news": [{"title": "Sean McVay confirms Myles Garrett will undergo knee surgery and be placed on IR", "summary": "The reigning Defensive Player of the Year is set for arthroscopic knee surgery and will miss at least four games after a 0-tackle Rams debut vs. the 49ers. McVay said the club expected Garrett's knee to be manageable, 'and that wasn't necessarily the case.' He is eligible to return as early as Week 6 vs. Arizona.", "url": "https://www.therams.com/news/rams-injury-updates-week-2-2026-giants-myles-garrett-kam-curl-davis-allen-nate-landman-omar-speights-monday-night-football"}, {"title": "Rams' Sean McVay: No timeline on Myles Garrett's return post-surgery", "summary": "McVay said the team won't put a timeline on Garrett's comeback until the surgery outcome is known, noting he'll be available in four weeks 'potentially.' Garrett admitted after the Australia opener that he was worried about his knee and wasn't himself.", "url": "https://www.nfl.com/news/rams-sean-mcvay-no-timeline-myles-garrett-return-post-knee-surgery"}, {"title": "Aaron Donald has a 'very, very realistic chance' to play vs. Giants on MNF", "summary": "The 35-year-old, unretired after ~2.5 years away, is no lock for Monday night, but NFL Network's Ian Rapoport says a Week 2 debut at SoFi is very possible. Giants coach John Harbaugh said his team expects Donald to play, and New York already must game-plan without a sack from the Rams pass rush in Week 1.", "url": "https://www.cbssports.com/fantasy/football/news/rams-aaron-donald-realistic-chance-to-play-in-week-2/"}, {"title": "Star-studded Rams humbled 27-7 by 49ers in NFL's first-ever game in Australia", "summary": "Before 100,021 fans at the MCG -- the seventh-largest regular-season crowd in NFL history -- Stafford completed 15 of 25 for 155 yards with an INT, while Garrett was invisible (no tackles, 5 pressures) against Trent Williams. McVay called it a 'good humbling day.'", "url": "https://www.latimes.com/sports/rams/story/2026-09-10/star-studded-rams-humbled-by-brock-purdy-49ers-in-opener"}, {"title": "Rams return home to host Giants on Monday Night Football in Week 2", "summary": "Los Angeles opens at SoFi Stadium on Sept. 21 (ESPN/ABC) needing a win to avoid 0-2. McVay gave 'positive' injury updates on S Kam Curl (ankle), LB Nate Landman (shoulder/thumb) and TE Davis Allen (concussion), while Omar Speights deals with a hip pointer.", "url": "https://www.therams.com/news/first-look-rams-return-home-to-host-giants-on-monday-night-football-in-week-2-2026"}, {"title": "Myles Garrett voted No. 1, Stafford No. 4 on NFL Top 100 Players of 2026", "summary": "Fresh off a record 23-sack 2025 season, Garrett was crowned the players' No. 1 -- a first for any Ram -- with his MVP teammate Stafford at No. 4 and Puka Nacua at No. 7. The pair now anchors a 0-1 team trying to ramp back up.", "url": "https://www.therams.com/news/myles-garrett-no-1-on-nfl-top-100-players-of-2026"}], "fun_facts": ["The Sept. 10 opener at the MCG drew 100,021 fans -- the largest crowd ever for an NFL game outside North America and the seventh-biggest regular-season attendance in NFL history.", "Kyren Williams scored the NFL's first-ever touchdown in Australia on a 5-yard run to open the second quarter in Melbourne.", "Garrett's 23 sacks in 2025 set the NFL single-season record for Cleveland, making him the first player since 1990 to top 20 sacks and 30 tackles for loss in a single season before the Rams traded a massive haul for him in June.", "The Rams named an NFL-high 11 team captains -- the most of the Sean McVay era -- with quarterback Matthew Stafford earning the 'C' a sixth straight season.", "Aaron Donald agreed to a one-year, $20 million deal (up to $30M with playoff incentives) to return after a 2.5-year retirement, joining Deion Sanders as the only 5-time first-team All-Pros to come back after a 750-plus-day layoff."], "further_reading": [{"title": "Browns trade Myles Garrett to Rams for Jared Verse, three picks", "why": "Everything on the blockbuster June trade -- the 2027 first-round, 2028 second-round and 2029 third-round picks sent to Cleveland -- that made the Rams the NFC's power-play team.", "url": "https://www.espn.com/nfl/story/_/id/48939456/sources-browns-rams-finalizing-myles-garrett-blockbuster-trade"}, {"title": "Aaron Donald unretires, will play for Rams in 2026", "why": "The full story of the Aug. 30 comeback, including McVay's Garrett trade outreach to Donald and the one-year, $20M deal that can reach $30M.", "url": "https://www.therams.com/news/aaron-donald-unretires-will-play-for-rams-in-2026"}, {"title": "49ers rout Rams 27-7 as NFL draws 100,000 to Melbourne", "why": "Why the NFL's first game Down Under was a spectacle -- and how Brock Purdy's three TDs exposed the suddenly-thin Rams defense.", "url": "https://www.theguardian.com/sport/2026/sep/10/49ers-rams-nfl-australia-melbourne-result-brock-purdy"}, {"title": "Top 100 Players of 2026, Nos. 10-1: Myles Garrett crowned", "why": "How players themselves voted Garrett to the top of the list, with Stafford at No. 4 and Puka Nacua at No. 7 after record 2025 seasons.", "url": "https://www.nfl.com/news/top-100-players-of-2026-nos-10-1"}, {"title": "Rams announce 2026 jersey schedule", "why": "When the Rams bust out their new Classic Sol and Fearsome White alternates, including the Thanksgiving Eve Packers game and Week 16 Midnight Rivalry look at Seattle.", "url": "https://www.therams.com/news/rams-announce-2026-jersey-schedule"}], "one_sentence": "Fresh off a humbling 0-1 start in the NFL's first Australia game -- and with franchise pass rusher Myles Garrett now on IR after knee surgery -- the Rams face a must-win Monday Night Football test against the Giants, hoping Aaron Donald's long-awaited return can salvage a defense built to win Super Bowl LXI at SoFi."}]};
const DIGEST_DATA = {"updated_at": "2026-09-17T06:00:22-07:00", "title": "LA Sports Daily Digest — 15-Minute Edition", "read_time": "~15 minutes", "intro": "A bruising Wednesday across Los Angeles sports: the Dodgers saw their NL West coronation delayed by a gut-punch loss and a Blake Snell injury scare, the Rams placed the reigning Defensive Player of the Year on injured reserve, and USC's Jayden Maiava carved up Louisiana for a career-high five touchdowns to keep the Trojans unbeaten. With October baseball and Monday Night Football both looming, every story has stakes.", "intro_zh": "週三的洛杉磯體壇堪稱多事之秋：道奇隊的國聯西區封王典禮因一場悶敗和 Blake Snell 的傷病警報而被迫延期；公羊隊將年度最佳防守球員放進傷兵名單；USC 的 Jayden Maiava 以生涯新高的五次傳球達陣炸裂路易斯安那大學，助特洛伊人保持不敗金身。隨著十月季後賽和週一晚間賽事即將到來，每一則故事都攸關大局。", "segments": [{"team": "Dodgers", "accent": "#2A6FD8", "headline": "Dodgers' coronation on ice: Elly De La Cruz torches L.A. again as Cincinnati delays the party", "headline_zh": "道奇封王派對被迫延期：Elly De La Cruz 再次痛擊洛杉磯，辛辛那提延後慶祝時刻", "analysis": "The Dodgers entered Wednesday needing just one win — or one Padres loss — to clinch their fifth consecutive NL West title. Instead, Elly De La Cruz smacked a two-run homer off Seth Halvorsen in the fifth inning, his fifth home run against Los Angeles this season, powering the Reds to a 6-2 victory that sent the celebration back to the drawing board. The Dodgers went 0-for-11 with runners in scoring position and stranded 12 baserunners, a nightmarish stat line for a lineup that had been one of the most prolific in baseball down the stretch.\n\nWhat makes this loss sting more than the box score suggests is the timing. The Padres beat Colorado 9-3 later that evening, keeping the magic number frozen at one. Any objective observer would say the division is a foregone conclusion — L.A. still leads by five games with 10 remaining — but in a sport where momentum is everything, the Dodgers need to exorcise the demons of Wednesday night before they can toast another title.\n\nThe De La Cruz factor is hard to ignore. The 23-year-old Reds shortstop has turned Dodger Stadium and every other NL West park into his personal playground this year. Five homers against one team in a single season is a stat that jumps off the page, and it raises real questions about how the Dodgers plan to pitch him in October, should they meet Cincinnati again. His combination of raw power and elite speed makes him one of the most dangerous postseason threats in the sport.\n\nOn a broader level, this loss exposed a recurring soft spot: situational hitting. Going 0-for-11 with runners in scoring position is not a fluke against a Reds pitching staff that entered the game with a 4.12 ERA. It's a pattern that has dogged the Dodgers at various points this season — they can score in bunches in low-leverage spots, then go cold when the pressure ratchets up. For a team built to win in October, that inconsistency is a red flag worth watching.\n\nThursday's series finale against Brady Singer (6-14, 5.38) is the ideal reset button. The Reds have nothing to play for, while the Dodgers can clinch the division and redirect their energy toward postseason prep. If there's a silver lining, it's that Wednesday's loss might actually serve as a wake-up call. Championship teams rarely need permission to celebrate — they take what's theirs.", "analysis_zh": "道奇在週三只需要再贏一場——或是教士隊輸球——就能確保連續第五座國聯西區冠軍。然而 Elly De La Cruz 在第五局從 Seth Halvorsen 手中轟出兩分全壘打，這是他本季第五支對道奇的全壘打，助紅人以 6-2 取勝，將封王派對再度推遲。道奇在得點圈有人時 11 打數 0 安打，全場留下 12 名殘壘，這對一支攻擊火力在下半季冠絕全聯盟的球隊來說，是令人沮喪的夜晚。\n\n讓這場失利更加刺痛的是時機。教士稍後以 9-3 擊敗科羅拉多，使道奇的魔術數字仍停在 1。客觀上這座分區冠軍已是囊中之物——道奇仍領先五場、季賽僅剩 10 場——但在棒球這項講究氣勢的運動中，道奇必須先消化週三的挫敗，才能重新站上慶祝的舞台。\n\nDe La Cruz 對道奇的統治力已成本季最突出的對戰數據。這位 23 歲的紅人游擊手已五度轟破道奇，將道奇球場變成了他的私人球場。單季對同一球隊五發全壘打極為罕見，也直接引發了十月季後賽的關鍵問題：道奇該如何對付他？他的 Raw power 搭配精英級腳程，使他成為季後賽中任何投手的噩夢。\n\n更廣泛地說，這場失利暴露了道奇的反覆隱憂：得點圈的攻擊效率。11 打數 0 安打並非紅人投手群的功勞——他們本季防禦率高達 4.12——而是一種模式。道奇在低壓環境下火力驚人，但壓力一升便層層熄火，這對一支以季後賽為終極目標的球隊而言，是極為擔憂的警訊。\n\n週四系列賽最終戰面對 Brady Singer（6-14，ERA 5.38），是完美的重置機會。紅人已無關戰績，道奇封王後即可專注十月備戰。若要說有什麼亮點，那便是這場失利反而可能成為當頭棒喝。冠軍球隊從不等別人給機會——他們親手奪取屬於自己的勝利。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Blake Snell's latest scare: lefty exits after one inning with groin tightness — October rotation now on alert", "headline_zh": "Blake Snell 再傳傷情警報：左投僅投一局即因腹股溝不適退場，十月輪值拉響警報", "analysis": "The Dodgers' October rotation concerns just ratcheted up another notch. Blake Snell lasted only 19 pitches and one inning in Wednesday's start before pulling himself with left groin tightness — the same injury that has haunted him periodically this season. Snell told reporters afterward that he felt his groin 'grab' on the second-to-last pitch of his pregame bullpen, making the fact that he even took the mound at all something of a minor miracle.\n\nSnell said he 'should be good' to make one more regular-season start next week, which would serve as his final tune-up before the postseason. But the Dodgers are taking nothing for granted. They're monitoring the situation closely, and any setback could fundamentally alter their postseason pitching plans. With Ohtani already shut down from pitching for the year, and Yoshinobu Sasaki having missed significant time, the margin for error in the rotation is razor-thin.\n\nContext matters here: Snell signed a five-year, $182 million deal with the Dodgers and has been a persistent source of injury concern since Day 1. His 2026 campaign has been interrupted by shoulder and elbow issues, and now this groin problem adds yet another chapter to his injury-riddled tenure. When healthy, Snell is a Cy Young-caliber arm — his no-hitter at Great American Ball Park last year proved that — but availability has been his Achilles' heel since arriving in Los Angeles.\n\nThe timing couldn't be worse. The Dodgers are 10 days from the postseason, and their rotation picture is murky at best. Tyler Glasnow returned from back spasms on August 25, but his durability remains a question mark. Yoshinobu Sasaki has been in and out of the lineup. The only constant has been Tyler Glasnow when healthy, and the bullpen has had to shoulder an outsized load. Adding another uncertain arm to the postseason equation is the last thing Dave Roberts needs.\n\nFor now, the Dodgers will give Snell the rest he needs and hope for a full recovery before the postseason. But every fan who has watched this team navigate October knows: the rotation is everything, and right now, nothing about it feels settled.", "analysis_zh": "道奇的十月輪值問題又升級了。Blake Snell 在週三先發中僅投 19 球、一局便因左腹股溝不適退場——這項傷勢本季已反覆困擾他。Snell 賽後透露，他在熱身牛棚最後幾球便感覺腹股溝「抓了一下」，他能登板本身已是奇蹟。\n\nSnell 表示他「應該沒問題」能在本週再投一次例行賽作為季後賽前的最後調整。但道奇沒有樂觀的本錢。球團正密切監控任何變化，任何反覆都可能根本性改變季後賽投手布局。在 Ohtani 已確定本季不再投球、Sasaki 也經歷長期缺席的背景下，輪值的容錯空間薄如刀鋒。\n\n必須理解的是：Snell 簽下五年 1.82 億美元合約後，自加盟之日起便與傷病為伍。2026 賽季他已先後因肩部和手肘問題缺陣，如今腹股溝再添變數。健康的 Snell 是賽揚獎級別左投——去年在 GABP 投出無安打比賽便是明證——但「保持可用」始終是他在洛杉磯的致命軟肋。\n\n時間點雪上加霜。道奇距季後賽僅 10 天，輪值前景至多只能說「不明朗」。Tyler Glasnow 8 月 25 日從背部痙攣回歸，但耐久度存疑。Sasaki 來來去去。唯一穩定的是 Glasnow 健康時的表現，牛棚卻已承擔超額局數。在季後賽方程式中再添一個不確定變數，是 Dave Roberts 最不想見到的事。\n\n目前道奇會讓 Snell 充分休息，期盼他能在季前賽前完全恢復。但看過這支球隊征戰十月的每一位球迷都清楚：輪值就是一切，而此刻，一切都懸而未決。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Shohei Ohtani takes first swings off tee, on track to return before season ends", "headline_zh": "Shohei Ohtani 首次從 tee 上揮棒復健，預計季賽結束前歸隊", "analysis": "There is good news on the Ohtani front: the four-time MVP took his first swings off a tee in Los Angeles on Tuesday, and manager Dave Roberts said he 'felt good.' Ohtani has been on the 15-day injured list since September 8 with right biceps inflammation, and while he is not traveling with the team for the current road trip, the expectation is that he will return for at least a handful of regular-season games before the year ends.\n\nThe significance of this update cannot be overstated. Ohtani is the engine that makes the Dodgers' lineup go, even without pitching. His ability to impact the game from the DH spot — with the power, speed, and plate discipline that made him a unanimous MVP — is irreplaceable. The Dodgers' lineup has functioned without him, but it has not been the same. Getting even two or three games of Ohtani action before the postseason would be a massive boost for a team that needs its best player locked in and timing his swings correctly for October.\n\nWhat Ohtani will NOT do is pitch again in 2026. That chapter is closed. The Dodgers shut him down from mound duty after July 3, and he will not throw again until next season. This means the Dodgers' postseason rotation will be built entirely from the arms they have: Glasnow, Snell (health permitting), Wrobleski, and whoever else Roberts trusts out of the bullpen. Ohtani's value in October will come exclusively from his bat.\n\nThe broader question is how this affects the Dodgers' October plans. If Ohtani can return in early October, he could be designated hitter for Game 1 of the Division Series. But if the biceps inflammation lingers or any setback occurs, the Dodgers would lose arguably the most dangerous hitter in baseball from their postseason lineup. That would be a catastrophic blow, not just offensively but psychologically — this team feeds off Ohtani's presence in the lineup.\n\nFor now, the signs are positive. The tee work is the earliest stage of the return-to-play protocol, but it means the inflammation has subsided enough for Ohtani to grip a bat and swing with intent. The next steps — soft toss, live batting practice, then simulated at-bats — will tell the real story. But the clock is ticking, and every day that passes without Ohtani in the lineup is a day the Dodgers are operating at less than full capacity.", "analysis_zh": "Ohtani 方面傳來好消息：這位四屆 MVP 週二在洛杉磯首次從打擊 tee 進行揮棒復健，總教練 Dave Roberts 表示他「感覺良好」。Ohtani 自 9 月 8 日因右二頭肌發炎被列入 15 天傷兵名單，雖然目前不隨隊出征客場，但預期在季賽結束前至少回歸數場比賽。\n\n這項更新的重要性不言而喻。Ohtani 即便不再投球，仍是驅動道奇打線的核心引擎。他在指定打擊位置上的破壞力——結合了 Raw power、頂級腳程與精英選球紀律，正是他全票獲選 MVP 的關鍵——無可取代。道奇在沒有他的情況下仍能運轉，但火力已明顯降級。季後賽前若能獲得哪怕兩三場的 Ohtani 打擊機會，對這支需要當家球星在十月找回節奏的球隊而言，是極大的助力。\n\nOhtani 本季不會再上投手丘。這已成定局。道奇在 7 月 3 日後便讓他停止投球，今年不會再見他登板。這意味著道奇季後賽輪值將完全依靠現有投手群：Glasnow、Snell（若健康）、Wrobleski 及 Roberts 信任的牛棚投手。Ohtani 十月的價值將完全來自球棒。\n\n更廣泛的問題在於這如何影響道奇的季後賽布局。若 Ohtani 能在十月初回歸，他可在分區系列賽首戰擔任指定打擊。但若二頭肌發炎持續或有任何反覆，道奇將失去可能全聯盟最恐怖的打者——這不只是攻擊面的損失，更是心理重創。道奇的整支球隊仰賴 Ohtani 在打線中的存在感。\n\n目前方向看似正確。從 tee 開始揮棒是復健流程的最早階段，代表發炎已消退到足以讓 Ohtani 握棒並有意識地揮擊的程度。接下來的步驟——軟拋球、實戰打擊練習、模擬對決——才是真正考驗。但時間不等人，每一天 Ohtani 缺席打線，道奇就少一分戰力。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Kyle Tucker heating up at last: $240M man's September surge gives Dodgers an October lifeline", "headline_zh": "Kyle Tucker 終於手感火燙：2.4 億美元強打九月大爆發，為道奇十月征程注入強心劑", "analysis": "After one of the most disappointing debut seasons in recent memory — a .226 average and .692 OPS through August — Kyle Tucker is suddenly looking like the $240 million player the Dodgers paid for. Over his last seven games, Tucker has slashed .318 with three home runs and seven RBIs, providing a timely spark that the Dodgers desperately need heading into October.\n\nDave Roberts didn't just let Tucker's resurgence speak for itself. The manager told reporters he held a one-on-one meeting with the outfielder and delivered a blunt message: 'I'm gonna ride or die with him.' That's a remarkable show of loyalty from a manager whose job security, while generally strong, is always under the microscope in Los Angeles. Roberts is betting on Tucker's talent and character, and he's doing it publicly — a move that could either inspire a turnaround or backfire spectacularly.\n\nTucker credited his improvement to a breakthrough with the Dodgers' hitting coach on bat-path mechanics. The adjustments have apparently unlocked something that had been missing all season. Tucker's career numbers — he's a former All-Star with a track record of consistent production — suggested that his first half in L.A. was the aberration, not the norm. If the mechanical fixes are real and sustainable, the Dodgers may have just found the missing piece of their October puzzle.\n\nThe timing is exquisite. With Ohtani still on the injured list and Freddie Freeman dealing with his own ailments, the Dodgers needed someone — anyone — in the middle of the lineup to produce. Tucker's resurgence fills that void perfectly. A lineup that can roll out Ohtani (when healthy), Freeman, Tucker, and Mookie Betts in some order is still one of the most fearsome in baseball. But for months, that lineup existed only in theory. Now, with Tucker heating up, the theoretical becomes plausible.\n\nThe bigger question is whether Tucker can sustain this over a 12-game postseason run. The mechanical changes are encouraging, but the postseason is a different animal — pitchers are sharper, margins are thinner, and the mental pressure is amplified. Tucker has October experience from his Houston days, which counts for something. But this is his first postseason in Dodger blue, and the weight of that $240 million contract will be felt in every at-bat.", "analysis_zh": "在經歷了近年最令人失望的處子賽季——截至八月打擊率僅 .226、OPS .692——Kyle Tucker 近期終於展現出 2.4 億美元身價應有的實力。過去七場比賽，Tucker 打出 .318 打擊率、三支全壘打和七分打點，為道奇注入了十月前急需的攻擊火藥。\n\nDave Roberts 沒有讓 Tucker 的復甦靜悄悄地發生。總教練告訴記者，他與這位外野手進行了一對一會談，直言不諱：「我跟他同生共死。」這對一位在洛杉磯永遠處於放大鏡下的總教練而言，是極具魄力的公開表態。Roberts 在賭 Tucker 的天賦與人格——押在眾目睽睽之下——這要嘛點燃逆轉之火，要嘛引火焚身。\n\nTucker 將改進歸功於與打擊教練在揮棒軌跡上的突破。這些調整顯然解鎖了本季一直缺失的東西。Tucker 的生涯數據——他是一位前全明星球員，有穩定輸出的履歷——暗示他在洛杉磯的前半季才是異常值，而非常態。若機械調整真實且可持續，道奇可能找到了十月拼圖中最關鍵的一塊。\n\n時間點堪稱完美。在 Ohtani 仍在傷兵名單、Freddie Freeman 也帶傷的情況下，道奇需要有人在打線中段挺身而出。Tucker 的復甦正好填補了這個空缺。一支能排出 Ohtani（健康時）、Freeman、Tucker 和 Mookie Betts 的打線，仍是全聯盟最恐怖的攻擊組合之一。但數月來，這條打線只存在於理論中。隨著 Tucker 火力回歸，理論正逐漸化為現實。\n\n更長遠的問題是 Tucker 能否在 12 場季後賽中維持。機械調整令人振奮，但季後賽是另一個世界——投手更精準、差距更小、壓力倍增。Tucker 有在休士頓打季後賽的經驗，這有其價值。但這是他在道奇藍的首次季後賽，2.4 億美元合約的重量將在每個打席中被感受到。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Bubic activated, Ward DFA'd: Dodgers shuffling the deck for the final stretch", "headline_zh": "Kris Bubic 升上一軍、Ryan Ward 遭 DFA：道奇為最後衝刺重新洗牌", "analysis": "The Dodgers made a roster move on Wednesday that speaks directly to their October priorities: they activated right-hander Kris Bubic, the veteran arm they acquired from the Royals at the August 3 trade deadline while he was still injured. In exchange, Ryan Ward was designated for assignment and Paul Gervase was optioned to Triple-A Oklahoma City. It's a move that prioritizes bullpen depth — a critical factor in any postseason run.\n\nBubic's rehab numbers at Triple-A are eye-popping: a 0.00 ERA with nine strikeouts in 5.2 innings. Those are the kind of numbers that get a front office's attention, especially when the major league bullpen has been asked to cover an outsized share of innings due to rotation injuries. Bubic gives the Dodgers a versatile arm who can bridge innings in the middle of games — a role that becomes magnified in October when starting pitchers are often pulled after five or six innings.\n\nThe DFA of Ward is a pragmatic decision. The Dodgers have a logjam of outfield depth, and with Tucker heating up, the need for another bat off the bench diminishes. Bubic, by contrast, fills a clear need: a fresh arm in the bullpen who can eat innings and provide stability. In a bullpen that has been stretched thin by the rotation's injury woes, every fresh arm matters.\n\nThis move also signals the Dodgers' thinking about their postseason roster construction. Teams typically carry 12 pitchers and 13 position players in October, and the final spots on the pitching staff are always fiercely contested. Bubic's inclusion now would suggest the Dodgers value his ability to go multiple innings out of the pen — a weapon that other contenders may not have.\n\nThe timing of this activation is notable. With 10 games remaining in the regular season, Bubic gets a brief audition window before the postseason roster is finalized. If he performs well in low-leverage situations, he could leapfrog other candidates for the final bullpen spot. It's a classic Dodgers move: identify a weakness, address it with precision, and give the new piece just enough runway to prove itself before the stakes get real.", "analysis_zh": "道奇週三進行了一項直接反映十月優先級的名單調整：他們激活了在 8 月 3 日交易大限從皇家隊換來、當時仍在傷病中的右投 Kris Bubic。Ryan Ward 被指定讓渡，Paul Gervase 則被下放至 3A 奧克拉荷馬城。這是一項以牛棚深度為優先的舉動——在任何季後賽征程中，這都是關鍵因素。\n\nBubic 在 3A 的復健數據令人矚目：5.2 局投出 0.00 防禦率和 9 次三振。這些數字足以讓任何球團的前辦公室注意到，特別是當大聯盟牛棚因輪值傷病而被迫承擔超額局數時。Bubic 為道奇提供了一個能吃中繼局數的多用途臂膀——這個角色在十月被放大，因為先發投手往往在五六局後就被換下。\n\nDFA Ward 是務實之舉。道奇的外野深度已出現擁擠，隨著 Tucker 手感回溫，板凳上再需要一棒的需求降低。相比之下，Bubic 填補了一個明確的缺口：牛棚中一支新鮮的臂膀，能吃局數並提供穩定性。在一支因輪值傷病而牛棚被拉長的球隊中，每一支新鮮的臂膀都至關重要。\n\n這項調整也透露了道奇對季後賽名單建構的思路。球隊在十月通常帶 12 名投手和 13 名野手，而投手名單的最後幾個位置永遠競爭激烈。Bubic 目前的入列暗示道奇看重他從牛棚中繼多局的能力——這是其他競爭對手可能不具備的武器。\n\n激活時機值得注意。在例行賽僅剩 10 場的情況下，Bubic 獲得了在季後賽名單定案前的短暫試用期。若他在低壓環境中表現出色，可能超越其他候選人搶下最後一個牛棚位置。這是典型的道奇操作：精準識別弱點、精準補強，並給新武器足夠的跑道在真正高壓來臨前證明自己。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Wrobleski gets the ball Thursday to clinch: All-Star lefty has the chance to seal a dynasty-defining fifth straight title", "headline_zh": "Wrobleski 接下週四封王重任：明星左投有機會親手鎖定連續第五座國聯西區冠軍", "analysis": "When Justin Wrobleski takes the mound Thursday against Cincinnati's Brady Singer, he won't just be pitching for a win — he'll be pitching for a piece of Dodgers history. A victory clinches the NL West, giving Los Angeles its fifth consecutive division title and its 13th in 14 years. It's the kind of milestone that cements a dynasty's legacy, and Wrobleski, the 25-year-old All-Star, has the chance to etch his name into the lore.\n\nWrobleski's 2026 numbers tell the story of a pitcher who has come into his own: 11-5 with a 3.78 ERA in a season where the Dodgers have needed every quality start they can get. He's been their most reliable arm outside of Tyler Glasnow, stepping up when Snell, Sasaki, and the rest of the rotation have been sidelined. His development from a promising prospect to a legitimate mid-rotation arm has been one of the quiet success stories of the Dodgers' season.\n\nThe matchup against Brady Singer (6-14, 5.38) is as lopsided as it gets. Singer has been one of the worst pitchers in the Reds' rotation this year, and Cincinnati has nothing to play for. The Dodgers should be heavy favorites, but Wednesday night's loss is a reminder that baseball doesn't care about paper matchups. The Reds' lineup — anchored by the dangerous De La Cruz — showed they can put runs on the board against anyone.\n\nFor Wrobleski, this start is about more than just the clinch. It's about proving he belongs in the postseason rotation. With Snell's health uncertain and the Dodgers' October depth in question, Wrobleski's performance on Thursday could determine his role in the Division Series. If he pitches well, he could earn a start in the first round. If he falters, the Dodgers may turn to other options.\n\nThe bigger picture is the dynasty itself. Five straight NL West titles would tie the Dodgers' own record and cement this era as one of the most dominant in baseball history. It's not a World Series championship — the Dodgers will tell you that's the only number that matters — but it's a testament to sustained excellence in a sport that punishes complacency. Thursday night, Wrobleski has the chance to add another chapter to a story that has captivated Los Angeles for over a decade.", "analysis_zh": "當 Justin Wrobleski 週四踏上投手丘對陣辛辛那提的 Brady Singer 時，他投的不只是一場勝投——他在為道奇歷史投球。一場勝利即確保國聯西區冠軍，給予洛杉磯連續第五座分區冠軍、14 年來第 13 座。這是奠定王朝傳奇的時刻，25 歲的全明星 Wrobleski 正有機會將自己的名字寫入這段傳奇。\n\nWrobleski 的 2026 數據訴說一位投手蛻變的故事：11 勝 5 敗、防禦率 3.78，在道奇急需每一場優質先發的賽季中，他已成為 Glasnow 之外最可靠的臂膀。在 Snell、Sasaki 及輪值其他成員相繼缺陣時，他挺身而出。從備受期待的新秀成長為中段輪值核心，是道奇本季最被低估的成功故事。\n\n對陣 Brady Singer（6-14，ERA 5.38）在紙面上是壓倒性的優勢。Singer 本季是紅人輪值中表現最差的投手，而辛辛那提已無關戰績。道奇理應被大幅看好，但週三晚間的失利提醒我們：棒球不在乎紙面數據。紅人打線——由危險的 De La Cruz 領銜——證明了他們能對任何投手群得分。\n\n對 Wrobleski 而言，這場先發的意義遠超封王本身。這是證明自己屬於季後賽輪值的機會。在 Snell 健康不確定、道奇十月深度受質疑的背景下，Wrobleski 週四的表現可能決定他在分區系列賽中的角色。投得好，他可能獲得首輪先發；投不好，道奇可能轉向其他方案。\n\n更大的格局是王朝本身。連續五座國聯西區冠軍將追平道奇自己的紀錄，鞏固這個時代作為棒球史上最統治時期之一的地位。這不是世界大賽冠軍——道奇會說那才是唯一重要的數字——但它是在一項懲罰自滿的運動中，持續卓越的最佳見證。週四晚間，Wrobleski 正有機會為這段征服洛杉磯逾十年的故事再添一筆。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "Maiava goes nuclear: five TDs, zero interceptions as No. 14 USC demolishes Louisiana 49-30", "headline_zh": "Maiava 炸裂全場：五次達陣零失誤，No. 14 USC 以 49-30 大勝路易斯安那大學", "analysis": "Jayden Maiava put on a clinic Saturday afternoon. The Trojans quarterback went 19-of-29 for 261 yards with a career-high five touchdowns and zero interceptions in USC's 49-30 demolition of Louisiana. It was the kind of performance that silences doubters and announces — emphatically — that the Trojans are ready for Big Ten play.\n\nThe five-touchdown masterpiece was a complete display of Maiava's skill set. He showed accuracy on short and intermediate routes, the arm strength to stretch the field vertically, and the decision-making to avoid turnovers in what was otherwise a comfortable win. His connection with freshman tight end Mark Bowman was particularly lethal — two of the five touchdowns went to the five-star Mater Dei product, including a 35-yard catch-and-run where Bowman hurdled two defenders in a play that will be on USC's highlight reels for years.\n\nWhat made this performance especially encouraging was the context. USC entered the game 2-0 but had yet to face a true test — both wins came against overmatched opponents. Louisiana, a solid Sun Belt team, provided more resistance than expected, scoring 30 points and keeping the game competitive into the third quarter. Maiava's ability to maintain composure and deliver under that kind of pressure is exactly what Lincoln Riley needs from his quarterback heading into the gauntlet of Big Ten play.\n\nThe offense as a whole looked like the unit USC envisioned when it assembled this roster. The running game provided balance, with Trent Mosley finding the end zone, and the passing attack showed the kind of explosiveness that can keep defensive coordinators up at night. With the receiving weapons USC has — and now Bowman emerging as a legitimate threat at tight end — the Trojans' offense has the firepower to match anyone in the conference.\n\nBut the stat that matters most for USC going forward is the 30 points allowed. Louisiana's offense generated more production than the Trojans would like, and that's an area that Gary Patterson's defense will need to tighten before the Big Ten slate begins. Rutgers may not have the firepower to exploit it this Saturday, but Oregon, Ohio State, and Indiana certainly will.", "analysis_zh": "Jayden Maiava 週六下午上演了教科書級的表演。特洛伊人四分衛 29 次傳球嘗試成功 19 次、261 碼、生涯新高的五次達陣且零失誤，率領 USC 以 49-30 大勝路易斯安那大學。這是一場讓質疑者閉嘴、強有力宣告特洛伊人已準備好迎接大十聯盟賽程的表現。\n\n五次達陣的傑作全面展現了 Maiava 的能力。他在短傳和中距離展現精準度，有足夠臂力拉長縱深傳球，並在贏球的同時做出正確決策避免失誤。他與新秀 tight end Mark Bowman 的連線特別致命——五次達陣中有兩次送給這位五星 Mater Dei 產品，其中包括一次 35 碼的接球推進，Bowman 飛越兩名防守者，這將成為 USC 精華片段中的經典。\n\n這場表現之所以格外令人振奮，在於其背景。USC 以 2 勝 0 敗進入比賽，但尚未經歷真正的考驗——兩場勝利都來自實力懸殊的對手。路易斯安那大學作為一支穩固的 Sun Belt 球隊，提供了比預期更多的阻力，攻下 30 分且在第三節仍維持競爭力。Maiava 在這種壓力下保持冷靜的能力，正是 Lincoln Riley 在進入大十賽程前對四分衛的核心期待。\n\n整體進攻看起來正是 USC 構思這套陣容時想要的模樣。跑陣提供平衡，Trent Mosley 建功達陣；傳球攻勢展現了能讓對方防守協調員徹夜難眠的爆發力。USC 擁有的傳球武器——加上 Bowman 在 tight end 位置崛起為真正威脅——使特洛伊人的攻擊火力足以匹敵大十中任何對手。\n\n但對 USC 未來最重要的數據是失掉的 30 分。路易斯安那的進攻產生了超出特洛伊人期望的產出，這是 Gary Patterson 的防守在大十賽程開始前必須收緊的環節。Rutgers 本週六可能沒有足夠的火力 exploit 這個弱點，但 Oregon、Ohio State 和 Indiana 絕對會。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "Mark Bowman's star turn: five-star freshman TE hurdles two defenders, earns Big Ten Freshman of the Week", "headline_zh": "Mark Bowman 的明星首秀：五星新秀 tight end 飛越兩名防守者，獲選大十聯盟最佳新秀", "analysis": "Mark Bowman's first two career touchdowns came in spectacular fashion. The five-star Mater Dei product — USC's crown jewel in what is currently the nation's No. 1 recruiting class — caught six passes for 83 yards, both team highs, and scored twice in the first half of Saturday's win over Louisiana. His performance earned him Big Ten Freshman of the Week honors, the first of what the Trojans hope will be many.\n\nThe play that will define Bowman's early career came on a 35-yard catch-and-run where the 6-foot-5 tight end hurdled not one but two Louisiana defenders simultaneously. It was a play that combined athleticism, body control, and the kind of fearless mentality that separates blue-chip recruits from the pack. For USC fans, it was a glimpse of the future — a tight end with the physical tools to dominate at the point of attack and the playmaking ability to change games.\n\nBowman's emergence is significant beyond the highlight reel. USC's offense has historically struggled to incorporate tight ends into the passing game, but Lincoln Riley's system has always valued versatile weapons. Bowman gives Riley a player who can line up in-line, in the slot, or detached from the formation, creating matchup nightmares for opposing defenses. His two-touchdown performance was not a fluke — it was a statement of intent.\n\nThe recruitment angle is worth noting. Bowman chose USC over a laundry list of blue-blood programs, drawn by the Bloom Football Performance Center, the coaching staff, and the chance to play in Riley's offense. His early success is already paying dividends on the recruiting trail — five-star recruits are watching their peers thrive, and that creates a feedback loop that could keep USC at the top of the rankings for years to come.\n\nWith Big Ten play beginning this Saturday at Rutgers, Bowman's role will only expand. Conference defenses are more sophisticated than what USC has faced in its first three games, and Riley will need to find creative ways to get Bowman the ball in space. If Saturday's performance is any indication, the freshman tight end is more than ready for the challenge.", "analysis_zh": "Mark Bowman 的前兩次生涯達陣以壯觀的方式到來。這位五星 Mater Dei 產品——USC 目前全國排名第一招募班級中的皇冠明珠——在週六對路易斯安那的比賽中完成六次接球共 83 碼（兩項全隊最高），上半場兩度達陣。他的表現獲選大十聯盟最佳新秀，而特洛伊人期待這只是眾多榮耀的起點。\n\n定義 Bowman 早期職業生涯的 play 是一次 35 碼的接球推進——這位 6 呎 5 吋的 tight end 同時飛越了兩名路易斯安那防守者。這結合了運動能力、身體控制力與無畏心態，正是五星新秀與眾不同之處。對 USC 球迷而言，這是未來的一瞥——一位兼具身體條件與改變比賽能力的 tight end。\n\nBowman 的崛起意義遠超精華片段。USC 進攻歷史上難以將 tight end 融入傳球體系，但 Lincoln Riley 的系統向來重視多功能武器。Bowman 給了 Riley 一位能站 inline、slot 或拉開站位的球員，為對手制造 matchup 噩夢。兩次達陣並非僥倖——而是一份聲明。\n\n招募角度值得關注。Bowman 在一長串頂尖學校中選擇了 USC，被 Bloom Football Performance Center、教練團及 Riley 攻擊體系所吸引。他的早期成功已在招募戰場上產生成效——五星新秀看到同儕的成功，創造了可能讓 USC 維持排名頂端數年的正向循環。\n\n隨著大十聯盟賽程本週六在 Rutgers 開始，Bowman 的角色只會更加重要。聯盟防禦比前三場面對的更為老練，Riley 將需找到創意方式讓 Bowman 在空間中接球。若週六的表現有任何指標意義，這位新秀 tight end 已完全準備好迎接挑戰。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "Patterson's defense turns the corner: Trojans rank 11th nationally in pass defense heading into Big Ten play", "headline_zh": "Patterson 的防守轉骨成功：特洛伊人传球防守全國排名第 11，大十征程蓄勢待發", "analysis": "The most transformative story of USC's 2026 season isn't happening on offense — it's happening on defense. New defensive coordinator Gary Patterson, a College Football Hall of Famer, has elevated the Trojans' defense to a level that would have been unthinkable under the previous coaching staff. Through three games, USC ranks 11th nationally in total defense, allowing just 155.5 passing yards per game, and the improvement is visible in every phase of the game.\n\nPatterson's impact goes beyond the numbers. Safety Kennedy Urlacher has emerged as a genuine playmaker, and the defensive front has been far more disruptive than in years past. The schematic changes — Patterson's signature 4-2-5 alignment, adapted for the talent on hand — have given USC a defensive identity that complements rather than conflicts with Riley's high-octane offense. For the first time in the Lincoln Riley era, USC doesn't have to outscore everyone to win.\n\nThe timing of this defensive emergence is critical. Big Ten play presents an entirely different animal — physical, run-heavy teams that will test USC's toughness at the point of attack. Ohio State and Oregon, in particular, feature offensive lines that can dominate in the trenches. If Patterson's defense can hold up against that level of physicality, USC's ceiling in the conference rises dramatically.\n\nThe Patterson hiring was questioned by some when it was announced. His TCU teams were known for defense, yes, but the college football landscape had shifted dramatically since his peak years. Could the old-school defensive mind adapt to the modern spread offenses that dominate the sport? Through three games, the answer appears to be a resounding yes. Patterson has not only adapted — he has thrived, blending his traditional defensive principles with modern concepts to create something that looks like the best of both worlds.\n\nThe real test begins Saturday at Rutgers. The Scarlet Knights are 0-2 and may not provide the stiffest challenge, but Big Ten openers are often about establishing an identity rather than just winning a game. If USC can dominate a conference opponent in the way it dominated Louisiana — with balanced offense and suffocating defense — it will send a message to the rest of the Big Ten that the Trojans are not just visiting the conference. They intend to conquer it.", "analysis_zh": "USC 2026 賽季最具變革性的故事不在進攻端——而在防守端。新任防守協調員 Gary Patterson，大學名人堂成員，已將特洛伊人的防守提升至前教練團隊時期難以想像的水準。三場比賽下來，USC 全國防守排名第 11，每場僅失 155.5 傳球碼，每一階段的改進都清晰可見。\n\nPatterson 的影響超越數據。安全衛 Kennedy Urlacher 崛起為真正的失誤製造者，防守前線的侵略性遠勝往年。戰術調整——Patterson 標誌性的 4-2-5 陣型根據現有人才調整——賦予 USC 一個與 Riley 高速進攻互補的防守 Identity。在 Lincoln Riley 時代以來，USC 第一次不需要靠得分壓倒所有人來贏球。\n\n這波防守崛起的時機至關重要。大十聯盟賽程是完全不同的挑戰——體能型、以跑陣為主的球隊將考驗 USC 的硬度。特別是 Ohio State 和 Oregon 擁有能在 trenches 主宰的進攻鋒線。若 Patterson 的防守能在這種對抗中站穩，USC 的聯盟天花板將戲劇性地提升。\n\nPatterson 的聘用宣布時曾遭質疑。他的 TCU 球隊以防守聞名，但大學足球在他巔峰年後已劇變。老派防守思維能否適應主宰這項運動的現代 spread offense？三場比賽下來，答案是響亮的「可以」。Patterson 不只適應——他蓬勃發展，將傳統原則與現代概念融合，創造兩全其美的結果。\n\n真正考驗本週六在 Rutgers 開始。Scarlet Knights 0-2，可能不是最嚴峻的挑戰，但大十開幕戰往往是建立 Identity 而非僅贏球的時刻。若 USC 能以對路易斯安那的方式——平衡進攻加窒息防守——統治聯盟對手，將向大十其餘球隊宣告：特洛伊人不只是來參訪，他們要來征服。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "Big Ten awaits: No. 14 USC heads to Piscataway for conference opener at Rutgers", "headline_zh": "大十聯盟在前方：No. 14 USC 前往 Piscataway 展開大十開幕戰", "analysis": "The non-conference portion of USC's schedule is done. The Trojans went 3-0, outscoring their opponents by a combined 105-66, and now the real season begins. Saturday's Big Ten opener at Rutgers (0-2) is the appetizer — a road game at SHI Stadium in Piscataway, N.J., with a 3:30 p.m. ET kickoff — but the courses that follow are the ones that will define USC's 2026 campaign.\n\nRutgers presents a manageable first challenge. The Scarlet Knights are 0-2 and have been outclassed in both losses, but Greg Schiano's teams are always physical and well-prepared. Rutgers will try to slow the game down with a ball-control offense and force USC into the kind of low-scoring, grind-it-out game that negates the Trojans' speed advantage. It's a classic Big Ten trap game, and USC will need to avoid the mental letdown that often follows a blowout win.\n\nThe schedule beyond Rutgers is where things get truly daunting. October brings Oregon — the defending Big Ten champion — to the Coliseum, followed by road trips to Penn State and Michigan. November features Indiana and a finale at Ohio State. That's three top-10 teams in the final six weeks of the season, each on the road. If USC can navigate that gauntlet with two or fewer losses, it will have earned a spot in the Big Ten Championship Game.\n\nThe No. 14 ranking is both validation and motivation. USC is ranked high enough to be taken seriously but low enough to be overlooked by the teams at the top of the conference. The Trojans have the offense to compete with anyone — Maiava's 5-TD performance proved that — and now they have the defense, courtesy of Patterson, to back it up. The question is whether they can sustain both sides of the ball over a 10-game conference grind.\n\nFor Lincoln Riley, this season represents a crossroads. He came to USC to win championships, not just games. The Trojans have improved every year under his leadership, but the breakthrough — a conference title, a College Football Playoff appearance — has remained elusive. Big Ten play offers the stage. Whether USC seizes the moment will depend on how they respond to their first real adversity — and that could come as early as Saturday in Piscataway.", "analysis_zh": "USC 的非聯盟賽程已結束。特洛伊人以 3 勝 0 敗收場，合計以 105-66 的比分優勢碾壓對手，真正的賽季現在才開始。週六在 Rutgers（0-2）的大十開幕戰是前菜——新澤西州 Piscataway 的 SHI Stadium 客場比賽，東部時間下午 3:30 開球——但接下來的賽程才是真正定義 USC 2026 賽季的主菜。\n\nRutgers 呈現了一個 manageable 的首戰挑戰。Scarlet Knights 0-2，兩場敗仗都被拉開差距，但 Greg Schiano 的球隊向來體能強悍、準備充分。Rutgers 會試圖用控球進攻放慢節奏，迫使 USC 進入低分消耗戰，以抵消特洛伊人的速度優勢。這是經典的大十陷阱賽，USC 必須避免大勝後常見的鬆懈。\n\nRutgers 之後的賽程才是真正的噩夢。十月 Oregon——衛冕大十冠軍——來到 Coliseum，隨後客場挑戰 Penn State 和 Michigan。十一月有 Indiana，收官戰在 Ohio State。六週內三支前十球隊，全在客場。若 USC 能以兩場或更少敗仗走過這段炼獄，就將爭奪大十冠軍賽席位。\n\n第 14 名既是肯定也是動力。排名足以被認真對待，但又低到被聯盟頂端球隊忽視。特洛伊人擁有能與任何人競爭的進攻——Maiava 的五次達陣已證明——如今加上 Patterson 帶來的防守。問題是能否在 10 場聯盟賽程中同時維持兩端表現。\n\n對 Lincoln Riley 而言，本季是十字路口。他來 USC 是為了贏冠軍。特洛伊人每年都在進步，但突破——聯盟冠軍、季後賽席位——始終遙不可及。大十賽程提供了舞台。USC 能否抓住時刻，取決於他們面對第一次真正逆境時的回應——而那一刻可能最早在週六的 Piscataway 就會到來。"}, {"team": "Rams", "accent": "#003594", "headline": "Garrett gone: Rams place reigning DPOY on IR after knee surgery — Week 6 return is the earliest possible date", "headline_zh": "Garrett 缺陣：公羊將年度最佳防守球員送進傷兵名單，膝蓋手術後最早第六週才能歸隊", "analysis": "The Myles Garrett trade was supposed to be the move that put the Rams over the top. Instead, six weeks into the season, the reigning Defensive Player of the Year is headed for arthroscopic knee surgery and injured reserve. Sean McVay confirmed Wednesday that Garrett will undergo the procedure and miss at least four games, with a Week 6 return against Arizona representing the absolute earliest possible timeline.\n\nThe numbers paint a grim picture. Garrett — who was voted the NFL's No. 1 player by his peers — went 0-tackle in his Rams debut against the 49ers in Australia, managing only five pressures against Trent Williams. McVay admitted the team expected Garrett's knee to be manageable, 'and that wasn't necessarily the case.' Garrett himself acknowledged after the Melbourne game that he was worried about the knee and wasn't himself. For a player who set the NFL single-season sack record with 23 in 2025, being a non-factor in his debut is a devastating reality check.\n\nThe trade cost was enormous. The Rams sent a 2027 first-round pick, a 2028 second-round pick, and a 2029 third-round pick to Cleveland, plus edge rusher Jared Verse. That's three draft picks and a proven pass rusher for a player who may now miss a quarter of his first season in Los Angeles. If Garrett's knee doesn't fully heal, the Rams will have mortgaged significant future capital for a diminished version of a dominant player.\n\nThe injury also compounds an already dire situation in the Rams' pass rush. Without Garrett, the Rams generated zero sacks against the 49ers — a game where Brock Purdy had all day to throw. Aaron Donald's potential return to Monday Night Football offers a lifeline, but even Donald at 35, after a 2.5-year retirement, cannot single-handedly replace the production of a healthy Garrett. The two were supposed to terrorize quarterbacks together. Instead, the Rams may have to choose between them based on health.\n\nThe psychological impact is real. The Rams built this roster to win Super Bowl LXI at SoFi Stadium. Every move — the Garrett trade, the Donald unretirement, the Stafford extension — was designed with that singular goal in mind. Now, with Garrett on IR, the window hasn't closed, but it has narrowed considerably. McVay has 15 games to figure out how to win without his best defensive player, and that task just got immeasurably harder.", "analysis_zh": "交易 Myles Garrett 原本是讓公羊更上一層樓的關鍵之舉。然而賽季僅過六週，這位年度最佳防守球員卻即將接受膝蓋關節鏡手術並被放進傷兵名單。Sean McVay 週三確認 Garrett 將進行手術並至少缺陣四場，最早第六週對亞利桑那才能回歸——這是最早可能的時間線。\n\n數據描繪了嚴峻的畫面。Garrett——被同儕票選為 NFL 第 1 名球員——在澳洲對 49ers 的處子秀中零次擒抱，面對 Trent Williams 僅施加 5 次壓力。McVay 承認球團原以為 Garrett 的膝蓋可以控制，「但情況並非如此」。Garrett 本人也坦承擔心膝蓋且不在最佳狀態。對一位 2025 年以 23 次擒殺創 NFL 單季紀錄的球員而言，處子秀的平淡是沉重的現實。\n\n交易代價極其巨大。公羊送出 2027 年首輪籤、2028 年次輪籤、2029 年三輪籤及 edge rusher Jared Verse。三個選秀籤加一位已證明自己的 pass rusher，換來的卻是一位可能缺席首季四分之一的球員。若 Garrett 膝蓋無法完全恢復，公羊便是以巨大未來資本換來一位巔峰球員的降級版本。\n\n傷病也加重了公羊 pass rush 本已岌岌可危的局面。沒有 Garrett，公羊對 49ers 零次擒殺——Brock Purdy 在那場比賽中傳球時間綽綽有餘。Aaron Donald 回歸 MNF 提供了生機，但 35 歲的 Donald 退役 2.5 年後也無法獨自填補健康 Garrett 的產出。兩人本應攜手恐嚇四分衛，公羊卻可能不得不根據健康狀況在兩人間做選擇。\n\n心理衝擊真實存在。公羊建構這套名單是為了在 SoFi 贏得 Super Bowl LXI。每項操作——Garrett 交易、Donald 復出、Stafford 續約——都以單一目標為核心。如今 Garrett 進入傷兵名單，窗口未關但已大幅收窄。McVay 有 15 場比賽 figuring 如何在沒有最佳防守球員下贏球，任務難度已變得無可估量。"}, {"team": "Rams", "accent": "#003594", "headline": "Aaron Donald's long-awaited return: unretired legend has 'very, very realistic chance' to debut vs. Giants on MNF", "headline_zh": "Aaron Donald 千呼萬喚始歸來：復出傳奇有「非常非常真實的機會」在週一晚間賽對巨人上演首秀", "analysis": "The most fascinating storyline in the NFL this week doesn't involve a trade, a draft pick, or a coaching change. It involves a 35-year-old defensive tackle who retired, watched his replacement get hurt, and decided to come back. Aaron Donald — the five-time first-team All-Pro, the most dominant defensive lineman of his generation — has a 'very, very realistic chance' of playing against the Giants on Monday Night Football, according to NFL Network's Ian Rapoport.\n\nDonald's return is the kind of story that transcends sports. He retired after the 2023 season, walked away from the game for approximately 2.5 years, and then answered the call when McVay reached out following the Garrett trade. The terms were significant: a one-year, $20 million deal that could reach $30 million with playoff incentives. That's a massive commitment for a player who hadn't taken a competitive snap in over 750 days.\n\nThe question isn't whether Donald can still play at a high level — his physical condition has reportedly been excellent throughout his retirement, and he's been training with an intensity that suggests he never truly stopped preparing. The question is whether one player, even one as transcendent as Donald, can single-handedly transform a defense that was gashed for 27 points by the 49ers in Week 1. The answer is almost certainly no, but his presence alone changes the calculus for opposing offenses.\n\nGiants coach John Harbaugh has already acknowledged that New York is preparing as if Donald will play. That's a significant admission — it means the mere possibility of Donald's presence is forcing the Giants to adjust their game plan. Offensive coordinators will have to account for a player they haven't had to scheme against in over two years, and that uncertainty creates advantages for the rest of the Rams' defense.\n\nIf Donald does play Monday night, it will be one of the most-watched regular-season games in recent memory. The combination of a 0-1 Rams team in desperate need of a win, a returning legend, and the spectacle of Monday Night Football creates a perfect storm of intrigue. Whether the Rams can capitalize on that energy and pull out a victory is another question entirely — but the mere fact that Donald is back, that he chose to come back to this specific team at this specific moment, tells you everything about what this season means to the Rams organization.", "analysis_zh": "本週 NFL 最引人入勝的故事不涉及交易、選秀權或教練異動。它涉及一位 35 歲的防守截鋒——退休、看著替代者受傷，然後決定回來。Aaron Donald——五度一線 All-Pro、當代最具統治力的防守線球員——根據 NFL Network 的 Ian Rapoport，有「非常非常真實的機會」在週一晚間賽對巨人上演首秀。\n\nDonald 的回歸是超越體育本身的故事。他在 2023 賽季後退休，離開約 2.5 年，然後在 Garrett 交易後 McVay 聯繫時答應復出。條件具誠意：一年 2000 萬美元合約，季後賽激勵最高可達 3000 萬。對一位超過 750 天未參加正式比賽的球員而言，是巨大的投入。\n\n問題不在於 Donald 能否保持水準——據報導他的身體在退休期間維持極佳水平，訓練強度也暗示他從未停止準備。問題在於一位球員能否獨自改變一支在第一週被 49ers 攻下 27 分的防守。答案幾乎肯定是「不能」，但他的存在本身就改變了對手進攻的計算。\n\n巨人教練 John Harbaugh 已承認紐約以 Donald 會出賽的狀態做準備。這代表僅僅是他可能出場的可能，就迫使巨人調整計劃。進攻協調員必須針對一位他們已超過兩年未比賽計劃的球員，而這種不確定性為公羊其餘防守者創造了優勢。\n\n若 Donald 週一真的出賽，將是近年觀注度最高的例行賽之一。一支 0-1 急需勝利的公羊、歸來的傳奇、加上 MNF 舞台，創造了完美戲劇風暴。公羊能否利用這股能量拿下勝利是另一個問題——但 Donald 選擇在這個特定時刻回到這支特定球隊的事實，已說明了這個賽季對公羊組織的意義。"}, {"team": "Rams", "accent": "#003594", "headline": "The Melbourne debacle: Rams humbled 27-7 by 49ers before 100,000 fans in NFL's first-ever Australia game", "headline_zh": "墨爾本的災難：公羊在 NFL 史上首次澳洲賽事中被 49ers 以 27-7 痛擊，十萬球迷見證", "analysis": "The NFL's first-ever game in Australia was supposed to be a celebration of the sport's global ambitions. Instead, it became a nightmare for the Rams. Before a crowd of 100,021 at the Melbourne Cricket Ground — the seventh-largest regular-season attendance in NFL history and the largest crowd ever for an NFL game outside North America — the Rams were thoroughly outclassed by the 49ers in a 27-7 defeat.\n\nMatthew Stafford completed 15 of 25 passes for 155 yards with an interception. Myles Garrett, the reigning Defensive Player of the Year, went tackleless with five pressures against Trent Williams. The Rams' offense managed just 213 total yards and couldn't sustain drives, while the defense had no answer for Brock Purdy's three-touchdown performance. Kyren Williams scored the NFL's first-ever touchdown in Australia on a 5-yard run in the second quarter, but it was the only bright spot in an otherwise bleak afternoon.\n\nThe atmosphere was extraordinary. The MCG — a venue built for cricket and Australian rules football — was transformed into an NFL cathedral for one afternoon. The 100,021 fans created an energy that rivaled any Super Bowl. But for the Rams, that energy quickly turned into pressure as the 49ers built a lead and never looked back. Sean McVay called it a 'good humbling day' — a diplomatic way of saying his team was thoroughly outplayed.\n\nThe game exposed a fundamental truth about the 2026 Rams: they are not yet the team they thought they were. The offseason moves — Garrett, Donald, Stafford's extension — were designed to create a Super Bowl contender. But a contender needs to perform in games that matter, and this one mattered. The Rams went to Australia as the presumed favorites, with their star-studded roster and McVay's offensive genius, and they came home with a loss that exposed every weakness in their armor.\n\nLooking back, the Melbourne game may be the moment that defined the Rams' season — for better or worse. If they rally and make a deep playoff run, it will be remembered as the wake-up call that started it all. If they falter, it will be remembered as the first sign that the star power wasn't enough.", "analysis_zh": "NFL 史上首次在澳洲的比賽，原本應是慶祝這項運動全球雄心的盛事。然而對公羊而言卻變成了噩夢。在 MCG 的 100,021 名觀眾面前——NFL 歷史上第七大例行賽 attendance，北美以外最大型 NFL 比賽人群——公羊被 49ers 以 27-7 徹底擊敗。\n\nMatthew Stafford 25 次傳球成功 15 次、155 碼、一次抄截。年度最佳防守球員 Myles Garrett 零次擒抱、僅 5 次壓力。公羊進攻僅 213 碼且無法維持 drive，防守對 Brock Purdy 的三次達陣毫無招架之力。Kyren Williams 在第二節以 5 碼跑陣拿下 NFL 在澳洲歷史性首個達陣，但在灰暗的下午中是唯一亮點。\n\n現場氛圍極其震撼。MCG——一座為板球和澳式足球建造的場地——在一個下午被改造成 NFL 殿堂。100,021 名觀眾創造的能量可比擬任何超級碗。但隨著 49ers 拉開領先，這股能量迅速轉化為壓力。McVay 稱之為「很好的敲打」——是球隊被全面壓制的 diplomatically 表述。\n\n這場比賽暴露了 2026 公羊的基本真相：他們尚未成為自己以為的那支球隊。休賽期操作——Garrett、Donald、Stafford 續約——旨在打造超級碗競爭者。但競爭者需要在重要比賽中表現。公羊帶著星光名單前往澳洲，帶著一場暴露所有弱點的敗仗回家。\n\n回頭看，墨爾本之戰可能定義了公羊的賽季——無論好壞。若逆轉並在季後賽走得更遠，這將是警鐘；若 falter，這將是星光不足的第一個徵兆。"}, {"team": "Rams", "accent": "#003594", "headline": "Must-win Monday: 0-1 Rams host Giants at SoFi in Week 2, needing to avoid an 0-2 death spiral", "headline_zh": "週一必勝：0-1 公羊在 SoFi 迎戰巨人，力求避免 0-2 的死亡螺旋", "analysis": "The Rams return home to SoFi Stadium on Monday night for what has already become a must-win game. At 0-1, Los Angeles cannot afford to fall to 0-2 — statistically, teams that start the season 0-2 make the playoffs less than 12% of the time. The Giants (0-1 as well) present a beatable opponent, but the Rams' laundry list of injuries makes even this matchup concerning.\n\nThe injury report is long and concerning. Myles Garrett is now on IR. Safety Kam Curl is dealing with an ankle issue. Linebacker Nate Landman has shoulder and thumb injuries. Tight end Davis Allen is in concussion protocol. And Omar Speights is nursing a hip pointer. That's five potential starters dealing with health issues on a defense that already couldn't stop the 49ers. McVay offered 'positive' updates on Curl, Landman, and Allen, but the sheer volume of names on the report is troubling.\n\nThe Giants, meanwhile, are an 0-1 team that is not without talent. John Harbaugh's squad has offensive weapons and a defense that can create problems. But they are also coming off a loss, they're traveling cross-country, and they'll be playing in a hostile environment. If there was ever a game for the Rams to reassert themselves, this is it — a home game against a beatable opponent, with the entire national audience watching on ESPN/ABC.\n\nAaron Donald's potential debut adds an element of theater to the proceedings. If Donald plays, it will be his first NFL game since the 2023 season, and the SoFi crowd will be electric. But the Rams cannot rely on sentiment alone. They need Stafford to play like the No. 4 player in the NFL, they need Puka Nacua to dominate the Giants' secondary, and they need the defense to generate pressure — something they failed to do against the 49ers.\n\nMonday night is a referendum on the Rams' identity. Are they the star-studded juggernaut that was supposed to compete for a Super Bowl, or are they a team whose sum is less than its parts? The first two games will provide early answers, and the Rams need to make a statement. A loss to the Giants, at home, on Monday Night Football, would be catastrophic — not just for the standings, but for the psyche of a team that was built to win now.", "analysis_zh": "公羊週一晚間回到 SoFi Stadium，迎來一場已成為必勝之戰的比賽。0 勝 1 敗的洛杉磯不能再掉到 0-2——統計顯示，以 0-2 開季的球隊闖進季後賽的機率不到 12%。巨人（同為 0-1）是可擊敗的對手，但公羊的傷病名單使這場對決也令人擔憂。\n\n傷病報告冗長且令人擔憂。Myles Garrett 已進 IR。安全衛 Kam Curl 腳踝不適。線衛 Nate Landman 肩膀和拇指受傷。tight end Davis Allen 在腦震盪協議中。Omar Speights 處理臀部挫傷。這是五名可能先發的健康問題，而防守本就擋不住 49ers。McVay 對 Curl、Landman 和 Allen 提供了「正面」更新，但 sheer 的數量令人不安。\n\n巨人方面，這支 0-1 球隊並非沒有 talent。John Harbaugh 的 squad 擁有進攻武器和能制造問題的防禦。但他們同樣剛經歷敗仗，跨越全國旅行，將在敵對環境比賽。若有一場比賽讓公羊重新證明自己，就是這場——主場對可擊敗的對手，全國觀眾在 ESPN/ABC 觀看。\n\nAaron Donald 的 potential 首秀增添了一層戲劇性。若出賽，這將是他自 2023 賽季以來的首場 NFL 比賽，SoFi 眾將沸騰。但公羊不能僅靠情感。他們需要 Stafford 打出 NFL 第 4 球員的水準，Puka Nacua 統治巨人後場，防守產生壓力——對 49ers 時做不到的事。\n\n週一晚間是公羊 Identity 的公投。他們是競爭超級碗的星光 jumbo，還是整體小於部分之和的球隊？前兩場比賽將提供答案，公羊需要做出聲明。在主場、在 MNF 上輸給巨人，將是災難性的——不只是排名，更是對一支 built to win now 的球隊的心理重擊。"}, {"team": "Rams", "accent": "#003594", "headline": "Top 100 revelation: Garrett crowned NFL's No. 1 player, Stafford lands at No. 4 — both now lead a 0-1 team", "headline_zh": "Top 100 揭曉：Garrett 加冕 NFL 第 1 名球員、Stafford 排名第 4——兩人如今率領一支 0-1 球隊", "analysis": "The NFL's annual Top 100 Players list, voted on by the players themselves, delivered a result that underscores both the Rams' ambition and their current predicament. Myles Garrett was named the No. 1 player in the league — the first Ram ever to claim that distinction — while Matthew Stafford came in at No. 4 and Puka Nacua at No. 7. Three Rams in the top 10, and all three are now tasked with rescuing a 0-1 season.\n\nThe irony is thick. Garrett, fresh off a record-breaking 23-sack season in Cleveland that included being the first player since 1990 to top 20 sacks and 30 tackles for loss in a single season, was traded to the Rams specifically to elevate them from good to great. Instead, he's on IR after a 0-tackle debut. Stafford, at 38, proved last season that he still has elite-level play left in him — his MVP-caliber 2025 campaign was the reason the Rams were willing to commit to him long-term. And Nacua, coming off a historic receiving season, is the kind of young star that can carry a franchise for a decade.\n\nBut rankings are retrospective. They reflect what players did last season, not what they're doing now. And right now, the Rams' top-10 players are leading a team that was just beaten by 20 points on a global stage. The gap between reputation and reality is the central tension of the Rams' 2026 season, and it's a gap that can only be closed on the field.\n\nThe players' vote is significant because it reflects peer respect — the kind of recognition that comes from competing against someone, not just watching highlights. Garrett's selection as No. 1 speaks to the fear he instills in opposing offenses. Stafford's No. 4 ranking reflects his consistency and durability. Nacua's No. 7 shows that the league's players recognize his ascent as one of the game's premier receivers. But none of that matters if the Rams can't convert individual brilliance into team success.\n\nMonday night against the Giants is the first opportunity to bridge that gap. If Garrett's injury wasn't enough of a wake-up call, the Top 100 rankings should be. The Rams have the talent to compete with anyone. They now need to prove that the sum of their parts can be greater than any individual ranking — and that the only number that truly matters is the one in the win column.", "analysis_zh": "NFL 年度 Top 100 球員名單——由球員自己投票——揭曉了一個既凸顯公羊雄心又反映其現狀的結果。Myles Garrett 被票選為聯盟第 1 名球員——公羊史上首位獲此殊榮者——Matthew Stafford 排名第 4，Puka Nacua 排名第 7。三名公羊躋身前十，如今肩負著拯救 0-1 賽季的重任。\n\n諷刺意味濃厚。Garrett 剛在克利夫蘭度過創紀錄的 23 次擒殺賽季——1990 年以來首位單季突破 20 次擒殺和 30 次 TFL 的球員——被交易至公羊正是為了從「好」提升到「偉大」。結果處子秀零次擒抱後便進 IR。38 歲的 Stafford 上賽季證明仍有精英級水準——2025 的 MVP 級別表現是公羊長期投資他的原因。Nacua 在歷史性接球賽季後成為能承載球隊十年的年輕巨星。\n\n但排名是回顧性的，反映上賽季表現。公羊排名前十的球員帶領的是一支剛在全球舞台上被拉開 20 分的球隊。聲望與現實的落差是公羊 2026 賽季的核心張力，只能在球場上彌合。\n\n球員投票反映同儕的尊重——來自親身對抗而非精華片段的認可。Garrett 第 1 名反映他引發的恐懼，Stafford 第 4 名反映一致性，Nacua 第 7 名表明聯盟認可他的崛起。但若無法將個人才華轉化為團隊成功，這些都毫無意義。\n\n週一晚間對巨人是彌合落差的首次機會。若 Garrett 的傷病還不夠警醒，Top 100 應該是。公羊擁有能與任何人競爭的 talent，現在需要證明整體大於部分之和——唯一真正重要的數字是勝場欄中的那一個。"}], "closing": "Wednesday was a reminder that in Los Angeles, sports never slow down. The Dodgers' coronation is delayed but not denied — Wrobleski takes the mound Thursday with a chance to clinch. USC has announced itself as a legitimate Big Ten contender, with Maiava and Patterson leading a resurgence that has the college football world on notice. And the Rams face a Monday night reckoning at SoFi, where the return of Aaron Donald and the loss of Myles Garrett have set the stage for one of the most dramatic Week 2 games in recent memory. Buckle up, LA. It's going to be a wild ride to the finish.", "closing_zh": "週三提醒我們，在洛杉磯，體育從不停歇。道奇的封王典禮被推遲但並非被否定——Wrobleski 週四登板，有機會親手鎖定冠軍。USC 已宣告自己是大十聯盟的真正競爭者，Maiava 和 Patterson 領銜的復甦已讓大學足球界為之側目。而公羊將在週一晚間迎來一場 SoFi 的清算——Aaron Donald 的歸來和 Myles Garrett 的缺陣，為近年來最具戲劇性的第二週比賽搭好了舞台。繫好安全帶，洛杉磯。通往終點的旅程將會是一場狂野的冒險。"};
let lang = "en";
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmtPT(iso){ return new Date(iso).toLocaleString("en-US",{timeZone:"America/Los_Angeles",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"})+" PT"; }

function renderDigest(d){
  const box = document.getElementById("digest");
  if(!d || !d.segments){
    box.innerHTML = '<div style="text-align:center;color:var(--dim);padding:40px">No digest yet</div>';
    return;
  }
  const segs = d.segments.map(s=>{
    const headline = lang==="en" ? s.headline : s.headline_zh;
    const analysis = lang==="en" ? s.analysis : s.analysis_zh;
    return '<div class="seg" style="--team:'+esc(s.accent)+'">' +
      '<div class="row"><span class="hn">'+esc(headline)+'</span><span class="badge">'+esc(s.team)+'</span></div>' +
      '<div class="lbl">'+(lang==="en"?"Analysis":"分析")+'</div><p>'+esc(analysis)+'</p>' +
      '</div>';
  }).join("");
  box.innerHTML =
    '<div class="dhead">' +
      '<div class="t"><div class="mic">🎙️</div><div><h2>'+esc(d.title)+'</h2><div class="meta">' +
        esc(d.read_time || "")+' · '+fmtPT(d.updated_at)+
        ' · 繁中/EN</div></div></div>' +
      '<div class="langs">'+
        '<button id="btnEn" class="on" onclick="setLang(\'en\')">EN</button>'+
        '<button id="btnZh" onclick="setLang(\'zh\')">繁體中文</button>'+
      '</div>' +
    '</div>' +
    '<div class="intro">'+esc(lang==="en"?d.intro:d.intro_zh)+'</div>' +
    '<div class="segs">'+segs+'</div>' +
    '<div class="closing">'+esc(lang==="en"?d.closing:d.closing_zh)+'</div>';
}
function setLang(v){ lang = v; document.getElementById("btnEn").classList.toggle("on", v==="en"); document.getElementById("btnZh").classList.toggle("on", v==="zh"); renderDigest(DIGEST_DATA); }

function renderNews(d){ const upd = document.getElementById("upd"); if(upd) upd.textContent = fmtPT(d.updated_at);
  const g = document.getElementById("grid"); g.innerHTML = "";
  for(const t of d.teams){
    const c = document.createElement("div"); c.className = "card"; c.style.setProperty("--team", t.accent);
    const emoji = t.emoji==="Baseball"?"⚾":t.emoji==="Football"?"🏈":"🏆";
    c.innerHTML =
      '<div class="top"><div class="ico">' + emoji + '</div>' +
      '<div><div class="name">' + esc(t.name) + '</div><div class="rec">' + t.sport + ' · ' + esc(t.record) + '</div></div></div>' +
      '<div class="hline">' + esc(t.headline) + '</div>' +
      '<h3>Latest News</h3><ul class="news">' + t.latest_news.map(n =>
        '<li><a target="_blank" rel="noopener" href="' + esc(n.url) + '">' + esc(n.title) + '</a><p>' + esc(n.summary) + '</p></li>'
      ).join("") + '</ul>' +
      '<h3>Fun Facts</h3><ul class="facts">' + t.fun_facts.map(f => '<li>'+esc(f)+'</li>').join("") + '</ul>' +
      '<h3>Further Reading</h3><ul class="read">' + t.further_reading.map(f =>
        '<li><a target="_blank" rel="noopener" href="' + esc(f.url) + '"><span>'+esc(f.title)+'</span><span class="why">'+esc(f.why)+'</span></a></li>'
      ).join("") + '</ul>' +
      '<div class="oss">' + esc(t.one_sentence) + '</div>';
    g.appendChild(c);
  }
}

renderDigest(DIGEST_DATA);
renderNews(TEAMS_DATA);
</script>
</body>
</html>
