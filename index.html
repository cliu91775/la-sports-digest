<style>
  :root{
    --bg:#0b0e14; --panel:rgba(255,255,255,.04); --panel2:rgba(255,255,255,.02);
    --line:rgba(255,255,255,.08); --fg:#edf2fa; --dim:#8a94a6;
    --radius:18px; --glow:0 0 0 1px rgba(255,255,255,.04), 0 24px 60px -30px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 500px at 20% -10%, rgba(42,111,216,.18), transparent 60%),
      radial-gradient(1000px 500px at 90% -10%, rgba(153,0,0,.14), transparent 60%),
      radial-gradient(900px 400px at 50% 110%, rgba(31,78,156,.16), transparent 60%),
      var(--bg);
    color:var(--fg); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
    padding:28px clamp(16px,4vw,64px) 64px;
  }
  header{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:26px}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{
    width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;
    background:linear-gradient(135deg,#2a6fd8,#991111);box-shadow:0 8px 30px -8px rgba(60,90,220,.6);
  }
  h1{font-size:clamp(22px,3vw,32px);font-weight:800;letter-spacing:-.02em}
  .sub{color:var(--dim);font-size:13px;margin-top:4px}
  .ticker{
    font-size:12px;color:var(--dim);padding:8px 14px;border-radius:99px;
    background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);
  }
  .ticker b{color:#7ce38b}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:20px}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;backdrop-filter:blur(14px);box-shadow:var(--glow);position:relative;overflow:hidden;

  .card::before{

  .top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .ico{
    width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;

  }
  .name{font-size:18px;font-weight:800;letter-spacing:-.01em}
  .rec{font-size:11px;color:var(--team);font-weight:700;margin-top:2px}
  .hline{font-size:13px;line-height:1.5;color:var(--dim);padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);margin-bottom:16px}

  .news li:hover{border-color:color-mix(in srgb,var(--team) 50%, transparent);transform:translateX(3px)}
  .news a{color:var(--fg);text-decoration:none;font-weight:700;font-size:13px;display:block;margin-bottom:4px}
  .news a:hover{color:var(--team)}
  .news p{font-size:12px;color:var(--dim);line-height:1.5}
  .facts{list-style:none;display:grid;gap:6px}
  .facts li{position:relative;padding:2px 0 2px 18px;font-size:12.5px;color:var(--fg);line-height:1.55}
  .facts li::before{content:"⚡";position:absolute;left:0;top:2px;font-size:11px;filter:grayscale(.4)}
  .read{list-style:none;display:grid;gap:6px}
  .read a{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12.5px;color:var(--fg);text-decoration:none;padding:9px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
  .read a:hover{color:var(--team);border-color:color-mix(in srgb,var(--team) 50%, transparent)}
  .read .why{font-size:11px;color:var(--dim)}
  .oss{font-size:12.5px;line-height:1.6;color:var(--fg);background:linear-gradient(90deg,color-mix(in srgb,var(--team) 18%,transparent),transparent);border-left:3px solid var(--team);padding:10px 14px;border-radius:0 12px 12px 0;margin-top:16px}
  banner{display:block;text-align:center;color:var(--dim);font-size:13px;margin-top:22px}
  banner span{color:#7ce38b;animation:blink 1.5s infinite}
  @keyframes blink{50%{opacity:.3}}
  .spin{width:100%;height:100px;display:grid;place-items:center;color:var(--dim)}
  /* ---- digest ---- */
  .digest{
    background:linear-gradient(135deg,rgba(42,111,216,.12),rgba(153,0,0,.10),rgba(31,78,156,.12)),var(--panel);
    border:1px solid var(--line);border-radius:var(--radius);padding:26px;
    backdrop-filter:blur(14px);box-shadow:var(--glow);margin-bottom:22px;
  }

  .dhead .t{display:flex;align-items:center;gap:12px}
  .mic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:linear-gradient(135deg,#2a6fd8,#991111)}
  .dhead h2{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .dhead .meta{color:var(--dim);font-size:12px;margin-top:3px}
  .langs{display:flex;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:4px}
  .langs button{border:0;background:transparent;color:var(--dim);font-size:12px;font-weight:700;padding:6px 16px;border-radius:99px;cursor:pointer;transition:.2s}
  .langs button.on{background:linear-gradient(135deg,#2a6fd8,#1f4e9c);color:#fff}
  .intro{font-size:14px;line-height:1.65;color:var(--fg);max-width:820px;margin-bottom:18px}
  .segs{display:grid;gap:12px}
  .seg{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--panel2)}
  .seg .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .seg .row .hn{font-weight:800;font-size:14.5px}
  .seg .badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--team,#2a6fd8) 20%,transparent);color:var(--team);white-space:nowrap}
  .seg p{font-size:12.5px;line-height:1.6;color:var(--dim);margin-top:6px}
  .seg p.cls{color:var(--fg)}
  .seg .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin-top:10px;font-weight:700}
  .closing{font-size:14px;line-height:1.6;border-top:1px dashed var(--line);margin-top:16px;padding-top:14px;color:var(--fg)}
</style>

erams.com/news/"}, {"title": "Sean McVay's Plan for a Healthy Matthew Stafford After MVP Season", "why": "Breaks down the Rams' conservative approach to managing their 38-year-old franchise QB.", "url": "https://heavy.com/sports/nfl/los-angeles-rams/rams-sean-mcvay-matthew-stafford-approach/"}, {"title": "Aaron Donald Decision Updates: Rumors, News on Rams Return", "why": "Tracks the evolving situation around Donald's potential comeback from retirement.", "url": "https://www.usatoday.com/story/sports/nfl/rams/2026/08/06/aaron-donald-rams-decision-updates-latest-rumors-return--live/91200988007/"}], "one_sentence": "The Rams kicked off 2026 preseason with a 20-12 win over the Chiefs as rookie Ty Simpson impressed, while Puka Nacua's psoas soreness and Aaron Donald's possible comeback loom over a team coming off a 12-5 NFC Championship run."}]};
const DIGEST_DATA = {"updated_at": "2026-08-17T01:30:00.000Z", "title": "LA Sports Daily Digest — 15-Minute Edition", "read_time": "~15 minutes", "intro": "Good evening, Los Angeles. This is your Monday night briefing — a city caught between a baseball team in crisis and two football programs on the rise. The Dodgers limp into Denver on a 5-11 skid that has exposed real fault lines in a roster built for October. USC opens camp ranked No. 14 with a schedule that reads like a gauntlet. And the Rams? They just beat the defending champions in a preseason game while their biggest stars heal. Let's get into it.", "intro_zh": "洛杉磯的球迷朋友們晚安。這是你們的週一夜間快報——這座城市正處於一支陷入危機的棒球隊與兩支崛起的足球隊之間。道奇隊以5勝11敗的低迷戰績前往丹佛，這場滑鐵盧暴露出這支為十月季後賽打造的球隊的真實裂痕。南加大以全美第14名的身份開訓，賽程表簡直是一場煉獄。而公羊隊呢？他們剛在季前賽擊敗了衛冕冠軍，而他們的球星正在養傷。讓我們一起來看看。", "segments": [{"team": "Dodgers", "accent": "#2A6FD8", "headline": "Dodgers in Free Fall: Roberts Sounds Alarm as Pitching Help Arrives", "headline_zh": "道奇隊陷入自由落體：Roberts拉響警報，投手增援即將到來", "analysis": "Dave Roberts didn't mince words after Sunday's 6-2 loss to Milwaukee. \"We need to be better,\" he said, and the numbers back him up — the Dodgers have dropped 11 of their last 16, their worst stretch since the early-season slump. They just ceded the season series to the Brewers 4-3, meaning Milwaukee owns the tiebreaker for NL playoff seeding. At 74-51, the record still looks fine on paper, but this team is hemorrhaging confidence at exactly the wrong time.\n\nThe good news? Help is actually arriving. Tyler Glasnow struck out eight in 3.2 innings for Triple-A Oklahoma City and will make one final rehab start Aug. 19 before rejoining the rotation on the road trip to Atlanta and Detroit. Justin Wrobleski landed on the IL with left forearm inflammation after pushing to a career-high 126 1/3 innings — Roberts confirmed he'll move to the bullpen when Glasnow returns. And Shohei Ohtani threw 34 pitches with his full mix in his first bullpen session since the July setback, targeting an early-to-mid September game return. That's three arms that could reshape this rotation for October, but the Dodgers need to survive August first.\n\nKyle Tucker's home/road splits are becoming a legitimate concern. The $240 million offseason acquisition is hitting .192/.290/.276 at Dodger Stadium versus .275/.371/.469 on the road — an almost inexplicable gap for a player of his caliber. Roberts sat him Saturday after a 0-for-19 series against Milwaukee, calling it a \"work day.\" Tucker's visible frustration is starting to become a storyline of its own. Meanwhile, catcher Will Smith is targeting a Sept. 1 return from his neck injury, having taken batting practice on the field and is expected to begin a rehab assignment next week. The lineup is getting deeper, but the urgency is real — the Dodgers head to Coors Field on a team-wide slump with a diminished tiebreaker edge. The NL's best run differential at +136 and the top Power Ranking won't matter if this team doesn't find its identity in the next three weeks.", "analysis_zh": "Dave Roberts在週日以6-2輸給密爾瓦基後毫不掩飾。「我們需要做得更好，」他說，數據也支持他的說法——道奇隊在最近16場比賽中輸了11場，這是自季初低迷以來最糟糕的一段時期。他們剛把本季對戰系列賽以4-3輸給了釀酒人，這意味著密爾瓦基在國聯季後賽 seeding 的 tiebreaker 上佔有優勢。74勝51敗的戰績在紙面上看起來還不錯，但這支球隊正在最不該失去信心的時候大量流失信心。\n\n好消息是？增援實際上正在到來。Tyler Glasnow在3A奧克拉荷馬城出賽3.2局飆出8次三振，將在8月19日進行最後一次復健先發，然後在亞特蘭底特律的客場之旅中歸隊。Justin Wrobleski因左前臂發炎被放入15天傷兵名單，在生涯新高的126 1/3局後倒下——Roberts確認在Glasnow歸隊後，Wrobleski將轉往牛棚。而Shohei Ohtani在自七月傷退後首次進行牛棚投球，投了34球並使用完整球路組合，目標在九月初登板。這三位投手可能為十月的輪值帶來改變，但道奇隊首先得熬過八月。\n\nKyle Tucker的主客場數據差距正成為一個真正的擔憂。這位 offseason以2.4億美元簽下的球員，在道奇球場的打擊率僅為.192/.290/.276，而在客場則是.275/.371/.469——對這種等級的球員來說，這種差距幾乎難以解釋。Roberts在週六讓他在板凳上休息，稱之為「工作日」，Tucker在對釀酒人的系列賽中0支19安打。Tucker的明顯沮喪本身正在成為一個話題。與此同時，捕手Will Smith正以9月1日作為從頸部傷勢復出的目標，目前已在場上進行打擊練習，預計下周開始復健 assignment。打線正在變得更深，但緊迫感是真實的——道奇隊在全隊低迷的情況下前往庫爾斯球場，且tiebreaker優勢已減弱。國聯最佳的+136得分差和排名第一的戰力評估，如果這支球隊在未來三週內找不到自己的身份認同，都將毫無意義。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Max Muncy Makes History, Skubal Still Winless, and the 5-11 Stretch That Has LA Nervous", "headline_zh": "Max Muncy創造歷史，Skubal仍難求一勝，這段5勝11敗的低迷期讓洛杉磯緊張不安", "analysis": "While the losses pile up, Max Muncy quietly etched his name into the record books. He passed Eric Karros for the most home runs hit at Dodger Stadium in the venue's 64-year history — a milestone that speaks to his remarkable consistency in a Dodger uniform, even if this season hasn't been his best. It's a reminder that even in a down stretch, individual brilliance can still shine through.\n\nThe Skubal situation is more troubling. Tarik Skubal, acquired in the blockbuster trade deadline deal from Detroit, is still searching for his first win as a Dodger after three starts. That's a Cy Young-caliber arm that hasn't yet clicked in LA, and with the postseason approaching, the Dodgers need him to find his form immediately. The trade was supposed to be the move that put them over the top — right now it's looking like a work in progress.\n\nThe 5-11 stretch is the real story here. The Dodgers have been swept by both the Red Sox and Cubs in that span, and the offense has gone cold at precisely the wrong time. Roberts called out both sides of the ball after the Milwaukee series, and for good reason. At 74-51, they still hold a comfortable lead in the NL West, but the Brewers and Braves are closing in for the top-two seeds. The Dodgers need to find answers — fast — before this slide becomes a full-blown crisis. The raw talent is there. The results are not.", "analysis_zh": "在輸球不斷的同時，Max Muncy悄然地在歷史長河中刻下了自己的名字。他超越了Eric Karros，成為道奇球場64年歷史上在這個場地擊出最多全壘打的球員——這個里程碑彰顯了他在道奇球衣下 remarkable 的一致性，即使本季並非他的最佳賽季。這提醒我們，即使在低迷時期，個人的輝煌依然能夠閃耀。\n\nSkubal的情況更令人擔憂。從底特律在交易大限的重磅交易中獲得的王牌投手Tarik Skubal，在三次先發後仍然未能取得他在道奇的首場勝利。這是一個賽揚獎等級的臂膀，卻尚未在洛杉磯找到默契，而隨著季後賽逼近，道奇隊需要他立即找到狀態。這筆交易本應是讓他們更上一層樓的關鍵之舉——目前看起來還在磨合中。\n\n5勝11敗的低迷期才是這裡真正的焦點。道奇隊在這段期間被紅襪和小熊橫掃，而打線恰好在最不該冷卻的時候熄火。Roberts在密爾瓦基系列賽後公開批評了攻防兩端，理由充分。以74勝51敗的戰績，他們在國聯西區仍保持著舒適的領先，但釀酒人和勇士正在逼近前兩名的位置。道奇隊需要在這場滑坡演變成全面危機之前，盡快找到答案。天賦是有的。結果卻不然。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "Trojans Ranked No. 14 with the Nation's Toughest Mid-Season Gauntlet Ahead", "headline_zh": "特洛伊人排名第14，面臨全美最艱難的中段賽程挑戰", "analysis": "USC checked in at No. 14 in the preseason AP Poll — a number that feels both earned and almost cruel given what lies ahead. The Trojans will face five ranked Big Ten opponents in a six-week stretch starting Sep. 26: No. 2 Oregon, No. 1 Ohio State, No. 6 Indiana, No. 17 Washington, and No. 18 Penn State. That's three teams that played in the 2025 College Football Playoff. Eight Big Ten teams made the poll, the most of any conference, and USC's schedule is rated 19th hardest nationally by ESPN's FPI.\n\nHere's what makes this interesting: Jayden Maiava is the real deal at quarterback. Lincoln Riley says the \"best is yet to come\" for his redshirt-senior signal-caller, who led the nation with a 91.2 QBR in 2025, throwing for 3,711 yards and 24 touchdowns. He's on the Maxwell Award Watch List, earned Big Ten Preseason Honors, and landed on the Wuerffel Trophy Watch List. USC has Heisman history — eight winners, the most ever — and Maiava is positioning himself as a legitimate candidate.\n\nThe roster is deep where it matters. The running back room features Waymond Jordan, who averaged 6.5 yards per carry before his season-ending injury last year, alongside breakout star King Miller (972 yards). Freshmen Redeaux and Shahn add elite depth with 1,400-plus yard high school seasons each. The concern is up front: projected starting center Kilian O'Connor suffered a season-ending injury in camp, forcing Tobias Raymond to slide into the role. In a conference where the trenches decide championships, that's a significant blow. The Bloom Football Performance Center — a 163,000-square-foot, $225 million crown jewel with AI-powered massage chairs and a rooftop deck overlooking the Hollywood Sign — is the program's first on-campus football-only facility in 636 days of construction. It's a recruiting weapon, and it's already paying dividends. But none of that matters if the offensive line can't hold up against Ohio State's defensive front on Halloween night. The schedule is a murderer's row. The talent is undeniable. The question is whether USC can survive the gauntlet.", "analysis_zh": "南加大在季前美聯社民調中位列第14——考慮到接下來的賽程，這個數字既實至名歸又近乎殘酷。特洛伊人將在六週內面對五支排名的Big Ten對手，從9月26日開始：排名第2的俄勒岡、排名第1的俄亥俄州立、排名第6的印第安納、排名第17的華盛頓和排名第18的賓州州立。這是三支參加了2025年大學足球季後賽的球隊。八支Big Ten球隊進入民調，是所有聯盟中最多的，而南加大的賽程被ESPN的FPI評為全美第19難。\n\n這裡有趣的地方是：Jayden Maiava在四分衛位置上是貨真價實的。Lincoln Riley表示這位紅衫大四指揮官的「最佳時刻尚未到來」，他在2025年以91.2的QBR領先全國，傳出3,711碼和24次達陣。他入選了Maxwell Award觀察名單、獲得Big Ten季前榮譽，並入選了Wuerffel Trophy觀察名單。南加大有海斯曼獎的歷史——8位得主，史上最多——而Maiava正在將自己定位為一位真正的競爭者。\n\n球員名單在關鍵位置上人才濟濟。跑衛陣容包括Waymond去年受傷前平均每 carry 6.5碼的表現，加上爆發性球星King Miller（972碼）。新秀Redeaux和Shahn各自在高中有1,400碼以上的表現，提供了頂級深度。擔憂在於前線：預計先發center Kilian O'Connor在訓練營中遭受赛季报销傷勢，迫使Tobias Raymond轉移至這個位置。在一個由前線決定冠軍的聯盟中，這是一個重大打擊。Bloom足球表現中心——一座163,000平方英尺、耗資2.25億美元的傑作，配備AI按摩椅和可眺望好萊塢標誌的屋頂露台——是該校史上首個校園內足球專用設施，歷時636天建造完成。這是一個招募武器，已經開始產生回報。但如果進攻線無法在萬聖節夜對抗俄亥俄州立的防守前線，這一切都毫無意義。賽程是死亡之組。天賦無可否認。問題是南加大能否在這場煉獄中存活下來。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "Defensive Depth Chart Crystallizes: Crawford at EDGE1, Healthy Corners, and the Nickel Battle", "headline_zh": "防守深度表成型：Crawford擔任EDGE1、角衛健康回歸、Nickel位置競爭白熱化", "analysis": "Halfway through fall camp, USC's defensive depth chart is taking shape — and there are some compelling storylines. Kameryn Crawford has emerged as the clear EDGE1, a designation that signals a pass-rush upgrade the Trojans desperately need in a conference dominated by elite quarterback play. Alex VanSumeren has surprised at defensive tackle, giving USC a disruptive interior presence that was missing last season.\n\nThe secondary is where the most encouraging news lies. Jontez Williams and Chasen Johnson, both sidelined with spring injuries, are now healthy and locked down at cornerback. Their availability transforms a position of concern into one of strength. The nickel spot remains a genuine competition between Kennedy Urlacher and Alex Graham — both talented players who bring different skill sets to the position. In modern college football, the nickel is practically a starter, and whoever wins that job will be critical against the spread offenses USC faces in Big Ten play.\n\nThe concern on defense is depth behind the starters. USC's schedule demands that the rotation stay fresh through a brutal October stretch. If the defensive line can generate pressure — and Crawford's emergence is a positive sign — the secondary has the talent to make plays. But the margin for error is razor-thin when you're facing five ranked opponents in six weeks. The defense needs to be the backbone of a team that might need to win ugly in some of those marquee matchups. The pieces are there. Now it's about execution under pressure.", "analysis_zh": "訓練營過半，南加大的防守深度表逐漸成型——其中有幾個引人入勝的故事線。Kameryn Crawford已成為明確的EDGE1，這個 designation 標誌著特洛伊人迫切需要的傳球衝擊升級，因為這個聯盟由精英級別的四分衛主導。Alex VanSumeren在防守 tackles 位置上令人驚喜，為南加大提供了一個上賽季缺失的內線破壞力。\n\n二線防線是最令人振奮的消息所在。Jontez Williams和Chasen Johnson——兩人都在春季受傷——現在已完全健康並在cornerback位置上鎖定先發。他們的可用性將一個擔憂的位置轉化為優勢。Nickel位置仍然是Kennedy Urlacher和Alex Graham之間的真正競爭——兩位才華橫溢的球員帶來不同的技能組合。在現代大學足球中，nickel實際上是先發球員，誰贏得這個工作將對南加大在Big Ten比賽中面對的spread offense至關重要。\n\n防守上的擔憂在於先發後面的深度。南加大的賽程要求輪換在殘酷的十月賽程中保持新鮮。如果防守前線能夠產生壓力——Crawford的崛起是一個正面信號——二線有能力做出 plays。但在六週內面對五支排名對手時，容錯空間極其狹小。防守需要成為這支可能在一些頂級對決中以醜陋方式贏球的球隊的脊梁。拼圖已經就位。現在是在壓力下的執行力問題。"}, {"team": "Rams", "accent": "#003594", "headline": "Simpson Shines in Preseason Debut as Rams Top Chiefs 20-12", "headline_zh": "Simpson季前賽首秀閃耀，公羊以20-12擊敗酋長", "analysis": "The Rams opened their 2026 preseason with a 20-12 victory over the Kansas City Chiefs, and the headline story was rookie first-round pick Ty Simpson. The young quarterback commanded the offense with poise that belied his inexperience, showing the kind of composure that makes you understand why the Rams invested premium draft capital in him. Stetson Bennett IV also saw action, keeping the backup quarterback competition alive and well.\n\nBut the real story in Woodland Hills is the health situation around the stars. Puka Nacua left joint practice with the Cowboys early with deep core muscle (psoas) soreness — Sean McVay emphasized they're \"just being smart\" with their record-setting receiver, who led the NFL with 129 receptions last season and became just the second player ever to record over 2,000 combined regular season and playoff receiving yards in a single postseason run. McVay expects Nacua back at practice next week, fully healthy.\n\nMyles Garrett was also held out of joint practice with Dallas due to knee soreness — the star defensive end had already missed four days earlier in camp before returning. The Rams are managing their premium assets carefully, and for good reason. This is a team that went 12-5 last season and lost the NFC Championship Game 27-31 to Seattle. They know what they're building toward. Matthew Stafford is coming off a career-best 2025 campaign — 4,707 passing yards, 40 touchdowns, his first career MVP award — and at 38, the Rams are wisely managing his workload heading into his 18th NFL season. The offense led the league in scoring at 30.5 points per game last year, and with Nacua, Stafford, and a defense featuring Garrett, this team has legitimate Super Bowl aspirations. The preseason opener was a solid first step. Now the question is whether they can stay healthy through September and October.\n\nAnd then there's Aaron Donald. The three-time Defensive Player of the Year, who retired after the 2023 season, worked out with the Rams on Aug. 4 as he weighs a comeback. McVay said Donald \"looked great\" — no small compliment for a player of his caliber. No final decision has been made, but the mere possibility of Donald returning to pair with Garrett on the same defensive line is enough to make every offensive coordinator in the NFC lose sleep. The Rams are building something special in 2026. The pieces are aligning. The health is the variable.", "analysis_zh": "公羊隊以20-12擊敗堪薩斯城酋長隊，開啟了他們的2026季前賽，而頭條故事是新秀首輪選秀Ty Simpson。這位年輕四分衛以超越其經驗的沉穩指揮進攻，展現出讓你理解公羊隊為何投入高順位選秀資產的那種冷靜。Stetson Bennett IV也獲得出場機會，讓backup四分衛的競爭保持活躍。\n\n但伍德蘭山丘的真正焦點是球星的健康狀況。Puka Nacua在與牛仔隊的聯合訓練中因深層核心肌肉（psoas）痠痛提早離場——Sean McVay強調他們「只是對這位破紀錄的接球手保持謹慎」，Nacua去年以129次接球領先NFL，並成為史上第二位在單季季後賽中累積超過2,000碼常規賽加季後賽接球碼數的球員。McVay預計Nacua將在下週恢復完全健康的練習。\n\nMyles Garrett也因膝蓋痠痛缺席了與達拉斯的聯合訓練——這位明星 defensive end 本週稍早已經缺席了四天後才回歸。公羊隊正在謹慎管理他們的頂級資產，理由充分。這是一支去年12勝5敗、在NFC冠軍賽以27-31輸給西雅圖的球隊。他們知道自己在朝什麼方向努力。Matthew Stafford剛結束他職業生涯最佳的2025赛季——4,707碼傳球、40次達陣、職業生涯首座MVP獎盃——在38歲之際，公羊隊明智地在進入他第18個NFL賽季時管理他的工作量。去年進攻以每場30.5分的得分率領先全聯盟，擁有Nacua、Stafford和包括Garrett在內的防守，這支球隊有著真正的Super Bowl野心。季前賽首戰是 solid 的第一步。現在的問題是他們能否在九月和十月保持健康。\n\n還有Aaron Donald。這位在2023赛季後退休的三度年度最佳防守球員，於8月4日與公羊隊進行了訓練，正在考慮復出。McVay說Donald「看起來很棒」——對這種等級的球員來說，這可不是小 compliment。尚未做出最終決定，但Donald可能復出與Garrett在同一條防守線上的 mere 可能性，就足以讓NFC的每一位進攻 coordinator 失眠。公羊隊正在2026年打造 something special。拼圖正在 align。健康是那個變數。"}, {"team": "Rams", "accent": "#003594", "headline": "Stafford's MVP Form, the Donald Question, and Why the Rams Are LA's Best Bet in 2026", "headline_zh": "Stafford的MVP等級表現、Donald的懸而未決，以及為何公羊是洛杉磯2026年最佳選擇", "analysis": "Let's zoom out for a moment. The Rams are coming off a 12-5 season that ended one game short of the Super Bowl. Matthew Stafford won his first career MVP award, throwing for 4,707 yards and 40 touchdowns while leading the NFL's highest-scoring offense at 30.5 points per game. Puka Nacua set the single-season reception record at 129 and became a postseason legend. This team knows how to win, and they've added Myles Garrett to a defense that already had teeth.\n\nThe preseason opener against the Chiefs — a 20-12 win — was about more than the final score. Ty Simpson's debut showed the Rams have a developmental quarterback plan beyond Stafford, which is crucial for a franchise that needs to think about life after its 38-year-old MVP. Simpson's poise in the pocket and command of the offense suggest the Rams nailed their first-round pick. The backup quarterback situation between Simpson and Stetson Bennett IV will be worth watching through the rest of the preseason.\n\nBut the elephant in the room is Aaron Donald. If the three-time Defensive Player of the Year actually comes out of retirement to join Garrett on that defensive line, the Rams instantly become the most feared front seven in football. McVay's comment that Donald \"looked great\" in his Aug. 4 workout isn't just coach-speak — it's a signal that this possibility is genuinely alive. The Rams are managing Nacua's core soreness and Garrett's knee with extreme caution, prioritizing long-term health over preseason reps. That's the approach of a team that knows its window is right now. Stafford's arm, Nacua's hands, Garrett's rush, and maybe — just maybe — Donald's return. In a city where the Dodgers are spiraling and USC faces a schedule from hell, the Rams might be LA's most complete team heading into the fall. The preseason said as much. Now they need to prove it when the games count.", "analysis_zh": "讓我們先拉遠鏡頭看看。公羊隊剛結束一個12勝5敗的赛季，距離Super Bowl只差一場比賽。Matthew Stafford贏得了職業生涯首座MVP獎盃，傳出4,707碼和40次達陣，同時帶領NFL得分最高的進攻，場均30.5分。Puka Nacua以129次接球創下單季紀錄，並成為季後賽傳奇。這支球隊知道如何贏球，而且他們已經為本來就有 teeth 的防守添加了Myles Garrett。\n\n對酋長隊的季前賽首戰——20-12的勝利——意義超越了最終比分。Ty Simpson的首秀表明公羊隊在Stafford之外有著發展型四分衛計劃，這對於需要思考38歲MVP之後生活的球隊來說至關重要。Simpson在口袋中的沉穩和對進攻的掌控表明公羊隊在首輪選秀上選對了人。Simpson和Stetson Bennett IV之間的backup四分衛競爭將在季前賽剩餘期間值得關注。\n\n但房間裡的大象是Aaron Donald。如果這位三度年度最佳防守球員真的從退休中復出，與Garrett在同一條防守線上並肩作戰，公羊隊將立即成為足球中最令人畏懼的前七人組。McVay說Donald在8月4日的訓練中「看起來很棒」不僅僅是教練的套話——它是一個信號，表明這個可能性是真實存在的。公羊隊正在極度謹慎地管理Nacua的核心痠痛和Garrett的膝蓋，將長期健康置於季前賽出場時間之上。這是一支知道自己的窗口就在現在的球隊的做法。Stafford的手臂、Nacua的雙手、Garrett的衝擊，以及可能——只是可能——Donald的回歸。在這座道奇隊正在 spiral、南加大面臨地獄般賽程的城市裡，公羊隊可能是洛杉磯進入秋季時最完整的球隊。季前賽就是如此證明的。現在他們需要在比賽真正計分時證明這一點。"}], "closing": "That's your Monday night briefing, Los Angeles. The Dodgers are in crisis mode but reinforcements are on the way — Glasnow, Smith, and eventually Ohtani could transform this rotation by September. USC opens camp ranked 14th with the nation's most daunting mid-season stretch: five ranked Big Ten opponents in six weeks. The talent is there, but the schedule is unforgiving. And the Rams? They might be the city's best hope for a championship in 2026. Stafford is an MVP, Nacua is a star, Garrett changes the defense, and Aaron Donald might just come back. The preseason opener was a statement. The regular season can't come fast enough. Enjoy your Monday night, LA. We'll be back tomorrow.", "closing_zh": "這就是你的週一夜間快報，洛杉磯。道奇隊正處於危機模式，但增援正在路上——Glasnow、Smith，以及最終的Ohtani可能在九月前改變這支輪值。南加大以全美第14名開訓，面臨最艱難的中段賽程：六週內五支排名的Big Ten對手。天賦是有的，但賽程毫不留情。而公羊隊呢？他們可能是這座城市2026年冠軍的最佳希望。Stafford是MVP，Nacua是明星，Garrett改變了防守，而Aaron Donald可能 just 可能會回來。季前賽首戰是一次宣告。例行賽迫不及待。享受你的週一夜晚，洛杉矶。我們明天見。"};
let lang = "en";
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function renderDigest(d){
  const box = document.getElementById("digest");
  if(!d || !d.segments){
    box.innerHTML = '<div style="text-align:center;color:var(--dim);padding:40px">No digest yet</div>';
    return;
  }
  const segs = d.segments.map(s=>{
    const headline = lang==="en" ? s.headline : s.headline_zh;
    const analysis = lang==="en" ? s.analysis : s.analysis_zh;
    return '<div class="seg" style="--team:'+esc(s.accent)+'">' +
      '<div class="row"><span class="hn">'+esc(headline)+'</span><span class="badge">'+esc(s.team)+'</span></div>' +
      '<div class="lbl">'+(lang==="en"?"Analysis":"分析")+'</div><p>'+esc(analysis)+'</p>' +
      '</div>';
  }).join("");
  box.innerHTML =
    '<div class="dhead">' +
      '<div class="t"><div class="mic">🎙️</div><div><h2>'+esc(d.title)+'</h2><div class="meta">' +
        esc(d.read_time || "")+' · '+new Date(d.updated_at).toLocaleString()+
        ' · 繁中/EN</div></div></div>' +
      '<div class="langs">'+
        '<button id="btnEn" class="on" onclick="setLang(\'en\')">EN</button>'+
        '<button id="btnZh" onclick="setLang(\'zh\')">繁體中文</button>'+
      '</div>' +
    '</div>' +
    '<div class="intro">'+esc(lang==="en"?d.intro:d.intro_zh)+'</div>' +
    '<div class="segs">'+segs+'</div>' +
    '<div class="closing">'+esc(lang==="en"?d.closing:d.closing_zh)+'</div>';
}
function setLang(v){ lang = v; document.getElementById("btnEn").classList.toggle("on", v==="en"); document.getElementById("btnZh").classList.toggle("on", v==="zh"); renderDigest(DIGEST_DATA); }

function renderNews(d){ document.getElementById("upd").textContent = new Date(d.updated_at).toLocaleString();
  const g = document.getElementById("grid"); g.innerHTML = "";
  for(const t of d.teams){
    const c = document.createElement("div"); c.className = "card"; c.style.setProperty("--team", t.accent);
    const emoji = t.emoji==="Baseball"?"⚾":t.emoji==="Football"?"🏈":"🏆";
    c.innerHTML =
      '<div class="top"><div class="ico">' + emoji + '</div>' +
      '<div><div class="name">' + esc(t.name) + '</div><div class="rec">' + t.sport + ' · ' + esc(t.record) + '</div></div></div>' +
      '<div class="hline">' + esc(t.headline) + '</div>' +
      '<h3>Latest News</h3><ul class="news">' + t.latest_news.map(n =>
        '<li><a target="_blank" rel="noopener" href="' + esc(n.url) + '">' + esc(n.title) + '</a><p>' + esc(n.summary) + '</p></li>'
      ).join("") + '</ul>' +
      '<h3>Fun Facts</h3><ul class="facts">' + t.fun_facts.map(f => '<li>'+esc(f)+'</li>').join("") + '</ul>' +
      '<h3>Further Reading</h3><ul class="read">' + t.further_reading.map(f =>
        '<li><a target="_blank" rel="noopener" href="' + esc(f.url) + '"><span>'+esc(f.title)+'</span><span class="why">'+esc(f.why)+'</span></a></li>'
      ).join("") + '</ul>' +
      '<div class="oss">' + esc(t.one_sentence) + '</div>';
    g.appendChild(c);
  }
}

renderDigest(DIGEST_DATA);
renderNews(TEAMS_DATA);
</script>
