<style>
  :root{
    --bg:#0b0e14; --panel:rgba(255,255,255,.04); --panel2:rgba(255,255,255,.02);
    --line:rgba(255,255,255,.08); --fg:#edf2fa; --dim:#8a94a6;
    --radius:18px; --glow:0 0 0 1px rgba(255,255,255,.04), 0 24px 60px -30px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 500px at 20% -10%, rgba(42,111,216,.18), transparent 60%),
      radial-gradient(1000px 500px at 90% -10%, rgba(153,0,0,.14), transparent 60%),
      radial-gradient(900px 400px at 50% 110%, rgba(31,78,156,.16), transparent 60%),
      var(--bg);
    color:var(--fg); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
    padding:28px clamp(16px,4vw,64px) 64px;
  }
  header{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:26px}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{
    width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;
    background:linear-gradient(135deg,#2a6fd8,#991111);box-shadow:0 8px 30px -8px rgba(60,90,220,.6);
  }
  h1{font-size:clamp(22px,3vw,32px);font-weight:800;letter-spacing:-.02em}
  .sub{color:var(--dim);font-size:13px;margin-top:4px}
  .ticker{
    font-size:12px;color:var(--dim);padding:8px 14px;border-radius:99px;
    background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);
  }
  .ticker b{color:#7ce38b}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:20px}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;backdrop-filter:blur(14px);box-shadow:var(--glow);position:relative;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--team,#2a6fd8),transparent);
  }
  .top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .ico{
    width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;
    background:color-mix(in srgb,var(--team) 22%, transparent);
  }
  .name{font-size:18px;font-weight:800;letter-spacing:-.01em}
  .rec{font-size:11px;color:var(--team);font-weight:700;margin-top:2px}
  .hline{font-size:13px;line-height:1.5;color:var(--dim);padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);margin-bottom:16px}
  h3{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
  h3::after{content:"";flex:1;height:1px;background:var(--line)}
  .news{list-style:none}
  .news li{padding:10px 12px;border-radius:12px;margin-bottom:6px;background:var(--panel2);border:1px solid var(--line);transition:.2s}
  .news li:hover{border-color:color-mix(in srgb,var(--team) 50%, transparent);transform:translateX(3px)}
  .news a{color:var(--fg);text-decoration:none;font-weight:700;font-size:13px;display:block;margin-bottom:4px}
  .news a:hover{color:var(--team)}
  .news p{font-size:12px;color:var(--dim);line-height:1.5}
  .facts{list-style:none;display:grid;gap:6px}
  .facts li{position:relative;padding:2px 0 2px 18px;font-size:12.5px;color:var(--fg);line-height:1.55}
  .facts li::before{content:"⚡";position:absolute;left:0;top:2px;font-size:11px;filter:grayscale(.4)}
  .read{list-style:none;display:grid;gap:6px}
  .read a{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12.5px;color:var(--fg);text-decoration:none;padding:9px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
  .read a:hover{color:var(--team);border-color:color-mix(in srgb,var(--team) 50%, transparent)}
  .read .why{font-size:11px;color:var(--dim)}
  .oss{font-size:12.5px;line-height:1.6;color:var(--fg);background:linear-gradient(90deg,color-mix(in srgb,var(--team) 18%,transparent),transparent);border-left:3px solid var(--team);padding:10px 14px;border-radius:0 12px 12px 0;margin-top:16px}
  banner{display:block;text-align:center;color:var(--dim);font-size:13px;margin-top:22px}
  banner span{color:#7ce38b;animation:blink 1.5s infinite}
  @keyframes blink{50%{opacity:.3}}
  .spin{width:100%;height:100px;display:grid;place-items:center;color:var(--dim)}
  /* ---- digest ---- */
  .digest{
    background:linear-gradient(135deg,rgba(42,111,216,.12),rgba(153,0,0,.10),rgba(31,78,156,.12)),var(--panel);
    border:1px solid var(--line);border-radius:var(--radius);padding:26px;
    backdrop-filter:blur(14px);box-shadow:var(--glow);margin-bottom:22px;
  }
  .dhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;margin-bottom:14px}
  .dhead .t{display:flex;align-items:center;gap:12px}
  .mic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:linear-gradient(135deg,#2a6fd8,#991111)}
  .dhead h2{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .dhead .meta{color:var(--dim);font-size:12px;margin-top:3px}
  .langs{display:flex;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:4px}
  .langs button{border:0;background:transparent;color:var(--dim);font-size:12px;font-weight:700;padding:6px 16px;border-radius:99px;cursor:pointer;transition:.2s}
  .langs button.on{background:linear-gradient(135deg,#2a6fd8,#1f4e9c);color:#fff}
  .intro{font-size:14px;line-height:1.65;color:var(--fg);max-width:820px;margin-bottom:18px}
  .segs{display:grid;gap:12px}
  .seg{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--panel2)}
  .seg .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .seg .row .hn{font-weight:800;font-size:14.5px}
  .seg .badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--team,#2a6fd8) 20%,transparent);color:var(--team);white-space:nowrap}
  .seg p{font-size:12.5px;line-height:1.6;color:var(--dim);margin-top:6px}
  .seg p.cls{color:var(--fg)}
  .seg .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin-top:10px;font-weight:700}
  .closing{font-size:14px;line-height:1.6;border-top:1px dashed var(--line);margin-top:16px;padding-top:14px;color:var(--fg)}
</style>
</head>

itching absence has compounded the workload problem.", "url": "https://www.mlb.com/news/edwin-diaz-dodgers-bullpen-have-caused-trouble-for-champs"}, {"title": "Tarik Skubal's home debut with the Dodgers: 'This one was special'", "why": "The back-to-back Cy Young winner's emotional first start at Dodger Stadium, a 6-5 win over Kansas City.", "url": "https://www.mlb.com/news/tarik-skubal-dodger-stadium-debut-with-dodgers"}, {"title": "Tommy John dies at 83: Reactions from across baseball", "why": "The pitcher whose name became synonymous with the most common arm surgery in sports had deep ties to the Dodgers.", "url": "https://www.mlb.com/news/tommy-john-death-reactions"}], "one_sentence": "The Dodgers are rolling at 77-51 behind Ohtani's MVP-caliber season, awaiting Glasnow's imminent return, and hoping Tucker can snap out of his slump before October."}, {"name": "USC Trojans", "sport": "College Football", "emoji": "Football", "accent": "#9E1B32", "record": "0-0 (Preseason — Season opens Aug. 29 vs. San Jose State)", "headline": "USC ranked No. 14 and loaded with talent as Lincoln Riley enters make-or-break fifth season", "latest_news": [{"title": "Football gears up for 2026 with same goals", "summary": "USC enters 2026 with the No. 1 recruiting class, new DC Gary Patterson, and QB Jayden Maiava returning after passing on the NFL Draft. Lincoln Riley faces mounting pressure to deliver the program's first CFP berth.", "url": "https://dailytrojan.com/2026/08/19/football-gears-up-for-2026-with-same-goals/"}, {"title": "Lincoln Riley is high on USC's defense this season", "summary": "Riley named several defensive standouts from fall camp, including transfer CB Jontez Williams, freshmen Rock Hill and Madden Riordan, and LB Deven Bryant. The 4-2-5 scheme under Patterson has Riley optimistic for the first time about the defense matching the offense.", "url": "https://247sports.com/college/usc/article/lincoln-riley-high-uscs-defense-this-season-289040036/"}, {"title": "USC offensive line must adjust with Kilian O'Connor out for the season", "summary": "Starting center Kilian O'Connor suffered a non-contact injury and will miss the entire 2026 season. Redshirt junior Tobias Raymond is a leading candidate to fill the role as USC adjusts its offensive line ahead of the Aug. 29 opener.", "url": "https://sports.yahoo.com/articles/usc-offensive-line-must-adjust-222708229.html"}, {"title": "Jayden Maiava Reveals How He Plans to Take USC to Another Level", "summary": "Maiava, who led the FBS in QBR last season, said returning to USC was about adapting to every environment and building chemistry with a new receiver corps. He's drawn inspiration from former Trojan QBs Caleb Williams, Sam Darnold, and Matt Leinart.", "url": "https://www.newsweek.com/sports/ncaa/jayden-maiava-reveals-how-he-plans-to-take-usc-to-another-level-12300492"}, {"title": "USC, Notre Dame to renew rivalry in 2030 with four-game series", "summary": "The historic USC-Notre Dame rivalry will resume in 2030 with four games scheduled through 2033, all in the early weeks of the season before Big Ten play begins. Riley said playing the game in a non-conference window was essential for USC.", "url": "https://www.espn.com/college-football/story/_/id/49521504/usc-notre-dame-renew-rivalry-2030-four-game-series"}, {"title": "Kickoff times and TV networks set for first four USC football games of 2026", "summary": "USC opens Week Zero vs. San Jose State on Aug. 29 at noon PT on NBC, followed by Fresno State (Fri. Sept. 4, FOX), Louisiana (Sept. 12, BTN), and a Big Ten opener at Rutgers (Sept. 19, CBS).", "url": "https://usctrojans.com/news/2026/5/27/kickoff-times-and-tv-networks-set-for-first-four-usc-football-games-of-2026-season"}], "fun_facts": ["USC landed the No. 1 recruiting class in the country for 2026, headlined by five-star OT Keenyi Pepe (6-7, 320 lbs) and five-star edge Luke Wafle.", "QB Jayden Maiava led the FBS with a 91.2 QBR in 2025 — throwing for 3,711 yards and 24 TDs jayden-maiava-and-waymond-jordan-named-to-maxwell-award-watch-list"}, {"title": "Lincoln Riley Speaks Candidly on USC's Schedule Agreement With Notre Dame", "why": "Riley's detailed comments on why the Notre Dame series will now be played early in the season, and what it means for USC's Big Ten scheduling constraints.", "url": "https://sports.yahoo.com/articles/lincoln-riley-speaks-candidly-uscs-164434144.html"}], "one_sentence": "USC opens the 2026 season ranked No. 14 with Heisman-contending QB Jayden Maiava, a revamped defense under Gary Patterson, and the nation's No. 1 recruiting class — all riding on Lincoln Riley's fifth-year push for the program's first CFP appearance."}, {"name": "Rams", "sport": "NFL", "emoji": "🏈", "accent": "#003594", "record": "14-3 (2025) | 1-0 preseason", "headline": "Rams open preseason with 20-12 win over Chiefs as Ty Simpson stars; Aaron Donald comeback looms", "latest_news": [{"title": "Ty Simpson aces preseason debut — 21-of-25, 190 yards, 2 TDs vs. Chiefs", "summary": "Rookie first-round pick Ty Simpson was nearly flawless in his NFL preseason debut, completing 21 of 25 passes for 190 yards and 2 touchdowns as the Rams topped the Chiefs 20-12 at Arrowhead Stadium on Aug. 15. Stetson Bennett also saw action, going 4-of-6 for 38 yards.", "url": "https://www.nfl.com/news/2026-nfl-preseason-week-1-10-things-to-watch"}, {"title": "McVay: No new Aaron Donald news, but comeback is 'trending upwards'", "summary": "Head coach Sean McVay said there's 'no new news' on Aaron Donald's potential return from retirement, but the momentum is positive. The three-time Defensive Player of the Year worked out with the team at LMU during training camp and met with younger players. McVay said he's hopeful for a decision 'sooner rather than later' once the team returns to Woodland Hills.", "url": "https://ftw.usatoday.com/story/sports/nfl/2026/08/16/aaron-donald-update-rams-return-deadline-mcvay/91327586007/"}, {"title": "Puka Nacua remains in contract waiting game as camp wraps", "summary": "Star wide receiver Puka Nacua continues to practice without a contract extension heading into his final rookie-deal year. He missed some practice with muscle soreness but McVay expects him back soon. Nacua, who recorded 1,715 receiving yards last season, hired a new agency in August as negotiations continue. He said holding out 'never crossed my mind.'", "url": "https://www.aol.com/articles/puka-nacua-remains-contract-waiting-231526000.html"}, {"title": "Stafford, Adams building chemistry that didn't exist in 2025 camp", "summary": "Reigning MVP Matthew Stafford, on a modified practice schedule at 38, has maximized his training-camp reps with Davante Adams in a way they couldn't when Stafford was sidelined with a back injury last year. McVay plans a similar conservative approach to keep Stafford fresh for the regular season.", "url": "https://www.therams.com/news/training-camp"}, {"title": "Rams list Myles Garrett as dealing with 'lower body soreness' — no concern", "summary": "Myles Garrett missed a few training camp practices with lower-body soreness, but McVay called it precautionary and said there is 'no reason for concern.' The reigning AP Defensive Player of the Year, acquired in a blockbuster June trade, has been integrating with the team's defensive culture and building chemistry with new teammates.", "url": "https://www.therams.com/news/training-camp"}, {"title": "Rams open regular season Sept. 10 vs. 49ers in Week 1", "summary": "Los Angeles will host San Francisco on Wednesday, Sept. 10 at 8:35 PM ET to open the 2026 regular season — a primetime NFC West showdown at SoFi Stadium. The team faces the Saints (Aug. 22) and Chargers (Aug. 27) to close the preseason.", "url": "https://www.nfl.com/teams/los-angeles-rams"}], "fun_facts": ["The Rams are the first team in NFL history to pair the reigning MVP (Stafford) and reigning Defensive Player of the Year (Garrett) on the same roster.", "Stafford led the NFL in 2025 with 4,707 passing yards and 46 touchdowns — both career highs — earning his first MVP award at age 37.", "Puka Nacua's 1,715 receiving yards last season were the most by a Rams player since Cooper Kupp's 1,947 in 2021.", "The Rams traded Jared Verse, a 2027 first-round pick, a 2028 second-round pick, and a conditional 2029 third-round pick to Cleveland for Myles Garrett — the first time a reigning DPOY has ever been traded.", "Los Angeles went 14-3 in 2025, winning the NFC West before falling to Seattle in the NFC Championship Game."], "further_reading": [{"title": "Rams 2026 Training Camp Intel & Updates", "why": "ESPN's comprehensive daily training camp tracker with position battles, breakout candidates, and roster news.", "url": "https://www.espn.com/nfl/story/_/id/49434454/los-angeles-rams-training-camp-2026-intel-updates"}, {"title": "Aaron Donald Rams Return — Live Updates", "why": "USA Today's running live blog tracking every development in Aaron Donald's potential comeback from retirement.", "url": "https://www.usatoday.com/story/sports/nfl/rams/2026/08/06/aaron-donald-rams-decision-updates-latest-rumors-return--live/91200988007/"}, {"title": "How the Myles Garrett Trade Happened — Inside the Deal", "why": "Pro Football Rumors' deep dive into the trade negotiations, salary cap implications, and why the Rams finally convinced Cleveland to deal.", "url": "https://www.profootballrumors.com/2026/06/browns-to-trade-myles-garrett-to-rams"}, {"title": "Sports Interaction: Rams 2026 Season Preview", "why": "Full season preview with analysis on the Garrett acquisition, NFC West outlook, and Super Bowl odds.", "url": "https://news.sportsinteraction.com/nfl/story/los-angeles-rams-2026-nfl-season-preview-analysis-and-predictions-685661"}], "one_sentence": "The Rams are all-in on a Super Bowl run with MVP Stafford, DPOY Garrett, and a potential Aaron Donald comeback — and rookie Ty Simpson's preseason breakout adds another wrinkle to an already loaded roster."}]};
const DIGEST_DATA = {"updated_at": "2026-08-20T08:02:58-07:00", "title": "LA Sports Daily Digest — 15-Minute Edition", "read_time": "~15 minutes", "intro": "Good morning, LA. It's Wednesday, August 20, 2026 — and the sports calendar is absolutely loaded. Shohei Ohtani continues his historic run at Coors Field, Tyler Glasnow is one rehab start away from rejoining the Dodgers' rotation, and closer Edwin Díaz is heading to the injured list at the worst possible time. Over in USC land, Lincoln Riley's Trojans are nine days from kickoff with a Heisman-contending quarterback, a rebuilt defense under new coordinator Gary Patterson, and the weight of a fifth season that could define his tenure in Los Angeles. And at Rams training camp, rookie quarterback Ty Simpson turned heads with a near-perfect preseason debut against the Chiefs, while the Aaron Donald comeback watch — the biggest storyline of the NFL offseason — continues to build momentum. Let's get into all of it.", "intro_zh": "早安，洛杉磯。今天是 2026 年 8 月 20 日，星期三——體育賽程滿檔。Shohei Ohtani 在 Coors Field 持續締造歷史，Tyler Glasnow 距離回歸道奇輪值只差一次復健先發，而 closer Edwin Díaz 在最不巧的時刻進了傷兵名單。轉到 USC 這邊，Lincoln Riley 的 Trojans 距離開幕戰僅剩九天，手中握有 Heisman 熱門 quarterback、在新 coordinator Gary Patterson 帶領下重建的防線，以及可能定義他在洛杉磯执教生涯的第五年壓力。至於公羊訓練營，新秀 quarterback Ty Simpson 以近乎完美的季前賽首秀對 Chiefs 大放異彩，而 NFL 休賽季最大話題——Aaron Donald 復出倒數計時——持續升溫。一起來看今天所有報導。", "segments": [{"team": "Dodgers", "accent": "#2A6FD8", "headline": "Ohtani's 30th Homer, Glasnow's Imminent Return, and a Closer Crisis — Dodgers Keep Rolling at 77-51", "headline_zh": "Ohtani 轟出第 30 號全壘打，Glasnow 即將歸隊，牛棚警報響起——道奇以 77 勝 51 敗持續領跑", "analysis": "The Dodgers completed a three-game sweep of the Rockies at Coors Field this week, pushing their NL West lead to a commanding nine games and sitting at 77-51 — the best record in the National League. At the center of it all, once again, is Shohei Ohtani, who launched a 448-foot two-run homer in Tuesday's 7-6 win for his 30th home run of the season. That marks the sixth consecutive year Ohtani has reached the 30-homer threshold, a feat matched by only a handful of players in baseball history. More remarkably, the blast extended his Coors Field hitting streak to 22 games — the most dominant stretch by any visiting player in the ballpark's 30-year history. Ohtani is currently hitting .290 with a .940 OPS at the plate and carrying a 1.79 ERA across 14 pitching starts. He remains the frontrunner for the NL MVP award, with betting markets giving him a 54% edge over the Cubs' Pete Crow-Armstrong in what The Athletic is calling a razor-close race.\n\nTyler Glasnow, who has been on the injured list since May 8 with lower back spasms, delivered what is expected to be his final rehab outing on Monday night, striking out nine batters over five innings for Triple-A Oklahoma City. His 2.72 ERA through seven big league starts before the IL stints makes him arguably the most impactful trade acquisition in baseball — even though LA didn't have to trade for him. His return to the Dodgers' rotation could come as early as next week, and the timing couldn't be better with the postseason push entering its final stretch. A rotation featuring Ohtani, Glasnow, and the recently acquired Tarik Skubal — the back-to-back AL Cy Young winner who has gone 1-2 with a 3.00 ERA in three starts since his August 2 trade from Detroit — gives LA arguably the most formidable postseason pitching staff in the sport.\n\nBut the bullpen picture got murkier on Tuesday. Closer Edwin Díaz was placed on the 15-day injured list with right-side neck inflammation, creating an immediate void at the back end of the relief corps. Tanner Scott, who earned a four-out save on August 18 in the series opener against Colorado, is expected to assume closing duties until Díaz returns around September 2. The concern is that the Dodgers' bullpen has been a liability for weeks — ranking 23rd in MLB since July 1 — and losing Díaz even for two weeks compounds an already precarious workload problem. Manager Dave Roberts will need to lean heavily on Scott, Blake Treinen, and whatever high-leverage arms remain healthy as the team navigates the final six weeks of the regular season.\n\nThen there's the Kyle Tucker situation, which continues to be one of the more puzzling storylines of the Dodgers' season. The $240 million outfielder broke an 0-for-16 drought on August 18 with a double and an RBI, but his season-long slash line of .234/.334/.376 with just 11 home runs is a far cry from the elite production the Dodgers were banking on when they made him the centerpiece of their offseason spending spree. Roberts has publicly and repeatedly backed Tucker, insisting the struggles are not rooted in effort or preparation, but the clock is ticking. With the postseason just six weeks away, the Dodgers need their right fielder to find his timing — and fast. The question hanging over Chavez Ravine is whether this is a prolonged cold streak or something more structural. Either way, it's a problem LA can't afford to ignore much longer.\n\nAll of this unfolds against the somber backdrop of the baseball world mourning Tommy John, the legendary pitcher who passed away on August 16 at the age of 83. The Dodgers honored him with a pregame tribute — a fitting goodbye to a man whose 124-57 record and 2.97 ERA in Dodger blue from 1972 to 1978 made him a franchise icon, and whose name became forever linked to the most common arm surgery in sports. In a season full of milestones and headlines, this was a reminder that the game's history always runs deeper than any single box score.", "analysis_zh": "道奇本週在 Coors Field 完成三場橫掃，國聯西區領先擴大至九場，戰績來到 77 勝 51 敗——全聯盟最佳。一切的核心依然是 Shohei Ohtani，他在週二 7-6 的勝利中擊出一支 448 英尺的兩分砲，達成單季第 30 號全壘打。這是他連續第六年達成 30 號全壘打的里程碑，棒球歷史上僅有極少數球員能與之並肩。更驚人的是，這發全壘打將他在 Coors Field 的安打延續紀錄推進到 22 場——該球場 30 年歷史中訪客球員最長的火燙紀錄。Ohtani 目前打擊成績 .290、OPS .940，14 場先發投出 1.79 ERA。他在 NL MVP 選票中仍以 54% 的優勢領先 Cubs 的 Pete Crow-Armstrong，The Athletic 形容這是一場勢均力敵的對決。\n\nTyler Glasnow 自 5 月 8 日因下背部痙攣進傷兵名單後，週一晚間在 Triple-A Oklahoma City 進行了預計最後一次復健先發，五局飆出九次三振。他在進傷兵名單前 7 場先發投出 2.72 ERA，堪称本季最具衝擊力的球員——即使道奇不需要透過交易取得他。他回歸大聯盟輪值最早可能在下週，而這個時間點再好不過——季後賽衝刺正式進入最後階段。一個由 Ohtani、Glasnow 和 8 月 2 日從 Detroit 引進的雙連任 AL Cy Young 得主 Tarik Skubal（三場先發 1 勝 2 敗、ERA 3.00）組成的輪值，讓 LA 擁有本季可能最恐怖的季後賽先發陣容。\n\n然而，牛棚的前景在週二變得更加黯淡。Closer Edwin Díaz 因右側頸部發炎被放入 15 天傷兵名單，在後防投手群末端創造了立即的缺口。Tanner Scott 在 8 月 18 日對 Colorado 的系列戰首場完成四出局救援成功，預計在 Díaz 約 9 月 2 日歸隊前擔任終結者。令人擔憂的是，道奇的牛棚已經是數週以來的隱憂——自 7 月 1 日以來全聯盟排名 23——失去 Díaz 即使僅兩週，也將本已沉重的工作量問題進一步惡化。總教練 Dave Roberts 將不得不在最後六週的例行賽中重度倚賴 Scott、Blake Treinen 和其他尚保持健康的高壓投手。\n\n至於 Kyle Tucker 的狀況，持續成為道奇本季最令人費解的劇情之一。這位 2.4 億美元的外野手在 8 月 18 日以一支二壘安打和打點終結了 0-for-16 的低潮，但他全季 .234/.334/.376 的成績和僅 11 號全壘打，與道奇休賽季大手筆投資時所期待的頂級產出相去甚遠。Roberts 公開且反覆力挺 Tucker，強調低潮並非源自態度或準備問題，但時鐘正在滴答作響。距離季後賽僅剩六週，道奇需要他們的 right fielder 盤活手感——而且要快。懸在 Chavez Ravine 上空的疑問是：這只是一段延長的冰冷期，還是結構性的問題？無論如何，這是 LA 不能再忽視的問題。\n\n這一切的背景是整個棒球界哀悼 Tommy John 的辭世——這位傳奇 pitcher 於 8 月 16 日以 83 歲高齡離開人世。道奇以賽前致敬儀式緬懷他——對一位 1972 至 1978 年間披上道奇藍、留下 124 勝 57 敗和 2.97 ERA 成績的球隊偶像，以及那位名字永遠與運動界最常見手臂手術連結的傳奇，這是最恰如其分的告別。在一個充滿里程碑和頭條的賽季中，這提醒了我們：這項運動的歷史，永遠比任何一張成績單來得更深邃。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "No. 14 USC Opens 2026 With Heisman QB, Revamped Defense, and Riley's Defining Season on the Line", "headline_zh": "全美排名第 14 的 USC 以 Heisman 熱門 quarterback、重新打造的防線迎來 2026 賽季，Lincoln Riley 的關鍵之年正式揭幕", "analysis": "The USC Trojans are nine days from their August 29 opener against San Jose State, and the program enters 2026 with arguably its most complete roster since the Pete Carroll era. Ranked No. 14 in the preseason AP poll, the Trojans are loaded with talent on both sides of the ball — but the storyline that matters most is whether head coach Lincoln Riley can finally deliver the program's first College Football Playoff appearance in his fifth year at the helm. The pressure is immense, and the margin for error is razor-thin.\n\nAt the center of USC's hopes is quarterback Jayden Maiava, who made the decision to return for his senior year rather than enter the NFL Draft — a choice that immediately elevated the Trojans' ceiling. Maiava led the FBS with a 91.2 QBR last season, throwing for 3,711 yards and 24 touchdowns, and has spent the offseason refining his craft and building chemistry with a revamped receiving corps. He's drawn inspiration from former Trojan greats — Caleb Williams, Sam Darnold, and Matt Leinart — and has spoken publicly about wanting to leave his own mark on the program's storied quarterback lineage. With running back Waymond Jordan also earning a spot on the Maxwell Award watch list, USC's offense has the firepower to compete with anyone in the country.\n\nBut the side of the ball that could define this season is the defense, which has been the Trojans' Achilles heel for years. New defensive coordinator Gary Patterson — the legendary TCU architect of the 4-2-5 scheme — has installed his system and immediately begun reshaping the unit's identity. Head coach Lincoln Riley has been effusive in his praise of the talent emerging from fall camp, singling out transfer cornerback Jontez Williams, freshmen Rock Hill and Madden Riordan, and linebacker Deven Bryant as players who have taken significant strides. For a program that has consistently fielded explosive offenses but been undermined by defensive inconsistency, Patterson's influence could be transformative. If USC's defense can climb even to the middle of the pack nationally, the combination with Maiava and the offense could be enough to make a legitimate playoff run.\n\nThe most significant injury blow of the offseason hit the offensive line, where starting center Kilian O'Connor suffered a non-contact injury that will end his season before it begins. Redshirt junior Tobias Raymond is the leading candidate to step in, but replacing an experienced center who serves as the quarterback of the offensive line — responsible for identifying blitz packages, making protection calls, and ensuring alignment on every snap — is one of the hardest in-season adjustments a team can make. The first four games against San Jose State, Fresno State, Louisiana, and Rutgers should provide a manageable ramp-up period, but the Big Ten schedule that follows will test this reconfigured line immediately.\n\nOff the field, USC and Notre Dame announced a landmark four-game series resumption beginning in 2030, with all four matchups scheduled before Big Ten conference play begins. Riley pushed hard for the early-season window, recognizing that a rivalry game embedded in conference play would add unnecessary strain to an already brutal schedule. The series — one of the most storied in college football — had been on hiatus, and its return underscores USC's commitment to preserving its tradition while navigating the realities of the expanded Big Ten.\n\nThe Trojans also moved into the new $200 million Bloom Football Performance Center this offseason, a state-of-the-art facility that features everything from hydrotherapy pools to advanced film rooms, signaling the program's financial commitment to competing at the highest level. Combined with the No. 1 recruiting class in the country — headlined by five-star offensive tackle Keenyi Pepe and five-star edge rusher Luke Wafle — USC's talent pipeline has never been more robust. But talent alone doesn't win championships. This is Lincoln Riley's fifth year in Los Angeles, the expectations have never been higher, and the first test comes on August 29 at noon PT on NBC. Nine days and counting.", "analysis_zh": "USC Trojans 距離 8 月 29 日對 San Jose State 的開幕戰僅剩九天，球隊以可能自 Pete Carroll 時代以來最完整的陣容迎來 2026 賽季。在季前 AP 排名中位列第 14，Trojans 在進攻和防守兩端都集結了頂級 talent——但最重要的故事線是總教練 Lincoln Riley 能否在執教第五年終於帶領球隊打進 College Football Playoff。壓力巨大，犯錯空間極其狹小。\n\nUSC 希望的核心在於 quarterback Jayden Maiava，他做出回到大四而非投入 NFL 選秀的決定——這項選擇立刻拉高了 Trojans 的上限。Maiava 上季以 91.2 QBR 領跑全美大學，傳出 3,711 碼和 24 次達陣，休賽季致力於精進球技並與重組的 receiver 團隊建立默契。他從前 Trojan 傳奇——Caleb Williams、Sam Darnold 和 Matt Leinart——身上汲取靈感，公開表達希望在球隊輝煌的 quarterback 傳承中留下自己的印記。 Running back Waymond Jordan 同樣入選 Maxwell Award 候選名單，USC 的進攻火力足以與全國任何對手抗衡。\n\n但可能定義這個賽季的是防守端——這一直是 Trojans 的致命弱點。新任 defensive coordinator Gary Patterson——傳奇的 TCU 4-2-5 體系 architect——已經安裝了他的系統，並立刻開始重塑這個單位的特質。總教練 Lincoln Riley 對秋季訓練中脫穎而出的 talent 贊不絕口，特別點名轉學生 cornerback Jontez Williams、新秀 Rock Hill 和 Madden Riordan、以及 linebacker Deven Bryant 作為顯著進步的球員。對於這支長期以進攻火力著稱、卻因防守不穩而屢屢自毀長城的球隊來說，Patterson 的影響可能帶來質變。如果 USC 的防守能提升至全國中游水平，搭配 Maiava 和進攻組的火力，就有足夠實力展開真正的 playoff 衝刺。\n\n休賽季最嚴重的傷兵打擊落在進攻鋒線——先發 center Kilian O'Connor 遭受非接觸性傷害，賽季尚未開始就宣告報銷。紅衫 junior Tobias Raymond 是填補空缺的主要人選，但要取代一位擔任進攻線 quarterback 的經驗豐富 center——負責識別 blitz 方案、進行保護配線、確保每一 snap 的陣型 Alignment——是球隊所能做的最困難的賽中調整之一。前四場對 San Jose State、Fresno State、Louisiana 和 Rutgers 應該提供一段可控的磨合期，但隨後的 Big Ten 賽程將立刻考驗這條重新組裝的進攻線。\n\n場外，USC 和 Notre Dame 宣布了一項里程碑式的四年對戰系列賽恢復計畫，自 2030 年起全部四場比賽都安排在 Big Ten 例行賽開始之前。Riley 積極爭取賽季初期的窗口，認為在例行賽期間安排這場宿敵之戰會為本已艱峻的賽程增添不必要的負擔。這場 college football 最具傳奇色彩的宿敵之戰曾一度中斷，其恢復彰顯了 USC 在 Big Ten 擴編的現實下保護自身傳統的決心。\n\nUSC 今年休賽季還搬入了全新的 2 億美元 Bloom Football Performance Center，這座頂級訓練設施擁有從水療池到先進影片分析室的一切，彰顯球隊在最高層級競爭的財務承諾。全美排名第一的 recruiting class——以五星 offensive tackle Keenyi Pepe 和五星 edge rusher Luke Wafle 領銜—— talent 庫存從未如此豐厚。但光有 talent 不足以贏得冠軍。這是 Lincoln Riley 在洛杉磯的第五年，期望值已到歷史最高點，第一場考驗將在 8 月 29 日太平洋時間中午於 NBC 登場。倒數九天。"}, {"team": "Rams", "accent": "#003594", "headline": "Ty Simpson Shines in Preseason Debut, Aaron Donald Comeback Looms as Rams Prep for Super Bowl Push", "headline_zh": "Ty Simpson 季前賽首秀大放異彩，Aaron Donald 復出在即，公羊全力衝刺 Super Bowl", "analysis": "The Los Angeles Rams opened their 2026 preseason with a 20-12 victory over the Kansas City Chiefs at Arrowhead Stadium on August 15 — and the performance that dominated the conversation was from a quarterback who isn't even expected to start this season. Rookie first-round pick Ty Simpson completed 21 of 25 passes for 190 yards and two touchdowns in what can only be described as a near-perfect NFL preseason debut. His command of the offense, pocket awareness, and willingness to push the ball downfield under pressure immediately elevated the ceiling of what was already considered one of the deepest quarterback rooms in the league. Stetson Bennett, the other backup option, went 4-of-6 for 38 yards in limited action — competent, but the gap between Simpson and every other non-Matthew Stafford quarterback in camp appears significant.\n\nThe bigger storyline, of course, remains Aaron Donald. Head coach Sean McVay told reporters that there is no new update on the three-time Defensive Player of the Year's potential return from retirement, but he described the momentum as \"trending upwards\" — a phrase that, in McVay-speak, carries significant weight. Donald has been a presence at training camp, working out with the team at Loyola Marymount University and spending considerable time mentoring younger players on the defensive line. McVay expressed hope that a decision would come \"sooner rather than later\" once the team returns to its Woodland Hills facility after the preseason. The possibility of pairing Donald — a three-time DPOY who retired as the most dominant interior defensive lineman of his generation — with reigning AP Defensive Player of the Year Myles Garrett would give the Rams arguably the most fearsome defensive line in NFL history. It's a tantalizing prospect, and one that's keeping the rest of the NFC on edge.\n\nGarrett, acquired in a blockbuster June trade from Cleveland, has been integrating into the Rams' defensive culture smoothly — though McVay did list him as dealing with \"lower body soreness\" that he described as precautionary and not a cause for concern. The trade that brought Garrett to Los Angeles was historic: the Rams sent edge rusher Jared Verse, a 2027 first-round pick, a 2028 second-round pick, and a conditional 2029 third-round pick to the Browns, making it the first time a reigning DPOY had ever been traded. Cleveland's willingness to part with their best player underscores the ransom LA was willing to pay, and Garrett's early returns suggest the investment is paying off. He's been dominant in one-on-one drills and has already begun building chemistry with the rest of the defensive front.\n\nOn the offensive side, reigning MVP Matthew Stafford and wide receiver Davante Adams are building the kind of chemistry that eluded them last season, when the 38-year-old quarterback was limited by a back injury for much of training camp. This year, McVay has implemented a modified practice schedule for Stafford — lighter workloads in camp, limited preseason reps — designed to keep the reigning MVP fresh for the regular season and the postseason run that the Rams fully expect to make. Stafford led the NFL in 2025 with 4,707 passing yards and 46 touchdowns, both career highs, and the addition of Adams to a receiving corps that already featured Puka Nacua gives LA one of the most dangerous passing attacks in football.\n\nThe one lingering subplot is Nacua's contract situation. The star wide receiver, who recorded 1,715 receiving yards last season — the most by a Rams player since Cooper Kupp's 1,947 in 2021 — continues to practice without a contract extension heading into his final year on his rookie deal. He's hired a new agency and said holding out \"never crossed my mind,\" but the financial negotiations loom as a potential distraction. Nacua is one of the most productive receivers in football, and locking him up long-term should be a priority — but the Rams are also managing a roster loaded with premium contracts, and cap flexibility is always a balancing act.\n\nThe Rams close the preseason with games against the Saints on August 22 and the Chargers on August 27 before opening the regular season on September 10 — a Wednesday night primetime showdown against the San Francisco 49ers at SoFi Stadium. It's a marquee matchup to kick off the campaign, and it will provide the first real test of whether this star-studded roster can translate its talent into wins. With Stafford, Garrett, potentially Donald, Nacua, Adams, and now a breakout rookie quarterback in Simpson, the Rams have assembled one of the most compelling rosters in the NFL. The question is no longer whether they have the talent — it's whether they can stay healthy long enough to use it.", "analysis_zh": "洛杉磯公羊在 8 月 15 日於 Arrowhead Stadium 以 20-12 擊敗 Kansas City Chiefs，拉開 2026 季前賽序幕——但最引發討論的表現來自一位甚至不是預定先發的 quarterback。首輪新秀 Ty Simpson 以 21 投 25 中、190 碼和兩次達陣的近乎完美表現完成 NFL 季前賽首秀。他在口袋中的掌控力、空間意識和在壓力下推進球的意願，立刻拉高了這支本就被視為聯盟最深厚 quarterback 深度之一的球隊的天花板。另一位候補選項 Stetson Bennett 在有限上場中以 4 投 6 中、38 碼作收——表現稱職，但 Simpson 與訓練營中其他非 Matthew Stafford 的 quarterback 之間的差距顯然顯著。\n\n當然，更大的故事線仍是 Aaron Donald。總教練 Sean McVay 告訴記者，關於這位三度 Defensive Player of the Year 復出退役的消息沒有更新，但他形容「趨勢向上」——在 McVay 的語彙中，這句話分量不輕。Donald 持續在訓練營中出現，於 Loyola Marymount 大學與球隊一起訓練，並花大量時間指導 defensive line 的年輕球員。McVay 對球隊返回 Woodland Hills 設施後能「儘快」做出決定表示樂觀。若能將 Donald——一位以最具統治力的 interior defensive lineman 之姿退役的三度 DPOY——與現任 AP Defensive Player of the Year Myles Garrett 搭配，公羊將擁有可能是 NFL 歷史上最恐怖的 defensive line。這是一個令人垂涎的前景，也讓全聯盟的 NFC 球隊繃緊神經。\n\nGarrett 在六月從 Cleveland 的 blockbuster 交易中加盟，一直順利融入公羊的 defensive culture——不過 McVay 將他列為處理「下半身痙攣」的預防性狀態，並無大礙。這筆將 Garrett 帶到洛杉磯的交易創下歷史：公羊送出 edge rusher Jared Verse、2027 年首輪、2028 年二輪和 2029 年有條件三輪給 Browns，成為歷史上首次有現任 DPOY 被交易。Cleveland 樂意放走自家最佳球員，凸顯了 LA 願意支付的代價，而 Garrett 的早期表現暗示這筆投資正在回報。他在一對一對抗中展現統治力，並已開始與 defensive front 的其他成員建立默契。\n\n進攻端方面，現任 MVP Matthew Stafford 和 wide receiver Davante Adams 正在建立去年未能實現的默契——上季這位 38 歲 quarterback 因背傷在訓練營中受限。今年 McVay 為 Stafford 實施了調整後的訓練計畫——較輕的營期工作量、有限的季前賽出場——旨在確保這位現任 MVP 在例行賽和公羊全力衝刺的季後賽中保持最佳狀態。Stafford 在 2025 年以 4,707 碼和 46 次達陣領跑全聯盟，兩項都是職業生涯新高，而 Adams 加入本已擁有 Puka Nacua 的 receiving corps，讓 LA 擁有足球界最危險的傳球攻擊之一。\n\n唯一持續的懸念是 Nacua 的合約狀況。這位上季錄得 1,715 接收碼數的明星 wide receiver——自 Cooper Kupp 2021 年的 1,947 碼以來公羊球員最高——在最後一年新秀合約期間持續參訓但尚未簽下延長合約。他更換了新的經紀公司，並表示「從未想過罷訓」，但財務談判作為潛在的分心因素持續懸而未決。Nacua 是足球界最具產出的 receiver 之一，簽下長期合約理應是優先要務——但公羊同時也在管理一支滿是高薪合約的陣容，薪資空間的靈活性永遠是一場平衡術。\n\n公羊以 8 月 22 日對 Saints 和 8 月 27 日對 Chargers 結束季前賽，然後在 9 月 10 日開幕——一場週三晚間的黃金時段對決，在 SoFi Stadium 迎戰 San Francisco 49ers。這是一場為賽季揭幕的頂級對決，也將是這支星光熠熠的陣容能否將 talent 轉化為勝利的首次真正檢驗。隨著 Stafford、Garrett、潛在的 Donald、Nacua、Adams，以及如今的爆發新秀 quarterback Simpson，公羊組裝出了 NFL 中最引人注目的陣容之一。問題早已不是他們有沒有 talent——而是他們能否保持足夠的健康來發揮它。"}], "closing": "That's your Wednesday morning briefing. The Dodgers are 77-51 and cruising behind Ohtani's historic season, awaiting Glasnow's return while the bullpen and Kyle Tucker's bat remain areas to watch. USC opens in nine days with the most talent-laden roster Lincoln Riley has assembled, but the O'Connor injury and defensive questions loom large. And the Rams are loading up for what could be the most star-studded season in franchise history — Simpson's emergence, the Donald decision, and the Nacua contract are all threads that could shape the NFC race. Buckle up — the next seven months are going to be a ride.", "closing_zh": "以上就是您週三早上的 LA 體育快報。道奇以 77 勝 51 敗在 Ohtani 的歷史級賽季背後穩步領跑，等待 Glasnow 歸隊的同時，牛棚和 Kyle Tucker 的打擊仍是觀察重點。USC 在九天後開幕，Lincoln Riley 集結了他執教以來最具天賦的陣容，但 O'Connor 的傷病和防守端的問號仍然巨大。公羊則全力衝刺，準備迎來隊史最星光熠熠的賽季——Simpson 的崛起、Donald 的決定、Nacua 的合約，每一條線索都可能塑造 NFC 的競爭版圖。繫好安全帶——接下來的七個月將是一場精彩絕倫的旅程。"};
let lang = "en";
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmtPT(iso){ return new Date(iso).toLocaleString("en-US",{timeZone:"America/Los_Angeles",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"})+" PT"; }

function renderDigest(d){
  const box = document.getElementById("digest");
  if(!d || !d.segments){
    box.innerHTML = '<div style="text-align:center;color:var(--dim);padding:40px">No digest yet</div>';
    return;
  }
  const segs = d.segments.map(s=>{
    const headline = lang==="en" ? s.headline : s.headline_zh;
    const analysis = lang==="en" ? s.analysis : s.analysis_zh;
    return '<div class="seg" style="--team:'+esc(s.accent)+'">' +
      '<div class="row"><span class="hn">'+esc(headline)+'</span><span class="badge">'+esc(s.team)+'</span></div>' +
      '<div class="lbl">'+(lang==="en"?"Analysis":"分析")+'</div><p>'+esc(analysis)+'</p>' +
      '</div>';
  }).join("");
  box.innerHTML =
    '<div class="dhead">' +
      '<div class="t"><div class="mic">🎙️</div><div><h2>'+esc(d.title)+'</h2><div class="meta">' +
        esc(d.read_time || "")+' · '+fmtPT(d.updated_at)+
        ' · 繁中/EN</div></div></div>' +
      '<div class="langs">'+
        '<button id="btnEn" class="on" onclick="setLang(\'en\')">EN</button>'+
        '<button id="btnZh" onclick="setLang(\'zh\')">繁體中文</button>'+
      '</div>' +
    '</div>' +
    '<div class="intro">'+esc(lang==="en"?d.intro:d.intro_zh)+'</div>' +
    '<div class="segs">'+segs+'</div>' +
    '<div class="closing">'+esc(lang==="en"?d.closing:d.closing_zh)+'</div>';
}
function setLang(v){ lang = v; document.getElementById("btnEn").classList.toggle("on", v==="en"); document.getElementById("btnZh").classList.toggle("on", v==="zh"); renderDigest(DIGEST_DATA); }

function renderNews(d){ const upd = document.getElementById("upd"); if(upd) upd.textContent = fmtPT(d.updated_at);
  const g = document.getElementById("grid"); g.innerHTML = "";
  for(const t of d.teams){
    const c = document.createElement("div"); c.className = "card"; c.style.setProperty("--team", t.accent);
    const emoji = t.emoji==="Baseball"?"⚾":t.emoji==="Football"?"🏈":"🏆";
    c.innerHTML =
      '<div class="top"><div class="ico">' + emoji + '</div>' +
      '<div><div class="name">' + esc(t.name) + '</div><div class="rec">' + t.sport + ' · ' + esc(t.record) + '</div></div></div>' +
      '<div class="hline">' + esc(t.headline) + '</div>' +
      '<h3>Latest News</h3><ul class="news">' + t.latest_news.map(n =>
        '<li><a target="_blank" rel="noopener" href="' + esc(n.url) + '">' + esc(n.title) + '</a><p>' + esc(n.summary) + '</p></li>'
      ).join("") + '</ul>' +
      '<h3>Fun Facts</h3><ul class="facts">' + t.fun_facts.map(f => '<li>'+esc(f)+'</li>').join("") + '</ul>' +
      '<h3>Further Reading</h3><ul class="read">' + t.further_reading.map(f =>
        '<li><a target="_blank" rel="noopener" href="' + esc(f.url) + '"><span>'+esc(f.title)+'</span><span class="why">'+esc(f.why)+'</span></a></li>'
      ).join("") + '</ul>' +
      '<div class="oss">' + esc(t.one_sentence) + '</div>';
    g.appendChild(c);
  }
}

renderDigest(DIGEST_DATA);
renderNews(TEAMS_DATA);
</script>

</html>
