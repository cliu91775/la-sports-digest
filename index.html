<title>LA Sports Fan</title>
<style>
  :root{
    --bg:#0b0e14; --panel:rgba(255,255,255,.04); --panel2:rgba(255,255,255,.02);
    --line:rgba(255,255,255,.08); --fg:#edf2fa; --dim:#8a94a6;
    --radius:18px; --glow:0 0 0 1px rgba(255,255,255,.04), 0 24px 60px -30px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 500px at 20% -10%, rgba(42,111,216,.18), transparent 60%),
      radial-gradient(1000px 500px at 90% -10%, rgba(153,0,0,.14), transparent 60%),
      radial-gradient(900px 400px at 50% 110%, rgba(31,78,156,.16), transparent 60%),
      var(--bg);
    color:var(--fg); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
    padding:28px clamp(16px,4vw,64px) 64px;
  }
  header{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:26px}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{
    width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;
    background:linear-gradient(135deg,#2a6fd8,#991111);box-shadow:0 8px 30px -8px rgba(60,90,220,.6);
  }
  h1{font-size:clamp(22px,3vw,32px);font-weight:800;letter-spacing:-.02em}
  .sub{color:var(--dim);font-size:13px;margin-top:4px}
  .ticker{
    font-size:12px;color:var(--dim);padding:8px 14px;border-radius:99px;
    background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);
  }
  .ticker b{color:#7ce38b}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:20px}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;backdrop-filter:blur(14px);box-shadow:var(--glow);position:relative;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--team,#2a6fd8),transparent);
  }
  .top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .ico{
    width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;
    background:color-mix(in srgb,var(--team) 22%, transparent);
  }
  .name{font-size:18px;font-weight:800;letter-spacing:-.01em}
  .rec{font-size:11px;color:var(--team);font-weight:700;margin-top:2px}
  .hline{font-size:13px;line-height:1.5;color:var(--dim);padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);margin-bottom:16px}
  h3{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
  h3::after{content:"";flex:1;height:1px;background:var(--line)}
  .news{list-style:none}
  .news li{padding:10px 12px;border-radius:12px;margin-bottom:6px;background:var(--panel2);border:1px solid var(--line);transition:.2s}
  .news li:hover{border-color:color-mix(in srgb,var(--team) 50%, transparent);transform:translateX(3px)}
  .news a{color:var(--fg);text-decoration:none;font-weight:700;font-size:13px;display:block;margin-bottom:4px}
  .news a:hover{color:var(--team)}
  .news p{font-size:12px;color:var(--dim);line-height:1.5}
  .facts{list-style:none;display:grid;gap:6px}
  .facts li{position:relative;padding:2px 0 2px 18px;font-size:12.5px;color:var(--fg);line-height:1.55}
  .facts li::before{content:"⚡";position:absolute;left:0;top:2px;font-size:11px;filter:grayscale(.4)}
  .read{list-style:none;display:grid;gap:6px}
  .read a{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12.5px;color:var(--fg);text-decoration:none;padding:9px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
  .read a:hover{color:var(--team);border-color:color-mix(in srgb,var(--team) 50%, transparent)}
  .read .why{font-size:11px;color:var(--dim)}
  .oss{font-size:12.5px;line-height:1.6;color:var(--fg);background:linear-gradient(90deg,color-mix(in srgb,var(--team) 18%,transparent),transparent);border-left:3px solid var(--team);padding:10px 14px;border-radius:0 12px 12px 0;margin-top:16px}
  banner{display:block;text-align:center;color:var(--dim);font-size:13px;margin-top:22px}
  banner span{color:#7ce38b;animation:blink 1.5s infinite}
  @keyframes blink{50%{opacity:.3}}
  .spin{width:100%;height:100px;display:grid;place-items:center;color:var(--dim)}
  /* ---- digest ---- */
  .digest{
    background:linear-gradient(135deg,rgba(42,111,216,.12),rgba(153,0,0,.10),rgba(31,78,156,.12)),var(--panel);
    border:1px solid var(--line);border-radius:var(--radius);padding:26px;
    backdrop-filter:blur(14px);box-shadow:var(--glow);margin-bottom:22px;
  }
  .dhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;margin-bottom:14px}
  .dhead .t{display:flex;align-items:center;gap:12px}
  .mic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:linear-gradient(135deg,#2a6fd8,#991111)}
  .dhead h2{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .dhead .meta{color:var(--dim);font-size:12px;margin-top:3px}
  .langs{display:flex;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:4px}
  .langs button{border:0;background:transparent;color:var(--dim);font-size:12px;font-weight:700;padding:6px 16px;border-radius:99px;cursor:pointer;transition:.2s}
  .langs button.on{background:linear-gradient(135deg,#2a6fd8,#1f4e9c);color:#fff}
  .intro{font-size:14px;line-height:1.65;color:var(--fg);max-width:820px;margin-bottom:18px}
  .segs{display:grid;gap:12px}
  .seg{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--panel2)}
  .seg .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .seg .row .hn{font-weight:800;font-size:14.5px}
  .seg .badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--team,#2a6fd8) 20%,transparent);color:var(--team);white-space:nowrap}
  .seg p{font-size:12.5px;line-height:1.6;color:var(--dim);margin-top:6px}
  .seg p.cls{color:var(--fg)}
  .seg .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin-top:10px;font-weight:700}
  .closing{font-size:14px;line-height:1.6;border-top:1px dashed var(--line);margin-top:16px;padding-top:14px;color:var(--fg)}
</style>
</head>

const TEAMS_DATA = {"updated_at": "2026-08-26T13:05:17.320855+00:00", "teams": [{"name": "Dodgers", "sport": "MLB", "emoji": "Baseball", "accent": "#2A6FD8", "record": "80-52 (.606), 1st in NL West", "headline": "Dodgers rotation reassembles: Glasnow returns, Ohtani inches closer to mound", "latest_news": [{"title": "Tyler Glasnow makes strong return from 60-day IL in 4-3 loss to Braves", "summary": "Glasnow pitched 5 innings with 7 strikeouts and 0 walks in his first start since May 6 (back spasms). He allowed 3 runs in a chaotic first inning but settled down brilliantly, inducing 13 whiffs over his final 4 frames. Dave Roberts called the outing 'fantastic.' The loss snapped the Dodgers' 6-game winning streak.", "url": "https://www.latimes.com/sports/dodgers/story/2026-08-25/braves-dodgers-tyler-glasnow"}, {"title": "Shohei Ohtani could return to mound as soon as Sunday", "summary": "Ohtani threw 30 pitches in live batting practice on Aug. 22 and is scheduled for another session this week. If all goes well, he could start Sunday vs. the Tigers. Roberts said Ohtani could be a full-fledged starter in October, going 1-3 innings initially with a slow build-up to 5+ by postseason.", "url": "https://nypost.com/2026/08/24/sports/shohei-ohtani-has-new-pitching-outlook-as-dodgers-change-plans/"}, {"title": "Andy Pages undergoes surgery on fractured left hand, out 4-5 weeks", "summary": "The All-Star center fielder was placed on the 10-day IL on Aug. 22 after being hit by a pitch. Alek Thomas was recalled and has immediately contributed, recording an RBI single in each of his three starts since the call-up.", "url": "https://www.mlb.com/dodgers/news"}, {"title": "Edwin Díaz placed on 15-day IL, will fight to regain closer role", "summary": "Díaz was shut down with neck inflammation on Aug. 18 after posting an 11.85 ERA and four blown saves in 16 games since signing a $69M deal. He threw a bullpen on Aug. 23 and expects to return in early September to compete for the closer role.", "url": "https://apnews.com/article/dodgers-edwin-diaz-shohei-ohtani-95979e0ea18b99ecfdb87ea9e5e847de"}, {"title": "Will Smith begins rehab assignment, homers in first game", "summary": "The three-time All-Star catcher, out since June 5 with a neck injury, caught 5 innings and went 1-for-3 with a 2-run HR in his rehab debut for Triple-A Oklahoma City. Roberts hopes Smith is active by Sept. 1. Since his absence, the team ERA has ballooned from 3.03 to 4.27.", "url": "https://codysnavely.substack.com/p/dodgers-notes-tyler-glasnow-returns"}, {"title": "Dodgers open critical 3-game series at Atlanta, currently 1 game back of Brewers for NL's top seed", "summary": "The Dodgers fell 4-3 in the series opener at Truist Park. Atlanta, at 77-55, is now just 3 games behind L.A. for the NL's No. 2 seed. Both teams trail the 81-50 Brewers. Roki Sasaki starts Wednesday's Game 2 vs. AJ Smith-Shawver.", "url": "https://www.truebluela.com/dodgers-scores-standings/122760/dodgers-braves"}], "fun_facts": ["The Dodgers' bottom third of the lineup (Call, Feduccia, Thomas) went 5-for-9 with all three RBIs in the Braves loss — stars Ohtani, Freeman, Betts, and Muncy combined just 3-for-19.", "Alek Thomas has an RBI single in all three games since his call-up, despite being an emergency replacement for Andy Pages.", "Dodgers 2B Tommy Edman hit a walk-off single in the Aug. 22 Pirates game and stole home with a steal-of-second-plus-error combo in the same series.", "MLB's No. 6 prospect Josue De Paula became the first Dodger at any level in 2026 to reach 25 homers and 25 stolen bases in the same season (Double-A Tulsa).", "Former utilityman Matt Beaty, a 2020 World Series champion with L.A., announced his retirement on Aug. 25 after an eight-year professional career."], "further_reading": [{"title": "Dodgers rotation taking shape with Glasnow back, Ohtani nearing return", "why": "Full game recap and analysis of Glasnow's return outing and the Dodgers' pitching outlook for the postseason", "url": "https://www.latimes.com/sports/dodgers/story/2026-08-25/braves-dodgers-tyler-glasnow"}, {"title": "Ohtani's new pitching outlook could be a gamechanger for October", "why": "Deep dive on how Ohtani could be a full starter in the postseason, not just an opener — a major shift in Dodgers' October plans", "url": "https://nypost.com/2026/08/24/sports/shohei-ohtani-has-new-pitching-outlook-as-dodgers-change-plans/"}, {"title": "Will Smith's return timeline and impact on Dodgers pitching staff", "why": "Comprehensive notes on Smith's rehab debut, Glasnow's return, Ohtani's schedule, and Sheehan's minor league dominance", "url": "https://codysnavely.substack.com/p/dodgers-notes-tyler-glasnow-returns"}, {"title": "Every Dodgers transaction throughout 2026 season", "why": "Complete transaction tracker — useful reference for deadline deals (Skubal, Feduccia, Bubic) and all IL moves", "url": "https://www.truebluela.com/dodgers-roster/109828/dodgers-roster-transactions-2026"}], "one_sentence": "The Dodgers fell 4-3 to the Braves in Atlanta, snapping a 6-game win streak, but the night's real win was Tyler Glasnow's dominant return from a 3.5-month absence as the rotation reassembles for a postseason push."}, {"name": "USC Trojans", "sport": "College Football", "emoji": "Football", "accent": "#9E1B32", "record": "0-0", "headline": "No. 14 USC Opens 2026 Season Saturday vs. San Jose State as Jayden Maiava Piles Up Watch Lists", "latest_news": [{"title": "No. 14 USC Football Opens 2026 Campaign At Home Versus San José State", "summary": "USC kicks off the Lincoln Riley era's pivotal fifth season on Saturday, Aug. 29 at the Coliseum on NBC. The Trojans are ranked 14th in the preseason AP Poll and face a brutal Big Ten slate that includes Oregon, Ohio State, Penn State, and Indiana.", "url": "https://usctrojans.com/sports/football/schedule/2026"}, {"title": "QB Jayden Maiava Named to Manning Award Watch List", "summary": "The fifth-year senior adds another preseason honor, joining the Manning Award watch list alongside the Maxwell, Walter Camp, Johnny Unitas Golden Arm, and Davey O'Brien watch lists. Maiava led the nation with a 91.2 QBR in 2025, throwing for 3,711 yards and 24 TDs.", "url": "https://usctrojans.com/news/2026/8/24/football-usc-quarterback-jayden-maiava-named-to-manning-award-watch-list"}, {"title": "WR Tanook Hines Named to Earl Campbell Tyler Rose Award Watch List", "summary": "Sophomore receiver Tanook Hines, who started 8 games as a true freshman in 2025 (34 catches, 561 yards), earns a spot on the Earl Campbell Tyler Rose Award watch list recognizing top offensive players from Texas programs or Texas high school products.", "url": "https://usctrojans.com/news/2026/8/25/football-usc-wide-receiver-tanook-hines-named-to-earl-campbell-tyler-rose-award-watch-list"}, {"title": "Lincoln Riley Turns to Gary Patterson to Fix USC's Defensive Woes", "summary": "Hall of Fame coach Gary Patterson was hired as defensive coordinator after USC ranked 117th in yards per play defensively since Riley's arrival. Patterson brings his signature 4-2-5 scheme and a deep defensive line headlined by Jahkeem Stewart, Kameryn Crawford, and five-star freshman Luke Wafle.", "url": "https://www.cbssports.com/college-football/news/lincoln-riley-gary-patterson-usc/"}, {"title": "USC Defensive Line Faces Maximum Pressure in Defining Season", "summary": "With the CFP hopes of the program hinging on a defensive turnaround, USC's defensive line must step up under Patterson. The unit features veteran Jide Abasiri, Michigan State transfer Alex VanSumeren, and five-star freshman Jaimeon Winfield.", "url": "https://trojanswire.usatoday.com/story/sports/college/trojans/football/2026/08/24/usc-football-defensive-line-maximum-pressure-2026-season/91041417007/"}, {"title": "AD Jennifer Cohen Sets CFP Expectation for Riley and USC", "summary": "USC athletic director Jennifer Cohen publicly stated the Trojans expect to make the College Football Playoff in 2026. Riley, entering Year 5 with a 35-18 record and zero CFP appearances, acknowledged the pressure: 'It's time. The program's ready for it.'", "url": "https://sports.yahoo.com/articles/usc-lincoln-riley-faces-pressure-015816897.html"}], "fun_facts": ["USC landed the No. 1-rated 2026 recruiting class nationally with 35 commits, including 5-star TE Mark Bowman from Mater Dei (reclassified from 2027) and 5-star EDGE Luke Wafle.", "Since Lincoln Riley arrived in 2022, USC ranks 1st nationally in offensive yards per play but 117th defensively — one of the starkest gaps in college football.", "QB Jayden Maiava led the nation with a 91.2 QBR in 2025 and was one of just two FBS QBs to record both a tackle and a forced fumble in the same season.", "USC opens the 2026 season with a Week Zero game on Aug. 29 — its earliest opener under Lincoln Riley — with three home games before heading to Rutgers on Sept. 19.", "The Trojans will play Ohio State at the Coliseum on Halloween (Oct. 31) in the first conference meeting between the two programs as Big Ten foes."], "further_reading": [{"title": "Lincoln Riley could never solve Gary Patterson — now he needs him to help save USC", "why": "Deep-dive CBS Sports feature on how Riley convinced the Hall of Fame DC out of retirement to fix USC's perennially weak defense.", "url": "https://www.cbssports.com/college-football/news/lincoln-riley-gary-patterson-usc/"}, {"title": "Jayden Maiava enters defining 2026 season for him and USC", "why": "TrojansWire analysis of how Maiava's 2026 campaign will define both his NFL draft stock and Riley's tenure at USC.", "url": "https://trojanswire.usatoday.com/story/sports/college/trojans/football/2026/08/24/jayden-maiava-defining-2026-season-usc-football/90968525007/"}, {"title": "USC Football Preview 2026: Can Lincoln Riley Finally Get to the CFP?", "why": "Comprehensive game-by-game 2026 schedule preview with predictions and analysis of every Big Ten matchup.", "url": "https://collegefootballnews.com/ .usatoday.com/story/sports/nfl/rams/2026/08/24/rams-roster-moves-signings-injuries-waive/91443236007/"}, {"title": "Stafford-Davante Adams connection sizzling in joint practice", "summary": "In the Rams' final joint practice with the Saints, Matthew Stafford and Davante Adams showed elite chemistry, reinforcing the MVP-to-receiver bond that dominated the 2025 season.", "url": "https://www.therams.com/news/training-camp"}, {"title": "McVay says Rams 'hopeful' OL Keagen Trost can return before Week 1", "summary": "Rookie offensive lineman Keagen Trost, who suffered a hamstring injury in the preseason opener against the Chiefs, is expected to be available for the Week 1 opener in Australia.", "url": "https://www.therams.com/news/training-camp"}, {"title": "Rams set for historic NFL season opener in Melbourne, Australia", "summary": "The Rams will face the 49ers at the Melbourne Cricket Ground on Thursday, Sept. 10 at 5:35 PM PT in the NFL's first-ever regular season game in Australia, airing on Netflix.", "url": "https://www.therams.com/news/rams-release-official-2026-schedule"}], "fun_facts": ["Alex Cook's 100-yard pick-six was a UFL-to-NFL crossover highlight — he had a pick-six at the end of the 2026 UFL season before joining the Rams", "The Rams' 2025 team ranked No. 1 in scoring offense (30.5 PPG) and No. 2 in passing yards per game (276.9) with Stafford throwing a career-high 46 TDs", "Rams will play seven primetime games in 2026, including four of the first five weeks of the season", "Super Bowl LXI will be played at SoFi Stadium — the Rams' home — giving L.A. a unique title shot at home"], "further_reading": [{"title": "Myles Garrett trade winners and losers: Rams Super Bowl ready", "summary": "Full breakdown of the blockbuster June 1 trade sending Garrett to L.A. for Jared Verse and three draft picks.", "url": "https://www.nfl.com/news/myles-garrett-trade-winners-and-losers-rams-super-bowl-ready-what-can-jared-verse-do-with-browns"}, {"title": "Aaron Donald comeback: What NFL history says about a return", "summary": "Analysis of Donald's official Rams workout and what historical precedent says about a future Hall of Famer unretiring after two years.", "url": "https://www.cbssports.com/nfl/news/aaron-donald-return-nfl-history-rams/"}, {"title": "2026 NFC West Preview: Cardinals, Rams, 49ers, Seahawks", "summary": "Division preview declaring the Rams the consensus Super Bowl favorites at +520 with the NFL's most complete roster.", "url": "https://vsin.com/nfl/2026-nfc-west-nfl-team-previews-cardinals-rams-49ers-seahawks/"}, {"title": "Rams' 2026 coaching staff set with 16 returnees, 8 new hires", "summary": "Complete breakdown of Sean McVay's finalized coaching staff including new OC Nate Scheelhaase and ST coordinator Bubba Ventrone.", "url": "https://www.therams.com/news/rams-2026-coaching-staff-set"}], "one_sentence": "The Rams are the NFL's consensus Super Bowl favorites heading into the 2026 season, riding a dominant preseason into a historic Week 1 opener in Melbourne against the 49ers with MVP Matthew Stafford, Myles Garrett, and a possible Aaron Donald comeback fueling L.A.'s all-in championship push."}]};
const DIGEST_DATA = {"updated_at": "2026-08-26T06:00:04-07:00", "title": "LA Sports Daily Digest — 15-Minute Edition", "read_time": "~15 minutes", "intro": "It's Tuesday, August 26, and Los Angeles sports finds itself at a fascinating inflection point across all three major franchises. The Dodgers' rotation is reassembling just in time for October, USC is days away from a make-or-break season opener, and the Rams are the betting favorites for the Super Bowl as the Aaron Donald saga takes a complicated turn.", "intro_zh": "今天是 8 月 26 日星期二，洛杉磯三大職業球隊同時站在關鍵的轉折點上。道奇隊先發輪值正在為十月季後賽重新集結，南加大距離開學戰僅剩數天，而公羊隊在 Aaron Donald 復出傳聞轉趨複雜之際，仍是超級碗的頭號熱門。", "segments": [{"team": "Dodgers", "accent": "#2A6FD8", "headline": "Glasnow's Masterful Return Leads Rotation Reassembly as Dodgers Fall 4-3 in Atlanta", "headline_zh": "Glasnow 強勢回歸率領先發輪值重組，道奇 4-3 不敵勇士", "analysis": "Tyler Glasnow's return from the 60-day injured list was the headline of the night, even in a 4-3 loss that snapped the Dodgers' six-game winning streak. After being sidelined since May 6 with back spasms — a gap of more than three and a half months — Glasnow was electric over five innings, striking out seven batters without issuing a single walk. He allowed three runs in a turbulent first inning at Truist Park but settled in to induce 13 whiffs across his final four frames, a dominance that had Dave Roberts calling the outing 'fantastic' in his postgame remarks.\n\nThe context around this start cannot be overstated. The Dodgers entered the night one game behind the Milwaukee Brewers for the National League's top seed, and every rotation spot matters in a September stretch that will define home-field advantage through October. Glasnow's ability to miss bats immediately upon return suggests the back issue is fully behind him, and the Dodgers can slot him back as the de facto ace — or co-ace alongside a returning Shohei Ohtani — without any built-in pitch-count limitations by the time the postseason arrives.\n\nSpeaking of Ohtani, the two-way superstar took another significant step toward the mound on August 22, throwing 30 pitches in live batting practice with another session scheduled this week. Roberts revealed a notable shift in how the club views Ohtani's October pitching role: rather than being a bullpen weapon or an opener, Ohtani could start games and build from one to three innings initially, ramping to five or more by the postseason. If Glasnow and Ohtani both return at full capacity, the Dodgers would have the most formidable one-two punch in baseball heading into October.\n\nThe injury news, however, is not all positive. Andy Pages underwent surgery on his fractured left hand after being hit by a pitch on August 22 and faces a four-to-five-week absence. The All-Star center fielder's loss is significant, but emergency call-up Alek Thomas has provided an unexpected jolt, recording an RBI single in each of his three starts since being recalled. Meanwhile, closer Edwin Díaz — signed to a $69 million deal — was placed on the 15-day IL with neck inflammation after posting an ugly 11.85 ERA and four blown saves in 16 games. He threw a bullpen on August 23 and expects to return in early September, but the question of whether he can reclaim the closer's role looms large.\n\nPerhaps the most encouraging development beyond Glasnow's return was Will Smith's rehab debut for Triple-A Oklahoma City. The three-time All-Star catcher, out since June 5 with a neck injury, homered in his first game back and caught five innings. Roberts is hopeful Smith can be activated by September 1, and his return could be transformative — since Smith went down, the Dodgers' team ERA has ballooned from 3.03 to 4.27, a staggering deterioration that underscores how much the catcher's game-calling and pitch-framing matter.\n\nThe bottom line: even in a loss, the Dodgers sent a clear signal that their postseason machine is being rebuilt piece by piece. Glasnow's return, Ohtani's bullpen sessions, and Smith's rehab homer are three pillars of a roster that, by October, could look dramatically different from the one that limped through the summer months. Atlanta, just three games behind L.A. for the NL's No. 2 seed, will have something to say about it — Game 2 of the series features Roki Sasaki on the mound Wednesday.", "analysis_zh": "Tyler Glasnow 從 60 天傷兵名單回歸，即使道奇在亞特蘭大以 4-3 吞敗，終止六連勝，他仍是今晚最耀眼的主角。自 5 月 6 日因背部痙攣進傷兵名單以來，Glasnow 已缺陣超過三個半月，但他在 Truist Park 投滿五局，飆出七次三振且沒有任何保送。他雖然在混亂的第一局被攻下三分，但隨後四局完全主導比賽，製造了 13 次揮空，總教練 Dave Roberts 形容這場先發「太出色了」。\n\n這場先發的背景意義不容忽視。道奇在賽前落後密爾瓦基釀酒人一場勝差，爭奪國聯頭號種子。每一個先發位置在九月衝刺期都至關重要，而 Glasnow 立即展現揮空能力，顯示背傷已完全康復。到了季後賽，道奇可以將他定位為真正的王牌——或與回歸的 Shohei Ohtani 並列雙王牌——無需任何投球數限制。\n\n談到 Ohtani，這位雙刀流巨星在 8 月 22 日投了 30 球的實戰打擊練習，本週將再進行一次。Roberts 揭露了一個重要的策略轉變：Ohtani 在季後賽的定位可能不再是中繼或假先發，而是真正的先發投手，初期投一到三局，到季後賽時逐步增加到五局以上。若 Glasnow 和 Ohtani 同時恢復全盛狀態，道奇將擁有十月前全聯盟最可怕的雙王牌組合。\n\n然而傷病消息並非全然正面。外野手 Andy Pages 在 8 月 22 日遭觸身球擊中左手後進行手術，預計缺陣四到五週。這位全星賽外野手的損失相當可觀，但緊急被拉上大聯盟的 Alek Thomas 意外地火力全開，在被叫上來後的三場比賽都敲出帶打點的安打。另一邊，以六千九百萬美元簽下的終結者 Edwin Díaz 因頸部發炎被放進十五天傷兵名單，在 16 場出賽中投出 11.85 的自責分率和四次救援失敗。他在 8 月 23 日進行了牛棚練習，預計九月初回歸，但能否奪回終結者位置仍是問號。\n\n最令人振奮的消息莫過於 Will Smith 的復健首戰。這位三屆全明星捕手自 6 月 5 日因頸傷缺陣後，在三 A 奧克拉荷馬城的復健賽首戰就敲出全壘打，並蹲了五局。Roberts 希望他能在 9 月 1 日歸隊，而他的回歸可能是翻轉性的——自從 Smith 缺陣以來，道奇的團隊防禦率從 3.03 暴漲至 4.27，這驚人的惡化幅度凸顯了這位捕手在配球和接球框架上的重要性。\n\n總結來說，即使吞下敗仗，道奇傳遞了明確訊息：季後賽機器正在一塊一塊重新組裝。Glasnow 的回歸、Ohtani 的牛棚練習、以及 Smith 的復健全壘打，是這支球隊在十月煥然一新的三大支柱。亞特蘭大僅落後道奇三場勝差爭奪國聯第二種子，週三 Game 2 將由 Roki Sasaki 先發對決 AJ Smith-Shawver。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Bottom of the Order Rises as Stars Stumble; Thomas Makes Immediate Impact", "headline_zh": "打線末端發威，球星集體熄火；Thomas 即時補上火力", "analysis": "In a game where Ohtani, Freddie Freeman, Muncy, and Betts combined for a pedestrian 3-for-19 at the plate, it was the bottom third of the Dodgers' lineup that carried the offensive load. Call, Feduccia, and Thomas — names that would have been afterthoughts on most nights — went 5-for-9 and accounted for all three of Los Angeles's RBIs in the 4-3 loss to Atlanta.\n\nThe most remarkable story within the story is Alek Thomas, who was never supposed to be on this roster. Called up as an emergency replacement for Andy Pages, Thomas has recorded an RBI single in every single one of his three starts since being recalled. For a player who was scrambling for a roster spot, this immediate production is a testament to the depth of the Dodgers' farm system and the readiness of their upper-level minor leaguers.\n\nTommy Edman added his own highlight-reel moment in the series against the Pirates, delivering a walk-off single on August 22 and pulling off one of the rarest plays in baseball — stealing home via a steal of second base combined with an error. Edman's versatility has been one of the quiet stories of the Dodgers' season, providing a spark from the middle infield that the club desperately needed after years of inconsistency at the position.\n\nThe fun facts emerging from the system are equally compelling. Prospect Josue De Paula, MLB's No. 6 overall prospect, became the first Dodger at any level in 2026 to reach both 25 home runs and 25 stolen bases in a single season while playing for Double-A Tulsa. That kind of power-speed combination is exactly what scouts drool over, and his timeline could put him in Dodger blue as early as next September.\n\nOn the farewell front, former utilityman Matt Beaty — a member of the 2020 World Series championship team — announced his retirement on August 25 after an eight-year professional career. Beaty was never a star, but he was a reliable lefty bat and a clubhouse presence during some of the Dodgers' most memorable recent seasons.\n\nThe broader takeaway here is depth. Championship-caliber rosters are not built on the strength of their stars alone; they require contributions from the margins. The fact that Thomas, Call, Feduccia, and Edman were the offensive stars on a night when the big names faltered is precisely the kind of resilience that separates postseason contenders from pretenders.", "analysis_zh": "在 Ohtani、Freddie Freeman、Muncy 和 Betts 合計 3-for-19 的夜晚，道奇打線末端扛起了攻擊重任。Call、Feduccia 和 Thomas — 平常可能是被忽略的名字 — 合計 5-for-9，包辦了全部三分打點。\n\n最引人注目的故事是 Alek Thomas，他本不該出現在這份名單上。作為 Andy Pages 的緊急替補被拉上來，Thomas 在被召回後的每場先發都敲出帶打點安打，三場比賽場場如此。對於一個原本為 roster 位置掙扎的球員來說，這種即戰力展現了道奇農場系統的深度和上層小聯盟球員的準備度。\n\nTommy Edman 也在對戰海盜隊的系列賽中製造了話題，8 月 22 日敲出再見安打，還上演了棒球場上最罕見的 plays 之一——透過盜二壘加上對手失誤的組合完成盜本壘。Edman 的多功能性是道奇本季的 quiet stories 之一，為二壘防區帶來了這支球隊多年來所缺乏的穩定火花。\n\n農場系統的亮點同樣精彩。全聯盟第六號新秀 Josue De Paula 成為 2026 年道奇體系中第一位在單季達成 25 轟 25 盜的球員，效力於二 A 東京。這種 power-speed 組合正是球探夢寐以求的，他的時間表最快明年九月就能穿上道奇藍。\n\n道別方面，2020 年世界大賽冠軍成員、多功能工具人 Matt Beaty 在職業生涯八年後宣布退休。Beaty 從來不是球星，但他是可靠的左打和 clubhouse 精神領袖，在道奇近年最難忘的赛季中扮演了重要角色。\n\n整體來看，關鍵訊息是「深度」。冠軍級球隊不能只靠明星撐場，邊緣球員的貢獻同樣不可或缺。在大牌球星集體熄火的夜晚，Thomas、Call、Feduccia 和 Edman 成為進攻英雄，正是這種韌性將季後賽競爭者與假象區隔開來。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "NL Seed Race Tightens: Dodgers Face Atlanta as Brewers Hold One-Game Edge", "headline_zh": "國聯種子爭奪戰白熱化：道奇客場挑戰勇士，釀酒人保持一場領先", "analysis": "The Dodgers' 4-3 loss in Atlanta did more than snap a winning streak — it tightened the National League seed race to a near dead heat. Milwaukee (81-50) holds the NL's top seed, the Dodgers (80-52) sit one game back, and the Braves (77-55) are now just three games behind Los Angeles for the No. 2 seed. With roughly 30 games remaining in the regular season, every divisional and interleague matchup carries amplified weight.\n\nThe three-game series at Truist Park is being viewed internally as a potential playoff preview. Both the Dodgers and Braves are built for October, and this midweek set provides an early opportunity to assess how each club matches up. Atlanta's pitching staff has been among the NL's best, and the Dodgers' ability to generate offense against quality arms will be tested over the next two games.\n\nFor Los Angeles, the urgency is compounded by the schedule ahead. The Dodgers face a gauntlet that includes series against the Brewers, Padres, and multiple divisional opponents before the season concludes. Getting Glasnow and Ohtani healthy is not just about the postseason — it's about surviving the final month of the regular season with enough wins to secure home-field advantage.\n\nThe Brewers, meanwhile, have been the surprise of the NL, exceeding expectations with a balanced roster that combines elite pitching depth with timely hitting. Their one-game lead is fragile, and the Dodgers' ability to close the gap will depend on how quickly their reassembled rotation can click.\n\nOne factor that could tilt the race is the Dodgers' depth advantage. While other contenders rely on a handful of star players, L.A.'s ability to get contributions from the margins — Thomas, Edman, Feduccia, Call — gives them a margin for error that few teams can match. In a tight race where one or two games could decide home-field advantage, that depth is an invaluable asset.\n\nThe bottom line: the NL seed race is far from decided, and the Dodgers-Braves series could be a turning point. With Sasaki on the mound Wednesday, the Dodgers have a chance to even the series and send a message that their rotation is back and their October intentions are serious.", "analysis_zh": "道奇在亞特蘭大 4-3 落敗，不僅終止了連勝，更讓國聯種子爭奪戰幾乎進入死鎖。密爾瓦基釀酒人（81 勝 52 敗）暫居國聯頭號種子，道奇（80 勝 52 敗）落後一場，勇士隊（77 勝 55 敗）則僅落後道奇三場爭奪第二種子。在正規賽僅剩約 30 場的情況下，每一場分區和跨聯盟對決的重量都成倍增加。\n\n這場在 Truist Park 的三場系列賽在球隊內部被視為季後賽的前哨戰。道奇和勇士都是為十月打造的球隊，這場週中交鋒提供了提前評估雙方對戰優勢的機會。勇士隊的投手群是國聯頂尖水準，而道奇在接下來兩場面對優質投手時的攻擊火力將受到考驗。\n\n對洛杉磯而言，急迫性因接下來的賽程而加劇。道奇即將面對一系列硬仗，包括對釀酒人、教士以及多支分區對手的系列賽。Glasnow 和 Ohtani 的健康復出不僅關乎季後賽——更是為了在正規賽最後一個月搶下足夠勝場，確保主場優勢。\n\n釀酒人方面，他們是本季國聯的驚喜，以平衡的陣容——結合頂尖投手深度和關鍵時刻的打擊——超越了外界預期。他們一場勝差的領先相當脆弱，而道奇能否縮小差距，取決於重新集結的先發輪值能多快進入狀況。\n\n影響這場爭奪戰的一個關鍵因素是道奇的深度優勢。當其他競爭者依賴少數明星球員時，洛杉磯從邊緣球員——Thomas、Edman、Feduccia、Call——獲得貢獻的能力，給予他們其他球隊難以匹敵的容錯空間。在可能決定主場優勢的一兩場勝差之爭中，這種深度是無價的。\n\n結論：國聯種子爭奪戰遠未定論，道奇對勇士的系列賽可能是轉捩點。Sasaki 週三先發登板，道奇有機會扳平系列賽，並傳遞先發輪值已歸位、十月目標嚴肅的訊息。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "Pivotal Fifth Season Begins: Riley, Patterson, and the CFP Mandate", "headline_zh": "關鍵第五年啟動：Riley、Patterson 與 CFP 強制令", "analysis": "USC opens its 2026 season on Saturday, August 29 at the Coliseum against San José State, but the stakes extend far beyond the final score of a Week Zero game. Athletic director Jennifer Cohen has publicly declared that the Trojans expect to reach the College Football Playoff this season — a mandate that places Lincoln Riley's tenure under a microscope in a way it has never been before.\n\nRiley enters his fifth year at USC with a 35-18 record and zero CFP appearances. For a coach who was hired to restore USC to national championship contention, that gap between regular-season success and playoff relevance has been the defining tension of his tenure. The Trojans ranked first nationally in offensive yards per play during Riley's time in Los Angeles, but 117th defensively — one of the starkest disparities in modern college football history.\n\nThat is why the hiring of Gary Patterson as defensive coordinator is arguably the most important coaching move Riley has made at USC. Patterson, a Hall of Fame coach who built TCU into a perennial contender, brings a 4-2-5 scheme and a defensive philosophy built on discipline and disruption. CBS Sports noted the irony: Riley could never solve Patterson's defenses when they were opponents, and now he needs Patterson to solve his own program's defensive woes.\n\nThe defensive line is where Patterson's impact will be felt most immediately. The unit features veteran Jide Abasiri, Michigan State transfer Alex VanSumeren, and five-star freshman Luke Wafle — a haul that represents the kind of talent injection USC's front seven has desperately needed. Jahkeem Stewart and Kameryn Crawford add depth to a group that, on paper, looks significantly more capable than any defensive line Riley has fielded at USC.\n\nOffensively, the Trojans are stacked. Quarterback Jayden Maiava enters the season on five major award watch lists — the Manning, Maxwell, Walter Camp, Johnny Unitas Golden Arm, and Davey O'Brien — after leading the nation with a 91.2 QBR in 2025. He threw for 3,711 yards and 24 touchdowns last season and is widely projected as a first-round NFL draft pick. Sophomore receiver Tanook Hines, who started eight games as a true freshman in 2025, adds a dynamic receiving threat and has himself earned a spot on the Earl Campbell Tyler Rose Award watch list.\n\nThe schedule is brutal. USC faces Oregon, Ohio State, Penn State, and Indiana in Big Ten play, with Ohio State visiting the Coliseum on Halloween — the first conference meeting between the programs as Big Ten foes. Three home games before a September 19 trip to Rutgers give the Trojans time to gel, but the margin for error is razor-thin. In a Big Ten that has emerged as the sport's toughest conference, USC cannot afford early stumbles if it wants to reach the CFP.\n\nThe pressure is real, and Riley knows it. 'It's time,' he said when asked about the CFP expectation. 'The program's ready for it.' Whether that proves to be true will be determined over the next four months, but the ingredients — a Heisman-contender quarterback, a transformative defensive coordinator, the nation's No. 1 recruiting class, and a schedule that offers both opportunity and peril — make this the most intriguing USC season in years.", "analysis_zh": "南加大將於 8 月 29 日星期六在紀念體育場迎戰聖荷西州立大學，拉開 2026 賽季序幕，但這場 Week Zero 的意義遠遠超出比賽比分。體育總監 Jennifer Cohen 已公開宣告， Trojan 軍團本季的目標是打入大學足球季後賽（CFP）——這項任務將 Lincoln Riley 的任期置於前所未有的顯微鏡下。\n\nRiley 進入他在南加大的第五個賽季，戰績 35 勝 18 敗，卻從未打進 CFP。對於一位被聘請來恢復南加大全國冠軍競爭力的教練來說，正規賽成功與季後賽影響力之間的落差，是他任期內最核心的張力。在 Riley 治下，南加大在進攻碼數 per play 上位居全國第一，但防守端僅排名第 117——這是現代大學足球史上最驚人的落差之一。\n\n這就是為什麼聘請 Gary Patterson 擔任防守協調員，堪稱 Riley 在南加大做出的最重要教練決定。Patterson 是名人堂教練，曾在 TCU 建立長年競爭力，帶來了 4-2-5 防守體系和以紀律與破壞力為核心的防守哲學。CBS Sports 指出了其中的諷刺：Riley 在擔任教練期間從未破解 Patterson 的防守体系，現在他需要 Patterson 來解決自己球隊的防守困境。\n\n防守前線將是 Patterson 影響最直接的區域。這條防線包括資深球員 Jide Abasiri、密西根州立轉學生 Alex VanSumeren，以及五星新生 Luke Wafle——這批人才正是南加大前鋒七人組最需要的天賦注入。Jahkeem Stewart 和 Kameryn Crawford 為這條防線增添了深度，紙上實力看起來遠勝 Riley 任內任何一條南加大的防守前線。\n\n進攻端方面，Trojan 軍團同樣星光熠熠。四分衛 Jayden Maiava 在新賽季伊始就入圍了五項主要獎項的觀察名單——Manning、Maxwell、Walter Camp、Johnny Unitas Golden Arm 和 Davey O'Brien——他在 2025 年以 91.2 的 QBR 領先全國，傳出 3,711 碼和 24 次達陣，被普遍預測為 NFL 首輪新秀。二年級外接手 Tanook Hines 在 2025 年以 true freshman 身份先發八場（34 次接球、561 碼），也入圍了 Earl Campbell Tyler Rose Award 觀察名單。\n\n賽程極為艱峻。南加大在 Big Ten 賽事中將面對 Oregon、Ohio State、Penn State 和 Indiana，其中 Ohio State 將在萬聖節造訪紀念體育場——這是兩隊作為 Big Ten 成員的首次例行賽交鋒。在 9 月 19 日客場對陣 Rutgers 之前的三場主場比賽，給予球隊磨合的時間，但容錯空間極小。在已成為全美最強聯盟的 Big Ten 中，南加大若想打入 CFP，絕不能在賽季初期出現失誤。\n\n壓力是真實的，Riley 也深知這一點。「時候到了，」他在被問及 CFP 期望時說道。「球隊已經準備好了。」這句話是否成真，將在接下來四個月見分曉，但所有的元素——一位海斯曼候選人四分衛、一位變革性的防守協調員、全國第一的招募班級、以及充滿機遇與風險的賽程——使這成為近年來最引人入勝的南加大赛季。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "Maiava Mania: USC's QB Enters Heisman Conversation on Five Watch Lists", "headline_zh": "Maiava 熱潮：南加大四分衛入圍五項海斯曼觀察名單", "analysis": "Jayden Maiava's preseason award haul tells the story of a quarterback who has arrived. The fifth-year senior has been named to the Manning Award, Maxwell Award, Walter Camp Player of the Year, Johnny Unitas Golden Arm, and Davey O'Brien watch lists — a sweep that places him squarely in the Heisman Trophy conversation heading into the 2026 season.\n\nThe numbers from 2025 are staggering. Maiava led the entire nation with a 91.2 QBR, threw for 3,711 yards and 24 touchdowns, and did so with a dual-threat capability that few quarterbacks can match. He was one of just two FBS quarterbacks to record both a tackle and a forced fumble in the same season — a stat that speaks to his competitive fire and willingness to engage physically beyond the pocket.\n\nWhat makes Maiava's 2026 candidacy particularly compelling is the supporting cast around him. USC's offense returns its core of playmakers, and the addition of Tanook Hines as a sophomore breakout candidate gives Maiava a downfield weapon who has already proven he can produce against Big Ten competition. The offensive line, while still a work in progress, has the talent to keep Maiava upright long enough for his elite arm talent to shine.\n\nThe TrojansWire analysis framed it perfectly: 2026 is a defining season for both Maiava and the USC program. If Maiava leads USC to a CFP berth — the stated goal of the athletic department — his draft stock could skyrocket into top-five territory. If the season falls short, it raises uncomfortable questions about whether the Riley-Maiava partnership can deliver on its vast potential.\n\nThe watch list sweep is also a reflection of national perception. USC's brand carries weight in these conversations, and the combination of Maiava's production, USC's offensive reputation, and the Big Ten's elevated national profile creates a perfect storm for Heisman hype. The quarterback will need to deliver in marquee games — Ohio State on Halloween, Penn State, Oregon — to turn watch list nominations into serious contention.\n\nFor now, Maiava is doing what he does best: letting his play speak. The Week Zero opener against San José State on Saturday will be his first opportunity to make a statement, and in a season where everything is on the line, that first impression matters more than ever.", "analysis_zh": "Jayden Maiava 的季前獎項入圍清單，講述了一位已全面崛起的四分衛的故事。這位五年級 senior 入圍了 Manning Award、Maxwell Award、Walter Camp 年度最佳球員、Johnny Unitas Golden Arm 和 Davey O'Brien 觀察名單——這份全入圍清單讓他穩穩坐進 2026 賽季的 Heisman Trophy 討論圈。\n\n2025 年的數據極為驚人。Maiava 以 91.2 的 QBR 領先全國，傳出 3,711 碼和 24 次達陣，展現了少數四分衛能匹敵的雙重威脅能力。他是全美僅有的兩位在單季同時完成 tackle 和 forced fumble 的 FBS 四分衛之一——這項數據反映了他超越口袋的競爭火焰和身體對抗的意願。\n\n讓 Maiava 的 2026 Heisman 候選人身份特別引人注目的是他身邊的支援陣容。南加大進攻端回歸了核心進攻武器群，而 Tanook Hines 作為二年級突破候選人的加入，給予了 Maiava 一位已在 Big Ten 賽事中證明實力的長傳武器。進攻鋒線仍在調整中，但天賦足以保護 Maiava，讓他的精英臂力有足夠時間綻放。\n\nTrojansWire 的分析精準地指出：2026 是 Maiava 和南加大program 的決定性賽季。若 Maiava 率領南加大打入 CFP——體育部門的既定目標——他的選秀身价可能飆升至前五順位。若赛季未達預期，則引發令人不安的疑問：Riley-Maiava 的合作能否兌現其巨大潛力。\n\n全入圍清單也是全國認知的反映。南加大的品牌在這些討論中分量十足，Maiava 的數據、南加大的進攻聲譽和 Big Ten 提升的全國形象，共同創造了 Heisman 炒作的完美風暴。這位四分衛需要在招牌對決中——萬聖節對 Ohio State、Penn State、Oregon——將觀察名單提名轉化為真正的競爭力。\n\n目前，Maiava 正在做他最擅長的事：讓表現自己說話。8 月 29 日對聖荷西州立大學的 Week Zero 開幕戰，將是他發出宣言的首個機會，而在一個一切皆攸關的赛季中，那個第一印象比以往任何時候都重要。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "No. 1 Recruiting Class and Patterson's Hire Signal a New Era at USC", "headline_zh": "全美第一招募班級與 Patterson 的聘任，標誌南加大新時代", "analysis": "The 2026 USC recruiting class is rated the best in the nation, with 35 commits including 20 four-star and five-star prospects. The class is headlined by five-star tight end Mark Bowman from Mater Dei — who reclassified from the 2027 class — and five-star EDGE rusher Luke Wafle, both of whom are expected to contribute immediately.\n\nThis recruiting haul is not just about talent accumulation; it is about program trajectory. When Riley arrived in 2022, he inherited a roster that was thin on defensive talent and lacked the depth to compete with the sport's elite programs over a full season. The 2026 class addresses those weaknesses directly, particularly along the defensive front, where Wafle and the incoming freshmen join a transfer portal group that includes Michigan State's Alex VanSumeren.\n\nThe Patterson hire, combined with the recruiting class, represents a philosophical shift for the program. Riley's USC teams have always been offensively explosive, but the defense has been a liability that has cost the Trojans in big games. Patterson's 4-2-5 scheme is designed to be adaptable and aggressive, and the talent influx from this recruiting class gives him the pieces to run it effectively from day one.\n\nThe fact that USC beat out programs like Ohio State, Alabama, and Georgia for several of these recruits speaks to the recruiting momentum Riley has built despite the lack of CFP appearances. Los Angeles as a destination, the Big Ten's financial muscle, and the promise of early playing time have all been powerful recruiting tools.\n\nFor the program's long-term health, this class is critical. The CFP expanded to 12 teams, and the margin between making the field and being on the outside looking in has never been narrower. Programs that recruit at the level USC is recruiting in 2026 give themselves the best possible chance of sustaining success year over year, even when the transfer portal and NIL landscape threaten to level the playing field.\n\nThe question now is whether all of this talent translates to wins when the games start counting. Saturday's opener against San José State will be the first test, but the real gauntlet begins in October when the Big Ten schedule ramps up. If Patterson can forge this collection of talent into a cohesive defensive unit, and if Maiava continues his ascent, USC could finally deliver on the promise that has been building since Riley's arrival.", "analysis_zh": "2026 年南加大招募班級獲評全國最佳，共有 35 位承諾球員，其中包括 20 位四星和五星級新秀。班級由來自 Mater Dei 的五星級緊端 Mark Bowman——從 2027 班級提前入學——和五星級邊鋒 rusher Luke Wafle 領銜，兩人都被預期能即刻做出貢獻。\n\n這份招募班級不僅僅是人才累積；它關乎 program 的發展軌跡。當 Riley 在 2022 年接任時，他繼承的名單在防守端天賦薄弱，缺乏在完整賽季中與全國頂尖 program 競爭的深度。2026 班級直接針對這些弱點，特別是在防守前線，Wafle 和 incoming 新生加入了包括密西根州立轉學生 Alex VanSumeren 在內的 portal 群體。\n\nPatterson 的聘任加上這份招募班級，代表了 program 的哲學轉變。Riley 的南加大球隊向來進攻火力十足，但防守一直是拖累 Trojan 在大賽中表現的短板。Patterson 的 4-2-5 體系設計為適應性強且具侵略性，而這份招募班級帶來的人才，給了他從第一天起就能有效執行的棋子。\n\n南加大在 several 位招募目標上擊敗了 Ohio State、Alabama 和 Georgia 等 program，證明了 Riley 在無 CFP 出場紀錄的情況下仍建立了招募動能。洛杉磯作為目的地、Big Ten 的財力優勢，以及早期上場時間的承諾，都是強大的招募工具。\n\n對 program 的長期健康而言，這個班級至關重要。CFP 擴展至 12 支球隊，晉級與被淘汰之間的差距從未如此微小。在 2026 年以南加大這種招募水準運作的 program，給予自己在 transfer portal 和 NIL 趨勢威脅拉平競爭環境的情況下，逐年維持成功的最佳機會。\n\n現在的問題是：當比賽開始計分，這些天賦能否轉化為勝利。8 月 29 日對聖荷西州立大學的開幕戰將是首場考驗，但真正的試煉始於十月 Big Ten 賽程全面展開之時。若 Patterson 能將這群人才鍛造為有凝聚力的防守單位，若 Maiava 繼續攀升，南加大 finally 有望兌現自 Riley 到任以來不斷累積的承諾。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "The Big Ten Gauntlet: A Schedule That Will Make or Break the CFP Dream", "headline_zh": "Big Ten 難關賽程：決定 CFP 夢想成敗的考驗", "analysis": "USC's 2026 schedule is a minefield. The Trojans open with three home games — San José State, a likely tune-up, followed by two more before a September 19 trip to Rutgers — but the real test arrives in October. Oregon, Ohio State, Penn State, and Indiana await in a Big Ten slate that will test every facet of Riley's program.\n\nThe Halloween showdown with Ohio State at the Coliseum is the crown jewel of the regular season. It will be the first conference meeting between the two programs as Big Ten members, and the national spotlight will be on both teams. Ohio State, perennially one of the sport's blue bloods, will present the kind of challenge that has historically tripped up USC under Riley — elite defensive talent, a physical running game, and the depth to win ugly.\n\nPenn State and Oregon present equally daunting obstacles. Penn State's defense is built to neutralize spread offenses, and Oregon's speed on both sides of the ball has made them one of the Big Ten's most dangerous teams since joining the conference. Indiana, a rising program under Curt Cignetti, has also emerged as a legitimate contender that cannot be overlooked.\n\nThe Week Zero opener against San José State, while seemingly insignificant, carries its own weight. It is the earliest opener in Riley's tenure, and getting a clean performance — both in execution and health — will set the tone for the season. Maiava's first live reps of 2026 will be closely scrutinized for signs of growth or regression.\n\nThe three home games before the Rutgers trip provide a crucial window for Patterson's defense to establish its identity. The new defensive coordinator will be installing his 4-2-5 scheme with a group of players who are learning it for the first time, and early-season success will depend on how quickly the defensive line and secondary can build chemistry.\n\nFor USC, the margin is simple: win the games you should win, steal one or two in the gauntlet, and the CFP is within reach. Lose more than one game before October, or get blown out by a top-five opponent, and the dream dies before it ever really begins. This is the most important season in USC football since the Pete Carroll era, and every Saturday from now until November will matter.", "analysis_zh": "南加大 2026 年的賽程是一片雷區。Trojan 軍團以三場主場比賽開局——聖荷西州立大學，一場 likely 的暖身賽，接著還有兩場，然後是 9 月 19 日客場出征 Rutgers——但真正的考驗在十月降臨。Oregon、Ohio State、Penn State 和 Indiana 在 Big Ten 賽程中等待，將考驗 Riley program 的每個面向。\n\n萬聖節在紀念體育場對 Ohio State 的對決，是正規賽的頭條亮點。這將是兩隊作為 Big Ten 成員的首次例行賽交鋒，全國目光將聚焦於雙方。Ohio State 作為大學足球的常年藍血強權，將呈現一種 historically 以來在 Riley 治下讓南加大頻頻栽跟頭的挑戰——精英級防守天賦、強悍的跑陣遊戲，以及能以醜陋方式贏球的深度。\n\nPenn State 和 Oregon 同樣構成令人望而生畏的障礙。Penn State 的防守體系專門設計來中和 spread offense，而 Oregon 在攻防兩端的速度使他們自加入 Big Ten 以來成為最具危險性的球隊之一。在 Curt Cignetti 帶領下崛起的 Indiana，也已成為不可忽視的正規 contender。\n\n8 月 29 日對聖荷西州立大學的 Week Zero 開幕戰，看似無足輕重，卻承載著自己的重量。這是 Riley 任內最早的開幕戰，打出一場乾淨的比賽——無論在執行力或健康方面——將為整個賽季定調。Maiava 2026 年的首批實戰 rep 將被密切 scrutinize，尋找成長或退步的跡象。\n\n在出征 Rutgers 之前的三場主場比賽，為 Patterson 的防守建立其身份提供了關鍵窗口。這位新防守協調員將在一群首次學習他 4-2-5 體系的球員中安裝戰術，賽季初期的成功將取決於防守前線和 secondary 能多快建立化學反應。\n\n對南加大而言，規則很簡單：贏下該贏的比賽，在難關中偷走一兩場勝利，CFP 就在觸手可及之處。在十月之前輸掉超過一場比賽，或被前五名對手痛擊，夢想就會在真正開始之前夭折。這是自 Pete Carroll 時代以來南加大足球最重要的赛季，從現在到十一月的每一個週六都至關重要。"}, {"team": "Rams", "accent": "#003594", "headline": "Rams Demolish Saints 34-0 as McVay's Machine Rolls Through Preseason", "headline_zh": "公羊 34-0 血洗聖徒，McVay 機器在季前賽持續碾壓", "analysis": "The Los Angeles Rams sent a statement in their second preseason game, dismantling the New Orleans Saints 34-0 at SoFi Stadium in a performance that left little doubt about their readiness for the 2026 regular season. Alex Cook returned an interception 100 yards for a touchdown, Stetson Bennett IV threw for two TDs and rushed for two more, and the defense pitched a shutout in a game that was competitive for roughly one quarter before the Rams pulled away.\n\nThe performance was a microcosm of what makes this Rams team dangerous: depth at every level. Bennett, who has been one of the more surprising storylines of the preseason, showed poise and versatility as Matthew Stafford's backup, proving he can manage a game effectively when called upon. The 100-yard pick-six by Cook — a UFL-to-NFL crossover product who had a pick-six at the end of his UFL season — was the kind of play that energizes a roster heading into the final weeks of preparation.\n\nThe 2025 Rams were already elite, ranking No. 1 in scoring offense at 30.5 points per game and No. 2 in passing yards per game at 276.9, with Matthew Stafford throwing a career-high 46 touchdowns. But the 2026 iteration has been constructed to be even more dangerous, with the addition of Myles Garrett via the blockbuster June 1 trade that sent Jared Verse and three draft picks to Cleveland. Garrett transforms a defensive front that already had elite talent into arguably the most fearsome pass rush in football.\n\nThe preseason dominance — the Rams are 2-0 — has translated into consensus betting favorite status. Vegas has installed Los Angeles as the Super Bowl favorite at +520, and the NFC West preview circuit has declared the Rams the team to beat in the conference. That kind of preseason hype carries its own weight, but the Rams' roster construction suggests it is warranted.\n\nSeven primetime games on the 2026 schedule — including four of the first five weeks — reflect the NFL's belief that this team is appointment television. The national spotlight will be on the Rams from Week 1, and the pressure to perform at an elite level from the jump will be significant.\n\nThe shutout of the Saints was impressive, but McVay will be more focused on the health of his roster as the preseason concludes. The Rams made six roster moves ahead of the final preseason game against the Chargers, including placing two players on injured reserve. Managing the 53-man roster cutdown while keeping key players healthy is the balancing act that defines the final days of August for every NFL team.", "analysis_zh": "洛杉磯公羊在第二場季前賽中發出了強烈聲明，在 SoFi Stadium 以 34-0 橫掃紐奧良聖徒，這場表現毫無疑問地展示了他們對 2026 正規賽的準備程度。Alex Cook 回攻 100 碼抄截達陣，Stetson Bennett IV 傳出兩次達陣並衝出兩次達陣，防守端完成零封，在比賽前一節尚有競爭性後，公羊迅速拉開差距。\n\n這場表現是公羊危險性的縮影：每個層級都有深度。Bennett 作為 Matthew Stafford 的替補，是季前賽最令人驚喜的故事線之一，展現了沉穩和多功能性，證明他能在被召喚時有效管理比賽。Cook 的 100 碼回攻抄截達陣——他是 UFL 跨界產品，曾在 UFL 賽季末完成抄截回攻達陣——是能振奮球隊士氣的 plays，為最後幾週的備戰注入能量。\n\n2025 年的公羊已經是精英級球隊，在進攻得分上以每場 30.5 分位居全聯盟第一，在傳球碼數上以每場 276.9 碼排名第二，Matthew Stafford 投出生涯新高的 46 次達陣。但 2026 年的版本被打造得更加危險，透過 6 月 1 日的 blockbuster 交易獲得 Myles Garrett，公羊送出 Jared Verse 和三個選秀權換來這位精英級 pass rusher。Garrett 將一條原本就擁有 elite talent 的防守前線，升級為 arguably 全聯盟最令人恐懼的衝傳組合。\n\n季前賽的統治力——公羊 2 勝 0 敗——已轉化為 consensus 的投注熱門地位。拉斯維加斯將洛杉磯列為超級碗頭號熱門，賠率 +520，而 NFC West 分區預覽普遍宣布公羊是 conference 中最難被擊敗的球隊。那種季前賽的炒作有其自身份量，但公羊的陣容建構表明它是合理的。\n\n2026 賽程中的七場 primetime 比賽——包括前五週的四場——反映了 NFL 對這支球隊是「必看電視」的認定。從 Week 1 起，全國目光將聚焦公羊，從一開始就打出精英級表現的壓力將非常巨大。\n\n零封聖徒令人印象深刻，但 McVay 更關注的是季前賽結束時球隊的健康狀況。公羊在對教士隊的最終季前賽前進行了六項 roster 動作，包括將兩名球員放進 injured reserve。在保持關鍵球員健康的同時管理 53 人名單的 cutdown，是定義每支 NFL 球隊八月最後幾天的平衡術。"}, {"team": "Rams", "accent": "#003594", "headline": "Donald Comeback Snags as Roster Cutdown Looms; Stafford-Adams Sizzling", "headline_zh": "Donald 復出傳聞遇阻，Roster Cutdown 迫近；Stafford-Adams 連結火熱", "analysis": "The Aaron Donald saga took a complicated turn this week. After completing an official workout with the Rams on August 4 and generating an 88.2% betting probability that he would play this season, reports indicate that Donald's potential return has become more difficult as roster cutdown approaches. The specifics of the snag remain unclear, but the timeline pressure is real — the Rams must finalize their 53-man roster in the coming days, and fitting a player of Donald's caliber and contract implications into the math is a challenge that requires creative solutions.\n\nDonald, who retired after the 2023 season as arguably the greatest defensive player in NFL history, has been away from the game for two full years. The physical demands of returning to elite-level football after such a lengthy absence are immense, and while his workout reportedly went well, the gap between a controlled workout and the sustained violence of an NFL regular season is enormous. The Rams' willingness to even entertain this possibility speaks to both Donald's unparalleled talent and the team's all-in championship mentality.\n\nWhile the Donald situation unfolds, the on-field product has been all Rams. Matthew Stafford and Davante Adams showed elite chemistry in the team's final joint practice with the Saints, reinforcing the MVP-to-receiver bond that dominated the 2025 season. Stafford threw a career-high 46 touchdowns last year, and Adams was his primary target in an offense that ranked No. 1 in scoring. The duo's continued connection is the foundation upon which the Rams' championship aspirations are built.\n\nThe offensive line, a perennial concern for any NFL team, received optimistic news when Sean McVay said the Rams are 'hopeful' that rookie Keagen Trost can return before Week 1. Trost suffered a hamstring injury in the preseason opener against the Chiefs but is expected to be available for the historic Week 1 opener in Melbourne. Protecting Stafford is non-negotiable for a team that has built its entire identity around his arm.\n\nThe roster moves made this week — two free agents signed, two players placed on injured reserve, one linebacker waived — are the preliminary surgery of a team preparing for the final cut. Every move is calculated, and the competition for roster spots in the final days of the preseason creates a Darwinian intensity that often produces surprising results.\n\nThe bigger picture remains the same: the Rams are the NFL's consensus Super Bowl favorites, and the Donald decision — whatever it may be — is one piece of a puzzle that already features the league's most complete roster. Stafford, Adams, Garrett, Cooper Kupp, and a coaching staff led by one of the game's brightest minds in McVay give Los Angeles more star power and depth than almost any team in recent memory.", "analysis_zh": "Aaron Donald 的復出傳聞本週出現轉折。在 8 月 4 日完成與公羊的正式 workout 並產生 88.2% 的投注回歸機率後，報導指出隨著 roster cutdown 迫近，Donald 的潛在回歸已變得更加複雜。具體障礙仍不清楚，但時間壓力是真實的——公羊必須在未來幾天內finalize 他們的 53 人名單，而將 Donald 的 caliber 和 contract implications 塞進數學中，是一項需要創意解決方案的挑戰。\n\nDonald 在 2023 賽季後退休，被認為是 NFL 史上最偉大的防守球員，已離開比賽整整兩年。在如此長時間的缺席後重返精英級 football 的身體需求是巨大的，雖然據報導他的 workout 進展順利，但 controlled workout 和 NFL 正規賽 sustained violence 之間的差距是巨大的。公羊願意認真考慮這個可能性，既說明了 Donald 無與倫比的天賦，也體現了球隊 all-in 的冠軍心態。\n\n在 Donald 情況演變的同時，場上表現完全屬於公羊。Matthew Stafford 和 Davante Adams 在球隊與聖徒的最終 joint practice 中展現了 elite chemistry，強化了這對 MVP-to-receiver bond 在 2025 賽季的統治力。Stafford 上季投出生涯新高 46 次達陣，Adams 是他進攻中的首要目標，而這支進攻在得分上位居全聯盟第一。這對搭檔的持續連結，是公羊冠軍雄心的基石。\n\n進攻鋒線方面，Sean McVay 表示公羊對新秀 Keagen Trost 在 Week 1 前回歸「感到樂觀」。Trost 在季前賽 opener 對 Chiefs 時拉傷了腿筋，但預計能趕上在墨爾本的歷史性 Week 1 開幕戰。保護 Stafford 對一支以他手臂建立整個身份的球隊來說是 non-negotiable。\n\n本週的 roster 動作——簽下兩名自由球員、將兩名球員放進 IR、 waive 一名 linebacker——是球隊為最終 cut 做的初步手術。每一步都經過精算，季前賽最後幾天的 roster spots 競爭創造了一種達爾文式的 intensity，往往產生出人意料的結果。\n\n更大的圖景 remains the same：公羊是 NFL consensus 的超級碗頭號熱門，而 Donald 的決定——無論結果如何——只是一副 already 擁有聯盟最完整陣容的拼圖中的一塊。Stafford、Adams、Garrett、Cooper Kupp，以及由 McVay 這位聯盟最 bright minds 帶領的 coaching staff，給予洛杉磯比近 memory 中幾乎任何球隊都更多的 star power 和 depth。"}, {"team": "Rams", "accent": "#003594", "headline": "Historic Week 1 in Melbourne: Rams vs. 49ers on Netflix", "headline_zh": "歷史性 Week 1 在墨爾本：公羊對 49ers，Netflix 全球直播", "analysis": "The NFL's international ambitions reach a new milestone on Thursday, September 10, when the Rams face the San Francisco 49ers at the Melbourne Cricket Ground in the league's first-ever regular season game in Australia. The kickoff is set for 5:35 PM Pacific Time, and the game will be streamed exclusively on Netflix — a marriage of football and entertainment that signals the league's continued evolution into a global media property.\n\nFor the Rams, the Melbourne game is both an honor and a challenge. Playing 8,000 miles from home in a stadium that has never hosted an NFL regular season game requires logistical mastery, from travel planning to acclimatization to managing the time zone shift. McVay's ability to prepare his team for a unique environment will be tested from the moment they board the flight to Australia.\n\nThe choice of the Rams as one of the participants is no accident. Los Angeles is the league's entertainment capital, and the Rams' star-studded roster — Stafford, Adams, Garrett, Kupp — makes them the ideal ambassadors for the NFL's push into the Australian market. Australia has a passionate sports culture, and the combination of football, Netflix, and a prime-time slot creates the perfect conditions for a breakthrough broadcast.\n\nThe 49ers, as the Rams' NFC West rivals, provide the perfect opponent for the occasion. The divisional rivalry adds genuine competitive stakes to the international spectacle, ensuring that both teams will be motivated to perform at their best despite the unusual circumstances. San Francisco's own star power — Brock Purdy, George Kittle, Nick Bosa — makes this a matchup of legitimate Super Bowl contenders on foreign soil.\n\nFor Los Angeles fans, the timing is bittersweet. The game kicks off at 5:35 PM Pacific on a Thursday, meaning it will be an evening watch for West Coast viewers but will require early-morning commitment from Australian fans. The Netflix platform, however, offers the kind of on-demand flexibility that could make the game accessible to a global audience in ways that traditional broadcast television cannot match.\n\nThe Melbourne game is more than a novelty; it is a proof of concept for the NFL's global ambitions. If the broadcast is successful — and with Netflix's reach and the Rams' star power, there is every reason to believe it will be — it could open the door for more regular-season games in Australia and further expand the NFL's footprint in the Asia-Pacific region.", "analysis_zh": "NFL 的國際化雄心將在 9 月 10 日星期四達到新的里程碑，當公羊在墨爾本板球場（Melbourne Cricket Ground）迎戰舊金山 49ers，這是聯盟在澳洲的首場正規賽。開球時間定於太平洋時間下午 5:35，比賽將在 Netflix 上獨家串流——football 和娛樂的結合，標誌著聯盟持續進化為全球媒體資產。\n\n對公羊而言，墨爾本之戰既是榮耀也是挑戰。在距離家鄉 8,000 英里、從未舉辦過 NFL 正規賽的球場比賽，需要在旅行規劃、適應環境到管理時差等方面展現精準的後勤能力。McVay 為球隊準備獨特環境的能力，將從登上飛往澳洲的班機那一刻起接受考驗。\n\n公羊被選為參賽球隊並非偶然。洛杉磯是聯盟的 entertainment capital，公羊星光熠熠的陣容——Stafford、Adams、Garrett、Kupp——使他們成為 NFL 進軍澳洲市場的理想大使。澳洲有著熱情的運動文化，而 football、Netflix 和 primetime 時段的結合，創造了突破性轉播的完美條件。\n\n49ers 作為公羊的 NFC West 對手，為這個場合提供了完美的對手。分區 rivalry 為國際奇觀增添了真實的競爭 stakes，確保兩支球隊在不尋常的情況下仍有動力打出最佳表現。San Francisco 自身的 star power——Brock Purdy、George Kittle、Nick Bosa——使這場對決成為真正的超級碗競爭者在 foreign soil 上的較量。\n\n對洛杉磯球迷而言，時間點苦樂參半。比賽在太平洋時間星期四下午 5:35 開球，意味著西海岸觀眾將在傍晚觀看，但澳洲球迷則需 early-morning commitment。然而，Netflix 平台提供的 on-demand 靈活性，可能使這場比賽以傳統 broadcast television 無法匹敵的方式觸及全球觀眾。\n\n墨爾本之戰不僅是新奇事；它是 NFL 全球化雄心的概念驗證。若轉播成功——以 Netflix 的覆蓋率和公羊的 star power，有充分理由相信會成功——它可能為澳洲更多正規賽打開大門，進一步擴大 NFL 在亞太地區的 footprint。"}, {"team": "Rams", "accent": "#003594", "headline": "Super Bowl LXI at SoFi: Rams' Home-Field Title Shot Looms Large", "headline_zh": "超級碗 LXI 在 SoFi：公羊的主場奪冠機會浮現", "analysis": "While the Rams prepare for their season opener in Melbourne, a tantalizing subplot is taking shape closer to home. Super Bowl LXI will be played at SoFi Stadium — the Rams' home field — giving Los Angeles a potential opportunity to win the championship on their own turf for the second time in five years.\n\nThe significance of a home Super Bowl cannot be overstated. In NFL history, very few teams have had the opportunity to play for a championship in their own stadium, and the advantages are manifold: no travel fatigue, familiarity with the playing surface and environment, and the energy of a home crowd on the sport's biggest stage. The Rams experienced this firsthand when they won Super Bowl LVI at SoFi in February 2022, and the possibility of replicating that feat in 2027 has already become a talking point in preseason coverage.\n\nThe Rams' roster construction suggests they are building toward exactly this kind of moment. The blockbuster Myles Garrett trade, the pursuit of Aaron Donald's comeback, and the retention of Stafford's core offensive weapons all point to a team that is maximizing its championship window. With McVay at the helm and a roster that is arguably the deepest in the NFL, the Rams have the ingredients to not just make the Super Bowl, but to win it at home.\n\nThe pressure, however, cuts both ways. Playing in a home Super Bowl means the expectations are exponential — anything less than a championship would be viewed as a failure. The Rams experienced that pressure in the lead-up to Super Bowl LVI, and while they ultimately delivered, the mental toll of being the hunted rather than the hunter in your own building is a unique challenge that only a handful of coaches and players have navigated successfully.\n\nFor the broader Los Angeles sports landscape, a Rams Super Bowl victory at SoFi would be a watershed moment. The Rams have worked to establish themselves as LA's football team since returning from St. Louis, and a second championship at home would cement that status in a way that no amount of marketing or stadium branding could achieve.\n\nThe road to Super Bowl LXI begins in Melbourne on September 10, and every game between now and February is a stepping stone toward what could be the most significant chapter in Rams franchise history. The talent is there, the motivation is there, and the ultimate prize — a championship at home — is sitting there waiting to be claimed.", "analysis_zh": "當公羊為墨爾本的賽季揭幕戰做準備時，一個誘人的 subplot 正在離家更近的地方醞釀。超級碗 LXI 將在 SoFi Stadium——公羊的主場——舉行，給予洛杉磯在自己球場上奪得冠軍的潛在機會，這將是五年內的第二次。\n\n主場超級碗的意義不容低估。在 NFL 歷史上，極少有球隊有機會在自己的球場爭奪冠軍，而優勢是多方面的：無旅行疲勞、對比賽場地和環境的熟悉，以及 home crowd 在體育最大舞台上的能量。公羊在 2022 年 2 月於 SoFi 贏得超級碗 LVI 時親身體驗了這些，而在 2027 年重複這項壯舉的可能性，已成為季前賽報導的討論焦點。\n\n公羊的陣容建構顯示他們正是朝這種時刻打造的。Myles Garrett 的 blockbuster 交易、追求 Aaron Donald 的復出，以及保留 Stafford 的核心進攻武器，都指向一支正在最大化其冠軍窗口的球隊。在 McVay 掌舵和 arguably 全 NFL 最深的陣容下，公羊擁有不僅打進超級碗，更在主場贏得它的所有元素。\n\n然而，壓力是雙向的。在主場超級碗比賽意味著期望呈指數級——任何低於冠軍的結果都會被視為失敗。公羊在超級碗 LVI 之前就經歷了這種壓力，雖然他們最終 deliver 了，但在自己的大樓裡作為 the hunted 而非 the hunter 的心理負擔，是一種只有少數教練和球員成功 navigate 的獨特挑戰。\n\n對更廣泛的洛杉磯運動版圖而言，公羊在 SoFi 贏得超級碗將是一個分水嶺時刻。公羊自從聖路易斯返回後，一直在努力將自己確立為洛杉磯的 football team，而第二個主場冠軍將以任何行銷或球場品牌無法實現的方式，鞏固這個地位。\n\n通往超級碗 LXI 的道路始於 9 月 10 日的墨爾本，從現在到二月的每一場比賽，都是通往可能是公羊 franchise 歷史上最重要篇章的墊腳石。天賦在那裡，動力在那裡，而最終獎品——主場冠軍——正等待被奪取。"}], "closing": "From Tyler Glasnow's dominant return in Atlanta to Lincoln Riley's do-or-die season opener at the Coliseum to the Rams' march toward a home Super Bowl, Los Angeles sports is entering its most consequential stretch of 2026. The Dodgers are reassembling for October, USC is playing for Riley's legacy, and the Rams are chasing a championship on their own field. Buckle up — this is going to be a wild ride.", "closing_zh": "從 Tyler Glasnow 在亞特蘭大的強勢回歸，到 Lincoln Riley 在紀念體育場的背水一戰開幕戰，再到公羊朝主場超級碗邁進的步伐，洛杉磯運動正進入 2026 年最重要的篇章。道奇正在為十月重組，南加大在為 Riley 的 legacy 而戰，公羊則在追逐自己球場上的冠軍。繫好安全帶——這將是一段狂野的旅程。"};
let lang = "en";
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmtPT(iso){ return new Date(iso).toLocaleString("en-US",{timeZone:"America/Los_Angeles",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"})+" PT"; }

function renderDigest(d){
  const box = document.getElementById("digest");
  if(!d || !d.segments){
    box.innerHTML = '<div style="text-align:center;color:var(--dim);padding:40px">No digest yet</div>';
    return;
  }
  const segs = d.segments.map(s=>{
    const headline = lang==="en" ? s.headline : s.headline_zh;
    const analysis = lang==="en" ? s.analysis : s.analysis_zh;
    return '<div class="seg" style="--team:'+esc(s.accent)+'">' +
      '<div class="row"><span class="hn">'+esc(headline)+'</span><span class="badge">'+esc(s.team)+'</span></div>' +
      '<div class="lbl">'+(lang==="en"?"Analysis":"分析")+'</div><p>'+esc(analysis)+'</p>' +
      '</div>';
  }).join("");
  box.innerHTML =
    '<div class="dhead">' +
      '<div class="t"><div class="mic">🎙️</div><div><h2>'+esc(d.title)+'</h2><div class="meta">' +
        esc(d.read_time || "")+' · '+fmtPT(d.updated_at)+
        ' · 繁中/EN</div></div></div>' +
      '<div class="langs">'+
        '<button id="btnEn" class="on" onclick="setLang(\'en\')">EN</button>'+
        '<button id="btnZh" onclick="setLang(\'zh\')">繁體中文</button>'+
      '</div>' +
    '</div>' +
    '<div class="intro">'+esc(lang==="en"?d.intro:d.intro_zh)+'</div>' +
    '<div class="segs">'+segs+'</div>' +
    '<div class="closing">'+esc(lang==="en"?d.closing:d.closing_zh)+'</div>';
}
function setLang(v){ lang = v; document.getElementById("btnEn").classList.toggle("on", v==="en"); document.getElementById("btnZh").classList.toggle("on", v==="zh"); renderDigest(DIGEST_DATA); }

function renderNews(d){ const upd = document.getElementById("upd"); if(upd) upd.textContent = fmtPT(d.updated_at);
  const g = document.getElementById("grid"); g.innerHTML = "";
  for(const t of d.teams){
    const c = document.createElement("div"); c.className = "card"; c.style.setProperty("--team", t.accent);
    const emoji = t.emoji==="Baseball"?"⚾":t.emoji==="Football"?"🏈":"🏆";
    c.innerHTML =
      '<div class="top"><div class="ico">' + emoji + '</div>' +
      '<div><div class="name">' + esc(t.name) + '</div><div class="rec">' + t.sport + ' · ' + esc(t.record) + '</div></div></div>' +
      '<div class="hline">' + esc(t.headline) + '</div>' +
      '<h3>Latest News</h3><ul class="news">' + t.latest_news.map(n =>
        '<li><a target="_blank" rel="noopener" href="' + esc(n.url) + '">' + esc(n.title) + '</a><p>' + esc(n.summary) + '</p></li>'
      ).join("") + '</ul>' +
      '<h3>Fun Facts</h3><ul class="facts">' + t.fun_facts.map(f => '<li>'+esc(f)+'</li>').join("") + '</ul>' +
      '<h3>Further Reading</h3><ul class="read">' + t.further_reading.map(f =>
        '<li><a target="_blank" rel="noopener" href="' + esc(f.url) + '"><span>'+esc(f.title)+'</span><span class="why">'+esc(f.why)+'</span></a></li>'
      ).join("") + '</ul>' +
      '<div class="oss">' + esc(t.one_sentence) + '</div>';
    g.appendChild(c);
  }
}

renderDigest(DIGEST_DATA);
renderNews(TEAMS_DATA);
</script>
</body>
