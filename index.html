<style>
  :root{
    --bg:#0b0e14; --panel:rgba(255,255,255,.04); --panel2:rgba(255,255,255,.02);
    --line:rgba(255,255,255,.08); --fg:#edf2fa; --dim:#8a94a6;
    --radius:18px; --glow:0 0 0 1px rgba(255,255,255,.04), 0 24px 60px -30px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 500px at 20% -10%, rgba(42,111,216,.18), transparent 60%),
      radial-gradient(1000px 500px at 90% -10%, rgba(153,0,0,.14), transparent 60%),
      radial-gradient(900px 400px at 50% 110%, rgba(31,78,156,.16), transparent 60%),
      var(--bg);
    color:var(--fg); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
    padding:28px clamp(16px,4vw,64px) 64px;
  }
  header{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:26px}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{
    width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;
    background:linear-gradient(135deg,#2a6fd8,#991111);box-shadow:0 8px 30px -8px rgba(60,90,220,.6);
  }
  h1{font-size:clamp(22px,3vw,32px);font-weight:800;letter-spacing:-.02em}
  .sub{color:var(--dim);font-size:13px;margin-top:4px}
  .ticker{
    font-size:12px;color:var(--dim);padding:8px 14px;border-radius:99px;
    background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);
  }
  .ticker b{color:#7ce38b}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:20px}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;backdrop-filter:blur(14px);box-shadow:var(--glow);position:relative;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--team,#2a6fd8),transparent);
  }
  .top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .ico{
    width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;
    background:color-mix(in srgb,var(--team) 22%, transparent);
  }
  .name{font-size:18px;font-weight:800;letter-spacing:-.01em}
  .rec{font-size:11px;color:var(--team);font-weight:700;margin-top:2px}
  .hline{font-size:13px;line-height:1.5;color:var(--dim);padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);margin-bottom:16px}
  h3{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
  h3::after{content:"";flex:1;height:1px;background:var(--line)}
  .news{list-style:none}
  .news li{padding:10px 12px;border-radius:12px;margin-bottom:6px;background:var(--panel2);border:1px solid var(--line);transition:.2s}
  .news li:hover{border-color:color-mix(in srgb,var(--team) 50%, transparent);transform:translateX(3px)}
  .news a{color:var(--fg);text-decoration:none;font-weight:700;font-size:13px;display:block;margin-bottom:4px}
  .news a:hover{color:var(--team)}
  .news p{font-size:12px;color:var(--dim);line-height:1.5}
  .facts{list-style:none;display:grid;gap:6px}
  .facts li{position:relative;padding:2px 0 2px 18px;font-size:12.5px;color:var(--fg);line-height:1.55}
  .facts li::before{content:"⚡";position:absolute;left:0;top:2px;font-size:11px;filter:grayscale(.4)}
  .read{list-style:none;display:grid;gap:6px}
  .read a{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12.5px;color:var(--fg);text-decoration:none;padding:9px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
  .read a:hover{color:var(--team);border-color:color-mix(in srgb,var(--team) 50%, transparent)}
  .read .why{font-size:11px;color:var(--dim)}
  .oss{font-size:12.5px;line-height:1.6;color:var(--fg);background:linear-gradient(90deg,color-mix(in srgb,var(--team) 18%,transparent),transparent);border-left:3px solid var(--team);padding:10px 14px;border-radius:0 12px 12px 0;margin-top:16px}
  banner{display:block;text-align:center;color:var(--dim);font-size:13px;margin-top:22px}
  banner span{color:#7ce38b;animation:blink 1.5s infinite}
  @keyframes blink{50%{opacity:.3}}
  .spin{width:100%;height:100px;display:grid;place-items:center;color:var(--dim)}
  /* ---- digest ---- */
  .digest{
    background:linear-gradient(135deg,rgba(42,111,216,.12),rgba(153,0,0,.10),rgba(31,78,156,.12)),var(--panel);
    border:1px solid var(--line);border-radius:var(--radius);padding:26px;
    backdrop-filter:blur(14px);box-shadow:var(--glow);margin-bottom:22px;
  }
  .dhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;margin-bottom:14px}
  .dhead .t{display:flex;align-items:center;gap:12px}
  .mic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:linear-gradient(135deg,#2a6fd8,#991111)}
  .dhead h2{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .dhead .meta{color:var(--dim);font-size:12px;margin-top:3px}
  .langs{display:flex;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:4px}
  .langs button{border:0;background:transparent;color:var(--dim);font-size:12px;font-weight:700;padding:6px 16px;border-radius:99px;cursor:pointer;transition:.2s}
  .langs button.on{background:linear-gradient(135deg,#2a6fd8,#1f4e9c);color:#fff}
  .intro{font-size:14px;line-height:1.65;color:var(--fg);max-width:820px;margin-bottom:18px}
  .segs{display:grid;gap:12px}
  .seg{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--panel2)}
  .seg .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .seg .row .hn{font-weight:800;font-size:14.5px}
  .seg .badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--team,#2a6fd8) 20%,transparent);color:var(--team);white-space:nowrap}
  .seg p{font-size:12.5px;line-height:1.6;color:var(--dim);margin-top:6px}
  .seg p.cls{color:var(--fg)}
  .seg .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin-top:10px;font-weight:700}
  .closing{font-size:14px;line-height:1.6;border-top:1px dashed var(--line);margin-top:16px;padding-top:14px;color:var(--fg)}
</style>

const DIGEST_DATA = {"updated_at": "2026-09-01T06:00:04-07:00", "title": "LA Sports Daily Digest — 15-Minute Edition", "read_time": "~15 minutes", "intro": "September arrives with the LA sports calendar hitting full throttle. The Dodgers just took a series in Detroit behind a Glasnow gem, but the bigger headline is Shohei Ohtani's pitching future hanging in the balance; USC's Jayden Maiava torched San José State for 286 yards and three touchdowns as the Trojans chase their first-ever College Football Playoff berth; and the Rams named a record 11 captains, cut to 53, and are now ten days from kicking off the NFL's inaugural game in Australia. Here's what matters — and why it matters now.", "intro_zh": "九月降臨，洛杉磯的賽事日程全面升溫。道奇剛在底特律靠著 Glasnow 的完投佳作拿下系列賽，但更大的頭條是大谷翔平的投球前途命懸一線；南加大的 Jayden Maiava 以 286 码、三次達陣的數據大火力焚燒聖荷西州大，特洛伊正追逐隊史首度的大學季後賽入場券；公羊則創紀錄地選出 11 名隊長、裁員至 53 人，距離在澳洲踢出 NFL 歷史首場比賽僅剩十天。以下是今日重點——以及為何此刻別具意義。", "segments": [{"team": "Dodgers", "accent": "#2A6FD8", "headline": "Glasnow Deals Seven Strong Innings as Dodgers Clinch Detroit Series", "headline_zh": "Glasnow 投出七局強投，道奇拿下底特律系列賽", "analysis": "Tyler Glasnow delivered exactly what the Dodgers needed Sunday afternoon in Detroit, throwing seven innings of one-run ball on just 85 pitches to clinch the series rubber match 6-1. The right-hander allowed just two hits and a walk, looking fully operational barely a week after his Aug. 25 activation from the 60-day injured list. It was a performance that answered the only question that mattered: is Glasnow healthy enough to be a postseason rotation pillar?\n\nThe answer was emphatic. Glasnow's pitch efficiency — 85 pitches over seven frames — suggests a pitcher operating with full command of his arsenal, not someone carefully managing a workload. Just two starts into his comeback, he's 3-0 with a 3.02 ERA, and the Dodgers have quietly added a frontline arm back to a rotation that already featured Skubal, Snell, and Yamamoto.\n\nFrom an analyst's perspective, this outing crystallizes the Dodgers' October pitch count. If Glasnow sustains this form through September, LA walks into the postseason with a four-man rotation that can stack up against anyone in the National League. The depth becomes not just insurance but a strategic weapon — the ability to deploy any combination in short series where matchup advantages decide outcomes.\n\nThe timing matters too. With Roki Sasaki sidelined by a blister and Ohtani's pitching status in doubt, Glasnow's emergence removes the anxiety around rotation depth. What looked like a vulnerability a week ago now looks like a strength. The Dodgers can afford to be patient with both Sasaki's recovery and Ohtani's decision-making because Glasnow has proven he can carry a share of the October load.", "analysis_zh": "Tyler Glasnow 在底特律的週日下午賽交出了道奇所需的完美答卷——僅用 85 球投滿七局，被敲兩安、一次保送、失一分，以 6-1 拿下系列賽決勝戰。距他 8 月 25 日自 60 天傷兵名單回歸僅兩場先發，這位右投便用實際表現回答了最關鍵的問題：他是否健康到足以擔任季後賽輪值的核心支柱？\n\n答案是肯定且不容質疑的。Glasnow 以 85 球完成七局的投球效率，顯示的是一名完全掌控武器庫的投手，而非小心翼翼管理工作量的傷兵。回歸僅兩場先發，他已拿下 3 勝 0 敗、防禦率 3.02，而道奇悄悄地在本就擁有 Skubal、Snell 與 Yamamoto 的輪值中，重新添入了一名前線級投手。\n\n從分析師的角度來看，這場先發為道奇的十月投手編制勾勒出清晰輪廓。倘若 Glasnow 能在九月底前維持此水準，道奇將帶著足以抗衡國聯任何對手的四人輪值進入季後賽。深度不僅僅是保險，更成為一項戰略武器——在短系列賽中，能夠靈活調度的任何組合，往往是決定勝負的關鍵。\n\n出場的時機也至關重要。在 Roki Sasaki 因水泡缺陣、大谷翔平投球地位不確定之際，Glasnow 的崛起消弭了輪值深度的焦慮。一週前看似漏洞的東西，如今成為了優勢。道奇可以從容等待 Sasaki 復出與大谷的決定，因為 Glasnow 已證明他有能力在十月扛起一部分重擔。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Ohtani's Pitching Return in Serious Doubt — Shutdown Considered", "headline_zh": "大谷翔平的投球回歸嚴重存疑——球團正考慮全面關機", "analysis": "The Shohei Ohtani pitching watch took its most ominous turn yet this weekend. Dave Roberts ruled Ohtani out of Sunday's start and confirmed he won't start Tuesday against the Cardinals, citing the left knee inflammation, right biceps soreness, and general body issues that have kept him off the mound since July 3. More troublingly, Roberts admitted the organization is now considering shutting Ohtani down as a pitcher entirely to protect his offensive value heading into October.\n\nThe numbers before the shutdown remain staggering: 14 starts, an 8-2 record, a 1.79 ERA, and 95 strikeouts in 85⅔ innings. That's Cy Young-caliber production. But those numbers belong to a version of Ohtani that may not exist again this season, and the Dodgers are increasingly behaving like a front office that has accepted that reality.\n\nThe strategic calculus is straightforward, if bittersweet. The Dodgers are built to win a World Series with Ohtani as a designated hitter — his bat alone transforms a lineup that was already elite. Adding pitching was supposed to be the luxury that made this team unbeatable. Now the club must reconcile the loss of that luxury with the imperative to keep their most valuable asset on the field for the entire postseason.\n\nWhat makes this moment significant is the precedent it sets. If the Dodgers shut down Ohtani the pitcher and still win the World Series, it validates the two-way experiment as a regular-season weapon rather than a postseason necessity. If they need his arm in October and he's unavailable, it becomes a cautionary tale about managing generational talent across 162 games. Either way, this decision will shape how the franchise handles Ohtani for years to come.", "analysis_zh": "大谷翔平的投球回歸時間表在這個週末出現了最令人擔憂的轉折。Dave Roberts 排除了大谷週日先發的可能性，並證實他不會在週二對紅雀的比賽中先發，理由是左膝發炎、右二頭肌痠痛以及全身不適，自 7 月 3 日起他便未再踏上投手丘。更令人憂心的是，Roberts 承認球團正考慮完全關閉大谷的投手身分，以保護他在十月的攻擊價值。\n\n停機前的數據依然驚人：14 場先發、8 勝 2 敗、防禦率 1.79、85⅔ 局送出 95 次三振。這是賽揚獎等級的表現。但這些數字屬於本季可能不會再現的大谷版本，而道奇的管理層正越來越像是已經接受這項事實的球團。\n\n戰略上的取捨雖然苦澀，卻十分明確。道奇隊已是一支能僅憑大谷指定打擊身分贏得世界大賽的球隊——他的打擊 alone 就能改變一個本已精英的打線。投球原本被視為讓這支球隊無可匹敵的奢侈加成。如今，球團必須在失去這份奢侈與確保最有價值資產能在整個季後賽上場之間找到平衡。\n\n此刻之所以意義重大，在於它所設下的先例。倘若道奇關閉大谷的投手身分卻依然奪冠，這將驗證二刀流實驗是例行賽武器而非季後賽必需品。倘若十月需要他的投球而他無法上場，這將成為管理跨 162 場賽程的世代級天賦的警示故事。無論結果如何，這項決定將影響這支球隊未來數年對待大谷的方式。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Will Smith Set to Return From 60-Day IL on Roster Expansion Day", "headline_zh": "Will Smith 於名單擴充日正式回歸60天傷兵名單", "analysis": "Catcher Will Smith will be reinstated from the 60-day injured list on Sept. 1, the Dodgers announced, completing a rehab assignment with Triple-A Oklahoma City. Smith has been sidelined since June 11 with neck inflammation, and his return coincides perfectly with roster expansion — giving the Dodgers an immediate boost behind the plate for the season's final month.\n\nSmith's return addresses one of the quieter concerns on the roster. The Dodgers' catching depth was tested during his absence, with Dalton Rushing shouldering an increased workload. While Rushing performed admirably, Smith's postseason pedigree — years of delivering in high-leverage October at-bats — makes him an irreplaceable piece for a team chasing a three-peat.\n\nThe timing of the reinstatement is strategic. Sept. 1 marks the traditional roster expansion date, allowing teams to add players without the usual 40-man constraints. By activating Smith on this date, the Dodgers maximize their September flexibility without sacrificing a roster spot they might need elsewhere.\n\nFor the stretch run, Smith's presence does more than just upgrade the catching position. He provides a veteran presence in the clubhouse during the most pressurized portion of the schedule, stabilizes the pitching staff's battery dynamics, and gives the lineup a switch-hitting threat who thrives in October. It's a reunion that arrives at precisely the right moment.", "analysis_zh": "道奇宣布捕手 Will Smith 將於 9 月 1 日自 60 天傷兵名單回歸，此前他已在奧克拉荷馬城 3A 完成復健賽assignment。自 6 月 11 日因頸部發炎缺陣至今，Smith 的回歸恰逢名單擴充日，為道奇在賽季最後一個月立即增添了本壘後方的戰力。\n\nSmith 的歸隊解決了陣容中較為安靜的隱憂。在他缺陣期間，道奇的捕手深度受到了考驗，Dalton Rushing 扛起了更大的工作量。儘管 Rushing 表現出色，Smith 在季後賽累積的經驗——歷年在十月高張力打席中的穩定貢獻——使他成為這支追求三連霸的球隊中不可或缺的拼圖。\n\n復出時間的安排具有策略性。9 月 1 日是傳統的名單擴充日期，允許球隊在不受通常 40 人限制的情況下增加球員。透過在這一天激活 Smith，道奇在不犧牲其他位置名額的前提下，最大化了九月的調度彈性。\n\n對於最後衝刺階段而言，Smith 的存在所做的不僅僅是升級捕手位置。他在賽程最具壓力的時期為休息室帶來老將領袖的穩定作用，穩固了投手群的配球動態，也為打線增添了一位擅長在十月表現的左右開弓威脅。這是一場在精確時機上演的重逢。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Kyle Tucker's Prolonged Slump Becomes Clubhouse Conversation", "headline_zh": "Kyle Tucker 的長期低潮成為休息室討論焦點", "analysis": "The $240 million man is running out of time to find his swing. Kyle Tucker is batting .232/.327/.368 with just 11 home runs across roughly 120 games — numbers that would be disappointing for a league-average outfielder, let alone a marquee free-agent signing expected to anchor the Dodgers' lineup. Now teammates are speaking publicly about the slump, and the conversation has shifted from patience to concern.\n\nMookie Betts and Miguel Rojas both addressed Tucker's struggles in recent days, with Roberts comparing the situation to his own offensive downturn in 2025. The public nature of these comments is notable — veteran players rarely discuss a teammate's struggles openly unless they believe the issue needs external attention or the player needs a push.\n\nThe context amplifies the concern. Tucker was brought in to be the middle-of-the-order bat that complements Ohtani and Betts in October. Instead, the Dodgers are getting production from that slot that's barely above replacement level. For a team with championship aspirations, that's not just a roster hole — it's a strategic vulnerability that opposing pitching staffs will target in short series.\n\nThe silver lining, if there is one, is that September provides a runway for adjustment. With the division already locked up, the Dodgers can afford to give Tucker at-bats against quality pitching without the pressure of a pennant race. If he can find even a fraction of his Houston form before October, the lineup transforms from good to terrifying. If he can't, the Dodgers will need to decide whether a high-priced bat belongs on the postseason roster at all.", "analysis_zh": "這位身價 2.4 億美元的球星，正逐漸失去找到打擊節奏的時間。Kyle Tucker 出賽約 120 場，打擊率僅 .232/.327/.368，全壘打僅 11 發——這份成績單若放在普通外野手身上都嫌失望，何況是道奇為支撐季後賽打線而引進的招牌自由球員簽約。如今隊友已公開討論這段低潮，而氛圍已從「耐心等待」轉為「正式關切」。\n\nMookie Betts 和 Miguel Rojas 近日都針對 Tucker 的掙扎表態，Roberts 則將此情況與自己 2025 年的攻擊下滑相提並論。這些公開發言的意涵值得玩味——資深球員極少公開討論隊友的掙扎，除非他們認為問題需要外部關注，或該名球員需要一記推力。\n\n背景更放大了這份擔憂。Tucker 被引進來擔綱在十月與 Ohtani 和 Betts 搭檔的中心棒次打者。但現實是，道奇從該棒次獲得的產出僅略優於替補水準。對於一支以冠軍為目標的球隊而言，這不僅是陣容缺口——更是對手投手群在短系列賽中會針對的戰略性弱點。\n\n一線希望，如果有的話，在於九月提供了一個調整的跑道。在分區冠軍已大勢底定的情況下，道奇可以讓 Tucker 在無冠軍賽壓力的環境中對抗優質投手取得打數。倘若他能在十月前找回哪怕一點在休士頓時期的水準，打線將從優秀升級為恐怖。倘若找不到，道奇將面臨一項艱難的決定：這支高薪打擊棒是否該出現在季後賽名單上。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Sasaki Lands on IL With Blister — Prospect Opportunity Opens", "headline_zh": "Sasaki 因水泡進入傷兵名單——新秀機會浮現", "analysis": "Roki Sasaki was placed on the 15-day injured list on Aug. 27 after exiting his start in Atlanta with a right middle finger blister, ending a stretch in which the young right-hander had been building toward consistency. Sasaki allowed four runs in 3⅓ innings before the blister forced his removal, and the Dodgers expect him back by mid-September — a timeline that, if accurate, would give him enough ramp-up time for a postseason role.\n\nThe blister issue is familiar territory for pitchers, particularly those with Sasaki's explosive fastball grip. It's a minor ailment that can become major if rushed, and the Dodgers' decision to IL him rather than push through suggests a long-term view. They need Sasaki healthy in October more than they need him healthy in late August.\n\nThe corresponding roster move creates an interesting opportunity. Sasaki's absence opens a rotation spot that the Dodgers could fill with a prospect, giving the front office a chance to evaluate young arms in meaningful September games. With their farm system ranked No. 1 in baseball, the organization has the luxury of calling up talent that might otherwise be blocked.\n\nFor Sasaki personally, the IL stint is a reset. He's shown flashes of the dominance that made him a generational prospect, but consistency has been elusive. A brief rest, followed by a September return with a clear mandate — perform or be squeezed out of the postseason rotation — could be the catalyst that transforms potential into production when it matters most.", "analysis_zh": "Roki Sasaki 於 8 月 27 日因右手中指水泡被列入 15 天傷兵名單，終結了這位年輕右投近期持續尋找穩定性的過程。Sasaki 在被迫退場前的亞特蘭大先發中投了 3⅓ 局失 4 分，道奇預計他能在九月中旬歸隊——若時程準確，這將為他提供足夠的復健時間以爭取季後賽角色。\n\n水泡對投手而言是熟悉的困擾，尤其對像 Sasaki 這類擁有爆發力快速球握法的投手更是如此。這是一個輕微的傷勢，但若操之過急便可能演變成大問題。道奇選擇將他放入傷兵名單而非硬撑，顯示了長遠思維——他們需要的是十月健康的 Sasaki，而非八月底健康的 Sasaki。\n\n對應的人事調動創造了一個有趣的機會。Sasaki 的缺陣空出了一個先發位置，道奇可以考慮拉上一名新秀填補，讓管理層有機會在有實質意義的九月賽事中評估年輕投手。在農場系統排名全聯盟第一的優勢下，這支球隊有著調升被卡位天賦的奢侈。\n\n對 Sasaki 個人而言，這段傷兵名單是一次重置。他已展現出足以使他成為世代級新秀的潛力，但穩定性一直難以捉摸。短暫休息後，以明確任務——表現或被擠出季後賽輪值——在九月歸隊，可能正是催化潛力在最關鍵時刻轉化為實績的觸發點。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "Maiava and Freshman Playmakers Torch SJSU in 42-26 Season-Opening Win", "headline_zh": "Maiava 與新秀攻擊群大火力焚燒聖荷西州大，42-26 開幕戰大勝", "analysis": "USC's 2026 campaign began with a statement. Jayden Maiava went 25-of-29 for 286 yards and two touchdowns through the air, added a rushing score, and orchestrated an offense that held the ball for 37 minutes and 15 seconds while converting 9 of 13 third downs. The Trojans' 42-26 win over San José State at the Coliseum wasn't just a season-opening victory — it was a preview of an offense that's reloaded despite losing its top receivers.\n\nThe most encouraging development was the emergence of true freshman Trent Mosley, who caught five passes for 118 yards including a 14-yard touchdown in his college debut. Kayden Dixon-Wyatt also found the end zone, signaling that USC's rebuilt receiver room has immediate-impact talent. For a program that lost significant production to the NFL Draft, this kind of seamless transition is rare and valuable.\n\nMaiava's efficiency was staggering. Completing 86.2% of his passes in a season opener against an FBS opponent speaks to both his command and the chemistry he's built with new targets during the offseason. With a 91.2 QBR that led the nation in 2025, the redshirt senior has the tools and the track record to make a Heisman push — and this opener gave him the perfect launchpad.\n\nThe Coliseum crowd delivered the home-field advantage that defined USC's 2025 perfection at home. The Trojans went 7-0 at the Coliseum last season, and maintaining that dominance is table stakes for a team with CFP aspirations. The real test comes on the road, where USC went 2-4 last year and where seasons are ultimately decided. But for one Saturday, the Trojans looked every bit the contender their ranking suggests.", "analysis_zh": "南加州大學的 2026 賽季以一記宣示揭開序幕。Jayden Maiava 全場 29 次傳球完成 25 次、推進 286 碼並送出兩記傳球達陣，另有一記跑球達陣，他所主導的進攻掌控了 37 分 15 秒的持球時間，並在 13 次第三檔轉換中成功 9 次。特洛伊在南加大球場以 42-26 擊敗聖荷西州大，這不僅是一場開幕戰勝利——更是一套在失去頭號接球手後仍成功重組的進攻系統的預覽。\n\n最令人振奮的發展是真新秀 Trent Mosley 的崛起，他在大學首秀中接球 5 次推進 118 碼，包括一記 14 碼的達陣。Kayden Dixon-Wyckett 也攻入達陣區，顯示 USC 重組的接球手群擁有即戰力的新血。對一支在選秀中流失了大量產出的球隊而言，如此無縫的過渡既罕見又珍貴。\n\nMaiava 的效率令人震驚。在開幕戰中對 FBS 對手完成 86.2% 的傳球成功率，反映的是他對球的掌控以及休賽季與新接球手之間建立的化學反應。挾著 2025 年全美最高的 91.2 QBR，這位大四預備四分衛擁有爭取海斯曼獎的工具與實績——而這場開幕戰給了他最完美的起飛平台。\n\n南加大球場的觀眾提供了主場優勢，這正是 2025 年特洛伊主場完美的定義所在。去年 USC 在南加大球場 7 勝 0 敗，維持這項統治力是怀揣 CFP 野心球隊的基本門檻。真正的考驗在於客場——去年 USC 客場僅 2 勝 4 敗，而球季的最終成敗往往在客場見分曉。但至少在這個週六，特洛伊看起來確實如其排名所示，是一支有力的競爭者。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "Hall of Famer Gary Patterson Takes Over as Defensive Coordinator", "headline_zh": "名人堂教頭 Gary Patterson 接任防守協調員", "analysis": "Lincoln Riley made the most significant staff hire of his USC tenure by bringing in Gary Patterson — a 2025 College Football Hall of Famer and the architect of TCU's rise to national prominence — as defensive coordinator. Patterson inherits a unit that ranked just 13th in the Big Ten in 2025, a persistent weakness that has undermined otherwise elite offensive production in Riley's four seasons.\n\nThe hire signals a philosophical shift. Patterson built his reputation on aggressive, multiple defensive schemes that prioritized disrupting opposing quarterbacks. His TCU defenses were consistently among the nation's best, and his ability to develop NFL-caliber defensive talent is well documented. For a USC program that has struggled to stop quality offenses, this represents a dramatic upgrade in both scheme sophistication and recruiting credibility.\n\nPatterson's staff additions further reinforce the defensive overhaul. Paul Gonzales was brought in as safeties coach and DB pass game coordinator, while Mike Ekeler will oversee special teams — a unit that has been an Achilles' heel in recent years. The combination of Patterson's schematic mind and his staff's specialized expertise addresses the exact weaknesses that cost USC games under previous defensive coordinators.\n\nThe challenge, as always, is implementation. Patterson is installing an entirely new system with players recruited for a different scheme, and the transition period in Year 1 is always unpredictable. But the talent is there — USC's 2026 recruiting class, with its emphasis on defensive players, was clearly designed with Patterson's arrival in mind. If the scheme and the talent converge, the Trojans' biggest weakness could become their defining strength.", "analysis_zh": "Lincoln Riley 在 USC 執教期間做出了最重要的教練團人事任命——延攬 Gary Patterson，一位 2025 年入選大學足球名人堂、曾帶領 TCU 崛起至全國強權的防守大師，擔任防守協調員。Patterson 接手的是一個 2025 年在 Big Ten 僅排名第 13 的防守單位，這是在 Riley 四個賽季中持續困擾這支球隊、讓精英級攻擊產出功虧一簣的結構性弱點。\n\n這項聘雇象徵著哲學上的轉變。Patterson 以積極多變、強調破壞對手四分衛節奏的防守體系建立聲望。他執教的 TCU 防守長期位居全國最佳之列，而他培養 NFL 等級防守人才的能力亦有目共睹。對於一支長期無法阻止優質攻勢的 USC 而言，這代表著在體系複雜度與招募公信力上的雙重劇烈升級。\n\nPatterson 的教練團人事進一步強化了這波防守大改組。Paul Gonzales 被聘為安全衛教練兼防守後衛传球協調員，而 Mike Ekeler 則負責特勤組——這是近年來的阿基里斯腱。Patterson 的體系頭腦與其團隊的專業知識相結合，精準地針對了在前任防守協調員麾下讓 USC 付出代價的那些弱點。\n\n挑戰一如既往，在於執行。Patterson 正在為一批為不同體系招募的球員安裝一套全新的系統，而第一年的過渡期往往難以預測。但天賦就在那裡——USC 2026 年以防守球員為重心的招募班底，顯然正是為了配合 Patterson 的到來而設計。倘若體系與天賦能夠匯流，特洛伊最大的弱點可能轉化為他們最具代表性的強項。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "USC Lands No. 1 Recruiting Class Nationally for 2026", "headline_zh": "南加大簽下全美第 1 的 2026 年招募班底", "analysis": "The future has already arrived in Troy. Led by general manager Chad Bowden, USC signed 35 players — including five-star tight end Mark Bowman, five-star defensive lineman Jahkeem Stewart, and five-star quarterback Husan Longstreet — to a class that ranked first nationally on Rivals, On3, and 247Sports. It's the program's first No. 1 class since 2007, a two-decade wait that underscores the magnitude of the accomplishment.\n\nThe class's defensive emphasis is the most significant detail. The top five rated commits are all defensive players — a direct response to the unit that sabotaged USC's 2025 playoff hopes. In Patterson's new scheme, these blue-chip defenders aren't just roster additions; they're foundational pieces for a defensive identity that could transform the program's trajectory.\n\nWhat makes this class transformative rather than merely impressive is the infrastructure behind it. NIL investment, the Bloom Performance Center, and the coaching staff's revamped recruiting operation all contributed to landing talent that previously might have chosen Alabama, Georgia, or Ohio State. USC is competing at the highest level of the sport's talent market for the first time in years.\n\nThe pressure this creates is real and welcome. Rankings don't win games — development does — but the caliber of incoming talent gives Patterson and the defensive staff the raw materials to build something sustainable. If even half of these blue-chip players contribute meaningfully by 2027, USC's defensive transformation will be complete, and Riley's rebuild will have its crowning evidence.", "analysis_zh": "特洛伊的未來已經提前到來。在總經理 Chad Bowden 的操盤下，USC 簽下了 35 名球員——包括五星近端鋒 Mark Bowman、五星防守內線 Jahkeem Stewart，以及五星四分衛 Husan Longstreet——這份班底在 Rivals、On3 與 247Sports 三榜皆排名全美第一。這是該校自 2007 年以來首個全美第一的招募班底，長達二十年的等待凸顯了這項成就的份量。\n\n班底以防守為重的取向是最值得關注的細節。評級最高的前五名新秀全部都是防守球員——這是針對曾在 2025 年破壞 USC 季後賽希望的防守單位的精準回應。在 Patterson 的新體系中，這些藍籌防守新血不只是名單補強——它們是可能改變球隊發展軌跡的防守身份基礎拼圖。\n\n讓這批班底具備轉化性而非僅僅令人印象深刻的原因，在於其背後的基礎建設。NIL 投資、Bloom 訓練中心，以及教練團重組的招募機制，共同促成了網羅以往可能選擇阿拉巴馬、喬治亞或俄亥俄州大的人才。USC 這是多年來首次在全聯盟最高層級的人才市場上參與競爭。\n\n由此產生的壓力是真實且值得歡迎的。排名本身不會贏球——養成才會——但 incoming talent 的品質，賦予了 Patterson 與防守教練團打造可持續發展的原始材料。倘若這批藍籌新秀中有一半能在 2027 年前做出實質貢獻，USC 的防守轉型便算完成，而 Riley 的重建也將擁有最有力的證明。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "USC Moves Into $200-Million Bloom Football Performance Center", "headline_zh": "南加大遷入耗資逾 2 億美元的 Bloom 足球訓練中心", "analysis": "USC's institutional investment in football has reached its physical apex. The Trojans opened their 163,000-square-foot, three-story Bloom Football Performance Center during fall camp — a facility that Lincoln Riley called a sign the program is 'more equipped than at any point in the previous few years.' The center features two practice fields, a recovery suite with AI-powered massage chairs and sleep pods, a 45-foot walk-through screen, and a lobby showcasing 11 national championships and 8 Heisman Trophies.\n\nIt's the second-largest capital project in USC Athletics history, and its impact extends far beyond aesthetics. In the modern college football arms race, facilities are recruiting weapons — tangible proof that a program is committed to competing at the highest level. The Bloom Center puts USC on equal footing with the Alabamas, Georgias, and Ohio States of the sport.\n\nThe timing is critical. Riley enters his fifth season on the hottest seat of his tenure, and the Bloom Center is both a reward for past recruiting success and a tool for future ones. The facility doesn't just attract talent; it retains it. Players who train in world-class surroundings are more likely to stay committed to the program, and the center's recovery resources give USC a competitive edge in player health and development.\n\nFor a program that has invested heavily in coaches and players, the Bloom Center represents the third pillar: infrastructure. Together with Patterson's defensive overhaul and the No. 1 recruiting class, it completes a trifecta of upgrades that should sustain USC's rise for years to come. Whether it translates into wins this fall depends on execution — but the foundation has never been stronger.", "analysis_zh": "USC 對足球的機構投資已達到其實質的頂峰。特洛伊在秋季訓練營期間啟用了佔地 16.3 萬平方英尺、共三層樓的 Bloom 足球訓練中心——一座 Lincoln Riley 稱之為球隊「比過去數年任何時期都更有裝備」的設施。中心內含兩座練習場、配備 AI 按摩椅與睡眠艙的恢復套件、一座 45 英尺的走位觀看螢幕，以及陳列 11 座全國冠軍與 8 座海斯曼獎獎盃的大廳。\n\n這是 USC 體育史上第二大資本工程，其影響力遠超出美學範疇。在當今大學足球的軍備競賽中，訓練中心就是招募武器——一個球隊以最高水準競爭的實質證明。Bloom 中心讓 USC 與阿拉巴馬、喬治亞和俄亥俄州大等強權站在相同的立足點上。\n\n時機至關重要。Riley 以任內最炙熱的飯碗進入第五個賽季，而 Bloom 中心既是對過去招募成就的獎賞，也是未來招募的工具。這座設施不只吸引人才；它留住人才。在世界級環境中訓練的球員更可能維持對球隊的承諾，而中心的恢復資源也賦予 USC 在球員健康與發展上的競爭優勢。\n\n對一支在教練與球員身上已大量投資的球隊而言，Bloom 中心代表了第三根支柱：基礎設施。與 Patterson 的防守改組和全美第一的招募班底相結合，它完成了三項升級的三位一體，應能支撐 USC 未來數年的崛起。它能否在今秋轉化為勝利，取決於執行力——但基礎從未如此穩固。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "Center Kilian O'Connor Lost for Season to Freak Injury", "headline_zh": "中鋒 Kilian O'Connor 因怪異傷勢赛季报销", "analysis": "USC suffered a significant blow before the season even began. Riley announced on Aug. 6 that redshirt senior center Kilian O'Connor suffered a 'non-contact freak injury' and will miss the entire 2026 season. Tobias Raymond has moved into the starting center role, but the loss of O'Connor — a veteran presence on the offensive line — creates an immediate void in both production and leadership.\n\nThe timing is particularly cruel. O'Connor was entering his sixth year in the program, and the center is the quarterback of the offensive line — responsible for protection calls, run-game checks, and the kind of pre-snap communication that separates good lines from great ones. Replacing that experience isn't just about physical ability; it's about the intangible communication that makes an offensive line function.\n\nRaymond's promotion represents the next-man-up philosophy in action, but it also creates a ripple effect across the line. Every position group is interconnected, and the adjustment at center will require the entire unit to recalibrate its communication and chemistry. For a team with CFP aspirations, early-season cohesion is essential.\n\nThe silver lining is that USC's offensive line has depth and that the early-season schedule provides time for Raymond to grow into the role. The Bloom Performance Center's training resources also give him access to elite development tools. But the loss of O'Connor is a reminder that even the most carefully constructed rosters are vulnerable to the randomness of injury — and that depth isn't just a luxury, it's a necessity.", "analysis_zh": "USC 在賽季尚未開始前便遭受了重大打擊。Riley 於 8 月 6 日宣布，大四預備中鋒 Kilian O'Connor 遭受「非接觸性怪異傷勢」，將缺席整個 2026 賽季。Tobias Raymond 已移入先發中鋒位置，但失去 O'Connor——一位在進攻線上的老將領袖——立即在產出和領導力兩方面留下了空缺。\n\n時機尤其殘酷。O'Connor 正進入他在球隊的第六年，而中鋒是進攻線的四分衛——負責保護呼叫、跑動戰檢查，以及那種讓好進攻線與偉大進攻線分道揚鑣的開球前溝通。替換這份經驗所涉及的不僅是身體能力；更是讓進攻線運作無間的無形溝通。\n\nRaymond 的晉升代表了「下一位接棒」哲學的實踐，但它也在整條進攻線上產生了連鎖效應。每個位置群都相互關聯，中鋒位置的調整將要求整組單位重新校準其溝通與化學反應。對於一支怀揣 CFP 野心的球隊而言，開季的凝聚力至關重要。\n\n一線希望在於 USC 的進攻線具備深度，且早期賽程提供了 Raymond 成長為該角色的時間。Bloom 訓練中心的資源也賦予他頂級的發展工具。但 O'Connor 的缺陣提醒我們，即使最精心編排的名單也無法倖免於傷病的隨機性——而深度不僅僅是奢侈品，更是必需品。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "Trojans Chasing First-Ever CFP Berth With Loaded Schedule Ahead", "headline_zh": "特洛伊追尋隊史首張 CFP 門票，強敵環伺的賽程在前方等候", "analysis": "USC hasn't made the College Football Playoff in 12 years of its existence, even after the format expanded to 12 teams in 2024. That drought is the defining narrative of Lincoln Riley's tenure, and the 2026 season represents the best — and perhaps last — chance to end it. The combination of an elite offense, a redesigned defense, a No. 1 recruiting class, and a new facility creates the most complete package Riley has had in LA.\n\nThe schedule, however, is unforgiving. USC hosts Ohio State at the Coliseum on Halloween — the Buckeyes haven't visited LA since 2008, and that game will be the ultimate litmus test for the Trojans' CFP credentials. Road trips to Big Ten opponents loom throughout October and November, and the Trojans' 2-4 road record in 2025 remains the most glaring vulnerability.\n\nThe offensive firepower is undeniable. With Maiava, a Heisman-caliber quarterback, and a receiving corps that just proved it can produce without its top names, USC has the tools to outscore almost anyone. The question has always been whether the defense can hold up against quality opponents — and that's exactly what Patterson was hired to address.\n\nFor the program, the stakes couldn't be higher. If USC reaches the CFP, Riley's rebuild is validated and the trajectory points upward. If the Trojans fall short again, the conversation about his future becomes unavoidable. Every Saturday between now and January is a referendum on whether the investment — in coaches, facilities, and talent — has produced the results it promised.", "analysis_zh": "南加大在大學季後賽（CFP）存在的 12 年間從未入圍，即便賽制在 2024 年擴大至 12 隊。這段乾旱期是 Lincoln Riley 執教任期的核心敘事，而 2026 賽季代表了結束這段乾旱的最佳——也可能是最後——機會。精英級攻擊、重新設計的防守、全美第一的招募班底，以及全新訓練中心的結合，構成了 Riley 在洛杉磯手中最完整的組合。\n\n然而賽程毫不留情。USC 將於萬聖節在南加大球場迎戰俄亥俄州大——這是自 2008 年以來紅色黎明首度造訪 LA，而那場比賽將是特洛伊 CFP 資格的終極試金石。十月和十一月還有數場 Big Ten 客場賽程，而 USC 2025 年 2 勝 4 敗的客場戰績依然是最明顯的軟肋。\n\n攻擊火力毋庸置疑。擁有 Maiava 這位具海斯曼獎實力的四分衛，以及剛證明在失去頭號接球手後仍能產出的接球群，USC 擁有幾乎能壓過任何對手的武器。問題一直只在於：防守能否扛住優質對手？而這正是 Patterson 被聘雇來解決的課題。\n\n對整個球隊而言， stakes 再高不過。倘若 USC 打進 CFP，Riley 的重建便獲驗證，軌跡向上延伸；倘若特洛伊再度功虧一簣，關於他未來的討論將變得無可迴避。從現在到一月，每個週六都是對這項投資——在教練、設施和人才上的投資——是否產出承諾成果的一場公投。"}, {"team": "Rams", "accent": "#003594", "headline": "Aaron Donald Unretires to Pair With Myles Garrett on Rams D-Line", "headline_zh": "Aaron Donald 結束退休，與 Myles Garrett 聯手組裝公羊防守前線", "analysis": "The biggest story in the NFL this offseason just got bigger. Three-time NFL Defensive Player of the Year Aaron Donald announced he is coming out of retirement to rejoin the Rams, less than two years after stepping away following Super Bowl LVI. The 35-year-old, who retired in March 2024, worked out with the team and signed a deal to return for the 2026 season alongside newly-acquired Myles Garrett.\n\nThe pairing is almost unfair on paper. Garrett, acquired from the Browns in a blockbuster trade that cost the Rams Jared Verse, a 2027 first-round pick, a 2028 second, and a 2029 third, is the reigning Defensive Player of the Year. Donald holds the record for most DPOY awards in league history. Together, they form the most fearsome defensive line duo the NFL has seen in a generation — and they're both wearing horns.\n\nDonald's motivation appears genuine. In his own words, after watching the team's NFC Championship loss to the Seahawks last season — a 27-31 defeat that ended a 12-5 campaign with a +172 point differential — he realized he still had something to give. The competitive fire that defined his career hadn't dimmed; it had merely been dormant.\n\nThe strategic implications are profound. Opposing offensive lines now face an impossible choice: double-team Donald and leave Garrett one-on-one, or vice versa. There is no correct answer. For a Rams defense that was already among the league's best, Donald's return elevates the ceiling to Super Bowl-caliber. The question isn't whether the duo will dominate — it's whether anyone in the NFC can stop them.", "analysis_zh": "NFL 休賽季最大的故事如今變得更大了。三度 NFL 年度最佳防守球員 Aaron Donald 宣布結束退休、重返公羊隊，距他在贏得第 56 屆超級碗後離開聯盟不到兩年。這位 35 歲的傳奇在 2024 年 3 月退休，經過與球隊的測試後簽約回歸，與新加盟的 Myles Garrett 並肩征戰 2026 賽季。\n\n這對搭檔在紙面上幾乎不公平。Garrett 是透過與布朗隊的重磅交易而來——公羊送出了 Jared Verse、一個 2027 年首輪籤、一個 2028 年次輪籤和一個 2029 年三輪籤——他是衛冕年度最佳防守球員。Donald 則握有聯盟史上最多的 DPOY 獎項紀錄。兩人聯手，形成了 NFL 一代以來最令人畏懼的防守前線搭檔——而他們都穿上了公羊的戰袍。\n\nDonald 的動機顯然是真誠的。用他自己的話說，在看了球隊上賽季以 27-31 在國聯冠軍戰敗給海鷹——那是一場終結 12 勝 5 敗、+172 分差赛季的比賽——之後，他意識到自己仍有東西可以奉獻。定義他職業生涯的競爭之火並未熄滅，只是暫時沉寂。\n\n戰略上的影響深遠。對手的進攻線如今面臨不可能的選擇：包夾 Donald 而讓 Garrett 面對一對一，反之亦然。沒有正確答案。對於一個本已是聯盟最佳之一的公羊防守而言，Donald 的回歸將上限提升至超級碗等級。問題不是這對搭檔會不會主宰比賽——而是國聯是否有人能阻止他們。"}, {"team": "Rams", "accent": "#003594", "headline": "Rams Name Record 11 Captains for 2026 Season", "headline_zh": "公羊創紀錄選出 11 名 2026 賽季隊長", "analysis": "The Rams have named a record 11 team captains for the 2026 season, a number that reflects both the depth of leadership on the roster and the unique dynamics of a team built to win now. The list includes quarterback Matthew Stafford, running back Kyren Williams, wide receiver Davante Adams, tight end Tyler Higbee, center Coleman Shelton, defensive end Myles Garrett, defensive tackle Kobie Turner, linebacker Nate Landman, safety Quentin Lake, cornerback Trent McDuffie, and long snapper Joe Cardona.\n\nThree of the captains — Garrett, McDuffie, and Cardona — are first-year Rams, a testament to how quickly new acquisitions have integrated into the team's culture. Garrett's inclusion is particularly notable: acquired in a blockbuster trade just weeks ago, his selection as captain signals that his leadership presence was immediately felt in the building.\n\nStafford's sixth consecutive season as a Rams captain speaks to his enduring role as the franchise's emotional and tactical center. At 38, he remains the engine that drives everything — his arm talent, his film study, and his ability to elevate teammates make him irreplaceable. With Davante Adams now in the fold as a primary target, Stafford has the weapons to make 2026 his most productive season in LA.\n\nThe 11-captain model is unconventional, but it's also pragmatic. This is a roster with multiple veteran leaders across every position group, and naming 11 captains ensures that each unit has its own voice. For a team with Super Bowl aspirations, having that many leaders isn't redundancy — it's insurance that accountability permeates every corner of the locker room.", "analysis_zh": "公羊為 2026 賽季創紀錄地選出了 11 名隊長，這個數字反映了名單上領導力的深度，以及一支以贏在當下為藍本的球隊所具備的獨特動態。入選者包括四分衛 Matthew Stafford、跑衛 Kyren Williams、外接手 Davante Adams、近端鋒 Tyler Higbee、中鋒 Coleman Shelton、防守端鋒 Myles Garrett、防守截鋒 Kobie Turner、線衛 Nate Landman、安全衛 Quentin Lake、角衛 Trent McDuffie，以及長傳球員 Joe Cardona。\n\n其中三名隊長——Garrett、McDuffie 和 Cardona——是公羊的第一年成員，這證明了新引進的球員能多快融入球隊文化。Garrett 的入選尤其值得注意：他僅在數週前才透過重磅交易加盟，而他被選為隊長，顯示他的領袖存在感立即在球隊內部被感受到。\n\nStafford 連續第六個賽季擔任公羊隊長，證明了他作為球隊情感與戰術核心的持久角色。38 歲的他依然是驅動一切的引擎——他的手臂天賦、他的比賽錄影研究，以及他提升隊友水準的能力，使他無可替代。隨著 Davante Adams 成為新的主要目標，Stafford 擁有了讓 2026 成為他在 LA 最具產出賽季的武器。\n\n11 名隊長的模式非常規，但也務實。這是一份在每個位置群都擁有多位資深領袖的名單，選出 11 名隊長確保每個單位都有自己的聲音。對於一支怀揣超級碗野心的球隊而言，擁有如此多的領袖不是冗員——而是確保問責精神滲透至休息室每個角落的保險。"}, {"team": "Rams", "accent": "#003594", "headline": "Injury Watch: Donald Not Practicing, Garrett 'Making Good Progress'", "headline_zh": "傷情追蹤：Donald 未參與訓練，Garrett「正在穩定復原」", "analysis": "The Rams' two most important defensive players are both managing health concerns as the regular season approaches. Sean McVay confirmed Monday that Aaron Donald not practicing was 'part of the plan all along' — a managed ramp-up for a 35-year-old coming out of retirement. Meanwhile, Myles Garrett (knee) is 'making really good progress,' though his status for the Sept. 10 Melbourne opener remains uncertain.\n\nDonald's situation is the more nuanced. The Rams are clearly prioritizing long-term availability over September readiness. By limiting his practice reps now, they're preserving his body for the postseason push — the period when they need him most. It's a veteran management approach that mirrors how teams handle aging superstars across all sports.\n\nGarrett's knee injury adds another layer of concern. Acquired in a blockbuster trade, the reigning DPOY's health is paramount to the Rams' championship aspirations. McVay expressed optimism, but the dual injury watch — Donald ramping up slowly, Garrett recovering from a knee issue — creates uncertainty about how dominant the defensive line will be in the season's opening weeks.\n\nThe updates also included positive notes on other players: tight end Terrance Ferguson, linebacker Grant Stuard, offensive lineman Keagen Trost, and offensive lineman Justin Dedich all received varying degrees of positive assessments. For a team with the Rams' depth, the early-season injury management is manageable — but the health of Donald and Garrett will ultimately determine whether this defense reaches its sky-high ceiling.", "analysis_zh": "公羊兩名最重要的防守球員在例行賽逼近之際，都在管理健康狀況。Sean McVay 週一證實，Aaron Donald 未參與訓練是「計畫中的一部分」——這是一位 35 歲結束退休後球員的有節奏復出。與此同時，Myles Garrett（膝傷）「正在穩定復原」，但他能否趕上 9 月 10 日的墨爾本開幕戰仍不確定。\n\nDonald 的情況更為微妙。公羊顯然正優先考慮長期可用性而非九月的就緒度。此刻限制他的練習次數，是為了在季後賽衝刺階段——他們最需要他的時期——保存他的體能。這是處理高齡球星的資深管理方式，與所有運動中球隊對待 aging superstars 的手法如出一轍。\n\nGarrett 的膝傷增添了另一層擔憂。作為重磅交易引進的衛冕年度最佳防守球員，他的健康直接關係到公羊的冠軍野心。McVay 表達了樂觀，但這波連袂的傷情追蹤——Donald 緩慢復出、Garrett 正從膝傷中恢復——讓防守前線在賽季開頭數週的統治力充滿不確定性。\n\n更新中也包含了其他球員的正面消息：近端鋒 Terrance Ferguson、線衛 Grant Stuard、進攻線 Keagen Trost 與 Justin Dedich 都獲得了不同程度的正面評估。對一支擁有公羊般深度的球隊而言，賽季初期的傷兵管理是可以應對的——但 Donald 與 Garrett 的健康，最終將決定這套防守能否達到其極限。"}, {"team": "Rams", "accent": "#003594", "headline": "Rams Finalize 53-Man Roster With Depth Across the Board", "headline_zh": "公羊敲定 53 人名單，全位置展現深度", "analysis": "The Rams announced their final 53-man roster for 2026, cutting 35 players, placing three on injured reserve, and signing 17 to the practice squad. The roster features Matthew Stafford, Davante Adams, Puka Nacua, Aaron Donald, Myles Garrett, Trent McDuffie, and a defensive line that could be the deepest in the NFL.\n\nThe defensive front is the crown jewel. Donald, Garrett, Kobie Turner, and a supporting cast of rushers give the Rams the ability to rotate fresh pass rushers on every snap — a luxury that compounds over 17 games and into the postseason. The secondary, anchored by McDuffie and Quentin Lake, provides the coverage to complement the pass rush.\n\nOffensively, the question marks are fewer but still present. The receiving corps is elite with Nacua (ranked No. 7 on the NFL Top 100), Adams, and a returning Tutu Atwell adding speed depth. The running back room absorbed the loss of Jarquez Hunter in the Atwell trade, and the offensive line's depth will be tested as the season progresses.\n\nThe roster's construction reflects a team built for January. Deep defensive lines, proven quarterbacks, and elite skill-position talent are the ingredients of Super Bowl contenders, and the Rams have all three. The preseason — a perfect 3-0 with a 74-30 scoring margin — validated the depth chart and gave coaches confidence in the rotation. Now the real games begin.", "analysis_zh": "公羊宣布了 2026 年最終的 53 人名單，裁撤 35 名球員、將三人放入傷兵名單，並簽下 17 人至訓練組。名單上包括 Matthew Stafford、Davante Adams、Puka Nacua、Aaron Donald、Myles Garrett、Trent McDuffie，以及一條可能是全 NFL 最深的防守前線。\n\n防守前線是皇冠上的寶石。Donald、Garrett、Kobie Turner 和一支支援衝鋒群，賦予公羊在每一次 snap 都能輪替新鮮衝鋒的能力——這項奢侈在 17 場例行賽與季後賽中不斷累積。由 McDuffie 和 Quentin Lake 擔綱的後場，則提供了與衝鋒互補的覆蓋能力。\n\n進攻端的問號較少但仍然存在。接球群精英級——Nacua（NFL 百大球星第 7 名）、Adams，以及回歸的 Tutu Atwell 帶來速度深度。跑衛室在 Atwell 交易中失去了 Jarquez Hunter，而進攻線的深度將隨著賽季推進受到考驗。\n\n名單的建構反映了一支為一月而生的球隊。深厚的防守前線、 proven quarterbacks，以及精英級技能位置天賦，正是超級碗競爭者的配方，而公羊三者兼備。季前賽——3 勝 0 敗、總得分 74 比 30——驗證了深度表單，也讓教練團對輪替充滿信心。如今真正的比賽開始了。"}, {"team": "Rams", "accent": "#003594", "headline": "Rams Head to Melbourne for NFL's First-Ever Game in Australia", "headline_zh": "公羊前往墨爾本，踢出 NFL 在澳洲的歷史首戰", "analysis": "In ten days, the Rams will kick off the 2026 NFL season in unprecedented fashion. The Sept. 10 opener against the 49ers at the Melbourne Cricket Ground marks the first-ever NFL regular-season game in Australia, airing live on Netflix. It's a global showcase for two NFC West rivals — and the Rams are determined to make it a statement.\n\nThe logistics alone are staggering. A flight from Los Angeles to Melbourne is roughly 16 hours, and the time difference creates a 17-hour swing from Pacific Time. The Rams will need to manage jet lag, practice schedules, and the mental challenges of performing in an unfamiliar environment — all while facing a division rival in a game that counts.\n\nThe matchup itself is compelling. The 49ers and Rams have one of the NFL's most intense rivalries, and bringing it to Australia adds a layer of spectacle. Both teams will be carrying full regular-season rosters, making this a genuine test of preparation rather than a preseason exhibition. The Melbourne Cricket Ground, a venue that has hosted cricket World Cups and rugby tests, will need to adapt to the unique dimensions of an NFL field.\n\nFor the Rams, the opportunity extends beyond the field. Playing in Australia exposes the franchise to a new market and a global audience, while the Netflix broadcast brings NFL football to millions of potential new fans. It's a chance to establish the Rams as an international brand while chasing a Super Bowl — and if they can open the season with a win in the most exotic venue in NFL history, it will set the tone for everything that follows.", "analysis_zh": "十天後，公羊將以前所未有的方式揭開 2026 NFL 賽季。9 月 10 日在墨爾本板球場對戰 49 人的開幕戰，是 NFL 例行賽首次在澳洲舉行，並由 Netflix 現場直播。這是兩支國聯西區宿敵在全球舞台上的展演——而公羊決心要讓它成為一記宣言。\n\n後勤挑戰 alone 就令人咋舌。從洛杉磯飛往墨爾本約需 16 小時，而時差造成了從太平洋時間起算的 17 小時翻轉。公羊需要管理時差、練習時程，以及在陌生環境中表現的心理挑戰——所有這些都要在面對一支分區對手的計分賽中完成。\n\n對戰本身就引人入勝。49 人與公羊之間是 NFL 最激烈的宿敵之一，將它搬到澳洲增添了一層壯觀的色彩。兩隊都將帶著完整的例行賽名單出戰，使這成為真正的備戰考驗而非季前表演。曾承辦板球世界盃與橄欖球國際賽的墨爾本板球場，也需要適應 NFL 場地獨特的尺寸。\n\n對公羊而言，機會超越了球場。在澳洲比賽讓這支球隊接觸到一個新市場與全球觀眾，而 Netflix 的轉播也將 NFL 橄欖球帶給數百萬潛在新球迷。這是一個在追逐超級碗的同時建立公羊國際品牌形象的契機——倘若他們能在 NFL 歷史上最 exotic 的場地以勝利開啟賽季，將為接下來的一切定下基調。"}, {"team": "Rams", "accent": "#003594", "headline": "Myles Garrett Trade Cost Rams Significant Draft Capital — But May Be Worth It", "headline_zh": "Myles Garrett 交易耗費公羊大量選秀資本——但可能物有所值", "analysis": "The Rams acquired Myles Garrett from the Browns in exchange for edge rusher Jared Verse, a 2027 first-round pick, a 2028 second-round pick, and a 2029 third-round pick — a king's ransom that underscores how badly LA wanted to pair the reigning DPOY with Aaron Donald. It's a trade that sacrifices the future for the present, and its success depends entirely on whether the Rams can win a Super Bowl in the next two years.\n\nThe calculus is defensible. Garrett is 31, a dominant force who transforms any defense he joins. Paired with Donald, he gives the Rams the most fearsome pass-rushing duo in football — one that can single-handedly decide playoff games. The draft picks, meanwhile, are lottery tickets that may or may not pan out. A guaranteed elite player is worth more than a collection of uncertain futures.\n\nThe loss of Verse is the real sting. The young edge rusher was a rising star and a foundational piece of the Rams' defensive future. His departure creates a void on the edge that the coaching staff will need to fill through the draft and free agency in coming years. It's the kind of short-term gain that can create long-term pain if the championship window doesn't deliver.\n\nUltimately, this trade will be judged by one metric: rings. If the Rams win the Super Bowl with Garrett and Donald anchoring the defense, the draft capital surrendered will be forgotten. If they don't, it will be remembered as the trade that mortgaged the future for a dream that never materialized. The pressure on Sean McVay and the front office has never been higher — the window is open, and every move from here on out is about winning now.", "analysis_zh": "公羊以邊鋒衝鋒 Jared Verse、一個 2027 年首輪籤、一個 2028 年次輪籤和一個 2029 年三輪籤，從布朗隊換來了 Myles Garrett——一筆代價不菲的交易，凸顯了洛杉矶多麼渴望將衛冕年度最佳防守球員與 Aaron Donald 搭檔。這是一筆犧牲未來換取現在的交易，其成功完全取決於公羊能否在未來兩年內贏得超級碗。\n\n這項取捨是可以辯護的。Garrett 31 歲，是一位能改變任何他加入之防守的統治級力量。與 Donald 搭檔，他賦予了公羊全聯盟最令人畏懼的衝鋒搭檔——一對足以單獨決定季後賽勝負的組合。而那些選秀籤，不過是可能開出也可能不開出的樂透彩券。一名有保證的精英球員，其價值遠超一批不確定的未來資產。\n\n真正令人心痛的是 Verse 的離去。這位年輕的邊鋒衝鋒是 rising star，也是公羊防守未來的基礎拼圖。他的離開在邊鋒位置留下了一個缺口，教練團需要在未來數年透過選秀和自由市場來填補。這是那種如果冠軍窗口未能實現，便可能造成長期陣痛的短期獲利。\n\n最終，這筆交易將以一項指標來衡量：冠軍戒指。倘若公羊在 Garrett 和 Donald 擔綱防守下贏得超級碗，付出的選秀資本將被遺忘。倘若沒有，它將被記為一場以未來賭注換取未竟之夢的交易。Sean McVay 與管理層所承受的壓力從未如此之高——窗口正在敞開，而從此刻起的每一步都關乎贏在當下。"}], "closing": "Three LA franchises, three distinct September narratives converging at once. The Dodgers are managing a pitching crisis around their biggest star while their rotation quietly reassembles itself for October; USC is chasing history with a Heisman candidate, a No. 1 recruiting class, and a Hall of Fame defensive coordinator — but the margin for error is razor-thin in Riley's make-or-break fifth year; and the Rams are about to launch the most ambitious season in recent memory, with two generational defenders and a season opener on the other side of the planet. In LA, September isn't the end of anything — it's when everything begins.", "closing_zh": "三支洛杉磯球隊，三條截然不同的九月敘事同時匯流。道奇在圍繞他們最大球星的投球危機中運籌帷幄，同時輪值正悄然重組為十月做準備；南加大挾著海斯曼候選人、全美第一招募班底與名人堂防守協調員追尋歷史——但在 Riley 成敗攸關的第五年，犯錯的容許度極低；公羊即將啟動近代記憶中最具野心的賽季，擁有兩名世代級防守者與一場在地球另一端開打的開幕戰。在洛杉磯，九月不是任何事情的終結——而是一切的開始。"};
let lang = "en";
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmtPT(iso){ return new Date(iso).toLocaleString("en-US",{timeZone:"America/Los_Angeles",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"})+" PT"; }

function renderDigest(d){
  const box = document.getElementById("digest");
  if(!d || !d.segments){
    box.innerHTML = '<div style="text-align:center;color:var(--dim);padding:40px">No digest yet</div>';
    return;
  }
  const segs = d.segments.map(s=>{
    const headline = lang==="en" ? s.headline : s.headline_zh;
    const analysis = lang==="en" ? s.analysis : s.analysis_zh;
    return '<div class="seg" style="--team:'+esc(s.accent)+'">' +
      '<div class="row"><span class="hn">'+esc(headline)+'</span><span class="badge">'+esc(s.team)+'</span></div>' +
      '<div class="lbl">'+(lang==="en"?"Analysis":"分析")+'</div><p>'+esc(analysis)+'</p>' +
      '</div>';
  }).join("");
  box.innerHTML =
    '<div class="dhead">' +
      '<div class="t"><div class="mic">🎙️</div><div><h2>'+esc(d.title)+'</h2><div class="meta">' +
        esc(d.read_time || "")+' · '+fmtPT(d.updated_at)+
        ' · 繁中/EN</div></div></div>' +
      '<div class="langs">'+
        '<button id="btnEn" class="on" onclick="setLang(\'en\')">EN</button>'+
        '<button id="btnZh" onclick="setLang(\'zh\')">繁體中文</button>'+
      '</div>' +
    '</div>' +
    '<div class="intro">'+esc(lang==="en"?d.intro:d.intro_zh)+'</div>' +
    '<div class="segs">'+segs+'</div>' +
    '<div class="closing">'+esc(lang==="en"?d.closing:d.closing_zh)+'</div>';
}
function setLang(v){ lang = v; document.getElementById("btnEn").classList.toggle("on", v==="en"); document.getElementById("btnZh").classList.toggle("on", v==="zh"); renderDigest(DIGEST_DATA); }

function renderNews(d){ const upd = document.getElementById("upd"); if(upd) upd.textContent = fmtPT(d.updated_at);
  const g = document.getElementById("grid"); g.innerHTML = "";
  for(const t of d.teams){
    const c = document.createElement("div"); c.className = "card"; c.style.setProperty("--team", t.accent);
    const emoji = t.emoji==="Baseball"?"⚾":t.emoji==="Football"?"🏈":"🏆";
    c.innerHTML =
      '<div class="top"><div class="ico">' + emoji + '</div>' +
      '<div><div class="name">' + esc(t.name) + '</div><div class="rec">' + t.sport + ' · ' + esc(t.record) + '</div></div></div>' +
      '<div class="hline">' + esc(t.headline) + '</div>' +
      '<h3>Latest News</h3><ul class="news">' + t.latest_news.map(n =>
        '<li><a target="_blank" rel="noopener" href="' + esc(n.url) + '">' + esc(n.title) + '</a><p>' + esc(n.summary) + '</p></li>'
      ).join("") + '</ul>' +
      '<h3>Fun Facts</h3><ul class="facts">' + t.fun_facts.map(f => '<li>'+esc(f)+'</li>').join("") + '</ul>' +
      '<h3>Further Reading</h3><ul class="read">' + t.further_reading.map(f =>
        '<li><a target="_blank" rel="noopener" href="' + esc(f.url) + '"><span>'+esc(f.title)+'</span><span class="why">'+esc(f.why)+'</span></a></li>'
      ).join("") + '</ul>' +
      '<div class="oss">' + esc(t.one_sentence) + '</div>';
    g.appendChild(c);
  }
}

renderDigest(DIGEST_DATA);
renderNews(TEAMS_DATA);
</script>
</body>
</html>
