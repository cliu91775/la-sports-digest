<style>
  :root{
    --bg:#0b0e14; --panel:rgba(255,255,255,.04); --panel2:rgba(255,255,255,.02);
    --line:rgba(255,255,255,.08); --fg:#edf2fa; --dim:#8a94a6;
    --radius:18px; --glow:0 0 0 1px rgba(255,255,255,.04), 0 24px 60px -30px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 500px at 20% -10%, rgba(42,111,216,.18), transparent 60%),
      radial-gradient(1000px 500px at 90% -10%, rgba(153,0,0,.14), transparent 60%),
      radial-gradient(900px 400px at 50% 110%, rgba(31,78,156,.16), transparent 60%),
      var(--bg);
    color:var(--fg); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
    padding:28px clamp(16px,4vw,64px) 64px;
  }
  header{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:26px}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{
    width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;
    background:linear-gradient(135deg,#2a6fd8,#991111);box-shadow:0 8px 30px -8px rgba(60,90,220,.6);
  }
  h1{font-size:clamp(22px,3vw,32px);font-weight:800;letter-spacing:-.02em}
  .sub{color:var(--dim);font-size:13px;margin-top:4px}
  .ticker{
    font-size:12px;color:var(--dim);padding:8px 14px;border-radius:99px;
    background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);
  }
  .ticker b{color:#7ce38b}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:20px}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;backdrop-filter:blur(14px);box-shadow:var(--glow);position:relative;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--team,#2a6fd8),transparent);
  }
  .top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .ico{
    width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;

  .name{font-size:18px;font-weight:800;letter-spacing:-.01em}
  .rec{font-size:11px;color:var(--team);font-weight:700;margin-top:2px}
  .hline{font-size:13px;line-height:1.5;color:var(--dim);padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);margin-bottom:16px}

  .news a{color:var(--fg);text-decoration:none;font-weight:700;font-size:13px;display:block;margin-bottom:4px}
  .news a:hover{color:var(--team)}
  .news p{font-size:12px;color:var(--dim);line-height:1.5}
  .facts{list-style:none;display:grid;gap:6px}
  .facts li{position:relative;padding:2px 0 2px 18px;font-size:12.5px;color:var(--fg);line-height:1.55}
  .facts li::before{content:"⚡";position:absolute;left:0;top:2px;font-size:11px;filter:grayscale(.4)}
  .read{list-style:none;display:grid;gap:6px}
  .read a{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12.5px;color:var(--fg);text-decoration:none;padding:9px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
  .read a:hover{color:var(--team);border-color:color-mix(in srgb,var(--team) 50%, transparent)}
  .read .why{font-size:11px;color:var(--dim)}
  .oss{font-size:12.5px;line-height:1.6;color:var(--fg);background:linear-gradient(90deg,color-mix(in srgb,var(--team) 18%,transparent),transparent);border-left:3px solid var(--team);padding:10px 14px;border-radius:0 12px 12px 0;margin-top:16px}
  banner{display:block;text-align:center;color:var(--dim);font-size:13px;margin-top:22px}
  banner span{color:#7ce38b;animation:blink 1.5s infinite}
  @keyframes blink{50%{opacity:.3}}
  .spin{width:100%;height:100px;display:grid;place-items:center;color:var(--dim)}
  /* ---- digest ---- */
  .digest{
    background:linear-gradient(135deg,rgba(42,111,216,.12),rgba(153,0,0,.10),rgba(31,78,156,.12)),var(--panel);
    border:1px solid var(--line);border-radius:var(--radius);padding:26px;
    backdrop-filter:blur(14px);box-shadow:var(--glow);margin-bottom:22px;
  }
  .dhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;margin-bottom:14px}
  .dhead .t{display:flex;align-items:center;gap:12px}
  .mic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:linear-gradient(135deg,#2a6fd8,#991111)}
  .dhead h2{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .dhead .meta{color:var(--dim);font-size:12px;margin-top:3px}
  .langs{display:flex;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:4px}
  .langs button{border:0;background:transparent;color:var(--dim);font-size:12px;font-weight:700;padding:6px 16px;border-radius:99px;cursor:pointer;transition:.2s}
  .langs button.on{background:linear-gradient(135deg,#2a6fd8,#1f4e9c);color:#fff}
  .intro{font-size:14px;line-height:1.65;color:var(--fg);max-width:820px;margin-bottom:18px}
  .segs{display:grid;gap:12px}
  .seg{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--panel2)}
  .seg .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .seg .row .hn{font-weight:800;font-size:14.5px}
  .seg .badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--team,#2a6fd8) 20%,transparent);color:var(--team);white-space:nowrap}
  .seg p{font-size:12.5px;line-height:1.6;color:var(--dim);margin-top:6px}
  .seg p.cls{color:var(--fg)}
  .seg .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin-top:10px;font-weight:700}
  .closing{font-size:14px;line-height:1.6;border-top:1px dashed var(--line);margin-top:16px;padding-top:14px;color:var(--fg)}
</style>

003594", "record": "0-1", "headline": "Aaron Donald cleared to debut after Rams' humbling 27-7 loss in Melbourne", "latest_news": [{"title": "Aaron Donald lifted from Commissioner's Exempt List, opening door for Rams debut", "summary": "The NFL removed Donald from the Commissioner's Exempt List via Friday's transaction wire. The three-time DPOY, who re-signed on Aug. 30 after a 2 1/2-year retirement, stayed home from Australia but could now make his debut — possibly as soon as Monday night vs. the Giants at SoFi Stadium. The Rams have said they'll only play Donald when he's fully ready.", "url": "https://www.si.com/nfl/rams/onsi/rams-aaron-donald-activated-exempt-list-opening-door-for-debut"}, {"title": "Myles Garrett acknowledges knee injury is significant after 0-tackle debut", "summary": "The reigning AP Defensive Player of the Year made zero tackles and was held without a single pressure for the first time since 2018 in the 27-7 loss to the 49ers. After the long flight home, Garrett admitted his knee problem is more serious than he'd let on: 'We knew we were going to face some adversity this season. It's game one.'", "url": "https://www.foxsports.com/articles/nfl/myles-garrett-acknowledges-knee-injury-is-significant-after-0tackle-debut-in-rams-australia-loss"}, {"title": "Rams' new-look defense fell flat vs. 49ers in Week 1", "summary": "After an offseason of hype over $200M-plus invested in the secondary plus Myles Garrett and Aaron Donald, Chris Shula's defense was gashed for 174 rushing yards and three Brock Purdy touchdown passes. San Francisco's quick-passing and run schemes exposed the Rams' zone-heavy approach on the league's biggest stage.", "url": "https://theramswire.usatoday.com/story/sports/nfl/rams/2026/09/11/rams-defense-week-1-49ers-chris-shula-myles-garrett/91704133007/"}, {"title": "Rams' biggest stars come up short in humbling Week 1 loss", "summary": "Matthew Stafford (15-for-25, 155 yards, INT) lost to the 49ers for just the second time in his career, posting his lowest passer rating in nearly a decade. McVay's fourth-and-goal quarterback sneak was stuffed, and the Rams' lone TD came only after a 41-yard Puka Nacua catch set up Kyren Williams.", "url": "https://www.si.com/nfl/rams/onsi/rams-49ers-week-1-loss-matthew-stafford"}, {"title": "10 takeaways from the Rams' humbling Week 1 loss to 49ers", "summary": "From travel questions (the Rams arrived in Melbourne just over 24 hours before kickoff) to Garrett's ineffectiveness, McDuffie going quiet, and Shula's zone scheme vs. man-cover corners, the takeaways list where a 'superteam' must tighten up — with 16 games left to bounce back.", "url": "https://www.si.com/nfl/rams/onsi/rams-49ers-10-takeaways-week-1-loss"}, {"title": "Kam Curl leaves with ankle injury; Davis Allen evaluated for concussion in Australia loss", "summary": "Beyond the offensive and defensive struggles Down Under, safety Kam Curl exited early with an ankle injury and tight end Davis Allen was evaluated for a concussion. Both will have 10 days to heal ahead of the Monday night matchup with the Giants on Sept. 21.", "url": "https://www.bastillepost.com/global/article/6149882-rams-say-travel-isnt-to-blame-for-their-melbourne-debacle-if-so-that-suggests-bigger-problems"}], "fun_facts": ["The Rams-49ers opener at the Melbourne Cricket Ground was the first NFL regular-season game ever played in Australia, staged before 100,021 fans.", "Aaron Donald ended a 2 1/2-year retirement on Aug. 30, and by Sept. 11 the NFL had lifted his Commissioner's Exempt List for a two-week roster exemption — making the 35-year-old eligible for a possible Monday night debut vs. the Giants.", "Myles Garrett was held without a single pressure for the first time since 2018, finishing with zero tackles while playing 62% of the snaps on a knee he admitted isn't 100%.", "Stafford's 61.2 passer rating was his lowest in a game in nearly a decade, and the 20-point margin was the Rams' worst defeat since November 2024.", "The Rams' fourth-and-goal quarterback sneak from Stafford was stuffed at the 1-yard line, then San Francisco answered with a 99-yard touchdown drive — a fatal sequence McVay acknowledged cost his team the game."], "further_reading": [{"title": "Aaron Donald lifted from Exempt List, opening door for Rams debut", "why": "Full detail on Donald's roster-exemption timeline, his practice ramp-up, and the possibility he debuts vs. the Giants, Eagles, or waits until Week 5 against Buffalo.", "url": "https://www.si.com/nfl/rams/onsi/rams-aaron-donald-activated-exempt-list-opening-door-for-debut"}, {"title": "Myles Garrett acknowledges knee injury is significant after 0-tackle debut", "why": "The AP story from Melbourne on Garrett's honest postgame assessment and the 15-hour flight home as the Rams' pass rush was shut out against Brock Purdy.", "url": "https://www.foxsports.com/articles/nfl/myles-garrett-acknowledges-knee-injury-is-significant-after-0tackle-debut-in-rams-australia-loss"}, {"title": "Dan Orlovsky questions Chris Shula over Rams' defensive changes", "why": "The ESPN analyst raised alarms on 'Get Up!' after the defense's fourth straight flat game with elite talent: 'I am very concerned about that defense, and I'm very concerned about their defensive coordinator.'", "url": "https://nypost.com/2026/09/11/sports/dan-orlovsky-questions-chris-shula-over-rams-defensive-changes/"}, {"title": "Rams Injury Report, Week 1 vs. 49ers", "why": "The official team injury report showing Aaron Donald as the only player ruled out, with Myles Garrett, Jaylen Watson and Grant Stuard all cleared to play in Melbourne.", "url": "https://www.therams.com/news/rams-injury-report-week-1-vs-49ers-2026-aaron-donald-only-player-ruled-out-among-those-listed-no-designation-for-myles-garrett"}, {"title": "Blowout loss makes Rams' difficult Super Bowl task even tougher", "why": "Forbes breaks down how the 20-point divisional loss in Melbourne — as overwhelming Super Bowl favorites — raises questions about his 'superteam' and the pressure on Sean McVay.", "url": "https://www.forbes.com/sites/johncassillo/2026/09/11/blowout-loss-makes-rams-difficult-super-bowl-task-even-tougher/"}], "one_sentence": "The star-studded Rams stumbled in the NFL's first Australia game, falling 27-7 to the 49ers — but with Aaron Donald's exemption lifted and 10 days to heal before the Giants, the superteam story is far from over."}]};
const DIGEST_DATA = {"updated_at": "2026-09-12T06:50:59-07:00", "title": "LA Sports Daily Digest — 15-Minute Edition", "read_time": "~15 minutes", "intro": "A seismic Friday across the LA sports landscape: the Dodgers activated Shohei Ohtani's injured-list stint even as they extended their season-best winning streak to eight, the Rams absorbed a humbling 27-7 beatdown in the NFL's first-ever Australian regular-season game while Aaron Donald's path to debut suddenly opened, and USC's Jayden Maiava kept building a legitimate Heisman résumé ahead of the Trojans' nonconference finale at the Coliseum.", "intro_zh": "洛杉磯體壇週五地震不斷：道奇隊在將 Shohei Ohtani 送進傷兵名單的同時，將本季最長連勝推進至八場；公羊隊在 NFL 史上首次澳洲例行賽中以 27 慘敗，而 Aaron Donald 的處方清單解除為他的復出打開了大門；南加州大學的 Jayden Maiava 在週六非聯盟收官戰前持續累積 Heisman 級別的數據。", "segments": [{"team": "Dodgers", "accent": "#2A6FD8", "headline": "Ohtani heads to the IL — but the Dodgers keep winning without him", "headline_zh": "Ohtani 進傷兵名單 — 道奇隊仍無人能擋", "analysis": "Shohei Ohtani was placed on the 15-day injured list Friday to rest his lingering left knee and right biceps injuries, ending any hope of him pitching again in 2026. As a two-way player under MLB rules, the minimum IL stint is 15 days — but the Dodgers moved preemptively, framing it as a maintenance shutdown rather than a reaction to a setback. Manager Dave Roberts told reporters Ohtani would be in the lineup if the playoffs started tomorrow, and the club expressed full confidence he'll be ready once eligible.\n\nBefore the IL stint, Ohtani posted a .906 OPS with 30 home runs as a hitter and a 1.79 ERA across 14 pitching starts — a remarkable two-way line that cemented his status as the sport's most unique talent. Since restarting his throwing program on August 8, however, his bat has cooled considerably (.204 average), suggesting the dual workload finally caught up with him as September dawned.\n\nThe corresponding roster move is one of the more intriguing September stories: the Dodgers will call up No. 6 overall prospect Josue De Paula for his MLB debut in Miami. De Paula, an 18-year-old outfielder, represents the franchise's long-term investment, and the timing of his promotion — with the division essentially wrapped up — allows him to acclimate under low-pressure conditions.\n\nAnalyst take: This is exactly the kind of calculated risk that separates well-run organizations from the rest. The Dodgers have a 90-57 record and a seven-game division lead; they can afford to sit their superstar for two weeks to ensure he's healthy for October. The fact that they've won eight straight without him only underscores the depth that makes this franchise a perennial October threat.", "analysis_zh": "Shohei Ohtani 週五被放進 15 天傷兵名單，以休息持續困擾他的左膝和右二頭肌傷勢，等同宣告他 2026 年不會再上投手丘。根據 MLB 規定，二刀流球員最低 IL 天數為 15 天——但道奇隊選擇預防性處理，將此定調為保養性休兵而非傷勢惡化。總教練 Dave Roberts 向媒體表示，若季後賽明天開打，Ohtani 就會在名單上，球隊對他傷兵名單期滿後歸隊充滿信心。\n\n在進傷兵名單之前，Ohtani 以打者身份繳出 .906 OPS 和 30 支全壘打，投手身份則是 14 場先發拿下 1.79 ERA——這條雙刀流數據線再次證明他是棒球史上最獨特的天賦。然而自 8 月 8 日重新開始投球訓練以來，他的打擊成績明顯降溫（打擊率僅 .204），顯示雙重負擔在九月開戰時終於追上了他。\n\n對應的 roster move 同樣值得關注：道奇隊將叫上農場排名第六的頂級新秀 Josue De Paula，迎來他的大聯盟首秀。De Paula 是一位 18 歲的外野手，代表球隊的長期布局；而球隊在分區領先幾乎底定時拉他上來，能讓他在低壓力環境下適應大聯盟節奏。\n\n分析師觀點：這正是頂級球隊與普通球隊的差距。道奇隊坐擁 90 勝 57 敗的戰績和七場的分區領先，完全有能力讓當家球星休息兩週以確保十月季後賽健康。而他們在缺少 Ohtani 的情況下仍寫下八連勝，更說明了這支球隊令人生畏的陣容深度。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Tucker's grand slam caps 6-2 win; eight-game streak is a season best", "headline_zh": "Tucker 滿貫砲領軍 6-2 獲勝；八連勝創本季新高", "analysis": "Kyle Tucker delivered the defining swing of the Dodgers' hottest stretch of the season Friday night in Miami, launching a sixth career grand slam to blow open a 6-2 victory over the Marlins. Tucker went 3-for-3 with five RBI and fell just a double shy of the cycle, an absurdly complete performance that underscored why the Dodgers acquired him at the trade deadline.\n\nMax Muncy added three hits and a walk, providing the table-setting that has become a hallmark of this lineup's depth. And on the mound, Blake Snell delivered yet another dominant outing — he's now 3-1 with a 1.97 ERA since joining the club, part of a rotation that has become arguably the deepest in baseball down the stretch.\n\nThe eight-game winning streak is the Dodgers' longest of the season, and they've won 10 of their last 12 entering Saturday's continuation of the Miami series. The combination of a torrid offense and a pitching staff that has rounded into form has created a team that looks increasingly difficult to beat in a short playoff series.\n\nAnalyst take: Tucker's October experience with Houston makes him invaluable in this context. He's been a postseason performer before, and his ability to drive in runs in bunches — exemplified by Friday's five-RBI eruption — addresses the one knock against some Dodgers teams of recent vintage: the occasional inability to deliver the big hit when it matters most.", "analysis_zh": "Kyle Tucker 週五晚在邁阿密打出了道奇隊本季最火熱時期的關鍵一擊——職業生涯第六支滿貫全壘打，幫助球隊以 6-2 擊敗馬林魚。Tucker 全場 3 打數 3 安打、5 打點，只差一支二壘安打就完成完全打擊，這種全方位的攻擊表現充分說明了道奇隊在交易截止日前網羅他的價值。\n\nMax Muncy 貢獻三安打一次保送，持續扮演這條打線中串聯攻勢的要角。投手方面，Blake Snell 再度交出壓制性表現——加盟道奇隊後戰績來到 3 勝 1 敗、ERA 1.97，成為這支球隊在季末衝刺階段堪稱全聯盟最深的輪值陣容之一。\n\n八連勝創下道奇隊本季最長連勝紀錄，在週六邁阿密系列賽延續前，球隊近 12 場贏了 10 場。火熱的打擊與逐漸進入狀態的投手群相互加乘，讓這支球隊在季後賽短系列賽中看起來越來越難以被擊敗。\n\n分析師觀點：Tucker 在休士頓太空人的季後賽經歷使他在此刻格外珍貴。他過去就是季後賽級別的表演者，而他大量打進打點的能力——週五的 5 打點爆發就是最好範例——正好解決了道奇隊近年來偶爾在關鍵時刻缺乏致命一擊的問題。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Yamamoto, Hernández demolish Reds 14-1 to cap sweep and push winning streak to seven", "headline_zh": "Yamamoto、Hernández 轟炸紅人 14-1 完成橫掃，連勝推進至七場", "analysis": "Before Friday's series opener in Miami, the Dodgers put an exclamation point on their Cincinnati swing with a 14-1 demolition on Wednesday. Yoshinobu Yamamoto struck out 10 over seven innings of one-run ball, continuing his late-season surge, while Kiké Hernández — the Swiss Army knife of the roster — launched a home run to punctuate the blowout.\n\nThe three-game sweep of the Reds was the Dodgers' most complete series of the season. They outscored Cincinnati by a combined 24-3 across three games, with the pitching staff holding Reds hitters to a .182 average. Yamamoto's 10-strikeout performance was his most dominant since returning from his own injury absence earlier in the season.\n\nThe sweep pushed the Dodgers closer to their 13th NL West title in 14 seasons. With a 90-57 record and a division lead that has ballooned through September, the question is no longer whether Los Angeles will win the West, but how many games they'll cushion it by.\n\nAnalyst take: Yamamoto's ability to miss bats at this rate — 10 Ks in seven innings — bodes well for October. The Dodgers' rotation depth, even with Ohtani not pitching again, now includes Yamamoto, Skubal (2.84 ERA since the trade), Snell (1.97 ERA), and potentially Tyler Glasnow returning from the 60-day IL. That's a nightmare matchup for any NL opponent.", "analysis_zh": "在週五客場出戰邁阿密之前的週三，道奇隊在辛辛那提系列賽中以 14-1 的屠殺戰畫下驚嘆號。Yoshinobu Yamamoto 主投七局送出 10 次三振、僅失一分，延續他在季末的爆發；Kiké Hernández——球隊的萬能工具人——也轟出全壘打，為這場大勝錦上添花。\n\n對紅人的三場橫掃是道奇隊本季最完整的一個系列賽。三場比賽合計以 24-3 痛擊辛辛那提，投手群將紅人打者壓制在 .182 的打擊率。Yamamoto 的 10 K 表現是他從季中傷兵歸隊後最具壓制力的一場。\n\n橫掃讓道奇隊更進一步邁向 14 年來第 13 座國聯西區冠軍。以 90 勝 57 敗的戰績和在九月持續擴大的分區領先，現在的問題不再是道奇隊能否奪下西區冠軍，而是能領先多少場。\n\n分析師觀點：Yamamoto 以這種頻率使打者揮空的能力——七局 10 K——為十月季後賽帶來極佳預兆。即便 Ohtani 本季不再投球，道奇隊的輪值深度現在包括 Yamamoto、交易截止日後 ERA 2.84 的 Skubal、ERA 1.97 的 Snell，以及可能從 60 天 IL 歸隊的 Tyler Glasnow。這對任何國聯對手來說都是噩夢級別的對戰組合。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Sasaki could return Sunday as Dodgers' rotation reloads for October", "headline_zh": "Sasaki 週日有望歸隊；道奇隊輪值為十月全面充電", "analysis": "Roki Sasaki, sidelined since late August with a right middle finger blister, threw a bullpen session Friday and could be activated as soon as Sunday against the Marlins. The 22-year-old Japanese phenom had been building momentum before the blister interrupted his season, and his return would add yet another elite arm to a rotation that already looks playoff-ready.\n\nThe Dodgers made several corresponding transactions to manage their crowded roster: Eric Lauer was transferred to the 60-day IL with left elbow inflammation, and the club is monitoring Edwin Díaz's neck issue as the reliever works through a rehab assignment. These moves reflect the organizational depth that allows LA to absorb injuries without missing a beat.\n\nSasaki's potential Sunday return comes at an ideal time. With Ohtani now on the IL and not pitching again in 2026, the rotation's final shape is crystallizing: Yamamoto, Skubal, Snell, and Sasaki form a fearsome quartet, with Glasnow's return from the 60-day IL potentially adding a fifth ace-caliber arm.\n\nAnalyst take: The Sasaki blister was a minor scare, but the Dodgers' caution — waiting until he's fully healthy before activation — speaks to the same organizational philosophy that kept Ohtani off the mound. October is the goal, and every decision in September is filtered through that lens.", "analysis_zh": "Roki Sasaki 自八月底因右手中指水泡缺陣，週五完成牛棚練投，最快可望在週日對馬林魚的比賽歸隊。這位 22 歲的日本投手在水泡傷勢中斷賽季前原本正處於上升軌跡，他的回歸將為本已具備季後賽實力的輪值再添一名頂級投手。\n\n道奇隊同步進行多項 roster 操作以管理擁擠的名單：Eric Lauer 因左肘發炎被轉至 60 天 IL，球隊同時監測 Edwin Díaz 的頸部傷勢，這位後援投手目前正處於復健_assign 台階。這些調度反映了道奇隊的組織深度，使球隊能在傷兵頻傳的情況下照常運轉。\n\nSasaki 週日潛在歸隊的時間點再理想不過。在 Ohtani 被放進 IL 且本季不會再投球的此刻，輪值的最終輪廓正逐漸成形：Yamamoto、Skubal、Snell 和 Sasaki 組成令人生畏的四巨頭，再加上 Glasnow 從 60 天 IL 歸隊的可能，等於有五位王牌級投手待命。\n\n分析師觀點：Sasaki 的水泡傷勢一度令人擔憂，但道奇隊的謹慎——等他完全健康才歸隊——體現了與保護 Ohtani 相同的組織哲學。十月才是目標，九月的每項決策都以季後賽為出發點。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Skubal delivers again, Smith homers in return — rotation and lineup both peaking", "headline_zh": "Skubal 再次交出佳作、Smith 歸隊開轟；投打雙線同步巔峰", "analysis": "Tarik Skubal pitched into the eighth inning and Teoscar Hernández singled home the go-ahead run as the Dodgers edged the Reds 3-2 earlier this week, extending their winning streak to six. The left-hander has been a revelation since joining the club before the August 3 trade deadline — he's 2-2 with a 2.84 ERA, and the Dodgers have won each of his last four starts.\n\nSkubal's workload has been carefully managed: in his seven starts with Los Angeles, he's accumulated 48 strikeouts against just 10 walks, a dominant ratio that suggests his stuff has translated seamlessly to the NL. The fact that the Dodgers acquired the reigning Cy Young runner-up and he's immediately become a rotation cornerstone speaks to the front office's aggressive deadline work.\n\nPerhaps the most encouraging development of the week was Will Smith's return from the 60-day IL and his subsequent home run within a week. The Dodgers had traded for Hunter Feduccia and Ben Rortvedt to cover catcher during Smith's absence, but his bat — and his relationship with the pitching staff — are irreplaceable. Getting Smith healthy for October is a massive development.\n\nAnalyst take: The Dodgers are entering October with a rotation and lineup that are both rounding into peak form simultaneously. Skubal, Snell, and Yamamoto have been brilliant; Smith's return stabilizes the battery; and Tucker and Muncy are producing at elite levels. The only question mark is Ohtani's health — and the eight-game winning streak without him suggests the team can survive if he needs more time.", "analysis_zh": "Tarik Skubal 投到第八局，Teoscar Hernández 在關鍵時刻敲出致勝安打，幫助道奇隊以 3-2 氣走紅人，將連勝推進至六場。這位左投在 8 月 3 日交易截止日前加盟後堪稱驚喜——7 場先發拿下 2 勝 2 敗、ERA 2.84，道奇隊贏下了他最近四場先發。\n\nSkubal 的用量受到妥善管理：加盟道奇隊後的七場先發中，他累計 48 次三振、僅 10 次保送，壓制性的 K/BB 比率顯示他的球質在國聯照樣管用。道奇隊在交易截止日前網羅了前一年的賽揚獎亞軍，而他立刻成為輪值核心——這證明了球團在截止日的積極操盤。\n\n本週或許最令人振奮的發展是 Will Smith 從 60 天 IL 歸隊後隨即在一周內開轟。道奇隊在 Smith 缺陣期間交易找來 Hunter Feduccia 和 Ben Rortvedt 擔綱捕手，但他的打擊能力——以及與投手群之間的默契——無可取代。讓 Smith 在十月前恢復健康是個重大利多。\n\n分析師觀點：道奇隊正處於投打雙線同時進入巔峰狀態的時刻。Skubal、Snell 和 Yamamoto 表現精彩；Smith 歸隊穩定捕手戰力；Tucker 和 Muncy 的輸出維持在頂級水準。唯一的變數是 Ohtani 的健康——而在沒有他的情況下寫下八連勝，說明這支球隊即使需要更多時間等待 Ohtani，也能安然度過。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "Trojans' defense smothers Fresno State in 39-0 shutout — a program-defining statement", "headline_zh": "南加大學防守封殺 Fresno State 39-0 — 定義球隊等級的宣言", "analysis": "USC delivered its most complete performance of the Lincoln Riley era in last Saturday's 39-0 shutout of Fresno State, holding the Bulldogs to just 116 total yards — the fewest the Trojans have allowed since blanking Notre Dame to 91 yards in November 2008. The defense recorded two safeties in a single game for the first time in program history (since at least 1971), a stat that encapsulates just how suffocating the effort was.\n\nThe defensive dominance was complemented by surgical offensive efficiency. USC completed passes at a 93%+ clip while throwing for over 400 yards, making the Trojans the first FBS team since at least 1996 to achieve both thresholds in the same game. It was a performance that looked less like a football game and more like an intrasquad scrimmage.\n\nGary Patterson's fingerprints were all over the defensive effort. The legendary TCU coordinator, brought in by Riley to rebuild USC's defense, has clearly transformed the unit. The Trojans held their first two opponents scoreless in the first half — something USC hadn't accomplished in back-to-back games since the 2009 season.\n\nAnalyst take: The 39-0 shutout is significant not just for the margin but for what it represents. USC has been searching for an identity on both sides of the ball under Riley, and this performance — with Patterson's defense suffocating Fresno State while the offense operated with metronomic precision — suggests the Trojans may have finally found it. The question now is whether this translates to Big Ten play.", "analysis_zh": "南加州大學上週六以 39-0 橫掃 Fresno State，交出了 Lincoln Riley 時代最完整的比賽表現。防守端將對手壓制在僅 116 碼總攻勢——這是南加大自 2008 年 11 月以 91 碼封鎖 Notre Dame 以來的最低紀錄。防守組在同一場比賽中創下隊史（至少自 1971 年以來）首次達成兩次達陣區內擒殺（safety）的紀錄，這項數據足以說明防守端有多麼令人窒息。\n\n防守的宰制力搭配了手術刀般精準的進攻效率。南加大傳球完成率超過 93%，同時傳球碼數突破 400 碼——使南加成為至少自 1996 年以來首支在單場比賽中同時達成這兩項門檻的 FBS 球隊。這場表現與其說是一場足球賽，不如說像是一場隊內練習賽。\n\nGary Patterson 的風格在防守表現中一覽無遺。這位傳奇的 TCU 教練被 Riley 聘來重建南加大的防守，顯然已經徹底改造了這支防線。南加連續兩場讓對手上半場零得分——這是球隊自 2009 賽季以來首度達成的成就。\n\n分析師觀點：39-0 的大勝意義不僅在於比分，更在於它所代表的轉折。南加大在 Riley 手下一直在尋找攻防兩端的身分認同，而這場表現——Patterson 的防守封鎖 Fresno State，進攻如同節拍器般精準運作——暗示南加可能終於找到了。現在的問題是：這種水準能否延續到 Big Ten 聯盟賽中。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "Maiava's Heisman case grows: 88.9% completion, 0 INTs heading into Louisiana matchup", "headline_zh": "Maiava 的 Heisman 聲勢高漲：88.9% 完成率、0 截斷迎戰 Louisiana", "analysis": "Jayden Maiava has completed 48 of 54 passes (88.9%) for 635 yards, 5 touchdowns, and zero interceptions through two games — numbers that have drawn Heisman Trophy buzz from opposing head coaches and USC legend Matt Leinart alike. Lincoln Riley called him \"the right quarterback\" for USC's playoff push, a statement that carries extra weight given Riley's history of developing Heisman winners.\n\nThe efficiency is staggering by any measure. USC is the first FBS team since at least 1996 to complete 93%+ of its passes in a game while throwing for 400 yards — and Maiava was the engine behind that historic output. His decision-making has been flawless, with no turnovers in 54 attempts, and his arm talent has translated seamlessly into Riley's up-tempo system.\n\nWhat makes Maiava's candidacy particularly intriguing is the context. Riley has coached three Heisman winners — Baker Mayfield, Kyler Murray, and Caleb Williams — and the system has a proven track record of producing elite quarterback play. Maiava, a transfer who arrived with relatively modest expectations, has outperformed every projection through two weeks.\n\nAnalyst take: The Heisman race is still young, but Maiava's efficiency is historically elite. If he maintains even 75% of this production through Big Ten play — against defenses like Oregon, Penn State, and Ohio State — he'll be in New York for the ceremony. The key question is whether voters will reward the stat line or question the caliber of opposition in the first two weeks.", "analysis_zh": "Jayden Maiava 前兩場比賽傳球 54 次完成 48 次（88.9%），累計 635 碼、5 次達陣、零截斷——這組數據已引起對手總教練和南加大傳奇 Matt Leinart 的 Heisman 獎關注。Lincoln Riley 稱他是「對的四分衛」來推動南加的季後賽之路，考慮到 Riley 培養過三位 Heisman 得主的歷史，這句評價格外有份量。\n\n無論以何種標準衡量，這種效率都令人震驚。南加成為至少自 1996 年以來首支單場傳球完成率超過 93% 且傳球碼數破 400 的 FBS 球隊——而 Maiava 就是創造這項歷史數據的核心引擎。他的決策判斷堪稱完美，54 次嘗試零失誤，臂力天賦也無縫融入了 Riley 的快節奏體系。\n\n讓 Maiava 的候選人資格特別引人入勝的是背景。Riley 曾執教過三位 Heisman 得主——Baker Mayfield、Kyler Murray 和 Caleb Williams——這套體系已證明能產出精英級四分衛表現。Maiava 以相對低調的期待值作為轉學生加盟，前兩週卻超越了所有預測。\n\n分析師觀點：Heisman 競賽仍處於早期，但 Maiava 的效率在歷史上屬於頂級。若他在 Big Ten 聯盟賽——面對 Oregon、Penn State 和 Ohio State 的防守——維持這種產出的 75%，他將出現在紐約的頒獎典禮上。關鍵問題是：評審會青睞這份數據，還是質疑前兩週對手的強度。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "Freshman receivers Trent Mosley and Kayden Dixon-Wyatt announce their arrival", "headline_zh": "新秀外接手 Trent Mosley 與 Kayden Dixon-Wyatt 強勢宣告登場", "analysis": "Trent Mosley has done something no USC freshman had done since Drake London in 2019: record 100-plus receiving yards in each of his first two college games. The true freshman has been the breakout star of the Trojans' early season, combining precise route-running with a physicality that belies his age. In the Fresno State game, Mosley and fellow freshman Kayden Dixon-Wyatt both eclipsed the 100-yard mark — the first time USC had two freshmen with 100-yard receiving games in the same contest since 2012.\n\nMosley's collegiate debut performance — 100+ yards in his very first game — drew comparisons to JuJu Smith-Schuster, who was the last USC freshman to achieve that feat in 2014. Dixon-Wyatt, meanwhile, has provided a complementary deep threat that has stretched opposing defenses and opened up the middle of the field for the tight ends and running backs.\n\nThe freshman receiver explosion has been critical to USC's offensive production, particularly given that the Trojans' veteran receiving corps was expected to carry the load. Instead, Riley has stumbled upon a youth movement that could define the program for years to come — and the fact that both players are contributing at this level so early suggests the recruiting pipeline is flowing at full capacity.\n\nAnalyst take: True freshman receivers rarely produce at this level in major college football. The fact that Mosley and Dixon-Wyatt are both thriving suggests either exceptional recruiting by Riley's staff or a system that is uniquely suited to developing young pass-catchers — or both. If these two maintain their trajectory, USC's passing attack could be unstoppable by midseason.", "analysis_zh": "Trent Mosley 做到了南加大新秀自 2019 年 Drake London 以來無人達成的壯舉：在前兩場大學比賽中每場都拿下 100 碼以上接球。這位大一新生已成為南加本賽季的破繭之星，結合精準的路徑跑動與超越年齡的對抗性。在 Fresno State 的比賽中，Mosley 和另一位大一新生 Kayden Dixon-Wyatt 同時突破 100 碼——這是南加自 2012 年以來首次在單場比賽中有兩位大一外接手達到 100 碼接球。\n\nMosley 的大學處女秀——第一場比賽就突破 100 碼——讓人聯想到 JuJu Smith-Schuster，後者是最後一位在 2014 年達成此紀錄的南加新秀。Dixon-Wyatt 則提供了互補的纵深威脅，拉扯了對手防線並為 tight end 和跑衛創造了中路空間。\n\n新秀外接手的集體爆發對南加大的進攻產出至關重要，尤其在南加資深外接群原本被預期扛起主攻擊量的情況下。Riley 意外發現了一場可能定義球隊未來數年的新秀浪潮——而兩位球員在如此早期就貢獻如此水準，顯示球隊的招募管道正全速運轉。\n\n分析師觀點：大一新秀外接手在頂級大學足球賽中很少能達到這種水準。Mosley 和 Dixon-Wyatt 兩人同時脫穎而出，要嘛是 Riley 教練團的招募眼光極佳，要嘛是這套體系特別適合培養年輕接球員——或者兩者兼具。若兩人維持這種軌跡，南加的空中攻擊到賽季中段可能將無人能擋。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "Stewart, Anderson trending toward return as Trojans close nonconference slate vs. Louisiana", "headline_zh": "Stewart、Anderson 趨向歸隊；南加在非聯盟收官戰迎戰 Louisiana", "analysis": "Lincoln Riley delivered encouraging injury updates this week: standout defensive tackle Jahkeem Stewart (foot) and transfer wide receiver Terrell Anderson are both trending toward playing in Saturday's nonconference finale against Louisiana. Stewart, who missed the first two games, would bolster a defensive line that has already been dominant — adding a player of his caliber to a unit that held Fresno State to 116 yards could make the Trojans' front even more imposing.\n\nSafety Marquis Gallegos is now listed as an \"or\" on the two-deep depth chart for the Louisiana game, suggesting he could also see his first action of the season. The secondary has been solid, but the return of Gallegos adds depth for the grueling Big Ten schedule ahead. Tucker Ashcraft and Peyton Dyer are also expected to be available.\n\nThe Louisiana matchup — the first meeting between these two programs — is the Trojans' final tune-up before opening Big Ten play at Rutgers on September 19. At 2-0 and ranked No. 14 in the AP Poll (one of seven Big Ten teams in the rankings), USC has handled its nonconference business with ruthless efficiency. But the real test begins in two weeks.\n\nAnalyst take: The health updates are more significant than the Louisiana game itself. Getting Stewart back before the Big Ten opener is critical — he's the kind of disruptive interior presence that can wreck an opponent's running game. And Anderson's return gives Maiava another weapon in a receiving corps that is already overloaded with young talent. The question is whether these players can integrate quickly enough to contribute at the level the Big Ten demands.", "analysis_zh": "Lincoln Riley 本週帶來了正面的傷兵消息：明星防守截鋒 Jahkeem Stewart（腳傷）和轉學外接手 Terrell Anderson 都趨向在週六對 Louisiana 的非聯盟收官戰中出賽。Stewart 缺席了前兩場比賽，他的歸隊將為本已宰制的防守前線再添一名大將——想想看，一支已經將 Fresno State 壓制在 116 碼的防線再加上一位 Stewart 等級的球員，南加的前線將更加令人畏懼。\n\n安全衛 Marquis Gallegos 現在在 Louisiana 比賽的兩深度名單上標註為「或」，暗示他也可能迎來本季首次出賽。後場表現穩定，但 Gallegos 的歸隊為即將到來的艱困 Big Ten 賽程增添了深度。Tucker Ashcraft 和 Peyton Dyer 也預計可以出賽。\n\n對 Louisiana 的比賽——兩校歷史首次交鋒——是南加在 9 月 19 日客場出戰 Rutgers 開啟 Big Ten 聯盟賽之前的最後一次熱身。以 2 戰全勝、AP 排名第 14（Big Ten 七支排名球隊之一）的戰績，南加以殘酷的效率完成了非聯盟賽程。但真正的考驗在兩週後才開始。\n\n分析師觀點：傷兵更新比 Louisiana 比賽本身更重要。在 Big Ten 開幕戰前迎回 Stewart 至關重要——他是那種能癱瘓對手跑陣的破壞性內線球員。而 Anderson 的歸隊為 Maiava 提供了另一件武器，在一支已經人才濟濟的接球群中。問題是這些球員能否在 Big Ten 要求的水準上快速融合。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "Recruiting momentum surges: five-star Braylon Clark and RB Malaki Davis push toward commitment", "headline_zh": "招募動能湧現：五星新秀 Braylon Clark 與跑衛 Malaki Davis 接近承諾", "analysis": "USC's recruiting machine is humming at full speed even as the 2026 season unfolds. Five-star 2028 wide receiver Braylon Clark has placed the Trojans on his final 12 schools, while three-star 2028 running back Malaki Davis of Corona Centennial is expected at the Coliseum on Saturday for the Louisiana game. USC already holds a 2028 quarterback commitment in Trey Wright and brought in the No. 1 recruiting class in 2026.\n\nThe timing is strategic: hosting recruits during a dominant nonconference stretch — with the defense playing at an elite level and Maiava putting up Heisman numbers — gives USC's coaching staff a powerful sales pitch. The Coliseum atmosphere, the Big Ten brand, and the track record of developing NFL talent all feed into the narrative.\n\nClark, in particular, is a marquee target. Five-star receivers don't come along often, and landing him would cement USC's status as the premier destination for pass-catchers on the West Coast. The fact that the Trojans' freshman receivers (Mosley and Dixon-Wyatt) are already producing at a high level only strengthens the pitch.\n\nAnalyst take: Recruiting is the lifeblood of college football programs, and USC's ability to maintain elite-level recruiting while simultaneously producing on-field results is the hallmark of a program operating at its peak. Riley's track record of developing quarterbacks and receivers is his greatest recruiting tool, and the early-season success has given him fresh material for every living-room conversation.", "analysis_zh": "南加大的招募機器即使在 2026 賽季進行中也全速運轉。五星的 2028 年級外接手 Braylon Clark 已將南加列入他的最終 12 校名單，而三星的 2028 年級跑衛 Malaki Davis（就讀 Corona Centennial）預計週六現身 Coliseum 觀看 Louisiana 比賽。南加已握有 2028 年級四分衛 Trey Wright 的承諾，並在 2026 年級帶回了全美第一的招募班級。\n\n時間點極具策略性：在非聯盟賽壓制性表現——防守達精英水準、Maiava 數據具 Heisman 級別——的期間接待招募對象，為教練團提供了強而有力的推銷說詞。Coliseum 的氛圍、Big Ten 的品牌價值，以及培養 NFL 人才的紀錄，都融入了這套敘事。\n\nClark 尤其是頂級目標。五星外接手並不常見，網羅他將鞏固南加作為西岸接球員首選目的地的地位。而南加的新秀外接手（Mosley 和 Dixon-Wyatt）已經在高水準貢獻，更強化了這項推銷說詞。\n\n分析師觀點：招募是大學足球的生命線，南加能在創造場上成果的同時維持精英級別的招募水準，正是球隊運作在巔峰的標誌。Riley 培養四分衛和外接手的紀錄是他最強大的招募工具，而賽季初的成功又為他每一次對新生家庭的對話提供了新素材。"}, {"team": "Rams", "accent": "#003594", "headline": "Rams humbled 27-7 in NFL's first-ever Australian regular-season game", "headline_zh": "公羊隊在 NFL 史上首場澳洲例行賽中以 27 慘敗", "analysis": "The Rams arrived in Melbourne for the NFL's first-ever regular-season game in Australia — played before 100,021 fans at the Melbourne Cricket Ground — and were promptly dismantled 27-7 by the San Francisco 49ers. The 20-point margin was the Rams' worst defeat since November 2024, and the performance raised serious questions about whether a team widely labeled a \"superteam\" was ready for the scrutiny of the regular season.\n\nThe logistics were always going to be challenging: the Rams arrived in Melbourne just over 24 hours before kickoff, crossing 15 time zones to play in what was essentially a neutral-site game against their NFC West rival. But the travel excuse wore thin quickly when the Rams' offense and defense both looked sluggish from the opening drive. San Francisco's quick-passing scheme and disciplined run game exploited every soft spot in the Rams' zone-heavy approach.\n\nMatthew Stafford posted a 61.2 passer rating — his lowest in a game in nearly a decade — going 15-for-25 with 155 yards and an interception. The lone bright spot was Puka Nacua's 41-yard catch that set up Kyren Williams' touchdown, but that big play only came after the game was already slipping away. The fourth-and-goal quarterback sneak from the 1-yard line that was stuffed, followed by a 99-yard San Francisco touchdown drive, was the kind of back-breaking sequence that can define a season.\n\nAnalyst take: The Melbourne game exposed what many had quietly wondered: can the Rams' defense actually function at a high level with this personnel? The offseason investment of $200M-plus in the secondary and the acquisitions of Myles Garrett and Aaron Donald generated enormous hype, but the execution on Sunday was disjointed. If this is the floor, the ceiling is still incredibly high — but if this is closer to the ceiling, Sean McVay has serious work to do.", "analysis_zh": "公羊隊飛往墨爾本參加 NFL 史上首場澳洲例行賽——在墨爾本板球場的 100,021 名觀眾面前——卻被舊金山 49 人以 27-7 痛擊。20 分的差距是公羊隊自 2024 年 11 月以來最慘痛的敗北，而這場表現引發了嚴肅質疑：一支被廣泛標籤為「超級球隊」的隊伍，是否真的準備好面對例行賽的檢驗。\n\n後勤本就是巨大挑戰：公羊隊在開球前僅 24 小時多抵達墨爾本，跨越了 15 個時區，在 essentially 中立場地對戰國聯西區死敵。但旅行的藉口很快就站不住腳——公羊隊的進攻和防守從第一波進攻起就顯得遲鈍。舊金山的快速傳球體系和紀律嚴明的跑陣攻擊，充分利用了公羊隊以區域防守為主的防線中的每一個軟肋。\n\nMatthew Stafford 傳出 61.2 的傳球評分——近十年來的最低紀錄——25 次嘗試完成 15 次、155 碼、1 次截斷。唯一的亮點是 Puka Nacua 的 41 碼接球帶動 Kyren Williams 的達陣，但這次大 Plays 出現時比賽已逐漸失控。而在 1 碼線上的四分衛 sneak 被擋下、隨後舊金山發動 99 碼達陣攻勢的序列，正是那種能定義一個賽季的致命轉折。\n\n分析師觀點：墨爾本之戰暴露了許多人私下存在的疑問：公羊隊的防守真的能憑藉這套陣容維持高水準嗎？休賽季在後場投入超過 2 億美元加上網羅 Myles Garrett 和 Aaron Donald 引發了巨大期待，但週日的執行力卻顯得零散。若這是底線，天花板仍然極高——但若這更接近天花板，Sean McVay 就有大量工作要做。"}, {"team": "Rams", "accent": "#003594", "headline": "Aaron Donald lifted from Exempt List — debut possible as soon as Monday night vs. Giants", "headline_zh": "Aaron Donald 解除處方清單 — 最快週一晚對巨人隊迎來復出首秀", "analysis": "In a development that could reshape the Rams' season, the NFL removed Aaron Donald from the Commissioner's Exempt List on Friday's transaction wire. The three-time Defensive Player of the Year, who ended a 2½-year retirement by re-signing on August 30, was kept home from the Australia trip but is now eligible for a possible debut as soon as Monday night against the Giants at SoFi Stadium.\n\nDonald's return from retirement has been one of the NFL's most captivating storylines of 2026. The 35-year-old walked away after the 2023 season with three DPOY awards, a Super Bowl ring, and a legacy as one of the greatest defensive players in league history. His decision to come back — initially for an emotional farewell season — has evolved into something potentially more competitive as the Rams' \"superteam\" narrative took shape around him.\n\nThe Rams have emphasized that they'll only play Donald when he's fully ready, and the Exempt List's two-week roster exemption gives them flexibility to ramp up his practice participation before committing to a game day role. With 10 days between the Melbourne loss and the Giants game, the timing is ideal for Donald to make his return in a controlled environment.\n\nAnalyst take: Donald's debut would be the most anticipated return to a lineup since Tom Brady un-retired. But the real question isn't whether Donald can still play — it's whether he can elevate a defense that looked lost against San Francisco. His presence alone commands double-teams, which could free up Myles Garrett (when healthy) and the secondary. The Rams need a spark, and Donald arriving on Monday night could be exactly that.", "analysis_zh": "可能改變公羊隊賽季走向的一項發展：NFL 週五在交易電報中將 Aaron Donald 從處方清單上移除。這位三度年度最佳防守球員在結束 2½ 年退休後於 8 月 30 日重新簽約，原本被留在美國沒有前往澳洲，但現在最快可在週一晚間對巨人隊的 SoFi Stadium 比賽中迎來復出首秀。\n\nDonald 從退休歸隊是 2026 年 NFL 最引人入勝的故事線之一。這位 35 歲的防守者在 2023 賽季後退休，帶著三座 DPOY 獎盃、一枚超級碗冠軍戒指，以及聯盟史上最偉大防守球員之一的傳奇地位。他最初為了感性的告別賽季而回來的決定，在公羊隊「超級球隊」敘事圍繞他成形後，已演變為更具競爭性的事態。\n\n公羊隊強調只會在 Donald 完全準備好時才讓他上場，而處方清單的兩週 roster 豁免給了球隊在承諾比賽日角色前逐步增加他練習參與度的彈性。在墨爾本敗仗和巨人隊比賽之間有 10 天的間隔，時間點對 Donald 在受控環境下復出再理想不過。\n\n分析師觀點：Donald 的復出將是自 Tom Brady 取消退休以來最受期待的回歸。但真正的問題不是 Donald 還能不能打——而是他能否提升一支在對戰舊金山時看起來迷失方向的防守組。他的存在本身就能吸引雙人包夾，這可能為 Myles Garrett（當他健康時）和後場創造空間。公羊隊需要一劑強心針，而 Donald 週一晚間的歸隊可能正是那劑良藥。"}, {"team": "Rams", "accent": "#003594", "headline": "Myles Garrett admits knee injury is significant after quiet 0-tackle debut", "headline_zh": "Myles Garrett 承認膝傷嚴重；0 次擒抱的低迷首秀", "analysis": "The reigning AP Defensive Player of the Year's Rams debut could not have gone worse. Myles Garrett finished with zero tackles and was held without a single pressure for the first time since 2018, playing 62% of the snaps on a knee he admitted after the game isn't 100%. After the 15-hour flight home from Melbourne, Garrett's candor about his physical condition was striking: \"We knew we were going to face some adversity this season. It's game one.\"\n\nThe numbers were jarring for a player who has been one of the most dominant pass-rushers of his generation. Garrett's inability to impact Brock Purdy — who threw three touchdown passes without being seriously pressured — exposed a vulnerability that the Rams hadn't planned for. His 62% snap count suggests the coaching staff was managing his workload, but even in limited duty, the lack of production was alarming.\n\nThe knee injury adds another layer of uncertainty to a Rams team that was supposed to have its defensive questions answered by the offseason acquisitions. Garrett's trade from Cleveland was meant to pair him with Donald for a fearsome pass-rush duo, but through one game, neither star has been on the field together — and Garrett's health is now a legitimate concern.\n\nAnalyst take: If Garrett's knee is truly significant, the Rams' entire defensive scheme needs to be reconsidered. Chris Shula's zone-heavy approach was predicated on elite pass-rush talent creating havoc up front; without a healthy Garrett, the secondary — despite its $200M investment — becomes far more vulnerable. The next 10 days before the Giants game are critical for determining whether this is a short-term issue or something that could linger all season.", "analysis_zh": "年度最佳防守球員的公羊首秀不可能更糟了。Myles Garrett 最終以零次擒抱作收，自 2018 年以來首次在一場比賽中沒有製造任何一次壓力，僅在膝蓋有傷的情況下出戰了 62% 的 snap。從墨爾本搭了 15 小時飛機回美國後，Garrett 對身體狀況的坦率令人矚目：「我們知道這個賽季會遇到一些逆境。這是第一場比賽。」\n\n這些數字對一位被視為當代最具宰制力的衝傳手之一的球員而言是震撼的。Garrett 無法對 Brock Purdy 造成影響——後者投出三次達陣傳球而沒有受到真正壓力——暴露了公羊隊未曾計劃到的弱點。他 62% 的 snap 占比暗示教練團在管理他的工作量，但即使出場有限，缺乏產出的情況也令人擔憂。\n\n膝傷為這支本應透過休賽季補強解決防守問題的公羊隊增添了另一層不確定性。Garrett 從克里夫蘭的交易旨在與 Donald 搭檔組成令人生畏的衝傳雙人組，但一場比賽過後，兩位球星尚未在場上並肩作戰——而 Garrett 的健康現在成為了真正的隱憂。\n\n分析師觀點：若 Garrett 的膝傷確實嚴重，公羊隊的整套防守體系就需要重新評估。Chris Shula 以區域防守為主的策略，是建立在頂級衝傳 talent 在前線製造混亂的假設上；若缺少健康的 Garrett，儘管後場投入了 2 億美元，卻會變得更加脆弱。在巨人隊比賽前的這 10 天，對判斷這是短期問題還是可能延續整個賽季的傷勢至關重要。"}, {"team": "Rams", "accent": "#003594", "headline": "Shula's defense under fire: four straight flat performances raise coordinator questions", "headline_zh": "Shula 防守體系遭質疑：連續四場低迷表現引發 coordinator 危機", "analysis": "The Rams' defensive collapse in Melbourne didn't happen in a vacuum. ESPN analyst Dan Orlovsky raised alarms on \"Get Up!\" this week, pointing to four consecutive games of underwhelming defensive performances — even with elite talent on the roster. \"I am very concerned about that defense, and I'm very concerned about their defensive coordinator,\" Orlovsky said, articulating what many fans had been thinking.\n\nChris Shula's zone-heavy scheme was gashed for 174 rushing yards and three Brock Purdy touchdown passes. The issue isn't the talent — Garrett, Donald (when he returns), and a secondary featuring $200M in investment should be dominant. The issue is the schematic approach, which seems to play against the strengths of man-cover cornerbacks who were brought in specifically to lock down receivers in press coverage.\n\nThe 10 takeaways from SI's postgame analysis highlighted the disconnect: the Rams arrived in Melbourne just over 24 hours before kickoff, Garrett's knee limited his effectiveness, Trent McDuffie went quiet, and Shula's scheme failed to adjust to San Francisco's quick-passing attack. It was a comprehensive failure that pointed to coaching as much as execution.\n\nAnalyst take: Coordinators are the first to be questioned after a blowout loss, and rightfully so. But the Rams' defensive issues predate Melbourne — they've been simmering since last season. If Shula can't find a way to maximize the talent on his roster, the questions will only get louder, especially if Donald's return doesn't immediately translate to defensive improvement. The Rams' Super Bowl window is now, and every week of underperformance narrows it further.", "analysis_zh": "公羊隊在墨爾本的防守崩潰並非孤立事件。ESPN 分析師 Dan Orlovsky 本週在「Get Up!」節目中發出警報，指出連續四場低迷的防守表現——即使陣中擁有頂級 talent。Orlovsky 表示：「我對這支防守非常擔心，對他們的防守 coordinator 也非常擔心。」他精準地說出了許多球迷的心聲。\n\nChris Shula 以區域防守為主的體系被攻破，對手跑出 174 碼並由 Brock Purdy 投出三次達陣傳球。問題不在 talent——Garrett、Donald（歸隊後），以及投入 2 億美元的後場本應具有宰制力。問題在於戰術設計，似乎與專門為 press coverage 鎖定接球員而引進的 man-cover 角衛的優勢背道而馳。\n\nSI 賽後分析的十大要點凸顯了脫節：公羊隊在開球前僅 24 小時多抵達墨爾本、Garrett 的膝傷限制了他的 effectiveness、Trent McDuffie 毫無表現，以及 Shula 的體系未能調整應對舊金山的快速傳球攻擊。這是一場全面性的失敗，指向教練與執行力的雙重問題。\n\n分析師觀點：大敗後 coordinator 是第一個被質疑的人，而這是合理的。但公羊隊的防守問題並非始於墨爾本——它們從上個賽季就開始醱酵。若 Shula 找不到最大化手中 talent 的方法，質疑聲只會越來越大，尤其若 Donald 的歸隊沒有立即轉化為防守改善的話。公羊隊的超級碗窗口就是現在，每週的低迷表現都在進一步縮窄它。"}, {"team": "Rams", "accent": "#003594", "headline": "Stafford's worst game in a decade, McVay's gamble backfire in Melbourne loss", "headline_zh": "Stafford 近十年最差一役、McVay 賭博失敗 — 墨爾本敗仗的關鍵", "analysis": "Matthew Stafford's 61.2 passer rating against the 49ers was his lowest in a game in nearly a decade, and it came at the worst possible time — with 100,021 fans watching the NFL's Australian showcase and the national media primed to evaluate the Rams' \"superteam\" experiment. Stafford went 15-for-25 with 155 yards and an interception, his efficiency cratering against a San Francisco defense that took away his first and second reads with disciplined coverage.\n\nThe most agonizing sequence came in the second quarter: facing fourth-and-goal from the 1-yard line, Sean McVay opted for a Stafford quarterback sneak — a play that was stuffed at the line. San Francisco immediately answered with a 99-yard touchdown drive, a sequence that McVay himself acknowledged cost his team the game. Instead of a potential 7-7 tie, the Rams found themselves down 14-0 with the momentum completely shifted.\n\nStafford's performance was emblematic of a broader offensive dysfunction. The Rams managed just 7 points — their lowest output since McVay became head coach in a non-weather-disrupted game. The offensive line struggled to create running lanes for Kyren Williams, and the passing game lacked the explosive plays that had defined the Rams' attack in previous seasons.\n\nAnalyst take: The fourth-and-goal gamble will be debated for weeks, but the real issue is the Rams' inability to sustain drives. Stafford's conservative approach — likely influenced by the quick rush the offensive line was under — turned the Rams' offense into a dink-and-dunk operation that San Francisco's defense was perfectly happy to concede. When you invest this much in a roster, the offense needs to score more than 7 points, regardless of the opponent or the venue.", "analysis_zh": "Matthew Stafford 對 49 人的 61.2 傳球評分是他近十年來的最低紀錄，而時間點再糟糕不過——100,021 名觀眾正在觀看 NFL 的澳洲展演賽，全國媒體也準備好來評估公羊隊的「超級球隊」實驗。Stafford 25 次嘗試完成 15 次、155 碼、1 次截斷，面對舊金山以嚴謹 coverage 封鎖他的一讀和二讀的防守，他的效率急遽下滑。\n\n最令人痛苦的序列出現在第二節：面對一碼線上的 fourth-and-goal，Sean McVay 選擇了 Stafford 的四分衛 sneak——卻在線前被擋下。舊金山隨即回以一次 99 碼的達陣攻勢，McVay 本人承認這個 sequence 付出了比賽的代價。公羊隊沒有得到潛在的 7-7 平手，反而陷入 14-0 落後，勢頭完全逆轉。\n\nStafford 的表現反映了更廣泛的進攻失調。公羊隊僅得到 7 分——這是 McVay 擔任總教練以來在非天氣因素干擾的比賽中的最低得分。進攻線難以為 Kyren Williams 創造跑陣空間，傳球攻擊也缺乏定義公羊隊前幾個賽季的爆發 Plays。\n\n分析師觀點：fourth-and-goal 的賭博將被討論數週，但真正的問題是公羊隊無法維持進攻 drive。Stafford 保守的 approach——可能受到進攻線承受的快速衝傳影響——將公羊隊的進攻變成了短傳作業，而舊金山的防守非常樂意接受這種策略。當你為一支球隊投入如此大量的資源時，進攻端需要得到超過 7 分，不論對手或場地。"}, {"team": "Rams", "accent": "#003594", "headline": "Curl and Allen add to injury concerns; 10-day rest before Giants on Monday night", "headline_zh": "Curl 和 Allen 加入傷兵行列；週一晚巨人戰前有 10 天恢復期", "analysis": "Beyond the schematic and execution failures in Melbourne, the Rams also suffered significant injury losses. Safety Kam Curl exited early with an ankle injury, and tight end Davis Allen was evaluated for a concussion during the loss. Both players now have 10 full days to recover before the Rams host the Giants on Monday night, September 21, at SoFi Stadium.\n\nCurl's ankle injury is particularly concerning given the Rams' investment in their secondary. The safety room was already thin before the season, and losing Curl — even temporarily — would further strain a unit that was exposed by San Francisco's quick passing attack. Allen's concussion evaluation adds another variable to an offense that was already struggling to find its rhythm.\n\nThe silver lining of the extended break is the recovery time. With 10 days between games — the Rams' longest rest period of the season — the training staff has an opportunity to get multiple players healthy for the Giants game. The extended preparation time also gives McVay and his coaching staff a chance to address the defensive scheme issues that have plagued the team.\n\nAnalyst take: The 10-day rest period is a blessing in disguise for a team that needs to regroup. McVay will use every minute of that time to diagnose what went wrong in Melbourne, integrate Aaron Donald into the defensive scheme, and figure out how to get Myles Garrett healthy. The Giants game on Monday night is no longer just a Week 2 matchup — it's an audition for the Rams' credibility as a legitimate contender.", "analysis_zh": "除了墨爾本的戰術和執行失敗外，公羊隊也遭受了重大傷兵損失。安全衛 Kam Curl 早退因踝傷，tight end Davis Allen 則在比賽中接受腦震盪評估。兩位球員現在有整整 10 天的時間恢復，以迎接 9 月 21 日週一晚間在 SoFi Stadium 對巨人隊的比賽。\n\nCurl 的踝傷格外令人擔憂，考慮到公羊隊在後場的投入。安全衛的位置在賽季開始前就已經深度不足，而失去 Curl——即使是暫時的——將進一步壓榨一支已被舊金山快速傳球攻擊暴露出問題的後場。Allen 的腦震盪評估則為本已掙扎於找到節奏的進攻增添了另一個變數。\n\n長休息的週期中一線希望是恢復時間。在兩場比賽之間有 10 天——這是公羊隊本季最長的休息期——訓練團隊有機會讓多位球員以健康狀態迎接巨人戰。額外的準備時間也給了 McVay 和教練團診斷墨爾本問題的機會。\n\n分析師觀點：10 天的休息期對一支需要重整的球隊而言是因禍得福。McVay 會用每一分鐘來診斷墨爾本出了什麼問題、將 Aaron Donald 融入防守體系，以及找出如何讓 Myles Garrett 恢復健康。週一晚間對巨人隊的比賽不再只是第二週的例行賽——它是公羊隊作為真正競爭者之可信度的試鏡。"}], "closing": "It's a weekend of contrasts across LA sports. The Dodgers head to Miami riding an eight-game winning streak and a roster that keeps reloading — even with Ohtani sidelined, this team looks virtually unstoppable in the NL West. USC prepares to close its nonconference slate against Louisiana with a historically efficient offense and a defense that has rediscovered its teeth, setting the stage for a grueling Big Ten gauntlet. And the Rams, humbled in Melbourne, face 10 days of soul-searching before Aaron Donald potentially returns to a defense that desperately needs his presence. The stakes have never been higher for LA's three marquee franchises.", "closing_zh": "洛杉磯體壇的週末呈現截然不同的面貌。道奇隊前往邁阿密，帶著八連勝和持續補充的陣容——即使 Ohtani 缺陣，這支球隊在國聯西區看起來 virtually 不可戰勝。南加州大學準備以歷史級的進攻效率和重新找回鋒利度的防守面對 Louisiana，為即將到來的 Big Ten 苦戰奠定基礎。而公羊隊在墨爾本遭到痛擊，在 Aaron Donald 可能歸隊之前面對 10 天的深刻反思，而他們的防守正 desperate 地需要他的存在。對洛杉磯的三大招牌球隊而言， stakes 從未如此之高。"};
let lang = "en";
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmtPT(iso){ return new Date(iso).toLocaleString("en-US",{timeZone:"America/Los_Angeles",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"})+" PT"; }

function renderDigest(d){
  const box = document.getElementById("digest");
  if(!d || !d.segments){
    box.innerHTML = '<div style="text-align:center;color:var(--dim);padding:40px">No digest yet</div>';
    return;
  }
  const segs = d.segments.map(s=>{
    const headline = lang==="en" ? s.headline : s.headline_zh;
    const analysis = lang==="en" ? s.analysis : s.analysis_zh;
    return '<div class="seg" style="--team:'+esc(s.accent)+'">' +
      '<div class="row"><span class="hn">'+esc(headline)+'</span><span class="badge">'+esc(s.team)+'</span></div>' +
      '<div class="lbl">'+(lang==="en"?"Analysis":"分析")+'</div><p>'+esc(analysis)+'</p>' +
      '</div>';
  }).join("");
  box.innerHTML =
    '<div class="dhead">' +
      '<div class="t"><div class="mic">🎙️</div><div><h2>'+esc(d.title)+'</h2><div class="meta">' +
        esc(d.read_time || "")+' · '+fmtPT(d.updated_at)+
        ' · 繁中/EN</div></div></div>' +
      '<div class="langs">'+
        '<button id="btnEn" class="on" onclick="setLang(\'en\')">EN</button>'+
        '<button id="btnZh" onclick="setLang(\'zh\')">繁體中文</button>'+
      '</div>' +
    '</div>' +
    '<div class="intro">'+esc(lang==="en"?d.intro:d.intro_zh)+'</div>' +
    '<div class="segs">'+segs+'</div>' +
    '<div class="closing">'+esc(lang==="en"?d.closing:d.closing_zh)+'</div>';
}
function setLang(v){ lang = v; document.getElementById("btnEn").classList.toggle("on", v==="en"); document.getElementById("btnZh").classList.toggle("on", v==="zh"); renderDigest(DIGEST_DATA); }

function renderNews(d){ const upd = document.getElementById("upd"); if(upd) upd.textContent = fmtPT(d.updated_at);
  const g = document.getElementById("grid"); g.innerHTML = "";
  for(const t of d.teams){
    const c = document.createElement("div"); c.className = "card"; c.style.setProperty("--team", t.accent);
    const emoji = t.emoji==="Baseball"?"⚾":t.emoji==="Football"?"🏈":"🏆";
    c.innerHTML =
      '<div class="top"><div class="ico">' + emoji + '</div>' +
      '<div><div class="name">' + esc(t.name) + '</div><div class="rec">' + t.sport + ' · ' + esc(t.record) + '</div></div></div>' +
      '<div class="hline">' + esc(t.headline) + '</div>' +
      '<h3>Latest News</h3><ul class="news">' + t.latest_news.map(n =>
        '<li><a target="_blank" rel="noopener" href="' + esc(n.url) + '">' + esc(n.title) + '</a><p>' + esc(n.summary) + '</p></li>'
      ).join("") + '</ul>' +
      '<h3>Fun Facts</h3><ul class="facts">' + t.fun_facts.map(f => '<li>'+esc(f)+'</li>').join("") + '</ul>' +
      '<h3>Further Reading</h3><ul class="read">' + t.further_reading.map(f =>
        '<li><a target="_blank" rel="noopener" href="' + esc(f.url) + '"><span>'+esc(f.title)+'</span><span class="why">'+esc(f.why)+'</span></a></li>'
      ).join("") + '</ul>' +
      '<div class="oss">' + esc(t.one_sentence) + '</div>';
    g.appendChild(c);
  }
}

renderDigest(DIGEST_DATA);
renderNews(TEAMS_DATA);
</script>
</body>
</html>
