<title>LA Sports Fan</title>
<style>
  :root{
    --bg:#0b0e14; --panel:rgba(255,255,255,.04); --panel2:rgba(255,255,255,.02);
    --line:rgba(255,255,255,.08); --fg:#edf2fa; --dim:#8a94a6;
    --radius:18px; --glow:0 0 0 1px rgba(255,255,255,.04), 0 24px 60px -30px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 500px at 20% -10%, rgba(42,111,216,.18), transparent 60%),
      radial-gradient(1000px 500px at 90% -10%, rgba(153,0,0,.14), transparent 60%),
      radial-gradient(900px 400px at 50% 110%, rgba(31,78,156,.16), transparent 60%),
      var(--bg);
    color:var(--fg); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
    padding:28px clamp(16px,4vw,64px) 64px;
  }
  header{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:26px}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{
    width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;
    background:linear-gradient(135deg,#2a6fd8,#991111);box-shadow:0 8px 30px -8px rgba(60,90,220,.6);
  }
  h1{font-size:clamp(22px,3vw,32px);font-weight:800;letter-spacing:-.02em}
  .sub{color:var(--dim);font-size:13px;margin-top:4px}
  .ticker{
    font-size:12px;color:var(--dim);padding:8px 14px;border-radius:99px;
    background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);
  }
  .ticker b{color:#7ce38b}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:20px}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;backdrop-filter:blur(14px);box-shadow:var(--glow);position:relative;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--team,#2a6fd8),transparent);
  }
  .top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .ico{
    width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;
    background:color-mix(in srgb,var(--team) 22%, transparent);
  }
  .name{font-size:18px;font-weight:800;letter-spacing:-.01em}
  .rec{font-size:11px;color:var(--team);font-weight:700;margin-top:2px}
  .hline{font-size:13px;line-height:1.5;color:var(--dim);padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);margin-bottom:16px}
  h3{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
  h3::after{content:"";flex:1;height:1px;background:var(--line)}
  .news{list-style:none}
  .news li{padding:10px 12px;border-radius:12px;margin-bottom:6px;background:var(--panel2);border:1px solid var(--line);transition:.2s}
  .news li:hover{border-color:color-mix(in srgb,var(--team) 50%, transparent);transform:translateX(3px)}
  .news a{color:var(--fg);text-decoration:none;font-weight:700;font-size:13px;display:block;margin-bottom:4px}
  .news a:hover{color:var(--team)}
  .news p{font-size:12px;color:var(--dim);line-height:1.5}
  .facts{list-style:none;display:grid;gap:6px}
  .facts li{position:relative;padding:2px 0 2px 18px;font-size:12.5px;color:var(--fg);line-height:1.55}
  .facts li::before{content:"⚡";position:absolute;left:0;top:2px;font-size:11px;filter:grayscale(.4)}
  .read{list-style:none;display:grid;gap:6px}
  .read a{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12.5px;color:var(--fg);text-decoration:none;padding:9px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
  .read a:hover{color:var(--team);border-color:color-mix(in srgb,var(--team) 50%, transparent)}
  .read .why{font-size:11px;color:var(--dim)}
  .oss{font-size:12.5px;line-height:1.6;color:var(--fg);background:linear-gradient(90deg,color-mix(in srgb,var(--team) 18%,transparent),transparent);border-left:3px solid var(--team);padding:10px 14px;border-radius:0 12px 12px 0;margin-top:16px}
  banner{display:block;text-align:center;color:var(--dim);font-size:13px;margin-top:22px}
  banner span{color:#7ce38b;animation:blink 1.5s infinite}
  @keyframes blink{50%{opacity:.3}}
  .spin{width:100%;height:100px;display:grid;place-items:center;color:var(--dim)}
  /* ---- digest ---- */
  .digest{
    background:linear-gradient(135deg,rgba(42,111,216,.12),rgba(153,0,0,.10),rgba(31,78,156,.12)),var(--panel);
    border:1px solid var(--line);border-radius:var(--radius);padding:26px;
    backdrop-filter:blur(14px);box-shadow:var(--glow);margin-bottom:22px;
  }
  .dhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;margin-bottom:14px}
  .dhead .t{display:flex;align-items:center;gap:12px}
  .mic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:linear-gradient(135deg,#2a6fd8,#991111)}
  .dhead h2{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .dhead .meta{color:var(--dim);font-size:12px;margin-top:3px}
  .langs{display:flex;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:4px}
  .langs button{border:0;background:transparent;color:var(--dim);font-size:12px;font-weight:700;padding:6px 16px;border-radius:99px;cursor:pointer;transition:.2s}
  .langs button.on{background:linear-gradient(135deg,#2a6fd8,#1f4e9c);color:#fff}
  .intro{font-size:14px;line-height:1.65;color:var(--fg);max-width:820px;margin-bottom:18px}
  .segs{display:grid;gap:12px}
  .seg{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--panel2)}
  .seg .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .seg .row .hn{font-weight:800;font-size:14.5px}
  .seg .badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--team,#2a6fd8) 20%,transparent);color:var(--team);white-space:nowrap}
  .seg p{font-size:12.5px;line-height:1.6;color:var(--dim);margin-top:6px}
  .seg p.cls{color:var(--fg)}
  .seg .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin-top:10px;font-weight:700}
  .closing{font-size:14px;line-height:1.6;border-top:1px dashed var(--line);margin-top:16px;padding-top:14px;color:var(--fg)}
</style>
</head>

const TEAMS_DATA = {"updated_at": "2026-09-12T13:03:29.986282+00:00", "teams": [{"name": "Dodgers", "sport": "MLB", "emoji": "Baseball", "accent": "#2A6FD8", "record": "82-57", "headline": "Ohtani hits IL as De Paula debuts; Dodgers cruise toward NL West title", "latest_news": [{"title": "Ohtani placed on 15-day IL with right bicep inflammation", "summary": "Shohei Ohtani was placed on the 15-day injured list (backdated to Sept. 8) due to right biceps inflammation. He had been in and out of the lineup for over a week with biceps and knee issues. Eligible to return Sept. 23, Ohtani will remain in LA to rest and rebuild before the final week of the regular season and postseason.", "url": "https://www.usatoday.com/story/sports/mlb/columnist/bob-nightengale/2026/09/10/shohei-ohtani-il-dodgers-call-up-top-prospect-josue-de-paula/91685838007/"}, {"title": "Dodgers call up top prospect Josue De Paula from Double-A", "summary": "In an unprecedented move, the Dodgers promoted 21-year-old outfielder Josue De Paula directly from Double-A Tulsa to fill Ohtani's roster spot. De Paula slashed .303/.401/.547 with 27 HR and 31 SB in 124 games. He went 1-for-3 with a walk in his MLB debut Friday in Miami.", "url": "https://www.latimes.com/sports/dodgers/story/2026-09-11/josue-de-paula-shows-poise-debut-dodgers-marlins"}, {"title": "Glasnow returns from 60-day IL, rejoins rotation", "summary": "Tyler Glasnow was activated from the 60-day IL on Aug. 26, making his first start since May 6 after dealing with lower back spasms. He posted a 2.72 ERA in seven starts before the injury. Roberts says no pitch limit is expected as Glasnow builds toward October.", "url": "https://www.mlb.com/news/tyler-glasnow-activated-from-injured-list-vs-braves"}, {"title": "Dodgers crush Reds 14-1 to sweep series, win 7th straight", "summary": "Los Angeles completed a three-game sweep of the Cincinnati Reds on Wednesday, winning 14-1 to extend their winning streak to seven games. The Dodgers' offense exploded as they clinched their 13th NL West title in 14 years in the making, with the magic number at just four games.", "url": "https://worldbaseball.com/news/a-sudden-il-stint-for-shohei-ohtani-and-an-unprecedented-double-a-call-up-to-fill-his-spot"}, {"title": "Kyle Tucker slams grand slam in 6-2 win over Marlins", "summary": "Kyle Tucker fell a double shy of the cycle, hitting a grand slam to power the Dodgers to a 6-2 victory over the Miami Marlins on Friday night, with Blake Snell delivering another dominant outing in his post-surgery resurgence.", "url": "https://dodgersnation.com/dodgers-phenom-josue-de-paula-shows-promising-signs-in-mlb-debut/2026/09/11/"}, {"title": "Freddie Freeman dealing with right knee issue", "summary": "First baseman Freddie Freeman, the Dodgers' leading hitter at .297, was held out of Wednesday's lineup with right knee soreness. Roberts is hopeful Freeman will be available for the Miami series opener on Friday.", "url": "https://www.latimes.com/sports/dodgers/story/2026-09-10/dodgers-handled-shohei-ohtani-injuries"}], "fun_facts": ["De Paula is the first position player the Dodgers have called up directly from Double-A since Andrew Friedman took over as president of baseball operations in 2015.", "Ohtani's 15-day IL stint is backdated to Sept. 8 — the earliest he can return is Sept. 23, giving him just five regular-season games before the postseason.", "The Dodgers' +146 run differential towers over the NL West, more than 100 runs better than any division rival.", "Despite missing months, Glasnow had a 2.72 ERA before his IL stint — and has shown no pitch limits in his return starts.", "De Paula's Double-A slash line of .303/.401/.547 with 27 HR and 31 SB makes him one of the most complete prospects in all of baseball."], "further_reading": [{"title": "How Dodgers handled Ohtani's injuries raises questions", "why": "Deep dive on the team's start-and-stop approach with Ohtani's knee and bicep issues, and the tight window to get him healthy for October.", "url": "https://www.latimes.com/sports/dodgers/story/2026-09-10/dodgers-handled-shohei-ohtani-injuries"}, {"title": "Glasnow shows promise in return from injury", "why": "Analysis of Glasnow's comeback start vs. the Braves, including how he settled down after a rocky first inning.", "url": "https://nypost.com/2026/08/25/sports/dodgers-tyler-glasnow-shows-promise-in-return-from-injury/"}, {"title": "De Paula shows poise in much-anticipated debut", "why": "Full recap of De Paula's MLB debut in Miami, including his composed at-bats and the manager's reaction.", "url": "https://www.latimes.com/sports/dodgers/story/2026-09-11/josue-de-paula-shows-poise-debut-dodgers-marlins"}, {"title": "Dodgers magic numbers shrink after huge night", "why": "Updated playoff clinching scenarios, NL West magic number (4), and how the Braves and Brewers factor into the NL seed race.", "url": "https://dodgersnation.com/dodgers-magic-numbers-shrink-after-huge-night-in-nl-standing/2026/09/11/"}], "one_sentence": "The Dodgers are rolling toward the NL West title with a 9-game cushion, but the real story is Shohei Ohtani hitting the IL and top prospect Josue De Paula stepping into his shoes."}, {"name": "USC Trojans", "sport": "College Football", "emoji": "Football", "accent": "#9E1B32", "record": "2-0", "headline": "No. 14 USC finishes nonconference slate Saturday vs. Louisiana — Maiava's Heisman-caliber start fuels dominant Trojans", "latest_news": [{"title": "USC dominates Fresno State in 39-0 shutout behind Patterson's suffocating defense", "summary": "Gary Patterson's defense held Fresno State to 116 total yards and recorded two safeties in a single game — USC's first shutout since 2024 and its most dominant defensive effort in years.", "url": "https://www.latimes.com/sports/usc/story/2026-09-04/usc-football-dominates-shutout-victory-fresno-state"}, {"title": "Freshman WR Trent Mosley already one of college football's top receivers", "summary": "Mosley has 222 receiving yards and 3 TDs in his first two college games, becoming the first USC freshman with 100+ receiving yards in back-to-back games since Drake London in 2019.", "url": "https://dailytrojan.com/2026/09/11/mosley-makes-his-mark/"}, {"title": "Lincoln Riley delivers injury updates for Jahkeem Stewart, Terrell Anderson", "summary": "Riley says defensive tackle Stewart (foot) and WR Anderson (NC State transfer) are both trending toward playing Saturday vs. Louisiana, boosting USC's depth before Big Ten play.", "url": "https://www.si.com/college/usc/football/lincoln-riley-delivers-injury-updates-usc-trojans-jahkeem-stewart-terrell-anderson"}, {"title": "USC freshman receivers showing they're worthy of all the hype", "summary": "True freshmen Trent Mosley, Kayden Dixon-Wyatt, Tron Baker and TE Mark Bowman have all starred through two games, providing an infusion of talent for Jayden Maiava's offense.", "url": "https://nypost.com/2026/09/09/sports/usc-freshman-receivers-showing-theyre-worthy-of-all-the-hype/"}, {"title": "No. 14 USC wraps up nonconference play with inaugural matchup vs. Louisiana", "summary": "The Trojans face Louisiana on Saturday at 8 p.m. PT on Big Ten Network in their final tune-up before opening Big Ten play at Rutgers on Sept. 19.", "url": "https://usctrojans.com/news/2026/9/7/usc-trojans-football-game-preview-notes-louisiana-ragin-cajuns-lincoln-riley-jayden-maiava-trent-mosley-big-ten-network"}], "fun_facts": ["Jayden Maiava is completing 88.9% of his passes (48-of-54) for 635 yards, 5 TDs and 0 INTs through two games — among the nation's most efficient QBs.", "USC scored 2 safeties in a single game against Fresno State, a feat not achieved by any college football team in all of 2025.", "The Trojans have outscored opponents 58-0 in the first half this season, the first time USC has held opponents scoreless in the first half of back-to-back games since 2009.", "True freshman Trent Mosley set a Santa Margarita Catholic High School career record with 217 receptions — and has already translated that production to the Coliseum.", "USC's 2026 recruiting class was ranked No. 1 nationally, featuring 22 blue-chip prospects including five-star edge rusher Luke Wafle."], "further_reading": [{"title": "How to Watch USC vs. Louisiana: Preview, TV Channel, Betting Odds", "why": "Full preview with betting lines (USC -30.5) and keys to the game ahead of Saturday's 8 p.m. PT kickoff on Big Ten Network.", "url": "https://www.si.com/college/usc/football/watch-usc-trojans-louisiana-preview-tv-channel-betting-odds"}, {"title": "USC's relentless defense swarms Fresno State in shutout win", "why": "In-depth breakdown of Gary Patterson's 4-2-5 defensive scheme and how it generated 5 sacks, 7 TFLs and two safeties.", "url": "https://www.thesportingtribune.com/2026/09/04/uscs-relentless-defense-swarms-fresno-state-in-shutout-win"}, {"title": "ESPN evaluates USC football's recruiting and transfer portal classes", "why": "ESPN's full assessment of USC's No. 1 recruiting class and portal additions, including key defensive line reinforcements.", "url": "https://trojanswire.usatoday.com/story/sports/college/trojans/football/2026/03/10/espn-evaluates-usc-football-recruiting-transfer-portal-classes/89062802007/"}, {"title": "2026 USC Football Schedule", "why": "Full schedule including brutal Big Ten stretch: Oregon, Washington, at Penn State, at Wisconsin, vs Ohio State, at Indiana.", "url": "https://www.espn.com/college-football/team/schedule/_/id/30/usc-trojans"}], "one_sentence": "USC (2-0, ranked No. 14) hosts Louisiana on Saturday night in their final nonconference game before a daunting Big Ten gauntlet, with Heisman hopeful Jayden Maiava completing 88.9% of his passes and freshman sensation Trent Mosley emerging as one of the nation's most electric playmakers."}, {"name": "Rams", "sport": "NFL", "emoji": "🏈", "accent": "#003594", "record": "0-1", "headline": "Rams open 2026 down under, fall 27-7 to 49ers in NFL's first-ever Melbourne game", "latest_news": [{"title": "49ers 27-7 Rams: Game Recap from Melbourne", "summary": "In the NFL's first regular-season game in Australia at the MCG, the Rams never found their rhythm and fell to the 49ers in Week 1. Stafford said the offense only produced 'two good drives,' with a 41-yard Puka Nacua grab setting up the Rams' lone touchdown.", "url": "https://www.espn.com.au/nfl/recap?gameId=401872657"}, {"title": "Puka Nacua opens up about alcohol struggles in Netflix interview", "summary": "In a pre-taped interview aired before the Australia opener, the All-Pro receiver discussed his offseason rehab, saying alcohol was a way to escape stress tied to his stardom and the birth of his son. His assault suit from a New Year's Eve incident remains pending.", "url": "https://www.nbclosangeles.com/news/sports/nfl/rams-puka-nacua-alcohol-struggles-interview/3940648/"}, {"title": "Myles Garrett returns to practice, but will Aaron Donald play in opener?", "summary": "Garrett, the reigning DPOY, took part in drills for the first time in weeks after nursing a left knee problem. Donald practiced too, but McVay said his Week 1 status was a day-to-day call - Donald was ultimately ruled out for the Australia game.", "url": "https://www.latimes.com/sports/rams/story/2026-09-06/myles-garrett-returns-to-practice-rams-aaron-donald"}, {"title": "Myles Garrett No. 1 on NFL Top 100 Players of 2026", "summary": "After setting the NFL's single-season sack record (23) and winning his second Defensive Player of the Year award, Garrett stands atop the players' poll. Stafford (4), Nacua (7), Adams (53), Young (84) and Williams (89) also made the list.", "url": "https://www.therams.com/news/myles-garrett-no-1-on-nfl-top-100-players-of-2026"}, {"title": "Rams leaning into villain role: 'These other teams probably hate us'", "summary": "Safety Quentin Lake, comparing the Rams to the Dodgers, embraced the league's eye-roll ahead of a season that featured the reigning MVP in Stafford, Myles Garrett and a Donald comeback. Anything short of a Lombardi Trophy is a failure.", "url": "https://www.nfl.com/news/rams-leaning-into-villain-role-2026-these-other-teams-probably-hate-us"}, {"title": "From the Podium: McVay, Stafford, Garrett on loss to 49ers", "summary": "Stafford: 'We didn't play well enough... never got into a rhythm.' McVay, Garrett and Kobie Turner offered sober takeaways after the Rams' disjointed showing in the historic Down Under opener.", "url": "https://www.therams.com/news/head-coach-sean-mcvay-quarerback-matthew-stafford-outside-linebacker-myles-garrett-defensive-end-kobie-turner-takeaways-rams-loss-49ers-australia-2026-press-conference"}], "fun_facts": ["The Rams-49ers opener at the Melbourne Cricket Ground was the first NFL regular-season game ever played in Australia, staged before more than 100,000 fans.", "Aaron Donald ended a 2 1/2-year retirement on Aug. 30, signing a one-year deal worth $20M guaranteed and up to $30M with incentives to pair with Myles Garrett.", "Myles Garrett became the No. 1 player in the NFL Top 100 after a 23-sack, 33-TFL season - a new single-season NFL sack record - and a June trade to the Rams.", "Reigning MVP Matthew Stafford ranked No. 4 on the NFL Top 100, his highest ever, after throwing 46 touchdowns with a career-best first-team All-Pro nod.", "Six Rams made the NFL Top 100: Garrett, Stafford, Puka Nacua, Davante Adams, Byron Young and Kyren Williams.", "The Rams went 3-0 in the preseason, outscoring opponents 74-30 and shutting out the Saints 34-0."], "further_reading": [{"title": "Aaron Donald unretires, will play for Rams in 2026", "why": "The franchise's three-time NFL DPOY is back in the fold after more than two years away, dramatically raising the ceiling of an already-star-studded front.", "url": "https://www.therams.com/news/aaron-donald-unretires-will-play-for-rams-in-2026"}, {"title": "Breaking down 'almost unfair' Rams roster aiming for Super Bowl", "why": "The LA Times position-by-position look at the 53-man roster, including the 2a/2b QB battle between Stetson Bennett and rookie Ty Simpson behind Stafford.", "url": "https://www.latimes.com/sports/rams/story/2026-09-07/breaking-down-rams-2026-season-roster"}, {"title": "Matthew Stafford No. 4 on NFL Top 100 Players of 2026", "why": "The reigning MVP's highest career ranking, highlighting his 4,707 yards and 46 touchdowns in 2025.", "url": "https://www.therams.com/news/matthew-stafford-no-4-on-nfl-top-100-players-of-2026"}, {"title": "Rams announce initial 53-man roster for 2026 season", "why": "Position-by-position breakdown of the 53-man roster, including three quarterbacks and the young receivers who stepped up in camp.", "url": "https://www.therams.com/news/rams-announce-initial-53-man-roster-for-2026-season"}, {"title": "NFL Week 1 injury report: Player statuses for all 16 games", "why": "Confirms Aaron Donald was ruled OUT for the Melbourne opener while Myles Garrett and Puka Nacua carried no designation.", "url": "https://www.nfl.com/news/nfl-week-1-injury-report-2026-season"}], "one_sentence": "The star-studded, Super-Bowl-favorite Rams stumbled out of the gate in Melbourne, losing 27-7 to the 49ers in the NFL's first-ever Australia game."}]};
const DIGEST_DATA = {"updated_at": "2026-09-12T06:00:21-07:00", "title": "LA Sports Daily Digest — 15-Minute Edition", "read_time": "~15 minutes", "intro": "September in Los Angeles is a study in contrasts. The 82-57 Dodgers are one week from another NL West crown — magic number at four — even as Shohei Ohtani heads to the injured list and 21-year-old Josue De Paula makes an historic debut; No. 14 USC keeps blanking opponents behind a red-hot Jayden Maiava and a freshman receiver named Trent Mosley; and the star-studded 0-1 Rams are licking wounds from a 27-7 humbling in the NFL's first-ever Australian game. Here is everything you need to know this Friday.", "intro_zh": "九月的洛杉磯是一個對比鮮明的課題。戰績 82 勝 57 敗的道奇隊距離又一座國聯西區冠軍只剩一週——魔術數字降到四——儘管 Shohei Ohtani 進入傷兵名單、21 歲的 Josue De Paula 完成歷史性的初登場；第 14 名的南加大（2 勝 0 敗）在火燙的 Jayden Maiava 與新生接球手 Trent Mosley 身後持續完封對手；而球星雲集的公羊隊（0 勝 1 敗）正在 NFL 史上首場澳洲例行賽以 27-7 遭受羞辱後舔舐傷口。以下是您今天需要知道的一切。", "segments": [{"team": "Dodgers", "accent": "#2A6FD8", "headline": "Ohtani Placed on 15-Day IL With Right Bicep Inflammation — A Calculated Pause Before October", "headline_zh": "Ohtani 因右肱二頭肌發炎進入 15 天傷兵名單——十月前的一次深思熟慮的暫停", "analysis": "The Dodgers finally made the roster move they had been dancing around for a week: Shohei Ohtani was placed on the 15-day injured list with right bicep inflammation, backdated to Sept. 8. After shuffling in and out of the lineup with bicep and knee issues, Ohtani will stay in Los Angeles to rest and rebuild rather than chase September games that no longer carry much weight in the standings.\n\nThe timeline is the point. The earliest Ohtani can return is Sept. 23, leaving roughly five regular-season games before the postseason begins. The Dodgers are not hiding their intent: this is a calculated pause designed to deliver a healthy Ohtani to October, not a desperate scramble to get him back for another week of coasting.\n\nThe bicep issue is the one that commands respect. For a hitter whose entire identity is bat speed and power, a compromised bicep is not a minor ache — and the knee trouble that set this chain reaction in motion is exactly the kind of thing that lingers through a long playoff run. Both have been managed with a start-and-stop rhythm that frustrated everyone involved.\n\nContext is everything: the Dodgers hold a nine-game cushion in the NL West with the magic number down to four. There is no competitive pressure forcing Ohtani into the lineup. The only clock that matters now is the one running toward the NLDS.\n\nAnalyst take: this is the rare IL stint that is actually good news. The Dodgers finally pulled the trigger on rest instead of running their most important hitter out there at 80 percent. If Sept. 23 arrives and Ohtani is swinging free, this recovery will be remembered as one of the smartest decisions of the season.", "analysis_zh": "道奇隊終於執行了他們繞了一整個星期的那個異動：Shohei Ohtani 因右肱二頭肌發炎被放入 15 天傷兵名單，日期回溯至 9 月 8 日。在過去一週多因肱二頭肌與膝蓋問題反覆進出先發名單後，Ohtani 將留在洛杉磯休息與重建體能，而不是追逐那些對戰績已無關緊要的九月賽事。\n\n時間軸才是重點。Ohtani 最早可在 9 月 23 日歸隊，在季後賽開打前大約剩下五場例行賽。道奇隊毫不掩飾他們的意圖：這是一次深思熟慮的暫停，目的是讓一個健康的 Ohtani 如期出現在十月，而非急著把他拉回來再打一週毫無壓力的比賽。\n\n肱二頭肌的問題值得敬畏。對於一位整個打球身分都建立在揮棒速度與力量上的打者而言，受傷的肱二頭肌絕非小病痛——而開啟這連鎖反應的膝蓋問題，正是那種會在漫長季後賽征途中纏著你的傷。兩者都以一種折磨人的走走停停節奏被管理著。\n\n背景脈絡說明一切：道奇隊在國聯西區握有九場的領先優勢，魔術數字只剩四。沒有任何戰績壓力逼著 Ohtani 上場。現在唯一要跑的時鐘，是走向國聯分區系列賽的那一個。\n\n分析師觀點：這是罕見的、其實是好消息的傷兵名單異動。道奇隊終於扣下板機讓當家打者休息，而不是繼續以八成的狀態把他推上場。如果 9 月 23 日到來時 Ohtani 揮棒自如，這次復原的過程將被記為本季最明智的決定之一。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Josue De Paula Becomes First Position Player Promoted Straight From Double-A in the Friedman Era", "headline_zh": "Josue De Paula 成為 Friedman 時代首位直接從 Double-A 升上大聯盟的位置球員", "analysis": "Josue De Paula walked into the Los Angeles lineup and made the kind of debut the Dodgers only dream about. The 21-year-old outfielder, summoned from Double-A Tulsa to fill Shohei Ohtani's roster spot, went 1-for-3 with a walk in Friday's game in Miami — a composed first impression on the sport's biggest stage.\n\nThe promotion itself is history. De Paula is the first position player the Dodgers have called up directly from Double-A since Andrew Friedman became president of baseball operations in 2015. In an organization famous for its prospect pipeline, that detail says everything about how much the front office believes in this one.\n\nThe numbers justify the leap. Across 124 games at Double-A, De Paula slashed .303/.401/.547 with 27 home runs and 31 stolen bases — a profile that screams five-tool separator. Power and speed in the same 21-year-old frame is exactly what every contender chases, and the Dodgers just added it to a lineup that already leads the National League in run differential.\n\nThe immediate role is a cameo with October upside. With Ohtani resting and the division all but clinched, De Paula gets a real look at big-league pitching without the weight of a pennant race. The outfield of the future is arriving ahead of schedule.\n\nAnalyst take: this is the Dodgers at their best — wielding organizational trust as a competitive weapon. De Paula is not here to save the season; he is here because the payroll and the pipeline are so deep that the club can afford to be bold in September. Watch how he handles left-handed pitching and the strike zone. If the poise holds, the postseason roster conversation gets interesting.", "analysis_zh": "Josue De Paula 走進道奇隊的先發名單，就完成了球團夢寐以求的初登場。這位 21 歲外野手從 Double-A Tulsa 被徵召來填補 Shohei Ohtani 的名單位，週五在邁阿密的比賽中敲出 1 支安打並獲得 1 次保送——在棒球最大的舞台上留下沉著的第一印象。\n\n這次升上本身就是歷史。De Paula 是自 2015 年 Andrew Friedman 接任棒球事務總裁以來，第一位被道奇隊直接從 Double-A 徵召的位置球員。對一支以農場新秀管線聞名的組織而言，這個細節說明了一切：高層是多麼相信這個年輕人。\n\n數字證明了這次跳級的正當性。在 Double-A 的 124 場比賽中，De Paula 繳出 .303/.401/.547 的打擊三圍，附帶 27 支全壘打與 31 次盜壘——這是一份大聲宣示「五拍子武器」的成績單。力量與速度同時存在於一個 21 歲的身軀裡，正是每一支爭冠球隊追求的組合，而道奇隊剛剛把它加進一支已在國聯得失分差領先的打線。\n\n眼前的角色是一場帶有十月願景的客串。在 Ohtani 休息、分區冠軍幾乎入袋的情況下，De Paula 得以在沒有戰績壓力的環境下真正體驗大聯盟投手。以他為首的未來外野陣容，正提前到來。\n\n分析師觀點：這是道奇隊最好的樣貌——把組織的信任當作競爭武器。De Paula 不是來拯救賽季的；他之所以在這裡，是因為薪資與農場的深度足以讓球團在九月放手一搏。請注意他如何應對左投與好球帶——如果沉著能維持下去，季後賽名單的討論將變得有趣。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Dodgers Sweep Reds Behind 14-1 Rout, Magic Number Down to Four", "headline_zh": "道奇隊以 14-1 大勝橫掃紅人隊，魔術數字降至四", "analysis": "The Dodgers are not just winning — they are closing with a flourish. Wednesday's 14-1 demolition of Cincinnati completed a three-game sweep and extended the winning streak to seven, pushing the magic number for the NL West to four. Less than a week of wins separates Los Angeles from a 13th division title in 14 years.\n\nThe blowout was the latest reminder of what separates this team from the rest of the West. The Dodgers' +146 run differential is more than 100 runs better than any division rival — a gulf that has been visible all season and is only widening as October approaches.\n\nSeven straight wins with the division race essentially resolved is a luxury most franchises never get. That cushion has allowed Dave Roberts to rest a banged-up Ohtani, ease Freddie Freeman back from a sore knee, and hand auditions to prospects like Josue De Paula without ever threatening the standings.\n\nThe arithmetic is now trivial: four more wins — or the right combination of division-rival losses — and the celebration begins. From there, the entire focus shifts to seeding, health, and lining up the rotation for a postseason run that begins with less than a week of regular-season ball remaining.\n\nAnalyst take: the magic number is a side effect, not the story. The real signal is the run differential and the healthy rotation behind Tyler Glasnow and Blake Snell — the Dodgers are peaking in September the way championship teams are supposed to. The division crown is a formality; this week matters because of what it says about October.", "analysis_zh": "道奇隊不只是贏球——他們正在以一個華麗的收尾前進。週三以 14-1 擊潰辛辛那提，完成三戰橫掃並將連勝延續到七場，國聯西區的魔術數字降到四。距離洛杉磯摘下 14 年來的第 13 座分區冠軍，只剩下不到一週的勝利。\n\n這場大屠殺再次提醒所有人這支球隊與西區其他隊伍的差距。道奇隊的 +146 得失分差比任何分區競爭對手都高出 100 分以上——這道鴻溝整季都清晰可見，而且隨著十月逼近只會持續擴大。\n\n在分區競爭基本底定的情況下連勝七場，是多數球隊永遠得不到的奢侈。這份領先優勢讓 Dave Roberts 得以讓帶傷的 Ohtani 休息、讓 Freddie Freeman 慢慢從膝傷中恢復，並把 Josue De Paula 等新秀的試鏡機會交出去，卻絲毫不危及戰績。\n\n算術如今變得不費吹灰之力：再贏四場——或者搭配適當的分區對手敗場組合——慶祝就將開始。屆時，全部焦點都將轉向種子序、健康狀況，以及為季後賽打造先發輪值。\n\n分析師觀點：魔術數字只是副產品，不是重點。真正的訊號是得失分差，以及 Tyler Glasnow 與 Blake Snell 背後那支健康的輪值——道奇隊正以冠軍球隊應有的方式在九月達到巔峰。分區冠軍只是形式；這一週的意義在於它對十月說了些什麼。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Tucker's Grand Slam Lifts Dodgers in Miami While Freeman Nurses a Sore Knee", "headline_zh": "Tucker 滿貫砲在邁阿密為道奇隊定調，Freeman 則因膝傷休養", "analysis": "Kyle Tucker finally unloaded. The outfielder launched a grand slam — finishing a double shy of the cycle — in Friday's 6-2 win over the Miami Marlins, the kind of swing the Dodgers acquired him to provide. With Ohtani shelved, Tucker's bat carrying a game is exactly what the lineup needed.\n\nThe timing is not lost on anyone. Tucker has been the subject of season-long scrutiny, and a breakthrough performance in Miami — in the same week Ohtani went on the IL — is precisely the reinforcement a championship roster craves. Blake Snell, meanwhile, delivered another dominant outing in his post-surgery resurgence, giving the rotation yet another reason for confidence.\n\nThe other lingering thread is Freddie Freeman. Held out of Wednesday's lineup with right knee soreness, the Dodgers' leading hitter at .297 was expected back for the Miami series opener Friday. Roberts and the training staff have been cautious all season, and the same approach applies here: September rest is cheap, October health is priceless.\n\nThe lineup puzzle now has moving parts again. Ohtani returns by Sept. 23, Tucker is swinging like himself, and Freeman is being managed carefully — all while the division lead grows. For the first time in weeks, the batting order is starting to look dangerous in October form.\n\nAnalyst take: Tucker's grand slam is one swing, but the signal is real — the contact quality and swing decisions have been trending for weeks. With the division math all but finished, the Dodgers can afford to let the big bats find their rhythm on their own schedule. If Tucker arrives in October hot, opposing pitching staffs will have to pick their poison between him and a healthy Ohtani.", "analysis_zh": "Kyle Tucker 終於爆發了。這位外野手在週五對邁阿密馬林魚的 6-2 勝仗中轟出滿貫砲——距離完全打擊只差一支二壘安打——這是道奇隊交易他來就是要得到的那種揮棒。在 Ohtani 進入傷兵名單之際，Tucker 的球棒挺身而出扛下一場比賽，正是這條打線所需要的。\n\n這個時機點沒有任何人不注意。Tucker 整季都處於嚴密檢視之下，而在 Ohtani 進入傷兵名單的同一週於邁阿密打出突破表現，正是爭冠陣容夢寐以求的補強訊號。與此同時，Blake Snell 在他術後復甦的過程中再次繳出宰制級內容，為先發輪值再添一個信心的理由。\n\n另一條未完的故事線是 Freddie Freeman。他因右膝痠痛在週三被移出先發名單，這支球隊 .297 的打擊王預期會在週五對邁阿密的系列賽首戰歸隊。Roberts 與訓練團隊整季都保持謹慎，同樣的原則在此適用：九月的休息很便宜，十月的健康無價。\n\n打線謎題如今又有了新的變動零件。Ohtani 將於 9 月 23 日前歸隊，Tucker 開始像過去的自己那樣揮棒，Freeman 則被謹慎照料——而分區領先優勢持續擴大。數週以來，這張先發名單第一次開始呈現出十月的危險樣貌。\n\n分析師觀點：Tucker 的滿貫砲只是一次揮棒，但訊號是真實的——擊球品質與揮棒選擇數週來已在回升。在分區算術幾乎底定之際，道奇隊可以放心讓大棒們按照自己的節奏找回手感。如果 Tucker 在十月火熱登場，對手投手群將不得不在他與健康的 Ohtani 之間選擇毒藥。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Glasnow Back and Building Toward October With No Pitch Limit in Sight", "headline_zh": "Glasnow 回歸並瞄準十月，球數限制不存在", "analysis": "Tyler Glasnow is officially back in the October picture. The right-hander was activated from the 60-day injured list on Aug. 26 and made his first start since May 6, when lower back spasms shut him down. Before the injury, Glasnow posted a 2.72 ERA across seven starts — frontline numbers that had been sorely missed.\n\nThe most significant detail is what comes next. Dave Roberts says no pitch limit is expected as Glasnow builds back toward October. That is a statement of trust in a pitcher whose health has historically been the only question about his talent.\n\nGlasnow's return changes the shape of the postseason plan. Pair him with an in-form Blake Snell, and the Dodgers suddenly have a top of the rotation that can match any in the National League. The rotation is rounding into form at precisely the right moment.\n\nThe caveat is the same one that has followed Glasnow his entire career: durability. Seven healthy starts before the shutdown are a small sample, and his comeback start featured a rocky first inning. But the Dodgers have never needed him for a full season — they need him for October.\n\nAnalyst take: this is a depth charge for the entire pitching staff. No pitch limit means Glasnow will be trusted in a playoff spot, and his stuff — when right — is among the best in baseball. The Dodgers built this rotation for October, not for June. That bet is finally being cashed.", "analysis_zh": "Tyler Glasnow 正式回到十月藍圖之中。這位右投於 8 月 26 日從 60 天傷兵名單解除，並做出他自 5 月 6 日因下背痙攣停賽以來的第一場先發。受傷之前，Glasnow 在七場先發中繳出 2.72 ERA——那是一份被球隊深切懷念的先發王牌級成績。\n\n最關鍵的細節在於接下來的事。Dave Roberts 表示，隨著 Glasnow 逐步重建狀態迎向十月，球團不預期設下任何球數限制。這是一份對投手能力的信任聲明——而這位投手健康與否，向來是關於他天賦的唯一疑問。\n\nGlasnow 的回歸改變了季後賽計畫的形狀。將他與狀態正佳的 Blake Snell 並列，道奇隊忽然擁有一組足以匹配國聯任何輪值的前段先發。先發輪值正在最正確的時機逐步成型。\n\n但同樣的警告也一直跟著 Glasnow 的整個生涯：耐久性。停賽前七場健康的先發樣本仍然很小，而他的復出戰第一局並不順遂。但道奇隊從來不需要他扛一整季——他們需要他為十月而投。\n\n分析師觀點：這是整支投手陣容的一記深度重拳。沒有球數限制，意味著 Glasnow 將在季後賽被充分信任，而他的球威——在健康時——是棒球界數一數二的。道奇隊打造這支輪值是為了十月，不是為了六月。這個賭注終於開始兌現。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "No. 14 USC Blanks Fresno State 39-0 Behind a Defense That Forced Two Safeties", "headline_zh": "第 14 名南加大以 39-0 完封 Fresno State，防守組單場逼出兩次安全分", "analysis": "No. 14 USC produced its most dominant defensive performance in years, blanking Fresno State 39-0 for the program's first shutout since 2024. The defense held the Bulldogs to just 116 total yards and recorded two safeties in a single game — a feat no college football team accomplished even once during the entire 2025 season.\n\nThe numbers paint a portrait of total control. USC has now outscored opponents 58-0 in the first half this season, meaning the Trojans have not merely been winning — they have been ending games by halftime. A defense that was an obvious liability last season has become a wall.\n\nThe two safeties are the kind of signature moment that changes how opponents plan. The scheme keeps attacking the line of scrimmage, and the front seven has won almost every rep. When a defense can score without the offense on the field, the margin for error everywhere else grows.\n\nThe context matters: this is a completely different unit than the one that gave fans headaches a year ago. With a full season's worth of structure under defensive coordinator Gary Patterson, the Trojans look like they have found an identity — and a nasty one.\n\nAnalyst take: a September shutout of a Mountain West team proves nothing by itself; the Big Ten's elite offenses are a different animal entirely. But the way this defense is winning — safeties, no first-half points, 116 total yards — shows a unit that dictates terms rather than survives them. That is the profile of a team that can make noise far past September.", "analysis_zh": "第 14 名的南加大繳出多年來最具宰制力的防守表現，以 39-0 完封 Fresno State，寫下 2024 年以來首場完封。防守組只讓 Bulldogs 全場推進 116 碼，並在單場比賽中完成兩次安全分——這是整個 2025 賽季沒有任何一支大學球隊辦到過的壯舉，而他們一次就辦了兩次。\n\n數據描繪出一幅全面掌控的圖像。南加大本季上半場合計以 58-0 碾壓對手，意思是特洛伊人隊不只是贏球——他們在中場休息前就已結束比賽。去年還是明顯防守漏洞的單位，如今已成為一道高牆。\n\n兩次安全分是那種會改變對手作戰計畫的代表性時刻。這個體系持續攻擊啟球線，而前七人組幾乎贏下每一次碰撞。當防守組可以在進攻組不在場上時得分，其他環節的容錯空間就會同步放大。\n\n背景脈絡至關重要：這與一年前讓球迷頭痛的防守單位完全是兩回事。在 defensive coordinator Gary Patterson 的體系完整運行之下，特洛伊人隊看起來找到了身分認同——而且是很兇悍的那種。\n\n分析師觀點：九月完封一支山區西岸聯盟球隊本身說明不了什麼；Big Ten 的頂級進攻是完全不同等級的動物。但這支防守贏球的方式——安全分、上半場零失分、116 總碼數——顯示的是一個主導局勢而非勉強存活的單位。那是能一路喧鬧到九月之後的球隊的樣貌。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "Maiava Completing 88.9 Percent of His Passes With Five TDs and Zero Picks — a Heisman-Caliber Start", "headline_zh": "Maiava 傳球成功率 88.9%、五次達陣、零抄截——海斯曼等級的開季", "analysis": "Jayden Maiava is operating with surgical precision. Through two games, the USC quarterback is completing 88.9 percent of his passes — 48 of 54 — for 635 yards, five touchdowns and zero interceptions. No qualifiers needed: that is a Heisman-caliber start by any standard.\n\nThe efficiency is the headline. Maiava is not chucking deep balls and praying; he is taking what defenses give him, spreading the ball across the field and letting his playmakers work. Zero interceptions through 54 attempts, with the ball in his hands in every crucial situation, is the sign of a quarterback in complete command.\n\nThis is no flash in the pan. Maiava led the Big Ten in passing in 2025 with 3,711 yards and 24 touchdowns, and he is building on that foundation rather than starting from scratch. The leap from productive to elite is exactly what a Heisman run requires.\n\nThe schedule will test every inch of that efficiency. Big Ten defenses accumulate film by the week, and the second-half gauntlet features some of the sharpest secondaries in the country. The question is not whether Maiava regresses — every quarterback does — but whether his decision-making holds when the margin for error shrinks.\n\nAnalyst take: an 88.9 percent completion rate is a September number that will not survive contact with the Big Ten — and it doesn't need to. What matters is the zero interceptions, the pre-snap command and the calm in the pocket. Those are the traits that translate to November and to a Heisman ceremony in New York.", "analysis_zh": "Jayden Maiava 正以外科手術般的精準度運轉進攻。兩場比賽下來，這位南加大 quarterback 傳球成功率 88.9%——54 傳 48 中——累計 635 碼、五次達陣、零抄截。不需要任何但書：無論以什麼標準衡量，這都是一個海斯曼等級的開季。\n\n效率是頭條。Maiava 不是在亂丟深遠球碰運氣；他接受防守給他的東西，把球分散到全場，讓他的進攻武器們去發揮。54 次嘗試零抄截，而且每一次關鍵局面球都握在他手中——這是一位完全掌控局面的 quarterback 的標誌。\n\n這絕非曇花一現。Maiava 在 2025 年以 3,711 碼與 24 次達陣領先 Big Ten 傳球榜，而他是在那個基礎上繼續加蓋，而不是從零開始。從「有效率」躍升到「精英」正是海斯曼之路所要求的。\n\n接下來的賽程將考驗這份效率的每一寸。Big Ten 的防守每週都會累積更多對戰影片，而下半季的嚴酷賽程中不乏全國最犀利的安全衛陣容。問題不在 Maiava 是否會回落——每個 quarterback 都會——而在於當容錯空間縮小時，他的判斷力能否維持。\n\n分析師觀點：88.9% 的成功率是九月的數字，與 Big Ten 強碰之後不會維持——而且也不需要維持。重要的是零抄截、開球前的指揮，以及口袋中的冷靜。這些特質才會一路轉化到十一月，以及紐約的海斯曼頒獎典禮。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "Freshman Trent Mosley Is Already One of College Football's Most Electric Receivers", "headline_zh": "新生 Trent Mosley 已是大學足球最耀眼的接球手之一", "analysis": "The most exciting player on a 2-0 USC roster is not a veteran transfer — it's a true freshman. Trent Mosley has 222 receiving yards and three touchdowns in his first two college games, becoming the first USC freshman with 100-plus receiving yards in back-to-back games since Drake London in 2019.\n\nMosley's production is not beginner's luck. He set Santa Margarita Catholic's career record with 217 receptions, and his transition to the college game has been seamless — a receiver who runs routes like he has been in this offense for years. Jayden Maiava has clearly developed immediate trust in him.\n\nThe recruiting context makes the story bigger. Mosley is the early star of USC's No. 1-ranked 2026 recruiting class — 22 blue-chip prospects including five-star edge rusher Luke Wafle. He is not just a good freshman; he is the proof of concept for the entire class's hype.\n\nDefenses are already taking notice. Opposing coordinators will start rolling coverage his way, and the physical press cornerbacks of the Big Ten represent a steeper challenge than anything he has faced. The true test of a freshman star is not the debut — it's how he responds when the scouting report gets comprehensive.\n\nAnalyst take: Mosley doesn't need volume to matter; he needs to stay dangerous. If his vertical presence keeps stretching safeties, every other receiver and the run game benefits. A freshman this polished, this early, is a luxury USC has not had in years — and the Big Ten gauntlet is about to find out why everyone in LA is buzzing.", "analysis_zh": "這支 2 勝 0 敗南加大陣容中最令人興奮的球員不是老經驗的轉學生——而是一個貨真價實的大一新生。Trent Mosley 在生涯頭兩場大學比賽中就累計 222 接球碼與三次達陣，成為自 2019 年 Drake London 以來，第一位連續兩場接球破百碼的南加大大一新生。\n\nMosley 的產量不是新手運氣。他在 Santa Margarita Catholic 寫下生涯 217 次接球的校史紀錄，而他轉換到大學比賽的過程幾乎無縫——這是一位接球路線跑得像已在此體系多年一樣的接球手。Jayden Maiava 顯然已對他建立立即的信任。\n\n招募背景讓這個故事更大。Mosley 是南加大排名全美第一的 2026 招募班級——包含五星級 edge rusher Luke Wafle 在內的 22 位 blue-chip 潛力新秀——中最早發光的那顆星。他不只是出色的新生；他是整個班級炒作聲浪的概念驗證。\n\n防守組已經注意到他了。對手協調員將開始把防守向他傾斜，而 Big Ten 充滿對抗性的 press cornerback 代表著比他所面對過的一切都更嚴峻的考驗。新生明星的真正考驗不是初登場——而是當對戰報告變得鉅細靡遺時，他如何應對。\n\n分析師觀點：Mosley 不需要大量的接球次數才有價值；他需要維持威脅性。如果他的縱深威脅持續拉開安全衛，其他每一位接球手與地面攻勢都將受益。一個如此早熟、如此完整的新生，是南加大多年來不曾擁有的奢侈——而 Big Ten 的嚴酷賽程即將發現，為何整個洛杉磯都在為他沸騰。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "USC Hosts Louisiana Saturday Night in the Final Tune-Up Before the Big Ten Gauntlet", "headline_zh": "南加大週六晚間迎戰 Louisiana，為 Big Ten 嚴酷考驗完成最後熱身", "analysis": "Saturday night at the Coliseum closes the easy chapter of USC's season. The No. 14 Trojans host Louisiana at 8 p.m. PT on Big Ten Network in the programs' first-ever meeting — the final nonconference tune-up before the Big Ten opener at Rutgers on Sept. 19.\n\nThe betting line says everything: USC is roughly a 30.5-point favorite. This game is about execution, health and development — getting a clean win, meaningful reps for the freshman class, and zero wear and tear before the real season begins.\n\nThe real season is brutal. After Rutgers, the gauntlet arrives: Oregon, Washington, at Penn State, at Wisconsin, vs. Ohio State, at Indiana. Six games that will define whether this is a playoff team or a good story. No September tune-up carries that weight.\n\nFor the coaching staff, the goals are simple: an efficient first half, a big lead by the third quarter, and a healthy roster on the bus ride home. Every risky snap now is a snap stolen from the games that actually matter.\n\nAnalyst take: don't read anything into the score of this game — read everything into how it's won. If USC looks sharp, disciplined and explosive, that is the message to carry into the Big Ten. If the Trojans sleepwalk, a 30.5-point favorite becomes a story about a team that isn't ready for what comes next.", "analysis_zh": "週六晚上的紀念體育場，將為南加大賽季輕鬆的章節畫下句點。第 14 名的特洛伊人隊將於太平洋時間晚間 8 時在 Big Ten Network 迎戰 Louisiana——這是兩校史上首次交手——也是 9 月 19 日 Big Ten 開幕戰對 Rutgers 之前的最後一場非聯盟熱身。\n\n讓分盤說明了一切：南加大是大約 30.5 分的熱門。這場比賽的意義在於執行力、健康與養成——拿下一場乾淨的勝利、讓新生班級獲得有意義的上場時間，並在真正的賽季開始前零耗損。\n\n真正的賽季是殘酷的。Rutgers 之後，嚴酷賽程登場：俄勒岡、華盛頓、客場 Penn State、客場 Wisconsin、對 Ohio State、客場 Indiana。這六場將決定這是一支季後賽球隊，還是只是個好故事。九月沒有任何一場熱身賽扛得起這個重量。\n\n對教練團而言，目標很簡單：有效率的上半場、第三節前的大幅領先，以及一趟帶著健康陣容回家的巴士。現在的每一次冒險攻防，都是從真正重要的比賽中偷來的。\n\n分析師觀點：別從這場比賽的比數中讀出什麼——要從它「如何被贏下」讀出一切。如果南加大打得犀利、紀律嚴明且火力四射，那正是要帶進 Big Ten 的訊息。如果特洛伊人隊夢遊，一支 30.5 分的熱門就會變成「還沒準備好面對接下來一切」的故事。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "Stewart and Anderson Trending Toward Playing Saturday as USC's Freshmen Star", "headline_zh": "Stewart 與 Anderson 傾向週六出賽，南加大新生群持續發光", "analysis": "USC's depth is getting deeper at exactly the right time. Lincoln Riley said Friday that defensive tackle Jahkeem Stewart (foot) and wide receiver Terrell Anderson, the NC State transfer, are both trending toward playing Saturday against Louisiana — reinforcements arriving ahead of the Big Ten stretch.\n\nStewart's return matters most defensively. The depth along the interior was a quiet concern lurking behind the 39-0 shutout; getting a healthy Stewart back gives Gary Patterson more rotation options against the physical run attacks coming up the calendar.\n\nThe receiving room, meanwhile, is turning into a starter's factory. True freshmen Kayden Dixon-Wyatt and Tron Baker have starred alongside Trent Mosley through two games, while tight end Mark Bowman has given Maiava another red-zone target. The youth movement is not just surviving — it's thriving.\n\nThe theme is unmistakable: USC has options everywhere. Veterans provide the floor, and this freshman class provides the ceiling. Every snap against Louisiana is another chance for that young group to bank confidence before the schedule turns hostile.\n\nAnalyst take: the injury updates are February-level depth planning — but the freshman receiver story is the real headline. Dixon-Wyatt, Baker and Bowman succeeding in September means Big Ten defenses have three more players to account for in October. That is how a 2-0 team turns into a contender.", "analysis_zh": "南加大的陣容深度正在最正確的時機變得更深。Lincoln Riley 週五表示，defensive tackle Jahkeem Stewart（腳傷）與來自 NC State 的轉學生 wide receiver Terrell Anderson 都傾向在週六對 Louisiana 之戰上場——這是 Big Ten 征途前的補強。\n\nStewart 的回歸在防守面上意義最大。內側防線的深度是 39-0 完封背後一個悄悄引人擔憂的問題；迎回健康的 Stewart，讓 Gary Patterson 在接下來面對講究身體對抗的路面攻勢時有更多輪替選項。\n\n與此同時，接球群正在變成新星生產線。大一新生 Kayden Dixon-Wyatt 與 Tron Baker 在頭兩場比賽中與 Trent Mosley 一同大放異彩，而 tight end Mark Bowman 為 Maiava 提供了另一個紅區目標。青年浪潮不只是存活——而是在茁壯。\n\n主題再清楚不過：南加大處處都有選項。老將們撐起地板，而這屆新生提供天花板。對 Louisiana 的每一次攻防，都是這群年輕人在賽程轉向敵意之前儲存信心的另一次機會。\n\n分析師觀點：傷病新聞是二月等級的深度佈局——但新生接球手的故事才是真正的頭條。Dixon-Wyatt、Baker 與 Bowman 在九月的成功，意味著 Big Ten 的防守在十月將多三個需要盯防的人。這就是一支 2 勝 0 敗的球隊如何升級為爭冠者的過程。"}, {"team": "Rams", "accent": "#003594", "headline": "Rams Stumble in NFL's First-Ever Australian Game, Falling 27-7 to the 49ers", "headline_zh": "公羊隊在 NFL 史上首場澳洲例行賽絆倒，以 27-7 敗給 49 人隊", "analysis": "The NFL made history in Australia, and the Rams made an unhappy footnote. Los Angeles fell 27-7 to the San Francisco 49ers at the Melbourne Cricket Ground in the league's first-ever regular-season game in Australia, played before more than 100,000 fans. The Rams never found the game — Matthew Stafford said the offense produced just 'two good drives.'\n\nThe stat sheet tells the tale. The Rams' lone touchdown came on a drive set up by a 41-yard Puka Nacua catch, the only true explosive play the offense managed all night. Two good drives against a divisional rival is not a rhythm — it's a malfunction.\n\nStafford's assessment was blunt and honest: the team never got into a rhythm. No excuses about the unprecedented stage or the travel — just a quarterback acknowledging his offense was out of sync from the first snap.\n\nSean McVay, Myles Garrett and Kobie Turner all delivered sober postgame takeaways from the same podium, and the theme was consistent: disjointed, disconnected, not good enough. For a team that spent the offseason assembling a star-studded roster and embracing the label of favorite, the Melbourne opener was a reality check delivered in the most public way possible.\n\nAnalyst take: one game does not erase a roster built to contend, but a 20-point loss to a divisional rival in the most publicized game of the weekend does set a tone. The Rams get a Monday Night Football rebound chance against the Giants in Week 2. If the 'two good drives' version of this offense shows up again, the Super Bowl narrative starts to look extremely fragile.", "analysis_zh": "NFL 在澳洲寫下歷史，而公羊隊留下了不愉快的註腳。洛杉磯在墨爾本板球場以 27-7 敗給舊金山 49 人隊——這是 NFL 史上第一場在澳洲舉行的例行賽，超過 100,000 名球迷進場目睹。公羊隊始終未能進入狀態——Matthew Stafford 表示進攻組全場只打出「兩次好的攻勢」。\n\n數據單說明了一切。公羊隊唯一的達陣來自一次由 Puka Nacua 41 碼接球鋪路的攻勢，那是進攻組整晚唯一的真正爆發性表現。對一支分區宿敵只打出兩次好的攻勢，那不叫節奏——那叫故障。\n\nStafford 的評價直白而誠實：這支球隊從未進入節奏。沒有任何關於史無前例舞台或旅程的藉口——只有一位承認自家進攻從第一波攻勢就失序的 quarterback。\n\nSean McVay、Myles Garrett 與 Kobie Turner 都在同一個講台上發表了清醒的賽後談話，主題一致：渙散、斷線、不夠好。對於一支整個休賽季都在組裝球星陣容、擁抱「熱門」標籤的球隊而言，墨爾本開幕戰是一記以最公開方式送達的現實檢驗。\n\n分析師觀點：一場比賽不會抹去一支為爭冠打造的陣容，但以 20 分敗給分區宿敵——還是在整個週末最受矚目的比賽中——確實定下了基調。公羊隊在第二週的週一晚間足球賽對巨人隊獲得反彈機會。如果「兩次好的攻勢」版本的進攻再次出現，超級盃敘事將開始顯得脆弱不堪。"}, {"team": "Rams", "accent": "#003594", "headline": "The Star-Studded Offense Sputters as McVay, Stafford and Co. Offer Sober Takeaways", "headline_zh": "豪華進攻組熄火，McVay、Stafford 等人坦承失落", "analysis": "The star-studded offense the Rams bragged about all summer never left the hangar in Melbourne. Reigning MVP Matthew Stafford and the group never found rhythm, and the sober postgame takeaways from Sean McVay, Stafford, Myles Garrett and Kobie Turner all landed on the same theme: disjointed, disconnected, unacceptable.\n\nThe contrast makes it worse. The Rams went 3-0 in the preseason, outscoring opponents 74-30, with the offense humming and the defense flying around. That look proved to be an illusion — the regular season started, and the timing, the communication and the energy all vanished.\n\nWhat makes this concerning is who was on the field. This is not a group of newcomers playing together for the first time; it's the reigning MVP, one of the league's best receivers, and a defensive front built around game-wreckers. A roster this decorated shouldn't look this disconnected in Week 1.\n\nThe 49ers deserve credit — they dictated terms and played a cleaner game. But the takeaways from the Rams' podium were internal: the problems were self-inflicted more than imposed.\n\nAnalyst take: McVay's message was accountability, and that's correct — but accountability has a shelf life. The Rams get arguably the most forgiving Week 2 landing spot in the NFL in the Giants at home on Monday Night Football. Fix the rhythm there, and Melbourne becomes a footnote. Struggle again, and the 'Super Bowl or bust' framing starts cracking in September.", "analysis_zh": "公羊隊整個夏天吹捧的豪華進攻組，在墨爾本從未飛出機棚。衛冕 MVP Matthew Stafford 與進攻群始終沒能找到節奏，而 Sean McVay、Stafford、Myles Garrett 與 Kobie Turner 賽後的清醒總結全都落在同一個主題上：渙散、斷線、無法接受。\n\n對比讓一切更難堪。公羊隊季前賽 3 勝 0 敗、以 74-30 碾壓對手，進攻流暢、防守四處飛奔。那個樣貌被證明是幻覺——例行賽一開始，節奏、溝通與能量全部消失。\n\n真正令人擔憂的是場上那些人。這不是一群替補首次同場作戰；這是衛冕 MVP、聯盟頂級接球手之一，以及圍繞多位破壞型球星打造的防守鋒線。一支如此星光熠熠的陣容，不該在第一週看起來如此脫節。\n\n49 人隊值得肯定——他們主導了節奏，打了一場更乾淨的比賽。但公羊隊講台上的總結都是內省的：問題多數是自己造成的，而非被對手施加的。\n\n分析師觀點：McVay 的訊息是承擔責任，這很正確——但承擔責任也有保存期限。公羊隊在第二週擁有 NFL 中最寬鬆的反彈點之一：主場週一晚間足球賽對巨人隊。在那裡修好節奏，墨爾本就成了註腳。再跌一次，「超級盃否則一無所有」的框架就會在九月開始龜裂。"}, {"team": "Rams", "accent": "#003594", "headline": "Myles Garrett Named No. 1 on NFL Top 100 — Now the Rams Need Him Healthy", "headline_zh": "Myles Garrett 榮登 NFL Top 100 榜首——現在公羊隊需要他保持健康", "analysis": "Myles Garrett owns the No. 1 spot on the NFL Top 100 Players of 2026 — and the Rams need the version of him that earned it. The reigning Defensive Player of the Year, who set the single-season sack record with 23 sacks and 33 tackles for loss before being traded from Cleveland in June, was active for the Melbourne opener after returning to practice following weeks of nursing a left knee problem.\n\nThe knee is the story within the story. Garrett made it back to drills for the first time in weeks ahead of the opener, and the Rams still deemed him healthy enough to play. But the assessment rests on a single question: how much of the record-setting Garrett was actually out there?\n\nThe Rams' bet is enormous. Los Angeles swung the June trade to land Garrett, then bet big on building the defensive front of its dreams around him and the returning Aaron Donald. The entire defensive identity rests on that pairing producing.\n\nThe stat line from the opener will satisfy no one in that building. But Garrett's presence alone changes how the 49ers — and every future opponent — plan their protections. The gravity is real even when the numbers aren't.\n\nAnalyst take: the Top 100 honor validates the trade; the knee validates the caution. Garrett can't be the No. 1 player in football from the sideline, and the Rams know it. The smart play is managing his workload through September so the record-setting Garrett is the one terrorizing quarterbacks in January.", "analysis_zh": "Myles Garrett 榮登 2026 年 NFL Top 100 球員榜首——而公羊隊需要的是那個配得上這份榮譽的他。這位衛冕年度最佳防守球員在六月從克里夫蘭被交易而來，曾以 23 次擒殺、33 次擒抱後損失創下單季擒殺紀錄，他在療養數週左膝問題後恢復練習，並於墨爾本開幕戰上陣。\n\n膝蓋是故事中的故事。Garrett 在開幕戰前「數週以來」首次回到訓練場，而公羊隊仍判定他健康到足以出賽。但評估繫於一個關鍵問題：場上那個他，到底還剩下多少創紀錄時期的 Garrett？\n\n公羊隊的賭注巨大。洛杉磯完成六月的交易迎來 Garrett，然後在他與回歸的 Aaron Donald 周圍豪賭打造夢幻防守鋒線。整個防守的身分認同都繫於這對組合能否產出表現。\n\n開幕戰的數據單不會讓那座建築裡的任何人滿意。但光是 Garrett 的存在，就改變了 49 人隊——以及未來每一位對手——規劃保護網的方式。即使數字難看，引力依然真實。\n\n分析師觀點：Top 100 的榮譽肯定了這筆交易；膝蓋則肯定瞭謹慎的必要。Garrett 無法從場邊扮演足球界第一人，公羊隊很清楚。明智之舉是讓他在九月控制工作量，這樣一月去騷擾對位 quarterback 的，才會是創紀錄的那個 Garrett。"}, {"team": "Rams", "accent": "#003594", "headline": "Aaron Donald's Ramp Continues: OUT for Melbourne, Expected Back in Some Capacity vs. Giants", "headline_zh": "Aaron Donald 漸進式回歸持續：墨爾本缺陣，預期對巨人隊以某種形式回歸", "analysis": "Aaron Donald is back in a Rams uniform, but his 2026 debut will have to wait. The three-time Defensive Player of the Year — who ended a two-and-a-half-year retirement on Aug. 30 by signing a one-year deal worth $20 million guaranteed, up to $30 million with incentives — was ruled out for the Melbourne opener as part of the team's ramp plan.\n\nThis is not an injury concern; it's a plan. The Rams are not paying $20 million for a Week 1 curiosity — they're paying for a playoff weapon. Every snap Donald takes in September is a snap they'd rather save for October and beyond.\n\nDonald is expected back in some capacity for Week 2's Monday Night Football matchup against the Giants. The 'some capacity' is the operative phrase — the ramp is deliberate, and the Rams have said they will not rush a player of his age and history.\n\nThe pairing with Garrett remains the most feared potential front in football. But potential is not production, and with Garrett still managing his own knee, the two have yet to truly share a field.\n\nAnalyst take: Donald's return is the Rams' biggest bet of 2026, and the ramp is the right way to place it. September is for ramping; October and January are for dominating. If the Rams can get both aging superstars healthy at the same time, this defense's ceiling is the highest in the league.", "analysis_zh": "Aaron Donald 已回到公羊隊制服之中，但他的 2026 年初登場還得再等等。這位三屆年度最佳防守球員——於 8 月 30 日結束兩年半的退休生活，簽下一份 2000 萬美元保障、含激勵條款最高 3000 萬美元的一年合約——作為球隊漸進式回歸計畫的一部分，在墨爾本開幕戰確定缺陣。\n\n這不是傷病疑慮；這是一套計畫。公羊隊不是花 2000 萬美元買一個第一週的展品——他們買的是一枚季後賽武器。Donald 在九月每打一次攻防，都是他們寧可留到十月之後的攻防。\n\nDonald 預期將以某種形式回歸第二週對巨人隊的週一晚間足球賽。「某種形式」是關鍵詞——漸進式回歸是刻意設計的，而公羊隊已表明不會催促一位他這個年紀與資歷的球員。\n\n與 Garrett 的組合仍然是足球界最令人畏懼的潛在防守鋒線。但潛力不是產量，而且在 Garrett 仍要管理自己膝傷的情況下，兩人尚未真正並肩作戰過。\n\n分析師觀點：Donald 的回歸是公羊隊 2026 年最大的賭注，而漸進式回歸是下注的正確方式。九月是用來熱身的；十月與一月是用來宰制的。如果公羊隊能讓兩位年長超級巨星同時恢復健康，這支防守的天花板將是全聯盟最高。"}, {"team": "Rams", "accent": "#003594", "headline": "Puka Nacua Opens Up About Alcohol Struggles as the Rams Embrace the Villain Role", "headline_zh": "Puka Nacua 坦承酒精困境，公羊隊擁抱反派角色", "analysis": "Puka Nacua spent the week before the season opener being raw with the world. In a pre-taped Netflix interview, the All-Pro receiver opened up about his alcohol struggles and his offseason rehab, describing alcohol as a way to escape the stress tied to his stardom and the birth of his son. An assault lawsuit stemming from a New Year's Eve incident remains pending.\n\nThe context around this Rams season is bigger than football — and the franchise knows it. Nacua's honesty arrived as the team leaned fully into its villain narrative: safety Quentin Lake compared the Rams to the Dodgers and said 'these other teams probably hate us,' in a season where anything short of a Lombardi Trophy is considered a failure.\n\nThe Melbourne loss sharpens that framing. A villain is only a villain when it wins; a heavily hyped team that opens 0-1 by 20 points draws very different adjectives. Nacua's 41-yard catch set up the Rams' lone touchdown — evidence that when he's right, he changes games.\n\nSupport matters as much as sacks here. The Rams' season — on and off the field — is being played at maximum volume, and Nacua's willingness to address his struggles publicly is a reminder that the names in the box score are people first.\n\nAnalyst take: the villain role is a fun storyline until you lose to the 49ers in front of 100,000 people — then it becomes a target on your back. Nacua's off-field courage is real and worth applauding. The on-field version of the Rams needs to back it up, because the 'they probably hate us' energy only works when the scoreboard works too.", "analysis_zh": "Puka Nacua 在開幕戰前的一週，選擇對這個世界毫無保留。在一段預先錄製的 Netflix 訪談中，這位全明星接球手談到了他的酒精問題與休賽季的康復治療，形容酒精是他逃避球星身分與兒子出生所帶來壓力的方式。一起源自跨年夜事件的人身攻擊訴訟仍在進行中。\n\n這個賽季的公羊隊，脈絡遠比足球本身更巨大——而球團很清楚。Nacua 的坦誠來得正是時候：球隊全面投入反派敘事——safety Quentin Lake 將公羊隊比作道奇隊，並說「這些其他球隊大概恨我們」，而在這個賽季裡，任何低於隆巴迪獎盃的結果都被視為失敗。\n\n墨爾本的失利讓這個框架更尖銳。反派只有在贏球時才叫反派；一支受盡吹捧的球隊以 20 分之差吞下開季 0 勝 1 敗，會得到完全不同的形容詞。Nacua 的 41 碼接球為公羊隊唯一的達陣鋪路——這證明當他狀態正常時，他能改變比賽。\n\n在這裡，支持與擒殺同樣重要。公羊隊的賽季——無論場上場下——都以最大音量進行著，而 Nacua 願意公開面對自己的困境，提醒所有人：記分板上的名字，首先是活生生的人。\n\n分析師觀點：反派角色在你在 100,000 人面前輸給 49 人隊之前都是有趣的故事線——之後它就變成背上的靶心。Nacua 場下的勇氣是真實的、值得喝采。場上版本的公羊隊需要用表現回應這份勇氣，因為「他們大概恨我們」的能量，只有在記分板也站在你這邊時才起作用。"}], "closing": "One franchise is coasting into October, one is auditioning for the Big Ten, and one just got humbled on the biggest stage football has ever built in Australia. The Dodgers' magic number is four, USC's real season begins Saturday night in what should be a tune-up against Louisiana, and the Rams get a Monday Night Football mulligan against the Giants. Buckle up — September is only getting louder.", "closing_zh": "一支球隊正輕鬆駛向十月，一支球隊正為 Big Ten 試演，還有一支剛在澳洲這座足球史上最大舞台上被狠狠上了一課。道奇隊的魔術數字是四，南加大真正的賽季從週六晚間迎戰 Louisiana 的熱身賽開始，而公羊隊將在週一晚間足球賽對巨人隊獲得一次重來的機會。繫好安全帶——九月只會越來越喧囂。"};
let lang = "en";
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmtPT(iso){ return new Date(iso).toLocaleString("en-US",{timeZone:"America/Los_Angeles",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"})+" PT"; }

function renderDigest(d){
  const box = document.getElementById("digest");
  if(!d || !d.segments){
    box.innerHTML = '<div style="text-align:center;color:var(--dim);padding:40px">No digest yet</div>';
    return;
  }
  const segs = d.segments.map(s=>{
    const headline = lang==="en" ? s.headline : s.headline_zh;
    const analysis = lang==="en" ? s.analysis : s.analysis_zh;
    return '<div class="seg" style="--team:'+esc(s.accent)+'">' +
      '<div class="row"><span class="hn">'+esc(headline)+'</span><span class="badge">'+esc(s.team)+'</span></div>' +
      '<div class="lbl">'+(lang==="en"?"Analysis":"分析")+'</div><p>'+esc(analysis)+'</p>' +
      '</div>';
  }).join("");
  box.innerHTML =
    '<div class="dhead">' +
      '<div class="t"><div class="mic">🎙️</div><div><h2>'+esc(d.title)+'</h2><div class="meta">' +
        esc(d.read_time || "")+' · '+fmtPT(d.updated_at)+
        ' · 繁中/EN</div></div></div>' +
      '<div class="langs">'+
        '<button id="btnEn" class="on" onclick="setLang(\'en\')">EN</button>'+
        '<button id="btnZh" onclick="setLang(\'zh\')">繁體中文</button>'+
      '</div>' +
    '</div>' +
    '<div class="intro">'+esc(lang==="en"?d.intro:d.intro_zh)+'</div>' +
    '<div class="segs">'+segs+'</div>' +
    '<div class="closing">'+esc(lang==="en"?d.closing:d.closing_zh)+'</div>';
}
function setLang(v){ lang = v; document.getElementById("btnEn").classList.toggle("on", v==="en"); document.getElementById("btnZh").classList.toggle("on", v==="zh"); renderDigest(DIGEST_DATA); }

function renderNews(d){ const upd = document.getElementById("upd"); if(upd) upd.textContent = fmtPT(d.updated_at);
  const g = document.getElementById("grid"); g.innerHTML = "";
  for(const t of d.teams){
    const c = document.createElement("div"); c.className = "card"; c.style.setProperty("--team", t.accent);
    const emoji = t.emoji==="Baseball"?"⚾":t.emoji==="Football"?"🏈":"🏆";
    c.innerHTML =
      '<div class="top"><div class="ico">' + emoji + '</div>' +
      '<div><div class="name">' + esc(t.name) + '</div><div class="rec">' + t.sport + ' · ' + esc(t.record) + '</div></div></div>' +
      '<div class="hline">' + esc(t.headline) + '</div>' +
      '<h3>Latest News</h3><ul class="news">' + t.latest_news.map(n =>
        '<li><a target="_blank" rel="noopener" href="' + esc(n.url) + '">' + esc(n.title) + '</a><p>' + esc(n.summary) + '</p></li>'
      ).join("") + '</ul>' +
      '<h3>Fun Facts</h3><ul class="facts">' + t.fun_facts.map(f => '<li>'+esc(f)+'</li>').join("") + '</ul>' +
      '<h3>Further Reading</h3><ul class="read">' + t.further_reading.map(f =>
        '<li><a target="_blank" rel="noopener" href="' + esc(f.url) + '"><span>'+esc(f.title)+'</span><span class="why">'+esc(f.why)+'</span></a></li>'
      ).join("") + '</ul>' +
      '<div class="oss">' + esc(t.one_sentence) + '</div>';
    g.appendChild(c);
  }
}

renderDigest(DIGEST_DATA);
renderNews(TEAMS_DATA);
</script>
