<style>
  :root{
    --bg:#0b0e14; --panel:rgba(255,255,255,.04); --panel2:rgba(255,255,255,.02);
    --line:rgba(255,255,255,.08); --fg:#edf2fa; --dim:#8a94a6;
    --radius:18px; --glow:0 0 0 1px rgba(255,255,255,.04), 0 24px 60px -30px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 500px at 20% -10%, rgba(42,111,216,.18), transparent 60%),
      radial-gradient(1000px 500px at 90% -10%, rgba(153,0,0,.14), transparent 60%),
      radial-gradient(900px 400px at 50% 110%, rgba(31,78,156,.16), transparent 60%),
      var(--bg);
    color:var(--fg); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
    padding:28px clamp(16px,4vw,64px) 64px;
  }
  header{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:26px}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{
    width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;
    background:linear-gradient(135deg,#2a6fd8,#991111);box-shadow:0 8px 30px -8px rgba(60,90,220,.6);
  }
  h1{font-size:clamp(22px,3vw,32px);font-weight:800;letter-spacing:-.02em}
  .sub{color:var(--dim);font-size:13px;margin-top:4px}
  .ticker{
    font-size:12px;color:var(--dim);padding:8px 14px;border-radius:99px;
    background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);
  }
  .ticker b{color:#7ce38b}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:20px}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;backdrop-filter:blur(14px);box-shadow:var(--glow);position:relative;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--team,#2a6fd8),transparent);
  }
  .top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .ico{
    width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;
    background:color-mix(in srgb,var(--team) 22%, transparent);
  }
  .name{font-size:18px;font-weight:800;letter-spacing:-.01em}
  .rec{font-size:11px;color:var(--team);font-weight:700;margin-top:2px}
  .hline{font-size:13px;line-height:1.5;color:var(--dim);padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);margin-bottom:16px}
  h3{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
  h3::after{content:"";flex:1;height:1px;background:var(--line)}
  .news{list-style:none}
  .news li{padding:10px 12px;border-radius:12px;margin-bottom:6px;background:var(--panel2);border:1px solid var(--line);transition:.2s}
  .news li:hover{border-color:color-mix(in srgb,var(--team) 50%, transparent);transform:translateX(3px)}
  .news a{color:var(--fg);text-decoration:none;font-weight:700;font-size:13px;display:block;margin-bottom:4px}
  .news a:hover{color:var(--team)}
  .news p{font-size:12px;color:var(--dim);line-height:1.5}
  .facts{list-style:none;display:grid;gap:6px}
  .facts li{position:relative;padding:2px 0 2px 18px;font-size:12.5px;color:var(--fg);line-height:1.55}
  .facts li::before{content:"⚡";position:absolute;left:0;top:2px;font-size:11px;filter:grayscale(.4)}
  .read{list-style:none;display:grid;gap:6px}
  .read a{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12.5px;color:var(--fg);text-decoration:none;padding:9px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
  .read a:hover{color:var(--team);border-color:color-mix(in srgb,var(--team) 50%, transparent)}
  .read .why{font-size:11px;color:var(--dim)}
  .oss{font-size:12.5px;line-height:1.6;color:var(--fg);background:linear-gradient(90deg,color-mix(in srgb,var(--team) 18%,transparent),transparent);border-left:3px solid var(--team);padding:10px 14px;border-radius:0 12px 12px 0;margin-top:16px}
  banner{display:block;text-align:center;color:var(--dim);font-size:13px;margin-top:22px}
  banner span{color:#7ce38b;animation:blink 1.5s infinite}
  @keyframes blink{50%{opacity:.3}}
  .spin{width:100%;height:100px;display:grid;place-items:center;color:var(--dim)}
  /* ---- digest ---- */
  .digest{
    background:linear-gradient(135deg,rgba(42,111,216,.12),rgba(153,0,0,.10),rgba(31,78,156,.12)),var(--panel);
    border:1px solid var(--line);border-radius:var(--radius);padding:26px;
    backdrop-filter:blur(14px);box-shadow:var(--glow);margin-bottom:22px;
  }
  .dhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;margin-bottom:14px}
  .dhead .t{display:flex;align-items:center;gap:12px}
  .mic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:linear-gradient(135deg,#2a6fd8,#991111)}
  .dhead h2{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .dhead .meta{color:var(--dim);font-size:12px;margin-top:3px}
  .langs{display:flex;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:4px}
  .langs button{border:0;background:transparent;color:var(--dim);font-size:12px;font-weight:700;padding:6px 16px;border-radius:99px;cursor:pointer;transition:.2s}
  .langs button.on{background:linear-gradient(135deg,#2a6fd8,#1f4e9c);color:#fff}
  .intro{font-size:14px;line-height:1.65;color:var(--fg);max-width:820px;margin-bottom:18px}
  .segs{display:grid;gap:12px}
  .seg{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--panel2)}
  .seg .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .seg .row .hn{font-weight:800;font-size:14.5px}
  .seg .badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--team,#2a6fd8) 20%,transparent);color:var(--team);white-space:nowrap}
  .seg p{font-size:12.5px;line-height:1.6;color:var(--dim);margin-top:6px}
  .seg p.cls{color:var(--fg)}
  .seg .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin-top:10px;font-weight:700}
  .closing{font-size:14px;line-height:1.6;border-top:1px dashed var(--line);margin-top:16px;padding-top:14px;color:var(--fg)}
</style>

ener vs. Oregon on Sept. 26, plus Washington, Ohio State on Halloween and the Maryland finale on Nov. 21.", "url": "https://www.lacoliseum.com/usc-football"}, {"title": "Lincoln Riley - Head Football Coach - USC Athletics", "why": "Riley's profile and career record as he enters his fifth USC season under a playoff-or-bust mandate.", "url": "https://usctrojans.com/sports/football/roster/coaches/lincoln-riley/7394"}, {"title": "USC Trojans - CBS Sports Team Page", "why": "Live schedule, standings, stats and highlights; USC sits 2-0 with the nation's No. 3 passing offense.", "url": "https://www.cbssports.com/college-football/teams/USC/usc-trojans"}, {"title": "USC Trojans 2026 Season Preview", "why": "Deep dive on Maiava, Gary Patterson's 4-2-5, and Riley's deepest roster meeting a playoff-or-bust mandate.", "url": "https://www.nfldraftbuzz.com/Colleges/FBS/BIG-TEN-FBS/usc-trojans/preview"}, {"title": "Trojans Wire - USC News, Scores and Stats", "why": "Daily Trojans coverage including coaching, recruiting and Big Ten analysis.", "url": "https://trojanswire.usatoday.com/"}], "one_sentence": "No. 14 USC (2-0) is rolling behind Heisman candidate Jayden Maiava and a Gary Patterson-led defense fresh off a 39-0 shutout, closing nonconference play against Louisiana on Sept. 12 before a brutal Big Ten stretch."}, {"name": "Rams", "sport": "NFL", "emoji": "🏈", "accent": "#003594", "record": "0-1", "headline": "Super Bowl favorites humbled: Rams fall 27-7 to 49ers in NFL's first Australia game", "latest_news": [{"title": "Rams fall to 49ers 27-7 in Week 1 at Melbourne Cricket Ground", "summary": "The Rams were dominated in the NFL's first regular-season game in Australia. Matthew Stafford threw no touchdowns and was intercepted, while the offense managed just one scoring drive — a Kyren Williams 5-yard TD set up by a 41-yard Puka Nacua catch. Quentin Lake's interception was a bright spot, but the defense couldn't get off the field as San Francisco controlled time of possession 33:50 to 26:10.", "url": "https://www.therams.com/news/game-recap-rams-fall-to-49ers-27-7-in-week-1-in-australia"}, {"title": "Myles Garrett silent in Rams debut, reveals he's not 100%", "summary": "Star defensive end Myles Garrett failed to record a single stat in his Rams debut — no tackles, no pressures, no sacks. It was the first time since 2018 he was held without a pressure. Garrett admitted he's still dealing with pain from a knee issue sustained in training camp: 'This was the worst version of myself that I've put out there.'", "url": "https://bleacherreport.com/articles/25498222-myles-garrett-gives-honest-quote-after-rough-rams-debut-talks-knee-injury"}, {"title": "McVay defends travel plans after criticism", "summary": "Sean McVay arrived in Melbourne just 28 hours before kickoff vs. the 49ers' week-long acclimation. Despite the lopsided loss, McVay refused to blame the travel itinerary: 'Sometimes sports can humble you, and today was one of those days. I make no excuses.' He called the loss 'humbling' and took full responsibility for the team's flat performance.", "url": "https://www.newsweek.com/sports/nfl/sean-mcvay-sets-record-straight-on-travel-excuse-in-rams-humbling-loss-12428650"}, {"title": "Aaron Donald did not travel to Melbourne", "summary": "The unretired defensive legend was ruled out for Week 1 as the team continues easing him back after his August 30 return from a 2.5-year retirement. Donald signed a one-year, $20M deal worth up to $30M with incentives. He's expected to be available for Week 2 against the Giants.", "url": "https://www.therams.com/news/aaron-donald-unretires-will-play-for-rams-in-2026"}, {"title": "Stafford, Nacua, and Adams sputter in opener", "summary": "Reigning MVP Matthew Stafford was 4-for-11 for 65 yards in the first half and finished with zero touchdowns. Star-studded receivers Puka Nacua and Davante Adams were largely neutralized. McVay and Stafford both cited communication breakdowns on offense as a key factor.", "url": "https://www.latimes.com/sports/rams/story/2026-09-10/star-studded-rams-humbled-by-brock-purdy-49ers-in-opener"}, {"title": "Stafford sneak stopped at the 1 — 49ers answer with 99-yard TD drive", "summary": "Down 17-7 late in the third quarter, the Rams drove to the 49ers' 1-yard line but Stafford's QB sneak was stuffed on 4th down. San Francisco then marched 99 yards in 11 plays, capped by a Deebo Samuel 15-yard TD, effectively putting the game away at 24-7.", "url": "https://si.com/nfl/rams/onsi/rams-49ers-week-1-loss-matthew-stafford"}], "fun_facts": ["This was the first NFL regular-season game ever played in Australia — 100,021 fans packed the Melbourne Cricket Ground.", "Matthew Stafford won the 2025 NFL MVP in the closest vote since 2003, edging Drake Maye by just one first-place vote (366 to 361 points).", "Aaron Donald unretired on August 30 after 2.5 years away, signing a deal that could be worth up to $30M with playoff incentives.", "Myles Garrett was traded from Cleveland in June on a 5-year deal worth ~$290M — making him the highest-paid defensive player in NFL history.", "The Rams entered Week 1 as Super Bowl favorites with a roster featuring Stafford, Nacua, Adams, Garrett, Donald, McDuffie, Williams, and Corum."], "further_reading": [{"title": "McVay press conference: 'I didn't coach good enough'", "why": "Full postgame video and transcript of McVay's candid assessment of the Australia debacle", "url": "https://www.foxsports.com.au/nfl/nfl-2026-sean-mcvay-press-conference-after-los-angeles-rams-loss-to-san-francisco-49ers-melbourne-travel-plans-latest-news/news-story/3c66800837da8774360372dbd9f2983f"}, {"title": "Myles Garrett injury timeline and camp report", "why": "Detailed breakdown of Garrett's knee issues throughout training camp and what Week 1 absence means going forward", "url": "https://heavy.com/sports/nfl/los-angeles-rams/rams-myles-garrett-injury-update-49ers/"}, {"title": "Stafford wins 2025 AP NFL MVP", "why": "Full coverage of Stafford's MVP-winning season and the historic closest vote", "url": "https://www.nfl.com/news/matthew-stafford-rams-qb-most-valuable-player-2025"}, {"title": "Aaron Donald's return from retirement", "why": "Inside the journey that brought Donald back to the Rams after 2.5 years away", "url": "https://www.therams.com/news/aaron-donald-talks-rejoining-rams-in-2026-do-i-feel-like-i-can-play-at-a-high-level-yes"}, {"title": "ESPN analysis: Rams' Week 1 failures", "why": "Expert breakdown of what went wrong in all three phases for the star-studded roster", "url": "https://www.si.com/nfl/rams/onsi/rams-49ers-week-1-loss-matthew-stafford"}], "one_sentence": "The Rams' 'super team' era got off to a disastrous start with a 27-7 loss to the 49ers in Australia, and now all eyes turn to whether McVay, Stafford, Garrett, and Donald can fix it before Week 2 vs. the Giants on Monday Night Football."}]};
const DIGEST_DATA = {"updated_at": "2026-09-11T06:00:21-07:00", "title": "LA Sports Daily Digest — 15-Minute Edition", "read_time": "~15 minutes", "intro": "Three franchises, three very different Septembers. The Dodgers are stacking wins — 86-57, a nine-and-a-half-game NL West cushion, and a rotation finally rounding into form — even with Shohei Ohtani nursing bicep and neck trouble. No. 14 USC is demolishing opponents, outscoring them 81-26, with Jayden Maiava building real Heisman buzz and a freshman named Trent Mosley breaking out. And the Rams are licking their wounds after the most humbling night of the McVay era: a 27-7 flop in front of 100,021 fans in Melbourne. Here is everything you need to know today.", "intro_zh": "三支球隊，三種截然不同的九月。道奇隊持續累積勝利——86 勝 57 敗、國聯西區領先 9.5 場，先發輪值終於步入正軌——儘管 Shohei Ohtani 正與肱二頭肌和頸部傷勢搏鬥。第 14 名的南加大以 81-26 碾壓對手，Jayden Maiava 累積真正的海斯曼獎聲勢，新生 Trent Mosley 則嶄露頭角。公羊隊則在 McVay 時代最難堪的一夜後舔舐傷口：在墨爾本 100,021 名球迷面前以 27-7 潰敗。以下是您今天需要知道的一切。", "segments": [{"team": "Dodgers", "accent": "#2A6FD8", "headline": "Betts' Back-to-Back Late-Inning Homers Complete Sweep as Dodgers Tighten Grip on NL West", "headline_zh": "Betts 背靠背關鍵開轟完成橫掃，道奇隊緊握國聯西區龍頭", "analysis": "Trailing 5-4 with two outs in the eighth inning, Mookie Betts didn't just hit a home run — he hit the kind that defines Septembers. Betts crushed a 90-mph fastball into the left-field pavilion for his 18th homer, a three-run blast that flipped a one-run deficit into a 7-5 lead and completed a three-game sweep of the Washington Nationals.\n\nWhat makes the shot remarkable is that it wasn't an isolated moment. It was Betts' second consecutive night with a go-ahead three-run homer — a back-to-back feat he had never pulled off in his career. Two nights, two swings, two rallies, all with the game on the line. That is exactly the trait that separates a good team from a team built for October.\n\nThe sweep keeps piling up the numbers. The Dodgers improved to 86-57 — nine and a half games clear of Arizona in the NL West, a full game ahead of Atlanta for the National League's No. 2 seed, and a game and a half behind Milwaukee for the best record in baseball. Their +149 run differential leads the NL, and with the magic number dropping by the night, the Dodgers are playing October-caliber baseball in September.\n\nThe most striking part: they did it without Shohei Ohtani in the lineup, going a perfect 6-0 against Washington this season. Betts, Tucker and a resurgent rotation carried the load while the league's most feared hitter rested. In a season defined by injuries, that depth is the quiet championship weapon.\n\nAnalyst take: teams love to talk about peaking at the right time, but the Dodgers are doing something subtler — winning ugly, winning close, and winning without their best players. The eighth-inning heroics are fun, but the structure behind them is the real story in Los Angeles.", "analysis_zh": "第八局兩出局、5 比 4 落後的局面下，Mookie Betts 擊出的不只是全壘打——而是足以定義九月的那種全壘打。Betts 將一顆 90 英里的速球轟進左外野看台，這是他的第 18 支全壘打，一支三分彈瞬間將一分的落後翻轉為 7-5 的領先，並完成對華盛頓國民的三連戰橫掃。\n\n令人矚目的是，這並非孤立的瞬間。這是 Betts 連續第二晚擊出超前比數的三分全壘打——他職業生涯中從未完成過的背靠背壯舉。兩晚、兩次揮棒、兩次反攻，全部發生在比賽勝負難分的高壓時刻。這正是區分普通好隊與為十月打造的強隊的關鍵特質。\n\n橫掃持續堆疊數字。道奇隊戰績升至 86 勝 57 敗——國聯西區領先亞利桑那 9.5 場、領先亞特蘭大一個勝場穩居國聯第二種子，距離釀酒人隊的全聯盟最佳戰績僅差一場半。他們的 +149 得失分差領先全國聯，魔術數字逐日下降，道奇隊正在九月打出十月級別的棒球。\n\n最令人矚目的是：他們在 Shohei Ohtani 缺陣的情況下完成這一切，本季對華盛頓 6 戰全勝。Betts、Tucker 與回勇的先發輪值扛起重任，讓聯盟最令人畏懼的打者得以休息。在一個被傷勢定義的賽季裡，這樣的深度正是無聲的奪冠武器。\n\n分析師觀點：球隊常談論在正確的時機達到巔峰，但道奇隊在做的是更細膩的事——贏得難看的比賽、贏得拉鋸戰，並在缺少最佳球員時照樣贏球。第八局的英雄時刻固然精彩，但背後的結構才是洛杉磯真正的故事。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Ohtani Out Third Straight Game With Bicep and Neck Issues — Return Targeted for Monday", "headline_zh": "Ohtani 連續第三場缺陣，肱二頭肌與頸部傷勢纏身——預期週一歸隊", "analysis": "The Shohei Ohtani watch officially entered its trickiest stretch of the season. The two-way superstar was held out of the lineup for a third straight game with lingering right bicep inflammation and neck soreness — an injury cluster that began when Ohtani compensated for a knee issue and surfaced at the worst possible moment: early September, with the postseason horizon suddenly visible.\n\nThe messages out of the dugout remain encouraging. Manager Dave Roberts said the club is hopeful an IL stint won't be necessary and expects Ohtani back in the leadoff spot Monday against Cincinnati. Betts' heroics bought the Dodgers breathing room, but nobody in the organization is treating this lightly — for a hitter whose power is his identity, a bicep issue is not a minor inconvenience.\n\nContext only raises the stakes. Before the injury, Ohtani extended his Coors Field hitting streak to 22 straight games — a stretch in which he hit 10 homers with 26 RBIs. He reached 30 homers for a sixth consecutive season on Aug. 18, and his 139 homers in his first three seasons with the Dodgers put him alongside Mark McGwire, Alex Rodriguez and Babe Ruth in that exclusive category.\n\nAnalyst take: the Dodgers have built their entire October identity around Ohtani's bat, so rushing him back for the sake of one Monday lineup would be self-defeating. The magic number is at hand; the stretch run can be navigated by committee. What cannot be risked is Ohtani swinging through pain into the NLDS.\n\nThe plan, as outlined, is sound — rest this week, return against Cincinnati, ramp into October. But hopeful is not certain, and for a team that has been shredded by injuries all season, the next few days will be watched very closely.", "analysis_zh": "Shohei Ohtani 的觀察清單正式進入本季最棘手的階段。這位二刀流巨星因持續的右肱二頭肌發炎與頸部痠痛，連續第三場缺席先發名單。這個傷勢群始於 Ohtani 因膝蓋問題而代償發力，並在最不利的時機——九月初、季後賽景象近在眼前——浮出檯面。\n\n休息區傳出的訊息依然令人心安。總教練 Dave Roberts 表示球團希望傷兵名單不會介入，並預期 Ohtani 週一對辛辛那提之戰重返先發、回到開路先鋒位置。Betts 的英雄表現為道奇隊買到了喘息空間，但組織內沒有任何人輕忽此事——對於一個以力量為身價簽名的打者而言，肱二頭肌問題絕非小病。\n\n背景脈絡讓賭注更加升高。Ohtani 在受傷前將他在庫爾斯的連續安打場次推進至 22 場——期間轟出 10 支全壘打並貢獻 26 分打點。他在 8 月 18 日達成連續第六季 30 轟，生涯前三年在道奇繳出的 139 支全壘打，使他與 Mark McGwire、Alex Rodriguez 和 Babe Ruth 並列史冊。\n\n分析師觀點：道奇隊整個十月的作戰藍圖都圍繞著 Ohtani 的球棒建構，因此為了週一的一張先發名單而草率讓他歸隊，將是自拆台腳。魔術數字已近在眼前，例行賽尾段可以由團隊分擔。真正不能冒險的，是讓 Ohtani 忍痛揮棒一路拖進國聯分區系列賽。\n\n目前的計畫聽起來合理——本週休息，對辛辛那提歸隊，逐步加溫迎向十月。但「希望」不等於「確定」，對於一支整季遭傷勢折磨的球隊而言，接下來幾天的觀察至關重要。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Tucker Ends Four-Month Homer Drought — But the $240M Question Lingers", "headline_zh": "Tucker 終結四個月全壘打荒——但 2.4 億美元之問依然縈繞", "analysis": "Kyle Tucker finally connected. The $240 million outfielder launched his 12th homer of the season on a 99-mph fastball in a 5-3 win over the Nationals — his first long ball since June, snapping one of the most scrutinized droughts under baseball's largest offseason microscope.\n\nThe numbers behind the season remain uncomfortable. Tucker is hitting .232/.330/.370 through four months with a 97 OPS+ — a far cry from the .289/.408/.585 career line that earned him the contract. The analytical deep dives point to a barrel rate that is fine, undermined by rotten batted-ball luck. But his home splits have been genuinely baffling: .189/.286/.272 at Dodger Stadium.\n\nThe irony is that Tucker's drought is what made Betts' heroics matter. For weeks the Dodgers have operated with a bat that was a shadow of its billing, and it never cost them a winning streak. That is a luxury — but also a ticking clock. A $240 million hitter the lineup cannot rely upon in October is a problem no run differential can fix.\n\nThere were signs of life in the Washington series beyond the homer — loftier contact, better swings on velocity, more patient at-bats. The contact-quality metrics never collapsed; the outcome metrics did. The Dodgers need the two to finally align.\n\nAnalyst take: the Dodgers don't need Tucker to be a superstar; they need him to be dangerous. If the National League gets both a healthy Ohtani and a functioning Tucker in the same October lineup, there may not be a pitching staff alive that can navigate it.", "analysis_zh": "Kyle Tucker 終於開轟了。這位身價 2.4 億美元的外野手在 5-3 擊敗國民的比賽中，將一顆 99 英里速球扛出全壘打牆——這是他在六月以來的首支全壘打，終結了棒球界最大合約之下最受矚目的全壘打荒。\n\n他本季的數據依然令人不適。Tucker 四個月來打擊三圍 .232/.330/.370，OPS+ 僅 97——與替他贏得這紙合約的生涯打線（.289/.408/.585）相去甚遠。深入的數據分析指出他的擊球初速（barrel rate）其實不差，問題在於糟糕的運氣。但他的主場表現確實令人費解：在道奇球場僅繳出 .189/.286/.272。\n\n諷刺的是，正是 Tucker 的全壘打荒讓 Betts 的英雄時刻如此重要。數週以來，道奇隊一直帶著一個與身價相去甚遠的棒子作戰，卻從未因此中斷連勝。這是一種奢侈——但也是一顆定時炸彈。一支在十月無法倚賴的 2.4 億美元打者，是任何得失分差都無法修復的問題。\n\n然而國民系列賽中出現了他重生的跡象——更高仰角的擊球、對速球更好的揮棒、更有耐心的選球。他的擊球品質數據從未崩潰；崩潰的只是結果數據。道奇隊需要兩者終於對齊。\n\n分析師觀點：道奇隊不需要 Tucker 成為超級巨星；他們需要他保有威脅性。如果國聯在今年十月的同一張打線中同時擁有健康的 Ohtani 和正常發揮的 Tucker，恐怕沒有哪支投手陣容能招架得住。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Snell Untouchable in Six Shutout Innings as Postseason Rotation Rounds Into Form", "headline_zh": "Snell 六局完美壓制，季後賽先發輪值逐步成型", "analysis": "Blake Snell gave the Dodgers exactly what they needed Sunday: six untouchable shutout innings against the Nationals, a curveball so sharp it neutralized Washington's hitters from the first inning. Since returning from arthroscopic elbow surgery, Snell has been the dominant left-hander the Dodgers believed they were getting — and the timing is immaculate.\n\nThe significance is rotation-wide. Snell strengthens a five-man group that now includes Tyler Glasnow, Yoshinobu Yamamoto, Tarik Skubal and Roki Sasaki. Glasnow, back since Aug. 25 after three-plus months on the shelf, went six innings with eight strikeouts in his latest start. What once looked like a thin, battered unit now has the profile of a murderer's row.\n\nThat lethal curveball is worth dwelling on. Snell's secondaries have always been elite, but his command this month has been surgical. For an October in which the Dodgers will lean on starting pitching as much as any team in the field, having a left-handed weapon of Snell's caliber in the middle of the bracket is a genuine strategic advantage.\n\nManager Dave Roberts now faces the least-bad problem in baseball: how to line the arms up. Someone enviable gets squeezed out of the playoff picture; someone takes a bullpen role. But for the first time this season, the question isn't whether the Dodgers have enough pitching — it's which of their elite arms gets the ball in October.\n\nAnalyst take: the postseason rotation was the single biggest question mark hanging over this roster in June. In September, it has quietly become its greatest strength. If Snell, Glasnow and company hold up over the final three weeks, the Dodgers enter October as the most complete, most dangerous team in the National League.", "analysis_zh": "Blake Snell 在週日為道奇隊送上他們最需要的表現：對國民主投六局無失分的完美壓制，一顆銳利到從第一局就讓華盛頓打者群無解的曲球。自肘關節鏡手術歸隊以來，Snell 一直是球團堅信的那個具宰制力的左投——而這個時機再完美不過。\n\n它的意義是全面性的。Snell 讓一支已納入 Tyler Glasnow、Yoshinobu Yamamoto、Tarik Skubal 與 Roki Sasaki 的五人先發群更顯深厚。Glasnow 自 8 月 25 日結束三個多月的缺陣歸隊後，最近一場先發繳出六局八次三振。那個曾被視為薄弱、傷痕累累的先發輪值，如今已具備夢幻陣容的樣貌。\n\n那顆致命曲球值得細細品味。Snell 的變化球一直是精英級，但他本月的控球已提升至外科手術般精準。在道奇隊將像任何球隊一樣倚賴先發投手的十月，輪值中段擁有一名像 Snell 這樣等級的左投武器，是貨真價實的戰略優勢。\n\n總教練 Dave Roberts 如今面臨棒球界最令人豔羨的問題：如何安排輪值順序。某位令人豔羨的投手將被擠出季後賽藍圖；某位將轉任牛棚角色。但本季首次，問題不再是道奇隊是否擁有足夠的投手——而是十月該把球交給哪一位精英手臂。\n\n分析師觀點：季後賽先發輪值本季曾是這份球員名單上最大的問號。到了九月，它已悄然成為球隊最偉大的優勢。若 Snell、Glasnow 與其他人在最後三週維持狀態，道奇隊將以國聯最完整、最具危險性的強權之姿踏入十月。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Rushing to IL as Bobby Miller and Treinen Return — September Depth Takes Shape", "headline_zh": "Rushing 進入傷兵名單，Bobby Miller 與 Treinen 歸隊——九月深度成型", "analysis": "The Dodgers' September roster chess continued apace, and it included both pain and reinforcements. Young catcher Dalton Rushing was placed on the injured list — retroactive to Sept. 5 — with right elbow discomfort, a blow for one of the organization's top prospects as he competes for a postseason bench role.\n\nGood news arrived in the bullpen. Bobby Miller was activated from the 60-day injured list and promptly spun three scoreless innings of relief in Sunday's win. Blake Treinen also returned from the IL, adding two veteran late-inning arms to a unit that has been stretched all season.\n\nRushing's placement is the bigger story for timing reasons. He was activated Sept. 1 as part of the roster expansion — alongside Will Smith coming off a three-month neck injury, lefty Justin Wrobleski, and recalled infielder Alex Freeland. Dalton was expected to be the catcher of the future getting meaningful reps now; instead he is shelved with an elbow injury that can be tricky for a backstop.\n\nLook at the last few weeks and a theme emerges: the September flurry reflects a team that has lived on the injured list. Eric Lauer hit the IL with elbow inflammation on Sept. 2 — after Smith, Rushing and a carousel of bullpen arms before them. That the Dodgers still lead the division is as much a scouting-and-development marvel as a roster one.\n\nAnalyst take: these are precisely the kinds of moves that decide Octobers. Miller's electric stuff back in the pen, Treinen's ground-ball reliability and Smith's bat all deepen a roster now positioning itself for a championship runway. Rushing's injury is a setback for his development — but with Smith healthy, the catching position is covered.", "analysis_zh": "道奇隊九月的陣容棋局持續推演，既有傷病也有援軍。年輕捕手 Dalton Rushing 因右肘不適被放入傷兵名單（追溯自 9 月 5 日）——對於一位正在爭取季後賽板凳席次、位居組織內部頂尖新秀的捕手而言，這是一記打擊。\n\n好消息來自牛棚。Bobby Miller 從 60 天傷兵名單解除後，立即在週日之戰繳出三局無失分的後援內容。Blake Treinen 也從傷兵名單回歸，為整季被拉扯到極限的後援單位增添兩位老將級後段局數投手。\n\nRushing 的登錄更具時間敏感的意義。他是 9 月 1 日名單擴編時回歸的成員之一——同期還有擺脫三個月頸部傷勢的 Will Smith、左投 Justin Wrobleski，以及被召回的內野手 Alex Freeland。Dalton 原本被期待在此刻累積對未來捕手至關重要的實戰經驗；如今他卻因對捕手而言棘手的肘部問題被迫休息。\n\n回顧過去數週，一個主題浮現：九月一波波的人事異動反映的是一支整季與傷兵名單為伍的球隊。Eric Lauer 在 9 月 2 日因肘部發炎進入傷兵名單——在他之前還有 Smith、Rushing 與一長串牛棚投手。道奇隊至今仍能領先分區，既是球探與養成系統的奇蹟，也是陣容上的奇蹟。\n\n分析師觀點：這些操作正是決定十月成敗的那種調度。Miller 彈性十足的球威回歸牛棚、Treinen 的地面球可靠性，以及 Smith 的棒子，都讓一支正在為奪冠跑道佈局的陣容更加深厚。Rushing 的傷勢是他養成之路的挫折——但在 Smith 健康的情況下，捕手位置並無缺口。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "No. 14 USC Blanks Fresno State 39-0 Behind Maiava's 349 Yards and 3 TDs", "headline_zh": "第 14 名南加大在 Maiava 349 碼、3 達陣帶領下以 39-0 完封 Fresno State", "analysis": "No. 14 USC announced itself Friday with its most complete performance in years. The Trojans blanked Fresno State 39-0 on FOX — their first shutout since the 2024 blowout of Utah State — behind Jayden Maiava's 349 passing yards and three touchdowns, two of them to freshman sensation Trent Mosley.\n\nThe margin is historic: the 39-point margin of victory is the largest in the 40-year series. After two games, the Trojans have outscored opponents 81-26 and allowed just 13 total points in the second half — evidence this is not a team that eases up. Gary Patterson's defense, in just its second game under the retired-turned-hired coordinator, pitched a clean sheet.\n\nPatterson's transformation is the quiet headline. The 4-2-5 structure, the aggressive second-level blitzes, the confidence radiating from a secondary that was a liability a year ago — it all points to a unit that is no longer surviving but dictating. Two safeties against Fresno State were a microcosm of a front that won the line of scrimmage all night.\n\nContext matters, too: the effort came while a portion of the Trojans' rotation was rested. USC outgained Fresno State comfortably and still left weapons in reserve. The schedule ahead — Rutgers, Oregon, Washington, Ohio State — will demand far more, but the floor for this defense has been raised substantially.\n\nAnalyst take: a September shutout of a Mountain West opponent proves little on its own. But the wholeness of it — the offense humming without relying on heroics, the defense dictating terms — is exactly the profile of a team ready to make real noise in the Big Ten race.", "analysis_zh": "第 14 名的南加大在週五以近年來最具統治力的表現向全美宣告自我。特洛伊人隊在 FOX 實況轉播下以 39-0 完封 Fresno State——這是自 2024 年痛宰猶他州立以來的首場完封——幕後功臣是 Jayden Maiava 的 349 碼傳球與三次達陣，其中兩次傳給新生奇才 Trent Mosley。\n\n勝分具有歷史意義：39 分的勝差是這個交戰 40 年的系列賽中最大的。兩場比賽過後，特洛伊人隊以 81-26 碾壓對手，兩場下半場合計僅失 13 分——證明這不是一支會放鬆的球隊。退休後被網羅的協調員 Gary Patterson 率領的防守組，僅在第二場比賽就交出一張完封成績單。\n\nPatterson 的改造是低調的頭條。4-2-5 戰術體系、激進的第二層突襲、一年前還是弱點的 secondary 所散發出的自信——這一切都指向一個不再只是苟活、而是主導比賽的防守單位。對 Fresno State 完成兩次擒殺得分，是整晚壓制啟球線的前線群的最佳縮影。\n\n背景脈絡也至關重要：這是一場在部分主力輪換休戰下完成的勝利。南加大輕鬆碾壓 Fresno State，且仍保留了大量進攻武器。接下來的賽程——羅格斯、俄勒岡、華盛頓、俄亥俄州立——將提出嚴苛得多的要求，但這支防守組的地板已經被大幅抬高。\n\n分析師觀點：九月完封一支山區西岸聯盟的對手本身證明不了什麼。但它的完整性——進攻組不依賴英雄時刻便能流暢運轉、防守組主導節奏——正是球隊準備在 Big Ten 競爭中掀起波瀾的典型樣貌。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "Maiava's Historic Efficiency Puts Him on an Early Heisman Trajectory", "headline_zh": "Maiava 創歷史級的效率，讓他踏上早期海斯曼之路", "analysis": "Jayden Maiava is playing football that borders on science fiction. After completing 25 of 29 passes — 86 percent — against San Jose State, the highest single-game completion rate by a USC quarterback in 30 years, Maiava followed with 349 yards and three touchdowns against Fresno State, spreading the ball to 10 different receivers. He has climbed to No. 2 all-time among USC passers over the last three decades in career 200-yard games with both a passing and rushing touchdown.\n\nThe Heisman talk is no longer premature. Maiava entered the season ranked No. 29 in ESPN's top 100 players — a capstone of a 2025 in which he led the Big Ten in passing (3,711 yards, 24 touchdowns) and ranked No. 2 nationally in QBR (89.9). He is 12-5 as a starter and opened the year on the Walter Camp Player of the Year watch list.\n\nThe leap in efficiency is what separates this run. His pre-snap recognition, his willingness to take the easy completion, his trust in a still-developing receiver group — it all reads like a veteran navigating a fast-paced system, not a junior still learning road weather in October.\n\nThe schedule soon removes all training wheels. Big Ten defenses across the second half of the season will be the sharpest he has faced, and the film on him will be complete. Maiava's numbers will inevitably regress. The question is whether his fundamentals hold when the margin for error shrinks.\n\nAnalyst take: Heisman runs are built in September but decided in October and November. Maiava has positioned himself with two bulletproof wins so far. The narrative is being written — but the real audition begins at Rutgers on Sept. 19.", "analysis_zh": "Jayden Maiava 打出的足球已經接近科幻等級。在對聖荷西州立繳出 25 之 29——86%——南加大四分衛 30 年來單場最高成功率之後，Maiava 接著對 Fresno State 繳出 349 碼與三次達陣，將球分散給 10 位不同接球手。他在生涯「同時有傳球與衝球達陣的 200 碼以上比賽」次數上，已躍居南加大過去三十年歷史上第二位。\n\n海斯曼的話題不再算太早。Maiava 本季以 ESPN 百大球星第 29 名之姿開賽——這是他在 2025 年領先 Big Ten 傳球榜（3,711 碼、24 次達陣）、全國 QBR 排名第二（89.9）之後的加冕。他作為先發戰績 12 勝 5 敗，並在開季進入 Walter Camp 年度最佳球員觀察名單。\n\n效率的大幅躍進是這段旅程與眾不同的核心。他的開球前防守判讀、他果斷接受簡單傳球的心態、他對仍在成長中的接球群所抱持的信賴——這一切都像一位在高節奏體系中游刃有餘的老將，而非一位還在學習客場十月天氣的三年級先發。\n\n接下來賽程將移除所有練習輪子。下半季 Big Ten 的防守將是他面對過最犀利的，關於他的對戰影片將完整而全面。Maiava 的數據終將無可避免地回落。真正的問題是，當容錯空間縮小時，他的基本功是否還能維持。\n\n分析師觀點：海斯曼之路在九月奠基，但在十月與十一月定論。Maiava 已用兩場無可挑剔的勝利站穩腳步。敘事正在撰寫——但真正的試演從 9 月 19 日於羅格斯展開。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "Freshman Trent Mosley Emerges as USC's Most Dangerous Vertical Weapon", "headline_zh": "新生 Trent Mosley 脫穎而出，成為南加大最具威脅的縱深武器", "analysis": "The biggest revelation of USC's 2-0 start isn't the quarterback — it's who he is throwing to. Freshman Trent Mosley torched Fresno State for two touchdowns, including the kind of explosive deep-ball scores that keep defensive coordinators up at night. In a receiving room full of veterans, Mosley is already the most dangerous weapon.\n\nHis emergence is no accident. Mosley arrived as part of USC's history-making No. 1-ranked 2026 recruiting class — the first non-SEC program since 2008 to top the 247Sports Composite — and the early returns suggest the five-star billing was, if anything, understated. His rapport with Maiava already looks like a year-two connection.\n\nThe schematic impact: Mosley's threat at the top of the defense stretches safeties and opens the intermediate and run-game windows underneath. Defenses can no longer stack the box or bracket silently; Mosley's speed demands respect on every snap. That is precisely the kind of component that turns a good offense into a demoralizing one.\n\nThe sustainability question is real. Freshmen wideouts typically fade as the season grinds on and cornerbacks collect film. The Big Ten's physical press corners — starting with the Rutgers trip — will present a steeper challenge than anything Mosley has seen.\n\nAnalyst take: Mosley is the offense's highest-upside variable. He doesn't need 80 catches to matter; he needs to remain a consistent vertical threat. If he does, USC's opponents just inherited a much worse spacing problem. And for a No. 1 recruiting class betting its future on this youth movement, he is the proof of concept.", "analysis_zh": "南加大 2 勝 0 敗開季的最大發現不是四分衛——而是他的傳球對象。新生 Trent Mosley 對 Fresno State 攻下兩次達陣，其中包括那種會讓防守協調員夜半無眠的爆發性深傳接球。在一個滿是資深老將的接球群中，Mosley 已是最危險的武器。\n\n他的崛起絕非偶然。Mosley 是南加大創歷史的 No. 1 2026 招募班級（自 2008 年以來第一個登上 247Sports Composite 榜首的非 SEC 學校）的一員，而早期的回報顯示，五星級評價若非保守，也只是剛好。他與 Maiava 之間已展現出第二年搭檔般的默契。\n\n戰術層面的影響：Mosley 位在防守頂端的威脅會拉長安全衛，為中距離與地面進攻開啟底下的空間。防守組不能再悄然堆積禁區或施以暗中的夾擊；Mosley 的速度讓每一次攻防都必須心存顧忌。這正是那種能把好進攻變成令人絕望進攻的關鍵元件。\n\n永續性的疑問確實存在。新秀外接手通常會隨著賽季推進、角衛收集完對戰影片而逐漸消退。Big Ten 充滿對抗性的壓迫角衛——從羅格斯之旅開始——將是 Mosley 從未面對過的嚴峻考驗。\n\n分析師觀點：Mosley 是這支進攻體系的最高天花板變數。他不需要接到 80 球才有價值；他只需要維持穩定的縱深威脅。若能做到，南加大的對手們即將繼承一個更加無解的空間難題。而對於一支把未來押注在青春浪潮上的 No. 1 招募班級而言，他就是概念驗證。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "USC Closes Nonconference Play vs. Louisiana Before the Big Ten Gauntlet Begins", "headline_zh": "南加大迎戰 Louisiana 結束非聯盟賽程，Big Ten 嚴酷考驗隨之登場", "analysis": "USC closes the nonconference portion of its schedule Saturday at 8 p.m. PT against Louisiana at the Los Angeles Memorial Coliseum — the first-ever meeting between the programs. The Ragin' Cajuns, 1-0 under coach Michael Desormeaux, arrive as heavy underdogs to a 2-0 Trojan team that has yet to trail this season.\n\nThe matchup is a tune-up in the purest sense. Lincoln Riley's staff wants a clean, healthy win — an efficient first half, meaningful reps for reserves, and no injury exposure for the core. Every risky snap in a game this controllable is a snap that could be spent preparing for the gauntlet that follows.\n\nBecause what follows is the real season. Big Ten play opens Sept. 19 at Rutgers, then comes a Coliseum gauntlet unlike any USC has hosted in years — No. 2 Oregon on Sept. 26, Washington on Oct. 3, and Ohio State on Halloween. In a single month, USC's playoff credentials will be tested against a murderer's row of opponents.\n\nAgainst that backdrop, the recruiting news matters too. USC's 2026 class was the first since 2008 outside the SEC to top the composite rankings, and Saturday's game is a showcase for the youth movement that class is already fueling — Mosley chief among them. A dominant, controlled victory keeps momentum alive on the trail as well as on the field.\n\nAnalyst take: there are no style points in September football, but there is such a thing as leaving no doubt. A three-touchdown, mistake-free win against Louisiana — starters resting by the third quarter — is the exact message USC needs to send before the stretch that will define its season.", "analysis_zh": "南加大將於週六晚間 8 時（太平洋時間）在洛杉磯紀念體育場對上 Louisiana，為非聯盟賽程畫下句點——這是兩校史上首次交手。在總教練 Michael Desormeaux 率領下以 1 勝 0 敗開季的 Ragin' Cajuns，本場將是面對本季從未落後過的 2 勝 0 敗特洛伊人隊的明顯劣勢方。\n\n這是一場最純粹意義上的熱身賽。Lincoln Riley 的教練團想要一場乾淨、健康的勝利——有效率的上半場、替補們有意義的上場時間、核心球員零傷病風險。在一場如此可控的比賽中，每一次冒險的攻防，都是一次本可為接下來嚴酷賽程備戰的攻防。\n\n因為接下來才是真正的賽季。Big Ten 賽程於 9 月 19 日自羅格斯展開，隨後是南加大多年來未曾主辦過的紀念體育場嚴酷連戰——9 月 26 日迎戰全美第二的俄勒岡、10 月 3 日對華盛頓、萬聖節對俄亥俄州立。短短一個月內，南加大的季後賽資格將接受夢幻陣容般的對手考驗。\n\n在此背景下，招募消息同樣重要。南加大 2026 屆是自 2008 年以來第一個登上綜合排名榜首的非 SEC 班級，而週六之戰正是這個班級早已在推動的青年浪潮——以 Mosley 為首——的最佳展示。一場具統治力的可控勝利，能在招募之路與球場上同步維持動能。\n\n分析師觀點：九月足球沒有風格分，但確實存在「不留疑慮」這件事。一場領先三個達陣、零失誤的勝利——替補在第三節前就已接班——正是南加大在決定本季成敗的關鍵賽程前，所要傳達的確切訊息。"}, {"team": "Rams", "accent": "#003594", "headline": "Super Bowl 'Favorites' Humbled: Rams Flop 27-7 in NFL's First-Ever Australia Game", "headline_zh": "超級盃「熱門」受辱：公羊隊在 NFL 澳洲史上首戰以 27-7 潰敗", "analysis": "The Rams were supposed to be the best team in football. Instead, they delivered the most humbling night of the Sean McVay era. Los Angeles fell 27-7 to the 49ers at the Melbourne Cricket Ground — the NFL's first-ever regular-season game in Australia — in front of 100,021 fans who watched a Super Bowl favorite look ordinary in every phase.\n\nThe numbers are damning. Matthew Stafford threw no touchdowns and was intercepted. The offense managed exactly one scoring drive — a Kyren Williams 5-yard touchdown run set up by a 41-yard Puka Nacua catch. San Francisco controlled time of possession 33:50 to 26:10 and drove the ball at will when it mattered. That the 49ers went to Melbourne a full week earlier than the Rams only sharpened the optics.\n\nThe lone bright spot was on defense: Quentin Lake's interception. But Lake's play only highlighted the broader failure — the Rams could not get off the field, could not create red-zone stops, and could not make the only game on the planet's biggest football stage competitive.\n\nContext matters: this was the game the league had built for a year. Twenty-plus hours of flight, a week of build-up, and a roster assembled at massive cost. The Rams entered as betting favorites and were dismantled by a division rival that simply wanted it more.\n\nAnalyst take: one game does not define a season, but attitude is contagious, and the Rams' week-long logistics — including McVay arriving only 28 hours before kickoff — will now be scrutinized. The 49ers wanted this stage. For a Rams team built to win now, Week 2 against the Giants is no longer optional. It is mandatory.", "analysis_zh": "公羊隊原本應該是全美最佳的球隊。結果，他們卻上演了 Sean McVay 時代最難堪的一夜。洛杉磯在墨爾本板球場以 27-7 敗給 49 人隊——這是 NFL 史上第一場在澳洲舉行的例行賽——100,021 名球迷親眼目睹一支超級盃熱門隊伍在每個環節都平庸至極。\n\n數據令人沮喪。Matthew Stafford 沒有傳出任何達陣且被抄截一次。進攻組全場只完成一次得分攻勢——Kyren Williams 5 碼達陣跑，由 Puka Nacua 的 41 碼接球鋪路。舊金山以 33:50 對 26:10 的持球時間優勢掌控比賽，並在關鍵時刻隨心所欲地推進。47 人隊整整比公羊隊早一週抵達墨爾本的安排，更讓失利的觀感雪上加霜。\n\n唯一的亮點在防守端：Quentin Lake 的抄截。但 Lake 的表現反而凸顯了更廣泛的失敗——公羊隊無法讓對手退場、無法在紅區完成擋下、也無法讓地球最大足球舞台上的唯一一場比賽保有競爭力。\n\n背景脈絡至關重要：這是聯盟籌備了一整年的戰役。超過二十小時的飛行、一週的鋪陳，以及以高昂代價組裝而成的陣容。公羊隊以熱門身分開賽，卻被一支單純更想贏的分區宿敵徹底拆解。\n\n分析師觀點：一場比賽不能定義一個賽季，但態度會傳染，而公羊隊這週的後勤安排——包括 McVay 直到開賽前 28 小時才抵達——如今將受到嚴格檢視。49 人隊渴望這個舞台。對於一支為當下奪冠而打造的隊伍，第二週對巨人隊的勝利已不再是可選項。而是必須完成的任務。"}, {"team": "Rams", "accent": "#003594", "headline": "Myles Garrett's Silent Debut: No Stats, No Pressures, and a Blunt Admission About His Knee", "headline_zh": "Myles Garrett 首秀一片沉默：零數據、零施壓，以及對膝傷的坦率告白", "analysis": "Myles Garrett's Rams debut produced one of the quietest stat lines in recent memory — because it was effectively blank. No tackles. No pressures. No sacks. For the first time since 2018, the NFL's most disruptive defensive player was held without a single pressure on the quarterback.\n\nGarrett was honest afterward, and his admission was the most revealing moment of the night. He said he is still dealing with pain from a knee issue sustained in training camp and called the performance the worst version of himself that he has put out there. A 5-year, roughly $290 million investment is not supposed to need a disclaimer.\n\nThe context makes the silence louder. The Rams parted with significant capital to acquire Garrett from Cleveland in June, then built a defensive line around him and the returning Aaron Donald. In Melbourne, neither delivered — Donald did not travel, and Garrett disappeared against a 49ers front he usually terrorizes.\n\nThe medical question is now the crucial one. Is this a flare-up that rest days can fix, or a structural issue that will define his season? Garrett is too proud to sit, which makes the coaching staff's judgment more important — and a Week 2 matchup against the Giants provides a far softer landing spot.\n\nAnalyst take: the first sign of the highest-paid defender in history not being 100 percent, for the long haul, would be a crisis for a roster already humbled in Week 1. If the knee is manageable, Garrett's ceiling has not moved an inch. But the Rams need to see the proof — and quickly.", "analysis_zh": "Myles Garrett 的公羊首秀繳出近年最蒼白的數據單——因為它基本上是空白的。零擒抱。零施壓。零擒殺。自 2018 年以來，NFL 最具破壞力的防守球員首度在四分衛身上製造不出任何一次施壓。\n\nGarrett 賽後非常誠實，而他的告白是當晚最發人深省的時刻。他表示自己仍在承受訓練營期間膝傷留下的疼痛，並稱這場表現是他「拿出來的最糟版本的自己」。一份五年總值約 2.9 億美元的投資，不該需要這樣的免責聲明。\n\n背景脈絡讓這份沉默更加震耳。公羊隊在六月以可觀資產從克里夫蘭換來 Garrett，然後圍繞他與回歸的 Aaron Donald 構築防守鋒線。在墨爾本，兩人都沒有發揮——Donald 根本沒隨隊前往，而 Garrett 在平日他總能撕裂的 49 人鋒線面前消失了。\n\n醫療問題如今成為關鍵。這是一次休息就能解決的急性發炎，還是將定義他整個賽季的結構性問題？Garrett 的自尊太強、不願休戰，這讓教練團的判斷更加重要——而第二週對上巨人隊，提供了寬鬆得多的落點。\n\n分析師觀點：若史上最高薪防守球員的「非百分之百」狀態成為長期常態，那就是一支已在第一週受挫的陣容的危機。若膝傷可控，Garrett 的天花板一點都沒有下移。但公羊隊需要看到證明——而且要快。"}, {"team": "Rams", "accent": "#003594", "headline": "Stafford and the Star-Studded Offense Sputter — Stuffed Sneak at the 1 Caps the Night", "headline_zh": "Stafford 與豪華進攻組熄火——1 碼線偷跑被擋，為難堪之夜收尾", "analysis": "The Rams' offense — the unit analysts called the best on paper in football — never found the field in Melbourne. Reigning MVP Matthew Stafford was 4-for-11 for 65 yards in the first half and finished with zero touchdowns against a 49ers defense that dictated terms from the opening snap. Puka Nacua and Davante Adams were effectively neutralized.\n\nBoth coach and quarterback pointed to the same culprit: communication. Sloppy signals, freelancing on routes, and an uncharacteristic disconnect between Stafford and his targets. For a group that spent an entire camp perfecting its timing, failing to speak the same language on the biggest stage is a worrying sign.\n\nThen came the moment that summed up the night. Down 17-7 late in the third quarter, the Rams drove to the 49ers' 1-yard line. Stafford's quarterback sneak was stuffed on fourth down. San Francisco promptly marched 99 yards in 11 plays, capped by a 15-yard Deebo Samuel touchdown, and the game was effectively over at 24-7.\n\nFailures like that are double-sided: the goal-line stop, the tackle for loss on the sneak, and the 99-yard answer drive that followed all suggest San Francisco's defense was not merely stopping the Rams — it was breaking them.\n\nThe deeper concern is the pattern. When the Rams' timing is off, Stafford presses, and presses lead to mistakes. In Melbourne he was collected but ineffective — an all-star offense that played like a scrimmage squad.\n\nAnalyst take: the preseason glow gave the Rams a false sense of security. Week 2 against the Giants is a manageable bounce-back spot, but McVay cannot fix communication with a scheme tweak — it is about trust and reps. Either the Rams rebuild that trust in a hurry, or the dream-offense narrative dies before October.", "analysis_zh": "公羊隊的進攻——分析師口中的「紙面上全美最佳」單位——在墨爾本始終未能進入狀態。衛冕 MVP Matthew Stafford 上半場僅傳出 65 碼（11 傳 4 中），全場達陣掛零，被一支從開球第一刻就主導局勢的 49 人防守徹底壓制。Puka Nacua 與 Davante Adams 幾乎被完全鎖死。\n\n教練與四分衛都指出同一個元兇：溝通。信號紊亂、路線自由發揮，以及 Stafford 與接球目標之間反常的失聯。對於一個花了整個訓練營打磨節奏的團隊而言，在最大的舞台上無法使用同一種語言，是令人憂心的訊號。\n\n隨後，代表整晚的時刻降臨。第三節後段落後 17 比 7 時，公羊隊推進到 49 人隊 1 碼線。Stafford 的四檔偷跑在第四檔被擋下。舊金山隨即以 11 波攻勢推進 99 碼，由 Deebo Samuel 的 15 碼達陣收尾，比賽在 24-7 的比數下事實落幕。\n\n此類失敗是雙面的：門口的阻擋、偷跑時的被擒抱、以及隨後的 99 碼反擊攻勢——這一切都說明舊金山的防守不只是擋下公羊隊，而是在擊垮他們。\n\n更深層的擔憂在於模式。當公羊隊的節奏失準時，Stafford 會過度用力，而過度用力會導致失誤。在墨爾本，他冷靜卻無力——一支全明星進攻打出陪練隊的內容。\n\n分析師觀點：季前賽的榮光給了公羊隊虛假的安全感。第二週的巨人隊是一個較易反彈的機會，但 McVay 無法用戰術調整修復溝通問題——這關乎信任與訓練次數。公羊隊要嘛迅速重建這份信任，要嘛「夢幻進攻」的敘事在十月前就壽終正寢。"}, {"team": "Rams", "accent": "#003594", "headline": "Donald Skips Melbourne Trip, Expected Back for Week 2 vs. Giants as Ramp Continues", "headline_zh": "Donald 未隨隊赴墨爾本，預期第二週對巨人歸隊，漸進式恢復持續進行", "analysis": "The most famous defensive arrival of 2026 did not make the trip to Australia. Aaron Donald, who unretired on Aug. 30 after two and a half years away, was ruled out for Week 1 as the Rams continue easing him back — no shortcuts this time, just a deliberate ramp toward October.\n\nThe contract reflects the plan: a one-year deal worth $20 million, up to $30 million with incentives. The Rams are paying Donald to be a playoff weapon, not a Week 1 curiosity. His absence in Melbourne was announced before the game, and the organization framed it as part of the ramp rather than an injury concern.\n\nDonald's return from a 2.5-year retirement remains one of the stranger stories in recent NFL history — a 35-year-old future Hall of Famer who walked away at the top, stayed away, and chose to come back when the Rams built a super-team around him.\n\nWeek 2 against the Giants looks different: Donald is expected to be available, in some capacity, for Monday Night Football. The real question is his workload — whether he can handle starter-level snaps by mid-October, when the Rams' schedule turns serious.\n\nAnalyst take: Donald's value proposition has not changed — he remains the tip-the-scale domino who frees Garrett and everyone else. But a 35-year-old interior lineman returning from retirement is a high-variance bet, and the Rams are managing it correctly. If they can shelter Donald through September, October could look very different for this defense.", "analysis_zh": "2026 年最受矚目的防守回歸並未登上前進澳洲的航班。Aaron Donald 在離開兩年半後於 8 月 30 日解除退休，但第一週確定缺陣，因為公羊隊仍在讓他逐步回歸——這次沒有捷徑，只有一條朝向十月的刻意鋪設的跑道。\n\n合約反映了這個計畫：一份 2000 萬美元的一年合約，附帶激勵條款最高可達 3000 萬美元。公羊隊付錢給 Donald 是為了要一枚季後賽武器，而非第一週的好奇展示。他在墨爾本的缺陣在賽前就已宣布，球團將其定調為回歸過程的一部分，而非傷病疑慮。\n\n從 2.5 年的退休中回歸，仍是近年 NFL 史上最奇特的故事之一——一位在巔峰期離開、就此沉寂、卻在公羊隊圍繞他打造超級陣容時選擇回歸的 35 歲準名人堂成員。\n\n第二週對巨人隊將呈現不同樣貌：Donald 預期將以某種形式回歸週一晚間足球賽。真正的問題是他的工作量——他能否在十月中賽程轉硬時，負擔先發等級的攻防次數。\n\n分析師觀點：Donald 的價值主張沒有改變——他仍然是那個解放 Garrett 與所有人的制衡棋子。但一位 35 歲的內側鋒線球員從退休中復出，是高變異性的賭注，而公羊隊的處理方式正確。若能讓 Donald 安然度過九月，這支防守在十月將呈現截然不同的面貌。"}, {"team": "Rams", "accent": "#003594", "headline": "McVay Refuses Travel Excuses After 'Humbling' Loss, But the 28-Hour Question Lingers", "headline_zh": "McVay 拒絕以行程為藉口，坦然面對「謙卑」敗仗——但 28 小時之問依然縈繞", "analysis": "Sean McVay arrived in Melbourne just 28 hours before kickoff. The 49ers had been there for a week. After the 27-7 embarrassment, the arithmetic wrote itself — and McVay, to his credit, refused to take the easy out.\n\nSometimes sports can humble you, and today was one of those days. I make no excuses, McVay said, adding that he takes full responsibility for the flat performance. It was the posture of a coach protecting his roster from an excuse-making culture, even as critics had flagged the travel discrepancy all week.\n\nThe accountability is deserved and real. But the travel decision remains a legitimate question. Whether the late arrival mattered or not in the final result, the Rams voluntarily surrendered a competitive edge — and in a 20-point loss, the optics were crushing.\n\nBehind the scenes, the loss exposed something deeper. A roster assembled at record cost looked mentally late, physically flat and tactically out-coached. McVay's responsibility extends beyond logistics — it extends to having these stars ready to compete when the lights are brightest.\n\nWhat comes next is the real test. Week 2 brings the Giants on Monday Night Football. A loss there, in the same fashion, turns a disappointing opener into a season crisis for a team with all-in ambitions. McVay's calm message in Melbourne must now be backed by results in Los Angeles.\n\nAnalyst take: McVay's refusal to make excuses is why he remains one of the game's best leaders — but leadership has a shelf life. The Rams can absorb one humbling loss. They cannot absorb two. The narrative now owns the schedule.", "analysis_zh": "Sean McVay 在開賽前僅 28 小時才抵達墨爾本。49 人隊已經在那裡待了一整週。27-7 的難堪結果出爐後，算術不言自明——而 McVay 值得肯定的是，他拒絕走那條容易的退路。\n\n「運動有時會讓你感到謙卑，今天就是那樣的其中一天。我不找藉口，」McVay 說，並補充他為全隊疲軟的表現負全部責任。這是一位教練保護陣容免於陷入藉口文化的姿態——即使批評者整個星期都在強調差旅安排的不同。\n\n這份承擔責任的態度理所當然且真實。但差旅決定仍是一個合理的問題。無論晚到是否真的影響最終結果，公羊隊都是自願放棄了一項競爭優勢——而在一場 20 分的敗仗中，觀感是毀滅性的。\n\n檯面下，這場敗仗揭露了更深層的問題。一支以創紀錄成本組裝的陣容，表現出心理上的遲到、身體上的疲軟，以及戰術上的完敗。McVay 的責任不止於後勤——更在於讓這些球星在燈光最亮之時做好競爭的準備。\n\n接下來才是真正的考驗。第二週將在週一晚間足球賽對上巨人隊。若再以同樣方式輸球，一場令人失望的開幕戰就會升級為一支懷抱「全力一搏」野心的球隊的賽季危機。McVay 在墨爾本的冷靜發言，如今必須由洛杉磯的戰績來背書。\n\n分析師觀點：McVay 拒絕找藉口，正是他仍是聯盟最佳領袖之一的原因——但領袖魅力也有保存期限。公羊隊可以承受一場令人謙卑的敗仗。他們承受不起兩場。敘事如今掌握著賽程。"}], "closing": "September is here, and Los Angeles sports has never had richer stakes. The Dodgers chase history with an October rotation finally whole, USC chases a championship with Maiava and a defense rebuilt in two weeks, and the Rams get a Monday Night shot at redemption against the Giants. Tighten your seatbelt — it's going to be a wild ride into October.", "closing_zh": "九月已至，洛杉磯體壇的賭注從未如此之高。道奇隊以終於完整的十月輪值追逐歷史，南加大憑藉 Maiava 與兩週內重建的防守追尋冠軍，而公羊隊將在週一晚間獲得對巨人隊證明自己的救贖機會。繫好安全帶——通往十月的旅程勢必精彩可期。"};
let lang = "en";
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmtPT(iso){ return new Date(iso).toLocaleString("en-US",{timeZone:"America/Los_Angeles",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"})+" PT"; }

function renderDigest(d){
  const box = document.getElementById("digest");
  if(!d || !d.segments){
    box.innerHTML = '<div style="text-align:center;color:var(--dim);padding:40px">No digest yet</div>';
    return;
  }
  const segs = d.segments.map(s=>{
    const headline = lang==="en" ? s.headline : s.headline_zh;
    const analysis = lang==="en" ? s.analysis : s.analysis_zh;
    return '<div class="seg" style="--team:'+esc(s.accent)+'">' +
      '<div class="row"><span class="hn">'+esc(headline)+'</span><span class="badge">'+esc(s.team)+'</span></div>' +
      '<div class="lbl">'+(lang==="en"?"Analysis":"分析")+'</div><p>'+esc(analysis)+'</p>' +
      '</div>';
  }).join("");
  box.innerHTML =
    '<div class="dhead">' +
      '<div class="t"><div class="mic">🎙️</div><div><h2>'+esc(d.title)+'</h2><div class="meta">' +
        esc(d.read_time || "")+' · '+fmtPT(d.updated_at)+
        ' · 繁中/EN</div></div></div>' +
      '<div class="langs">'+
        '<button id="btnEn" class="on" onclick="setLang(\'en\')">EN</button>'+
        '<button id="btnZh" onclick="setLang(\'zh\')">繁體中文</button>'+
      '</div>' +
    '</div>' +
    '<div class="intro">'+esc(lang==="en"?d.intro:d.intro_zh)+'</div>' +
    '<div class="segs">'+segs+'</div>' +
    '<div class="closing">'+esc(lang==="en"?d.closing:d.closing_zh)+'</div>';
}
function setLang(v){ lang = v; document.getElementById("btnEn").classList.toggle("on", v==="en"); document.getElementById("btnZh").classList.toggle("on", v==="zh"); renderDigest(DIGEST_DATA); }

function renderNews(d){ const upd = document.getElementById("upd"); if(upd) upd.textContent = fmtPT(d.updated_at);
  const g = document.getElementById("grid"); g.innerHTML = "";
  for(const t of d.teams){
    const c = document.createElement("div"); c.className = "card"; c.style.setProperty("--team", t.accent);
    const emoji = t.emoji==="Baseball"?"⚾":t.emoji==="Football"?"🏈":"🏆";
    c.innerHTML =
      '<div class="top"><div class="ico">' + emoji + '</div>' +
      '<div><div class="name">' + esc(t.name) + '</div><div class="rec">' + t.sport + ' · ' + esc(t.record) + '</div></div></div>' +
      '<div class="hline">' + esc(t.headline) + '</div>' +
      '<h3>Latest News</h3><ul class="news">' + t.latest_news.map(n =>
        '<li><a target="_blank" rel="noopener" href="' + esc(n.url) + '">' + esc(n.title) + '</a><p>' + esc(n.summary) + '</p></li>'
      ).join("") + '</ul>' +
      '<h3>Fun Facts</h3><ul class="facts">' + t.fun_facts.map(f => '<li>'+esc(f)+'</li>').join("") + '</ul>' +
      '<h3>Further Reading</h3><ul class="read">' + t.further_reading.map(f =>
        '<li><a target="_blank" rel="noopener" href="' + esc(f.url) + '"><span>'+esc(f.title)+'</span><span class="why">'+esc(f.why)+'</span></a></li>'
      ).join("") + '</ul>' +
      '<div class="oss">' + esc(t.one_sentence) + '</div>';
    g.appendChild(c);
  }
}

renderDigest(DIGEST_DATA);
renderNews(TEAMS_DATA);
</script>
