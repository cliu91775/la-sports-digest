<style>
  :root{
    --bg:#0b0e14; --panel:rgba(255,255,255,.04); --panel2:rgba(255,255,255,.02);
    --line:rgba(255,255,255,.08); --fg:#edf2fa; --dim:#8a94a6;
    --radius:18px; --glow:0 0 0 1px rgba(255,255,255,.04), 0 24px 60px -30px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 500px at 20% -10%, rgba(42,111,216,.18), transparent 60%),
      radial-gradient(1000px 500px at 90% -10%, rgba(153,0,0,.14), transparent 60%),
      radial-gradient(900px 400px at 50% 110%, rgba(31,78,156,.16), transparent 60%),
      var(--bg);
    color:var(--fg); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
    padding:28px clamp(16px,4vw,64px) 64px;
  }
  header{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:26px}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{
    width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;
    background:linear-gradient(135deg,#2a6fd8,#991111);box-shadow:0 8px 30px -8px rgba(60,90,220,.6);
  }
  h1{font-size:clamp(22px,3vw,32px);font-weight:800;letter-spacing:-.02em}
  .sub{color:var(--dim);font-size:13px;margin-top:4px}
  .ticker{
    font-size:12px;color:var(--dim);padding:8px 14px;border-radius:99px;
    background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);
  }
  .ticker b{color:#7ce38b}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:20px}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;backdrop-filter:blur(14px);box-shadow:var(--glow);position:relative;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--team,#2a6fd8),transparent);
  }
  .top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .ico{
    width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;
    background:color-mix(in srgb,var(--team) 22%, transparent);
  }
  .name{font-size:18px;font-weight:800;letter-spacing:-.01em}
  .rec{font-size:11px;color:var(--team);font-weight:700;margin-top:2px}
  .hline{font-size:13px;line-height:1.5;color:var(--dim);padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);margin-bottom:16px}
  h3{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
  h3::after{content:"";flex:1;height:1px;background:var(--line)}
  .news{list-style:none}
  .news li{padding:10px 12px;border-radius:12px;margin-bottom:6px;background:var(--panel2);border:1px solid var(--line);transition:.2s}
  .news li:hover{border-color:color-mix(in srgb,var(--team) 50%, transparent);transform:translateX(3px)}
  .news a{color:var(--fg);text-decoration:none;font-weight:700;font-size:13px;display:block;margin-bottom:4px}
  .news a:hover{color:var(--team)}
  .news p{font-size:12px;color:var(--dim);line-height:1.5}
  .facts{list-style:none;display:grid;gap:6px}
  .facts li{position:relative;padding:2px 0 2px 18px;font-size:12.5px;color:var(--fg);line-height:1.55}
  .facts li::before{content:"⚡";position:absolute;left:0;top:2px;font-size:11px;filter:grayscale(.4)}
  .read{list-style:none;display:grid;gap:6px}
  .read a{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12.5px;color:var(--fg);text-decoration:none;padding:9px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
  .read a:hover{color:var(--team);border-color:color-mix(in srgb,var(--team) 50%, transparent)}
  .read .why{font-size:11px;color:var(--dim)}
  .oss{font-size:12.5px;line-height:1.6;color:var(--fg);background:linear-gradient(90deg,color-mix(in srgb,var(--team) 18%,transparent),transparent);border-left:3px solid var(--team);padding:10px 14px;border-radius:0 12px 12px 0;margin-top:16px}
  banner{display:block;text-align:center;color:var(--dim);font-size:13px;margin-top:22px}
  banner span{color:#7ce38b;animation:blink 1.5s infinite}
  @keyframes blink{50%{opacity:.3}}
  .spin{width:100%;height:100px;display:grid;place-items:center;color:var(--dim)}
  /* ---- digest ---- */
  .digest{
    background:linear-gradient(135deg,rgba(42,111,216,.12),rgba(153,0,0,.10),rgba(31,78,156,.12)),var(--panel);
    border:1px solid var(--line);border-radius:var(--radius);padding:26px;
    backdrop-filter:blur(14px);box-shadow:var(--glow);margin-bottom:22px;
  }
  .dhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;margin-bottom:14px}
  .dhead .t{display:flex;align-items:center;gap:12px}
  .mic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:linear-gradient(135deg,#2a6fd8,#991111)}
  .dhead h2{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .dhead .meta{color:var(--dim);font-size:12px;margin-top:3px}
  .langs{display:flex;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:4px}
  .langs button{border:0;background:transparent;color:var(--dim);font-size:12px;font-weight:700;padding:6px 16px;border-radius:99px;cursor:pointer;transition:.2s}
  .langs button.on{background:linear-gradient(135deg,#2a6fd8,#1f4e9c);color:#fff}
  .intro{font-size:14px;line-height:1.65;color:var(--fg);max-width:820px;margin-bottom:18px}
  .segs{display:grid;gap:12px}
  .seg{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--panel2)}
  .seg .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .seg .row .hn{font-weight:800;font-size:14.5px}
  .seg .badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--team,#2a6fd8) 20%,transparent);color:var(--team);white-space:nowrap}
  .seg p{font-size:12.5px;line-height:1.6;color:var(--dim);margin-top:6px}
  .seg p.cls{color:var(--fg)}
  .seg .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin-top:10px;font-weight:700}
  .closing{font-size:14px;line-height:1.6;border-top:1px dashed var(--line);margin-top:16px;padding-top:14px;color:var(--fg)}
</style>
</head>

<script>
const TEAMS_DATA = {"updated_at": "2026-09-14T13:04:43.472520+00:00", "teams": [{"name": "Dodgers", "sport": "MLB", "emoji": "Baseball", "accent": "#2A6FD8", "record": "85-57", "headline": "Ohtani Placed on 15-Day IL as Dodgers Ride 8-Game Win Streak and Tucker Heats Up", "latest_news": [{"title": "Shohei Ohtani placed on 15-day IL with knee and biceps injuries", "summary": "The Dodgers finally pulled the trigger on an IL stint for Ohtani, who missed 6 of his last 7 games battling left knee soreness and right biceps discomfort. He won't be eligible to return until Sept. 23 at the earliest. Top prospect Josue De Paula was called up from Double-A in the corresponding move. Ohtani is expected to be shut down from pitching for the remainder of the season.", "url": "https://www.mlb.com/news/shohei-ohtani-out-of-september-8-lineup-vs-reds"}, {"title": "Kyle Tucker blasts grand slam in Dodgers' 8th straight win", "summary": "Tucker went 3-for-3 with a grand slam, triple, and five RBIs as the Dodgers beat the Marlins 6-2 in Miami on Friday night. The blast came off a 1-1 sweeper from Cade Gibson in the 7th inning. Blake Snell struck out eight in 5.2 innings of one-run ball, improving to 4-1 on the year.", "url": "https://dodgersnation.com/kyle-tucker-blake-snell-power-dodgers-to-eighth-straight-win/2026/09/11"}, {"title": "Freddie Freeman sits with right knee issue, but avoids IL", "summary": "Manager Dave Roberts said Freeman's right knee has been bothering him, and the Dodgers gave him a day off ahead of Thursday's travel day. Roberts indicated Freeman could be available for the weekend series in Miami. The Dodgers' leading hitter at .297, Freeman is not a candidate for an IL stint at this point.", "url": "https://www.latimes.com/sports/dodgers/story/2026-09-09/dodgers-injury-woes-grow-shohei-ohtani-freddie-freeman-game-recap"}, {"title": "Tyler Glasnow dominates in second start back from IL", "summary": "Glasnow completed seven innings of one-run ball in a 6-1 victory over the Marlins, his second outing since returning from a three-and-a-half month stint on the 60-day IL for lower back spasms. The right-hander has a 3.12 ERA in four starts since returning on Aug. 26 and is expected to start Saturday in Miami.", "url": "https://www.mlb.com/news/tyler-glasnow-return-dodgers-rotation"}, {"title": "Dodgers' magic number to clinch NL West is 7", "summary": "The Dodgers lead the NL West by 10 games over Arizona with 20 games remaining. They enter the weekend series in Miami riding an 8-game win streak and holding the No. 2 seed in the NL, four games ahead of Atlanta for the final first-round bye.", "url": "https://www.cbssports.com/mlb/news/2026-mlb-playoff-picture-standings-bracket/"}], "fun_facts": ["Kyle Tucker's grand slam on Sept. 11 was his first since 2023 and his first home run at Dodger Stadium since June 15 — a span of nearly three months.", "Ohtani has hit 30+ home runs in six consecutive seasons, tying him for the longest such streak in Dodgers history.", "The Dodgers' bullpen has posted a 3.71 ERA this season, ranking 1st in all of baseball despite dealing with injuries to Treinen, Díaz, and multiple relievers.", "Tucker's contract is a 4-year, $240 million deal — making him the highest-paid right fielder in franchise history, though his .226 average entering September was a career worst."], "further_reading": [{"title": "How Dodgers handled Shohei Ohtani's injuries raises questions", "why": "Deep dive into whether the Dodgers should have IL'd Ohtani sooner, and what his absence means for October.", "url": "https://www.latimes.com/sports/dodgers/story/2026-09-10/dodgers-handled-shohei-ohtani-injuries"}, {"title": "How Tyler Glasnow uses his sinker to neutralize lefties", "why": "Tactical breakdown of Glasnow's pitch mix and why he's a weapon for October after his return.", "url": "https://www.mlb.com/dodgers/news"}, {"title": "What do the Dodgers need to do to prep for October?", "why": "Analysis of the Dodgers' roster decisions and rotation depth heading into the postseason.", "url": "https://www.mlb.com/dodgers/news"}, {"title": "Ohtani's huge night at the plate might not even be the best news for Dodgers", "why": "Earlier this month, Ohtani hit his 30th home run but the real story was Glasnow's IL return — context on how the rotation is reassembling.", "url": "https://www.mlb.com/dodgers/"}], "one_sentence": "The Dodgers are 85-57, hold a commanding 10-game NL West lead, and are riding an 8-game win streak — but Shohei Ohtani's IL stint for knee and biceps injuries casts a shadow over October plans."}, {"name": "USC Trojans", "sport": "College Football", "emoji": "Football", "accent": "#9E1B32", "record": "3-0 (0-0 Big Ten)", "headline": "Maiava throws career-high 5 TDs as No. 12 USC tops Louisiana 49-30 to move to 3-0", "latest_news": [{"title": "USC football overpowers Louisiana-Lafayette in high-scoring bout", "summary": "Jayden Maiava threw a career-high five touchdown passes for 261 yards and King Miller ran for 128 yards as No. 12 USC beat Louisiana 49-30 to improve to 3-0. Freshman Mark Bowman caught two first-half TDs and Trent Mosley returned a punt 86 yards for a score, though Lincoln Riley called the win 'a little bit of an up-and-down win' after the defense allowed 30 points.", "url": "https://dailytrojan.com/2026/09/14/usc-football-overpowers-louisiana-lafayette-in-high-scoring-bout/"}, {"title": "USC moves up in AP Top 25 poll", "summary": "USC climbed to No. 12 in the latest Associated Press Top 25, rising two spots after its 49-30 win over Louisiana. Seven Big Ten teams landed in the poll, with USC the conference's second-highest at No. 12 behind No. 4 Indiana.", "url": "https://247sports.com/college/usc/article/usc-trojans-moves-up-associated-press-top-25-poll-289919951/"}, {"title": "'Brock Bowers 2.0,' 'Such a Freak' — CFB Fans Lose Their Mind Over USC Freshman Mark Bowman", "summary": "Five-star freshman tight end Mark Bowman went viral after hurdling two Louisiana defenders on a 35-yard catch, with fans comparing him to Las Vegas Raiders star Brock Bowers. The No. 2-ranked tight end in the 2026 class hauled in two first-half touchdown receptions in Saturday's win.", "url": "https://www.profootballnetwork.com/cfb/brock-bowers-cfb-fans-usc-freshman-mark-bowman/"}, {"title": "What Stood Out in Freshman Mark Bowman's USC Trojans Debut", "summary": "The crown jewel of USC's No. 1-ranked 2026 recruiting class started his USC career as a day-one starter against San Jose State. Analyst Landon Tengwall called Bowman 'one of the better blocking tight ends already in the Big Ten,' praising his physicality and acceleration into blocks.", "url": "https://www.si.com/college/usc/football/freshman-mark-bowman-usc-trojans-debut-what-stood-out"}, {"title": "No. 14 USC football dominates Fresno State in 39-0 victory", "summary": "USC posted its first shutout since 2024 with a 39-0 rout of Fresno State. Maiava completed 23 of 25 passes for 349 yards and three TDs in just over one half, while new defensive coordinator Gary Patterson's unit forced three turnovers and two safeties while allowing just 116 total yards.", "url": "https://dailytrojan.com/2026/09/04/no-14-usc-football-dominates-fresno-state-in-39-0-victory/"}, {"title": "USC Quarterback Jayden Maiava's Surprising Reaction to Reaching New Career High", "summary": "Despite throwing a career-high five touchdown passes and four of five TDs going to true freshmen, Maiava was unhappy with his 19-of-29 performance and was intercepted for the first time this season. The Trojans open Big Ten play at Rutgers on Sept. 19 before hosting rival Oregon on Sept. 26.", "url": "https://www.jingletree.com/usc-quarterback-jayden-maiava-s-surprising-reaction-to-reaching-new-career-high-268872.html"}], "fun_facts": ["USC shut out Fresno State 39-0, the Trojans' first blanking of an opponent since 2024, under new defensive coordinator Gary Patterson.", "Freshman Trent Mosley scored on an 86-yard punt return vs. Louisiana — his second multi-touchdown game of the season.", "Mark Bowman and Kayden Dixon-Wyatt were Mater Dei teammates and part of four true freshmen from Southern California in USC's season-opening starting lineup.", "Maiava's five touchdown passes against Louisiana marked his career high, and four of the five went to true freshmen.", "The 2026 recruiting class was ranked No. 1 nationally, headlined by five-star tight end Mark Bowman and No. 1 edge recruit Luke Wafle."], "further_reading": [{"title": "2026 USC Football Schedule - USC Athletics", "why": "Official schedule, kickoff times and TV info from the Trojans' athletic department, including the Sept. 19 Big Ten opener at Rutgers.", "url": "https://usctrojans.com/sports/football/schedule"}, {"title": "USC Trojans News, Scores and Stats 2026-27 - CBS Sports", "why": "Live season tracker with scores, Big Ten standings and the complete 2026 slate, including home showdowns with Oregon and Ohio State.", "url": "https://www.cbssports.com/college-football/teams/USC/usc-trojans/"}, {"title": "Jayden Maiava, new playmakers lead No. 14 USC to 42-26 win over San Jose State in season opener - FOX Sports", "why": "AP recap of the season opener that broke down USC's restocked roster and freshmen making their debuts around Maiava.", "url": "https://www.foxsports.com/articles/cfb/jayden-maiava-new-playmakers-lead-no-14-usc-to-4226-win-over-san-jose-state-in-season-opener"}, {"title": "Kickoff Times and TV Networks Set for First Four USC Football Games of 2026 Season - USC Athletics", "why": "Official announcement of dates, times and networks for USC's opening slate, including the Friday-night Fresno State game on FOX.", "url": "https://usctrojans.com/news/2026/5/27/kickoff-times-and-tv-networks-set-for-first-four-usc-football-games-of-2026-season"}, {"title": "USC Trojans 2026 Regular Season NCAAF Schedule - ESPN", "why": "ESPN's schedule and results page, listing USC first in the Big Ten standings with game times and  after finishing with zero tackles, sacks and QB hits — just the fourth time in 135 career games. McVay said the 49ers produced a pressure rate (19%) that was the Rams' third-lowest since 2025.", "url": "https://www.espn.com/nfl/story/_/id/49900643/rams-garrett-tackle-loss-49ers-cites-knee"}, {"title": "Donald ruled out of opener, won't travel to Australia; Week 2 is the target", "summary": "Coach Sean McVay kept the three-time DPOY home rather than fly him on a 16-hour trip, saying 'he'll be ready to go sooner rather than later.' The 35-year-old, who ended his two-year retirement Aug. 30 on a one-year, $20M (up to $30M) deal, is positioned for his 2026 debut Monday night against the Giants at SoFi Stadium.", "url": "https://www.therams.com/news/aaron-donald-feeling-good-feeling-really-good-but-still-to-be-determined-whether-he-plays-week-1-vs-49ers-in-australia"}, {"title": "Ty Simpson, Tutu Atwell and CJ Daniels among Rams' inactives for Week 1", "summary": "First-round pick Ty Simpson served as the emergency third QB behind Stetson Bennett IV, while receivers Tutu Atwell and CJ Daniels were inactive along with OL Bill Murray and TE Max Klare for the Melbourne opener against the 49ers.", "url": "https://www.therams.com/news/ty-simpson-tutu-atwell-and-cj-daniels-among-rams-inactives-for-week-1-vs-49ers-in-australia-2026"}, {"title": "Rams elevate S Tanner Ingle from practice squad", "summary": "Los Angeles officially elevated safety Tanner Ingle from the practice squad to the active roster, per the NFL transactions wire. Ingle was among the roster's final preseason cuts before re-signing to the practice squad and earning a call-up for Week 1.", "url": "https://nfltraderumors.co/rams-elevate-s-tanner-ingle-from-practice-squad/"}], "fun_facts": ["The melbourne opener drew 100,021 fans to the Melbourne Cricket Ground — the first NFL regular-season game ever played in Australia, where the Rams were technically the home team.", "Myles Garrett's empty stat line (0 tackles, 0 sacks, 0 QB hits) was only the fourth such game in his 135-career run and his first since Week 11 of 2024 — and Puka Nacua, a receiver, actually finished with more tackles than he did.", "The Rams' 27-7 loss marked the fewest points ever scored in a Matthew Stafford start and their first double-digit defeat since 2024 — after they entered the season as preseason Super Bowl favorites.", "The Rams built their 'superteam' in one wild offseason: trading Jared Verse plus 2027 first-, 2028 second- and 2029 third-round picks to Cleveland for Garrett, dealing a first-rounder to the Chiefs for CB Trent McDuffie, and coaxing Aaron Donald out of retirement.", "Everyone around the Rams — including Donald and McVay — pointed to Super Bowl LXI at SoFi Stadium in February 2027 as the goal that fueled the all-in, star-heavy roster."], "further_reading": [{"title": "49ers rout Rams 27-7 in NFL's first Australia game behind Brock Purdy's 3 TD passes", "why": "AP full game story: scoring recap, the record crowd at the MCG, and Stafford being pulled in the fourth quarter.", "url": "https://www.nbcnews.com/sports/nfl/san-francisco-49ers-los-angeles-rams-australia-nfl-result-rcna597163"}, {"title": "NFL Network: Aaron Donald unretiring to play for Rams on one-year, $20 million deal", "why": "The full breakdown of Donald's comeback, his official tryouts, and the 'new-age Fearsome Foursome' defensive line he joins alongside Garrett.", "url": "https://www.nfl.com/news/aaron-donald-unretires-rams-2026-season"}, {"title": "Rams agree to terms on trade to acquire edge Myles Garrett from Browns", "why": "Official team release on the blockbuster — Jared Verse and three draft picks to Cleveland for the back-to-back DPOY, for context on the roster built for a SoFi Super Bowl run.", "url": "https://www.therams.com/news/rams-agree-to-terms-on-trade-myles-garrett-browns"}, {"title": "Rams release official 2026 schedule", "why": "The full slate, including the Week 2 home opener vs. the New York Giants on Monday Night Football at SoFi Stadium on Sept. 21 — the likely site of Donald's debut.", "url": "https://www.therams.com/news/rams-release-official-2026-schedule"}, {"title": "Rams Injury Report | Week 1 vs. 49ers", "why": "How the Rams entered Week 1 nearly at full strength (Garrett, Nacua and the secondary healthy) — context for the injury letdowns that followed in Melbourne.", "url": "https://www.si.com/nfl/rams/onsi/rams-injury-report-myles-garrett-week-1-49ers"}], "one_sentence": "The star-laden Rams flopped in the NFL's first Australian game, falling 27-7 to the 49ers with an invisible Myles Garrett — now with 10 days to reset, a home Monday-night date with the Giants, and a poised-to-debut Aaron Donald, L.A. looks to reclaim its Super Bowl-contender billing."}]};
const DIGEST_DATA = {"updated_at": "2026-09-14T06:00:21-07:00", "title": "LA Sports Daily Digest — 15-Minute Edition", "read_time": "~15 minutes", "intro": "Good morning, LA — Sunday, September 14. The Dodgers own the best record in baseball and keep stacking wins, but now they must do it without Shohei Ohtani, shelved on the IL with his pitching season over and his bat expected back before October. Across town, USC rolls into Big Ten play at 3-0 with freshmen scoring like characters in a video game. And the Rams stagger home from Melbourne at 0-1, with ten days to get Myles Garrett's knee right and put Aaron Donald on the field. Here's your 15-minute read.", "intro_zh": "早安，洛杉磯——今天是九月十四日，星期日。道奇擁有全大聯盟最佳戰績、連勝持續累積，但接下來得在沒有大谷翔平的情況下作戰——他已進入傷兵名單，本季投球正式告終，棒子則預計在十月前歸隊。紀念體育場那邊，南加大以三勝零敗之姿邁入 Big Ten 賽程，大一新生得分如玩電玩。公羊則以零勝一敗從墨爾本踉蹌返航，還有十天時間處理 Myles Garrett 的膝蓋、並把 Aaron Donald 送進球場。以下是你的十五分鐘速覽。", "segments": [{"team": "Dodgers", "accent": "#2A6FD8", "headline": "Shohei Ohtani's pitching season is over: the IL stint settles the two-way question cold", "headline_zh": "Shohei Ohtani 投球賽季正式落幕：傷兵名單為雙刀流的疑問畫下句點", "analysis": "The question that hovered over every September day in Los Angeles finally got an answer on Saturday. The Dodgers placed Shohei Ohtani on the 15-day injured list, backdated to Sept. 8, with left knee soreness and right biceps discomfort — the ailments that had kept him out of six of his last seven games. The team confirmed what had become increasingly obvious: he will not pitch again in 2026.\n\nIn a sense, the move had been brewing for a week. Ohtani's knee flared first, then the biceps in his throwing arm began barking, and the Dodgers chose rest over risk day after day until the missed games stopped making untreated patience look prudent. It's easy to forget how extraordinary the load has been: playing the full schedule while building up to throw. This season he still hit his 30th home run — a sixth straight 30-homer campaign that ties the longest such streak in Dodgers history — all while his arm and knee were degrading underneath.\n\nThe pitching shutdown simplifies the October math even as it deflates the dream. From the moment he signed, the tantalizing possibility was Ohtani pitching in a postseason. We'll never know what version of that awaited; instead the playoff rotation is now defined by Yamamoto, Glasnow, Snell and Skubal — championship-caliber, if not the fantasy version. The bullpen remains the league's best (3.71 ERA), which softens the blow, but it is a dent in the ceiling.\n\nThe silver lining is his bat. The club expects Ohtani to return as a hitter before the postseason begins, with a target date in late September, and in the meantime Josue De Paula, the 21-year-old called up from Double-A, gets the DH at-bats that are the most important reps in baseball right now. It is a made-for-October audition for a young man who missed nearly three months this summer with an injury of his own.\n\nMy analyst take: the timing was actually the cautious part of the equation. With a 10-game lead in the NL West and a magic number of 7, the Dodgers could afford the patience most contenders can't. The real critics — and the L.A. Times has raised fair questions — will ask whether the two-way experiment pushed Ohtani to the IL in the first place, and whether the club could have seen this earlier. Either way, October is now simpler: a 26-man roster, no DH-for-a-pitcher paradox, and a superstar told to only hit.", "analysis_zh": "懸在所有洛杉磯球迷頭上的問題，終於在週六有了答案。道奇將大谷翔平放入十五日傷兵名單，追溯至九月八日，原因是左膝痠痛與右肱二頭肌不適——正是讓他近七場缺陣六場的傷勢。球團並證實了那份日益明顯的事實：他不會再於二〇二六年投球。\n\n從某種角度看，這決定已經醞釀了一週。先是膝蓋復發，接著他投球手臂的肱二頭肌開始抗議，道奇一天天地選擇休息而非冒險，直到缺賽場數讓「繼續忍耐」看起來不再明智。我們很容易忘記這份負擔有多麼沉重：一邊打滿賽程、一邊為投球準備。這個賽季他仍轟出第三十號全壘打——連續六季至少三十轟，追平道奇隊史最長紀錄——而同時間他的手臂與膝蓋已在下滑。\n\n投球終止讓十月的計算變簡單，卻也戳破了那個夢想。從他加盟的那一刻起，最誘人的可能性就是大谷在季後賽登板。我們永遠不會知道那會是什麼光景；如今的季後賽輪值由 Yamamoto、Glasnow、Snell 與 Skubal 定義——已經是冠軍等級，只是比不上幻想版本。牛棚仍是全聯盟最佳（3.71 防禦率），緩解了衝擊，但球隊的天花板確實被削去一角。\n\n好消息是他的棒子。球團預期大谷能在季後賽開打前以打者身分歸隊，目標時間落在九月底；在他缺陣期間，從 2A 拉上來的二十一歲新秀 Josue De Paula 承接這些當今棒壇最重要的 DH 打席。這是為一位今年夏天自己也曾受傷缺陣近三個月的年輕人，精心打造的十月試鏡。\n\n我的分析：時間點的選擇其實是最謹慎的環節。手握國聯西區十場勝差、魔術數字七，道奇負擔得起多數競爭者負擔不起的耐心。真正的批評者——《洛杉磯時報》也提出了合理的問題——會追問雙刀流實驗是否根本就是讓大谷進傷兵名單的元兇，以及球團是否該更早發現。無論如何，十月如今更加單純：二十六人名單、沒有「投手該不該代打」的難題，以及一位只需要專心打擊的超級球星。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Tucker's grand slam powers an 8-game streak — and a September turnaround no one saw coming", "headline_zh": "Tucker 滿貫砲推升八連勝——九月翻轉更是出乎所有人意料", "analysis": "The Dodgers arrived in Miami on a heater and kept it burning Friday. Kyle Tucker went 3-for-3 with a grand slam and five RBI as Los Angeles beat the Marlins 6-2 for its eighth straight win — a season high. It was the kind of night the front office envisioned when they made Tucker the highest-paid right fielder in franchise history on a four-year, $240 million deal.\n\nThe numbers tell a redemption story. Tucker's batting average entering September was .226, a career worst, and his first season in L.A. was more struggle than swagger. The grand slam was his first since 2023 and his first home run since June 15, breaking a three-month drought. For a lineup built to be overwhelming, Tucker's slow march back toward his Houston MVP form is the quiet engine of this streak.\n\nThe swing is coming back on schedule, which is exactly what the Dodgers need with Ohtani out of the lineup. When a superstar vanishes from the middle of a batting order, the other stars must raise their own ceilings. Tucker, for the first time since July, looks like he's swinging for that.\n\nBlake Snell was nearly as important: five and two-thirds innings, one run, eight strikeouts, improving to 4-1. Between him, Glasnow, Yamamoto and Skubal, the Dodgers now have four starters capable of a shutdown postseason start. The rotation's reassembly is the larger story this streak is currently hiding.\n\nMy analyst take: an 8-game streak with a compromised lineup is the definition of a complete team. This is not a group leaning on one name — it's the bullpen holding, the bench contributing, and a $240 million right fielder finally justifying the sticker price. If Tucker keeps hitting like this, the Ohtani-IL edition of this Dodgers team might not miss a beat.", "analysis_zh": "帶著連勝氣勢來到邁阿密的道奇，週五延續這股火力。Kyle Tucker 繳出三支三、一支滿貫砲與五分打點，率隊以六比二擊敗馬林魚，拿下本季最長的八連勝。這正是球團在與 Tucker 簽下四年二億四千萬美元、讓他一躍成為隊史最高薪右外野手的那一刻所設想的夜晚。\n\n數字訴說的是救贖故事。Tucker 進入九月時打擊率僅 .226，生涯最差，在 LA 的第一季掙扎多於風光。這支滿貫砲是他自二〇二三年以來的首支，也是他六月十五日以來首度開轟，終結了三個月的空窗。對一支志在碾壓的陣容而言，Tucker 朝休士頓 MVP 狀態的緩步回歸，正是這波連勝安靜的引擎。\n\n他的揮棒正按進度回溫，這正是少了 Ohtani 的道奇最需要的。當一位超級巨星從打線中心消失，其他球星就必須自我拉高天花板。而 Tucker——自七月以來首度——看起來又在為此揮棒。\n\nBlake Snell 幾乎同樣關鍵：五局又三分之二、只失一分、八次三振，戰績推進至四勝一敗。在他與 Glasnow、Yamamoto、Skubal 之間，道奇如今擁有四名足以主宰季後賽先發的投手。輪值的重新集結，才是這波連勝背後更大的故事。\n\n我的分析：在被傷兵侵蝕的陣容下打出八連勝，正是「完整球隊」的定義。這支隊伍不依賴單一名字——牛棚守成、板凳建功、身價二億四千萬的右外野手終於對得起標籤。如果 Tucker 繼續這樣打，少了 Ohtani 的道奇說不定一點都不會掉速。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Glasnow's second start back looks October-ready: seven innings, one run, and a 3.12 ERA", "headline_zh": "Glasnow 回歸第二戰已是十月規格：七局失一分、防禦率 3.12", "analysis": "The win streak's arms race has a new entrant. Tyler Glasnow spun seven innings of one-run ball in a 6-1 win over the Marlins — his second start since returning from a three-and-a-half-month stint on the 60-day IL for lower back spasms. In four starts since his Aug. 26 return, the right-hander owns a 3.12 ERA.\n\nContext: three and a half months is a lifetime on a pitcher's arm, and the first start back — however promising — was always going to be a test. The second became a statement. Seven innings. One run. And he is only going to lengthen from here. Glasnow is scheduled to start again Saturday in Miami, which, if all goes well, lines him up for the final push of the regular season and presumably a playoff assignment.\n\nWhat makes Glasnow so dangerous in October is the profile: a power arm who attacks hitters rather than nibbles, with a sinker shown to neutralize lefties. In a rotation with Snell on the left and Yamamoto on the right, Glasnow is the vertical threat — the guy who can win a game on pure stuff.\n\nThe rebuilding of this rotation has been the stealth storyline all month. Skubal arrived at the deadline, Sasaki is building back, Yamamoto is throwing like an ace, and now Glasnow is stacking quality outings. The Dodgers' October ceiling was always going to be set by starting-pitching depth, and that depth is finally whole.\n\nMy analyst take: don't read too much into a 3.12 ERA — read the health. The scary version of this rotation is the one where every starter reaches October on schedule, and Glasnow was the biggest question mark. Two starts in, he has answered the first two questions with ease. It is the strongest sign yet that the Dodgers might enter the postseason with the deepest staff in baseball.", "analysis_zh": "這波連勝的投手軍備競賽來了新參賽者。Tyler Glasnow 在六比一擊敗馬林魚的比賽中繳出七局只失一分的內容——這是他自因下背痙攣進入六十日傷兵名單三個半月後，回歸的第二場先發。自八月二十六日歸隊以來的四場先發，這位右投防禦率 3.12。\n\n背景是：三個半月對投手手臂來說是一段漫長歲月，回歸首戰無論多亮眼，都只能是試探。第二場則成了宣言：七局、失一分，而且他只會愈拉愈長。Glasnow 預計週六在邁阿密再次先發，若一帆風順，他正好進入例行賽尾聲的衝刺軌道，大概也預定了一張季後賽門票。\n\n讓 Glasnow 在十月如此危險的，是他的型態：一位用純粹力量壓制打者、而非與之周旋的火力型投手，還有一顆能壓制左打的伸卡球。在 Snell、Yamamoto 分踞左右的輪值中，Glasnow 就是縱向的壓迫——用 stuff 獨力贏下一場比賽的那種人。\n\n這套輪值的重建是整個月的隱形主線。Skubal 在交易大限抵達、Sasaki 復健中、Yamamoto 投出王牌身手，如今 Glasnow 開始堆積優質先發。道奇的十月天花板，向來由先發投手深度決定，而這份深度終於完整。\n\n我的分析：別過度解讀 3.12 防禦率——要看的是健康。這套輪值最恐怖的版本，是每位先發都準時在十月就位，而 Glasnow 曾是最大的問號。兩場先發下來，他輕鬆回答了前兩個問題。這是最強烈的訊號：道奇可能以全大聯盟最深的先發輪值進軍季後賽。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Freeman's knee gets a day off — and the Dodgers' best hitter avoids the IL", "headline_zh": "Freeman 的膝蓋休一天——道奇最強打者閃過傷兵名單", "analysis": "In a month defined by injuries, the Dodgers quietly delivered their best news of the week: Freddie Freeman is not going on the injured list. The club's leading hitter at .297 sat out Wednesday with right knee soreness, the day before the team's travel day to Miami, and manager Dave Roberts indicated he could be available for the weekend series.\n\nOn the surface, a routine rest day. In the context of this season, it is meaningful. The Dodgers placed one superstar on the IL this weekend, gave another — Freeman — a maintenance day, and still hold baseball's best record. The margin of error that allows that kind of patience is a luxury, and Roberts knows exactly when to use it.\n\nFreeman is 36 and playing more games than a first baseman of his vintage should necessarily play. The knee has been a nuisance, but the decision to rest rather than IL suggests the Dodgers believe he can manage it through October with proactive days off.\n\nThis is also a reminder of what the lineup is missing with Ohtani out. Freeman has been the team's most consistent hitter all year. If the DH spot is now compromised while Freeman is compromised too, the batting order becomes a different animal.\n\nMy analyst take: this is the report the Dodgers wanted. IL decisions in September are about October — a 15-day stint now could linger into the playoffs. By keeping Freeman active and simply managing his workload, the Dodgers are betting his knee holds up. It is the same bet they made on Glasnow, and so far the medical staff is winning them both.", "analysis_zh": "在一個被傷病定義的月份裡，道奇低調地送出了本週最佳消息：Freddie Freeman 不會進傷兵名單。陣中打擊率最高（.297）的他週三因右膝痠痛休息一天，正值球隊前往邁阿密的移動日之前，總教練 Dave Roberts 表示他有機會在週末系列賽上場。\n\n表面上看，這是普通的輪休。但放在本季脈絡，意義重大。道奇這個週末把一位超級巨星放進傷兵名單、給另一位（Freeman）安排保養日，卻仍握有全大聯盟最佳戰績。容許這種耐心的犯錯空間是奢侈——而 Roberts 懂得何時使用。\n\nFreeman 已經三十六歲，打著比他這個年紀的一壘手「正常該打」更多的比賽。膝蓋一直是小小的困擾，但選擇休息而非傷兵名單，意味球團相信他能在主動安排休息日的情況下，把這個膝蓋撐到十月。\n\n這同時提醒我們，少了 Ohtani 的打線缺了什麼。Freeman 整季都是球隊最穩定的打者。如果 DH 位置已受影響、Freeman 又帶著膝傷，這條打線就完全不一樣了。\n\n我的分析：這是道奇最想看到的報告。九月的傷兵名單決定都是為了十月——現在動十五日 IL，可能拖進季後賽。讓 Freeman 維持出賽、只做工作量的管理，代表球團賭他的膝蓋撐得住。這是他們對 Glasnow 下過的同一注，而到目前為止醫療組兩邊都贏了。"}, {"team": "Dodgers", "accent": "#2A6FD8", "headline": "Magic number 7: the West is all but won, so the Dodgers chase a first-round bye", "headline_zh": "魔術數字 7：西區幾乎到手，道奇轉而爭取首輪輪空", "analysis": "The math has turned ceremonial. Heading into the Miami series, the Dodgers' magic number to clinch the NL West is 7, and their lead over Arizona is 10 games with 20 to play. That is not a race anymore; that is a countdown. The real September objective sits elsewhere.\n\nThe Dodgers enter the weekend as the No. 2 seed in the National League, four games ahead of Atlanta for the final first-round bye. That is the number that actually matters. A bye buys rest, reset, and the luxury of skipping a round — fertilizer for a rotation that is only now assembling.\n\nThis is where the Ohtani IL decision and the rotation's health converge. The Dodgers can use a bye to give Ohtani extra recovery time toward his hitting return, to line up Glasnow, Snell, Yamamoto and Skubal, and to let a jumbled bullpen find its pegs. Every scheduled day of rest is an asset.\n\nThe bullpen deserves a special note: despite injuries to Treinen, Díaz and others, it posts a 3.71 ERA — best in baseball. That is the quietly dominant unit that makes losing a player like Ohtani survivable in the short term.\n\nMy analyst take: with 20 games to play and a division all but banked, the Dodgers can gamble for the bye and rest winners. The next ten days are less about winning the division than about arriving at a first-round bye, in order and healthy. If they manage that — with a returning Ohtani bat and a full rotation — this is the best-positioned Dodgers team in years.", "analysis_zh": "這個數學題已經變成儀式。進入邁阿密系列賽前，道奇封王國聯西區的魔術數字是七，對亞利桑那的領先是十場、剩二十場賽事。那不再是競爭，而是倒數。九月真正的目標在別處。\n\n道奇以國聯第二種子之姿進入週末，領先亞特蘭大四場、爭取最後一張首輪輪空門票。那才是真正重要的數字。輪空換來休息、調整與跳過一輪的奢侈——對一套剛剛才集結完成的輪值而言，正是最好的肥料。\n\n這正是 Ohtani 傷兵名單決定與輪值健康交會之處。道奇可以用輪空為 Ohtani 爭取更多打擊回歸的恢復時間，為 Glasnow、Snell、Yamamoto、Skubal 排好順序，也讓一套紊亂的牛棚找到定位。日曆上每一個休息日都是資產。\n\n牛棚值得一筆特別註記：儘管 Treinen、Díaz 等人傷缺，這套牛棚仍繳出全大聯盟最佳的 3.71 防禦率。正是這支低調稱霸的部隊，讓道奇短暫失去一位像 Ohtani 這種等級的球星也能存活。\n\n我的分析：剩二十場比賽、分區勝券在握，道奇可以為了輪空與休息盡情機動調度。接下來十天與其說是在贏得分區，不如說是準時、健康地抵達首輪輪空。如果做到——加上歸隊的 Ohtani 棒子與完整輪值——這會是道奇近年最有籌碼的一支隊伍。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "Career-high five TDs, 3-0, and a No. 12 ranking — Jayden Maiava isn't satisfied yet", "headline_zh": "生涯新高五次達陣、三勝零敗、升上第 12 名——Jayden Maiava 仍不滿足", "analysis": "The box score was a masterpiece; the quarterback was not impressed. Jayden Maiava threw a career-high five touchdown passes as No. 12 USC beat Louisiana 49-30 to move to 3-0, finishing with his best line of the season: 261 yards and five scores. He also threw his first interception of the year and completed just 19 of 29.\n\n\"A little bit of an up-and-down win,\" Lincoln Riley called it — a phrase that doubles as a tribute to his own standards. The offense hummed: King Miller ran for 128 yards and freshman Mark Bowman caught two first-half touchdowns. But the defense allowed 30 points, the most this season, and the game never felt as comfortable as the 19-point margin suggests.\n\nThe most interesting reaction came from Maiava himself. Reporters chronicled his surprisingly sour mood after a career day — four of his five touchdowns went to true freshmen, and still he chased the misses. That is the profile of a quarterback who measures himself against October, not September.\n\nAfter three games, the No. 12 Trojans have separated soft competition from something real: a quarterback averaging video-game efficiency, a freshman class scoring at will, and a defense that is dominant in first halves and leaky in the middle of second-half games.\n\nMy analyst take: 3-0 was the required minimum for this team's Playoff ambitions, and it delivered. The concern is scripted — the lopsided wins and this one all showed different teams in the first and second halves. Big Ten play, at Rutgers on Sept. 19, will tell us which one is real.", "analysis_zh": "成績單是傑作，四分衛本人卻不領情。Jayden Maiava 投出生涯新高的五次傳球達陣，率第 12 名南加大以四十九比三十擊敗 Louisiana、拿下三勝零敗，繳出本季最佳帳面：二百六十一碼、五記達陣。但他也吞下本季首度被抄截，二十九傳僅十九中。\n\n「一場有點起伏的勝利，」Lincoln Riley 如此形容——這句話同時也褒揚了他自己的標準。進攻運轉流暢：King Miller 衝出百二十八碼，大一菜鳥 Mark Bowman 上半場兩度接球達陣。但防守失掉三十分，是本季最多，比賽也從未像十九分差距那般安穩。\n\n最有趣的回應來自 Maiava 本人。記者紀錄了他拿下生涯日之後出人意料地悶悶不樂——五次達陣有四次送給大一新生，他卻仍在檢討失誤。這就是以十月為標竿、而非滿足於九月的四分衛雛形。\n\n三場比賽過後，第 12 名特洛伊人已把軟柿子賽程與真材實料區分開來：一位效率如電動的四分衛、一支得分如入無人之境的大一新生群、以及一套上半場宰制、下半場中段偶爾漏水的防守。\n\n我的分析：三勝零敗是這支志在季後賽球隊的最低要求，而它達標了。隱憂有章可循——兩場大勝與這一場都顯示，上半場與下半場是兩支不同的球隊。九月十九日在 Rutgers 展開的 Big Ten 賽程，會告訴我們哪一支才是真的。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "'Brock Bowers 2.0': Mark Bowman's viral debut has the country asking who he is", "headline_zh": "「Brock Bowers 2.0」：Mark Bowman 爆紅處女秀讓全美問他是誰", "analysis": "College football found its new viral star on Saturday — and he wears cardinal and gold. Freshman tight end Mark Bowman caught two first-half touchdowns in USC's 49-30 win, but the play everyone saw was his 35-yard catch in which he hurdled not one but two Louisiana defenders, landing on his feet and rumbling downfield.\n\nThe comparisons came fast and furious: fans invoked Las Vegas Raiders star Brock Bowers, and \"Brock Bowers 2.0\" began trending across social media. Bowman, the No. 2-ranked tight end in the 2026 class and the crown jewel of USC's No. 1-ranked recruiting class, was supposed to be good. Nobody predicted week-three viral.\n\nThe tape supports the hype. Analysts have called him one of the better blocking tight ends in the Big Ten already — a phrase usually reserved for juniors, not true freshmen. His physicality and acceleration into blocks were singled out after his day-one start against San Jose State; the hurdle merely made it visible to everyone else.\n\nThe context matters: USC has leaned on freshman pass-catchers all month. Bowman, Trent Mosley, Kayden Dixon-Wyatt and others have started from game one. That Maiava's first four touchdown passes of the season went to freshmen speaks to how central this class already is.\n\nMy analyst take: \"first since\" comparisons get thrown around lightly, but Bowman's week-two-and-three production is different. He is not a gadget player; he is a featured tight end getting red-zone targets in the biggest moments. If the Big Ten's best coverage units cannot solve the hurdle, USC has found its matchup nightmare — exactly the player the gauntlet ahead demands.", "analysis_zh": "大學美式足球在週六找到了新的明星等級爆紅案例——而他穿紅金色。大一近端鋒 Mark Bowman 在四十九比三十的勝仗上半場接球達陣兩次，但全場最令人難忘的是那記三十五碼接球：他一連飛躍兩名 Louisiana 防守球員，落地後繼續向前狂奔。\n\n比較來得又快又猛：球迷搬出拉斯維加斯突擊者的明星 Brock Bowers，「Brock Bowers 2.0」開始在社群媒體上發酵。排名二〇二六屆第二的近端鋒、南加大全國排名第一收穫班的掌上明珠，Bowman 理應很出色。但沒人預料到第三週就紅遍全美。\n\n比賽影片撐得起這些吹捧。分析師表示他已名列 Big Ten 最佳阻截近端鋒之一——這種評價通常屬於高年級生，而非大一菜鳥。他在對 San Jose State 首戰先發時的對抗身體素質與加速撞擊能力都被點名；這次飛躍只是讓更多人看見。\n\n背景很重要：南加大整個月都在仰賴大一接球員。Bowman、Trent Mosley、Kayden Dixon-Wyatt 等人從第一場就擔綱先發。Maiava 本季前四次傳球達陣都送給大一新生，足以說明這批新秀在陣中的地位。\n\n我的分析：「繼某人以來首位」的比較常被順口拋出，但 Bowman 第二、三週的產量截然不同。他不是功能型球員，而是在最關鍵時刻於紅區獲得目標的頭號近端鋒。如果 Big Ten 最佳的防守後衛群也解不了那道飛躍，南加大就找到了自己的對位夢魘——正是接下考驗最需要的球員。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "Trent Mosley's 86-yard punt return caps a freshman takeover of USC's special teams", "headline_zh": "Trent Mosley 八十六碼棄踢回攻達陣，新生全權接管南加大特勤部隊", "analysis": "Trent Mosley turned the Louisiana game's turning point into a 15-second highlight. The freshman returned an 86-yard punt for a touchdown in USC's 49-30 win — his second multi-touchdown game of the season — joining his receiving scores on a day when the returns tilted the field.\n\nSpecial teams have quietly become a USC identity under this freshman class. Mosley's return, Bowman's receiving, the coverage units — the Trojans have won the hidden-yardage battle in all three weeks. Against Fresno State they even produced two safeties defensively, another way a game gets won without the offense touching the ball.\n\nMosley himself is a subject: he is now the first USC freshman since Drake London in 2019 with back-to-back 100-yard receiving games, a number that matters because London's sophomore season served as his first-round audition. Mosley is doing it as a freshman.\n\nThe special-teams bump matters more at USC than most places because it gives the offense short fields and the defense momentum — exactly the edge a team playing through a brutal Big Ten schedule will need.\n\nMy analyst take: hidden yardage is the most underrated determinant in college football, and no team in LA is winning it more often right now than USC. Mosley returning punts in close games is an advantage opponents will now game-plan around. That is the definition of a genuine weapon.", "analysis_zh": "Trent Mosley 把 Louisiana 之戰的轉捩點變成十五秒的精華片段。這位大一新生在四十九比三十的勝仗中交出八十六碼棄踢回攻達陣——他本季第二場多達陣比賽——在回攻與接球同場建功、徹底扭轉場上氣勢的一天。\n\n特勤組在不知不覺中已成南加大這批新生軍團的招牌。Mosley 的回攻、Bowman 的接球、cover 組的表現——特洛伊人三週來都贏下了隱藏碼數之戰。對 Fresno State 甚至防守端製造兩次 safety，這又是一種不用持球就能贏球的方式。\n\nMosley 本身是話題：他成了繼二〇一九年 Drake London 以來，首位連兩場接球破百碼的南加大新生。這個數據很重要，因為 London 的二年級賽季正是他成為首輪選秀的試鏡。而 Mosley 以大一之姿就做到了。\n\n特勤組的加成在南加大比其他地方更關鍵，因為它讓進攻端更靠近達陣區、也讓防守端氣勢更旺——這正是要在殘酷 Big Ten 賽程中奮戰的球隊最需要的邊際優勢。\n\n我的分析：隱藏碼數是大學美式足球最被低估的勝負關鍵，而此刻 LA 沒有任何球隊比南加大更常贏下它。Mosley 在緊要關頭回攻棄踢，是對手現在必須特別擬定戰術封鎖的武器。這就是真正兵器的定義。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "The 39-0 shutout was real; the 30 points at Louisiana are the small print USC must fix", "headline_zh": "三十九比零完封是真的；對 Louisiana 失三十分才是南加大必須修補的細字備註", "analysis": "Two samplings of USC's defense have produced two wildly different lab reports. First, the 39-0 blanking of Fresno State — the Trojans' first shutout since 2024 — featured Gary Patterson's new scheme forcing three turnovers and two safeties while allowing just 116 total yards. Then came Louisiana: 30 points allowed, the most of the season, including a second half that wobbled.\n\nThe pattern is worth naming: USC has outscored opponents 58-0 in first halves through three games. The defense under Patterson plays downhill, blitzes early, and ends possessions before teams find rhythm. But when opponents adjust — as Louisiana did after halftime — the group has given up chunks.\n\nPatterson's \"more bodies to the ball\" philosophy delivered the shutout and the safeties, proof of concept. But college defenses live and die on second-half adjustments, and the sudden concession of 30 points raised the loudest question of the young season: is this defense for real, or a first-half specialty act?\n\nThe answer starts Sept. 19 at Rutgers, then a home game with Oregon on Sept. 26. In the Big Ten, USC will face power-running attacks and methodical passing games that punish soft second halves. The first-half dominance is a foundation; the second-half resilience is the wall.\n\nMy analyst take: the shutout demonstrated the ceiling, Louisiana demonstrated the floor. Real teams are judged in October, and the defensive staff now knows exactly what to sharpen. The timing — a full week before Rutgers — is on their side.", "analysis_zh": "南加大防守的兩份樣本，交出兩份天差地遠的實驗報告。首先是對 Fresno State 的三十九比零完封——特洛伊人自二〇二四年以來首次完封——Gary Patterson 的新體系製造三次失誤與兩次 safety、只讓對手推進一百一十六碼。接著是 Louisiana：失掉三十分、本季最多，下半場更是搖搖晃晃。\n\n這個模式值得指名：南加大三場比賽下來，上半場以五十八比零壓倒對手。Patterson 體系下的防守壓迫式往下打、早早施壓、在對手找到節奏前就終結攻勢。但當對手如 Louisiana 在中場過後調整成功，這支防守就會被吃掉一大塊。\n\nPatterson「更多人圍堵持球者」的理念端出了完封與 safety，證明概念可行。但大學防守的生死取決於下半場調整，而突然失掉三十分，是本季最響亮的疑問：這套防守是真的，還是只會打上半場的特技表演？\n\n答案從九月十九日 Rutgers 揭曉，接著是九月二十六日主場對 Oregon。在 Big Ten，南加大將面對力量型衝球攻勢與循序漸進的傳球體系，這兩者都會嚴懲疲軟的下半場。上半場的宰制是地基；下半場的韌性才是那道牆。\n\n我的分析：完封展示了天花板，Louisiana 展示了地板。真正的球隊在十月接受評判，而防守教練團現在很清楚該磨練什麼。時間——距離 Rutgers 還有整整一週——站在他們這邊。"}, {"team": "USC Trojans", "accent": "#9E1B32", "headline": "No. 12 in the AP poll, seven Big Ten teams ranked — and a gauntlet starts Friday at Rutgers", "headline_zh": "美聯社排名升上第 12、Big Ten 七隊進榜——週五 Rutgers 之夜展開的魔鬼賽程", "analysis": "The polls finally caught up with the record. USC climbed two spots to No. 12 in the AP Top 25 after its 3-0 start, the second-highest Big Ten team on the board behind only No. 4 Indiana. Seven league teams are ranked — evidence of the conference gauntlet that awaits.\n\nThe schedule hardly waits. USC opens Big Ten play Friday night at Rutgers (Sept. 19), then hosts No. 6 Oregon on Sept. 26, a trip to defending champion Indiana follows, and No. 1 Ohio State visits the Coliseum on Oct. 31. If a college team has a demolition-derby fall, this is USC's version.\n\nThe nonconference 3-0 — San Jose State, Fresno State, Louisiana — was the required preface, but the opponents combined would not crack a Power-4 top 10. Now the opponents will be nationally ranked, on the road, in hostile stadiums, at night. This is where Lincoln Riley's 42-0 record when allowing 20 or fewer points becomes the single most important number on the roster.\n\nFor Maiava, this is the real audition — and he has set the bar himself. He has thrown for video-game numbers while complaining about his own drop-offs. His standard, like the defense's true ceiling, is measured in November, not September.\n\nMy analyst take: No. 12 feels about right — not a playoff team today, but with perhaps the league's strongest upside argument. Win at Rutgers, and USC plants itself in contention for the conference title race before the really hard stuff. Lose, and a Playoff season dies quietly in Piscataway.", "analysis_zh": "排名終於追上戰績。南加大在美聯社 Top 25 中上升兩名至第 12，憑藉的是三勝零敗的開季，是進榜 Big Ten 球隊中的第二高，僅次於第 4 名的 Indiana。聯盟共有七隊上榜——這正是接下來魔鬼考驗的證據。\n\n賽程毫不留情。南加大週五（九月十九日）在 Rutgers 展開 Big Ten 賽程，九月二十六日主場迎戰第 6 名 Oregon，接著造訪衛冕冠軍 Indiana，十月三十一日第 1 名 Ohio State 蒞臨紀念體育場。如果大學美式足球有所謂「拆車大賽之秋」，這就是南加大的版本。\n\n非賽程的三勝零敗（San Jose State、Fresno State、Louisiana）是必備前言，但對手全部加起來也擠不進 Power 4 前十。接下來面對的是全國排名、客場、敵意滿場、夜戰。在此刻，Lincoln Riley 生涯「失分二十以下四十二勝零敗」的紀錄，成了這支球隊最重要的單一數字。\n\n對 Maiava 而言，這才是真正的試鏡——而且他自己設定了門檻。他繳出電玩等級數據，同時抱怨自己的起伏。他的標準，和防守端的真實天花板一樣，都在十一月、而非九月衡量。\n\n我的分析：第 12 名感覺恰到好處——不是今天的季後賽球隊，但論上限，也許是全聯盟最有力的論據。拿下 Rutgers，南加大會在真正的硬仗來臨前，把自己種進分區爭霸的競爭行列。輸掉的話，一個季後賽球季會安靜地葬身於 Piscataway。"}, {"team": "Rams", "accent": "#003594", "headline": "The coronation became a collapse: 49ers 27, Rams 7 in the NFL's first Australian game", "headline_zh": "加冕典禮成崩盤：NFL 澳洲首戰，49ers 以 27 比 7 擊敗公羊", "analysis": "The NFL's first regular-season game in Australia was supposed to be a Rams party. Instead, 100,021 fans at the Melbourne Cricket Ground watched the \"superteam\" get dismantled 27-7 by the 49ers — a record crowd for the game south of the equator, and a brutal opening line for the season.\n\nBrock Purdy threw three touchdowns to Mike Evans, Demarcus Robinson and Deebo Samuel, and San Francisco scored on five of nine possessions. The Rams' only score was Kyren Williams' 5-yard run for a brief second-quarter lead. Reigning MVP Matthew Stafford threw no touchdowns and was pulled late in the fourth quarter.\n\nThe numbers are the story: seven points is the fewest in any Stafford start since he joined the Rams, and the 20-point margin is the team's largest double-digit defeat since 2024. A group that spent the entire offseason adding Garrett, Donald and McDuffie to chase Super Bowl LXI at SoFi looked, for 60 minutes, like a team that had never played together.\n\nFatigue is the easy excuse; McVay won't take it. The Rams landed roughly 28 hours before kickoff versus San Francisco's full week in Melbourne, but when the head coach won't reach for that, you know he sees deeper issues. A 19% pressure rate allowed — the Rams' third-lowest since 2025 — tells the real story.\n\nMy analyst take: one game famously does not a season make — but this was not a fluke, it was a pattern on full display. Great rosters don't beat themselves; this one did from the first quarter on. The fix starts Monday night in L.A., where the city's patience for \"superteam\" excuses runs thin.", "analysis_zh": "NFL 首場在澳洲的例行賽本該是公羊的派對。但墨爾本板球場湧入的十萬零二十一名觀眾，眼睜睜看著這支「超級戰隊」以二十七比七被 49ers 拆解——這是美式足球在南半球例行賽的觀眾人數新高，也是本季殘酷的開場白。\n\nBrock Purdy 三次傳球達陣分別送給 Mike Evans、Demarcus Robinson 與 Deebo Samuel，舊金山九次攻勢得分五次。公羊唯一得分是 Kyren Williams 的五碼衝刺達陣，換來第二節的短暫領先。衛冕 MVP Matthew Stafford 未有傳球達陣，第四節尾聲被換下場。\n\n數字本身就是故事：七分是 Stafford 加盟公羊以來任何一次先發的最少得分，二十分的差距是球隊自二〇二四年以來最大幅度的雙位數敗仗。這支整個休賽季為了追逐在 SoFi 舉行的超級盃 LXI、接連補進 Garrett、Donald、McDuffie 的陣容，在六十分鐘裡看起來像一支從未合練過的球隊。\n\n疲勞是最容易的藉口；McVay 不接。公羊在開球前約二十八小時才落地墨爾本，而舊金山提前整整一週抵達。但當總教練不願拿這個當理由，就知道他看到了更深的問題。百分之十九的被施壓率——公羊自二〇二五年以來第三低——才是真正的故事。\n\n我的分析：眾所周知，一場比賽不成季——但這不是僥倖，而是問題的全貌呈現。偉大的陣容不會自己打敗自己；這支從第一節起就這麼做了。解藥從週一晚在洛杉磯開始，而這座城市對「超級戰隊」藉口的耐心，正在迅速耗盡。"}, {"team": "Rams", "accent": "#003594", "headline": "McVay offers zero excuses: 'Sometimes sports can humble you'", "headline_zh": "McVay 拒絕藉口：「運動有時會帶給你謙卑」", "analysis": "Sean McVay has never been a coach who hides behind travel schedules, and Australia didn't change that. After the 27-7 loss — LA's first double-digit defeat since 2024 and the fewest points in any Stafford start — McVay stood at the podium and offered exactly one thing: honesty. \"Sometimes sports can humble you, and today was one of those days. I make no excuses.\"\n\nThe specific non-excuse matters more than the sentiment. The Rams arrived in Melbourne roughly 28 hours before kickoff, a fraction of San Francisco's full week of acclimation. When his first questioner raised it, McVay swatted it away — the schedule, to him, was not why the Rams lost; the Rams were why the Rams lost.\n\nHe pushed the same accountability onto performance: the 19% pressure rate, no offensive rhythm, a defense and special teams that gave nothing on hidden yards. This is the coaching identity the roster was built around — a head coach who takes the hit publicly so the room can move forward privately.\n\nThe risk is that honesty without diagnosis is just talking. McVay's message to a locker room full of All-Pros and MVPs is that Melbourne does not define them; the next practice does. Ten days until the Giants on Monday Night Football at SoFi is an eternity in NFL time.\n\nMy analyst take: \"I make no excuses\" is precisely what a superteam needs to hear — it sets the standard for everyone, including the superstars. McVay's ability to absorb the shock publicly while the roster quietly recalibrates will determine whether this is a blip or the beginning of a pattern.", "analysis_zh": "Sean McVay 從來不是會拿行程表當擋箭牌的教練，澳洲之行也沒有改變這一點。在二十七比七的敗仗——LA 自二〇二四年以來首度雙位數失利、Stafford 先發以來最少得分——之後，McVay 站在麥克風前只交付一樣東西：坦誠。「運動有時會帶給你謙卑，今天就是其中一天。我不打任何藉口。」\n\n具體的「不找藉口」比情緒更有分量。公羊在開球前約二十八小時落地墨爾本，足足比舊金山一整週的適應期少。當第一位提問者提起此事，McVay 一把揮開——在他眼裡，行程不是輸球的原因；公羊自己才是。\n\n他把同樣的當責推向表現：百分之十九的被施壓率、沒有進攻節奏、防守與特勤在隱藏碼數上一無所獲。這就是這支陣容圍繞他打造其執教風格的教練本體——在公開場合接下重拳，讓休息室得以在私下向前。\n\n風險在於，沒有診斷的坦誠只是空談。McVay 要傳遞給這間塞滿全明星與 MVP 的休息室的是：墨爾本不定義你們，下一次練球才是。離巨人隊的週一之夜在 SoFi 還有十天，在以 NFL 時間計量的世界裡猶如永恆。\n\n我的分析：「我不打藉口」正是超級戰隊最需要聽到的話——它為所有人設立標準，包括超級巨星在內。McVay 公開吸收衝擊、陣容私下默默重新校準的能力，將決定這是一次小失誤，還是某個模式的開端。"}, {"team": "Rams", "accent": "#003594", "headline": "Myles Garrett's knee is not right — and his zero-tackle debut changed the Rams' math", "headline_zh": "Myles Garrett 膝蓋不對勁——零擒抱首秀改寫了公羊的算盤", "analysis": "The Ram who cost the franchise the most delivered the least on Saturday — and for once, the losing player was the most honest man on the field. Myles Garrett finished with zero tackles, zero sacks and zero QB hits in the 27-7 loss, just the fourth such game of a 135-game career and his first since Week 11 of 2024. Puka Nacua, a receiver, finished with more tackles.\n\nGarrett's explanation landed like a wire report: a lingering knee issue. \"This was the worst version of myself that I've put out there,\" he said, \"and I've got to be better.\" It was the same bone-weary admission that defined the game — the reigning Defensive Player of the Year reduced to a decoy.\n\nHere is the uncomfortable math. The Rams surrendered Jared Verse, their leading sack man last year, plus a 2027 first, 2028 second and 2029 third to get Garrett, then added Aaron Donald on top. One game in, the marquee edge rusher generated five pressures but could not finish a play, and the defense allowed pressure at its third-lowest rate since 2025.\n\nThe counterargument is patience: Garrett is 30, one game into a new scheme, playing on a knee he publicly acknowledged. Ten days off before a Monday-night home game is precisely the reset a balky joint needs. Donald, meanwhile, is positioned to debut in that same game.\n\nMy analyst take: the knee admission is the single most important sentence from Melbourne — everything the Rams did this offseason was sized to this front. If Week 1 was the knee, the fix is time. If it's more than that, the superteam's foundation has its first crack. Week 2 in L.A. answers that.", "analysis_zh": "讓球隊付出最多代價的那位公羊，週六的表現卻最少——而且難得地，輸家成了場上最誠實的人。Myles Garrett 在二十七比七的敗仗中交出零擒抱、零擒殺、零四分衛撞擊，這是他一百三十五場生涯中僅第四次，也是自二〇二四年第十一週以來的第一次。接球員 Puka Nacua 的擒抱數都比他多。\n\nGarrett 的解釋像一則電報：揮之不去的膝傷。「這是我拿出的最糟糕版本的自己，」他說，「我必須更好。」這句疲憊到骨子裡的自白，正是整場比賽的註腳——現任年度最佳防守球員淪為一枚晃子。\n\n這裡有不舒服的算盤。公羊為了 Garrett 付出 Jared Verse——去年隊上擒殺王——外加二〇二七首輪、二〇二八二輪、二〇二九三輪選秀權，又疊上 Aaron Donald。打了一場，這張招牌衝傳王牌製造了五次施壓、卻一個 play 都沒完成，而防守的被施壓率創下自二〇二五年以來第三低。\n\n反方的論點是耐心：Garrett 三十歲，剛到新體系第一場，還公開承認膝蓋有傷。十天休整後在主場週一夜賽登場，正是痠痛關節需要的重置。同時，Donald 也預定在同一場比賽首秀。\n\n我的分析：那句膝傷自白是墨爾本最重要的一句話——公羊所有休賽季動作都是照這條防守鋒線量身打造。如果第一週敗給膝傷，解藥就是時間；如果不止於此，超級戰隊的地基就有了第一道裂痕。第二週在 LA 會給出答案。"}, {"team": "Rams", "accent": "#003594", "headline": "Aaron Donald stayed home from Melbourne. Monday night at SoFi is the real debut", "headline_zh": "Aaron Donald 留在墨爾本之外。SoFi 的週一之夜才是真正首秀", "analysis": "Here is the good news from a bad weekend: the Rams' most dominant defender wasn't in Melbourne, and that was deliberate. Aaron Donald — who ended a two-year retirement Aug. 30 on a one-year, $20 million deal worth up to $30 million — was ruled out of the opener before the trip, kept home rather than flown 16 hours for a game McVay prioritized less than Donald's ramp-up.\n\nThe 35-year-old's timeline has been precise all along: don't rush the return, point everything at October and beyond. Melbourne never made sense for a player still rebuilding game shape. What makes sense is Sept. 21 — Monday Night Football at SoFi Stadium against the Giants, in front of a home crowd that has waited two years to see him in this jersey.\n\nThe stakes for that debut just went up. The defensive front that was supposed to suffocate offenses — Donald and Garrett together, the \"new-age Fearsome Foursome\" — managed no sacks and just four QB hits in Melbourne. The pairing suddenly matters more than the marketing.\n\nMcVay repeated the same phrase: \"He'll be ready to go sooner rather than later.\" In practice, that means Week 2's Monday night, with ten full days of rest and a scripted home debut. Donald's presence changes the way offenses plan for every down.\n\nMy analyst take: in a season defined by a luxury problem, Donald is the ultimate safety valve. The Rams spent months selling this roster as a SoFi Super Bowl machine with Donald as the closing piece. One flat game later, that closing piece is worth more than the record shows — because his debut is now a statement, not just a checkbox.", "analysis_zh": "從糟糕週末裡找好消息：公羊最強的防守球員不在墨爾本，而這是刻意安排。Aaron Donald——八月三十日以一年二千萬美元（最高三千萬）合約結束兩年退休——在出發前就確定缺席開幕戰，選擇留在家中，而非為一場 McVay 認為比重低於 Donald 調整進度的比賽飛十六小時。\n\n這位三十五歲老將的時間表自始便精準：不趕著回歸，把一切指向十月與之後。對一位仍在重建比賽狀態的球員而言，墨爾本從來不在合理選項。合理的選項是九月二十一日——SoFi 體育場的週一夜賽對上巨人隊，在等了兩年想看他穿上這件球衣的主場球迷面前。\n\n那場首秀的份量剛變得更重。按理說要壓制所有進攻的防守鋒線——Donald 與 Garrett 搭檔的「新世代恐怖四人組」——在墨爾本整場只敲出四次對四分衛撞擊、沒有擒殺。這對組合突然比行銷更值得重視。\n\nMcVay 重複同一句話：「他會很快做好準備。」實務上，這意味第二週的週一夜賽，帶著整整十天休息與一場精心安排的主場首秀。Donald 的存在，會改變進攻方對每一檔攻防的規劃。\n\n我的分析：在一個由奢華煩惱定義的球季裡，Donald 是最終的安全閥。公羊花了好幾個月把這支陣容行銷成以 Donald 為收官之筆的 SoFi 超級盃機器。一場潰敗之後，這收官之筆的價值比帳面更高——因為他的首秀如今是一份宣言，而不只是一個打勾的項目。"}, {"team": "Rams", "accent": "#003594", "headline": "Ten days to reset: the all-in Rams face a must-win Monday night against the Giants", "headline_zh": "十天重整：梭哈的公羊在週一夜賽對決巨人，一場輸不得的比賽", "analysis": "NFL history is littered with teams that spent the offseason winning and the first game losing. The Rams differ: they blew up their own cap sheet — traded Jared Verse and three draft picks for Myles Garrett, dealt a first-rounder for cornerback Trent McDuffie, coaxed Donald out of retirement — to build a roster pointed at Super Bowl LXI at SoFi Stadium in February 2027. One game into that grand design, the margin for error is suddenly thinner than the balance sheet.\n\nThe good news is structural: the Rams are 0-1, but a division is not decided by games played in September. The 49ers, their most dangerous rival, already beat them — but that is one of 17, and the Rams host the Giants next Monday night in the only game that matters now.\n\nThe adjustments are specific. The offensive line allowed a pressure rate it has not seen in over a season; the defense needed Garrett to be Garrett; the special teams gave up hidden yardage. Each is fixable in ten days, which is more time than most NFL weeks allow.\n\nThe deeper question is psychological. A roster loaded with MVPs and Hall-of-Famers was built to be rightfully arrogant; Melbourne was a cold shower. The teams that win after being humbled are the ones that translate the embarrassment into practice intensity rather than excuses.\n\nMy analyst take: this is the true stress test of the superteam thesis. The Giants are beatable; the narrative around this franchise is not. A 1-1 Rams team returning to SoFi with Donald on the field and Garrett's knee behind them is the version the club sold all summer. That version can still exist — Monday night is where it's proven.", "analysis_zh": "NFL 歷史裡充斥著休賽季天下無敵、開季第一週便輸球的隊伍。公羊更特別：他們炸掉自家薪資表——以 Jared Verse 外加三枚選秀權換來 Myles Garrett、用一枚首輪籤換回角衛 Trent McDuffie、又把 Donald 從退休中勸出來——只為打造一支瞄準二〇二七年二月在 SoFi 舉行的超級盃 LXI 的陣容。這套偉大設計才打完一場，容錯空間突然比資產負債表還薄。\n\n好消息是結構性的：公羊是零勝一敗，但分區不靠九月打的比賽定生死。最危險的對手 49ers 已經贏過他們——但那只是一場，本季還有十七場，而公羊下週一晚在主場迎戰巨人，才是此刻唯一重要的比賽。\n\n調整方向很具體。進攻鋒線的被施壓率，高到整季難得一見；防守需要 Garrett 當回 Garrett；特勤組丟掉了隱藏碼數。每一項都能在十天內修復，而這比多數 NFL 週期允許的時間都多。\n\n更深的問題是心理層面。一支塞滿 MVP 與名人堂球星、為合理傲慢而打造的陣容，墨爾本那場冷水澡來得正是時候。被謙卑之後還能贏球的球隊，是那些把難堪化為練習強度、而非藉口的球隊。\n\n我的分析：這是超級戰隊論述真正的壓力測試。巨人隊打得贏；圍繞這支球隊的敘事卻打不贏。一支一勝一敗的公羊，帶著 Donald 在場上、Garrett 的膝傷在身後、回到 SoFi 的版本，正是球團賣了一整個夏天的東西。那個版本仍然存在——週一之夜就是證明它的地方。"}], "closing": "That's your Sunday pass through LA sports: the Dodgers are baseball's best team now playing without its most electrifying player, and still winning; USC is 3-0 with a freshman class worth the price of admission and a gauntlet that starts Friday night at Rutgers; and the Rams have ten days and a Monday-night stage at SoFi to prove Melbourne was the exception, not the identity. Enjoy the football, enjoy the pennant chase, and see you tomorrow.", "closing_zh": "以上就是你週日的洛杉磯運動速覽：道奇是棒壇最佳、卻在沒有最耀眼球星的情況下依然贏球的隊伍；南加大三勝零敗、新生軍團就值回票價，考驗自週五之夜展開；公羊則有十天時間與 SoFi 的週一夜賽舞台，證明墨爾本只是特例、而非本色。享受美式足球、享受爭冠之旅，我們明天見。"};
let lang = "en";
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmtPT(iso){ return new Date(iso).toLocaleString("en-US",{timeZone:"America/Los_Angeles",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"})+" PT"; }

function renderDigest(d){
  const box = document.getElementById("digest");
  if(!d || !d.segments){
    box.innerHTML = '<div style="text-align:center;color:var(--dim);padding:40px">No digest yet</div>';
    return;
  }
  const segs = d.segments.map(s=>{
    const headline = lang==="en" ? s.headline : s.headline_zh;
    const analysis = lang==="en" ? s.analysis : s.analysis_zh;
    return '<div class="seg" style="--team:'+esc(s.accent)+'">' +
      '<div class="row"><span class="hn">'+esc(headline)+'</span><span class="badge">'+esc(s.team)+'</span></div>' +
      '<div class="lbl">'+(lang==="en"?"Analysis":"分析")+'</div><p>'+esc(analysis)+'</p>' +
      '</div>';
  }).join("");
  box.innerHTML =
    '<div class="dhead">' +
      '<div class="t"><div class="mic">🎙️</div><div><h2>'+esc(d.title)+'</h2><div class="meta">' +
        esc(d.read_time || "")+' · '+fmtPT(d.updated_at)+
        ' · 繁中/EN</div></div></div>' +
      '<div class="langs">'+
        '<button id="btnEn" class="on" onclick="setLang(\'en\')">EN</button>'+
        '<button id="btnZh" onclick="setLang(\'zh\')">繁體中文</button>'+
      '</div>' +
    '</div>' +
    '<div class="intro">'+esc(lang==="en"?d.intro:d.intro_zh)+'</div>' +
    '<div class="segs">'+segs+'</div>' +
    '<div class="closing">'+esc(lang==="en"?d.closing:d.closing_zh)+'</div>';
}
function setLang(v){ lang = v; document.getElementById("btnEn").classList.toggle("on", v==="en"); document.getElementById("btnZh").classList.toggle("on", v==="zh"); renderDigest(DIGEST_DATA); }

function renderNews(d){ const upd = document.getElementById("upd"); if(upd) upd.textContent = fmtPT(d.updated_at);
  const g = document.getElementById("grid"); g.innerHTML = "";
  for(const t of d.teams){
    const c = document.createElement("div"); c.className = "card"; c.style.setProperty("--team", t.accent);
    const emoji = t.emoji==="Baseball"?"⚾":t.emoji==="Football"?"🏈":"🏆";
    c.innerHTML =
      '<div class="top"><div class="ico">' + emoji + '</div>' +
      '<div><div class="name">' + esc(t.name) + '</div><div class="rec">' + t.sport + ' · ' + esc(t.record) + '</div></div></div>' +
      '<div class="hline">' + esc(t.headline) + '</div>' +
      '<h3>Latest News</h3><ul class="news">' + t.latest_news.map(n =>
        '<li><a target="_blank" rel="noopener" href="' + esc(n.url) + '">' + esc(n.title) + '</a><p>' + esc(n.summary) + '</p></li>'
      ).join("") + '</ul>' +
      '<h3>Fun Facts</h3><ul class="facts">' + t.fun_facts.map(f => '<li>'+esc(f)+'</li>').join("") + '</ul>' +
      '<h3>Further Reading</h3><ul class="read">' + t.further_reading.map(f =>
        '<li><a target="_blank" rel="noopener" href="' + esc(f.url) + '"><span>'+esc(f.title)+'</span><span class="why">'+esc(f.why)+'</span></a></li>'
      ).join("") + '</ul>' +
      '<div class="oss">' + esc(t.one_sentence) + '</div>';
    g.appendChild(c);
  }
}

renderDigest(DIGEST_DATA);
renderNews(TEAMS_DATA);
</script>
